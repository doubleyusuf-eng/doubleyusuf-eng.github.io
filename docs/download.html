<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {

<body>

<main class="dl">

  <!-- The href is the no-JavaScript fallback. The script below sets it from
       STORE_LINKS, so that config is the one place to change store links. -->
  <a class="dl-btn" id="dl-play" href="https://play.google.com/store/apps/details?id=com.doubleyusuf.anesthesiabriefs" rel="noopener">

  <!-- iOS has no public App Store listing yet, so the beta is the only way in.
       It is a plain anchor rather than something the script creates: the link
       works with JavaScript disabled, and the script below merely promotes it
       to the primary action when the visitor is already on an iPhone. -->
  <a class="dl-beta" id="dl-testflight" href="https://testflight.apple.com/join/GbZer6HR" rel="noopener">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2a10 10 0 1 0 10 10"/><path d="M12 2a10 10 0 0 1 10 10"/><path d="m9 12 2 2 4-4"/></svg>
    <span id="dl-testflight-label">On iPhone? Join the beta on TestFlight</span>

<script>
(function () {
  'use strict';

  // ---- Store links: the only place to edit ------------------------------
  // appStoreUrl stays null until the iOS app has a real, public listing.
  // Until then testFlightUrl is the iOS route: a public TestFlight invitation,
  // open to anyone with the link, no invite e-mail needed. When the App Store
  // listing goes live, fill in appStoreUrl — it takes priority automatically and
  // this link can stay for beta testers.
  var STORE_LINKS = {
    androidPackage: 'com.doubleyusuf.anesthesiabriefs',
    googlePlayUrl: 'https://play.google.com/store/apps/details?id=com.doubleyusuf.anesthesiabriefs',
    appStoreUrl: null,
    testFlightUrl: 'https://testflight.apple.com/join/GbZer6HR'
  };

  // Every navigation this page makes must land on one of these hosts.
  // Nothing from the query string is ever used as a destination.
  // testflight.apple.com is a SEPARATE host from apps.apple.com; without it
  // isAllowedStoreUrl() rejects the beta link and the button silently does
  // nothing.
  var ALLOWED_STORE_HOSTS = ['play.google.com', 'apps.apple.com', 'testflight.apple.com'];

  // Campaign parameters forwarded to Google Play as its install referrer.
  // Allow-listed keys, conservative charset: nothing else passes through.
  var UTM_KEYS = ['utm_source', 'utm_medium', 'utm_campaign', 'utm_content', 'utm_term'];
  var UTM_VALUE = /^[A-Za-z0-9._\-]{1,100}$/;

  var ua = navigator.userAgent || '';
  var isAndroid = /Android/i.test(ua);
  var isIOS = /iPhone|iPad|iPod/i.test(ua) ||
    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1); // iPadOS reports as Mac
  // UA sniffing only picks messaging and the Android enhancement below; the
  // plain HTTPS link works on its own in every browser, known or not.
  var isMetaInApp = /Instagram|FBAN|FBAV|FB_IAB/i.test(ua);
  var isAndroidWebView = /; wv\)/.test(ua);

  function isAllowedStoreUrl(url) {
    try {
      var u = new URL(url);
      return u.protocol === 'https:' && ALLOWED_STORE_HOSTS.indexOf(u.hostname) !== -1;
    } catch (e) { return false; }
  }

  function readUtm() {
    var out = {};
    var params;
    try { params = new URLSearchParams(window.location.search); } catch (e) { return out; }
    UTM_KEYS.forEach(function (k) {
      var v = params.get(k);
      if (v && UTM_VALUE.test(v)) out[k] = v;
    });
    return out;
  }

  // The site has no analytics today, so these calls are no-ops. If gtag is
  // added site-wide later, the page starts reporting without further edits.
  function track(name, params) {
    try {
      if (typeof window.gtag === 'function') {
        window.gtag('event', name, Object.assign({ transport_type: 'beacon' }, params));
      }
    } catch (e) { /* analytics must never block the store hand-off */ }
  }

  var utm = readUtm();
  var referrer = Object.keys(utm).map(function (k) { return k + '=' + utm[k]; }).join('&');
  var referrerParam = referrer ? '&referrer=' + encodeURIComponent(referrer) : '';

  var playUrl = STORE_LINKS.googlePlayUrl + referrerParam;
  if (!isAllowedStoreUrl(playUrl)) return; // leave the static href untouched

  // Android: open the Play Store app directly. Chrome, Samsung Internet and
  // Firefox honour browser_fallback_url; Instagram/Facebook's in-app browser
  // hands intent:// to the system. Other WebViews may render an error page
  // for intent://, so they keep the plain HTTPS link.
  var useIntent = isAndroid && (!isAndroidWebView || isMetaInApp);
  var intentUrl = 'intent://details?id=' + STORE_LINKS.androidPackage + referrerParam +
    '#Intent;scheme=market;package=com.android.vending;S.browser_fallback_url=' +
    encodeURIComponent(playUrl) + ';end';

  var btn = document.getElementById('dl-play');
  var note = document.getElementById('dl-note');
  var hint = document.getElementById('dl-hint');
  var beta = document.getElementById('dl-testflight');
  var toAppStore = false;
  var toTestFlight = false;
  btn.href = playUrl;

  // The beta anchor ships visible so it survives with JavaScript off. Once the
  // App Store listing exists, an iPhone visitor should be sent there, not to a
  // beta — so hide it in that one case.
  if (beta && STORE_LINKS.appStoreUrl && isAllowedStoreUrl(STORE_LINKS.appStoreUrl)) {
    beta.hidden = true;
  }

  if (isIOS) {
    if (STORE_LINKS.appStoreUrl && isAllowedStoreUrl(STORE_LINKS.appStoreUrl)) {
      btn.href = STORE_LINKS.appStoreUrl;
      btn.querySelector('span').textContent = 'Download on the App Store';
      toAppStore = true;
      useIntent = false;
    } else if (STORE_LINKS.testFlightUrl && isAllowedStoreUrl(STORE_LINKS.testFlightUrl)) {
      // Already on an iPhone: the beta IS the download, so make it the primary
      // button and retire the duplicate secondary one.
      btn.href = STORE_LINKS.testFlightUrl;
      btn.querySelector('span').textContent = 'Join the beta on TestFlight';
      toTestFlight = true;
      useIntent = false;
      if (beta) beta.hidden = true;
      if (hint) {
        hint.textContent = 'Opens TestFlight, Apple\u2019s beta app. Install TestFlight first if you don\u2019t have it \u2014 the link will offer it.';
      }
      note.textContent = 'The iOS version is in open beta. The Android app is on Google Play.';
      note.hidden = false;
    } else {
      note.textContent = 'Anesthesia Briefs is on Google Play for Android. The iOS version is coming soon.';
      note.hidden = false;
    }
  } else if (isMetaInApp) {
    note.textContent = 'Tap below to open Anesthesia Briefs in Google Play.';
    note.hidden = false;
  }

  track('download_page_view', Object.assign({
    platform: isAndroid ? 'android' : isIOS ? 'ios' : 'other',
    in_app_browser: isMetaInApp
  }, utm));

  // One fallback timer per tap. It is cancelled as soon as the page is
  // hidden (the store app took over), and it can only ever go to the HTTPS
  // store URL — never back to this page — so there is no redirect loop.
  var fallbackTimer = null;
  function cancelFallback() {
    if (fallbackTimer) { clearTimeout(fallbackTimer); fallbackTimer = null; }
  }
  document.addEventListener('visibilitychange', function () { if (document.hidden) cancelFallback(); });
  window.addEventListener('pagehide', cancelFallback);
  window.addEventListener('blur', cancelFallback);

  if (beta) {
    beta.addEventListener('click', function () {
      track('testflight_click', Object.assign({ method: 'https', placement: 'secondary' }, utm));
    });
  }

  btn.addEventListener('click', function (e) {
    track(toAppStore ? 'app_store_click' : toTestFlight ? 'testflight_click' : 'google_play_click',
      Object.assign({ method: useIntent ? 'android_intent' : 'https' }, utm));
    if (!useIntent) return; // default navigation to the HTTPS store URL

    e.preventDefault();
    cancelFallback();
    fallbackTimer = setTimeout(function () {
      fallbackTimer = null;
      window.location.href = playUrl;
    }, 1500);
    window.location.href = intentUrl;
  });
})();
</script>
