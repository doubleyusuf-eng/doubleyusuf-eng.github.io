ction":11,"endPage":438,"questions":[{"id":"c89q1","stem":{"en":"Which action is an example of feedforward thermoregulation?","tr":"Hangi davranış ileri beslemeli sıcaklık düzenlenmesine örnektir?"},"options":[{"en":"Shivering after core temperature falls","tr":"Çekirdek sıcaklık düştükten sonra titremek"},{"en":"Sweating after core temperature rises","tr":"Çekirdek sıcaklık yükseldikten sonra terlemek"},{"en":"Vasoconstricting after a fall in core temperature","tr":"Çekirdek sıcaklık düştükten sonra vazokonstriksiyon yapmak"},{"en":"Increasing heat loss after hypothalamic warm receptors detect increased core temperature","tr":"Hipotalamik sıcak reseptörleri artmış çekirdek sıcaklığı algıladıktan sonra ısı kaybını artırmak"},{"en":"Putting on a coat before entering a cold environment","tr":"Soğuk ortama girmeden önce mont giymek"}],"answer":4,"explanation":{"en":"Feedforward control anticipates a disturbance and acts before the regulated variable changes. Shivering or sweating in response to an already detected change in core temperature are examples of feedback responses.","tr":"İleri beslemeli kontrol bir bozulmayı öngörür ve düzenlenen değişken değişmeden önce harekete geçer. Çekirdek sıcaklıktaki önceden algılanmış değişime yanıt olarak titreme veya terleme ise geri bildirim yanıtlarına örnektir."},"sourcePages":[436],"difficulty":"core"},{"id":"c89q2","stem":{"en":"What chiefly causes the rapid initial fall in core temperature after induction of general anaesthesia?","tr":"Genel anestezi indüksiyonundan sonra çekirdek sıcaklığın başlangıçta hızla düşmesinin başlıca nedeni nedir?"},"options":[{"en":"A rapid increase in evaporation as the sole initial mechanism","tr":"Tek başlangıç mekanizması olarak buharlaşmanın hızla artması"},{"en":"Redistribution of heat from core to peripheral tissues after vasodilation","tr":"Vazodilatasyon sonrası ısının merkezden periferik dokulara yeniden dağılması"},{"en":"Immediate loss of all core heat to the room by conduction","tr":"Merkezdeki ısının tamamının kondüksiyonla hemen odaya kaybolması"},{"en":"Anaesthetic-induced peripheral vasoconstriction trapping heat in the limbs","tr":"Anesteziye bağlı periferik vazokonstriksiyonun ısıyı uzuvlarda hapsetmesi"},{"en":"A sudden rise in the threshold for cold-defence responses","tr":"Soğuğa karşı savunma yanıtı eşiğinin aniden yükselmesi"}],"answer":1,"explanation":{"en":"Anaesthetic-induced vasodilation reduces the usual core-to-peripheral thermal gradient. Heat moves outward within the body, lowering measured core temperature before external heat loss becomes the dominant explanation for continued cooling.","tr":"Anesteziye bağlı vazodilatasyon normal merkez–perifer sıcaklık farkını azaltır. Isı vücut içinde perifere hareket eder ve devam eden soğumada dışarıya ısı kaybı baskın hale gelmeden önce ölçülen çekirdek sıcaklığı düşürür."},"sourcePages":[436,437],"difficulty":"applied"},{"id":"c89q3","stem":{"en":"How do general anaesthetics commonly affect thermoregulatory cold-defence thresholds?","tr":"Genel anestezikler termoregülasyondaki soğuğa karşı savunma eşiklerini genellikle nasıl etkiler?"},"options":[{"en":"They raise both thresholds so cold defence starts earlier","tr":"Her iki eşiği yükselterek soğuğa karşı savunmayı daha erken başlatırlar"},{"en":"They leave the vasoconstriction threshold unchanged while raising the shivering threshold","tr":"Titreme eşiğini yükseltirken vazokonstriksiyon eşiğini değiştirmezler"},{"en":"They narrow the range between cold and warm response thresholds","tr":"Soğuk ve sıcak yanıt eşikleri arasındaki aralığı daraltırlar"},{"en":"They lower the temperatures at which vasoconstriction and shivering are triggered","tr":"Vazokonstriksiyon ve titremenin tetiklendiği sıcaklıkları düşürürler"},{"en":"They affect only peripheral heat loss without altering central thresholds","tr":"Merkezi eşikleri değiştirmeden yalnızca periferik ısı kaybını etkilerler"}],"answer":3,"explanation":{"en":"General anaesthesia impairs central thermoregulation, delaying vasoconstriction and shivering until lower core temperatures. Neuromuscular blockade can additionally prevent the muscular expression of shivering without restoring these central defences.","tr":"Genel anestezi merkezi sıcaklık düzenlenmesini bozarak vazokonstriksiyon ve titremeyi daha düşük çekirdek sıcaklıklara kadar geciktirir. Nöromüsküler blok ayrıca bu merkezi savunmaları geri getirmeden titremenin kaslarla ortaya çıkmasını engelleyebilir."},"sourcePages":[436],"difficulty":"core"},{"id":"c89q4","stem":{"en":"Which heat-transfer mechanism describes emission of infrared energy from a warm patient to cooler surrounding surfaces without direct contact?","tr":"Sıcak hastadan daha soğuk çevre yüzeylerine doğrudan temas olmadan kızılötesi enerji yayılması hangi ısı aktarım mekanizmasıdır?"},"options":[{"en":"Radiation","tr":"Radyasyon"},{"en":"Conduction","tr":"Kondüksiyon"},{"en":"Convection","tr":"Konveksiyon"},{"en":"Evaporation","tr":"Evaporasyon"},{"en":"Metabolic thermogenesis","tr":"Metabolik termogenez"}],"answer":0,"explanation":{"en":"Radiation transfers heat by electromagnetic emission and does not require contact. Conduction requires contact, convection involves moving fluid or air, and evaporation consumes heat as liquid becomes vapour.","tr":"Radyasyon ısıyı elektromanyetik yayılımla aktarır ve temas gerektirmez. Kondüksiyon temas gerektirir, konveksiyon hareket eden sıvı veya hava içerir; evaporasyonda ise sıvı buhara dönüşürken ısı tüketilir."},"sourcePages":[436,437],"difficulty":"core"},{"id":"c89q5","stem":{"en":"Why can postoperative shivering impose a substantial physiological burden?","tr":"Ameliyat sonrası titreme neden belirgin fizyolojik yük oluşturabilir?"},"options":[{"en":"It decreases oxygen demand because muscle contraction is predominantly passive","tr":"Kas kasılması ağırlıklı olarak pasif olduğundan oksijen gereksinimini azaltır"},{"en":"It replaces metabolic heat production with redistribution alone","tr":"Metabolik ısı üretiminin yerini yalnızca yeniden dağılımla alır"},{"en":"Repeated muscle activity markedly increases heat production and metabolic demand","tr":"Tekrarlayan kas etkinliği ısı üretimini ve metabolik gereksinimi belirgin artırır"},{"en":"It lowers cardiac demand by reducing muscle oxygen extraction","tr":"Kasın oksijen ekstraksiyonunu azaltarak kardiyak gereksinimi düşürür"},{"en":"It generates heat primarily by preventing evaporation without muscle metabolism","tr":"Kas metabolizması olmadan esas olarak buharlaşmayı önleyerek ısı üretir"}],"answer":2,"explanation":{"en":"Shivering generates heat through repeated skeletal-muscle contractions that require metabolic energy. The resulting increase in oxygen demand can be difficult to meet when cardiopulmonary reserve is limited.","tr":"Titreme, metabolik enerji gerektiren tekrarlayan iskelet kası kasılmalarıyla ısı üretir. Ortaya çıkan oksijen gereksinimi artışını karşılamak, kardiyopulmoner rezerv sınırlıysa zor olabilir."},"sourcePages":[436,437],"difficulty":"applied"}]}]}</script>

'use strict';
(() => {
 const $ = id => document.getElementById(id);
 const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

 };
 let state = {lang:'tr',chapter:1,index:0,answers:{}};
 let storageAvailable = true;

 if(!['tr','en','both'].includes(state.lang))state.lang='tr';

 function openMenu(){ $('sidebar').inert=false;$('sidebar').classList.add('open');$('backdrop').classList.add('open');$('menuButton').setAttribute('aria-expanded','true');$('menuButton').setAttribute('aria-label',t('closeMenu'));document.body.style.overflow='hidden';$('search').focus();}

 function renderLabels(){document.documentElement.lang=lang();document.title=lang()==='tr'?'Physiology Studio · Fizyoloji Çalışma':'Physiology Studio · Study Companion';$('libraryLabel').textContent=t('library');$('chapterLabel').textContent=`89 ${t('chapters')}`;$('totalQuestionLabel').textContent=`445 ${t('questions')}`;$('search').placeholder=t('search');$('search').setAttribute('aria-label',t('search'));$('sectionFilter').setAttribute('aria-label',t('filter'));$('reviewLabel').textContent=t('review');$('overallLabel').textContent=t('overall');$('localNote').textContent=t('local');$('editionLabel').textContent=t('edition');$('answeredLabel').textContent=t('answered');$('educationNote').textContent=t('education');$('infoButton').setAttribute('aria-label',t('info'));$('questionNav').setAttribute('aria-label',t('questionSelect'));$('options').setAttribute('aria-label',t('options'));document.querySelectorAll('[data-lang]').forEach(b=>{const active=b.dataset.lang===state.lang;b.classList.toggle('active',active);b.setAttribute('aria-pressed',String(active));});const selected=$('sectionFilter').value||'all';$('sectionFilter').innerHTML=`<option value="all">${esc(t('all'))}</option>`+data.sections.map(s=>`<option value="${s.id}">${esc(text(s.title))}</option>`).join('');$('sectionFilter').value=selected;renderStorage();}
 function renderSidebar(){

 function bilingualHTML(pair,translationClass='option-translation'){return esc(text(pair))+(isBoth()?`<span class="${translationClass}" lang="en">${esc(pair.en)}</span>`:'');}
 function optionOrder(q){let seed=2166136261;for(const c of q.id)seed=Math.imul(seed^c.charCodeAt(0),16777619)>>>0;const order=[0,1,2,3,4];for(let i=4;i>0;i--){seed=(Math.imul(seed,1664525)+1013904223)>>>0;const j=seed%(i+1);[order[i],order[j]]=[order[j],order[i]];}return order;}

 function renderQuestion(){
  const list=activeList();if(!list.length){renderEmpty();return;}$('emptyView').hidden=true;$('studyView').hidden=false;
  index=Math.max(0,Math.min(index,list.length-1));const q=list[index],c=chapterById.get(q.chapterId),a=answerOf(q),answered=a!==null,correct=isCorrect(q);const done=mode==='review'?list.filter(isCorrect).length:list.filter(isAnswered).length;$('answeredLabel').textContent=t(mode==='review'?'corrected':'answered');
  $('sectionName').textContent=mode==='review'?t('reviewSection'):text(sectionById.get(c.section).title);$('chapterKicker').textContent=mode==='review'?t('reviewKicker'):`${t('chapter')} ${String(c.id).padStart(2,'0')} / 89`;$('chapterTitle').textContent=mode==='review'?t('reviewTitle'):text(c.title);$('chapterSubtitle').textContent=mode==='review'?t('reviewSubtitle'):isBoth()?c.title.en:'';$('chapterSubtitle').lang=isBoth()?'en':lang();$('chapterScore').innerHTML=`${done}<span>/${list.length}</span>`;

  const displayOrder=optionOrder(q);
  $('options').innerHTML=displayOrder.map((i,displayIndex)=>{const o=q.options[i];let cls='',status='';if(answered){if(i===q.answer){cls='correct-option';status='✓';}else if(i===a){cls='wrong-option';status='×';}else cls='unselected';}return `<button class="option ${cls}" data-answer="${i}" ${answered?'disabled':''} aria-label="${esc(String.fromCharCode(65+displayIndex)+'. '+text(o)+(isBoth()?'. '+o.en:'')+(answered&&i===a?'. '+t('chosen'):'')+(answered&&i===q.answer?'. '+t('right'):''))}"><span class="option-letter" aria-hidden="true">${String.fromCharCode(65+displayIndex)}</span><span class="option-copy">${bilingualHTML(o)}</span><span class="option-status" aria-hidden="true">${status}</span></button>`;}).join('');

  if(answered){$('feedback').className=`feedback${correct?'':' incorrect'}`;$('feedback').innerHTML=`<div class="feedback-heading"><span aria-hidden="true">${correct?'✓':'↗'}</span>${esc(t(correct?'correct':'incorrect'))}</div><p class="correct-answer">${esc(t('correctAnswer'))}: ${String.fromCharCode(65+displayOrder.indexOf(q.answer))}. ${bilingualHTML(q.options[q.answer])}</p><p>${esc(text(q.explanation))}</p>${isBoth()?`<p class="explanation-translation" lang="en">${esc(q.explanation.en)}</p>`:''}<div class="feedback-source"><span>${esc(t('source'))} · ${esc(t('chapter'))} ${c.id} · ${esc(t('pages'))} ${sourceLabel(q.sourcePages)}</span><span>${esc(t('pdf'))} ${sourceLabel(q.sourcePages,18)}</span></div>${mode==='review'&&!correct?`<button id="retryQuestion" class="text-button">${esc(t('retry'))}</button>`:''}`;
   if($('retryQuestion'))$('retryQuestion').onclick=()=>{delete state.answers[q.id];save();render();};
  }else{$('feedback').innerHTML='';}

  if(allDone){const n=list.filter(isCorrect).length;$('completion').innerHTML=`<div class="completion-icon" aria-hidden="true">✓</div><div><h3>${esc(t(mode==='review'?'reviewFinished':'finished'))}</h3><p>${esc(t(mode==='review'?'reviewFinishedText':'finishedText')(n,list.length))}</p></div>`;}
  $('prevQuestion').textContent=t('previous');$('prevQuestion').disabled=index===0;$('questionPosition').textContent=`${index+1} / ${list.length}`;

  $('sourceLine').innerHTML=`<span class="footer-source-title">${esc(t('citation'))}</span><br>${esc(t('chapter'))} ${c.id} · ${esc(t('pages'))} ${c.startPage}–${c.endPage}`;
 }
 function renderEmpty(){ $('studyView').hidden=true;$('emptyView').hidden=false;$('emptyView').innerHTML=`<div class="empty-icon" aria-hidden="true">✓</div><h1>${esc(t('noMistakes'))}</h1><p>${esc(t('noMistakesText'))}</p><button id="backToStudy" class="primary-button">${esc(t('start'))}</button>`;$('backToStudy').onclick=()=>chooseChapter(state.chapter); }

  const tr=`<p>89 bölümün her biri için 5 özgün, tek en iyi yanıtlı soru: toplam 445 soru. Her sorunun Türkçe ve İngilizce sürümü, doğru yanıtı ve açıklaması bulunur. TR+EN ile iki dili birlikte görebilirsin.</p><p><strong>Kaynak:</strong> David Chambers, Christopher Huang ve Gareth Matthews, <em>Basic Physiology for Anaesthetists</em>, 2. baskı, Cambridge University Press, 2019. <a href="https://doi.org/10.1017/9781108565011" target="_blank" rel="noopener noreferrer">Kitap bilgisi ↗</a></p><p>Sorular yüklediğin kitaptan yararlanılarak bağımsız biçimde hazırlanmıştır; yayınevinin resmî soru bankası değildir. Sayfa atıfları basılı kitaba aittir; yüklenen PDF'de sayfa numarası 18 fazladır. Bilinen eski veya hatalı ifadeler soru yazımında düzeltilmiş ya da dışarıda bırakılmıştır.</p><ul><li>Yanıt seçtiğinde sonuç ve açıklama hemen altında açılır.</li><li>İlerleme yalnızca bu tarayıcının yerel belleğinde tutulur; cihazlar arasında eşitlenmez. Tarayıcı verilerini temizlersen kaybolur.</li><li>Yanlışlarımı tekrar et bölümünde bir soruyu yeniden çözebilirsin.</li><li>Çalışma materyali hata içerebilir. Klinik kararlar için güncel kaynakları ve yerel protokolleri kullan.</li></ul>`;

 async function init(){
  try{const embedded=document.getElementById('questionData');if(!embedded)throw new Error('Embedded question data unavailable');data=JSON.parse(embedded.textContent);
   if(data.chapters.length!==89||data.chapters.some(c=>c.questions.length!==5))throw new Error('Incomplete question bank');
   chapterById=new Map(data.chapters.map(c=>[c.id,c]));sectionById=new Map(data.sections.map(s=>[s.id,s]));questionsById=new Map();data.chapters.forEach(c=>c.questions.forEach(q=>{q.chapterId=c.id;questionsById.set(q.id,q);}));
   if(!chapterById.has(Number(state.chapter)))state.chapter=1;state.chapter=Number(state.chapter);index=Number.isInteger(state.index)?Math.max(0,Math.min(4,state.index)):0;
   const hash=location.hash.match(/^#chapter-(\d+)$/);if(hash&&chapterById.has(Number(hash[1]))){if(state.chapter!==Number(hash[1]))index=0;state.chapter=Number(hash[1]);}

   for(const id of Object.keys(state.answers)){if(!questionsById.has(id)||!Number.isInteger(state.answers[id])||state.answers[id]<0||state.answers[id]>4)delete state.answers[id];}

   $('resetChapter').onclick=()=>{if(mode==='review'){chooseChapter(currentChapter()?.id||state.chapter);return;}if(confirm(t('resetConfirm'))){chapterById.get(state.chapter).questions.forEach(q=>delete state.answers[q.id]);index=0;state.index=0;save();render();}};
   $('resetAll').onclick=()=>{if(confirm(t('resetAllConfirm'))){state.answers={};state.chapter=1;state.index=0;index=0;mode='chapter';save();$('infoDialog').close();render();closeMenu();scrollTop();history.replaceState(null,'','#chapter-1');}};
   $('brand').onclick=e=>{e.preventDefault();chooseChapter(state.chapter);};
   $('menuButton').onclick=()=>{$('sidebar').classList.contains('open')?closeMenu():openMenu();};$('backdrop').onclick=closeMenu;
   document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenu();if(e.key==='Tab'&&$('sidebar').classList.contains('open')){const nodes=[...$('sidebar').querySelectorAll('button,input,select,a')].filter(n=>!n.disabled);const first=nodes[0],last=nodes[nodes.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
   window.addEventListener('resize',()=>{if(window.innerWidth>760){$('sidebar').inert=false;closeMenu();}else if(!$('sidebar').classList.contains('open'))$('sidebar').inert=true;});
   $('infoButton').onclick=()=>{$('infoDialog').showModal();};$('closeInfo').onclick=()=>$('infoDialog').close();$('infoDialog').onclick=e=>{if(e.target===$('infoDialog')){const r=$('infoDialog').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)$('infoDialog').close();}};
   if(window.innerWidth<=760)$('sidebar').inert=true;save();
  }catch(error){$('loading').hidden=true;$('emptyView').hidden=false;$('emptyView').innerHTML=`<h1>${esc(t('loadError'))}</h1><p>${esc(t('loadErrorText'))}</p><button class="primary-button" id="reloadButton">${esc(t('reload'))}</button>`;$('reloadButton').onclick=()=>location.reload();console.error(error);}
