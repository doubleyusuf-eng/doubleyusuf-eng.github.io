":"c53q3","stem":{"en":"How is acetylcholine signalling at the normal neuromuscular junction mainly terminated?","tr":"Normal nöromüsküler kavşakta asetilkolin sinyali esas olarak nasıl sonlandırılır?"},"options":[{"en":"Reuptake of intact acetylcholine as the dominant route","tr":"Baskın yol olarak değişmemiş asetilkolinin geri alınması"},{"en":"Metabolism by monoamine oxidase in the cleft","tr":"Aralıkta monoamin oksidazla metabolizma"},{"en":"Metabolism by catechol-O-methyltransferase","tr":"Katekol-O-metiltransferazla metabolizma"},{"en":"Hydrolysis by acetylcholinesterase in the synaptic region","tr":"Sinaptik bölgedeki asetilkolinesteraz ile hidroliz"},{"en":"Removal into plasma by diffusion as the dominant route","tr":"Baskın yol olarak difüzyonla plazmaya uzaklaştırılma"}],"answer":3,"explanation":{"en":"Acetylcholinesterase rapidly breaks acetylcholine down into choline and acetate. Choline can be taken back into the nerve terminal for new acetylcholine synthesis, limiting prolonged end-plate stimulation.","tr":"Asetilkolinesteraz asetilkolini hızla kolin ve asetata parçalar. Kolin yeni asetilkolin sentezi için sinir terminaline geri alınabilir; böylece motor son plağın uzun süreli uyarılması sınırlanır."},"sourcePages":[235,236],"difficulty":"core"},{"id":"c53q4","stem":{"en":"What is the principal postsynaptic action of a non-depolarising neuromuscular blocker?","tr":"Nondepolarizan nöromüsküler blokerin temel postsinaptik etkisi nedir?"},"options":[{"en":"Sustained activation of the end-plate cation channel","tr":"Motor son plak katyon kanalının sürekli aktivasyonu"},{"en":"Irreversible inhibition of acetylcholinesterase","tr":"Asetilkolinesterazın geri dönüşümsüz inhibisyonu"},{"en":"Competitive antagonism at muscle nicotinic acetylcholine receptors","tr":"Kas nikotinik asetilkolin reseptörlerinde kompetitif antagonizma"},{"en":"Opening of ryanodine receptors in the muscle","tr":"Kastaki riyanodin reseptörlerinin açılması"},{"en":"Direct activation of muscarinic M2 receptors","tr":"Muskarinik M2 reseptörlerinin doğrudan aktivasyonu"}],"answer":2,"explanation":{"en":"Non-depolarising blockers compete with acetylcholine without activating the muscle nicotinic receptor. This reduces the end-plate potential and can prevent it from reaching the threshold needed for a muscle action potential.","tr":"Nondepolarizan blokerler, kas nikotinik reseptörünü aktive etmeden asetilkolinle yarışır. Bu, motor son plak potansiyelini azaltır ve kas aksiyon potansiyeli için gereken eşiğe ulaşmasını engelleyebilir."},"sourcePages":[237],"difficulty":"core"},{"id":"c53q5","stem":{"en":"Why can extensive denervation increase potassium release when widespread muscle acetylcholine receptors are activated?","tr":"Yaygın denervasyon, kas asetilkolin reseptörleri geniş çapta aktive edildiğinde potasyum salınımını neden artırabilir?"},"options":[{"en":"Extrajunctional receptors proliferate across the muscle membrane","tr":"Ekstrajunksiyonel reseptörler kas membranı boyunca çoğalır"},{"en":"Junctional acetylcholine receptors become less numerous and briefer-opening","tr":"Kavşak asetilkolin reseptörleri azalır ve daha kısa süre açılır"},{"en":"Activated acetylcholine receptors reverse their usual potassium flux inward","tr":"Aktive asetilkolin reseptörleri olağan potasyum akımını içeri yöneltir"},{"en":"Presynaptic acetylcholinesterase causes selective sodium efflux","tr":"Presinaptik asetilkolinesteraz seçici sodyum çıkışına neden olur"},{"en":"Denervation lowers intracellular potassium enough to reverse its gradient","tr":"Denervasyon hücre içi potasyumu gradyanını tersine çevirecek kadar azaltır"}],"answer":0,"explanation":{"en":"Denervation can increase the number and distribution of extrajunctional acetylcholine receptors. Their widespread activation and longer channel opening can permit greater potassium efflux from muscle.","tr":"Denervasyon, ekstrajunksiyonel asetilkolin reseptörlerinin sayısını ve dağılımını artırabilir. Bunların yaygın aktivasyonu ve daha uzun kanal açıklığı, kastan daha fazla potasyum çıkışına olanak verebilir."},"sourcePages":[237,238],"difficulty":"applied"}]},{"id":54,"title":{"en":"Skeletal Muscle","tr":"İskelet Kası"},"startPage":239,"section":4,"endPage":245,"questions":[{"id":"c54q1","stem":{"en":"Which event exposes myosin-binding sites on actin in skeletal muscle?","tr":"İskelet kasında aktin üzerindeki miyozin bağlanma bölgelerini hangi olay açığa çıkarır?"},"options":[{"en":"Calcium binding to troponin C and movement of tropomyosin","tr":"Kalsiyumun troponin C’ye bağlanması ve tropomiyozinin yer değiştirmesi"},{"en":"Calcium–calmodulin activation of myosin light-chain kinase","tr":"Kalsiyum-kalmodulinin miyozin hafif zincir kinazını aktive etmesi"},{"en":"Calcium dissociation from troponin C","tr":"Kalsiyumun troponin C’den ayrılması"},{"en":"ATP binding directly to tropomyosin","tr":"ATP’nin doğrudan tropomiyozine bağlanması"},{"en":"Myosin light-chain dephosphorylation while attached to actin","tr":"Aktine bağlıyken miyozin hafif zincirinin defosforilasyonu"}],"answer":0,"explanation":{"en":"Calcium binding changes the troponin–tropomyosin complex and uncovers actin sites for myosin. Skeletal muscle therefore regulates contraction mainly at the thin filament, unlike smooth muscle’s central myosin-phosphorylation mechanism.","tr":"Kalsiyum bağlanması, troponin-tropomiyozin kompleksinin yapısını değiştirerek aktinde miyozin bağlanma bölgelerini açar. Böylece iskelet kası kasılmayı esas olarak ince filament düzeyinde düzenler; düz kasta ise miyozin fosforilasyonu temel mekanizmadır."},"sourcePages":[241,242],"difficulty":"core"},{"id":"c54q2","stem":{"en":"In skeletal muscle, how does T-tubule depolarisation primarily trigger calcium release from the sarcoplasmic reticulum?","tr":"İskelet kasında T-tübül depolarizasyonu, sarkoplazmik retikulumdan kalsiyum salınımını esas olarak nasıl tetikler?"},"options":[{"en":"Trigger calcium influx through L-type channels followed by calcium-induced calcium release","tr":"L tipi kanallardan tetikleyici kalsiyum girişi ardından kalsiyumla indüklenen kalsiyum salınımı"},{"en":"Calcium–calmodulin activation of myosin light-chain kinase","tr":"Kalsiyum-kalmodulinin miyozin hafif zincir kinazını aktive etmesi"},{"en":"Physical coupling of the dihydropyridine receptor to the ryanodine receptor","tr":"Dihidropiridin reseptörünün riyanodin reseptörüyle fiziksel eşleşmesi"},{"en":"Opening of sarcoplasmic-reticulum nicotinic acetylcholine channels","tr":"Sarkoplazmik retikulumdaki nikotinik asetilkolin kanallarının açılması"},{"en":"Reversal of the SERCA pump as the voltage sensor","tr":"Voltaj sensörü olarak SERCA pompasının ters yönde çalışması"}],"answer":2,"explanation":{"en":"The skeletal-muscle dihydropyridine receptor acts as a voltage sensor and changes the conformation of the associated ryanodine receptor. This releases stored calcium without requiring the cardiac pattern of trigger calcium influx.","tr":"İskelet kasındaki dihidropiridin reseptörü voltaj sensörü olarak görev yapar ve bağlantılı riyanodin reseptörünün şeklini değiştirir. Böylece kalp kasındaki tetikleyici kalsiyum girişine gerek olmadan depolanmış kalsiyum salınır."},"sourcePages":[242],"difficulty":"core"},{"id":"c54q3","stem":{"en":"What directly permits a myosin head to detach from actin during crossbridge cycling?","tr":"Çapraz köprü döngüsünde miyozin başının aktinden ayrılmasını doğrudan ne sağlar?"},"options":[{"en":"Release of inorganic phosphate from the myosin head","tr":"Miyozin başından inorganik fosfatın ayrılması"},{"en":"Release of ADP at the end of the power stroke","tr":"Güç vuruşunun sonunda ADP’nin ayrılması"},{"en":"Calcium binding to troponin C","tr":"Kalsiyumun troponin C’ye bağlanması"},{"en":"Hydrolysis of ATP before myosin binds actin","tr":"Miyozin aktine bağlanmadan önce ATP’nin hidrolizi"},{"en":"Binding of a new ATP molecule to myosin","tr":"Miyozine yeni bir ATP molekülünün bağlanması"}],"answer":4,"explanation":{"en":"ATP binding lowers myosin’s affinity for actin and breaks the crossbridge. ATP depletion therefore impairs detachment as well as calcium removal, contributing to rigor.","tr":"ATP bağlanması, miyozinin aktine afinitesini azaltır ve çapraz köprüyü ayırır. Bu nedenle ATP tükenmesi hem ayrılmayı hem kalsiyumun uzaklaştırılmasını bozarak rigora katkıda bulunur."},"sourcePages":[242,243,244],"difficulty":"core"},{"id":"c54q4","stem":{"en":"Which sarcomere dimension remains essentially unchanged during ordinary skeletal-muscle shortening?","tr":"Olağan iskelet kası kısalması sırasında sarkomerin hangi boyutu esas olarak değişmeden kalır?"},"options":[{"en":"Distance between Z discs","tr":"Z diskleri arasındaki uzaklık"},{"en":"I-band width","tr":"I bandının genişliği"},{"en":"H-zone width","tr":"H bölgesinin genişliği"},{"en":"A-band width","tr":"A bandının genişliği"},{"en":"Total sarcomere length","tr":"Toplam sarkomer uzunluğu"}],"answer":3,"explanation":{"en":"The A band corresponds to the length of the thick filaments, which do not shorten. Contraction increases filament overlap, shortening the sarcomere and narrowing the I band and H zone.","tr":"A bandı, kısalmayan kalın filamentlerin uzunluğuna karşılık gelir. Kasılma filamentlerin örtüşmesini artırır; sarkomer kısalırken I bandı ve H bölgesi daralır."},"sourcePages":[240,243],"difficulty":"core"},{"id":"c54q5","stem":{"en":"How can a whole skeletal muscle generate greater force while individual action potentials remain all-or-none?","tr":"Tek tek aksiyon potansiyelleri hep ya da hiç özelliğini korurken bir iskelet kası bütünüyle nasıl daha fazla kuvvet üretebilir?"},"options":[{"en":"By increasing the amplitude of each fibre’s action potential","tr":"Her lifin aksiyon potansiyeli genliğini artırarak"},{"en":"By recruiting additional motor units","tr":"Ek motor üniteleri devreye sokarak"},{"en":"By reducing calcium released for each muscle action potential","tr":"Her kas aksiyon potansiyelinde salınan kalsiyumu azaltarak"},{"en":"By prolonging the interval between motor-neuron discharges","tr":"Motor nöron deşarjları arasındaki süreyi uzatarak"},{"en":"By recruiting fewer muscle fibres while their firing frequency stays fixed","tr":"Ateşleme sıklığı sabitken daha az kas lifini devreye sokarak"}],"answer":1,"explanation":{"en":"Recruitment activates more muscle fibres and increases total force. Firing frequency can also increase tension through summation, without requiring larger individual action potentials.","tr":"Motor ünite katılımı daha fazla kas lifini aktive eder ve toplam kuvveti artırır. Ateşleme sıklığı da tek tek aksiyon potansiyellerini büyütmeye gerek olmadan summasyon yoluyla gerilimi artırabilir."},"sourcePages":[244],"difficulty":"applied"}]},{"id":55,"title":{"en":"Muscle Spindles and Golgi Tendon Organs","tr":"Kas İğcikleri ve Golgi Tendon Organları"},"startPage":246,"section":4,"endPage":248,"questions":[{"id":"c55q1","stem":{"en":"Which pairing correctly distinguishes muscle spindles from Golgi tendon organs?","tr":"Hangi eşleştirme kas iğciklerini Golgi tendon organlarından doğru biçimde ayırır?"},"options":[{"en":"Spindles sense tension; Golgi tendon organs sense length","tr":"İğcikler gerilimi, Golgi tendon organları uzunluğu algılar"},{"en":"Spindles sense length; Golgi tendon organs sense tension","tr":"İğcikler uzunluğu, Golgi tendon organları gerilimi algılar"},{"en":"Both primarily measure muscle length and lie in parallel","tr":"İkisi de esas olarak kas uzunluğunu ölçer ve paralel yerleşir"},{"en":"Both primarily measure tension and lie in series","tr":"İkisi de esas olarak gerilimi ölçer ve seri yerleşir"},{"en":"Spindles sense joint angle only; Golgi tendon organs sense stretch velocity only","tr":"İğcikler yalnızca eklem açısını, Golgi tendon organları yalnızca gerilme hızını algılar"}],"answer":1,"explanation":{"en":"Muscle spindles lie in parallel with extrafusal fibres and report muscle length and its change. Golgi tendon organs lie in series with the muscle–tendon apparatus and report tension.","tr":"Kas iğcikleri ekstrafüzal liflere paraleldir; kas uzunluğunu ve uzunluk değişimini bildirir. Golgi tendon organları kas-tendon yapısıyla seri yerleşimlidir ve gerilimi bildirir."},"sourcePages":[246,247],"difficulty":"core"},{"id":"c55q2","stem":{"en":"Which spindle afferent is particularly important for signalling the rate of muscle stretch as well as muscle length?","tr":"Kas uzunluğunun yanı sıra gerilme hızını da bildirmede özellikle önemli olan iğcik aferenti hangisidir?"},"options":[{"en":"Type Ib afferent","tr":"Tip Ib aferent"},{"en":"Alpha motor neuron","tr":"Alfa motor nöron"},{"en":"Gamma motor neuron","tr":"Gama motor nöron"},{"en":"Type Ia afferent","tr":"Tip Ia aferent"},{"en":"Postganglionic sympathetic fibre","tr":"Postgangliyonik sempatik lif"}],"answer":3,"explanation":{"en":"Type Ia afferents encode both static length and the dynamic component of stretch. Type Ib afferents instead arise from Golgi tendon organs and signal muscle tension.","tr":"Tip Ia aferentler hem statik uzunluğu hem gerilmenin dinamik bileşenini kodlar. Tip Ib aferentler ise Golgi tendon organlarından çıkar ve kas gerilimini bildirir."},"sourcePages":[247],"difficulty":"core"},{"id":"c55q3","stem":{"en":"Why are gamma motor neurons activated alongside alpha motor neurons during voluntary contraction?","tr":"İstemli kasılmada gama motor nöronlar neden alfa motor nöronlarla birlikte aktive edilir?"},"options":[{"en":"To maintain spindle sensitivity as the muscle shortens","tr":"Kas kısalırken iğcik duyarlılığını korumak için"},{"en":"To keep intrafusal fibres slack during extrafusal shortening","tr":"Ekstrafüzal kısalma sırasında intrafüzal lifleri gevşek tutmak için"},{"en":"To generate the main force transmitted through the tendon","tr":"Tendon üzerinden iletilen temel kuvveti üretmek için"},{"en":"To suppress spindle afferent discharge during movement","tr":"Hareket sırasında iğcik aferent deşarjını baskılamak için"},{"en":"To replace alpha motor-neuron drive to extrafusal fibres","tr":"Ekstrafüzal liflere giden alfa motor nöron uyarısının yerini almak için"}],"answer":0,"explanation":{"en":"Gamma activation contracts the ends of intrafusal fibres and prevents the spindle from becoming slack. This preserves sensory feedback while alpha-driven extrafusal fibres shorten.","tr":"Gama aktivasyonu intrafüzal liflerin uçlarını kasar ve iğciğin gevşeyip boşta kalmasını önler. Böylece alfa uyarısıyla ekstrafüzal lifler kısalırken duyusal geri bildirim korunur."},"sourcePages":[247],"difficulty":"applied"},{"id":"c55q4","stem":{"en":"Which connection forms the monosynaptic excitatory component of the patellar reflex?","tr":"Patella refleksinin monosinaptik uyarıcı bileşenini hangi bağlantı oluşturur?"},"options":[{"en":"Quadriceps Ib afferent directly to a quadriceps alpha motor neuron","tr":"Kuadriseps Ib aferentinin doğrudan kuadriseps alfa motor nöronuna bağlanması"},{"en":"Quadriceps Ia afferent through an inhibitory interneuron to quadriceps","tr":"Kuadriseps Ia aferentinin inhibitör ara nöron üzerinden kuadrisepse bağlanması"},{"en":"Hamstring Ia afferent directly exciting the quadriceps motor neuron","tr":"Hamstring Ia aferentinin kuadriseps motor nöronunu doğrudan uyarması"},{"en":"Quadriceps gamma motor neuron directly to extrafusal muscle fibres","tr":"Kuadriseps gama motor nöronunun doğrudan ekstrafüzal kas liflerine bağlanması"},{"en":"Quadriceps Ia afferent directly to a quadriceps alpha motor neuron","tr":"Kuadriseps Ia aferentinin doğrudan kuadriseps alfa motor nöronuna bağlanması"}],"answer":4,"explanation":{"en":"Patellar tendon tapping stretches quadriceps spindles, activating Ia afferents. Their direct excitatory synapse on alpha motor neurons drives quadriceps contraction; associated antagonist inhibition uses an interneuron.","tr":"Patella tendonuna vurulması kuadriseps iğciklerini gererek Ia aferentleri aktive eder. Alfa motor nöronlardaki doğrudan uyarıcı sinaps kuadriseps kasılmasını başlatır; buna eşlik eden antagonist inhibisyonunda ise ara nöron kullanılır."},"sourcePages":[247],"difficulty":"core"},{"id":"c55q5","stem":{"en":"What allows the hamstrings to relax while the quadriceps contracts during the patellar reflex?","tr":"Patella refleksinde kuadriseps kasılırken hamstring kaslarının gevşemesini ne sağlar?"},"options":[{"en":"Direct excitatory stimulation of hamstring alpha motor neurons","tr":"Hamstring alfa motor nöronlarının doğrudan uyarılması"},{"en":"A monosynaptic inhibitory connection from Ia afferent to muscle","tr":"Ia aferentten kasa monosinaptik inhibitör bağlantı"},{"en":"Reciprocal inhibition through a spinal inhibitory interneuron","tr":"Spinal inhibitör ara nöron aracılığıyla resiprokal inhibisyon"},{"en":"Simultaneous gamma activation as the sole cause of hamstring relaxation","tr":"Hamstring gevşemesinin tek nedeni olarak eşzamanlı gama aktivasyonu"},{"en":"Withdrawal of quadriceps motor-neuron discharge","tr":"Kuadriseps motor nöron deşarjının azalması"}],"answer":2,"explanation":{"en":"Branches of spindle afferents engage inhibitory interneurons that reduce antagonist motor-neuron activity. This reciprocal inhibition lets the agonist produce movement without equally strong opposing contraction.","tr":"İğcik aferentlerinin dalları, antagonist motor nöron aktivitesini azaltan inhibitör ara nöronları devreye sokar. Bu resiprokal inhibisyon, agonistin eşit güçte karşı kasılma olmadan hareket üretmesini sağlar."},"sourcePages":[247,248],"difficulty":"applied"}]},{"id":56,"title":{"en":"Smooth Muscle","tr":"Düz Kas"},"startPage":249,"section":4,"endPage":251,"questions":[{"id":"c56q1","stem":{"en":"Which sequence is central to calcium-triggered contraction in smooth muscle?","tr":"Düz kasta kalsiyumla tetiklenen kasılmanın temel dizisi hangisidir?"},"options":[{"en":"Calcium binds troponin C to uncover actin sites","tr":"Kalsiyum troponin C’ye bağlanarak aktin bölgelerini açar"},{"en":"Calcium–calmodulin inhibits myosin light-chain kinase","tr":"Kalsiyum-kalmodulin miyozin hafif zincir kinazını inhibe eder"},{"en":"Calcium–calmodulin activates myosin light-chain kinase","tr":"Kalsiyum-kalmodulin, miyozin hafif zincir kinazını aktive eder"},{"en":"Calcium activates myosin light-chain phosphatase as the main initiating step","tr":"Kalsiyum temel başlatıcı basamak olarak miyozin hafif zincir fosfatazını aktive eder"},{"en":"Calcium directly replaces ATP at the myosin catalytic site","tr":"Kalsiyum miyozinin katalitik bölgesinde doğrudan ATP’nin yerini alır"}],"answer":2,"explanation":{"en":"Smooth muscle lacks the troponin-based regulatory system of striated muscle. Calcium bound to calmodulin activates myosin light-chain kinase, allowing myosin phosphorylation and productive crossbridge cycling.","tr":"Düz kasta çizgili kasın troponine dayalı düzenleyici sistemi bulunmaz. Kalmoduline bağlanan kalsiyum, miyozin hafif zincir kinazını aktive eder; böylece miyozin fosforilasyonu ve etkili çapraz köprü döngüsü gerçekleşir."},"sourcePages":[249,250],"difficulty":"core"},{"id":"c56q2","stem":{"en":"What enables neighbouring cells in single-unit smooth muscle to act as a functional syncytium?","tr":"Tek üniteli düz kasta komşu hücrelerin işlevsel sinsityum olarak davranmasını ne sağlar?"},"options":[{"en":"Separate somatic motor end plates on individual cells","tr":"Tek tek hücrelerde ayrı somatik motor son plaklar"},{"en":"Chemical transmission between every adjacent muscle cell","tr":"Her komşu kas hücresi arasında kimyasal iletim"},{"en":"Mechanical coupling through desmosomes without electrical coupling","tr":"Elektriksel eşleşme olmadan desmozomlarla mekanik eşleşme"},{"en":"Continuous T-tubules crossing from one cell into the next","tr":"Bir hücreden diğerine geçen kesintisiz T-tübüller"},{"en":"Electrical coupling through gap junctions","tr":"Oluklu bağlantılar üzerinden elektriksel eşleşme"}],"answer":4,"explanation":{"en":"Gap junctions allow current to spread between smooth-muscle cells, coordinating their activity. Multi-unit muscle is more independently innervated and has much less of this syncytial electrical coupling.","tr":"Oluklu bağlantılar akımın düz kas hücreleri arasında yayılmasını sağlayarak aktivitelerini koordine eder. Çok üniteli kas daha bağımsız biçimde innerve edilir ve bu tür sinsityal elektriksel eşleşmesi çok daha azdır."},"sourcePages":[249],"difficulty":"core"},{"id":"c56q3","stem":{"en":"How does the latch state help smooth muscle maintain prolonged tone economically?","tr":"Kilitlenme durumu, düz kasın uzun süreli tonusu ekonomik biçimde sürdürmesine nasıl yardımcı olur?"},"options":[{"en":"Rapid repeated crossbridge cycling driven by high ATPase activity","tr":"Yüksek ATPaz aktivitesiyle hızlı tekrarlayan çapraz köprü döngüsü"},{"en":"Slowly detaching crossbridges maintain force with low ATP turnover","tr":"Yavaş ayrılan çapraz köprüler düşük ATP tüketimiyle kuvveti korur"},{"en":"Persistent high-frequency action potentials with maximal calcium influx","tr":"Maksimum kalsiyum girişiyle sürekli yüksek frekanslı aksiyon potansiyelleri"},{"en":"Permanent ATP depletion that prevents any subsequent relaxation","tr":"Daha sonraki gevşemeyi engelleyen kalıcı ATP tükenmesi"},{"en":"Increased detachment of every crossbridge after dephosphorylation","tr":"Defosforilasyondan sonra her çapraz köprünün ayrılmasının hızlanması"}],"answer":1,"explanation":{"en":"When attached myosin becomes dephosphorylated, crossbridges can detach slowly and preserve tension. This supports sustained tone with much lower ATP turnover than rapid continuous crossbridge cycling.","tr":"Bağlı miyozin defosforile olduğunda çapraz köprüler yavaş ayrılarak gerilimi koruyabilir. Bu, hızlı ve sürekli çapraz köprü döngüsüne göre çok daha düşük ATP tüketimiyle uzun süreli tonusu destekler."},"sourcePages":[251],"difficulty":"core"},{"id":"c56q4","stem":{"en":"Compared with skeletal muscle, why is extracellular calcium entry especially important in many smooth muscles?","tr":"İskelet kasına kıyasla birçok düz kasta hücre dışından kalsiyum girişi neden özellikle önemlidir?"},"options":[{"en":"The sarcoplasmic reticulum is less developed and membrane calcium entry contributes substantially","tr":"Sarkoplazmik retikulum daha az gelişmiştir ve membrandan kalsiyum girişi önemli katkı sağlar"},{"en":"A more extensive T-tubule network rapidly removes extracellular calcium","tr":"Daha gelişmiş T-tübül ağı hücre dışı kalsiyumu hızla uzaklaştırır"},{"en":"Troponin C is the only calcium store in smooth muscle","tr":"Düz kasta tek kalsiyum deposu troponin C’dir"},{"en":"Smooth-muscle myosin uses sodium rather than calcium-dependent regulation","tr":"Düz kas miyozini kalsiyuma bağımlı düzenleme yerine sodyum kullanır"},{"en":"Calcium entry is required only to create the action potential, not to regulate contraction","tr":"Kalsiyum girişi kasılmayı düzenlemek için değil, yalnızca aksiyon potansiyeli oluşturmak için gerekir"}],"answer":0,"explanation":{"en":"Smooth muscle generally has less extensive internal calcium storage than skeletal muscle. Calcium can enter through voltage-, receptor- or stretch-associated pathways, with intracellular stores contributing to varying degrees.","tr":"Düz kasın hücre içi kalsiyum depolama sistemi genellikle iskelet kasından daha sınırlıdır. Kalsiyum voltaj, reseptör veya gerilmeyle ilişkili yollardan girebilir; hücre içi depolar da değişen ölçülerde katkıda bulunur."},"sourcePages":[249,250],"difficulty":"core"},{"id":"c56q5","stem":{"en":"Why does smooth muscle lack the striated appearance of skeletal muscle?","tr":"Düz kas neden iskelet kasının çizgili görünümüne sahip değildir?"},"options":[{"en":"Its actin filaments are absent and contraction uses myosin alone","tr":"Aktin filamentleri yoktur ve kasılma yalnızca miyozin kullanır"},{"en":"Its myosin filaments are absent and contraction uses actin alone","tr":"Miyozin filamentleri yoktur ve kasılma yalnızca aktin kullanır"},{"en":"Its sarcomeres contain only A bands without I bands","tr":"Sarkomerleri I bandı olmadan yalnızca A bandı içerir"},{"en":"Actin and myosin are not organised into repeating sarcomeres","tr":"Aktin ve miyozin tekrarlayan sarkomerler halinde düzenlenmemiştir"},{"en":"Each cell contains one very long sarcomere extending from end to end","tr":"Her hücre baştan sona uzanan tek çok uzun sarkomer içerir"}],"answer":3,"explanation":{"en":"Smooth muscle still uses actin and myosin to generate force. The absence of regular sarcomere organisation removes the alternating band pattern seen in skeletal and cardiac muscle.","tr":"Düz kas da kuvvet üretmek için aktin ve miyozin kullanır. Düzenli sarkomer yapılanmasının olmaması, iskelet ve kalp kasında görülen dönüşümlü bant örüntüsünü ortadan kaldırır."},"sourcePages":[249],"difficulty":"core"}]},{"id":57,"title":{"en":"Cardiac Muscle","tr":"Kalp Kası"},"startPage":252,"section":4,"endPage":261,"questions":[{"id":"c57q1","stem":{"en":"Which opposing currents principally sustain the plateau of a ventricular action potential?","tr":"Ventriküler aksiyon potansiyelinin plato fazını esas olarak hangi zıt akımlar sürdürür?"},"options":[{"en":"Inward potassium current and outward calcium current","tr":"İçe doğru potasyum akımı ve dışa doğru kalsiyum akımı"},{"en":"Inward chloride current and outward sodium current","tr":"İçe doğru klorür akımı ve dışa doğru sodyum akımı"},{"en":"Only the brief fast sodium current","tr":"Yalnızca kısa süreli hızlı sodyum akımı"},{"en":"Inward calcium current and outward potassium current","tr":"İçe doğru kalsiyum akımı ve dışa doğru potasyum akımı"},{"en":"Only the sodium–potassium pump current","tr":"Yalnızca sodyum-potasyum pompası akımı"}],"answer":3,"explanation":{"en":"L-type calcium channels provide sustained inward current during the plateau, opposing potassium efflux. This balance prolongs depolarisation well beyond the brief sodium-dependent upstroke.","tr":"L tipi kalsiyum kanalları plato sırasında potasyum çıkışına karşı koyan sürekli içe akım sağlar. Bu denge, depolarizasyonu sodyuma bağımlı kısa yükseliş fazından çok daha uzun sürdürür."},"sourcePages":[253],"difficulty":"core"},{"id":"c57q2","stem":{"en":"Which channel characteristic contributes to spontaneous sinoatrial pacemaker depolarisation?","tr":"Hangi kanal özelliği sinoatriyal pacemaker hücresinin kendiliğinden depolarizasyonuna katkı sağlar?"},"options":[{"en":"HCN channels open with hyperpolarisation and carry a net inward current","tr":"HCN kanalları hiperpolarizasyonla açılır ve net içe akım taşır"},{"en":"Fast sodium channels stay fully open throughout diastole","tr":"Hızlı sodyum kanalları diyastol boyunca tamamen açık kalır"},{"en":"L-type calcium channels open only when the membrane reaches −90 mV","tr":"L tipi kalsiyum kanalları yalnızca membran −90 mV’a ulaştığında açılır"},{"en":"Potassium influx through delayed rectifier channels drives phase 4","tr":"Gecikmiş rektifiye edici kanallardan potasyum girişi faz 4’ü oluşturur"},{"en":"HCN channels are activated exclusively by acetylcholine binding","tr":"HCN kanalları yalnızca asetilkolin bağlanmasıyla aktive olur"}],"answer":0,"explanation":{"en":"Hyperpolarisation-activated cyclic nucleotide-gated channels conduct sodium and potassium with a net inward current at diastolic voltages. Together with other pacemaker currents, this helps the membrane approach threshold spontaneously.","tr":"Hiperpolarizasyonla aktive olan siklik nükleotid kapılı kanallar, diyastolik voltajlarda net içe akım oluşturacak şekilde sodyum ve potasyum iletir. Bu akım diğer pacemaker akımlarıyla birlikte membranın kendiliğinden eşiğe yaklaşmasına yardımcı olur."},"sourcePages":[256,257],"difficulty":"core"},{"id":"c57q3","stem":{"en":"What is the main mechanical benefit of the delay in conduction through the atrioventricular node?","tr":"Atriyoventriküler düğümdeki iletim gecikmesinin temel mekanik yararı nedir?"},"options":[{"en":"It makes atria and ventricles begin contraction simultaneously","tr":"Atriyum ve ventriküllerin aynı anda kasılmaya başlamasını sağlar"},{"en":"It ensures ventricular contraction occurs before atrial contraction","tr":"Ventrikülün atriyumdan önce kasılmasını sağlar"},{"en":"It allows atrial contraction before ventricular contraction","tr":"Ventrikül kasılmasından önce atriyum kasılmasına zaman tanır"},{"en":"It directly closes the aortic valve during atrial systole","tr":"Atriyum sistolünde aort kapağını doğrudan kapatır"},{"en":"It provides the force of ventricular ejection","tr":"Ventriküler ejeksiyon kuvvetini sağlar"}],"answer":2,"explanation":{"en":"Slow AV nodal conduction separates atrial from ventricular activation. The atria can therefore contribute to ventricular filling before ventricular systole begins.","tr":"Yavaş AV düğüm iletimi, atriyal aktivasyonu ventriküler aktivasyondan ayırır. Böylece atriyumlar, ventrikül sistolü başlamadan önce ventrikül doluşuna katkıda bulunabilir."},"sourcePages":[257],"difficulty":"core"},{"id":"c57q4","stem":{"en":"What initiates calcium-induced calcium release in a ventricular myocyte?","tr":"Ventriküler miyositte kalsiyumla indüklenen kalsiyum salınımını ne başlatır?"},"options":[{"en":"Physical voltage-sensor coupling alone opens the ryanodine receptor","tr":"Yalnızca voltaj sensörünün fiziksel eşleşmesi riyanodin reseptörünü açar"},{"en":"Calcium entry through L-type channels activates ryanodine receptors","tr":"L tipi kanallardan kalsiyum girişi riyanodin reseptörlerini aktive eder"},{"en":"Sodium entering through HCN channels directly binds troponin C","tr":"HCN kanallarından giren sodyum doğrudan troponin C’ye bağlanır"},{"en":"Calcium export through the sodium–calcium exchanger activates the release channel","tr":"Sodyum-kalsiyum değiştiricisinden kalsiyum çıkışı salınım kanalını aktive eder"},{"en":"Inhibition of SERCA directly creates the normal beat-by-beat release trigger","tr":"SERCA inhibisyonu normal atımdan atıma salınım tetikleyicisini doğrudan oluşturur"}],"answer":1,"explanation":{"en":"Extracellular calcium entering through L-type channels acts as a trigger for further release from the sarcoplasmic reticulum. The amplification through ryanodine receptors distinguishes cardiac coupling from the primarily mechanical coupling in skeletal muscle.","tr":"L tipi kanallardan giren hücre dışı kalsiyum, sarkoplazmik retikulumdan ek salınım için tetikleyici görevi görür. Riyanodin reseptörleriyle oluşan bu güçlendirme, kalpteki eşleşmeyi iskelet kasındaki ağırlıklı olarak mekanik eşleşmeden ayırır."},"sourcePages":[258],"difficulty":"core"},{"id":"c57q5","stem":{"en":"Why does normal ventricular myocardium not undergo sustained tetanic contraction like skeletal muscle?","tr":"Normal ventrikül miyokardı neden iskelet kası gibi sürekli tetanik kasılmaya girmez?"},"options":[{"en":"Its mechanical contraction outlasts a very brief refractory period","tr":"Mekanik kasılması çok kısa refrakter dönemden daha uzun sürer"},{"en":"Its calcium transients cannot overlap because calcium is never stored intracellularly","tr":"Kalsiyum hücre içinde hiç depolanmadığından kalsiyum geçişleri örtüşemez"},{"en":"Its refractory period is shorter than that of skeletal muscle","tr":"Refrakter dönemi iskelet kasındakinden kısadır"},{"en":"It requires a new autonomic impulse for every action potential","tr":"Her aksiyon potansiyeli için yeni otonom uyarı gerekir"},{"en":"Its long refractory period overlaps most of the contraction","tr":"Uzun refrakter dönemi kasılmanın büyük bölümüyle örtüşür"}],"answer":4,"explanation":{"en":"The prolonged cardiac action potential keeps sodium channels refractory during most of mechanical systole. This prevents rapid summation into tetanus and permits the relaxation needed for diastolic filling.","tr":"Uzamış kardiyak aksiyon potansiyeli, mekanik sistolün büyük bölümünde sodyum kanallarını refrakter durumda tutar. Bu, hızlı summasyonla tetanus oluşmasını engeller ve diyastolik doluş için gereken gevşemeye izin verir."},"sourcePages":[255],"difficulty":"core"}]},{"id":58,"title":{"en":"The Electrocardiogram","tr":"Elektrokardiyogram"},"startPage":262,"section":4,"endPage":266,"questions":[{"id":"c58q1","stem":{"en":"Which electrical event is represented primarily by the QRS complex?","tr":"QRS kompleksi esas olarak hangi elektriksel olayı temsil eder?"},"options":[{"en":"Atrial depolarisation","tr":"Atriyal depolarizasyon"},{"en":"Ventricular repolarisation","tr":"Ventriküler repolarizasyon"},{"en":"Isolated sinoatrial nodal discharge","tr":"İzole sinoatriyal düğüm deşarjı"},{"en":"The electrically silent ventricular filling period","tr":"Elektriksel olarak sessiz ventrikül doluş dönemi"},{"en":"Ventricular depolarisation","tr":"Ventriküler depolarizasyon"}],"answer":4,"explanation":{"en":"The QRS complex reflects the spread of depolarisation through the ventricular myocardium. The P wave represents atrial depolarisation and the T wave ventricular repolarisation.","tr":"QRS kompleksi depolarizasyonun ventrikül miyokardına yayılmasını yansıtır. P dalgası atriyal depolarizasyonu, T dalgası ise ventriküler repolarizasyonu temsil eder."},"sourcePages":[262],"difficulty":"core"},{"id":"c58q2","stem":{"en":"How is the PR interval measured?","tr":"PR aralığı nasıl ölçülür?"},"options":[{"en":"From the end of the P wave to the R-wave peak","tr":"P dalgasının sonundan R dalgasının tepesine kadar"},{"en":"From the beginning of the P wave to the beginning of the QRS complex","tr":"P dalgasının başlangıcından QRS kompleksinin başlangıcına kadar"},{"en":"From the beginning of QRS to the end of the T wave","tr":"QRS başlangıcından T dalgasının sonuna kadar"},{"en":"From the end of QRS to the beginning of the T wave","tr":"QRS sonundan T dalgasının başlangıcına kadar"},{"en":"Between successive P-wave peaks only","tr":"Yalnızca ardışık P dalgalarının tepeleri arasında"}],"answer":1,"explanation":{"en":"The PR interval spans the onset of atrial depolarisation to the onset of ventricular depolarisation. AV nodal delay contributes substantially, but the interval is not a measurement of the AV node alone.","tr":"PR aralığı, atriyal depolarizasyonun başlangıcından ventriküler depolarizasyonun başlangıcına uzanır. AV düğüm gecikmesi önemli katkı sağlar, ancak aralık yalnızca AV düğümü ölçmez."},"sourcePages":[262],"difficulty":"core"},{"id":"c58q3","stem":{"en":"At a paper speed of 25 mm/s, a regular rhythm has four large squares between R waves. What is the heart rate?","tr":"Kağıt hızı 25 mm/sn iken düzenli bir ritimde R dalgaları arasında dört büyük kare vardır. Kalp hızı kaçtır?"},"options":[{"en":"60 beats/min","tr":"60 atım/dk"},{"en":"80 beats/min","tr":"80 atım/dk"},{"en":"100 beats/min","tr":"100 atım/dk"},{"en":"75 beats/min","tr":"75 atım/dk"},{"en":"120 beats/min","tr":"120 atım/dk"}],"answer":3,"explanation":{"en":"At 25 mm/s, each large square represents 0.2 seconds, so four squares give an RR interval of 0.8 seconds. Heart rate is 60/0.8 = 75 beats/min, equivalent to 300 divided by four.","tr":"25 mm/sn hızında her büyük kare 0,2 saniyedir; dört kare 0,8 saniyelik RR aralığı verir. Kalp hızı 60/0,8 = 75 atım/dk olur; bu, 300’ün dörde bölünmesiyle aynıdır."},"sourcePages":[262],"difficulty":"applied"},{"id":"c58q4","stem":{"en":"The normal ST segment most closely corresponds to which ventricular action-potential phase?","tr":"Normal ST segmenti, ventriküler aksiyon potansiyelinin en çok hangi fazına karşılık gelir?"},"options":[{"en":"Phase 0, the rapid upstroke","tr":"Faz 0, hızlı yükseliş"},{"en":"Phase 1, early repolarisation alone","tr":"Yalnızca faz 1, erken repolarizasyon"},{"en":"Phase 2, the plateau","tr":"Faz 2, plato"},{"en":"Phase 3, final repolarisation","tr":"Faz 3, son repolarizasyon"},{"en":"Phase 4, resting electrical diastole","tr":"Faz 4, istirahatteki elektriksel diyastol"}],"answer":2,"explanation":{"en":"During the ST segment, ventricular tissue is largely depolarised and individual myocytes are in the plateau phase. A relatively uniform electrical state creates little net surface voltage difference, producing an approximately isoelectric segment.","tr":"ST segmentinde ventrikül dokusu büyük ölçüde depolarizedir ve tek tek miyositler plato fazındadır. Görece homojen elektriksel durum yüzeyde çok az net voltaj farkı oluşturur; bu nedenle segment yaklaşık izoelektriktir."},"sourcePages":[262],"difficulty":"core"},{"id":"c58q5","stem":{"en":"Which electrode pair defines standard limb lead II?","tr":"Standart ekstremite derivasyonu II hangi elektrot çiftiyle tanımlanır?"},"options":[{"en":"Right arm negative and left leg positive","tr":"Sağ kol negatif, sol bacak pozitif"},{"en":"Right arm negative and left arm positive","tr":"Sağ kol negatif, sol kol pozitif"},{"en":"Left arm negative and left leg positive","tr":"Sol kol negatif, sol bacak pozitif"},{"en":"Left leg negative and right arm positive","tr":"Sol bacak negatif, sağ kol pozitif"},{"en":"Right leg negative and left arm positive","tr":"Sağ bacak negatif, sol kol pozitif"}],"answer":0,"explanation":{"en":"Lead II measures the potential difference from the right arm to the left leg. Different lead orientations view the same cardiac electrical activity from different directions.","tr":"Derivasyon II, sağ koldan sol bacağa olan potansiyel farkını ölçer. Farklı derivasyon yönelimleri aynı kardiyak elektriksel aktiviteyi farklı açılardan değerlendirir."},"sourcePages":[263,264],"difficulty":"core"}]},{"id":59,"title":{"en":"Autonomic Nervous System","tr":"Otonom Sinir Sistemi"},"startPage":267,"section":4,"endPage":271,"questions":[{"id":"c59q1","stem":{"en":"Where do most sympathetic preganglionic neuron cell bodies originate?","tr":"Sempatik pregangliyonik nöron gövdelerinin çoğu nereden köken alır?"},"options":[{"en":"Thoracolumbar spinal cord","tr":"Torakolomber omurilik"},{"en":"Brainstem and sacral parasympathetic nuclei","tr":"Beyin sapı ve sakral parasempatik çekirdekler"},{"en":"Dorsal root ganglia","tr":"Dorsal kök gangliyonları"},{"en":"Paravertebral sympathetic ganglia","tr":"Paravertebral sempatik gangliyonlar"},{"en":"Prevertebral sympathetic ganglia","tr":"Prevertebral sempatik gangliyonlar"}],"answer":0,"explanation":{"en":"Sympathetic preganglionic neurons arise from the thoracolumbar cord, principally around T1–L2. Craniosacral outflow characterises the parasympathetic division instead.","tr":"Sempatik pregangliyonik nöronlar, başlıca T1–L2 civarında torakolomber omurilikten çıkar. Kraniyosakral çıkış ise parasempatik bölümü tanımlar."},"sourcePages":[267,270],"difficulty":"core"},{"id":"c59q2","stem":{"en":"Which transmitter–receptor pairing mediates the main fast synapse in both sympathetic and parasympathetic ganglia?","tr":"Hem sempatik hem parasempatik gangliyonlardaki temel hızlı sinapsı hangi nörotransmiter-reseptör çifti oluşturur?"},"options":[{"en":"Noradrenaline at alpha-1 receptors","tr":"Alfa-1 reseptörlerinde noradrenalin"},{"en":"Acetylcholine at cardiac M2 receptors","tr":"Kardiyak M2 reseptörlerinde asetilkolin"},{"en":"Acetylcholine at neuronal nicotinic receptors","tr":"Nöronal nikotinik reseptörlerde asetilkolin"},{"en":"Adrenaline at beta-2 receptors","tr":"Beta-2 reseptörlerinde adrenalin"},{"en":"GABA at GABA-A receptors","tr":"GABA-A reseptörlerinde GABA"}],"answer":2,"explanation":{"en":"Both autonomic divisions use acetylcholine acting at neuronal nicotinic receptors in their ganglia. Their postganglionic target synapses then differ, usually using noradrenaline or muscarinic acetylcholine signalling.","tr":"Her iki otonom bölüm de gangliyonlarında nöronal nikotinik reseptörlere etki eden asetilkolin kullanır. Postgangliyonik hedef sinapsları ise genellikle noradrenalin veya muskarinik asetilkolin sinyalleşmesi kullanarak farklılaşır."},"sourcePages":[268,269,270],"difficulty":"core"},{"id":"c59q3","stem":{"en":"Which description correctly identifies the usual autonomic supply to eccrine sweat glands?","tr":"Ekrin ter bezlerinin olağan otonom innervasyonunu hangi tanım doğru belirtir?"},"options":[{"en":"Parasympathetic fibres releasing noradrenaline at alpha receptors","tr":"Alfa reseptörlerine noradrenalin salan parasempatik lifler"},{"en":"Sympathetic fibres releasing noradrenaline at nicotinic receptors","tr":"Nikotinik reseptörlere noradrenalin salan sempatik lifler"},{"en":"Somatic alpha motor neurons acting at muscle nicotinic receptors","tr":"Kas nikotinik reseptörlerine etki eden somatik alfa motor nöronlar"},{"en":"Parasympathetic fibres releasing adrenaline at beta-1 receptors","tr":"Beta-1 reseptörlerine adrenalin salan parasempatik lifler"},{"en":"Sympathetic postganglionic fibres releasing acetylcholine at muscarinic receptors","tr":"Muskarinik reseptörlere asetilkolin salan sempatik postgangliyonik lifler"}],"answer":4,"explanation":{"en":"Eccrine sweat glands are a major exception to the usual adrenergic sympathetic target synapse. Their sympathetic postganglionic fibres release acetylcholine, which acts at muscarinic receptors.","tr":"Ekrin ter bezleri, olağan adrenerjik sempatik hedef sinapsının önemli bir istisnasıdır. Sempatik postgangliyonik lifleri muskarinik reseptörlere etki eden asetilkolin salar."},"sourcePages":[268],"difficulty":"core"},{"id":"c59q4","stem":{"en":"How is the adrenal medulla directly activated by the autonomic nervous system?","tr":"Adrenal medulla otonom sinir sistemi tarafından doğrudan nasıl aktive edilir?"},"options":[{"en":"Postganglionic parasympathetic acetylcholine acts on M2 receptors","tr":"Postgangliyonik parasempatik asetilkolin M2 reseptörlerine etki eder"},{"en":"Postganglionic sympathetic noradrenaline acts only on alpha-1 receptors","tr":"Postgangliyonik sempatik noradrenalin yalnızca alfa-1 reseptörlerine etki eder"},{"en":"Somatic motor acetylcholine acts on skeletal-muscle receptors","tr":"Somatik motor asetilkolin iskelet kası reseptörlerine etki eder"},{"en":"Preganglionic sympathetic acetylcholine acts on nicotinic receptors","tr":"Pregangliyonik sempatik asetilkolin nikotinik reseptörlere etki eder"},{"en":"Preganglionic parasympathetic dopamine acts on D2 receptors","tr":"Pregangliyonik parasempatik dopamin D2 reseptörlerine etki eder"}],"answer":3,"explanation":{"en":"Chromaffin cells function as modified sympathetic postganglionic cells and receive a preganglionic cholinergic input. They release catecholamines into the bloodstream rather than through a conventional postganglionic axon.","tr":"Kromafin hücreler, değişime uğramış sempatik postgangliyonik hücreler gibi davranır ve pregangliyonik kolinerjik girdi alır. Katekolaminleri klasik bir postgangliyonik akson yerine kan dolaşımına salarlar."},"sourcePages":[268],"difficulty":"core"},{"id":"c59q5","stem":{"en":"Which receptor activation most directly increases cardiac rate and contractility through a Gs-coupled pathway?","tr":"Hangi reseptörün aktivasyonu Gs bağlantılı yol üzerinden kalp hızını ve kasılma gücünü en doğrudan artırır?"},"options":[{"en":"Alpha-1 adrenergic receptor","tr":"Alfa-1 adrenerjik reseptör"},{"en":"Beta-1 adrenergic receptor","tr":"Beta-1 adrenerjik reseptör"},{"en":"Alpha-2 adrenergic receptor","tr":"Alfa-2 adrenerjik reseptör"},{"en":"Muscarinic M2 receptor","tr":"Muskarinik M2 reseptörü"},{"en":"Neuronal nicotinic receptor","tr":"Nöronal nikotinik reseptör"}],"answer":1,"explanation":{"en":"Cardiac beta-1 receptors couple to Gs and increase intracellular cyclic AMP signalling. M2 receptor activation has the opposing tendency in nodal tissue through inhibitory G-protein signalling.","tr":"Kardiyak beta-1 reseptörleri Gs’ye bağlanarak hücre içi siklik AMP sinyalleşmesini artırır. M2 reseptör aktivasyonu ise inhibitör G proteini sinyalleşmesiyle düğüm dokusunda zıt yönde etki gösterir."},"sourcePages":[270,271],"difficulty":"core"}]},{"id":60,"title":{"en":"Pain Physiology","tr":"Ağrı Fizyolojisi"},"startPage":272,"section":4,"endPage":275,"questions":[{"id":"c60q1","stem":{"en":"Which statement best distinguishes nociception from pain?","tr":"Nosisepsiyonu ağrıdan en iyi hangi ifade ayırır?"},"options":[{"en":"Nociception and pain are identical measurements of tissue injury","tr":"Nosisepsiyon ve ağrı, doku hasarının özdeş ölçümleridir"},{"en":"Nociception is neural encoding of noxious stimuli; pain is a personal sensory and emotional experience","tr":"Nosisepsiyon zararlı uyaranların sinirsel kodlanmasıdır; ağrı kişisel bir duyusal ve duygusal deneyimdir"},{"en":"Pain requires demonstrable peripheral tissue damage in every case","tr":"Ağrı her durumda gösterilebilir periferik doku hasarı gerektirir"},{"en":"Nociception occurs only in the cerebral cortex","tr":"Nosisepsiyon yalnızca serebral kortekste oluşur"},{"en":"Pain intensity can be determined solely from sensory-neuron firing","tr":"Ağrı şiddeti yalnızca duyu nöronlarının ateşlemesinden belirlenebilir"}],"answer":1,"explanation":{"en":"Nociceptive signalling and the experience of pain are related but distinct. Activity in sensory pathways alone does not establish the presence or intensity of a person’s pain.","tr":"Nosiseptif sinyalleşme ve ağrı deneyimi ilişkili, ancak farklı olgulardır. Duyusal yollardaki aktivite tek başına kişinin ağrısının varlığını veya şiddetini belirlemez."},"sourcePages":[272],"difficulty":"core"},{"id":"c60q2","stem":{"en":"Which fibre type principally carries the early, sharp component of pain after a brief skin injury?","tr":"Kısa süreli bir deri yaralanmasından sonra ağrının erken, keskin bileşenini esas olarak hangi lif taşır?"},"options":[{"en":"Unmyelinated C fibre","tr":"Miyelinsiz C lifi"},{"en":"A-alpha motor fibre","tr":"A-alfa motor lifi"},{"en":"Gamma motor fibre","tr":"Gama motor lifi"},{"en":"Myelinated A-delta fibre","tr":"Miyelinli A-delta lifi"},{"en":"Preganglionic autonomic B fibre","tr":"Pregangliyonik otonom B lifi"}],"answer":3,"explanation":{"en":"A-delta axons conduct more rapidly than the unmyelinated C fibres and contribute to the first sharp pain. C fibres commonly contribute to the later, duller and less precisely localised component.","tr":"A-delta aksonları miyelinsiz C liflerinden daha hızlı iletir ve ilk keskin ağrıya katkı sağlar. C lifleri ise genellikle daha geç, künt ve yeri daha belirsiz bileşene katkıda bulunur."},"sourcePages":[272,273],"difficulty":"core"},{"id":"c60q3","stem":{"en":"A normally painless light brush on the skin is perceived as painful. What is this phenomenon called?","tr":"Deriye normalde ağrısız olan hafif fırçalama ağrılı algılanıyor. Bu olguya ne ad verilir?"},"options":[{"en":"Allodynia","tr":"Allodini"},{"en":"Hyperalgesia","tr":"Hiperaljezi"},{"en":"Hypoalgesia","tr":"Hipoaljezi"},{"en":"Hyperpathia","tr":"Hiperpati"},{"en":"Paresthesia","tr":"Parestezi"}],"answer":0,"explanation":{"en":"Allodynia describes pain caused by a stimulus that is not normally painful. Hyperalgesia instead describes an increased pain response to a stimulus that normally causes pain.","tr":"Allodini, normalde ağrılı olmayan bir uyaranın ağrı oluşturmasını tanımlar. Hiperaljezi ise normalde ağrı oluşturan bir uyarana artmış ağrı yanıtını ifade eder."},"sourcePages":[275],"difficulty":"applied"},{"id":"c60q4","stem":{"en":"Which combination is characteristic of opioid-receptor inhibition of nociceptive transmission?","tr":"Opioid reseptörlerinin nosiseptif iletimi inhibe etmesinde hangi değişiklik çifti tipiktir?"},"options":[{"en":"Increased presynaptic calcium entry and decreased postsynaptic potassium conductance","tr":"Presinaptik kalsiyum girişinin artması ve postsinaptik potasyum iletkenliğinin azalması"},{"en":"Increased presynaptic calcium entry and increased postsynaptic sodium conductance","tr":"Presinaptik kalsiyum girişinin ve postsinaptik sodyum iletkenliğinin artması"},{"en":"Reduced presynaptic potassium conductance and increased transmitter release","tr":"Presinaptik potasyum iletkenliğinin azalması ve nörotransmiter salınımının artması"},{"en":"Increased postsynaptic sodium conductance with membrane depolarisation","tr":"Membran depolarizasyonuyla postsinaptik sodyum iletkenliğinin artması"},{"en":"Reduced presynaptic calcium entry and increased postsynaptic potassium conductance","tr":"Presinaptik kalsiyum girişinin azalması ve postsinaptik potasyum iletkenliğinin artması"}],"answer":4,"explanation":{"en":"Reduced presynaptic calcium entry limits neurotransmitter release. Increased postsynaptic potassium conductance tends to hyperpolarise the neuron, making propagation of nociceptive signals less likely.","tr":"Presinaptik kalsiyum girişinin azalması nörotransmiter salınımını sınırlar. Postsinaptik potasyum iletkenliğinin artması nöronu hiperpolarize etme eğilimindedir ve nosiseptif sinyallerin iletilme olasılığını azaltır."},"sourcePages":[273,274],"difficulty":"core"},{"id":"c60q5","stem":{"en":"Which underlying feature defines neuropathic pain?","tr":"Nöropatik ağrıyı tanımlayan temel özellik hangisidir?"},"options":[{"en":"Any pain persisting longer than the usual healing period","tr":"Olağan iyileşme süresinden uzun süren herhangi bir ağrı"},{"en":"Pain from inflammatory activation of otherwise intact nociceptors","tr":"Başka açıdan sağlam nosiseptörlerin inflamatuvar aktivasyonundan doğan ağrı"},{"en":"A lesion or disease of the somatosensory nervous system","tr":"Somatosensoriyel sinir sisteminde lezyon veya hastalık"},{"en":"Any pain that is described as severe or distressing","tr":"Şiddetli veya sıkıntı verici olarak tarif edilen her ağrı"},{"en":"Any pain relieved by an opioid analgesic","tr":"Opioid analjezikle hafifleyen herhangi bir ağrı"}],"answer":2,"explanation":{"en":"Neuropathic pain requires a lesion or disease affecting the somatosensory system, whether peripheral or central. A burning or electric-shock quality can be suggestive but is not the definition by itself.","tr":"Nöropatik ağrı, periferik veya merkezi somatosensoriyel sistemi etkileyen bir lezyon ya da hastalık gerektirir. Yanma veya elektrik çarpması niteliği düşündürücü olabilir, ancak tek başına tanım değildir."},"sourcePages":[275],"difficulty":"core"}]},{"id":61,"title":{"en":"The Eye and Intraocular Pressure","tr":"Göz ve Göz İçi Basıncı"},"startPage":276,"section":4,"endPage":278,"questions":[{"id":"c61q1","stem":{"en":"Which sequence describes the main conventional outflow route of aqueous humour?","tr":"Aköz hümörün başlıca konvansiyonel dışa akış yolunu hangi sıra tanımlar?"},"options":[{"en":"Posterior chamber → trabecular meshwork → anterior chamber → pupil → Schlemm canal","tr":"Arka kamara → trabeküler ağ → ön kamara → pupil → Schlemm kanalı"},{"en":"Anterior chamber → pupil → posterior chamber → trabecular meshwork → Schlemm canal","tr":"Ön kamara → pupil → arka kamara → trabeküler ağ → Schlemm kanalı"},{"en":"Posterior chamber → pupil → anterior chamber → trabecular meshwork → Schlemm canal","tr":"Arka kamara → pupil → ön kamara → trabeküler ağ → Schlemm kanalı"},{"en":"Posterior chamber → pupil → anterior chamber → Schlemm canal → trabecular meshwork","tr":"Arka kamara → pupil → ön kamara → Schlemm kanalı → trabeküler ağ"},{"en":"Posterior chamber → vitreous chamber → anterior chamber → trabecular meshwork → Schlemm canal","tr":"Arka kamara → vitreus boşluğu → ön kamara → trabeküler ağ → Schlemm kanalı"}],"answer":2,"explanation":{"en":"Aqueous humour is secreted into the posterior chamber and reaches the anterior chamber through the pupil. Conventional drainage then passes through the trabecular meshwork and Schlemm canal towards the episcleral veins.","tr":"Aköz hümör arka kamaraya salgılanır ve pupilden ön kamaraya geçer. Konvansiyonel drenaj daha sonra trabeküler ağ ve Schlemm kanalı üzerinden episkleral venlere yönelir."},"sourcePages":[277,278],"difficulty":"core"},{"id":"c61q2","stem":{"en":"With aqueous production unchanged, how does increased episcleral venous pressure tend to affect intraocular pressure?","tr":"Aköz üretimi değişmezken episkleral venöz basıncın artması göz içi basıncını nasıl etkileme eğilimindedir?"},"options":[{"en":"It lowers intraocular pressure by increasing the outflow pressure gradient","tr":"Dışa akış basınç gradyanını artırarak göz içi basıncını düşürür"},{"en":"It has no effect because trabecular outflow depends only on production rate","tr":"Trabeküler dışa akış yalnızca üretim hızına bağlı olduğundan etkisi yoktur"},{"en":"It lowers intraocular pressure by increasing conventional outflow facility","tr":"Konvansiyonel dışa akış kolaylığını artırarak göz içi basıncını düşürür"},{"en":"It keeps intraocular pressure fixed by reversing aqueous flow through the pupil","tr":"Pupilden aköz akımını tersine çevirerek göz içi basıncını sabit tutar"},{"en":"It raises intraocular pressure by reducing the drainage pressure gradient","tr":"Drenaj basınç gradyanını azaltarak göz içi basıncını yükseltir"}],"answer":4,"explanation":{"en":"Aqueous outflow depends partly on the pressure difference between the eye and the draining veins. A rise in downstream venous pressure opposes drainage and tends to increase intraocular pressure.","tr":"Aköz dışa akışı kısmen göz ile drenaj venleri arasındaki basınç farkına bağlıdır. Çıkış tarafındaki venöz basıncın yükselmesi drenaja karşı koyar ve göz içi basıncını artırma eğilimindedir."},"sourcePages":[278],"difficulty":"applied"},{"id":"c61q3","stem":{"en":"Which retinal specialisation is most important for high-acuity central vision?","tr":"Yüksek keskinlikte merkezi görme için en önemli retinal özelleşme hangisidir?"},"options":[{"en":"A high density of rods in the peripheral retina","tr":"Periferik retinada yüksek çubuk yoğunluğu"},{"en":"A high density of cones at the fovea","tr":"Foveada yüksek koni yoğunluğu"},{"en":"Convergence of many rods onto a common output pathway","tr":"Birçok çubuğun ortak çıkış yolunda birleşmesi"},{"en":"The photoreceptor-free region at the optic disc","tr":"Optik diskteki fotoreseptör içermeyen bölge"},{"en":"A low cone density with broad receptive fields","tr":"Geniş reseptif alanlarla birlikte düşük koni yoğunluğu"}],"answer":1,"explanation":{"en":"The fovea is specialised for detailed central vision and contains densely packed cones. Rods support dim-light vision, while the optic disc has no photoreceptors and creates the physiological blind spot.","tr":"Fovea ayrıntılı merkezi görme için özelleşmiştir ve yoğun yerleşimli koniler içerir. Çubuklar loş ışıkta görmeyi destekler; optik diskte ise fotoreseptör bulunmaz ve fizyolojik kör nokta oluşur."},"sourcePages":[276,277],"difficulty":"core"},{"id":"c61q4","stem":{"en":"Parasympathetic fibres travelling with cranial nerve III constrict the pupil by activating which muscle?","tr":"III. kraniyal sinirle taşınan parasempatik lifler hangi kası aktive ederek pupili daraltır?"},"options":[{"en":"Sphincter pupillae","tr":"Sfinkter pupilla"},{"en":"Dilator pupillae","tr":"Dilatatör pupilla"},{"en":"Superior tarsal muscle","tr":"Süperior tarsal kas"},{"en":"Lateral rectus","tr":"Lateral rektus"},{"en":"Orbicularis oculi","tr":"Orbikülaris okuli"}],"answer":0,"explanation":{"en":"Parasympathetic fibres relay in the ciliary ganglion and reach the sphincter pupillae through short ciliary nerves. Sympathetic activation instead contracts the dilator pupillae and enlarges the pupil.","tr":"Parasempatik lifler siliyer gangliyonda sinaps yapar ve kısa siliyer sinirlerle sfinkter pupillaya ulaşır. Sempatik aktivasyon ise dilatatör pupillayı kasarak pupili büyütür."},"sourcePages":[277],"difficulty":"core"},{"id":"c61q5","stem":{"en":"Which muscle loses sympathetic support and contributes to the partial ptosis of Horner syndrome?","tr":"Horner sendromundaki kısmi pitoza, hangi kasın sempatik desteğini kaybetmesi katkıda bulunur?"},"options":[{"en":"Levator palpebrae superioris","tr":"Levator palpebra superioris"},{"en":"Orbicularis oculi","tr":"Orbikülaris okuli"},{"en":"Inferior oblique","tr":"İnferior oblik"},{"en":"Superior tarsal muscle","tr":"Süperior tarsal kas"},{"en":"Lateral rectus","tr":"Lateral rektus"}],"answer":3,"explanation":{"en":"Loss of sympathetic input weakens the superior tarsal muscle and causes mild upper-lid drooping. The main levator muscle is supplied by cranial nerve III, so it is not directly paralysed by an isolated sympathetic lesion.","tr":"Sempatik girdinin kaybı süperior tarsal kası zayıflatır ve üst kapakta hafif düşüklük oluşturur. Temel kaldırıcı kas III. kraniyal sinir tarafından innerve edildiğinden, izole sempatik lezyonda doğrudan paralize olmaz."},"sourcePages":[277],"difficulty":"applied"}]},{"id":62,"title":{"en":"Saliva, Oesophagus and Swallowing","tr":"Tükürük, Özofagus ve Yutma"},"startPage":279,"section":5,"endPage":282,"questions":[{"id":"c62q1","stem":{"en":"Why is resting final saliva usually hypotonic compared with plasma?","tr":"İstirahatte son tükürük salgısı neden genellikle plazmaya göre hipotoniktir?"},"options":[{"en":"The primary acinar secretion is already strongly hypotonic before ductal transport","tr":"Primer asiner salgı kanal taşınması başlamadan önce zaten belirgin hipotoniktir"},{"en":"Duct cells secrete sodium chloride faster than they reabsorb it","tr":"Kanal hücreleri sodyum klorürü geri emdiğinden daha hızlı salgılar"},{"en":"Selective water reabsorption concentrates the final saliva","tr":"Seçici su geri emilimi son tükürüğü yoğunlaştırır"},{"en":"Ductal modification removes more sodium and chloride than the solute secreted back","tr":"Kanal değişiklikleri, geri salgılanan solütten daha fazla sodyum ve klorür uzaklaştırır"},{"en":"Ductal potassium reabsorption exceeds sodium reabsorption","tr":"Kanallarda potasyum geri emilimi sodyum geri emiliminden fazladır"}],"answer":3,"explanation":{"en":"The primary acinar secretion is approximately isotonic. Ducts reabsorb sodium and chloride while secreting potassium and bicarbonate, producing net solute removal. Because the modifying ducts are relatively impermeable to water, water does not follow proportionately and the final saliva becomes hypotonic.","tr":"Primer asiner salgı yaklaşık izotoniktir. Kanallar potasyum ve bikarbonat salgılarken sodyum ve klorürü geri emer; net solüt uzaklaştırılması gerçekleşir. Salgıyı değiştiren kanallar suya görece geçirimsiz olduğundan su aynı oranda eşlik etmez ve son tükürük hipotonik hale gelir."},"sourcePages":[279],"difficulty":"core"},{"id":"c62q2","stem":{"en":"Which cranial nerve carries the preganglionic parasympathetic supply to the parotid gland?","tr":"Parotis bezinin pregangliyonik parasempatik liflerini hangi kraniyal sinir taşır?"},"options":[{"en":"Glossopharyngeal nerve, IX","tr":"Glossofaringeal sinir, IX"},{"en":"Facial nerve, VII","tr":"Fasiyal sinir, VII"},{"en":"Vagus nerve, X","tr":"Vagus siniri, X"},{"en":"Oculomotor nerve, III","tr":"Okülomotor sinir, III"},{"en":"Hypoglossal nerve, XII","tr":"Hipoglossal sinir, XII"}],"answer":0,"explanation":{"en":"The parotid parasympathetic pathway originates with cranial nerve IX and relays in the otic ganglion. Cranial nerve VII supplies the preganglionic parasympathetic pathways to the submandibular and sublingual glands instead.","tr":"Parotisin parasempatik yolu IX. kraniyal sinirle başlar ve otik gangliyonda sinaps yapar. Submandibüler ve sublingual bezlerin pregangliyonik parasempatik yollarını ise VII. kraniyal sinir sağlar."},"sourcePages":[280],"difficulty":"core"},{"id":"c62q3","stem":{"en":"What normally happens to breathing during the pharyngeal phase of swallowing?","tr":"Yutmanın faringeal fazında solunum normalde nasıl değişir?"},"options":[{"en":"It accelerates while the vocal cords remain abducted","tr":"Vokal kordlar açık kalırken hızlanır"},{"en":"It continues unchanged throughout the phase","tr":"Faz boyunca değişmeden sürer"},{"en":"It briefly stops while the laryngeal inlet is protected","tr":"Larenks girişi korunurken kısa süreli durur"},{"en":"It becomes a sustained forced inspiration through an open glottis","tr":"Açık glottisten sürekli zorlu inspirasyona dönüşür"},{"en":"It stops only if the swallow is voluntary","tr":"Yalnızca yutma istemliyse durur"}],"answer":2,"explanation":{"en":"The pharyngeal swallowing programme coordinates airway closure with a brief respiratory pause. This helps route the bolus into the oesophagus while limiting entry into the trachea.","tr":"Faringeal yutma programı, hava yolunun kapanmasını kısa bir solunum duraklamasıyla koordine eder. Bu, bolusu özofagusa yönlendirirken trakeaya girişini sınırlamaya yardımcı olur."},"sourcePages":[280],"difficulty":"core"},{"id":"c62q4","stem":{"en":"What principally triggers secondary oesophageal peristalsis?","tr":"Sekonder özofagus peristaltizmini esas olarak ne tetikler?"},"options":[{"en":"The sight of food before swallowing","tr":"Yutmadan önce yiyeceğin görülmesi"},{"en":"Distension of the oesophageal wall by retained contents","tr":"Kalan içeriklerin özofagus duvarını germesi"},{"en":"Voluntary contraction of the tongue alone","tr":"Yalnızca dilin istemli kasılması"},{"en":"A fall in arterial oxygen tension","tr":"Arteriyel oksijen basıncının düşmesi"},{"en":"Gastric acid secretion without oesophageal stimulation","tr":"Özofagus uyarılmadan mide asidi salgılanması"}],"answer":1,"explanation":{"en":"Secondary peristaltic waves respond to oesophageal distension and help clear residual contents. Primary peristalsis is initiated as part of the swallowing sequence.","tr":"Sekonder peristaltik dalgalar özofagus gerilmesine yanıt verir ve kalan içeriğin temizlenmesine yardımcı olur. Primer peristaltizm ise yutma dizisinin bir parçası olarak başlatılır."},"sourcePages":[280],"difficulty":"core"},{"id":"c62q5","stem":{"en":"Lower oesophageal sphincter pressure is 25 mmHg and intragastric pressure is 8 mmHg. What is the barrier pressure?","tr":"Alt özofagus sfinkter basıncı 25 mmHg ve intragastrik basınç 8 mmHg’dir. Bariyer basıncı kaçtır?"},"options":[{"en":"33 mmHg","tr":"33 mmHg"},{"en":"25 mmHg","tr":"25 mmHg"},{"en":"8 mmHg","tr":"8 mmHg"},{"en":"3.1 mmHg","tr":"3,1 mmHg"},{"en":"17 mmHg","tr":"17 mmHg"}],"answer":4,"explanation":{"en":"Barrier pressure is lower oesophageal sphincter pressure minus intragastric pressure, giving 25 − 8 = 17 mmHg. A lower sphincter pressure or higher gastric pressure reduces this pressure difference.","tr":"Bariyer basıncı, alt özofagus sfinkter basıncından intragastrik basıncın çıkarılmasıdır: 25 − 8 = 17 mmHg. Sfinkter basıncının azalması veya mide basıncının artması bu farkı küçültür."},"sourcePages":[281],"difficulty":"applied"}]},{"id":63,"title":{"en":"Stomach and Vomiting","tr":"Mide ve Kusma"},"startPage":283,"section":5,"endPage":288,"questions":[{"id":"c63q1","stem":{"en":"Which apical transporter is the final active step in gastric hydrogen-ion secretion by parietal cells?","tr":"Parietal hücrelerin mideye hidrojen iyonu salgılamasında son aktif basamağı hangi apikal taşıyıcı oluşturur?"},"options":[{"en":"Sodium–potassium ATPase","tr":"Sodyum-potasyum ATPaz"},{"en":"Sodium–glucose cotransporter","tr":"Sodyum-glukoz kotransporteri"},{"en":"Sodium–calcium exchanger","tr":"Sodyum-kalsiyum değiştiricisi"},{"en":"GLUT1 glucose transporter","tr":"GLUT1 glukoz taşıyıcısı"},{"en":"Hydrogen–potassium ATPase","tr":"Hidrojen-potasyum ATPaz"}],"answer":4,"explanation":{"en":"The apical hydrogen–potassium ATPase exchanges intracellular hydrogen ions for luminal potassium. The basolateral sodium–potassium ATPase supports ionic gradients but is not the luminal proton pump.","tr":"Apikal hidrojen-potasyum ATPaz, hücre içi hidrojen iyonlarını lümendeki potasyumla değiştirir. Bazolateral sodyum-potasyum ATPaz iyon gradyanlarını destekler, ancak lümene bakan proton pompası değildir."},"sourcePages":[284,285],"difficulty":"core"},{"id":"c63q2","stem":{"en":"What produces the postprandial alkaline tide associated with gastric acid secretion?","tr":"Mide asidi salgılanmasına eşlik eden yemek sonrası alkali dalgayı ne oluşturur?"},"options":[{"en":"Hydrogen ions leave parietal cells across the basolateral membrane","tr":"Hidrojen iyonları parietal hücrelerden bazolateral membrandan çıkar"},{"en":"Bicarbonate exits parietal cells into blood as hydrogen ions are secreted into the lumen","tr":"Hidrojen iyonları lümene salgılanırken bikarbonatın parietal hücrelerden kana çıkması"},{"en":"Bicarbonate is consumed in blood while chloride enters the lumen","tr":"Klorür lümene girerken kandaki bikarbonat tüketilir"},{"en":"Renal bicarbonate retention is the immediate gastric-cell mechanism","tr":"Böbrekte bikarbonat tutulması, mide hücresindeki doğrudan mekanizmadır"},{"en":"Bicarbonate moves from blood into the stomach in exchange for luminal hydrogen","tr":"Bikarbonat lümendeki hidrojen karşılığında kandan mideye geçer"}],"answer":1,"explanation":{"en":"Carbonic anhydrase generates hydrogen ions and bicarbonate within parietal cells. Their transport to opposite sides of the cell adds acid to the lumen while transiently adding bicarbonate to the blood.","tr":"Karbonik anhidraz parietal hücre içinde hidrojen iyonları ve bikarbonat oluşturur. Hücrenin karşıt taraflarına taşınmaları, lümene asit eklenirken kana geçici olarak bikarbonat eklenmesini sağlar."},"sourcePages":[284],"difficulty":"core"},{"id":"c63q3","stem":{"en":"Loss of gastric intrinsic factor most directly impairs absorption of which nutrient at which site?","tr":"Midedeki intrinsik faktörün kaybı, hangi besin öğesinin hangi bölgedeki emilimini en doğrudan bozar?"},"options":[{"en":"Vitamin B12 in the duodenum","tr":"B12 vitamininin duodenumda emilimini"},{"en":"Iron in the duodenum","tr":"Demirin duodenumda emilimini"},{"en":"Folate in the proximal small intestine","tr":"Folatın proksimal ince bağırsakta emilimini"},{"en":"Vitamin B12 in the terminal ileum","tr":"B12 vitamininin terminal ileumda emilimini"},{"en":"Bile salts in the terminal ileum","tr":"Safra tuzlarının terminal ileumda emilimini"}],"answer":3,"explanation":{"en":"Parietal cells produce intrinsic factor, which binds vitamin B12 after it is released from haptocorrin in the small intestine. The complex is then absorbed through receptors in the terminal ileum.","tr":"Parietal hücreler intrinsik faktör üretir; bu faktör ince bağırsakta haptokorrinden ayrılan B12 vitaminine bağlanır. Oluşan kompleks terminal ileumdaki reseptörler aracılığıyla emilir."},"sourcePages":[283,284],"difficulty":"applied"},{"id":"c63q4","stem":{"en":"Which duodenal response helps slow gastric emptying after fat enters the small intestine?","tr":"İnce bağırsağa yağ girdikten sonra hangi duodenal yanıt mide boşalmasını yavaşlatmaya yardımcı olur?"},"options":[{"en":"Reduced cholecystokinin release and greater gastric propulsion","tr":"Kolesistokinin salınımının azalması ve gastrik itici hareketin artması"},{"en":"Increased gastrin release with stronger antral propulsion","tr":"Gastrin salınımının artmasıyla antral itici hareketin güçlenmesi"},{"en":"Cholecystokinin release and increased resistance at the pylorus","tr":"Kolesistokinin salınımı ve pilordaki direncin artması"},{"en":"Reduced pyloric resistance to allow rapid fat delivery","tr":"Yağın hızlı geçişi için pilor direncinin azalması"},{"en":"Suppression of duodenal feedback despite increasing lipid concentration","tr":"Lipid konsantrasyonu artarken duodenal geri bildirimin baskılanması"}],"answer":2,"explanation":{"en":"Duodenal lipid stimulates cholecystokinin release, which slows delivery of further gastric contents. This feedback gives the intestine time to process the fat already present.","tr":"Duodenal lipid, kolesistokinin salınımını uyararak mideden ek içerik geçişini yavaşlatır. Bu geri bildirim, bağırsağa mevcut yağı işlemesi için zaman tanır."},"sourcePages":[286],"difficulty":"applied"},{"id":"c63q5","stem":{"en":"During the ejection phase of vomiting, what most directly propels gastric contents into the oesophagus?","tr":"Kusmanın çıkarma fazında mide içeriğini özofagusa en doğrudan ne iter?"},"options":[{"en":"A sharp rise in abdominal pressure with relaxation of the lower oesophageal sphincter","tr":"Alt özofagus sfinkteri gevşerken karın basıncının keskin biçimde artması"},{"en":"Contraction of the lower oesophageal sphincter with relaxation of abdominal muscles","tr":"Karın kasları gevşerken alt özofagus sfinkterinin kasılması"},{"en":"Opening of the glottis with a fall in abdominal pressure","tr":"Karın basıncı düşerken glottisin açılması"},{"en":"Relaxation of the pylorus with increased forward gastric emptying","tr":"İleri yönde mide boşalması artarken pilorun gevşemesi"},{"en":"Contraction of the upper oesophageal sphincter with a relaxed diaphragm","tr":"Diyafram gevşekken üst özofagus sfinkterinin kasılması"}],"answer":0,"explanation":{"en":"Coordinated abdominal muscle and costal-diaphragm contraction sharply raises abdominal pressure while the lower oesophageal sphincter relaxes. The crural diaphragm relaxes to permit passage. Glottic closure helps protect the airway during expulsion.","tr":"Alt özofagus sfinkteri gevşerken karın kasları ve diyaframın kostal bölümünün koordineli kasılması karın basıncını keskin biçimde yükseltir. Geçişe izin vermek için diyaframın krural bölümü gevşer. Çıkarma sırasında glottisin kapanması hava yolunu korumaya yardımcı olur."},"sourcePages":[288],"difficulty":"core"}]},{"id":64,"title":{"en":"Gastrointestinal Digestion and Absorption","tr":"Gastrointestinal Sindirim ve Emilim"},"startPage":289,"section":5,"endPage":294,"questions":[{"id":"c64q1","stem":{"en":"What directly powers apical glucose uptake through intestinal SGLT1?","tr":"Bağırsakta SGLT1 üzerinden apikal glukoz alımını doğrudan hangi güç sağlar?"},"options":[{"en":"The inward sodium electrochemical gradient","tr":"İçe doğru sodyum elektrokimyasal gradyanı"},{"en":"ATP hydrolysis by SGLT1 itself","tr":"SGLT1’in kendisinin ATP hidrolizi"},{"en":"The outward chloride gradient alone","tr":"Yalnızca dışa doğru klorür gradyanı"},{"en":"Direct insulin binding to SGLT1","tr":"İnsülinin doğrudan SGLT1’e bağlanması"},{"en":"Passive glucose diffusion through the lipid bilayer","tr":"Glukozun lipid çift tabakadan pasif difüzyonu"}],"answer":0,"explanation":{"en":"SGLT1 couples glucose uptake to sodium entry, making it secondary active transport. The basolateral sodium–potassium ATPase indirectly supplies the energy by maintaining a low intracellular sodium concentration.","tr":"SGLT1 glukoz alımını sodyum girişine bağlar; bu nedenle sekonder aktif taşımadır. Bazolateral sodyum-potasyum ATPaz, hücre içi sodyumu düşük tutarak enerjiyi dolaylı biçimde sağlar."},"sourcePages":[290],"difficulty":"core"},{"id":"c64q2","stem":{"en":"Which ion gradient is used for uptake of many dipeptides and tripeptides into enterocytes?","tr":"Birçok dipeptit ve tripeptidin enterositlere alınmasında hangi iyon gradyanı kullanılır?"},"options":[{"en":"Sodium-ion gradient","tr":"Sodyum iyonu gradyanı"},{"en":"Potassium-ion gradient","tr":"Potasyum iyonu gradyanı"},{"en":"Hydrogen-ion gradient","tr":"Hidrojen iyonu gradyanı"},{"en":"Chloride-ion gradient","tr":"Klorür iyonu gradyanı"},{"en":"Calcium-ion gradient","tr":"Kalsiyum iyonu gradyanı"}],"answer":2,"explanation":{"en":"Small peptides enter through hydrogen-linked cotransport and are then largely hydrolysed inside the enterocyte. Many free amino acids instead use sodium-linked transport systems.","tr":"Küçük peptitler hidrojenle eşleşmiş kotransportla girer ve ardından büyük ölçüde enterosit içinde hidroliz edilir. Birçok serbest amino asit ise sodyumla eşleşmiş taşıma sistemlerini kullanır."},"sourcePages":[291],"difficulty":"core"},{"id":"c64q3","stem":{"en":"After long-chain dietary lipids are reassembled into triglycerides inside enterocytes, how do they mainly leave the intestine?","tr":"Uzun zincirli diyet lipidleri enterosit içinde yeniden trigliserit oluşturduktan sonra bağırsaktan esas olarak nasıl ayrılır?"},"options":[{"en":"As chylomicrons entering portal capillaries directly","tr":"Doğrudan portal kapillerlere giren şilomikronlar halinde"},{"en":"As intact bile-salt micelles entering intestinal lymph","tr":"Bağırsak lenfine giren değişmemiş safra tuzu miselleri halinde"},{"en":"As albumin-bound triglyceride in portal blood","tr":"Portal kanda albümine bağlı trigliserit halinde"},{"en":"As very-low-density lipoproteins entering portal blood","tr":"Portal kana giren çok düşük yoğunluklu lipoproteinler halinde"},{"en":"As chylomicrons entering intestinal lacteals","tr":"Bağırsak lakteallerine giren şilomikronlar halinde"}],"answer":4,"explanation":{"en":"Enterocytes package re-formed triglycerides with other lipids and apolipoproteins into chylomicrons. These enter lymphatic lacteals and reach the bloodstream through the thoracic duct.","tr":"Enterositler yeniden oluşturulan trigliseritleri diğer lipidler ve apolipoproteinlerle şilomikronlar halinde paketler. Bunlar lenfatik lakteallere girer ve torasik kanal yoluyla kan dolaşımına ulaşır."},"sourcePages":[290,291],"difficulty":"core"},{"id":"c64q4","stem":{"en":"Acidic chyme enters the duodenum. Which hormone–cell response most directly supplies bicarbonate-rich pancreatic fluid?","tr":"Asidik kimus duodenuma girer. Hangi hormon-hücre yanıtı bikarbonattan zengin pankreas sıvısını en doğrudan sağlar?"},"options":[{"en":"Cholecystokinin stimulation of pancreatic acinar enzyme secretion","tr":"Kolesistokininin pankreas asiner enzim salgısını uyarması"},{"en":"Gastrin stimulation of gastric acid secretion","tr":"Gastrinin mide asidi salgısını uyarması"},{"en":"Motilin stimulation of the migrating motor complex","tr":"Motilinin göç eden motor kompleksi uyarması"},{"en":"Secretin stimulation of pancreatic ductal cells","tr":"Sekretinin pankreas kanal hücrelerini uyarması"},{"en":"Somatostatin inhibition of pancreatic secretion","tr":"Somatostatinin pankreas salgısını inhibe etmesi"}],"answer":3,"explanation":{"en":"Duodenal acid stimulates secretin release, which promotes pancreatic ductal bicarbonate and water secretion. This neutralises incoming acid and creates a more suitable environment for digestive enzymes.","tr":"Duodenal asit sekretin salınımını uyarır; sekretin pankreas kanallarından bikarbonat ve su salgısını artırır. Böylece gelen asit nötralize edilir ve sindirim enzimleri için daha uygun ortam oluşur."},"sourcePages":[293],"difficulty":"applied"},{"id":"c64q5","stem":{"en":"Which brush-border enzyme initiates activation of pancreatic trypsinogen in the duodenum?","tr":"Duodenumda pankreatik tripsinojenin aktivasyonunu hangi fırçamsı kenar enzimi başlatır?"},"options":[{"en":"Pancreatic amylase","tr":"Pankreatik amilaz"},{"en":"Enteropeptidase, also called enterokinase","tr":"Enterokinaz olarak da adlandırılan enteropeptidaz"},{"en":"Lactase","tr":"Laktaz"},{"en":"Pepsin","tr":"Pepsin"},{"en":"Pancreatic carboxypeptidase","tr":"Pankreatik karboksipeptidaz"}],"answer":1,"explanation":{"en":"Enteropeptidase converts trypsinogen to trypsin at the intestinal surface. Trypsin then activates additional trypsinogen and other pancreatic proenzymes, amplifying protein digestion.","tr":"Enteropeptidaz bağırsak yüzeyinde tripsinojeni tripsine dönüştürür. Tripsin daha sonra ek tripsinojeni ve diğer pankreatik proenzimleri aktive ederek protein sindirimini artırır."},"sourcePages":[291,292],"difficulty":"core"}]},{"id":65,"title":{"en":"Liver: Anatomy and Blood Supply","tr":"Karaciğer: Anatomi ve Kanlanma"},"startPage":295,"section":5,"endPage":298,"questions":[{"id":"c65q1","stem":{"en":"Which statement correctly describes the normal dual blood supply of the liver?","tr":"Karaciğerin normal çift kanlanmasını hangi ifade doğru tanımlar?"},"options":[{"en":"The hepatic artery supplies most flow and the portal vein only a small minority","tr":"Akımın çoğunu hepatik arter, küçük bir bölümünü portal ven sağlar"},{"en":"The portal vein provides most flow, while the hepatic artery also contributes substantially to oxygen delivery","tr":"Akımın çoğunu portal ven sağlar; hepatik arter de oksijen sunumuna önemli katkıda bulunur"},{"en":"Portal blood has a higher oxygen content than hepatic arterial blood","tr":"Portal kanın oksijen içeriği hepatik arter kanından yüksektir"},{"en":"The portal vein contributes flow but no meaningful oxygen delivery","tr":"Portal ven akıma katkı sağlar, ancak anlamlı oksijen sunmaz"},{"en":"Hepatic arterial flow can be fully replaced by an active rise in portal flow","tr":"Hepatik arter akımı, portal akımın aktif artışıyla tamamen karşılanabilir"}],"answer":1,"explanation":{"en":"The portal vein carries a larger volume of blood, but its oxygen content is lower than arterial blood. The smaller hepatic arterial contribution therefore remains important for oxygen supply.","tr":"Portal ven daha büyük hacimde kan taşır, ancak oksijen içeriği arter kanından düşüktür. Bu nedenle daha küçük olan hepatik arter katkısı oksijen sunumu açısından yine de önemlidir."},"sourcePages":[295],"difficulty":"core"},{"id":"c65q2","stem":{"en":"What is the hepatic arterial buffer response to a reduction in portal venous flow?","tr":"Portal venöz akım azalınca hepatik arteriyel tampon yanıtı nedir?"},"options":[{"en":"Hepatic arterial constriction further reduces total hepatic flow","tr":"Hepatik arter daralması toplam hepatik akımı daha da azaltır"},{"en":"Portal venous smooth muscle increases flow independently of upstream supply","tr":"Portal ven düz kası, giriş kaynağından bağımsız olarak akımı artırır"},{"en":"Hepatic arterial resistance rises to keep oxygen extraction unchanged","tr":"Oksijen ekstraksiyonunu sabit tutmak için hepatik arter direnci artar"},{"en":"Hepatic arterial dilatation partially compensates for the lost portal flow","tr":"Hepatik arter genişleyerek azalan portal akımı kısmen telafi eder"},{"en":"Hepatic arterial calibre stays unchanged because only portal flow is regulated","tr":"Yalnızca portal akım düzenlendiğinden hepatik arter çapı değişmez"}],"answer":3,"explanation":{"en":"Reduced portal flow promotes a compensatory hepatic arterial vasodilator response involving adenosine. The response is asymmetric: portal flow cannot similarly compensate for reduced hepatic arterial flow.","tr":"Portal akımın azalması, adenozinin rol aldığı telafi edici bir hepatik arter vazodilatasyonunu destekler. Yanıt asimetriktir; portal akım, hepatik arter akımı azaldığında aynı şekilde telafi yapamaz."},"sourcePages":[295],"difficulty":"applied"},{"id":"c65q3","stem":{"en":"Why are zone 3 hepatocytes especially vulnerable to reduced hepatic oxygen delivery?","tr":"Zon 3 hepatositleri karaciğere oksijen sunumunun azalmasına neden özellikle duyarlıdır?"},"options":[{"en":"They lie furthest downstream from the portal triad blood supply","tr":"Portal triaddan gelen kanın akım yönünde en uzakta bulunurlar"},{"en":"They receive blood before zones 1 and 2 extract oxygen","tr":"Kanı zon 1 ve 2 oksijen çekmeden önce alırlar"},{"en":"Their location next to the portal arteriole exposes them to the highest oxygen tension","tr":"Portal arteriyole yakınlıkları onları en yüksek oksijen basıncına maruz bırakır"},{"en":"They rely exclusively on diffusion from the adjacent bile duct","tr":"Yalnızca komşu safra kanalından difüzyona bağımlıdırlar"},{"en":"Their sinusoidal inflow is supplied only by the hepatic artery","tr":"Sinüzoidal giriş akımları yalnızca hepatik arterden sağlanır"}],"answer":0,"explanation":{"en":"Blood loses oxygen as it passes from the periportal region towards the terminal hepatic venule. Zone 3 is the downstream, least oxygenated region, making it particularly susceptible to hypoxic injury.","tr":"Kan periportal bölgeden terminal hepatik venüle ilerlerken oksijen kaybeder. Zon 3, akımın sonunda bulunan ve en az oksijenlenen bölgedir; bu yüzden hipoksik hasara özellikle duyarlıdır."},"sourcePages":[296,297,298],"difficulty":"applied"},{"id":"c65q4","stem":{"en":"In the classical hepatic lobule, how does blood flow relative to the central vein?","tr":"Klasik karaciğer lobülünde kan, santral vene göre hangi yönde akar?"},"options":[{"en":"F
