<script id="questionData" type="application/json">{"version":"2026-10-11","book":{"title":"Basic Physiology for Anaesthetists","edition":2,"year":2019,"authors":["David Chambers","Christopher Huang","Gareth Matthews"],"pdfPageOffset":18},"sections":[{"id":1,"title":{"en":"The Basics","tr":"Temel Bilgiler"}},{"id":2,"title":{"en":"Respiratory Physiology","tr":"Solunum Fizyolojisi"}},{"id":3,"title":{"en":"Cardiovascular Physiology","tr":"Kardiyovasküler Fizyoloji"}},{"id":4,"title":{"en":"Neurophysiology","tr":"Nörofizyoloji"}},{"id":5,"title":{"en":"Gastrointestinal Tract","tr":"Gastrointestinal Sistem"}},{"id":6,"title":{"en":"Kidney and Body Fluids","tr":"Böbrek ve Vücut Sıvıları"}},{"id":7,"title":{"en":"Blood and Immune System","tr":"Kan ve Bağışıklık Sistemi"}},{"id":8,"title":{"en":"Energy Balance","tr":"Enerji Dengesi"}},{"id":9,"title":{"en":"Endocrine Physiology","tr":"Endokrin Fizyoloji"}},{"id":10,"title":{"en":"Developmental Physiology","tr":"Gelişim Fizyolojisi"}},{"id":11,"title":{"en":"Environmental Physiology","tr":"Çevresel Fizyoloji"}}],"chapters":[{"id":1,"title":{"en":"General Organisation of the Body","tr":"Vücudun Genel Organizasyonu"},"startPage":1,"section":1,"endPage":5,"questions":[{"id":"c01q1","stem":{"en":"Most cells in the human body directly exchange substances with which environment?","tr":"İnsan vücudundaki hücrelerin çoğu maddeleri doğrudan hangi ortamla değiştirir?"},"options":[{"en":"Blood plasma alone, without interstitial fluid","tr":"İnterstisyel sıvı olmaksızın yalnızca kan plazması"},{"en":"Cerebrospinal fluid","tr":"Beyin omurilik sıvısı"},{"en":"Extracellular fluid","tr":"Hücre dışı sıvı"},{"en":"Intracellular fluid of adjacent cells","tr":"Komşu hücrelerin hücre içi sıvısı"},{"en":"The gastrointestinal lumen","tr":"Gastrointestinal sistem lümeni"}],"answer":2,"explanation":{"en":"Extracellular fluid forms the immediate environment of most cells. Homeostasis regulates its composition so that cellular function is protected from changes in the external environment.","tr":"Hücre dışı sıvı, hücrelerin çoğunun doğrudan çevresini oluşturur. Homeostaz bu sıvının bileşimini düzenleyerek hücre işlevlerini dış ortamdaki değişikliklere karşı korur."},"sourcePages":[2],"difficulty":"core"},{"id":"c01q2","stem":{"en":"A rise in arterial CO₂ increases ventilation, bringing CO₂ back towards its previous level. What type of control is this?","tr":"Arteriyel CO₂ artışı ventilasyonu artırır ve CO₂ önceki düzeyine yaklaşır. Bu hangi kontrol mekanizmasıdır?"},"options":[{"en":"Negative feedback","tr":"Negatif geri bildirim"},{"en":"Positive feedback","tr":"Pozitif geri bildirim"},{"en":"Feedforward control without feedback","tr":"Geri bildirim olmadan ileri beslemeli kontrol"},{"en":"A change in the CO₂ set point without correction","tr":"Düzeltme olmadan CO₂ ayar noktasının değişmesi"},{"en":"Passive equilibration without an effector response","tr":"Efektör yanıtı olmadan pasif dengelenme"}],"answer":0,"explanation":{"en":"The response opposes the original disturbance: increased ventilation reduces arterial CO₂. Positive feedback would amplify the disturbance rather than correct it.","tr":"Yanıt başlangıçtaki değişikliğe karşı koyar: artan ventilasyon arteriyel CO₂ düzeyini düşürür. Pozitif geri bildirim ise değişikliği düzeltmek yerine güçlendirirdi."},"sourcePages":[3,4],"difficulty":"applied"},{"id":"c01q3","stem":{"en":"During exercise, metabolites released within a muscle dilate its local vessels. Which description fits best?","tr":"Egzersiz sırasında kas içinde açığa çıkan metabolitler yerel damarları genişletir. Bu durum en iyi nasıl tanımlanır?"},"options":[{"en":"Endocrine regulation by a hormone released from a distant gland","tr":"Uzak bir bezden salınan hormonla endokrin düzenleme"},{"en":"A centrally mediated baroreceptor reflex","tr":"Santral aracılı baroreseptör refleksi"},{"en":"A purely myogenic response to increased vessel-wall stretch","tr":"Damar duvarı gerilmesinin artmasına saf miyojenik yanıt"},{"en":"Sympathetic vasoconstriction of the exercising muscle","tr":"Egzersiz yapan kasta sempatik vazokonstriksiyon"},{"en":"Intrinsic regulation by local chemical signalling","tr":"Yerel kimyasal sinyallerle intrinsik düzenleme"}],"answer":4,"explanation":{"en":"Local metabolites couple regional blood flow to local metabolic activity. This is intrinsic regulation; an endocrine signal arising at a distant site is an example of extrinsic regulation.","tr":"Yerel metabolitler bölgesel kan akımını yerel metabolik aktiviteyle ilişkilendirir. Bu intrinsik düzenlemedir; uzak bir bölgeden gelen endokrin sinyal ise ekstrinsik düzenlemeye örnektir."},"sourcePages":[3],"difficulty":"applied"},{"id":"c01q4","stem":{"en":"Which event is a physiological example of positive feedback?","tr":"Hangi olay fizyolojik pozitif geri bildirime örnektir?"},"options":[{"en":"Increased ventilation lowers an elevated arterial CO₂","tr":"Artan ventilasyon yükselmiş arteriyel CO₂ düzeyini düşürür"},{"en":"Cervical stretch promotes oxytocin release, strengthening contractions","tr":"Serviksin gerilmesi oksitosin salınımını artırarak kasılmaları güçlendirir"},{"en":"Insulin release reduces a rise in blood glucose","tr":"İnsülin salınımı kan glikozundaki artışı azaltır"},{"en":"Sweating promotes heat loss when body temperature rises","tr":"Vücut sıcaklığı yükseldiğinde terleme ısı kaybını artırır"},{"en":"A fall in pressure triggers responses that restore arterial pressure","tr":"Basınç düşüşü arteriyel basıncı yeniden yükselten yanıtları başlatır"}],"answer":1,"explanation":{"en":"Stronger contractions cause more cervical stretch, which promotes further oxytocin release. This amplification ends when delivery removes the stretching stimulus; it is not an indefinitely self-sustaining process.","tr":"Daha güçlü kasılmalar serviksi daha fazla gerer ve oksitosin salınımını artırır. Doğumla gerilme uyaranı ortadan kalktığında bu güçlenme sona erer; süreç süresiz biçimde kendi kendini sürdürmez."},"sourcePages":[4,5],"difficulty":"core"},{"id":"c01q5","stem":{"en":"Which pairing of embryonic germ layer and principal derivative is correct?","tr":"Embriyonik germ tabakası ve başlıca türevi eşleştirmelerinden hangisi doğrudur?"},"options":[{"en":"Endoderm — skeletal muscle","tr":"Endoderm — iskelet kası"},{"en":"Ectoderm — bone marrow","tr":"Ektoderm — kemik iliği"},{"en":"Mesoderm — epidermis","tr":"Mezoderm — epidermis"},{"en":"Ectoderm — nervous system","tr":"Ektoderm — sinir sistemi"},{"en":"Endoderm — peripheral nerves","tr":"Endoderm — periferik sinirler"}],"answer":3,"explanation":{"en":"The nervous system and epidermis arise from ectoderm. Muscle, bone and blood are mesodermal derivatives, whereas the epithelial lining of the respiratory and gastrointestinal tracts is primarily endodermal.","tr":"Sinir sistemi ve epidermis ektodermden gelişir. Kas, kemik ve kan mezoderm kökenlidir; solunum ve gastrointestinal sistem epitelinin başlıca kökeni ise endodermdir."},"sourcePages":[1],"difficulty":"core"}]},{"id":2,"title":{"en":"Cell Components and Function","tr":"Hücre Bileşenleri ve İşlevleri"},"startPage":6,"section":1,"endPage":8,"questions":[{"id":"c02q1","stem":{"en":"Where are the electron transport chain complexes located?","tr":"Elektron taşıma zinciri kompleksleri nerede bulunur?"},"options":[{"en":"Outer nuclear membrane","tr":"Dış çekirdek zarı"},{"en":"Golgi cisternae","tr":"Golgi sisternaları"},{"en":"Lysosomal lumen","tr":"Lizozom lümeni"},{"en":"Inner mitochondrial membrane","tr":"İç mitokondri zarı"},{"en":"Free cytosolic ribosomes","tr":"Serbest sitozolik ribozomlar"}],"answer":3,"explanation":{"en":"Electron transport chain complexes in the inner mitochondrial membrane establish a proton gradient across that membrane. ATP synthesis uses this gradient; the mitochondrial matrix contains enzymes for processes such as the citric acid cycle.","tr":"İç mitokondri zarındaki elektron taşıma zinciri kompleksleri bu zar boyunca proton gradyanı oluşturur. ATP sentezi bu gradyanı kullanır; mitokondri matriksi ise sitrik asit döngüsü gibi süreçlerin enzimlerini içerir."},"sourcePages":[7],"difficulty":"core"},{"id":"c02q2","stem":{"en":"Why does a mature erythrocyte depend on glycolysis for ATP production?","tr":"Olgun bir eritrosit ATP üretiminde neden glikolize bağımlıdır?"},"options":[{"en":"It lacks a nucleus","tr":"Çekirdeği yoktur"},{"en":"It lacks mitochondria","tr":"Mitokondrisi yoktur"},{"en":"It contains a high concentration of haemoglobin","tr":"Yüksek konsantrasyonda hemoglobin içerir"},{"en":"It has a biconcave shape","tr":"Bikonkav şekillidir"},{"en":"It deforms while passing through narrow capillaries","tr":"Dar kapillerlerden geçerken şekil değiştirir"}],"answer":1,"explanation":{"en":"Mature erythrocytes have no mitochondria and therefore cannot perform mitochondrial oxidative phosphorylation. They obtain ATP through glycolysis despite transporting oxygen to other tissues.","tr":"Olgun eritrositlerde mitokondri bulunmadığından mitokondriyal oksidatif fosforilasyon gerçekleşmez. Diğer dokulara oksijen taşımalarına rağmen ATP gereksinimlerini glikolizle karşılarlar."},"sourcePages":[7],"difficulty":"applied"},{"id":"c02q3","stem":{"en":"Which structure directly supports the high rate of secretory protein synthesis in an antibody-producing plasma cell?","tr":"Antikor üreten plazma hücresinde yüksek hızlı salgı proteini sentezini doğrudan hangi yapı sağlar?"},"options":[{"en":"Rough endoplasmic reticulum","tr":"Granüllü endoplazmik retikulum"},{"en":"Smooth endoplasmic reticulum","tr":"Düz endoplazmik retikulum"},{"en":"Golgi apparatus","tr":"Golgi aygıtı"},{"en":"Lysosomes","tr":"Lizozomlar"},{"en":"Mitochondrial matrix","tr":"Mitokondri matriksi"}],"answer":0,"explanation":{"en":"Ribosomes attached to rough endoplasmic reticulum synthesise proteins destined for secretion. Smooth endoplasmic reticulum is more closely associated with lipid and steroid synthesis.","tr":"Granüllü endoplazmik retikuluma bağlı ribozomlar salgılanacak proteinleri sentezler. Düz endoplazmik retikulum ise daha çok lipit ve steroid senteziyle ilişkilidir."},"sourcePages":[8],"difficulty":"applied"},{"id":"c02q4","stem":{"en":"Which organelle chiefly modifies, sorts and packages newly synthesised secretory proteins?","tr":"Yeni sentezlenen salgı proteinlerini başlıca hangi organel değiştirir, sınıflandırır ve paketler?"},"options":[{"en":"Mitochondrial matrix","tr":"Mitokondri matriksi"},{"en":"Nucleolus","tr":"Çekirdekçik"},{"en":"Golgi apparatus","tr":"Golgi aygıtı"},{"en":"Lysosome","tr":"Lizozom"},{"en":"Nuclear pore","tr":"Çekirdek poru"}],"answer":2,"explanation":{"en":"The Golgi apparatus receives proteins from the endoplasmic reticulum and prepares them for their destinations. Lysosomes primarily carry out intracellular degradation rather than sorting newly made secretory proteins.","tr":"Golgi aygıtı endoplazmik retikulumdan gelen proteinleri alır ve gönderilecekleri yerlere hazırlar. Lizozomların başlıca işlevi yeni salgı proteinlerini sınıflandırmak değil, hücre içi yıkımdır."},"sourcePages":[8],"difficulty":"core"},{"id":"c02q5","stem":{"en":"Which organelles are especially important for degrading material engulfed by macrophages?","tr":"Makrofajların fagosite ettiği materyalin parçalanmasında hangi organeller özellikle önemlidir?"},"options":[{"en":"Nucleoli","tr":"Çekirdekçikler"},{"en":"Centrioles","tr":"Sentriyoller"},{"en":"Mitochondrial cristae","tr":"Mitokondri kristaları"},{"en":"Free ribosomes","tr":"Serbest ribozomlar"},{"en":"Lysosomes","tr":"Lizozomlar"}],"answer":4,"explanation":{"en":"Lysosomes contain degradative enzymes operating in an acidic environment and participate in destruction of engulfed material. Ribosomes synthesise proteins and do not provide this degradative compartment.","tr":"Lizozomlar asidik ortamda çalışan yıkıcı enzimleri içerir ve fagosite edilen materyalin parçalanmasına katılır. Ribozomlar protein sentezler; bu yıkım bölmesini oluşturmaz."},"sourcePages":[8],"difficulty":"core"}]},{"id":3,"title":{"en":"Genetics","tr":"Genetik"},"startPage":9,"section":1,"endPage":12,"questions":[{"id":"c03q1","stem":{"en":"Which feature distinguishes RNA from DNA?","tr":"Hangi özellik RNA’yı DNA’dan ayırır?"},"options":[{"en":"It contains deoxyribose rather than ribose","tr":"Riboz yerine deoksiriboz içerir"},{"en":"It normally forms the two strands of a chromosome","tr":"Normalde kromozomun iki zincirini oluşturur"},{"en":"It uses thymine but not uracil","tr":"Timin kullanır ancak urasil kullanmaz"},{"en":"Its backbone is made of amino acids rather than nucleotides","tr":"Omurgası nükleotidler yerine amino asitlerden oluşur"},{"en":"Uracil replaces thymine","tr":"Timin yerine urasil bulunur"}],"answer":4,"explanation":{"en":"RNA uses uracil instead of thymine and contains ribose rather than deoxyribose. It is usually single-stranded, although complementary regions can pair within RNA molecules.","tr":"RNA timin yerine urasil, deoksiriboz yerine riboz içerir. Genellikle tek zincirlidir; ancak RNA moleküllerindeki tamamlayıcı bölgeler birbirleriyle eşleşebilir."},"sourcePages":[9,10],"difficulty":"core"},{"id":"c03q2","stem":{"en":"Which RNA directly delivers amino acids to the ribosome during translation?","tr":"Translasyon sırasında amino asitleri doğrudan ribozoma hangi RNA taşır?"},"options":[{"en":"Messenger RNA","tr":"Mesajcı RNA"},{"en":"Ribosomal RNA","tr":"Ribozomal RNA"},{"en":"Transfer RNA","tr":"Transfer RNA"},{"en":"Small nuclear RNA","tr":"Küçük nükleer RNA"},{"en":"MicroRNA","tr":"MikroRNA"}],"answer":2,"explanation":{"en":"Transfer RNA carries an amino acid and recognises the corresponding mRNA codon through its anticodon. Messenger RNA provides the sequence template, whereas ribosomal RNA forms part of the ribosomal machinery.","tr":"Transfer RNA bir amino asidi taşır ve antikodonu aracılığıyla ilgili mRNA kodonunu tanır. Mesajcı RNA dizi için kalıp sağlar; ribozomal RNA ise ribozomun işlevsel yapısının bir parçasıdır."},"sourcePages":[10],"difficulty":"core"},{"id":"c03q3","stem":{"en":"Two unaffected parents are both heterozygous carriers of the same autosomal recessive disease. What is the probability that their next child is affected?","tr":"Sağlıklı iki ebeveyn aynı otozomal resesif hastalık için heterozigot taşıyıcıdır. Bir sonraki çocuklarının hasta olma olasılığı nedir?"},"options":[{"en":"0%","tr":"%0"},{"en":"25%","tr":"%25"},{"en":"50%","tr":"%50"},{"en":"75%","tr":"%75"},{"en":"100%","tr":"%100"}],"answer":1,"explanation":{"en":"An Aa × Aa cross produces AA, Aa, Aa and aa with equal probabilities. The aa genotype is affected, giving a 25% probability in each pregnancy; previous outcomes do not change that probability.","tr":"Aa × Aa çaprazlamasında AA, Aa, Aa ve aa genotipleri eşit olasılıkla oluşur. Hasta genotip aa olduğundan her gebelikte olasılık %25’tir; önceki gebeliklerin sonuçları bu olasılığı değiştirmez."},"sourcePages":[11,12],"difficulty":"applied"},{"id":"c03q4","stem":{"en":"A heterozygous parent carries a fully penetrant autosomal dominant variant; the other parent does not carry it. What is the probability of transmitting the variant to each child?","tr":"Bir ebeveyn tam penetranslı otozomal dominant bir varyant için heterozigottur; diğer ebeveynde bu varyant yoktur. Varyantın her bir çocuğa aktarılma olasılığı nedir?"},"options":[{"en":"0%","tr":"%0"},{"en":"25%","tr":"%25"},{"en":"75%","tr":"%75"},{"en":"50%","tr":"%50"},{"en":"100%","tr":"%100"}],"answer":3,"explanation":{"en":"The heterozygous parent transmits either the affected or the unaffected allele with equal probability. This gives a 50% transmission probability; reduced penetrance, when present, changes expression of a phenotype rather than the allele’s transmission probability.","tr":"Heterozigot ebeveyn etkilenmiş veya etkilenmemiş aleli eşit olasılıkla aktarır. Aktarım olasılığı %50’dir; azalmış penetrans varsa alelin aktarım olasılığını değil, fenotipin ortaya çıkmasını etkiler."},"sourcePages":[11,12],"difficulty":"applied"},{"id":"c03q5","stem":{"en":"A person carries a disease-associated genotype but never develops its expected phenotype. Which concept best describes this?","tr":"Bir kişi hastalıkla ilişkili genotipi taşıdığı hâlde beklenen fenotipi hiç geliştirmez. Bu durum hangi kavramla açıklanır?"},"options":[{"en":"Incomplete penetrance","tr":"Eksik penetrans"},{"en":"Complete penetrance","tr":"Tam penetrans"},{"en":"Variable expressivity among affected individuals","tr":"Etkilenmiş kişiler arasında değişken ekspresivite"},{"en":"Anticipation across generations","tr":"Kuşaklar arasında antisipasyon"},{"en":"Codominant expression of both alleles","tr":"Her iki alelin kodominant ekspresyonu"}],"answer":0,"explanation":{"en":"Penetrance describes the proportion of people with a genotype who express its associated phenotype. Incomplete penetrance means that inheriting the genotype does not invariably produce the phenotype.","tr":"Penetrans, belirli bir genotipi taşıyan kişiler arasında ilişkili fenotipi gösterenlerin oranıdır. Eksik penetrans, genotipin kalıtılmasının her zaman fenotiple sonuçlanmadığını ifade eder."},"sourcePages":[12],"difficulty":"applied"}]},{"id":4,"title":{"en":"The Cell Membrane","tr":"Hücre Zarı"},"startPage":13,"section":1,"endPage":17,"questions":[{"id":"c04q1","stem":{"en":"Which substance can cross the lipid component of a cell membrane by simple diffusion?","tr":"Hangi madde hücre zarının lipit bölümünden basit difüzyonla geçebilir?"},"options":[{"en":"Oxygen","tr":"Oksijen"},{"en":"A sodium ion","tr":"Sodyum iyonu"},{"en":"A potassium ion","tr":"Potasyum iyonu"},{"en":"A large plasma protein","tr":"Büyük bir plazma proteini"},{"en":"A glucose molecule without a transporter","tr":"Taşıyıcı olmadan glikoz molekülü"}],"answer":0,"explanation":{"en":"Small non-polar molecules such as oxygen can dissolve in the bilayer and diffuse along a partial-pressure gradient. Charged ions and large polar solutes generally require membrane proteins or vesicular transport.","tr":"Oksijen gibi küçük apolar moleküller çift tabakada çözünerek parsiyel basınç gradyanı yönünde difüze olabilir. Yüklü iyonlar ve büyük polar çözünenler genellikle zar proteinlerine veya veziküler taşınmaya gereksinim duyar."},"sourcePages":[13,14],"difficulty":"core"},{"id":"c04q2","stem":{"en":"What is the normal transport stoichiometry of the Na⁺/K⁺-ATPase for each ATP hydrolysed?","tr":"Na⁺/K⁺-ATPazın hidroliz edilen her ATP başına normal taşıma stokiyometrisi nedir?"},"options":[{"en":"Three Na⁺ into the cell and two K⁺ out of the cell","tr":"Üç Na⁺ hücre içine, iki K⁺ hücre dışına"},{"en":"Two Na⁺ out of the cell and three K⁺ into the cell","tr":"İki Na⁺ hücre dışına, üç K⁺ hücre içine"},{"en":"One Na⁺ and one K⁺ into the cell","tr":"Bir Na⁺ ve bir K⁺ hücre içine"},{"en":"Three Na⁺ out of the cell and two K⁺ into the cell","tr":"Üç Na⁺ hücre dışına, iki K⁺ hücre içine"},{"en":"Three Na⁺ and two K⁺ out of the cell","tr":"Üç Na⁺ ve iki K⁺ hücre dışına"}],"answer":3,"explanation":{"en":"The pump exports three sodium ions and imports two potassium ions per ATP under physiological conditions. The unequal charge movement is electrogenic and maintains the gradients used by many secondary transporters.","tr":"Pompa fizyolojik koşullarda her ATP başına üç sodyum iyonunu dışarı, iki potasyum iyonunu içeri taşır. Eşit olmayan yük hareketi elektrojeniktir ve birçok ikincil taşıyıcının kullandığı gradyanları korur."},"sourcePages":[15,16],"difficulty":"core"},{"id":"c04q3","stem":{"en":"Glucose uptake through a GLUT carrier shows saturation at high glucose concentrations. What best explains this?","tr":"GLUT taşıyıcısıyla glikoz alımı yüksek glikoz konsantrasyonlarında doygunluğa ulaşır. En iyi açıklama hangisidir?"},"options":[{"en":"The carrier’s direct ATP hydrolysis reaches its maximum rate","tr":"Taşıyıcının doğrudan ATP hidrolizi en yüksek hızına ulaşır"},{"en":"Glucose passage through membrane lipid is the limiting step","tr":"Glikozun zar lipitlerinden geçişi sınırlayıcı basamaktır"},{"en":"There is a finite number of carrier proteins","tr":"Taşıyıcı protein sayısı sınırlıdır"},{"en":"The sodium gradient directly driving GLUT becomes exhausted","tr":"GLUT’yi doğrudan çalıştıran sodyum gradyanı tükenir"},{"en":"GLUT moves glucose against its gradient until intracellular stores are full","tr":"GLUT hücre içi depolar dolana kadar glikozu gradyanına karşı taşır"}],"answer":2,"explanation":{"en":"Carrier-mediated facilitated diffusion is limited by carrier number and turnover. It moves glucose down its concentration gradient and does not directly hydrolyse ATP.","tr":"Taşıyıcı aracılı kolaylaştırılmış difüzyon, taşıyıcı sayısı ve çalışma hızıyla sınırlıdır. Glikozu konsantrasyon gradyanı yönünde taşır ve doğrudan ATP hidroliz etmez."},"sourcePages":[15],"difficulty":"applied"},{"id":"c04q4","stem":{"en":"Why is sodium–glucose cotransport classified as secondary active transport?","tr":"Sodyum–glikoz birlikte taşınması neden ikincil aktif taşıma olarak sınıflandırılır?"},"options":[{"en":"The cotransporter directly hydrolyses ATP to move glucose","tr":"Birlikte taşıyıcı glikoz taşımak için doğrudan ATP hidroliz eder"},{"en":"Both substrates move only down their own electrochemical gradients","tr":"Her iki substrat yalnızca kendi elektrokimyasal gradyanı yönünde hareket eder"},{"en":"Glucose moves freely through the lipid bilayer alongside sodium","tr":"Glikoz sodyumla birlikte lipit çift tabakadan serbestçe geçer"},{"en":"ATP binds glucose and carries it through an ion channel","tr":"ATP glikoza bağlanarak onu bir iyon kanalından taşır"},{"en":"It uses a sodium gradient maintained by an ATP-consuming pump","tr":"ATP tüketen bir pompanın sürdürdüğü sodyum gradyanını kullanır"}],"answer":4,"explanation":{"en":"Sodium moving down its electrochemical gradient provides the energy for coupled glucose transport. The Na⁺/K⁺-ATPase maintains that sodium gradient, so the energy dependence is indirect.","tr":"Sodyumun elektrokimyasal gradyanı yönündeki hareketi eşleşmiş glikoz taşınmasına enerji sağlar. Sodyum gradyanını Na⁺/K⁺-ATPaz koruduğundan enerji bağımlılığı dolaylıdır."},"sourcePages":[16],"difficulty":"core"},{"id":"c04q5","stem":{"en":"A molecule enters one surface of an epithelial cell in a vesicle and is released from the opposite surface. What is this process called?","tr":"Bir molekül epitel hücresinin bir yüzünden vezikül içinde alınır ve karşı yüzünden salınır. Bu sürece ne ad verilir?"},"options":[{"en":"Simple diffusion","tr":"Basit difüzyon"},{"en":"Transcytosis","tr":"Transsitoz"},{"en":"Facilitated diffusion","tr":"Kolaylaştırılmış difüzyon"},{"en":"Primary active ion transport","tr":"Birincil aktif iyon taşınması"},{"en":"Ligand-gated ion-channel opening","tr":"Ligand kapılı iyon kanalının açılması"}],"answer":1,"explanation":{"en":"Transcytosis combines endocytosis, vesicular passage across the cell and exocytosis at the opposite surface. It is distinct from movement through an ion channel or a carrier protein.","tr":"Transsitoz; endositozu, veziküllerin hücre içinden taşınmasını ve karşı yüzeyde ekzositozu birleştirir. İyon kanalı veya taşıyıcı protein üzerinden geçişten farklıdır."},"sourcePages":[17],"difficulty":"applied"}]},{"id":5,"title":{"en":"Enzymes","tr":"Enzimler"},"startPage":18,"section":1,"endPage":20,"questions":[{"id":"c05q1","stem":{"en":"How does an enzyme accelerate a reversible chemical reaction?","tr":"Bir enzim geri dönüşümlü bir kimyasal tepkimeyi nasıl hızlandırır?"},"options":[{"en":"It changes the equilibrium constant to favour products","tr":"Ürünleri destekleyecek şekilde denge sabitini değiştirir"},{"en":"It lowers the activation energy required to reach the transition state","tr":"Geçiş durumuna ulaşmak için gereken aktivasyon enerjisini düşürür"},{"en":"It makes the overall reaction free-energy change more negative","tr":"Tepkimenin toplam serbest enerji değişimini daha negatif yapar"},{"en":"It supplies energy by being consumed as a reactant","tr":"Reaktan olarak tüketilmesiyle enerji sağlar"},{"en":"It accelerates the forward reaction but cannot catalyse the reverse reaction","tr":"İleri tepkimeyi hızlandırır ancak ters tepkimeyi katalizleyemez"}],"answer":1,"explanation":{"en":"An enzyme provides a lower-energy pathway and speeds the approach to equilibrium. It is regenerated during catalysis and does not determine a different equilibrium position.","tr":"Enzim daha düşük enerjili bir yol sağlayarak dengeye ulaşmayı hızlandırır. Kataliz sırasında yeniden kullanılabilir hâle gelir ve farklı bir denge konumu belirlemez."},"sourcePages":[18],"difficulty":"core"},{"id":"c05q2","stem":{"en":"A purified enzyme loses activity when pH moves far from its optimum, despite unchanged enzyme and substrate concentrations. Which mechanism best explains this?","tr":"Saflaştırılmış bir enzimin ve substratının konsantrasyonları değişmediği hâlde pH optimumdan uzaklaşınca aktivite azalır. Bunu en iyi hangi mekanizma açıklar?"},"options":[{"en":"A change in the equilibrium constant alone, with catalytic structure and kinetics unchanged","tr":"Katalitik yapı ve kinetik değişmeden yalnızca denge sabitinin değişmesi"},{"en":"An obligatory increase in product inhibition despite unchanged product concentration","tr":"Ürün konsantrasyonu değişmeden ürün inhibisyonunun zorunlu olarak artması"},{"en":"A reduced number of enzyme–substrate collisions caused solely by lower enzyme concentration","tr":"Yalnızca enzim konsantrasyonunun düşmesine bağlı enzim–substrat çarpışma sayısının azalması"},{"en":"Depletion of substrate rather than any change in enzyme properties","tr":"Enzim özelliklerinde değişiklik yerine substratın tükenmesi"},{"en":"It can alter the active site’s charge and three-dimensional structure","tr":"Aktif bölgenin yükünü ve üç boyutlu yapısını değiştirebilir"}],"answer":4,"explanation":{"en":"Catalysis depends on the active site’s geometry and chemical properties. A substantial pH disturbance can alter these properties and impair substrate binding or the catalytic reaction.","tr":"Kataliz aktif bölgenin geometrisine ve kimyasal özelliklerine bağlıdır. Belirgin bir pH bozukluğu bu özellikleri değiştirerek substrat bağlanmasını veya katalitik tepkimeyi bozabilir."},"sourcePages":[18],"difficulty":"core"},{"id":"c05q3","stem":{"en":"Which metal ion is a cofactor at the active site of carbonic anhydrase?","tr":"Karbonik anhidrazın aktif bölgesindeki kofaktör hangi metal iyonudur?"},"options":[{"en":"Iron","tr":"Demir"},{"en":"Copper","tr":"Bakır"},{"en":"Magnesium","tr":"Magnezyum"},{"en":"Zinc","tr":"Çinko"},{"en":"Cobalt","tr":"Kobalt"}],"answer":3,"explanation":{"en":"Carbonic anhydrase contains zinc at its active site, supporting rapid interconversion of carbon dioxide and bicarbonate in the overall hydration reaction. A metal ion is an inorganic cofactor, whereas an organic cofactor is termed a coenzyme.","tr":"Karbonik anhidraz aktif bölgesinde çinko içerir; bu, toplam hidrasyon tepkimesinde karbondioksit ile bikarbonat arasındaki hızlı dönüşümü destekler. Metal iyonu inorganik kofaktördür; organik kofaktöre ise koenzim denir."},"sourcePages":[18,19],"difficulty":"core"},{"id":"c05q4","stem":{"en":"Which description correctly defines a coenzyme?","tr":"Koenzimi doğru tanımlayan ifade hangisidir?"},"options":[{"en":"An organic non-protein molecule that assists enzyme activity","tr":"Enzim aktivitesine yardımcı olan organik, protein dışı molekül"},{"en":"An inorganic metal ion required for catalysis","tr":"Kataliz için gereken inorganik metal iyonu"},{"en":"The protein component of an enzyme without its cofactor","tr":"Enzimin kofaktörsüz protein bileşeni"},{"en":"A molecule that inhibits an enzyme by occupying its active site","tr":"Aktif bölgesini işgal ederek enzimi inhibe eden molekül"},{"en":"The substrate from which the final reaction product is made","tr":"Son tepkime ürününün oluştuğu substrat"}],"answer":0,"explanation":{"en":"Coenzymes are organic cofactors, such as NAD⁺ and coenzyme A. Inorganic cofactors, including zinc or magnesium ions, help enzymes but are not called coenzymes.","tr":"Koenzimler NAD⁺ ve koenzim A gibi organik kofaktörlerdir. Çinko veya magnezyum iyonları gibi inorganik kofaktörler enzimlere yardım eder ancak koenzim olarak adlandırılmaz."},"sourcePages":[19],"difficulty":"core"},{"id":"c05q5","stem":{"en":"An enzyme transfers a phosphate group from one molecule to another. Which class best describes it?","tr":"Bir enzim fosfat grubunu bir molekülden diğerine aktarır. Hangi sınıfta yer alır?"},"options":[{"en":"Hydrolase","tr":"Hidrolaz"},{"en":"Isomerase","tr":"İzomeraz"},{"en":"Transferase","tr":"Transferaz"},{"en":"Oxidoreductase","tr":"Oksidoredüktaz"},{"en":"Lyase","tr":"Liyaz"}],"answer":2,"explanation":{"en":"Transferases move functional groups between molecules; kinases transfer phosphate groups. Hydrolases instead catalyse bond cleavage using water.","tr":"Transferazlar moleküller arasında işlevsel grupları aktarır; kinazlar fosfat grubu taşır. Hidrolazlar ise su kullanarak bağların parçalanmasını katalizler."},"sourcePages":[19],"difficulty":"core"}]},{"id":6,"title":{"en":"The Upper Airways","tr":"Üst Hava Yolları"},"startPage":21,"section":2,"endPage":23,"questions":[{"id":"c06q1","stem":{"en":"Which muscle helps maintain pharyngeal patency by drawing the tongue forward?","tr":"Dili öne çekerek farenks açıklığının korunmasına hangi kas yardımcı olur?"},"options":[{"en":"Superior pharyngeal constrictor","tr":"Üst farengeal konstriktör"},{"en":"Middle pharyngeal constrictor","tr":"Orta farengeal konstriktör"},{"en":"Genioglossus","tr":"Genioglossus"},{"en":"Inferior pharyngeal constrictor","tr":"Alt farengeal konstriktör"},{"en":"Styloglossus","tr":"Stiloglossus"}],"answer":2,"explanation":{"en":"Genioglossus is an important pharyngeal dilator and moves the tongue away from the posterior pharyngeal wall. Its activity helps oppose inspiratory collapse of the relatively unsupported pharynx.","tr":"Genioglossus önemli bir farenks dilatatörüdür ve dili arka farenks duvarından uzaklaştırır. Aktivitesi, desteği görece az olan farenksin inspirasyon sırasında çökmesine karşı koyar."},"sourcePages":[21],"difficulty":"core"},{"id":"c06q2","stem":{"en":"Which observation best distinguishes an obstructive apnoea from a central apnoea?","tr":"Hangi gözlem obstrüktif apneyi santral apneden en iyi ayırır?"},"options":[{"en":"Airflow stops despite continuing respiratory effort","tr":"Solunum çabası sürmesine rağmen hava akımı durur"},{"en":"Airflow and respiratory effort cease together","tr":"Hava akımı ve solunum çabası birlikte durur"},{"en":"Oxygen saturation decreases during the event","tr":"Olay sırasında oksijen satürasyonu azalır"},{"en":"An arousal follows the event","tr":"Olayı bir uyanıklık reaksiyonu izler"},{"en":"CO₂ rises during the event","tr":"Olay sırasında CO₂ yükselir"}],"answer":0,"explanation":{"en":"In obstructive apnoea, respiratory muscles continue to generate effort against a closed or severely narrowed upper airway. Central apnoea instead involves loss of respiratory drive and effort.","tr":"Obstrüktif apnede solunum kasları kapalı veya ileri derecede daralmış üst hava yoluna karşı çaba göstermeyi sürdürür. Santral apnede ise solunum dürtüsü ve çabası kaybolur."},"sourcePages":[22],"difficulty":"applied"},{"id":"c06q3","stem":{"en":"How do the nasal turbinates help condition inspired air?","tr":"Nazal konkalar inspirasyon havasının hazırlanmasına nasıl katkıda bulunur?"},"options":[{"en":"They cool the mucosa to promote condensation of inspired water","tr":"İnspire edilen suyun yoğunlaşmasını sağlamak için mukozayı soğuturlar"},{"en":"They prevent inspired gas from contacting the nasal mucosa","tr":"İnspirasyon gazının burun mukozasıyla temasını engellerler"},{"en":"They remove most water vapour before air reaches the pharynx","tr":"Hava farenkse ulaşmadan önce su buharının çoğunu uzaklaştırırlar"},{"en":"They lower inspired gas temperature to reduce oxygen consumption","tr":"Oksijen tüketimini azaltmak için inspirasyon gazının sıcaklığını düşürürler"},{"en":"They direct air over warm, moist mucosa","tr":"Havayı sıcak ve nemli mukoza üzerinden yönlendirirler"}],"answer":4,"explanation":{"en":"The turbinates increase contact between inspired air and the nasal mucosa, aiding warming and humidification. Filtration and mucociliary transport provide additional upper-airway defence.","tr":"Konkalar solunan havanın burun mukozasıyla temasını artırarak ısınma ve nemlenmeye yardımcı olur. Filtrasyon ve mukosiliyer taşıma üst hava yolunun ek savunma işlevleridir."},"sourcePages":[21],"difficulty":"core"},{"id":"c06q4","stem":{"en":"What is the principal mechanical explanation for the effect of nasal CPAP on a collapsible pharynx?","tr":"Nazal CPAP’ın çökmeye eğilimli farenks üzerindeki etkisinin başlıca mekanik açıklaması nedir?"},"options":[{"en":"It directly increases pharyngeal skeletal-muscle strength with each breath","tr":"Her solukta farengeal iskelet kası gücünü doğrudan artırır"},{"en":"Positive intraluminal pressure acts as a pneumatic splint","tr":"Pozitif lümen içi basınç pnömatik destek görevi görür"},{"en":"It reduces intraluminal pressure below surrounding tissue pressure","tr":"Lümen içi basıncı çevre doku basıncının altına düşürür"},{"en":"It reduces the pharyngeal lumen to increase gas velocity","tr":"Gaz hızını artırmak için farenks lümenini daraltır"},{"en":"It reduces upper-airway wall stiffness to facilitate collapse","tr":"Çökmeyi kolaylaştırmak için üst hava yolu duvarının sertliğini azaltır"}],"answer":1,"explanation":{"en":"Positive pressure within the upper airway opposes the forces that tend to narrow or close it. This mechanical support does not require a permanent anatomical change.","tr":"Üst hava yolu içindeki pozitif basınç, yolu daraltan veya kapatan kuvvetlere karşı koyar. Bu mekanik destek kalıcı bir anatomik değişiklik gerektirmez."},"sourcePages":[22],"difficulty":"applied"},{"id":"c06q5","stem":{"en":"High-flow nasal gas can wash expired CO₂ out of the pharynx. What is the main ventilatory consequence of this washout?","tr":"Yüksek akımlı nazal gaz, ekshale edilen CO₂’yi farenksten uzaklaştırabilir. Bu yıkamanın ventilasyon açısından temel sonucu nedir?"},"options":[{"en":"The conducting airway volume necessarily becomes anatomically larger","tr":"İletici hava yolu hacmi anatomik olarak zorunlu biçimde büyür"},{"en":"A greater fraction of each inspiration consists of CO₂-rich expired gas","tr":"Her inspirasyonun daha büyük bölümü CO₂’den zengin ekspirasyon gazından oluşur"},{"en":"Alveolar dead space must increase because pulmonary perfusion falls","tr":"Pulmoner perfüzyon azaldığı için alveoler ölü boşluk artmak zorundadır"},{"en":"Less previously exhaled gas is rebreathed","tr":"Önceden ekshale edilmiş gazın yeniden solunması azalır"},{"en":"Less fresh gas reaches the alveoli for an unchanged tidal pattern","tr":"Tidal örüntü değişmezken alveollere daha az taze gaz ulaşır"}],"answer":3,"explanation":{"en":"Upper-airway washout reduces rebreathing of CO₂-containing gas and decreases effective dead-space ventilation. It does not remove the metabolic production of CO₂ or guarantee adequate ventilation by itself.","tr":"Üst hava yolunun yıkanması CO₂ içeren gazın yeniden solunmasını azaltır ve etkili ölü boşluk ventilasyonunu düşürür. Metabolik CO₂ üretimini ortadan kaldırmaz veya tek başına yeterli ventilasyonu garanti etmez."},"sourcePages":[23],"difficulty":"applied"}]},{"id":7,"title":{"en":"The Lower Airways","tr":"Alt Hava Yolları"},"startPage":24,"section":2,"endPage":29,"questions":[{"id":"c07q1","stem":{"en":"Which airway marks the transition to a region where alveoli first permit gas exchange?","tr":"Alveollerin ilk kez gaz değişimine olanak verdiği bölgeye geçiş hangi hava yolunda başlar?"},"options":[{"en":"Trachea","tr":"Trakea"},{"en":"Main bronchus","tr":"Ana bronş"},{"en":"Lobar bronchus","tr":"Lober bronş"},{"en":"Respiratory bronchiole","tr":"Respiratuvar bronşiyol"},{"en":"Terminal bronchiole","tr":"Terminal bronşiyol"}],"answer":3,"explanation":{"en":"Respiratory bronchioles have alveoli interspersed in their walls and begin the respiratory zone. Terminal bronchioles are the final part of the conducting zone.","tr":"Respiratuvar bronşiyollerin duvarlarında aralıklı olarak alveoller bulunur ve respiratuvar bölge burada başlar. Terminal bronşiyoller iletici bölgenin son bölümüdür."},"sourcePages":[25,26],"difficulty":"core"},{"id":"c07q2","stem":{"en":"Which alveolar cells provide the thin epithelial surface across which most gas exchange occurs?","tr":"Gaz değişiminin büyük bölümünün gerçekleştiği ince epitel yüzeyini hangi alveoler hücreler oluşturur?"},"options":[{"en":"Type II pneumocytes","tr":"Tip II pnömositler"},{"en":"Type I pneumocytes","tr":"Tip I pnömositler"},{"en":"Goblet cells","tr":"Goblet hücreleri"},{"en":"Ciliated columnar cells","tr":"Silyalı kolumnar hücreler"},{"en":"Alveolar macrophages","tr":"Alveoler makrofajlar"}],"answer":1,"explanation":{"en":"Type I pneumocytes are flattened cells covering most of the alveolar surface. Type II pneumocytes are specialised for surfactant secretion, while macrophages provide phagocytic defence.","tr":"Tip I pnömositler alveol yüzeyinin çoğunu kaplayan yassı hücrelerdir. Tip II pnömositler sürfaktan salgısında uzmanlaşmıştır; makrofajlar ise fagositik savunma sağlar."},"sourcePages":[26,27],"difficulty":"core"},{"id":"c07q3","stem":{"en":"Which cell type is primarily responsible for pulmonary surfactant secretion?","tr":"Pulmoner sürfaktan salgısından başlıca hangi hücre tipi sorumludur?"},"options":[{"en":"Type II pneumocyte","tr":"Tip II pnömosit"},{"en":"Type I pneumocyte","tr":"Tip I pnömosit"},{"en":"Pulmonary capillary endothelial cell","tr":"Pulmoner kapiller endotel hücresi"},{"en":"Erythrocyte","tr":"Eritrosit"},{"en":"Alveolar macrophage","tr":"Alveoler makrofaj"}],"answer":0,"explanation":{"en":"Type II pneumocytes secrete the surfactant coating the alveolar surface. This secretory function differs from the thin gas-exchange role of type I pneumocytes.","tr":"Tip II pnömositler alveol yüzeyini kaplayan sürfaktanı salgılar. Bu salgı işlevi, tip I pnömositlerin ince gaz değişim yüzeyi oluşturma görevinden farklıdır."},"sourcePages":[26],"difficulty":"core"},{"id":"c07q4","stem":{"en":"During quiet spontaneous inspiration, which pressure change initiates airflow into the lung?","tr":"Sakin spontan inspirasyonda akciğere hava girişini hangi basınç değişikliği başlatır?"},"options":[{"en":"Alveolar pressure rises slightly above atmospheric pressure","tr":"Alveoler basınç atmosfer basıncının biraz üzerine çıkar"},{"en":"Pleural pressure becomes less negative while lung volume falls","tr":"Akciğer hacmi azalırken plevral basınç daha az negatif olur"},{"en":"Alveolar pressure falls slightly below atmospheric pressure","tr":"Alveoler basınç atmosfer basıncının biraz altına düşer"},{"en":"Alveolar and atmospheric pressures remain equal throughout inspiration","tr":"İnspirasyon boyunca alveoler ve atmosfer basınçları eşit kalır"},{"en":"Elastic recoil alone raises alveolar pressure during diaphragmatic relaxation","tr":"Diyafram gevşerken yalnızca elastik geri çekim alveoler basıncı yükseltir"}],"answer":2,"explanation":{"en":"Inspiratory muscle contraction expands the thorax and makes pleural pressure more negative. Alveolar expansion lowers alveolar pressure below atmospheric pressure, creating an inward airflow gradient.","tr":"İnspiratuvar kasların kasılması toraksı genişletir ve plevral basıncı daha negatif yapar. Alveollerin genişlemesi alveoler basıncı atmosfer basıncının altına düşürerek içeriye doğru hava akımı gradyanı oluşturur."},"sourcePages":[27,28],"difficulty":"applied"},{"id":"c07q5","stem":{"en":"In which direction does the conducting airway mucociliary escalator transport trapped particles?","tr":"İletici hava yollarındaki mukosiliyer sistem yakalanan partikülleri hangi yönde taşır?"},"options":[{"en":"Towards the terminal bronchioles","tr":"Terminal bronşiyollere doğru"},{"en":"Towards the alveolar sacs","tr":"Alveol keselerine doğru"},{"en":"Across the bronchial epithelium into interstitial fluid","tr":"Bronş epitelini geçerek interstisyel sıvıya"},{"en":"Into the bronchial venous circulation","tr":"Bronşiyal venöz dolaşıma"},{"en":"Towards the oropharynx","tr":"Orofarenkse doğru"}],"answer":4,"explanation":{"en":"Coordinated ciliary movement carries mucus towards the oropharynx for swallowing or expectoration. It protects the distal lung; impaired clearance allows secretions and inhaled material to accumulate.","tr":"Eşgüdümlü silya hareketi mukusu yutulmak veya balgamla atılmak üzere orofarenkse taşır. Distal akciğeri korur; temizlenmenin bozulması sekresyonların ve solunan maddelerin birikmesine yol açar."},"sourcePages":[24,25],"difficulty":"core"}]},{"id":8,"title":{"en":"Oxygen Transport","tr":"Oksijen Taşınması"},"startPage":30,"section":2,"endPage":36,"questions":[{"id":"c08q1","stem":{"en":"Ignoring dissolved oxygen, what is arterial oxygen content when haemoglobin is 10 g/dL, saturation is 100%, and oxygen-binding capacity is 1.34 mL/g?","tr":"Çözünmüş oksijen ihmal edildiğinde hemoglobin 10 g/dL, satürasyon %100 ve oksijen bağlama kapasitesi 1,34 mL/g ise arteriyel oksijen içeriği nedir?"},"options":[{"en":"1.34 mL O₂/dL","tr":"1,34 mL O₂/dL"},{"en":"10.0 mL O₂/dL","tr":"10,0 mL O₂/dL"},{"en":"20.1 mL O₂/dL","tr":"20,1 mL O₂/dL"},{"en":"134 mL O₂/dL","tr":"134 mL O₂/dL"},{"en":"13.4 mL O₂/dL","tr":"13,4 mL O₂/dL"}],"answer":4,"explanation":{"en":"Haemoglobin-bound oxygen content is 1.34 × haemoglobin concentration × fractional saturation: 1.34 × 10 × 1 = 13.4 mL/dL. A normal saturation therefore does not guarantee a normal oxygen content when haemoglobin concentration is reduced.","tr":"Hemoglobine bağlı oksijen içeriği 1,34 × hemoglobin konsantrasyonu × kesir olarak satürasyondur: 1,34 × 10 × 1 = 13,4 mL/dL. Bu nedenle hemoglobin düşükken normal satürasyon, normal oksijen içeriğini garanti etmez."},"sourcePages":[30],"difficulty":"applied"},{"id":"c08q2","stem":{"en":"What explains the sigmoid shape of the haemoglobin–oxygen dissociation curve?","tr":"Hemoglobin–oksijen disosiasyon eğrisinin sigmoid şeklini ne açıklar?"},"options":[{"en":"Each haem group binds oxygen independently with unchanged affinity","tr":"Her hem grubu oksijeni değişmeyen afiniteyle bağımsız bağlar"},{"en":"Haemoglobin has only one functional oxygen-binding site","tr":"Hemoglobinin yalnızca bir işlevsel oksijen bağlama bölgesi vardır"},{"en":"Binding of one oxygen molecule increases affinity for subsequent oxygen molecules","tr":"Bir oksijen molekülünün bağlanması sonraki oksijen moleküllerine afinitesini artırır"},{"en":"The oxygen-binding affinity decreases after each oxygen molecule binds","tr":"Her oksijen molekülü bağlandıktan sonra oksijen afinitesi azalır"},{"en":"The curve mainly reflects the linear solubility of oxygen in plasma","tr":"Eğri başlıca oksijenin plazmadaki doğrusal çözünürlüğünü yansıtır"}],"answer":2,"explanation":{"en":"Haemoglobin exhibits positive cooperativity: oxygen binding favours a higher-affinity conformation. Myoglobin has a single binding site and therefore has a hyperbolic rather than sigmoid binding curve.","tr":"Hemoglobin pozitif kooperativite gösterir: oksijen bağlanması daha yüksek afiniteli konformasyonu destekler. Miyoglobinin tek bağlanma bölgesi vardır; bu nedenle bağlanma eğrisi sigmoid değil hiperboliktir."},"sourcePages":[31,32,36],"difficulty":"core"},{"id":"c08q3","stem":{"en":"In metabolically active tissue, a rise in CO₂ and a fall in pH have which effect on adult haemoglobin?","tr":"Metabolik olarak aktif dokuda CO₂ artışı ve pH düşüşü erişkin hemoglobinini nasıl etkiler?"},"options":[{"en":"They shift the curve leftward and increase oxygen affinity","tr":"Eğriyi sola kaydırarak oksijen afinitesini artırırlar"},{"en":"They shift the curve rightward and promote oxygen unloading","tr":"Eğriyi sağa kaydırarak oksijen bırakılmasını kolaylaştırırlar"},{"en":"They decrease P50 and reduce tissue oxygen unloading","tr":"P50’yi azaltır ve dokuya oksijen bırakılmasını düşürürler"},{"en":"They leave oxygen affinity unchanged but increase haemoglobin concentration","tr":"Oksijen afinitesini değiştirmez ancak hemoglobin konsantrasyonunu artırırlar"},{"en":"They shift the curve rightward while increasing oxygen affinity","tr":"Oksijen afinitesini artırırken eğriyi sağa kaydırırlar"}],"answer":1,"explanation":{"en":"This is the Bohr effect: increased CO₂ or reduced pH lowers haemoglobin’s oxygen affinity and increases P50. At the same oxygen tension, more oxygen can be released to the tissue.","tr":"Bu Bohr etkisidir: artan CO₂ veya azalan pH hemoglobinin oksijen afinitesini düşürür ve P50’yi artırır. Aynı oksijen basıncında dokuya daha fazla oksijen bırakılabilir."},"sourcePages":[32,33],"difficulty":"applied"},{"id":"c08q4","stem":{"en":"Which combination characterises normal fetal haemoglobin compared with adult HbA?","tr":"Normal fetal hemoglobini erişkin HbA’ya göre hangi bileşim ve özellik tanımlar?"},"options":[{"en":"α₂γ₂ chains and lower oxygen affinity","tr":"α₂γ₂ zincirleri ve daha düşük oksijen afinitesi"},{"en":"α₂β₂ chains and higher oxygen affinity","tr":"α₂β₂ zincirleri ve daha yüksek oksijen afinitesi"},{"en":"α₂δ₂ chains and higher oxygen affinity","tr":"α₂δ₂ zincirleri ve daha yüksek oksijen afinitesi"},{"en":"α₂γ₂ chains and higher oxygen affinity","tr":"α₂γ₂ zincirleri ve daha yüksek oksijen afinitesi"},{"en":"α₂β₂ chains and lower oxygen affinity","tr":"α₂β₂ zincirleri ve daha düşük oksijen afinitesi"}],"answer":3,"explanation":{"en":"HbF contains two α and two γ chains and has greater oxygen affinity than HbA. Its weaker interaction with 2,3-DPG contributes to the leftward position of its oxygen dissociation curve.","tr":"HbF iki α ve iki γ zinciri içerir ve HbA’dan daha yüksek oksijen afinitesine sahiptir. 2,3-DPG ile daha zayıf etkileşimi, oksijen disosiasyon eğrisinin solda yer almasına katkı sağlar."},"sourcePages":[33,34],"difficulty":"core"},{"id":"c08q5","stem":{"en":"Which combination best describes the effect of carboxyhaemoglobin on oxygen transport?","tr":"Karboksihemoglobinin oksijen taşınmasına etkisini hangi seçenek en iyi tanımlar?"},"options":[{"en":"Reduced oxygen-carrying capacity and impaired unloading from remaining oxygenated sites","tr":"Azalmış oksijen taşıma kapasitesi ve kalan oksijenli bölgelerden oksijen bırakılmasının güçleşmesi"},{"en":"Reduced oxygen capacity with a rightward shift that facilitates unloading","tr":"Azalmış oksijen kapasitesi ve bırakılmayı kolaylaştıran sağa kayma"},{"en":"Preserved oxygen capacity with a rightward shift that facilitates unloading","tr":"Korunmuş oksijen kapasitesi ve bırakılmayı kolaylaştıran sağa kayma"},{"en":"Increased oxygen capacity with a leftward shift","tr":"Artmış oksijen kapasitesi ve sola kayma"},{"en":"Preserved haemoglobin binding with reduced oxygen solubility in plasma","tr":"Hemoglobin bağlanması korunurken plazmada oksijen çözünürlüğünün azalması"}],"answer":0,"explanation":{"en":"Carbon monoxide occupies haemoglobin binding sites and reduces available oxygen capacity. It also increases oxygen affinity at remaining sites, shifting the dissociation curve leftward and making tissue unloading more difficult.","tr":"Karbonmonoksit hemoglobinin bağlanma bölgelerini işgal ederek kullanılabilir oksijen kapasitesini azaltır. Ayrıca kalan bölgelerin oksijen afinitesini artırır; eğri sola kayar ve dokulara oksijen bırakılması güçleşir."},"sourcePages":[35,36],"difficulty":"applied"}]},{"id":9,"title":{"en":"Carbon Dioxide Transport","tr":"Karbondioksit Taşınması"},"startPage":37,"section":2,"endPage":39,"questions":[{"id":"c09q1","stem":{"en":"In what chemical form is most carbon dioxide carried in blood?","tr":"Karbondioksitin çoğu kanda hangi kimyasal biçimde taşınır?"},"options":[{"en":"Bicarbonate","tr":"Bikarbonat"},{"en":"Dissolved molecular CO₂","tr":"Çözünmüş moleküler CO₂"},{"en":"Carbaminohaemoglobin","tr":"Karbaminohemoglobin"},{"en":"Undissociated carbonic acid","tr":"Ayrışmamış karbonik asit"},{"en":"Carboxyhaemoglobin","tr":"Karboksihemoglobin"}],"answer":0,"explanation":{"en":"Most blood CO₂ content is represented by bicarbonate formed from CO₂ and water. Carbamino compounds and dissolved CO₂ contribute smaller fractions; carboxyhaemoglobin contains carbon monoxide, not carbon dioxide.","tr":"Kandaki CO₂ içeriğinin çoğunu CO₂ ve sudan oluşan bikarbonat temsil eder. Karbamino bileşikleri ve çözünmüş CO₂ daha küçük paylara sahiptir; karboksihemoglobin karbondioksit değil karbonmonoksit içerir."},"sourcePages":[37,38,39],"difficulty":"core"},{"id":"c09q2","stem":{"en":"As an erythrocyte takes up CO₂ in a systemic capillary, which membrane exchange occurs?","tr":"Eritrosit sistemik kapillerde CO₂ alırken hangi zar değişimi gerçekleşir?"},"options":[{"en":"Bicarbonate and chloride both leave the cell","tr":"Bikarbonat ve klorür birlikte hücreden çıkar"},{"en":"Bicarbonate enters while chloride leaves","tr":"Bikarbonat içeri girerken klorür dışarı çıkar"},{"en":"Bicarbonate leaves in exchange for sodium entering","tr":"Bikarbonat sodyumun içeri girmesi karşılığında çıkar"},{"en":"Bicarbonate leaves the cell while chloride enters","tr":"Bikarbonat hücreden çıkarken klorür içeri girer"},{"en":"Hydrogen ions leave while chloride enters","tr":"Hidrojen iyonları çıkarken klorür içeri girer"}],"answer":3,"explanation":{"en":"The chloride shift exchanges intracellular bicarbonate for extracellular chloride, preserving electroneutrality. Exporting bicarbonate allows continued rapid conversion of CO₂ within the erythrocyte.","tr":"Klorür kaymasında hücre içi bikarbonat hücre dışı klorürle değiş tokuş edilir ve elektriksel nötrlük korunur. Bikarbonatın dışarı çıkarılması eritrosit içinde CO₂ dönüşümünün hızla sürmesini sağlar."},"sourcePages":[37,38],"difficulty":"applied"},{"id":"c09q3","stem":{"en":"What is the Haldane effect?","tr":"Haldane etkisi nedir?"},"options":[{"en":"Increased CO₂ lowers haemoglobin oxygen affinity","tr":"Artan CO₂’nin hemoglobin oksijen afinitesini azaltması"},{"en":"Oxygenated blood carries more CO₂ at the same PCO₂","tr":"Aynı PCO₂’de oksijene kanın daha fazla CO₂ taşıması"},{"en":"Deoxygenated blood can carry more CO₂ than oxygenated blood at the same PCO₂","tr":"Aynı PCO₂’de deoksijene kanın oksijene kandan daha fazla CO₂ taşıyabilmesi"},{"en":"Bicarbonate exits erythrocytes in exchange for chloride","tr":"Bikarbonatın klorür karşılığında eritrositlerden çıkması"},{"en":"Each oxygen molecule bound increases the affinity of remaining sites","tr":"Bağlanan her oksijen molekülünün kalan bölgelerin afinitesini artırması"}],"answer":2,"explanation":{"en":"Deoxyhaemoglobin binds H⁺ more effectively and forms carbamino compounds more readily. Both effects increase CO₂ carriage; the Bohr effect instead describes how CO₂ and pH alter oxygen affinity.","tr":"Deoksihemoglobin H⁺ iyonlarını daha etkili bağlar ve daha kolay karbamino bileşikleri oluşturur. Her iki etki CO₂ taşınmasını artırır; Bohr etkisi ise CO₂ ve pH’nın oksijen afinitesini nasıl değiştirdiğini tanımlar."},"sourcePages":[38,39],"difficulty":"core"},{"id":"c09q4","stem":{"en":"Why does oxygenation of haemoglobin in pulmonary capillaries assist CO₂ elimination?","tr":"Pulmoner kapillerlerde hemoglobinin oksijenlenmesi CO₂ atılımına neden yardımcı olur?"},"options":[{"en":"It increases haemoglobin buffering of H⁺ and formation of carbamino compounds","tr":"Hemoglobinin H⁺ tamponlamasını ve karbamino oluşumunu artırır"},{"en":"It converts bicarbonate to carbaminohaemoglobin without releasing CO₂","tr":"CO₂ salmadan bikarbonatı karbaminohemoglobine dönüştürür"},{"en":"It lowers the solubility coefficient of CO₂ as its main effect","tr":"Başlıca etkisi olarak CO₂’nin çözünürlük katsayısını düşürür"},{"en":"It inhibits carbonic anhydrase and retains bicarbonate in erythrocytes","tr":"Karbonik anhidrazı inhibe eder ve bikarbonatı eritrositlerde tutar"},{"en":"It releases H⁺ and reduces carbamino binding, favouring CO₂ formation and release","tr":"H⁺ salınımına ve karbamino bağlanmasının azalmasına yol açarak CO₂ oluşumunu ve salınmasını destekler"}],"answer":4,"explanation":{"en":"Oxygenation reduces haemoglobin’s binding of H⁺ and CO₂. Released H⁺ combines with bicarbonate, and carbonic anhydrase facilitates the production of CO₂ that can diffuse into alveoli.","tr":"Oksijenlenme hemoglobinin H⁺ ve CO₂ bağlamasını azaltır. Salınan H⁺ bikarbonatla birleşir ve karbonik anhidraz alveollere difüze olabilecek CO₂’nin oluşumunu kolaylaştırır."},"sourcePages":[38],"difficulty":"applied"},{"id":"c09q5","stem":{"en":"How does the blood CO₂ dissociation curve behave over the normal physiological PCO₂ range?","tr":"Kanın CO₂ disosiasyon eğrisi normal fizyolojik PCO₂ aralığında nasıl davranır?"},"options":[{"en":"It has the same marked sigmoid shape as the oxygen saturation curve","tr":"Oksijen satürasyon eğrisiyle aynı belirgin sigmoid şekle sahiptir"},{"en":"CO₂ content rises approximately linearly with PCO₂","tr":"CO₂ içeriği PCO₂ ile yaklaşık doğrusal artar"},{"en":"CO₂ content remains constant as PCO₂ rises","tr":"PCO₂ artarken CO₂ içeriği sabit kalır"},{"en":"CO₂ content falls as PCO₂ rises","tr":"PCO₂ arttıkça CO₂ içeriği azalır"},{"en":"It is identical for fully oxygenated and deoxygenated blood","tr":"Tam oksijene ve deoksijene kan için aynıdır"}],"answer":1,"explanation":{"en":"Around physiological values, the relationship between PCO₂ and total CO₂ content is approximately linear. Deoxygenated blood lies on a higher content curve because of the Haldane effect.","tr":"Fizyolojik değerler çevresinde PCO₂ ile toplam CO₂ içeriği arasındaki ilişki yaklaşık doğrusaldır. Haldane etkisi nedeniyle deoksijene kanın içerik eğrisi daha yukarıda yer alır."},"sourcePages":[39],"difficulty":"core"}]},{"id":10,"title":{"en":"Alveolar Diffusion","tr":"Alveoler Difüzyon"},"startPage":40,"section":2,"endPage":44,"questions":[{"id":"c10q1","stem":{"en":"If diffusion-barrier thickness doubles while area, pressure gradient and gas properties remain unchanged, what happens to gas transfer rate?","tr":"Alan, basınç gradyanı ve gaz özellikleri değişmezken difüzyon bariyerinin kalınlığı iki katına çıkarsa gaz geçiş hızı ne olur?"},"options":[{"en":"It doubles","tr":"İki katına çıkar"},{"en":"It halves","tr":"Yarıya iner"},{"en":"It increases fourfold","tr":"Dört katına çıkar"},{"en":"It remains unchanged","tr":"Değişmez"},{"en":"It becomes zero in every case","tr":"Her durumda sıfır olur"}],"answer":1,"explanation":{"en":"Fick’s relationship makes diffusion rate inversely proportional to barrier thickness. Doubling thickness therefore halves transfer if the other determinants remain fixed.","tr":"Fick ilişkisine göre difüzyon hızı bariyer kalınlığıyla ters orantılıdır. Bu nedenle diğer belirleyiciler sabitken kalınlığın iki katına çıkması geçişi yarıya indirir."},"sourcePages":[40],"difficulty":"applied"},{"id":"c10q2","stem":{"en":"Why does CO₂ diffuse through the alveolar–capillary barrier more readily than O₂?","tr":"CO₂ neden alveol–kapiller bariyerden O₂’ye göre daha kolay difüze olur?"},"options":[{"en":"It has a lower molecular weight than oxygen","tr":"Molekül ağırlığı oksijenden düşüktür"},{"en":"Its lower solubility increases its diffusion coefficient","tr":"Daha düşük çözünürlüğü difüzyon katsayısını artırır"},{"en":"Its larger molecular size increases membrane permeability","tr":"Daha büyük moleküler boyutu zar geçirgenliğini artırır"},{"en":"Its diffusion does not depend on membrane thickness","tr":"Difüzyonu zar kalınlığına bağlı değildir"},{"en":"Its much greater solubility outweighs its higher molecular weight","tr":"Çok daha yüksek çözünürlüğü, daha yüksek molekül ağırlığının etkisine baskın gelir"}],"answer":4,"explanation":{"en":"CO₂ has a higher molecular weight than O₂ but a far higher solubility. Its diffusion through the respiratory membrane is therefore much faster, making isolated oxygen-transfer impairment more likely than isolated CO₂ diffusion failure.","tr":"CO₂’nin molekül ağırlığı O₂’den yüksek olsa da çözünürlüğü çok daha fazladır. Bu nedenle solunum zarından çok daha hızlı difüze olur; izole oksijen geçiş bozukluğu, izole CO₂ difüzyon yetersizliğinden daha olasıdır."},"sourcePages":[40],"difficulty":"core"},{"id":"c10q3","stem":{"en":"A gas rapidly equilibrates between alveolar gas and pulmonary capillary blood. Further uptake is primarily increased by which change?","tr":"Bir gaz alveol gazıyla pulmoner kapiller kan arasında hızla dengeye ulaşır. Ek alımı başlıca hangi değişiklik artırır?"},"options":[{"en":"Increasing barrier thickness","tr":"Bariyer kalınlığının artırılması"},{"en":"Reducing blood flow while keeping ventilation unchanged","tr":"Ventilasyon değişmeden kan akımının azaltılması"},{"en":"Increasing membrane area without changing blood flow after equilibration is already complete","tr":"Dengelenme zaten tamken kan akımı değişmeden zar alanının artırılması"},{"en":"Increasing blood flow through the ventilated capillary bed","tr":"Ventile edilen kapiller yataktan geçen kan akımının artırılması"},{"en":"Increasing capillary transit time by lowering cardiac output","tr":"Kalp debisini düşürerek kapiller geçiş süresinin artırılması"}],"answer":3,"explanation":{"en":"Rapid equilibration means uptake is perfusion limited, as classically demonstrated by nitrous oxide. Bringing in additional blood renews the uptake capacity after the original blood has equilibrated.","tr":"Hızlı dengelenme, klasik örneği nitröz oksitte olduğu gibi alımın perfüzyonla sınırlı olduğunu gösterir. Yeni kan gelmesi, önceki kan dengeye ulaştıktan sonra alım kapasitesini yeniler."},"sourcePages":[41],"difficulty":"applied"},{"id":"c10q4","stem":{"en":"Why may exercise reveal oxygen diffusion limitation in pulmonary fibrosis?","tr":"Egzersiz pulmoner fibroziste oksijen difüzyon kısıtlılığını neden belirginleştirebilir?"},"options":[{"en":"Increased cardiac output shortens capillary transit time across an already impaired barrier","tr":"Artan kalp debisi, zaten bozulmuş bariyerde kapiller geçiş süresini kısaltır"},{"en":"Exercise prolongs capillary transit so blood loses oxygen back into alveoli","tr":"Egzersiz kapiller geçişi uzatarak kanın alveollere geri oksijen kaybetmesine yol açar"},{"en":"Fibrosis raises membrane permeability above normal during exercise","tr":"Fibrozis egzersizde zar geçirgenliğini normalin üzerine çıkarır"},{"en":"Exercise makes oxygen uptake exclusively dependent on anatomical dead space","tr":"Egzersiz oksijen alımını yalnızca anatomik ölü boşluğa bağımlı kılar"},{"en":"Exercise decreases oxygen solubility enough to explain the entire diffusion defect","tr":"Egzersiz oksijen çözünürlüğünü tüm difüzyon bozukluğunu açıklayacak kadar azaltır"}],"answer":0,"explanation":{"en":"A thickened barrier slows equilibration of capillary and alveolar oxygen tensions. Shorter transit during exercise leaves even less time for equilibration, so blood may leave the capillary with an abnormally low oxygen tension.","tr":"Kalınlaşmış bariyer, kapiller ve alveoler oksijen basınçlarının dengelenmesini yavaşlatır. Egzersizde kısalan geçiş süresi dengelenmeye daha az zaman bırakır; kan kapillerden anormal derecede düşük oksijen basıncıyla ayrılabilir."},"sourcePages":[42,43],"difficulty":"applied"},{"id":"c10q5","stem":{"en":"Why is haemoglobin concentration relevant when interpreting the carbon monoxide transfer factor, DLCO?","tr":"Karbonmonoksit difüzyon kapasitesi DLCO yorumlanırken hemoglobin konsantrasyonu neden önemlidir?"},"options":[{"en":"Haemoglobin concentration affects airway calibre but not CO uptake","tr":"Hemoglobin konsantrasyonu hava yolu çapını etkiler ancak CO alımını etkilemez"},{"en":"DLCO measures haemoglobin saturation rather than gas transfer","tr":"DLCO gaz geçişini değil hemoglobin satürasyonunu ölçer"},{"en":"Carbon monoxide uptake depends partly on binding to haemoglobin","tr":"Karbonmonoksit alımı kısmen hemoglobine bağlanmaya bağlıdır"},{"en":"Anaemia raises CO binding capacity and therefore necessarily increases DLCO","tr":"Anemi CO bağlama kapasitesini artırır ve bu nedenle DLCO’yu zorunlu olarak yükseltir"},{"en":"CO transfer occurs entirely through plasma without binding to haemoglobin","tr":"CO geçişi hemoglobine bağlanmadan tamamen plazma üzerinden gerçekleşir"}],"answer":2,"explanation":{"en":"Carbon monoxide binds avidly to haemoglobin, helping keep capillary CO tension low during the test. A low haemoglobin concentration can lower measured uptake without proving a primary membrane defect, so haemoglobin must be considered.","tr":"Karbonmonoksit hemoglobine yüksek afiniteyle bağlanır ve test sırasında kapiller CO basıncının düşük kalmasına yardımcı olur. Düşük hemoglobin, birincil zar bozukluğu olmadan da ölçülen alımı azaltabilir; bu nedenle hemoglobin dikkate alınmalıdır."},"sourcePages":[41,42],"difficulty":"applied"}]},{"id":11,"title":{"en":"Ventilation and Dead Space","tr":"Ventilasyon ve Ölü Boşluk"},"startPage":45,"section":2,"endPage":49,"questions":[{"id":"c11q1","stem":{"en":"Which volumes together constitute physiological dead space?","tr":"Hangi hacimler birlikte fizyolojik ölü boşluğu oluşturur?"},"options":[{"en":"Tidal volume plus residual volume","tr":"Tidal hacim ve rezidüel hacim"},{"en":"Inspiratory reserve plus expiratory reserve volume","tr":"İnspiratuvar rezerv ve ekspiratuvar rezerv hacmi"},{"en":"Anatomical dead space plus alveolar dead space","tr":"Anatomik ölü boşluk ve alveoler ölü boşluk"},{"en":"Vital capacity plus total lung capacity","tr":"Vital kapasite ve total akciğer kapasitesi"},{"en":"Alveolar ventilation plus cardiac output","tr":"Alveoler ventilasyon ve kalp debisi"}],"answer":2,"explanation":{"en":"Anatomical dead space is the conducting-airway volume, while alveolar dead space is ventilation reaching insufficiently perfused alveoli. Their sum is physiological dead space.","tr":"Anatomik ölü boşluk iletici hava yollarının hacmidir; alveoler ölü boşluk ise yeterince perfüze edilmeyen alveollere giden ventilasyonu temsil eder. Toplamları fizyolojik ölü boşluktur."},"sourcePages":[45],"difficulty":"core"},{"id":"c11q2","stem":{"en":"Tidal volume is 500 mL, total dead space is 150 mL and respiratory rate is 12/min. What is alveolar ventilation?","tr":"Tidal hacim 500 mL, toplam ölü boşluk 150 mL ve solunum sayısı 12/dk’dır. Alveoler ventilasyon nedir?"},"options":[{"en":"4.2 L/min","tr":"4,2 L/dk"},{"en":"1.8 L/min","tr":"1,8 L/dk"},{"en":"3.0 L/min","tr":"3,0 L/dk"},{"en":"6.0 L/min","tr":"6,0 L/dk"},{"en":"7.8 L/min","tr":"7,8 L/dk"}],"answer":0,"explanation":{"en":"Alveolar ventilation equals (tidal volume − dead space) × respiratory rate. Here, (500 − 150) × 12 = 4200 mL/min; 6 L/min is total minute ventilation.","tr":"Alveoler ventilasyon (tidal hacim − ölü boşluk) × solunum sayısına eşittir. Burada (500 − 150) × 12 = 4200 mL/dk’dır; 6 L/dk ise toplam dakika ventilasyonudur."},"sourcePages":[46],"difficulty":"applied"},{"id":"c11q3","stem":{"en":"Two people each have minute ventilation of 6 L/min and dead space of 150 mL per breath. Who has greater alveolar ventilation?","tr":"İki kişinin dakika ventilasyonu 6 L/dk ve her soluktaki ölü boşluğu 150 mL’dir. Hangisinin alveoler ventilasyonu daha yüksektir?"},"options":[{"en":"The person breathing 250 mL at 24/min","tr":"24/dk hızında 250 mL soluyan kişi"},{"en":"They must have identical alveolar ventilation","tr":"Alveoler ventilasyonları zorunlu olarak aynıdır"},{"en":"Neither has any alveolar ventilation","tr":"İkisinin de alveoler ventilasyonu yoktur"},{"en":"Alveolar ventilation cannot be calculated from these data","tr":"Bu verilerden alveoler ventilasyon hesaplanamaz"},{"en":"The person breathing 500 mL at 12/min","tr":"12/dk hızında 500 mL soluyan kişi"}],"answer":4,"explanation":{"en":"Breathing 500 mL at 12/min gives (500 − 150) × 12 = 4.2 L/min, whereas 250 mL at 24/min gives (250 − 150) × 24 = 2.4 L/min. Rapid shallow breathing wastes a larger fraction of the same minute ventilation on dead space.","tr":"12/dk hızında 500 mL solunumda (500 − 150) × 12 = 4,2 L/dk; 24/dk hızında 250 mL solunumda (250 − 150) × 24 = 2,4 L/dk elde edilir. Hızlı yüzeyel solunumda aynı dakika ventilasyonunun daha büyük bölümü ölü boşluğa harcanır."},"sourcePages":[46,47],"difficulty":"applied"},{"id":"c11q4","stem":{"en":"At steady state with unchanged metabolic CO₂ production, what happens to PaCO₂ if alveolar ventilation doubles?","tr":"Metabolik CO₂ üretimi değişmeden kararlı durumda alveoler ventilasyon iki katına çıkarsa PaCO₂ ne olur?"},"options":[{"en":"It doubles","tr":"İki katına çıkar"},{"en":"It falls to approximately half its previous value","tr":"Yaklaşık olarak önceki değerinin yarısına düşer"},{"en":"It remains unchanged","tr":"Değişmez"},{"en":"It rises fourfold","tr":"Dört katına çıkar"},{"en":"It becomes equal to inspired oxygen pressure","tr":"İnspire edilen oksijen basıncına eşitlenir"}],"answer":1,"explanation":{"en":"At a fixed CO₂ production rate, PaCO₂ is inversely proportional to alveolar ventilation. The relationship concerns alveolar ventilation, so doubling total minute ventilation does not necessarily give the same result if dead space also changes.","tr":"CO₂ üretim hızı sabitken PaCO₂ alveoler ventilasyonla ters orantılıdır. Bu ilişki alveoler ventilasyona aittir; ölü boşluk da değişiyorsa toplam dakika ventilasyonunun iki katına çıkması aynı sonucu zorunlu kılmaz."},"sourcePages":[46,47],"difficulty":"applied"},{"id":"c11q5","stem":{"en":"The classical Bohr dead-space equation compares alveolar CO₂ with which expired measurement?","tr":"Klasik Bohr ölü boşluk denkleminde alveoler CO₂ hangi ekspirasyon ölçümüyle karşılaştırılır?"},"options":[{"en":"Only the final end-tidal CO₂ value","tr":"Yalnızca son ekspirasyon sonu CO₂ değeri"},{"en":"Mixed venous CO₂ tension","tr":"Mikst venöz CO₂ basıncı"},{"en":"The highest CO₂ value measured in the alveolar plateau","tr":"Alveoler platoda ölçülen en yüksek CO₂ değeri"},{"en":"Mixed expired CO₂ averaged over the entire expired tidal volume","tr":"Ekshale edilen tidal hacmin tamamı üzerinden ortalanmış karışık ekspirasyon CO₂’si"},{"en":"Arterial CO₂ tension as the expired-gas measurement","tr":"Ekspirasyon gazı ölçümü olarak arteriyel CO₂ basıncı"}],"answer":3,"explanation":{"en":"The classical equation is VD/VT = (PACO₂ − mixed expired PCO₂)/PACO₂. Mixed expired gas includes the CO₂-poor dead-space portion, so it must not be replaced by end-tidal gas; substituting arterial for alveolar CO₂ is the Enghoff modification.","tr":"Klasik denklem VD/VT = (PACO₂ − karışık ekspirasyon PCO₂’si)/PACO₂ biçimindedir. Karışık ekspirasyon gazı CO₂’den fakir ölü boşluk bölümünü de içerdiğinden ekspirasyon sonu gazıyla değiştirilmemelidir; alveoler CO₂ yerine arteriyel CO₂ kullanılması Enghoff modifikasyonudur."},"sourcePages":[48,49],"difficulty":"core"}]},{"id":12,"title":{"en":"Static Lung Volumes","tr":"Statik Akciğer Hacimleri"},"startPage":50,"section":2,"endPage":55,"questions":[{"id":"c12q1","stem":{"en":"Which sum equals functional residual capacity?","tr":"Hangi toplam fonksiyonel rezidüel kapasiteye eşittir?"},"options":[{"en":"Tidal volume + inspiratory reserve volume","tr":"Tidal hacim + inspiratuvar rezerv hacmi"},{"en":"Tidal volume + vital capacity","tr":"Tidal hacim + vital kapasite"},{"en":"Total lung capacity + residual volume","tr":"Total akciğer kapasitesi + rezidüel hacim"},{"en":"Residual volume + expiratory reserve volume","tr":"Rezidüel hacim + ekspiratuvar rezerv hacmi"},{"en":"Inspiratory reserve volume + vital capacity","tr":"İnspiratuvar rezerv hacmi + vital kapasite"}],"answer":3,"explanation":{"en":"FRC is the gas remaining after a normal passive expiration and comprises residual volume plus expiratory reserve volume. Tidal volume plus inspiratory reserve volume instead gives inspiratory capacity.","tr":"FRK normal pasif ekspirasyon sonunda kalan gazdır ve rezidüel hacim ile ekspiratuvar rezerv hacminin toplamından oluşur. Tidal hacim ile inspiratuvar rezerv hacminin toplamı ise inspiratuvar kapasiteyi verir."},"sourcePages":[50],"difficulty":"core"},{"id":"c12q2","stem":{"en":"Which measurement cannot be obtained by simple spirometry alone?","tr":"Hangi ölçüm yalnızca basit spirometriyle elde edilemez?"},"options":[{"en":"Tidal volume","tr":"Tidal hacim"},{"en":"Residual volume","tr":"Rezidüel hacim"},{"en":"Vital capacity","tr":"Vital kapasite"},{"en":"Expiratory reserve volume","tr":"Ekspiratuvar rezerv hacmi"},{"en":"Inspiratory capacity","tr":"İnspiratuvar kapasite"}],"answer":1,"explanation":{"en":"Residual volume remains in the lungs after maximal expiration and cannot be exhaled into a spirometer. FRC and total lung capacity also require another measurement method because both include residual volume.","tr":"Rezidüel hacim maksimal ekspirasyondan sonra akciğerde kalır ve spirometreye üflenemez. FRK ve total akciğer kapasitesi de rezidüel hacim içerdiği için başka bir ölçüm yöntemi gerektirir."},"sourcePages":[50,52],"difficulty":"core"},{"id":"c12q3","stem":{"en":"Why does a reduction in FRC shorten the oxygen reserve available during apnoea, other factors being equal?","tr":"Diğer etkenler aynıyken FRK azalması apnede kullanılabilir oksijen rezervinin süresini neden kısaltır?"},"options":[{"en":"A smaller end-expiratory gas volume stores less oxygen","tr":"Daha küçük ekspirasyon sonu gaz hacmi daha az oksijen depolar"},{"en":"A smaller FRC directly reduces the oxygen-binding capacity of each haemoglobin molecule","tr":"Daha küçük FRK her hemoglobin molekülünün oksijen bağlama kapasitesini doğrudan azaltır"},{"en":"Reducing FRC necessarily doubles metabolic oxygen consumption","tr":"FRK’nin azalması metabolik oksijen tüketimini zorunlu olarak iki katına çıkarır"},{"en":"A smaller FRC stores more nitrogen at the same fractional gas composition","tr":"Aynı kesirsel gaz bileşiminde daha küçük FRK daha fazla azot depolar"},{"en":"Reducing FRC lowers tissue oxygen extraction enough to explain earlier desaturation","tr":"FRK’nin azalması doku oksijen ekstraksiyonunu erken desatürasyonu açıklayacak kadar düşürür"}],"answer":0,"explanation":{"en":"FRC acts as a pulmonary oxygen reservoir between breaths and during apnoea. Reducing the reservoir reduces available oxygen storage; the rate of depletion also depends on oxygen consumption and the starting gas composition.","tr":"FRK soluklar arasında ve apne sırasında pulmoner oksijen deposu görevi görür. Deponun küçülmesi kullanılabilir oksijen miktarını azaltır; tükenme hızı oksijen tüketimine ve başlangıç gaz bileşimine de bağlıdır."},"sourcePages":[51,52],"difficulty":"applied"},{"id":"c12q4","stem":{"en":"Why can helium dilution underestimate lung volume in a person with substantial gas trapping?","tr":"Belirgin hava hapsi olan bir kişide helyum dilüsyonu akciğer hacmini neden olduğundan düşük ölçebilir?"},"options":[{"en":"Helium is absorbed rapidly into pulmonary capillary blood","tr":"Helyum pulmoner kapiller kana hızla emilir"},{"en":"Trapped gas causes complete equilibration at an incorrectly high lung volume","tr":"Hapsolmuş gaz hatalı olarak yüksek akciğer hacminde tam dengelenmeye yol açar"},{"en":"Helium does not adequately mix with gas behind closed or poorly communicating airways","tr":"Helyum kapalı veya iletişimi zayıf hava yollarının gerisindeki gazla yeterince karışamaz"},{"en":"Helium dilution measures vital capacity but excludes all normally ventilated residual volume","tr":"Helyum dilüsyonu vital kapasiteyi ölçer ancak normal ventile edilen tüm rezidüel hacmi dışlar"},{"en":"The initial helium quantity increases during equilibration","tr":"Dengelenme sırasında başlangıçtaki helyum miktarı artar"}],"answer":2,"explanation":{"en":"Dilution methods measure gas spaces that communicate with the test gas. Non-communicating trapped gas is missed; body plethysmography can include this thoracic gas volume.","tr":"Dilüsyon yöntemleri test gazıyla iletişim kuran gaz boşluklarını ölçer. İletişimsiz hapsolmuş gaz ölçüme katılmaz; vücut pletismografisi bu torasik gaz hacmini de kapsayabilir."},"sourcePages":[52,53],"difficulty":"applied"},{"id":"c12q5","stem":{"en":"What is the consequence when closing capacity exceeds FRC?","tr":"Kapanma kapasitesi FRK’yi aştığında ne olur?"},"options":[{"en":"Airway closure occurs only below residual volume","tr":"Hava yolu kapanması yalnızca rezidüel hacmin altında gerçekleşir"},{"en":"Dependent regions receive relatively more ventilation at end-expiration","tr":"Bağımlı bölgeler ekspirasyon sonunda görece daha fazla ventilasyon alır"},{"en":"The tidal breathing range remains entirely above the airway-closing range","tr":"Tidal solunum aralığı hava yolu kapanma aralığının tamamen üzerinde kalır"},{"en":"Normal tidal expiration necessarily ends at total lung capacity","tr":"Normal tidal ekspirasyon zorunlu olarak total akciğer kapasitesinde sona erer"},{"en":"Dependent small airways may close during ordinary tidal breathing","tr":"Bağımlı bölgelerdeki küçük hava yolları normal tidal solunum sırasında kapanabilir"}],"answer":4,"explanation":{"en":"When the tidal breathing range enters the airway-closing range, some dependent units become poorly ventilated despite continuing perfusion. This promotes ventilation–perfusion mismatch and can increase the work required to reopen airways.","tr":"Tidal solunum aralığı hava yolu kapanmasının başladığı aralığa girdiğinde, bağımlı bölgelerdeki bazı birimler perfüzyon sürerken yetersiz ventile olur. Bu durum ventilasyon–perfüzyon uyumsuzluğunu artırır ve hava yollarını yeniden açmak için gereken işi yükseltebilir."},"sourcePages":[55],"difficulty":"applied"}]},{"id":13,"title":{"en":"Spirometry","tr":"Spirometri"},"startPage":56,"section":2,"endPage":62,"questions":[{"id":"c13q1","stem":{"en":"Which spirometric pattern most strongly supports airflow obstruction?","tr":"Hangi spirometrik örüntü hava akımı obstrüksiyonunu en güçlü biçimde destekler?"},"options":[{"en":"FVC reduced with a preserved FEV₁/FVC ratio as the sole finding","tr":"Tek bulgu olarak FVC düşüklüğü ve korunmuş FEV₁/FVC oranı"},{"en":"FEV₁ and FVC both reduced in the same proportion","tr":"FEV₁ ve FVC’nin aynı oranda azalması"},{"en":"An increased FEV₁/FVC ratio with reduced FVC","tr":"Düşük FVC ile artmış FEV₁/FVC oranı"},{"en":"Normal FEV₁/FVC with an isolated reduction in peak flow","tr":"Normal FEV₁/FVC ile izole tepe akım azalması"},{"en":"FEV₁ reduced disproportionately to FVC, giving a low FEV₁/FVC ratio","tr":"FEV₁’in FVC’ye göre orantısız azalması ve düşük FEV₁/FVC oranı"}],"answer":4,"explanation":{"en":"Obstruction slows forced expiration, reducing the fraction of vital capacity exhaled in the first second. Interpretation uses appropriate reference limits and test quality; a low FEV₁ alone does not establish obstruction.","tr":"Obstrüksiyon zorlu ekspirasyonu yavaşlatır ve vital kapasitenin ilk saniyede çıkarılan bölümünü azaltır. Yorumlama uygun referans sınırlarını ve test kalitesini dikkate alır; yalnızca düşük FEV₁ obstrüksiyonu kanıtlamaz."},"sourcePages":[56,57,58],"difficulty":"applied"},{"id":"c13q2","stem":{"en":"Spirometry shows a reduced FVC with a preserved FEV₁/FVC ratio. Which additional finding confirms restrictive ventilatory impairment?","tr":"Spirometride FVC düşük, FEV₁/FVC oranı korunmuştur. Hangi ek bulgu restriktif ventilatuvar bozukluğu doğrular?"},"options":[{"en":"Normal total lung capacity","tr":"Normal total akciğer kapasitesi"},{"en":"An isolated increase in residual volume","tr":"Yalnızca rezidüel hacim artışı"},{"en":"Total lung capacity below the lower limit of normal","tr":"Total akciğer kapasitesinin normalin alt sınırının altında olması"},{"en":"A low peak flow without other measurements","tr":"Başka ölçüm olmaksızın düşük tepe akımı"},{"en":"A normal oxygen saturation alone","tr":"Yalnızca normal oksijen satürasyonu"}],"answer":2,"explanation":{"en":"A low FVC with a preserved ratio suggests restriction but is not sufficient to prove it. Restriction is confirmed by a reduced TLC; submaximal effort or gas trapping can also reduce FVC.","tr":"Düşük FVC ve korunmuş oran restriksiyonu düşündürür ancak kanıtlamaya yetmez. Restriksiyon azalmış total akciğer kapasitesiyle doğrulanır; yetersiz efor veya hava hapsi de FVC’yi azaltabilir."},"sourcePages":[56,57,59],"difficulty":"applied"},{"id":"c13q3","stem":{"en":"Both inspiratory and expiratory limbs of a flow–volume loop are flattened. Which pattern is most likely?","tr":"Akım–hacim halkasının hem inspiratuvar hem ekspiratuvar kolları düzleşmiştir. En olası örüntü hangisidir?"},"options":[{"en":"Variable extrathoracic obstruction","tr":"Değişken ekstratorasik obstrüksiyon"},{"en":"Fixed large-airway obstruction","tr":"Sabit büyük hava yolu obstrüksiyonu"},{"en":"Variable intrathoracic obstruction","tr":"Değişken intratorasik obstrüksiyon"},{"en":"Uncomplicated restrictive ventilatory impairment","tr":"Komplike olmayan restriktif ventilatuvar bozukluk"},{"en":"Diffuse small-airway obstruction with a concave expiratory limb","tr":"Konkav ekspiratuvar kol oluşturan yaygın küçük hava yolu obstrüksiyonu"}],"answer":1,"explanation":{"en":"A fixed narrowing limits flow during both inspiration and expiration. A variable extrathoracic lesion preferentially flattens inspiration, whereas a variable intrathoracic lesion preferentially limits expiration.","tr":"Sabit bir darlık hem inspirasyonda hem ekspirasyonda akımı sınırlar. Değişken ekstratorasik lezyon öncelikle inspirasyonu, değişken intratorasik lezyon ise öncelikle ekspirasyonu sınırlar."},"sourcePages":[60,61,62],"difficulty":"applied"},{"id":"c13q4","stem":{"en":"Why does a variable extrathoracic obstruction usually limit inspiration more than expiration?","tr":"Değişken ekstratorasik obstrüksiyon neden genellikle inspirasyonu ekspirasyondan daha fazla sınırlar?"},"options":[{"en":"Positive inspiratory airway pressure presses the lesion inward","tr":"Pozitif inspiratuvar hava yolu basıncı lezyonu içeri iter"},{"en":"Positive pleural pressure acts directly on the extrathoracic lesion during inspiration","tr":"İnspirasyonda pozitif plevral basınç ekstratorasik lezyona doğrudan etki eder"},{"en":"Expiratory intraluminal pressure is normally more negative than inspiratory pressure","tr":"Ekspirasyonda lümen içi basınç normalde inspirasyon basıncından daha negatiftir"},{"en":"Subatmospheric intraluminal pressure during inspiration favours inward airway collapse","tr":"İnspirasyonda lümen içi basıncın atmosfer basıncının altına inmesi hava yolunun içe çökmesini kolaylaştırır"},{"en":"Lung elastic recoil is the principal force collapsing the extrathoracic segment during inspiration","tr":"İnspirasyonda ekstratorasik bölümü çökerten başlıca kuvvet akciğer elastik geri çekimidir"}],"answer":3,"explanation":{"en":"During inspiration, pressure inside an extrathoracic airway falls below the surrounding atmospheric pressure. A compliant narrowed segment therefore tends to collapse inward, while positive pressure during expiration tends to open it.","tr":"İnspirasyonda ekstratorasik hava yolunun iç basıncı çevredeki atmosfer basıncının altına iner. Bu nedenle esnek daralmış bölüm içe çökmeye eğilim gösterir; ekspirasyondaki pozitif basınç ise onu açma eğilimindedir."},"sourcePages":[60,61,62],"difficulty":"applied"},{"id":"c13q5","stem":{"en":"Why does increasing expiratory muscle effort eventually fail to increase flow during forced expiration?","tr":"Zorlu ekspirasyonda ekspiratuvar kas çabasının artırılması neden bir noktadan sonra akımı artırmaz?"},"options":[{"en":"Greater pleural pressure also compresses intrathoracic airways, producing flow limitation","tr":"Artan plevral basınç intratorasik hava yollarını
