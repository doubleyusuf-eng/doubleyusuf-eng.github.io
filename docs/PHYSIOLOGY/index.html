iç mitokondri zarından geri geçmesine olanak verir. Enerji ATP olarak korunmak yerine ısı şeklinde yayılır ve titremesiz termogenezi destekler."},"sourcePages":[377],"difficulty":"core"},{"id":"c77q5","stem":{"en":"Why can hepatic glycogen contribute directly to blood glucose whereas skeletal muscle glycogen mainly supports local metabolism?","tr":"Karaciğer glikojeni kan glukozuna doğrudan katkıda bulunabilirken iskelet kası glikojeni neden esas olarak yerel metabolizmayı destekler?"},"options":[{"en":"Skeletal muscle lacks glycogen phosphorylase","tr":"İskelet kasında glikojen fosforilaz yoktur"},{"en":"Liver has glucose-6-phosphatase, which skeletal muscle lacks","tr":"Karaciğerde, iskelet kasında bulunmayan glukoz-6-fosfataz vardır"},{"en":"Only liver glycogen can be converted to glucose-6-phosphate","tr":"Yalnızca karaciğer glikojeni glukoz-6-fosfata dönüştürülebilir"},{"en":"Skeletal muscle has glucose-6-phosphatase but no hexokinase","tr":"İskelet kasında glukoz-6-fosfataz vardır ancak hekzokinaz yoktur"},{"en":"Liver exports glucose-6-phosphate directly without dephosphorylation","tr":"Karaciğer glukoz-6-fosfatı defosforilasyon olmadan doğrudan dışarı verir"}],"answer":1,"explanation":{"en":"Glucose-6-phosphatase allows the liver to form free glucose for release into blood. Skeletal muscle lacks this enzyme, so its glycogen-derived glucose-6-phosphate is used locally rather than released as free glucose.","tr":"Glukoz-6-fosfataz, karaciğerin kana verilmek üzere serbest glukoz oluşturmasını sağlar. İskelet kasında bu enzim bulunmadığından glikojenden elde edilen glukoz-6-fosfat serbest glukoz olarak salınmak yerine yerel olarak kullanılır."},"sourcePages":[380,381],"difficulty":"core"}]},{"id":78,"title":{"en":"Starvation","tr":"Açlık"},"startPage":384,"section":8,"endPage":386,"questions":[{"id":"c78q1","stem":{"en":"Which hormonal shift generally favours mobilisation of energy stores during fasting?","tr":"Açlık sırasında enerji depolarının kullanılmasını genel olarak hangi hormonal değişim destekler?"},"options":[{"en":"A higher insulin-to-glucagon ratio","tr":"İnsülin/glukagon oranının artması"},{"en":"A lower insulin-to-glucagon ratio","tr":"İnsülin/glukagon oranının azalması"},{"en":"Increased insulin with suppressed lipolysis","tr":"Lipoliz baskılanırken insülinin artması"},{"en":"Suppression of glucagon with increased glycogen synthesis","tr":"Glikojen sentezi artarken glukagonun baskılanması"},{"en":"Increased insulin-driven triglyceride storage","tr":"İnsülin aracılı trigliserit depolanmasının artması"}],"answer":1,"explanation":{"en":"Falling insulin relative to glucagon favours glycogen breakdown, mobilisation of fat, and glucose production. The fed-state pattern has the opposite emphasis, promoting storage rather than reliance on endogenous reserves.","tr":"İnsülinin glukagona göre azalması glikojen yıkımını, yağın mobilizasyonunu ve glukoz üretimini destekler. Tokluk durumunda ise ağırlık, iç depolara dayanmak yerine depolama yönündedir."},"sourcePages":[384],"difficulty":"core"},{"id":"c78q2","stem":{"en":"Once liver glycogen becomes depleted during fasting, which process sustains glucose production?","tr":"Açlık sırasında karaciğer glikojeni tükendikten sonra glukoz üretimini hangi süreç sürdürür?"},"options":[{"en":"Continued release of glucose from an unchanged liver glycogen store","tr":"Değişmeyen karaciğer glikojen deposundan sürekli glukoz salınımı"},{"en":"Direct export of free glucose from skeletal muscle glycogen","tr":"İskelet kası glikojeninden doğrudan serbest glukoz salınımı"},{"en":"Conversion of all even-chain fatty-acid carbon into net glucose","tr":"Çift sayıda karbon içeren yağ asitlerinin tüm karbonunun net glukoza dönüştürülmesi"},{"en":"Gluconeogenesis from substrates such as lactate, glycerol, and glucogenic amino acids","tr":"Laktat, gliserol ve glukojenik aminoasitler gibi substratlardan glukoneogenez"},{"en":"Hydrolysis of plasma ketones into glucose without energy input","tr":"Plazma ketonlarının enerji harcanmadan hidrolizle glukoza dönüşmesi"}],"answer":3,"explanation":{"en":"Gluconeogenesis supplies glucose when glycogen availability falls, using carbon from lactate, glycerol, and suitable amino acids. It requires energy and is distinct from simply releasing glucose already stored as glycogen.","tr":"Glikojen azaldığında glukoneogenez; laktat, gliserol ve uygun aminoasitlerin karbonunu kullanarak glukoz sağlar. Enerji gerektirir ve önceden glikojen halinde depolanmış glukozun yalnızca serbestleştirilmesinden farklıdır."},"sourcePages":[384],"difficulty":"core"},{"id":"c78q3","stem":{"en":"Which adaptation helps reduce the need to use body protein for glucose production during prolonged fasting?","tr":"Uzamış açlıkta glukoz üretimi için vücut proteinini kullanma gereksinimini azaltmaya hangi uyum yardımcı olur?"},"options":[{"en":"Increased cerebral use of ketone bodies","tr":"Beynin keton cisimciklerini daha fazla kullanması"},{"en":"An increase in the brain’s absolute glucose requirement","tr":"Beynin mutlak glukoz gereksiniminin artması"},{"en":"A sustained rise in basal metabolic rate","tr":"Bazal metabolizma hızının sürekli artması"},{"en":"A progressive inability of tissues to oxidise fatty acids","tr":"Dokuların yağ asitlerini oksitleme yeteneğinin giderek kaybolması"},{"en":"An increase in insulin-mediated fat storage","tr":"İnsülin aracılı yağ depolanmasının artması"}],"answer":0,"explanation":{"en":"With prolonged fasting, the brain uses more ketone bodies, reducing its glucose requirement. This helps reduce gluconeogenic demand on amino acids and conserve body protein, although some glucose is still required.","tr":"Uzamış açlıkta beyin daha fazla keton cisimciği kullanır ve glukoz gereksinimi azalır. Bir miktar glukoz gereksinimi sürse de bu uyum aminoasitlerden glukoneogenez ihtiyacını azaltarak vücut proteininin korunmasına yardımcı olur."},"sourcePages":[384],"difficulty":"applied"},{"id":"c78q4","stem":{"en":"Why can plasma phosphate, potassium, and magnesium fall when carbohydrate feeding resumes after severe undernutrition?","tr":"Ciddi yetersiz beslenme sonrasında karbonhidratla beslenme yeniden başladığında plazma fosfatı, potasyumu ve magnezyumu neden düşebilir?"},"options":[{"en":"Falling insulin drives phosphate and potassium out of cells","tr":"İnsülin azalması fosfat ve potasyumu hücre dışına çıkarır"},{"en":"Rising glucagon suppresses cellular uptake of these electrolytes","tr":"Glukagon artışı bu elektrolitlerin hücre içine alımını baskılar"},{"en":"An insulin rise promotes cellular uptake during renewed anabolism","tr":"İnsülin artışı, yeniden başlayan anabolizma sırasında hücre içine alımı artırır"},{"en":"Reduced anabolism lowers intracellular phosphate demand","tr":"Anabolizmanın azalması hücre içi fosfat gereksinimini düşürür"},{"en":"Carbohydrate feeding immediately restores depleted intracellular stores without redistribution","tr":"Karbonhidratla beslenme tükenmiş hücre içi depoları yeniden dağılım olmadan hemen yerine koyar"}],"answer":2,"explanation":{"en":"Refeeding raises insulin and promotes intracellular uptake and use of electrolytes in anabolism. In a depleted patient, these shifts can sharply lower measured plasma concentrations and contribute to refeeding syndrome.","tr":"Yeniden beslenme insülini artırır ve elektrolitlerin hücre içine alınarak anabolizmada kullanılmasını destekler. Depoları azalmış bir hastada bu kaymalar, ölçülen plazma konsantrasyonlarını belirgin azaltarak yeniden beslenme sendromuna katkıda bulunabilir."},"sourcePages":[385],"difficulty":"applied"},{"id":"c78q5","stem":{"en":"Which change is expected as an energy-conserving adaptation to prolonged starvation?","tr":"Uzamış açlıkta enerji koruyucu bir uyum olarak hangi değişiklik beklenir?"},"options":[{"en":"Increased basal metabolic rate with increased thermogenesis","tr":"Bazal metabolizma hızının ve termogenezin artması"},{"en":"Increased sympathetic tone maintaining excessive heat production","tr":"Aşırı ısı üretimini sürdüren sempatik tonus artışı"},{"en":"Increased resting muscle protein synthesis despite absent intake","tr":"Alım olmamasına rağmen istirahatte kas protein sentezinin artması"},{"en":"Increased glucose oxidation with suppression of ketone use","tr":"Keton kullanımı baskılanırken glukoz oksidasyonunun artması"},{"en":"Reduced basal metabolic rate and spontaneous activity","tr":"Bazal metabolizma hızının ve kendiliğinden aktivitenin azalması"}],"answer":4,"explanation":{"en":"Prolonged starvation reduces basal metabolic demand and unnecessary movement to conserve energy. Reduced sympathetic activity can also impair temperature and blood-pressure regulation rather than increasing heat production.","tr":"Uzamış açlıkta enerjiyi korumak için bazal metabolik gereksinim ve gereksiz hareket azalır. Sempatik etkinliğin azalması, ısı üretimini artırmak yerine sıcaklık ve kan basıncı düzenlenmesini de bozabilir."},"sourcePages":[384],"difficulty":"core"}]},{"id":79,"title":{"en":"Stress Response","tr":"Stres Yanıtı"},"startPage":387,"section":8,"endPage":390,"questions":[{"id":"c79q1","stem":{"en":"Which two routes help initiate the hypothalamic response to tissue injury?","tr":"Doku hasarına hipotalamik yanıtın başlamasına hangi iki yol yardımcı olur?"},"options":[{"en":"Efferent motor signals and reduced cortisol secretion","tr":"Efferent motor sinyaller ve azalmış kortizol salgısı"},{"en":"Increased vagal output and suppressed inflammatory signalling","tr":"Artmış vagal çıkış ve baskılanmış inflamatuvar sinyal iletimi"},{"en":"Falling ACTH and rising insulin as the primary injury signals","tr":"Temel hasar sinyalleri olarak azalan ACTH ve artan insülin"},{"en":"Local platelet activation without neural or circulating mediator input","tr":"Sinirsel veya dolaşımdaki mediyatör girdisi olmadan yerel trombosit aktivasyonu"},{"en":"Afferent neural signals and circulating inflammatory cytokines","tr":"Afferent sinir sinyalleri ve dolaşımdaki inflamatuvar sitokinler"}],"answer":4,"explanation":{"en":"Injury sends sensory and autonomic afferent information toward central control centres and triggers inflammatory mediator release. Neural and humoral signals together activate the hypothalamic neuroendocrine stress response.","tr":"Hasar, merkezi kontrol bölgelerine duyusal ve otonom afferent bilgi gönderir ve inflamatuvar mediyatör salınımını tetikler. Sinirsel ve humoral sinyaller birlikte hipotalamik nöroendokrin stres yanıtını etkinleştirir."},"sourcePages":[387],"difficulty":"core"},{"id":"c79q2","stem":{"en":"Which metabolic pattern contributes to stress hyperglycaemia after major surgery?","tr":"Büyük ameliyat sonrası stres hiperglisemisine hangi metabolik örüntü katkıda bulunur?"},"options":[{"en":"Suppressed gluconeogenesis with increased insulin sensitivity","tr":"İnsülin duyarlılığı artarken glukoneogenezin baskılanması"},{"en":"Increased glucose production with reduced effective insulin action","tr":"Etkin insülin etkisi azalırken glukoz üretiminin artması"},{"en":"Suppressed glycogenolysis with increased glucose storage","tr":"Glukoz depolanması artarken glikojenolizin baskılanması"},{"en":"Reduced catecholamines with increased peripheral glucose uptake","tr":"Periferik glukoz alımı artarken katekolaminlerin azalması"},{"en":"Increased insulin action with reduced glucagon activity","tr":"Glukagon etkinliği azalırken insülin etkisinin artması"}],"answer":1,"explanation":{"en":"Catecholamines, cortisol, and glucagon favour glucose availability, while reduced insulin secretion or effectiveness limits uptake and storage. Hyperglycaemia can therefore occur even without carbohydrate intake.","tr":"Katekolaminler, kortizol ve glukagon glukoz sunumunu artırırken insülin salgısının veya etkinliğinin azalması alımı ve depolamayı sınırlar. Bu nedenle karbonhidrat alınmasa bile hiperglisemi gelişebilir."},"sourcePages":[387,388],"difficulty":"applied"},{"id":"c79q3","stem":{"en":"What does negative nitrogen balance signify during the postoperative stress response?","tr":"Ameliyat sonrası stres yanıtında negatif azot dengesi neyi gösterir?"},"options":[{"en":"Nitrogen intake exceeds loss, reflecting net protein storage","tr":"Azot alımı kaybı aşar ve net protein depolanmasını yansıtır"},{"en":"Nitrogen excretion is zero despite muscle loss","tr":"Kas kaybına rağmen azot atılımı sıfırdır"},{"en":"Only fat stores are being consumed","tr":"Yalnızca yağ depoları tüketilmektedir"},{"en":"Nitrogen loss exceeds intake, reflecting net body protein breakdown","tr":"Azot kaybı alımı aşar ve net vücut proteini yıkımını yansıtır"},{"en":"All dietary amino acids are incorporated into muscle","tr":"Besinlerle alınan tüm aminoasitler kasa katılmaktadır"}],"answer":3,"explanation":{"en":"Stress-related proteolysis releases amino acids for glucose production and synthesis of proteins needed in the injury response. When nitrogen excretion exceeds intake, the overall result is loss of body protein, including skeletal muscle.","tr":"Strese bağlı proteoliz, glukoz üretimi ve hasar yanıtında gereken proteinlerin sentezi için aminoasitleri serbestleştirir. Azot atılımı alımı aştığında genel sonuç, iskelet kası dahil vücut proteininin kaybıdır."},"sourcePages":[388],"difficulty":"core"},{"id":"c79q4","stem":{"en":"Which hormonal combination favours postoperative retention of sodium and water?","tr":"Hangi hormonal kombinasyon ameliyat sonrası sodyum ve su tutulmasını destekler?"},"options":[{"en":"Increased mineralocorticoid activity together with increased ADH","tr":"Artmış mineralokortikoid etkinlik ile birlikte ADH artışı"},{"en":"Suppressed aldosterone together with suppressed ADH","tr":"Aldosteron ve ADH’nin birlikte baskılanması"},{"en":"Increased atrial natriuretic peptide with reduced renin","tr":"Renin azalırken atriyal natriüretik peptidin artması"},{"en":"Reduced sympathetic activity with reduced angiotensin II","tr":"Anjiyotensin II azalırken sempatik etkinliğin azalması"},{"en":"Suppressed cortisol and increased free-water clearance","tr":"Kortizol baskılanırken serbest su klirensinin artması"}],"answer":0,"explanation":{"en":"Mineralocorticoid effects promote renal sodium retention, while ADH increases collecting-duct water reabsorption. Together they reduce the ability to excrete an administered salt and water load during physiological stress.","tr":"Mineralokortikoid etkiler böbrekte sodyum tutulmasını desteklerken ADH toplayıcı kanaldan su geri emilimini artırır. Birlikte, fizyolojik stres sırasında verilen tuz ve su yükünü atma kapasitesini azaltırlar."},"sourcePages":[387,388],"difficulty":"applied"},{"id":"c79q5","stem":{"en":"Which component of the surgical stress response is most directly attenuated by an effective neuraxial block?","tr":"Etkili nöraksiyel blok cerrahi stres yanıtının hangi bileşenini en doğrudan azaltır?"},"options":[{"en":"Local cytokine generation at the site of tissue injury","tr":"Doku hasarı bölgesinde yerel sitokin üretimi"},{"en":"Circulating cortisol binding to tissue receptors","tr":"Dolaşımdaki kortizolün doku reseptörlerine bağlanması"},{"en":"Afferent neural signalling from the operative region","tr":"Ameliyat bölgesinden gelen afferent sinir sinyalleri"},{"en":"Hepatic response to circulating interleukin-6","tr":"Karaciğerin dolaşımdaki interlökin-6’ya yanıtı"},{"en":"Complement activation within the operative wound","tr":"Ameliyat yarasında kompleman aktivasyonu"}],"answer":2,"explanation":{"en":"Neuraxial local anaesthesia interrupts relevant sensory and autonomic neural input from the operative area. Humoral signals from tissue injury can persist, so reducing neural input does not mean the entire inflammatory response is abolished.","tr":"Nöraksiyel lokal anestezi ameliyat alanından gelen ilgili duyusal ve otonom sinir iletimini keser. Doku hasarının humoral sinyalleri sürebilir; bu nedenle sinirsel girdinin azalması tüm inflamatuvar yanıtın ortadan kalktığı anlamına gelmez."},"sourcePages":[388,389],"difficulty":"applied"}]},{"id":80,"title":{"en":"Hypothalamus and Pituitary","tr":"Hipotalamus ve Hipofiz"},"startPage":391,"section":9,"endPage":395,"questions":[{"id":"c80q1","stem":{"en":"Which mechanism is typical of steroid-hormone signalling?","tr":"Steroit hormon sinyal iletimi için hangi mekanizma tipiktir?"},"options":[{"en":"Activation of cell-surface G-protein receptors as the principal genomic pathway","tr":"Temel genomik yol olarak hücre yüzeyi G protein reseptörlerinin aktivasyonu"},{"en":"Binding to cell-surface receptor tyrosine kinases as the typical first step","tr":"Tipik ilk basamak olarak hücre yüzeyi reseptör tirozin kinazlara bağlanma"},{"en":"Binding to intracellular receptors that regulate gene transcription","tr":"Gen transkripsiyonunu düzenleyen hücre içi reseptörlere bağlanma"},{"en":"Opening of ligand-gated ion channels as the main transcriptional mechanism","tr":"Temel transkripsiyon mekanizması olarak ligand kapılı iyon kanallarının açılması"},{"en":"Direct activation of extracellular adenylyl cyclase without cellular entry","tr":"Hücreye girmeden hücre dışı adenilil siklazın doğrudan aktivasyonu"}],"answer":2,"explanation":{"en":"Steroid hormones are lipid soluble and can cross cell membranes to interact with intracellular receptors. The resulting complexes regulate transcription, unlike the usual cell-surface signalling of peptide hormones.","tr":"Steroit hormonlar yağda çözünür ve hücre zarını geçerek hücre içi reseptörlerle etkileşebilir. Oluşan kompleksler, peptid hormonların olağan hücre yüzeyi sinyal iletiminden farklı olarak transkripsiyonu düzenler."},"sourcePages":[391],"difficulty":"core"},{"id":"c80q2","stem":{"en":"How are hypothalamic releasing hormones delivered efficiently to the anterior pituitary?","tr":"Hipotalamik salgılatıcı hormonlar ön hipofize etkin biçimde nasıl ulaştırılır?"},"options":[{"en":"Through direct axonal delivery into each anterior-pituitary endocrine cell","tr":"Her ön hipofiz endokrin hücresine doğrudan aksonal taşınmayla"},{"en":"Through cerebrospinal-fluid flow from the third ventricle","tr":"Üçüncü ventrikülden beyin omurilik sıvısı akımıyla"},{"en":"Through a single capillary network with no portal connection","tr":"Portal bağlantısı olmayan tek kapiller ağla"},{"en":"Through general systemic circulation before reaching the anterior pituitary","tr":"Ön hipofize ulaşmadan önce genel sistemik dolaşım yoluyla"},{"en":"Through hypophyseal portal veins connecting two capillary networks","tr":"İki kapiller ağı birbirine bağlayan hipofizer portal venler yoluyla"}],"answer":4,"explanation":{"en":"The portal system carries hypothalamic hormones directly to the anterior pituitary before extensive systemic dilution. The posterior pituitary instead receives neural projections from hypothalamic hormone-producing neurons.","tr":"Portal sistem, hipotalamik hormonları sistemik dolaşımda belirgin seyrelmeden önce doğrudan ön hipofize taşır. Arka hipofiz ise hipotalamusta hormon üreten nöronların sinir uzantılarını alır."},"sourcePages":[392,393],"difficulty":"core"},{"id":"c80q3","stem":{"en":"Why can interruption of the pituitary stalk increase prolactin secretion?","tr":"Hipofiz sapının bağlantısının kesilmesi prolaktin salınımını neden artırabilir?"},"options":[{"en":"It increases delivery of dopamine to lactotrophs","tr":"Laktotroflara dopamin ulaşmasını artırır"},{"en":"It removes tonic dopaminergic inhibition from the hypothalamus","tr":"Hipotalamustan gelen tonik dopaminerjik inhibisyonu ortadan kaldırır"},{"en":"It directly increases ovarian oestrogen clearance","tr":"Over kaynaklı östrojenin klirensini doğrudan artırır"},{"en":"It increases the release of prolactin from the posterior pituitary","tr":"Arka hipofizden prolaktin salınımını artırır"},{"en":"It removes a tonic inhibitory effect of oxytocin on lactotrophs","tr":"Oksitosinin laktotroflar üzerindeki tonik inhibitör etkisini kaldırır"}],"answer":1,"explanation":{"en":"Hypothalamic dopamine normally restrains prolactin secretion from anterior-pituitary lactotrophs. Impaired delivery through the stalk can remove this inhibition, unlike the reduced stimulation that affects several other pituitary axes.","tr":"Hipotalamik dopamin normalde ön hipofiz laktotroflarından prolaktin salınımını sınırlar. Saptan iletimin bozulması bu inhibisyonu ortadan kaldırabilir; bu durum, diğer bazı hipofiz eksenlerinde görülen uyarı azalmasından farklıdır."},"sourcePages":[393,394],"difficulty":"applied"},{"id":"c80q4","stem":{"en":"Which example represents long-loop negative feedback in the hypothalamic–pituitary–adrenal axis?","tr":"Hipotalamus–hipofiz–adrenal ekseninde uzun döngülü negatif geri bildirime hangi örnek uyar?"},"options":[{"en":"ACTH stimulating cortisol production","tr":"ACTH’nin kortizol üretimini uyarması"},{"en":"CRH stimulating ACTH secretion","tr":"CRH’nin ACTH salınımını uyarması"},{"en":"ADH increasing collecting-duct water permeability","tr":"ADH’nin toplayıcı kanalın su geçirgenliğini artırması"},{"en":"Cortisol inhibiting hypothalamic CRH and pituitary ACTH secretion","tr":"Kortizolün hipotalamik CRH ve hipofizer ACTH salınımını baskılaması"},{"en":"ACTH inhibiting CRH without any peripheral hormone signal","tr":"Periferik hormon sinyali olmadan ACTH’nin CRH’yi baskılaması"}],"answer":3,"explanation":{"en":"Long-loop feedback is inhibition by the peripheral gland’s hormone of upstream pituitary and hypothalamic secretion. Feedback from a pituitary hormone to the hypothalamus is termed short-loop feedback.","tr":"Uzun döngülü geri bildirim, periferik bez hormonunun kendisini uyaran hipofiz ve hipotalamus salgısını baskılamasıdır. Hipofiz hormonunun hipotalamusa geri bildirimi ise kısa döngülü geri bildirim olarak adlandırılır."},"sourcePages":[393,394],"difficulty":"core"},{"id":"c80q5","stem":{"en":"Where are the ADH and oxytocin released by the posterior pituitary synthesised?","tr":"Arka hipofizden salınan ADH ve oksitosin nerede sentezlenir?"},"options":[{"en":"In hypothalamic neurons","tr":"Hipotalamik nöronlarda"},{"en":"In anterior-pituitary corticotrophs","tr":"Ön hipofiz kortikotroflarında"},{"en":"In anterior-pituitary lactotrophs","tr":"Ön hipofiz laktotroflarında"},{"en":"In posterior-pituitary pituicytes","tr":"Arka hipofiz pituisitlerinde"},{"en":"In the capillary endothelial cells of the pituitary portal system","tr":"Hipofizer portal sistemin kapiller endotel hücrelerinde"}],"answer":0,"explanation":{"en":"ADH and oxytocin are synthesised in hypothalamic neurons and transported along their axons. The posterior pituitary stores and releases them from nerve terminals; it is not the primary site of their synthesis.","tr":"ADH ve oksitosin hipotalamik nöronlarda sentezlenir ve aksonları boyunca taşınır. Arka hipofiz bu hormonları sinir uçlarında depolar ve salgılar; temel sentez yerleri değildir."},"sourcePages":[394,395],"difficulty":"core"}]},{"id":81,"title":{"en":"Thyroid, Parathyroid and Adrenal","tr":"Tiroit, Paratiroit ve Adrenal Bezler"},"startPage":396,"section":9,"endPage":404,"questions":[{"id":"c81q1","stem":{"en":"Which pattern is most consistent with primary thyroid failure when the hypothalamic–pituitary axis is intact?","tr":"Hipotalamus–hipofiz ekseni sağlamken hangi örüntü primer tiroit yetmezliğiyle en uyumludur?"},"options":[{"en":"Low free T4 with elevated TSH","tr":"Düşük serbest T4 ve yüksek TSH"},{"en":"High free T4 with suppressed TSH","tr":"Yüksek serbest T4 ve baskılanmış TSH"},{"en":"Low free T4 with suppressed TSH","tr":"Düşük serbest T4 ve baskılanmış TSH"},{"en":"High free T4 with elevated TSH","tr":"Yüksek serbest T4 ve yüksek TSH"},{"en":"Normal free T4 with persistently absent TSH secretion","tr":"Normal serbest T4 ve sürekli TSH salgısı yokluğu"}],"answer":0,"explanation":{"en":"Failure of the thyroid reduces thyroid-hormone output and removes negative feedback on the pituitary. TSH therefore rises; low T4 with an inappropriately low TSH would instead suggest a central problem or another confounding state.","tr":"Tiroit yetmezliği tiroit hormonu üretimini azaltır ve hipofiz üzerindeki negatif geri bildirimi kaldırır. Bu nedenle TSH yükselir; düşük T4’e uygunsuz derecede düşük TSH eşlik etmesi merkezi bir sorunu veya başka bir etkileyici durumu düşündürür."},"sourcePages":[397,398],"difficulty":"applied"},{"id":"c81q2","stem":{"en":"What is the direct renal effect of parathyroid hormone on calcium and phosphate handling?","tr":"Paratiroid hormonunun kalsiyum ve fosfatın böbrekte işlenmesine doğrudan etkisi nedir?"},"options":[{"en":"Decreased calcium and phosphate reabsorption","tr":"Kalsiyum ve fosfat geri emiliminin azalması"},{"en":"Increased calcium and phosphate reabsorption","tr":"Kalsiyum ve fosfat geri emiliminin artması"},{"en":"Increased calcium reabsorption with decreased phosphate reabsorption","tr":"Kalsiyum geri emiliminin artması ve fosfat geri emiliminin azalması"},{"en":"Decreased calcium reabsorption with increased phosphate reabsorption","tr":"Kalsiyum geri emiliminin azalması ve fosfat geri emiliminin artması"},{"en":"Reduced calcium filtration without a tubular reabsorptive effect","tr":"Tübüler geri emilim etkisi olmaksızın kalsiyum filtrasyonunun azalması"}],"answer":2,"explanation":{"en":"PTH conserves calcium in the kidney while promoting phosphate excretion. It also stimulates renal activation of vitamin D, which increases intestinal calcium absorption.","tr":"PTH böbrekte kalsiyumu korurken fosfat atılımını artırır. Ayrıca bağırsaktan kalsiyum emilimini artıran D vitamininin böbrekte aktivasyonunu uyarır."},"sourcePages":[399,400],"difficulty":"core"},{"id":"c81q3","stem":{"en":"Which step produces calcitriol from 25-hydroxyvitamin D?","tr":"25-hidroksivitamin D’den kalsitriol oluşturan basamak hangisidir?"},"options":[{"en":"Ultraviolet conversion of skin cholesterol to calcitriol directly","tr":"Derideki kolesterolün ultraviyoleyle doğrudan kalsitriole dönüşmesi"},{"en":"Hepatic 25-hydroxylation","tr":"Karaciğerde 25-hidroksilasyon"},{"en":"Thyroid peroxidase-mediated iodination","tr":"Tiroit peroksidaz aracılı iyotlanma"},{"en":"Adrenal 11β-hydroxylation","tr":"Adrenalde 11β-hidroksilasyon"},{"en":"Renal 1α-hydroxylation","tr":"Böbrekte 1α-hidroksilasyon"}],"answer":4,"explanation":{"en":"The liver first forms 25-hydroxyvitamin D, and renal 1α-hydroxylase then produces active 1,25-dihydroxyvitamin D, or calcitriol. PTH stimulates this renal step, which may be impaired in chronic kidney disease.","tr":"Karaciğer önce 25-hidroksivitamin D’yi oluşturur; ardından renal 1α-hidroksilaz aktif 1,25-dihidroksivitamin D’yi, yani kalsitriolü üretir. PTH, kronik böbrek hastalığında bozulabilen bu renal basamağı uyarır."},"sourcePages":[400,401],"difficulty":"core"},{"id":"c81q4","stem":{"en":"Which enzyme inhibition explains the direct suppressive effect of etomidate on cortisol synthesis?","tr":"Etomidatın kortizol sentezini doğrudan baskılamasını hangi enzim inhibisyonu açıklar?"},"options":[{"en":"Tyrosine hydroxylase","tr":"Tirozin hidroksilaz"},{"en":"11β-hydroxylase","tr":"11β-hidroksilaz"},{"en":"Thyroid peroxidase","tr":"Tiroit peroksidaz"},{"en":"Renal 1α-hydroxylase","tr":"Renal 1α-hidroksilaz"},{"en":"Catechol-O-methyltransferase","tr":"Katekol-O-metiltransferaz"}],"answer":1,"explanation":{"en":"11β-hydroxylase catalyses the conversion of 11-deoxycortisol to cortisol. Etomidate inhibits this steroidogenic step; tyrosine hydroxylase instead participates in catecholamine synthesis.","tr":"11β-hidroksilaz, 11-deoksikortizolün kortizole dönüşmesini katalizler. Etomidat bu steroit sentezi basamağını inhibe eder; tirozin hidroksilaz ise katekolamin sentezine katılır."},"sourcePages":[402,403],"difficulty":"applied"},{"id":"c81q5","stem":{"en":"Which signal principally mediates rapid adrenal catecholamine secretion in response to preganglionic sympathetic activity?","tr":"Pregangliyonik sempatik etkinliğe yanıt olarak adrenal katekolaminlerin hızlı salınımına başlıca hangi sinyal aracılık eder?"},"options":[{"en":"Acetylcholine acting at muscarinic receptors on chromaffin cells","tr":"Asetilkolinin kromafin hücrelerindeki muskarinik reseptörlere etki etmesi"},{"en":"Noradrenaline released from postganglionic sympathetic fibres","tr":"Postgangliyonik sempatik liflerden salınan noradrenalin"},{"en":"ACTH acting through the same pathway that controls cortisol secretion","tr":"ACTH’nin kortizol salınımını kontrol eden aynı yol üzerinden etki etmesi"},{"en":"Acetylcholine acting at nicotinic receptors from preganglionic sympathetic fibres","tr":"Pregangliyonik sempatik liflerden salınan asetilkolinin nikotinik reseptörleri uyarması"},{"en":"Angiotensin II acting through zona-glomerulosa mineralocorticoid signalling","tr":"Anjiyotensin II’nin zona glomerulozanın mineralokortikoid sinyal yolu üzerinden etki etmesi"}],"answer":3,"explanation":{"en":"The adrenal medulla acts as a modified sympathetic ganglion receiving cholinergic preganglionic input. Nicotinic receptor activation depolarises chromaffin cells, allowing calcium entry that triggers granule exocytosis.","tr":"Adrenal medulla, kolinerjik pregangliyonik girdi alan değişime uğramış bir sempatik gangliyon gibi çalışır. Nikotinik reseptör aktivasyonu kromafin hücrelerini depolarize eder; kalsiyum girişi granül ekzositozunu tetikler."},"sourcePages":[401,403],"difficulty":"core"}]},{"id":82,"title":{"en":"Maternal Physiology during Pregnancy","tr":"Gebelikte Maternal Fizyoloji"},"startPage":405,"section":10,"endPage":410,"questions":[{"id":"c82q1","stem":{"en":"Why is oxygen desaturation during apnoea generally faster near term than in a non-pregnant adult?","tr":"Apne sırasında oksijen desatürasyonu, terme yakın gebede neden genellikle gebe olmayan erişkinden daha hızlıdır?"},"options":[{"en":"Increased functional residual capacity with reduced oxygen consumption","tr":"Azalmış oksijen tüketimiyle birlikte artmış fonksiyonel rezidüel kapasite"},{"en":"Reduced oxygen consumption with unchanged lung oxygen stores","tr":"Akciğer oksijen depoları değişmeden oksijen tüketiminin azalması"},{"en":"Increased residual volume with a reduced metabolic rate","tr":"Metabolizma hızı azalırken rezidüel hacmin artması"},{"en":"Reduced functional residual capacity combined with increased oxygen consumption","tr":"Artmış oksijen tüketimiyle birlikte azalmış fonksiyonel rezidüel kapasite"},{"en":"Reduced minute ventilation with increased lung compliance","tr":"Akciğer kompliyansı artarken dakika ventilasyonunun azalması"}],"answer":3,"explanation":{"en":"The enlarged uterus reduces FRC, decreasing the lung’s oxygen reservoir. Simultaneously, maternal–fetal metabolic demands increase oxygen consumption, so that reservoir is exhausted more rapidly during apnoea.","tr":"Büyüyen uterus FRC’yi azaltarak akciğerin oksijen rezervini küçültür. Aynı zamanda anne–fetüs metabolik gereksinimleri oksijen tüketimini artırır; bu nedenle apne sırasında rezerv daha hızlı tükenir."},"sourcePages":[407],"difficulty":"applied"},{"id":"c82q2","stem":{"en":"Which acid–base change is a normal consequence of progesterone-stimulated ventilation in pregnancy?","tr":"Gebelikte progesteronun uyardığı ventilasyonun normal asit–baz sonucu hangisidir?"},"options":[{"en":"Lower PaCO2 with compensatory reduction in plasma bicarbonate","tr":"Plazma bikarbonatında kompansatuvar azalmayla birlikte düşük PaCO2"},{"en":"Higher PaCO2 with compensatory bicarbonate retention","tr":"Kompansatuvar bikarbonat tutulmasıyla birlikte yüksek PaCO2"},{"en":"Primary metabolic acidosis with rising PaCO2","tr":"PaCO2 artışıyla birlikte primer metabolik asidoz"},{"en":"Primary metabolic alkalosis with reduced ventilation","tr":"Ventilasyon azalmasıyla birlikte primer metabolik alkaloz"},{"en":"Unchanged PaCO2 despite a sustained fall in alveolar ventilation","tr":"Alveoler ventilasyonda sürekli azalmaya rağmen değişmeyen PaCO2"}],"answer":0,"explanation":{"en":"Progesterone increases ventilatory drive, producing a mild respiratory alkalosis. Renal bicarbonate loss partially compensates, so normal pregnancy has a lower PaCO2 and bicarbonate concentration than the non-pregnant state.","tr":"Progesteron solunum dürtüsünü artırarak hafif solunumsal alkaloz oluşturur. Böbrekten bikarbonat kaybı bunu kısmen kompanse eder; bu nedenle normal gebelikte PaCO2 ve bikarbonat konsantrasyonu gebelik dışına göre daha düşüktür."},"sourcePages":[407],"difficulty":"core"},{"id":"c82q3","stem":{"en":"What causes the physiological fall in haemoglobin concentration during uncomplicated pregnancy?","tr":"Komplikasyonsuz gebelikte hemoglobin konsantrasyonunun fizyolojik düşüşüne ne neden olur?"},"options":[{"en":"Plasma volume increases less than red-cell mass","tr":"Plazma hacminin eritrosit kütlesinden daha az artması"},{"en":"Red-cell mass falls while plasma volume remains constant","tr":"Plazma hacmi sabitken eritrosit kütlesinin azalması"},{"en":"Plasma volume increases more than red-cell mass","tr":"Plazma hacminin eritrosit kütlesinden daha fazla artması"},{"en":"Maternal red-cell destruction normally exceeds production throughout pregnancy","tr":"Gebelik boyunca maternal eritrosit yıkımının normalde üretimi aşması"},{"en":"Reduced erythropoietin is the principal physiological driver","tr":"Temel fizyolojik etkenin azalmış eritropoietin olması"}],"answer":2,"explanation":{"en":"Both plasma volume and red-cell mass increase, but plasma expands proportionally more. The resulting haemodilution lowers haemoglobin concentration without implying that total red-cell mass has decreased.","tr":"Hem plazma hacmi hem eritrosit kütlesi artar; ancak plazma oransal olarak daha fazla genişler. Ortaya çıkan hemodilüsyon hemoglobin konsantrasyonunu düşürür; bu durum toplam eritrosit kütlesinin azaldığı anlamına gelmez."},"sourcePages":[408],"difficulty":"core"},{"id":"c82q4","stem":{"en":"What is the main haemodynamic mechanism of supine hypotension from aortocaval compression in late pregnancy?","tr":"Geç gebelikte aortokaval basıya bağlı sırtüstü hipotansiyonun temel hemodinamik mekanizması nedir?"},"options":[{"en":"Inferior vena caval compression directly increases ventricular filling","tr":"İnferior vena kava basısı ventrikül dolumunu doğrudan artırır"},{"en":"Uterine compression causes acute expansion of the maternal blood volume","tr":"Uterus basısı maternal kan hacmini akut olarak artırır"},{"en":"Aortic compression reduces afterload and raises cardiac output","tr":"Aort basısı ard yükü azaltıp kalp debisini artırır"},{"en":"Placental blood flow is fully preserved by strong autoregulation","tr":"Plasental kan akımı güçlü otoregülasyonla tamamen korunur"},{"en":"Inferior vena caval compression reduces venous return and cardiac preload","tr":"İnferior vena kava basısı venöz dönüşü ve kardiyak ön yükü azaltır"}],"answer":4,"explanation":{"en":"The gravid uterus can impede caval flow when supine, reducing preload and cardiac output. Maternal hypotension and accompanying aortic compression can also reduce uteroplacental perfusion.","tr":"Gebe uterus sırtüstü pozisyonda kaval akımı engelleyerek ön yükü ve kalp debisini azaltabilir. Maternal hipotansiyon ve eşlik eden aort basısı uteroplasental perfüzyonu da azaltabilir."},"sourcePages":[408,409],"difficulty":"applied"},{"id":"c82q5","stem":{"en":"Why is serum creatinine normally lower during pregnancy?","tr":"Gebelikte serum kreatinini neden normalde daha düşüktür?"},"options":[{"en":"Renal plasma flow falls and creatinine reabsorption increases","tr":"Renal plazma akımı düşer ve kreatinin geri emilimi artar"},{"en":"Renal plasma flow and glomerular filtration increase","tr":"Renal plazma akımı ve glomerüler filtrasyon artar"},{"en":"GFR falls while creatinine production remains unchanged","tr":"Kreatinin üretimi değişmeden glomerüler filtrasyon hızı düşer"},{"en":"Tubular creatinine secretion is inhibited throughout pregnancy","tr":"Gebelik boyunca tübüler kreatinin sekresyonu baskılanır"},{"en":"Creatinine is increasingly reabsorbed in the proximal tubule","tr":"Kreatinin proksimal tübülde daha fazla geri emilir"}],"answer":1,"explanation":{"en":"Pregnancy increases renal blood flow and GFR, increasing clearance of creatinine and urea. A value typical of a non-pregnant adult may therefore be relatively high for pregnancy and needs contextual interpretation.","tr":"Gebelik böbrek kan akımını ve glomerüler filtrasyon hızını artırarak kreatinin ve üre klirensini yükseltir. Bu nedenle gebe olmayan erişkin için olağan bir değer gebelikte görece yüksek olabilir ve bağlama göre yorumlanmalıdır."},"sourcePages":[409],"difficulty":"applied"}]},{"id":83,"title":{"en":"Foetal Physiology","tr":"Fetal Fizyoloji"},"startPage":411,"section":10,"endPage":417,"questions":[{"id":"c83q1","stem":{"en":"Which vessel normally carries the most oxygenated blood from the placenta toward the fetus?","tr":"Plasentadan fetüse doğru normalde en yüksek oksijen içeriğine sahip kanı hangi damar taşır?"},"options":[{"en":"One of the umbilical arteries","tr":"Umbilikal arterlerden biri"},{"en":"The umbilical vein","tr":"Umbilikal ven"},{"en":"The fetal superior vena cava","tr":"Fetal superior vena kava"},{"en":"The fetal pulmonary artery","tr":"Fetal pulmoner arter"},{"en":"The ductus arteriosus","tr":"Duktus arteriyozus"}],"answer":1,"explanation":{"en":"The single umbilical vein returns oxygenated placental blood to the fetus. The two umbilical arteries carry relatively deoxygenated fetal blood back to the placenta; vessel names reflect direction relative to the heart rather than oxygen content.","tr":"Tek umbilikal ven, plasentada oksijenlenmiş kanı fetüse getirir. İki umbilikal arter ise görece az oksijenli fetal kanı plasentaya geri taşır; damar adları oksijen içeriğini değil, kalbe göre akım yönünü belirtir."},"sourcePages":[411,415,416],"difficulty":"core"},{"id":"c83q2","stem":{"en":"In fetal life, the ductus arteriosus primarily directs blood from which site to which site?","tr":"Fetal yaşamda duktus arteriyozus kanı başlıca nereden nereye yönlendirir?"},"options":[{"en":"Umbilical vein to left atrium","tr":"Umbilikal venden sol atriyuma"},{"en":"Right atrium to left atrium","tr":"Sağ atriyumdan sol atriyuma"},{"en":"Descending aorta to umbilical vein","tr":"İnen aortadan umbilikal vene"},{"en":"Pulmonary artery to descending aorta","tr":"Pulmoner arterden inen aortaya"},{"en":"Pulmonary vein to inferior vena cava","tr":"Pulmoner venden inferior vena kavaya"}],"answer":3,"explanation":{"en":"High fetal pulmonary vascular resistance favours diversion of much of the right-ventricular output through the ductus arteriosus into the descending aorta. The right-to-left atrial connection is the foramen ovale, a separate fetal shunt.","tr":"Yüksek fetal pulmoner damar direnci, sağ ventrikül debisinin büyük bölümünün duktus arteriyozus üzerinden inen aortaya yönlenmesini destekler. Sağdan sola atriyal bağlantı ise ayrı bir fetal şant olan foramen ovaledir."},"sourcePages":[415,416],"difficulty":"core"},{"id":"c83q3","stem":{"en":"How does the double Bohr effect facilitate placental oxygen transfer?","tr":"Çift Bohr etkisi plasentadan oksijen aktarımını nasıl kolaylaştırır?"},"options":[{"en":"Fetal CO2 loss increases fetal oxygen affinity while maternal CO2 gain reduces maternal affinity","tr":"Fetal CO2 kaybı fetal oksijen afinitesini artırırken annenin CO2 alması maternal afiniteyi azaltır"},{"en":"Fetal CO2 loss reduces fetal affinity while maternal CO2 gain increases maternal affinity","tr":"Fetal CO2 kaybı fetal afiniteyi azaltırken annenin CO2 alması maternal afiniteyi artırır"},{"en":"Both maternal and fetal CO2 loss shift both curves rightward","tr":"Hem maternal hem fetal CO2 kaybı her iki eğriyi sağa kaydırır"},{"en":"Oxygen transfer requires identical maternal and fetal pH","tr":"Oksijen aktarımı maternal ve fetal pH’nın aynı olmasını gerektirir"},{"en":"Maternal CO2 gain prevents oxygen unloading from haemoglobin","tr":"Annenin CO2 alması hemoglobinden oksijen bırakılmasını önler"}],"answer":0,"explanation":{"en":"CO2 moves from fetus to mother, producing opposite local pH changes on the two sides. Fetal haemoglobin then binds oxygen more readily while maternal haemoglobin releases it more readily, reinforcing placental oxygen transfer.","tr":"CO2 fetüsten anneye geçerek iki tarafta zıt yerel pH değişiklikleri oluşturur. Böylece fetal hemoglobin oksijeni daha kolay bağlarken maternal hemoglobin daha kolay bırakır ve plasental oksijen aktarımı güçlenir."},"sourcePages":[414],"difficulty":"applied"},{"id":"c83q4","stem":{"en":"Why can a weakly basic local anaesthetic accumulate in an acidotic fetus?","tr":"Zayıf baz özellikli bir lokal anestezik asidotik fetüste neden birikebilir?"},"options":[{"en":"Lower fetal pH increases the neutral drug fraction, accelerating back-diffusion","tr":"Düşük fetal pH yüksüz ilaç oranını artırarak geri difüzyonu hızlandırır"},{"en":"Lower fetal pH reduces ionisation and enhances maternal clearance","tr":"Düşük fetal pH iyonizasyonu azaltır ve maternal klirensi artırır"},{"en":"Lower fetal pH increases ionisation, limiting diffusion back to the mother","tr":"Düşük fetal pH iyonizasyonu artırarak anneye geri difüzyonu sınırlar"},{"en":"Fetal acidification increases drug binding to maternal albumin before placental entry","tr":"Fetal asitleşme plasentaya girişten önce ilacın maternal albümine bağlanmasını artırır"},{"en":"Placental transfer depends only on molecular weight and is independent of pH","tr":"Plasental geçiş yalnızca molekül ağırlığına bağlıdır ve pH’dan bağımsızdır"}],"answer":2,"explanation":{"en":"The uncharged form of a weak base can diffuse across the placenta. In a more acidic fetal compartment, a greater fraction becomes protonated and crosses back less readily, producing ion trapping.","tr":"Zayıf bazın yüksüz biçimi plasentadan difüze olabilir. Daha asidik fetal bölmede daha büyük bir kısmı protonlanır ve geri geçişi zorlaşır; buna iyon tuzağı denir."},"sourcePages":[413],"difficulty":"applied"},{"id":"c83q5","stem":{"en":"What directly promotes functional closure of the foramen ovale after successful lung aeration at birth?","tr":"Doğumda akciğerlerin havalanmasının ardından foramen ovalenin işlevsel kapanmasını doğrudan ne destekler?"},"options":[{"en":"Persistently elevated pulmonary vascular resistance","tr":"Pulmoner damar direncinin sürekli yüksek kalması"},{"en":"Right atrial pressure rising above left atrial pressure","tr":"Sağ atriyum basıncının sol atriyum basıncını aşması"},{"en":"Increased placental venous return after cord separation","tr":"Kordon ayrıldıktan sonra plasental venöz dönüşün artması"},{"en":"A fall in pulmonary venous return","tr":"Pulmoner venöz dönüşün azalması"},{"en":"Left atrial pressure becoming higher than right atrial pressure","tr":"Sol atriyum basıncının sağ atriyum basıncını aşması"}],"answer":4,"explanation":{"en":"Lung aeration reduces pulmonary vascular resistance and increases pulmonary venous return to the left atrium. When left atrial pressure exceeds right atrial pressure, the flap of the foramen ovale is pressed closed; anatomical fusion is a later process.","tr":"Akciğerlerin havalanması pulmoner damar direncini azaltır ve sol atriyuma pulmoner venöz dönüşü artırır. Sol atriyum basıncı sağ atriyumu aştığında foramen ovale kapağı kapanır; anatomik kaynaşma daha sonraki bir süreçtir."},"sourcePages":[417],"difficulty":"core"}]},{"id":84,"title":{"en":"Paediatric Physiology","tr":"Pediyatrik Fizyoloji"},"startPage":418,"section":10,"endPage":421,"questions":[{"id":"c84q1","stem":{"en":"In a simplified laminar-flow model, reducing an infant airway radius to half its original value changes resistance by what factor?","tr":"Basitleştirilmiş laminer akım modelinde bir bebeğin hava yolu yarıçapının yarıya inmesi direnci kaç katına çıkarır?"},"options":[{"en":"2-fold","tr":"2 kat"},{"en":"4-fold","tr":"4 kat"},{"en":"8-fold","tr":"8 kat"},{"en":"32-fold","tr":"32 kat"},{"en":"16-fold","tr":"16 kat"}],"answer":4,"explanation":{"en":"For laminar flow, resistance is inversely proportional to radius to the fourth power, so halving radius increases resistance by 2⁴ = 16. Real airways have more complex flow, but the model explains why small amounts of swelling can have large effects in a narrow paediatric airway.","tr":"Laminer akımda direnç yarıçapın dördüncü kuvvetiyle ters orantılıdır; yarıçapın yarıya inmesi direnci 2⁴ = 16 kat artırır. Gerçek hava yollarında akım daha karmaşıktır; ancak model, dar pediyatrik hava yolunda az miktarda ödemin neden büyük etki yapabildiğini açıklar."},"sourcePages":[418],"difficulty":"applied"},{"id":"c84q2","stem":{"en":"Which combination best explains rapid oxygen desaturation in an apnoeic neonate?","tr":"Apnedeki yenidoğanın hızla desatüre olmasını hangi kombinasyon en iyi açıklar?"},"options":[{"en":"Low oxygen consumption per kilogram and large oxygen stores","tr":"Kilogram başına düşük oksijen tüketimi ve büyük oksijen depoları"},{"en":"High oxygen consumption per kilogram and limited functional residual capacity","tr":"Kilogram başına yüksek oksijen tüketimi ve sınırlı fonksiyonel rezidüel kapasite"},{"en":"Low metabolic rate and low closing capacity","tr":"Düşük metabolizma hızı ve düşük kapanma kapasitesi"},{"en":"High chest-wall rigidity and low respiratory rate","tr":"Yüksek göğüs duvarı sertliği ve düşük solunum hızı"},{"en":"Large tidal volume per kilogram with reduced carbon dioxide production","tr":"Karbondioksit üretimi azalırken kilogram başına büyük tidal hacim"}],"answer":1,"explanation":{"en":"Neonates consume oxygen rapidly relative to body mass and have a limited lung oxygen reservoir. Their compliant chest wall also favours low lung volumes and airway closure, increasing vulnerability during interrupted ventilation.","tr":"Yenidoğanlar vücut kütlesine göre oksijeni hızla tüketir ve akciğer oksijen rezervleri sınırlıdır. Esnek göğüs duvarı düşük akciğer hacimlerini ve hava yolu kapanmasını da kolaylaştırarak ventilasyon kesildiğinde duyarlılığı artırır."},"sourcePages":[419],"difficulty":"applied"},{"id":"c84q3","stem":{"en":"Why can marked bradycardia cause a particularly large fall in neonatal cardiac output?","tr":"Belirgin bradikardi yenidoğan kalp debisinde neden özellikle büyük bir düşüş oluşturabilir?"},"options":[{"en":"Bradycardia primarily reduces systemic vascular resistance rather than cardiac output","tr":"Bradikardi öncelikle kalp debisini değil sistemik damar direncini azaltır"},{"en":"The neonatal ventricle relies on a larger compensatory stroke-volume increase than the adult","tr":"Yenidoğan ventrikülü erişkinden daha büyük bir telafi edici atım hacmi artışına dayanır"},{"en":"The longer filling time necessarily restores output to its previous value","tr":"Uzayan dolum süresi debiyi zorunlu olarak önceki değerine getirir"},{"en":"The immature ventricle has limited ability to compensate by increasing stroke volume","tr":"Olgunlaşmamış ventrikülün atım hacmini artırarak telafi etme kapasitesi sınırlıdır"},{"en":"Neonatal metabolic demand normally falls in direct proportion to heart rate","tr":"Yenidoğanın metabolik gereksinimi normalde kalp hızıyla doğru orantılı düşer"}],"answer":3,"explanation":{"en":"Cardiac output is heart rate multiplied by stroke volume. Limited neonatal contractile reserve means a fall in heart rate is less readily offset by an increase in stroke volume.","tr":"Kalp debisi, kalp hızı ile atım hacminin çarpımıdır. Yenidoğanın sınırlı kasılma rezervi nedeniyle kalp hızındaki düşüş atım hacmi artırılarak kolayca telafi edilemez."},"sourcePages":[419,420],"difficulty":"core"},{"id":"c84q4","stem":{"en":"Compared with an adult, which neonatal feature tends to increase the distribution volume per kilogram of a water-soluble drug?","tr":"Erişkine kıyasla yenidoğanın hangi özelliği suda çözünen bir ilacın kilogram başına dağılım hacmini artırma eğilimindedir?"},"options":[{"en":"A larger extracellular-water fraction","tr":"Daha büyük hücre dışı su oranı"},{"en":"A smaller extracellular-water fraction","tr":"Daha küçük hücre dışı su oranı"},{"en":"More mature renal filtration","tr":"Daha olgun böbrek filtrasyonu"},{"en":"A higher proportion of adipose tissue as the main aqueous compartment","tr":"Başlıca sulu bölme olarak daha yüksek yağ dokusu oranı"},{"en":"Reduced total body water","tr":"Azalmış toplam vücut suyu"}],"answer":0,"explanation":{"en":"Neonates have a greater proportion of total and extracellular body water. Hydrophilic drugs can therefore distribute into a larger aqueous volume per kilogram; this distribution effect is separate from their immature drug clearance.","tr":"Yenidoğanlarda toplam vücut suyunun ve hücre dışı suyun oranı daha yüksektir. Bu nedenle hidrofilik ilaçlar kilogram başına daha büyük bir sulu hacme dağılabilir; bu dağılım etkisi, ilaç klirenslerinin olgunlaşmamış olmasından ayrıdır."},"sourcePages":[421],"difficulty":"applied"},{"id":"c84q5","stem":{"en":"Why is a neonate less able than an older child to conserve water during dehydration?","tr":"Yenidoğan, dehidratasyon sırasında neden daha büyük bir çocuk kadar iyi su koruyamaz?"},"options":[{"en":"The neonatal medullary concentrating gradient is greater than in an older child","tr":"Yenidoğanın medüller yoğunlaştırma gradyanı daha büyük çocuktan fazladır"},{"en":"A low surface-area-to-mass ratio increases renal free-water loss","tr":"Düşük yüzey alanı/kütle oranı renal serbest su kaybını artırır"},{"en":"Immature tubular function limits urinary concentrating ability","tr":"Olgunlaşmamış tübül işlevi idrarı yoğunlaştırma kapasitesini sınırlar"},{"en":"Enhanced tubular solute reabsorption prevents water conservation","tr":"Artmış tübüler solüt geri emilimi suyun korunmasını önler"},{"en":"Reduced respiratory water loss limits the stimulus for renal conservation","tr":"Azalmış solunumsal su kaybı böbreğin su koruma uyarısını sınırlar"}],"answer":2,"explanation":{"en":"Immature renal tubules limit the concentration of urine and thus the capacity to reduce water loss. High respiratory and evaporative losses can further accelerate dehydration, despite the neonate’s high total-body-water fraction.","tr":"Olgunlaşmamış böbrek tübülleri idrarın yoğunlaştırılmasını ve dolayısıyla su kaybını azaltma kapasitesini sınırlar. Yenidoğanın toplam vücut suyu oranı yüksek olsa da solunum ve buharlaşmayla kayıplar dehidratasyonu daha da hızlandırabilir."},"sourcePages":[420,421],"difficulty":"core"}]},{"id":85,"title":{"en":"Physiology of Ageing","tr":"Yaşlanma Fizyolojisi"},"startPage":422,"section":10,"endPage":426,"questions":[{"id":"c85q1","stem":{"en":"Why can an older adult with acceptable resting organ function deteriorate during a major physiological stress?","tr":"İstirahatte organ işlevleri yeterli görünen ileri yaştaki bir erişkin büyük fizyolojik stres sırasında neden kötüleşebilir?"},"options":[{"en":"Resting measurements necessarily demonstrate maximal organ performance","tr":"İstirahat ölçümleri zorunlu olarak azami organ performansını gösterir"},{"en":"Chronological age completely determines response regardless of comorbidity","tr":"Kronolojik yaş, eşlik eden hastalıklardan bağımsız olarak yanıtı tamamen belirler"},{"en":"Reduced physiological reserve limits the increase in function needed under stress","tr":"Azalmış fizyolojik rezerv stres altında gereken işlev artışını sınırlar"},{"en":"Normal ageing uniformly eliminates every compensatory reflex","tr":"Normal yaşlanma tüm telafi reflekslerini aynı ölçüde ortadan kaldırır"},{"en":"Preserved resting function proves that reserve is also preserved","tr":"İstirahat işlevinin korunması rezervin de korunduğunu kanıtlar"}],"answer":2,"explanation":{"en":"Ageing can reduce reserve before obvious resting organ failure appears. Acute disease or surgery increases demand, exposing limitations that are not apparent at rest; functional status therefore matters alongside chronological age.","tr":"Yaşlanma, istirahatte belirgin organ yetmezliği görülmeden önce rezervi azaltabilir. Akut hastalık veya cerrahi gereksinimi artırarak istirahatte görünmeyen sınırları ortaya çıkarır; bu nedenle kronolojik yaşın yanında işlevsel durum da önemlidir."},"sourcePages":[422],"difficulty":"applied"},{"id":"c85q2","stem":{"en":"How can an age-related rise in closing capacity impair gas exchange?","tr":"Yaşa bağlı kapanma kapasitesi artışı gaz değişimini nasıl bozabilir?"},"options":[{"en":"All alveoli become continuously overventilated relative to perfusion","tr":"Tüm alveoller perfüzyona göre sürekli aşırı ventile olur"},{"en":"Closing capacity reduces the alveolar–arterial oxygen gradient","tr":"Kapanma kapasitesi alveoler–arteriyel oksijen farkını azaltır"},{"en":"Loss of elastic recoil makes small airways more stable during expiration","tr":"Elastik geri çekilme kaybı küçük hava yollarını ekspirasyonda daha kararlı yapar"},{"en":"Airway closure increases oxygen diffusion through unventilated alveoli","tr":"Hava yolu kapanması ventile olmayan alveollerden oksijen difüzyonunu artırır"},{"en":"Small airways close during ordinary breathing, worsening ventilation–perfusion matching","tr":"Küçük hava yolları normal solunum sırasında kapanarak ventilasyon–perfüzyon uyumunu bozar"}],"answer":4,"explanation":{"en":"Loss of elastic support raises the lung volume at which dependent small airways close. If closing capacity approaches or exceeds FRC, some perfused regions become poorly ventilated, increasing ventilation–perfusion mismatch.","tr":"Elastik desteğin kaybı, bağımlı bölgelerdeki küçük hava yollarının kapandığı akciğer hacmini yükseltir. Kapanma kapasitesi FRC’ye yaklaşır veya onu aşarsa bazı perfüze bölgeler yetersiz ventile olur ve ventilasyon–perfüzyon uyumsuzluğu artar."},"sourcePages":[422,423],"difficulty":"core"},{"id":"c85q3","stem":{"en":"Why may new atrial fibrillation be poorly tolerated by an older patient with a stiff left ventricle?","tr":"Sert bir sol ventrikülü olan ileri yaştaki bir hastada yeni gelişen atriyal fibrilasyon neden kötü tolere edilebilir?"},"options":[{"en":"Atrial contraction is less important when ventricular relaxation is impaired","tr":"Ventrikül gevşemesi bozulduğunda atriyal kasılma daha az önemlidir"},{"en":"Loss of organised atrial contraction reduces filling of a less compliant ventricle","tr":"Düzenli atriyal kasılmanın kaybı, kompliyansı düşük ventrikülün dolumunu azaltır"},{"en":"Atrial fibrillation reliably increases ventricular compliance","tr":"Atriyal fibrilasyon ventrikül kompliyansını güvenilir biçimde artırır"},{"en":"A stiff ventricle fills more effectively at every faster heart rate","tr":"Sert ventrikül daha hızlı her kalp hızında daha iyi dolar"},{"en":"Loss of atrial contraction directly lowers aortic stiffness","tr":"Atriyal kasılmanın kaybı aort sertliğini doğrudan azaltır"}],"answer":1,"explanation":{"en":"Impaired diastolic relaxation makes ventricular filling more dependent on atrial contraction. Atrial fibrillation removes that contribution, and a rapid ventricular response can further shorten filling time.","tr":"Bozulmuş diyastolik gevşeme ventrikül dolumunu atriyal kasılmaya daha bağımlı hale getirir. Atriyal fibrilasyon bu katkıyı ortadan kaldırır; hızlı ventrikül yanıtı dolum süresini ayrıca kısaltabilir."},"sourcePages":[424],"difficulty":"applied"},{"id":"c85q4","stem":{"en":"Which combination can prolong the terminal half-life of a lipophilic drug in an older adult?","tr":"İleri yaştaki erişkinde lipofilik bir ilacın terminal yarılanma ömrünü hangi kombinasyon uzatabilir?"},"options":[{"en":"Smaller distribution volume with increased clearance","tr":"Klirens artarken dağılım hacminin küçülmesi"},{"en":"Faster hepatic blood flow with reduced fat mass","tr":"Yağ kütlesi azalırken karaciğer kan akımının hızlanması"},{"en":"Increased renal filtration with unchanged distribution","tr":"Dağılım değişmeden böbrek filtrasyonunun artması"},{"en":"Greater fat distribution with reduced hepatic or renal clearance","tr":"Karaciğer veya böbrek klirensi azalırken yağ dokusuna dağılımın artması"},{"en":"Lower fat solubility with increased elimination capacity","tr":"Eliminasyon kapasitesi artarken yağda çözünürlüğün azalması"}],"answer":3,"explanation":{"en":"Terminal half-life depends on the relationship between distribution volume and clearance. Increased tissue storage of a lipophilic drug together with reduced elimination can prolong its persistence, although the magnitude varies between drugs and individuals.","tr":"Terminal yarılanma ömrü dağılım hacmi ile klirens arasındaki ilişkiye bağlıdır. Lipofilik ilacın dokularda daha fazla depolanması ve eliminasyonunun azalması kalıcılığını uzatabilir; ancak etkinin büyüklüğü ilaca ve kişiye göre değişir."},"sourcePages":[425,426],"difficulty":"applied"},{"id":"c85q5","stem":{"en":"Which age-related combination increases susceptibility to perioperative hypothermia?","tr":"Yaşa bağlı hangi kombinasyon perioperatif hipotermiye yatkınlığı artırır?"},"options":[{"en":"Reduced heat production and a weaker vasoconstrictor response to cold","tr":"Azalmış ısı üretimi ve soğuğa daha zayıf vazokonstriktör yanıt"},{"en":"Increased basal heat production and stronger peripheral vasoconstriction","tr":"Artmış bazal ısı üretimi ve daha güçlü periferik vazokonstriksiyon"},{"en":"Increased muscle mass with more effective shivering","tr":"Daha etkili titremeyle birlikte artmış kas kütlesi"},{"en":"Reduced skin heat loss with increased sweating threshold as the only change","tr":"Tek değişiklik olarak terleme eşiği yükselirken deri ısı kaybının azalması"},{"en":"Higher cardiac reserve that fully offsets any fall in temperature","tr":"Her sıcaklık düşüşünü tamamen telafi eden daha yüksek kardiyak rezerv"}],"answer":0,"explanation":{"en":"Older adults may generate less metabolic heat and conserve it less effectively through vasoconstriction. Reduced muscle mass and cardiopulmonary reserve can also limit the ability to restore temperature by shivering.","tr":"İleri yaştaki erişkinler metabolik olarak daha az ısı üretebilir ve vazokonstriksiyonla ısıyı daha az etkili koruyabilir. Kas kütlesi ve kardiyopulmoner rezerv azalması, titremeyle sıcaklığı yeniden yükseltme kapasitesini de sınırlayabilir."},"sourcePages":[425],"difficulty":"core"}]},{"id":86,"title":{"en":"Physiology of Obesity","tr":"Obezite Fizyolojisi"},"startPage":427,"section":10,"endPage":430,"questions":[{"id":"c86q1","stem":{"en":"A person weighs 108 kg and is 1.80 m tall. What is their body mass index?","tr":"108 kg ağırlığında ve 1,80 m boyunda bir kişinin vücut kitle indeksi kaçtır?"},"options":[{"en":"33.3 kg/m²","tr":"33,3 kg/m²"},{"en":"30.0 kg/m²","tr":"30,0 kg/m²"},{"en":"36.0 kg/m²","tr":"36,0 kg/m²"},{"en":"43.2 kg/m²","tr":"43,2 kg/m²"},{"en":"60.0 kg/m²","tr":"60,0 kg/m²"}],"answer":0,"explanation":{"en":"BMI is mass divided by height squared: 108 / 1.80² = 33.3 kg/m². It is a size-based classification measure and does not directly measure individual body composition or physiological reserve.","tr":"VKİ, kütlenin boyun karesine bölünmesidir: 108 / 1,80² = 33,3 kg/m². Vücut ölçülerine dayalı bir sınıflama ölçütüdür; kişinin vücut bileşimini veya fizyolojik rezervini doğrudan ölçmez."},"sourcePages":[427],"difficulty":"applied"},{"id":"c86q2","stem":{"en":"Which mechanical respiratory change commonly accompanies substantial obesity?","tr":"Belirgin obeziteye sıklıkla hangi solunumsal mekanik değişiklik eşlik eder?"},"options":[{"en":"Increased FRC and increased chest-wall compliance","tr":"Artmış FRC ve artmış göğüs duvarı kompliyansı"},{"en":"Increased expiratory reserve volume with reduced work of breathing","tr":"Solunum işi azalırken ekspiratuvar rezerv hacminin artması"},{"en":"Reduced FRC and reduced chest-wall compliance","tr":"Azalmış FRC ve azalmış göğüs duvarı kompliyansı"},{"en":"Reduced closing capacity that reliably prevents atelectasis","tr":"Atelektaziyi güvenilir biçimde önleyen kapanma kapasitesi azalması"},{"en":"Unchanged lung volumes with lower oxygen consumption in every case","tr":"Her durumda düşük oksijen tüketimiyle birlikte değişmeyen akciğer hacimleri"}],"answer":2,"explanation":{"en":"Chest-wall and abdominal loading reduce resting lung volume and make ventilation mechanically more demanding. When FRC falls below closing capacity, dependent airway closure can worsen atelectasis and ventilation–perfusion mismatch.","tr":"Göğüs duvarı ve karın yükü istirahat akciğer hacmini azaltır ve ventilasyonu mekanik olarak zorlaştırır. FRC kapanma kapasitesinin altına düştüğünde bağımlı bölgelerde hava yolu kapanması atelektaziyi ve ventilasyon–perfüzyon uyumsuzluğunu artırabilir."},"sourcePages":[427],"difficulty":"core"},{"id":"c86q3","stem":{"en":"Which cardiovascular adaptation helps meet the increased metabolic demand associated with excess body mass?","tr":"Artmış vücut kütlesine bağlı yükselen metabolik gereksinimi karşılamaya hangi kardiyovasküler uyum yardımcı olur?"},"options":[{"en":"Reduced circulating volume with a lower stroke volume","tr":"Daha düşük atım hacmiyle birlikte azalmış dolaşan hacim"},{"en":"Reduced cardiac output with increased tissue oxygen extraction as the sole adaptation","tr":"Tek uyum olarak artmış doku oksijen ekstraksiyonuyla birlikte azalmış kalp debisi"},{"en":"Lower stroke volume and reduced ventricular filling","tr":"Daha düşük atım hacmi ve azalmış ventrikül dolumu"},{"en":"Reduced myocardial workload despite increased total perfusion needs","tr":"Toplam perfüzyon gereksinimi artmasına rağmen azalmış miyokard işi"},{"en":"Increased blood volume and cardiac output, often with increased stroke volume","tr":"Sıklıkla atım hacmi artışıyla birlikte kan hacmi ve kalp debisinin artması"}],"answer":4,"explanation":{"en":"Additional metabolically active tissue requires greater total perfusion, so circulating volume and cardiac output commonly increase. This can increase ventricular workload, especially when systemic hypertension is also present.","tr":"Ek metabolik aktif doku daha fazla toplam perfüzyon gerektirir; bu nedenle dolaşan hacim ve kalp debisi sıklıkla artar. Özellikle sistemik hipertansiyon da varsa ventrikülün işi artabilir."},"sourcePages":[427,428],"difficulty":"core"},{"id":"c86q4","stem":{"en":"How can common obesity coexist with high circulating leptin concentrations?","tr":"Yaygın obezite biçimleri, dolaşımda yüksek leptin konsantrasyonlarıyla nasıl birlikte bulunabilir?"},"options":[{"en":"Leptin primarily increases hunger, creating a positive-feedback loop","tr":"Leptin öncelikle açlığı artırarak pozitif geri bildirim döngüsü oluşturur"},{"en":"The hypothalamic response to leptin may be reduced","tr":"Hipotalamusun leptine yanıtı azalmış olabilir"},{"en":"High leptin necessarily indicates an absence of adipose tissue","tr":"Yüksek leptin zorunlu olarak yağ dokusu yokluğunu gösterir"},{"en":"The excess leptin acts only on peripheral muscle, without central signalling","tr":"Fazla leptin merkezi sinyal oluşturmadan yalnızca periferik kasa etki eder"},{"en":"High leptin reflects increased satiety sensitivity that fully prevents excess intake","tr":"Yüksek leptin aşırı alımı tamamen önleyen artmış tokluk duyarlılığını yansıtır"}],"answer":1,"explanation":{"en":"Adipocytes produce leptin as a signal of energy stores, normally tending to reduce hunger through hypothalamic pathways. Reduced sensitivity to that signal can limit its effect even when circulating leptin is high.","tr":"Adipositler enerji depolarının bir sinyali olarak leptin üretir; leptin normalde hipotalamik yollarla açlığı azaltma eğilimindedir. Bu sinyale duyarlılığın azalması, dolaşımdaki leptin yüksek olsa bile etkisini sınırlayabilir."},"sourcePages":[428],"difficulty":"core"},{"id":"c86q5","stem":{"en":"Which mechanism links recurrent hypoxaemia associated with obesity-related respiratory disease to right-ventricular strain?","tr":"Obeziteyle ilişkili solunum hastalığında tekrarlayan hipoksemiyi sağ ventrikül yüklenmesine hangi mekanizma bağlar?"},"options":[{"en":"Hypoxic pulmonary vasodilation increases right-ventricular afterload","tr":"Hipoksik pulmoner vazodilatasyon sağ ventrikül ard yükünü artırır"},{"en":"Pulmonary vascular resistance falls, requiring higher right-ventricular pressure","tr":"Pulmoner damar direnci düşer ve daha yüksek sağ ventrikül basıncı gerektirir"},{"en":"Isolated systemic vasodilation directly raises pulmonary arteriolar resistance","tr":"Yalnızca sistemik vazodilatasyon pulmoner arteriyol direncini doğrudan artırır"},{"en":"Hypoxic pulmonary vasoconstriction increases pulmonary vascular resistance","tr":"Hipoksik pulmoner vazokonstriksiyon pulmoner damar direncini artırır"},{"en":"Improved ventilation–perfusion matching eliminates hypoxic pulmonary pressure changes","tr":"Ventilasyon–perfüzyon uyumunun iyileşmesi hipoksik pulmoner basınç değişikliklerini ortadan kaldırır"}],"answer":3,"explanation":{"en":"Recurrent or sustained alveolar hypoxia can increase pulmonary vascular tone and pressure. The resulting rise in right-ventricular afterload can contribute to hypertrophy and eventual right-heart dysfunction.","tr":"Tekrarlayan veya süren alveoler hipoksi pulmoner damar tonusunu ve basıncını artırabilir. Bunun sonucunda sağ ventrikül ard yükünün artması hipertrofiye ve zamanla sağ kalp işlev bozukluğuna katkıda bulunabilir."},"sourcePages":[427,428],"difficulty":"applied"}]},{"id":87,"title":{"en":"Altitude","tr":"Yüksek İrtifa"},"startPage":431,"section":11,"endPage":433,"questions":[{"id":"c87q1","stem":{"en":"Why does inspired oxygen partial pressure fall during ascent while breathing ambient air?","tr":"Ortam havası solunurken yükselme sırasında inspiryum oksijen parsiyel basıncı neden düşer?"},"options":[{"en":"The oxygen fraction falls while barometric pressure stays constant","tr":"Barometrik basınç sabitken oksijen oranı düşer"},{"en":"Water vapour pressure rises because altitude alone raises its saturation pressure","tr":"İrtifanın tek başına doymuş su buharı basıncını artırmasıyla su buharı basıncı yükselir"},{"en":"Inspired oxygen pressure depends on oxygen fraction alone","tr":"İnspiryum oksijen basıncı yalnızca oksijen oranına bağlıdır"},{"en":"Barometric pressure falls while the oxygen fraction remains approximately 21%","tr":"Oksijen oranı yaklaşık %21 kalırken barometrik basınç düşer"},{"en":"Barometric pressure rises but the oxygen fraction falls more rapidly","tr":"Barometrik basınç yükselir ancak oksijen oranı daha hızlı düşer"}],"answer":3,"explanation":{"en":"The fraction of oxygen in air changes little with altitude, but total atmospheric pressure decreases. The humidified inspired oxygen pressure therefore falls according to FiO2 × (barometric pressure − water vapour pressure).","tr":"Havadaki oksijen oranı irtifayla çok az değişir; ancak toplam atmosfer basıncı azalır. Bu nedenle nemlendirilmiş inspiryum oksijen basıncı, FiO2 × (barometrik basınç − su buharı basıncı) ilişkisine göre düşer."},"sourcePages":[431],"difficulty":"core"},{"id":"c87q2","stem":{"en":"How does hypoxia-induced hyperventilation help increase alveolar oxygen tension at altitude?","tr":"Hipoksinin uyardığı hiperventilasyon irtifada alveoler oksijen basıncını artırmaya nasıl yardımcı olur?"},"options":[{"en":"It lowers alveolar and arterial CO2 tension","tr":"Alveoler ve arteriyel CO2 basıncını düşürür"},{"en":"It raises the oxygen fraction of ambient air","tr":"Ortam havasının oksijen oranını artırır"},{"en":"It increases barometric pressure within the environment","tr":"Ortamdaki barometrik basıncı artırır"},{"en":"It raises arterial CO2 tension","tr":"Arteriyel CO2 basıncını yükseltir"},{"en":"It increases the saturated vapour pressure of water independently of temperature","tr":"Suyun doymuş buhar basıncını sıcaklıktan bağımsız artırır"}],"answer":0,"explanation":{"en":"In the alveolar gas equation, the CO2 term is subtracted from inspired oxygen pressure. Lowering PaCO2 through increased alveolar ventilation therefore raises PAO2, although the associated respiratory alkalosis initially limits the response.","tr":"Alveoler gaz denkleminde CO2 terimi inspiryum oksijen basıncından çıkarılır. Alveoler ventilasyon artışıyla PaCO2’nin düşürülmesi bu nedenle PAO2’yi yükseltir; ancak eşlik eden solunumsal alkaloz başlangıçta yanıtı sınırlar."},"sourcePages":[431,432],"difficulty":"applied"},{"id":"c87q3","stem":{"en":"Which response increases red-cell mass during sustained residence at high altitude?","tr":"Yüksek irtifada uzun süre kalındığında hangi yanıt eritrosit kütlesini artırır?"},"options":[{"en":"Plasma-volume contraction without any increase in erythrocyte production","tr":"Eritrosit üretimi artmadan plazma hacminin daralması"},{"en":"Reduced erythropoietin secretion with faster red-cell turnover","tr":"Eritrosit döngüsü hızlanırken eritropoietin salgısının azalması"},{"en":"Hypoxia-stimulated renal erythropoietin release","tr":"Hipoksinin uyardığı renal eritropoietin salınımı"},{"en":"Suppression of erythroid progenitor proliferation by hypocapnia","tr":"Hipokapninin eritroid öncül çoğalmasını baskılaması"},{"en":"Increased 2,3-DPG within existing cells without new erythrocyte production","tr":"Yeni eritrosit üretimi olmadan mevcut hücrelerde 2,3-DPG artışı"}],"answer":2,"explanation":{"en":"The kidneys respond to reduced oxygen availability by increasing erythropoietin, stimulating marrow erythropoiesis. A rapid rise in haematocrit from plasma-volume contraction is different from the slower increase in true red-cell mass.","tr":"Böbrekler azalan oksijen sunumuna eritropoietini artırarak yanıt verir ve kemik iliği eritropoezini uyarır. Plazma hacmi daralmasına bağlı hızlı hematokrit artışı, gerçek eritrosit kütlesindeki daha yavaş artıştan farklıdır."},"sourcePages":[432],"difficulty":"core"},{"id":"c87q4","stem":{"en":"Why may hypoxic pulmonary vasoconstriction become harmful at high altitude?","tr":"Hipoksik pulmoner vazokonstriksiyon yüksek irtifada neden zararlı hale gelebilir?"},"options":[{"en":"It causes a generalised fall in pulmonary artery pressure","tr":"Pulmoner arter basıncında yaygın düşüş oluşturur"},{"en":"It lowers right-ventricular afterload while raising left-atrial pressure","tr":"Sol atriyum basıncını yükseltirken sağ ventrikül ard yükünü azaltır"},{"en":"It redirects blood only toward lung regions with normal alveolar oxygen tension","tr":"Kanı yalnızca alveoler oksijen basıncı normal olan akciğer bölgelerine yönlendirir"},{"en":"It increases capillary filtration solely by lowering plasma oncotic pressure","tr":"Yalnızca plazma onkotik basıncını azaltarak kapiller filtrasyonu artırır"},{"en":"Widespread alveolar hypoxia raises resistance across much of the pulmonary circulation","tr":"Yaygın alveoler hipoksi pulmoner dolaşımın büyük bölümünde direnci artırır"}],"answer":4,"explanation":{"en":"Regional hypoxic vasoconstriction can improve ventilation–perfusion matching, but altitude exposes a large proportion of the lung to hypoxia. The resulting rise in pulmonary vascular resistance and pressure increases right-heart workload and contributes to high-altitude pulmonary oedema.","tr":"Bölgesel hipoksik vazokonstriksiyon ventilasyon–perfüzyon uyumunu iyileştirebilir; ancak irtifada akciğerin büyük bölümü hipoksiye maruz kalır. Pulmoner damar direnci ve basıncındaki artış sağ kalbin işini artırır ve yüksek irtifa akciğer ödemine katkıda bulunur."},"sourcePages":[432],"difficulty":"applied"},{"id":"c87q5","stem":{"en":"At the same airway temperature of 37°C, how does saturated water vapour pressure compare at sea level and high altitude?","tr":"Hava yolu sıcaklığı aynı, 37°C iken doymuş su buharı basıncı deniz düzeyi ile yüksek irtifada nasıl karşılaştırılır?"},"options":[{"en":"It falls in direct proportion to barometric pressure","tr":"Barometrik basınçla doğru orantılı düşer"},{"en":"It is approximately the same, about 6.3 kPa","tr":"Yaklaşık aynıdır, 6,3 kPa civarındadır"},{"en":"It rises in direct proportion to altitude","tr":"İrtifayla doğru orantılı yükselir"},{"en":"It becomes zero above 2500 m","tr":"2500 m üzerinde sıfır olur"},{"en":"It equals the oxygen partial pressure at both altitudes","tr":"Her iki irtifada oksijen parsiyel basıncına eşittir"}],"answer":1,"explanation":{"en":"Saturated water vapour pressure depends on temperature rather than ambient barometric pressure. At altitude it therefore occupies a larger fraction of the lower total pressure, further limiting humidified inspired oxygen pressure.","tr":"Doymuş su buharı basıncı ortamın barometrik basıncından çok sıcaklığa bağlıdır. Bu nedenle irtifada azalmış toplam basıncın daha büyük bir kısmını oluşturur ve nemlendirilmiş inspiryum oksijen basıncını daha fazla sınırlar."},"sourcePages":[431],"difficulty":"core"}]},{"id":88,"title":{"en":"Diving","tr":"Dalış"},"startPage":434,"section":11,"endPage":435,"questions":[{"id":"c88q1","stem":{"en":"Which cardiovascular pattern characterises the diving reflex triggered by cold facial immersion?","tr":"Yüzün soğuk suya daldırılmasıyla tetiklenen dalış refleksini hangi kardiyovasküler örüntü tanımlar?"},"options":[{"en":"Tachycardia with peripheral vasodilation","tr":"Periferik vazodilatasyonla birlikte taşikardi"},{"en":"Bradycardia with peripheral vasoconstriction","tr":"Periferik vazokonstriksiyonla birlikte bradikardi"},{"en":"Bradycardia with peripheral vasodilation","tr":"Periferik vazodilatasyonla birlikte bradikardi"},{"en":"Tachycardia with peripheral vasoconstriction","tr":"Periferik vazokonstriksiyonla birlikte taşikardi"},{"en":"Unchanged heart rate with reduced vascular resistance","tr":"Damar direnci azalırken değişmeyen kalp hızı"}],"answer":1,"explanation":{"en":"Trigeminal afferent input from the cold face can evoke vagally mediated slowing of the heart and sympathetic peripheral vasoconstriction. This pattern favours perfusion of vital organs, but it does not make submersion safe or prevent drowning.","tr":"Soğuyan yüzden gelen trigeminal afferent girdi, vagal aracılı kalp yavaşlamasını ve sempatik periferik vazokonstriksiyonu tetikleyebilir. Bu örüntü yaşamsal organların perfüzyonunu destekler; ancak su altında kalmayı güvenli hale getirmez veya boğulmayı önlemez."},"sourcePages":[434],"difficulty":"core"},{"id":"c88q2","stem":{"en":"Why can head-out immersion in water promote diuresis?","tr":"Baş su dışında kalacak şekilde suya girilmesi neden diürezi artırabilir?"},"options":[{"en":"Increased peripheral venous pooling reduces atrial stretch","tr":"Artmış periferik venöz göllenme atriyal gerilmeyi azaltır"},{"en":"Reduced central blood volume suppresses natriuretic peptide secretion","tr":"Azalmış merkezi kan hacmi natriüretik peptid salgısını baskılar"},{"en":"Increased aldosterone promotes renal sodium loss","tr":"Artmış aldosteron böbrekten sodyum kaybını artırır"},{"en":"Hydrostatic compression shifts blood centrally and stretches cardiac chambers","tr":"Hidrostatik bası kanı merkeze kaydırır ve kalp boşluklarını gerer"},{"en":"Increased ADH directly increases free-water excretion","tr":"Artmış ADH serbest su atılımını doğrudan artırır"}],"answer":3,"explanation":{"en":"Water pressure reduces peripheral venous pooling and increases central blood volume. Cardiac stretch promotes natriuretic peptide release, favouring sodium and water excretion.","tr":"Su basıncı periferik venöz göllenmeyi azaltır ve merkezi kan hacmini artırır. Kalbin gerilmesi natriüretik peptid salınımını destekleyerek sodyum ve su atılımını artırır."},"sourcePages":[434],"difficulty":"applied"},{"id":"c88q3","stem":{"en":"Ignoring temperature change and gas exchange, what happens to a 6-L sealed gas volume when absolute pressure doubles during descent?","tr":"Sıcaklık değişimi ve gaz alışverişi göz ardı edildiğinde, iniş sırasında mutlak basınç iki katına çıkarsa kapalı 6 L gaz hacmi ne olur?"},"options":[{"en":"It decreases to 3 L","tr":"3 L’ye düşer"},{"en":"It increases to 12 L","tr":"12 L’ye çıkar"},{"en":"It remains 6 L","tr":"6 L kalır"},{"en":"It decreases to 1.5 L","tr":"1,5 L’ye düşer"},{"en":"It increases to 9 L","tr":"9 L’ye çıkar"}],"answer":0,"explanation":{"en":"Boyle’s law states that pressure multiplied by volume is constant for a fixed amount of gas at constant temperature. Doubling absolute pressure therefore halves volume; this is the basic compression principle affecting gas during descent.","tr":"Boyle yasasına göre sabit sıcaklıkta belirli miktarda gaz için basınç ile hacmin çarpımı sabittir. Mutlak basıncın iki katına çıkması hacmi yarıya indirir; iniş sırasında gazı etkileyen temel sıkışma ilkesi budur."},"sourcePages":[434,435],"difficulty":"applied"},{"id":"c88q4","stem":{"en":"What mechanism underlies decompression sickness after an inadequately controlled ascent from a compressed-gas dive?","tr":"Basınçlı gazla yapılan dalıştan yeterince kontrollü olmayan çıkış sonrası dekompresyon hastalığının temel mekanizması nedir?"},"options":[{"en":"Pulmonary gas overexpansion alone, without dissolved tissue-gas involvement","tr":"Çözünmüş doku gazı katkısı olmadan yalnızca pulmoner gazın aşırı genişlemesi"},{"en":"Raised nitrogen partial pressure directly suppresses neural function at depth","tr":"Yüksek azot parsiyel basıncının derinde sinir işlevini doğrudan baskılaması"},{"en":"Dissolved inert gas forms bubbles as ambient pressure falls","tr":"Ortam basıncı düşerken çözünmüş inert gazın kabarcık oluşturması"},{"en":"High oxygen partial pressure causes oxidative neural toxicity","tr":"Yüksek oksijen parsiyel basıncının oksidatif sinir toksisitesi oluşturması"},{"en":"Falling ambient pressure raises inert-gas solubility in tissues","tr":"Düşen ortam basıncının dokulardaki inert gaz çözünürlüğünü artırması"}],"answer":2,"explanation":{"en":"At depth, increased inert-gas partial pressure promotes gas uptake into blood and tissues. As pressure falls, excess dissolved gas may form bubbles; pulmonary overexpansion and arterial gas embolism are related diving hazards but are not the same mechanism.","tr":"Derinde inert gaz parsiyel basıncının artması kana ve dokulara gaz alımını artırır. Basınç düşünce fazla çözünmüş gaz kabarcık oluşturabilir; akciğerin aşırı genişlemesi ve arteriyel gaz embolisi ilişkili dalış tehlikeleridir ancak mekanizmaları aynı değildir."},"sourcePages":[435],"difficulty":"core"},{"id":"c88q5","stem":{"en":"Why does breathing a denser gas mixture at depth tend to increase work of breathing?","tr":"Derinde daha yoğun bir gaz karışımı solumak neden solunum işini artırma eğilimindedir?"},"options":[{"en":"Increased density lowers the Reynolds number and favours laminar flow","tr":"Artmış yoğunluk Reynolds sayısını düşürerek laminer akımı destekler"},{"en":"Increased density reduces the pressure gradient required for turbulent flow","tr":"Artmış yoğunluk türbülanslı akım için gereken basınç gradyanını azaltır"},{"en":"Gas density affects diffusion but has no effect on resistive breathing work","tr":"Gaz yoğunluğu difüzyonu etkiler ancak dirençli solunum işini etkilemez"},{"en":"Higher density improves airway conductance at unchanged airway dimensions","tr":"Daha yüksek yoğunluk, hava yolu boyutları değişmeden hava yolu iletkenliğini artırır"},{"en":"Greater gas density increases the pressure cost of turbulent flow","tr":"Artmış gaz yoğunluğu türbülanslı akımın basınç gereksinimini artırır"}],"answer":4,"explanation":{"en":"Deeper compressed-gas breathing increases gas density and can increase turbulence-related resistance. Lower-density helium mixtures can reduce this mechanical burden, but they do not eliminate other pressure-related diving hazards.","tr":"Derinde basınçlı gaz solunması gaz yoğunluğunu yükseltir ve türbülansa bağlı direnci artırabilir. Daha düşük yoğunluklu helyum karışımları bu mekanik yükü azaltabilir ancak basınca bağlı diğer dalış tehlikelerini ortadan kaldırmaz."},"sourcePages":[435],"difficulty":"applied"}]},{"id":89,"title":{"en":"Temperature Regulation","tr":"Sıcaklık Düzenlenmesi"},"startPage":436,"se
