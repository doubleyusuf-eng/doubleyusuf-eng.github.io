rom the central vein through sinusoids towards portal venules","tr":"Santral venden sinüzoidler üzerinden portal venüllere doğru"},{"en":"From hepatic arterioles directly to portal venules without sinusoidal passage","tr":"Sinüzoidden geçmeden hepatik arteriyollerden doğrudan portal venüllere doğru"},{"en":"From the central vein into bile canaliculi before reaching portal areas","tr":"Portal bölgelere ulaşmadan önce santral venden safra kanaliküllerine doğru"},{"en":"From portal vessels through bile ducts towards the central vein","tr":"Portal damarlardan safra kanalları üzerinden santral vene doğru"},{"en":"From portal triad vessels through sinusoids towards the central vein","tr":"Portal triad damarlarından sinüzoidler üzerinden santral vene doğru"}],"answer":4,"explanation":{"en":"Branches of the portal vein and hepatic artery feed the sinusoids, which drain towards central veins. Bile moves in a different route through canaliculi towards bile ducts near the portal areas.","tr":"Portal ven ve hepatik arter dalları, santral venlere doğru boşalan sinüzoidleri besler. Safra ise farklı bir yoldan, kanaliküller boyunca portal bölgelerdeki safra kanallarına doğru ilerler."},"sourcePages":[296,297],"difficulty":"core"},{"id":"c65q5","stem":{"en":"Which liver cell removes microorganisms and particulate material from sinusoidal blood by phagocytosis?","tr":"Hangi karaciğer hücresi sinüzoidal kandaki mikroorganizmaları ve partikülleri fagositozla uzaklaştırır?"},"options":[{"en":"Cholangiocyte","tr":"Kolanjiyosit"},{"en":"Hepatocyte","tr":"Hepatosit"},{"en":"Kupffer cell","tr":"Kupffer hücresi"},{"en":"Hepatic stellate cell","tr":"Hepatik yıldızsı hücre"},{"en":"Sinusoidal endothelial cell as the resident macrophage","tr":"Yerleşik makrofaj olarak sinüzoidal endotel hücresi"}],"answer":2,"explanation":{"en":"Kupffer cells are resident hepatic macrophages associated with the sinusoids. Their position allows them to clear blood-borne material arriving from the gastrointestinal circulation.","tr":"Kupffer hücreleri sinüzoidlerle ilişkili yerleşik karaciğer makrofajlarıdır. Konumları gastrointestinal dolaşımdan gelen kandaki maddeleri temizlemelerine olanak verir."},"sourcePages":[297],"difficulty":"core"}]},{"id":66,"title":{"en":"Liver Function","tr":"Karaciğer İşlevleri"},"startPage":299,"section":5,"endPage":306,"questions":[{"id":"c66q1","stem":{"en":"Which hepatic process converts nitrogen from amino acid breakdown into a form suitable for urinary excretion?","tr":"Hangi karaciğer süreci, amino asit yıkımından gelen azotu idrarla atılmaya uygun bir biçime dönüştürür?"},"options":[{"en":"Conversion of bilirubin to biliverdin","tr":"Bilirubinin biliverdine dönüştürülmesi"},{"en":"Glycogen synthesis from glucose","tr":"Glukozdan glikojen sentezi"},{"en":"Urea formation from ammonia","tr":"Amonyaktan üre oluşumu"},{"en":"Esterification of cholesterol","tr":"Kolesterolün esterleştirilmesi"},{"en":"Hydrolysis of triglyceride to fatty acids","tr":"Trigliseridin yağ asitlerine hidrolizi"}],"answer":2,"explanation":{"en":"Amino acid deamination generates ammonia, which is potentially toxic. The liver converts much of this nitrogen into urea for renal excretion and also incorporates ammonia into glutamine.","tr":"Amino asit deaminasyonu potansiyel olarak toksik amonyak oluşturur. Karaciğer bu azotun büyük bölümünü böbrekten atılmak üzere üreye dönüştürür; ayrıca amonyağı glutamine de katar."},"sourcePages":[300],"difficulty":"core"},{"id":"c66q2","stem":{"en":"What is the main effect of conjugating bilirubin with glucuronic acid in hepatocytes?","tr":"Hepatositlerde bilirubinin glukuronik asitle konjuge edilmesinin temel etkisi nedir?"},"options":[{"en":"It decreases water solubility to promote albumin transport","tr":"Albüminle taşınmayı artırmak için suda çözünürlüğü azaltır"},{"en":"It converts bilirubin to urobilinogen within the hepatocyte","tr":"Bilirubini hepatosit içinde ürobilinojene dönüştürür"},{"en":"It increases albumin binding and prevents renal excretion","tr":"Albümine bağlanmayı artırır ve renal atılımı önler"},{"en":"It generates unconjugated bilirubin for splenic uptake","tr":"Dalakta alınmak üzere konjuge olmamış bilirubin oluşturur"},{"en":"It increases water solubility and facilitates biliary excretion","tr":"Suda çözünürlüğü artırır ve safra yoluyla atılımı kolaylaştırır"}],"answer":4,"explanation":{"en":"Unconjugated bilirubin is poorly water soluble and travels in plasma bound to albumin. Hepatic conjugation increases solubility, enabling transport into bile and explaining why conjugated bilirubin can appear in urine when elevated in blood.","tr":"Konjuge olmamış bilirubin suda az çözünür ve plazmada albümine bağlı taşınır. Karaciğerde konjugasyon çözünürlüğü artırarak safraya taşınmasını sağlar; kandaki konjuge bilirubin yükseldiğinde idrarda görülebilmesini de açıklar."},"sourcePages":[300,301,302],"difficulty":"core"},{"id":"c66q3","stem":{"en":"Which reaction is an example of phase 2 drug metabolism?","tr":"Hangi tepkime faz 2 ilaç metabolizmasına örnektir?"},"options":[{"en":"Cytochrome P450-mediated oxidation","tr":"Sitokrom P450 aracılı oksidasyon"},{"en":"Glucuronidation","tr":"Glukuronidasyon"},{"en":"Ester hydrolysis","tr":"Ester hidrolizi"},{"en":"Reduction of a nitro group","tr":"Nitro grubunun indirgenmesi"},{"en":"ATP-dependent export into bile","tr":"ATP’ye bağımlı olarak safraya dışa taşıma"}],"answer":1,"explanation":{"en":"Phase 2 reactions conjugate a drug or metabolite with another chemical group, often increasing polarity. Oxidation, reduction and hydrolysis are phase 1 processes, while transporter-mediated elimination is a separate step.","tr":"Faz 2 tepkimeleri ilacı veya metabolitini başka bir kimyasal grupla konjuge eder ve çoğunlukla polariteyi artırır. Oksidasyon, indirgenme ve hidroliz faz 1 süreçleridir; taşıyıcı aracılı eliminasyon ise ayrı bir basamaktır."},"sourcePages":[303],"difficulty":"core"},{"id":"c66q4","stem":{"en":"Which plasma protein is principally produced by plasma cells rather than the liver?","tr":"Hangi plazma proteini esas olarak karaciğer yerine plazma hücrelerinde üretilir?"},"options":[{"en":"Immunoglobulin G","tr":"İmmünoglobulin G"},{"en":"Albumin","tr":"Albümin"},{"en":"Fibrinogen","tr":"Fibrinojen"},{"en":"Transferrin","tr":"Transferrin"},{"en":"Alpha-1 antitrypsin","tr":"Alfa-1 antitripsin"}],"answer":0,"explanation":{"en":"The liver synthesises many transport proteins, clotting proteins and protease inhibitors. Immunoglobulins are an important exception because antibody-producing plasma cells are their source.","tr":"Karaciğer birçok taşıyıcı protein, pıhtılaşma proteini ve proteaz inhibitörü sentezler. İmmünoglobulinler önemli bir istisnadır; kaynakları antikor üreten plazma hücreleridir."},"sourcePages":[302],"difficulty":"core"},{"id":"c66q5","stem":{"en":"Why can prothrombin time change more rapidly than serum albumin after a sudden fall in hepatic protein synthesis?","tr":"Karaciğer protein sentezinin ani azalmasından sonra protrombin zamanı neden serum albümininden daha hızlı değişebilir?"},"options":[{"en":"Albumin has a shorter plasma half-life than the relevant clotting factors","tr":"Albüminin plazma yarı ömrü ilgili pıhtılaşma faktörlerinden daha kısadır"},{"en":"Albumin is released from a large hepatic storage granule pool after synthesis stops","tr":"Sentez durduğunda albümin büyük hepatik depo granül havuzundan salınır"},{"en":"Prothrombin time measures the rate of hepatocyte leakage rather than synthesis","tr":"Protrombin zamanı sentez yerine hepatosit sızıntı hızını ölçer"},{"en":"Some relevant clotting factors turn over much faster than albumin","tr":"İlgili bazı pıhtılaşma faktörlerinin yenilenme hızı albüminden çok daha yüksektir"},{"en":"Albumin concentration is determined only by renal clearance, not synthesis","tr":"Albümin konsantrasyonu sentezle değil, yalnızca renal klirensle belirlenir"}],"answer":3,"explanation":{"en":"Short-lived clotting factors can fall before the much larger, slower-turning-over albumin pool changes appreciably. Prothrombin time is therefore more responsive to acute synthetic change, although vitamin K status and other causes can also affect it.","tr":"Kısa ömürlü pıhtılaşma faktörleri, daha büyük ve yavaş yenilenen albümin havuzu belirgin değişmeden önce azalabilir. Bu nedenle protrombin zamanı akut sentez değişikliğine daha duyarlıdır; ancak K vitamini durumu ve başka nedenler de onu etkileyebilir."},"sourcePages":[304,305],"difficulty":"applied"}]},{"id":67,"title":{"en":"Renal Function, Anatomy and Blood Flow","tr":"Böbreğin İşlevleri, Anatomisi ve Kan Akımı"},"startPage":307,"section":6,"endPage":312,"questions":[{"id":"c67q1","stem":{"en":"Which renal endocrine function directly supports red-cell production?","tr":"Böbreğin hangi endokrin işlevi eritrosit üretimini doğrudan destekler?"},"options":[{"en":"Aldosterone production","tr":"Aldosteron üretimi"},{"en":"Antidiuretic hormone synthesis","tr":"Antidiüretik hormon sentezi"},{"en":"Angiotensinogen synthesis","tr":"Anjiyotensinojen sentezi"},{"en":"Erythropoietin production","tr":"Eritropoietin üretimi"},{"en":"Atrial natriuretic peptide production","tr":"Atriyal natriüretik peptid üretimi"}],"answer":3,"explanation":{"en":"The kidney produces erythropoietin, which stimulates erythropoiesis in bone marrow. Aldosterone is produced in the adrenal cortex; the kidney instead initiates the renin–angiotensin–aldosterone system by releasing renin.","tr":"Böbrek, kemik iliğinde eritropoezi uyaran eritropoietini üretir. Aldosteron adrenal kortekste üretilir; böbrek ise renin salgılayarak renin–anjiyotensin–aldosteron sistemini başlatır."},"sourcePages":[307],"difficulty":"core"},{"id":"c67q2","stem":{"en":"With other variables unchanged, what is the immediate effect of constricting the afferent arteriole?","tr":"Diğer değişkenler sabitken afferent arteriyolün daralmasının hemen ortaya çıkan etkisi nedir?"},"options":[{"en":"Reduced renal blood flow and glomerular capillary pressure","tr":"Böbrek kan akımının ve glomerüler kapiller basıncın azalması"},{"en":"Increased renal blood flow and glomerular capillary pressure","tr":"Böbrek kan akımının ve glomerüler kapiller basıncın artması"},{"en":"Reduced renal blood flow with increased glomerular capillary pressure","tr":"Böbrek kan akımı azalırken glomerüler kapiller basıncın artması"},{"en":"Unchanged renal blood flow with increased filtration","tr":"Böbrek kan akımı değişmeden filtrasyonun artması"},{"en":"Increased renal blood flow with reduced filtration","tr":"Böbrek kan akımı artarken filtrasyonun azalması"}],"answer":0,"explanation":{"en":"Afferent constriction increases resistance before the glomerular capillaries, reducing their inflow and hydrostatic pressure. The fall in this filtration-driving pressure tends to reduce GFR.","tr":"Afferent daralma, glomerüler kapillerlerden önce direnci artırarak bu kapillere gelen kan akımını ve hidrostatik basıncı azaltır. Filtrasyonu sağlayan bu basıncın düşmesi glomerüler filtrasyon hızını azaltma eğilimindedir."},"sourcePages":[309],"difficulty":"applied"},{"id":"c67q3","stem":{"en":"An increase in NaCl delivery to the macula densa normally produces which tubuloglomerular feedback response?","tr":"Makula densaya ulaşan NaCl miktarının artması normalde hangi tübüloglomerüler geri bildirim yanıtını oluşturur?"},"options":[{"en":"Afferent dilation and increased renin release","tr":"Afferent genişleme ve renin salınımında artma"},{"en":"Afferent dilation and reduced renin release","tr":"Afferent genişleme ve renin salınımında azalma"},{"en":"Afferent arteriolar constriction and reduced renin release","tr":"Afferent arteriyolde daralma ve renin salınımında azalma"},{"en":"Afferent constriction and increased renin release","tr":"Afferent daralma ve renin salınımında artma"},{"en":"Mesangial relaxation and increased filtration area","tr":"Mezangiyal gevşeme ve filtrasyon alanında artma"}],"answer":2,"explanation":{"en":"The macula densa senses distal NaCl delivery through its Na+/K+/2Cl− cotransporter. Local signalling constricts the afferent arteriole and inhibits renin release, opposing the initial increase in filtration.","tr":"Makula densa, distal NaCl sunumunu Na+/K+/2Cl− kotransporteri aracılığıyla algılar. Yerel sinyaller afferent arteriyolü daraltır ve renin salınımını baskılayarak filtrasyondaki başlangıç artışına karşı koyar."},"sourcePages":[309,310],"difficulty":"core"},{"id":"c67q4","stem":{"en":"Which stimulus directly promotes renin release from juxtaglomerular granular cells?","tr":"Hangi uyarı jukstaglomerüler granüler hücrelerden renin salınımını doğrudan artırır?"},"options":[{"en":"Increased pressure in the afferent arteriole","tr":"Afferent arteriyolde basınç artışı"},{"en":"Increased NaCl delivery to the macula densa","tr":"Makula densaya NaCl sunumunun artması"},{"en":"Increased atrial natriuretic peptide activity","tr":"Atriyal natriüretik peptid etkinliğinin artması"},{"en":"Inhibition of renal sympathetic nerves","tr":"Böbreğin sempatik sinirlerinin inhibisyonu"},{"en":"Sympathetic activation of β1-adrenoceptors","tr":"β1-adrenoseptörlerin sempatik aktivasyonu"}],"answer":4,"explanation":{"en":"Granular cells release renin in response to β1-adrenergic stimulation, low afferent arteriolar pressure, and reduced macula-densa NaCl signalling. Renin cleaves angiotensinogen; it is not itself a direct vasoconstrictor.","tr":"Granüler hücreler β1-adrenerjik uyarıya, düşük afferent arteriyol basıncına ve azalmış makula densa NaCl sinyaline yanıt olarak renin salgılar. Renin anjiyotensinojeni parçalar; kendisi doğrudan bir vazokonstriktör değildir."},"sourcePages":[310],"difficulty":"core"},{"id":"c67q5","stem":{"en":"Renal plasma flow is 600 mL/min and haematocrit is 0.40. What is the corresponding renal blood flow?","tr":"Renal plazma akımı 600 mL/dk ve hematokrit 0,40 ise böbrek kan akımı kaçtır?"},"options":[{"en":"240 mL/min","tr":"240 mL/dk"},{"en":"1000 mL/min","tr":"1000 mL/dk"},{"en":"360 mL/min","tr":"360 mL/dk"},{"en":"600 mL/min","tr":"600 mL/dk"},{"en":"1500 mL/min","tr":"1500 mL/dk"}],"answer":1,"explanation":{"en":"Plasma occupies the fraction 1 − haematocrit of whole-blood volume. Renal blood flow is therefore 600 / 0.60 = 1000 mL/min; multiplying by haematocrit would not recover whole-blood flow.","tr":"Plazma, tam kan hacminin 1 − hematokrit kadarını oluşturur. Bu nedenle böbrek kan akımı 600 / 0,60 = 1000 mL/dk olur; hematokrit ile çarpmak tam kan akımını vermez."},"sourcePages":[311],"difficulty":"applied"}]},{"id":68,"title":{"en":"Renal Filtration and Reabsorption","tr":"Renal Filtrasyon ve Geri Emilim"},"startPage":313,"section":6,"endPage":317,"questions":[{"id":"c68q1","stem":{"en":"Which structure forms the outer epithelial component of the glomerular filtration barrier?","tr":"Glomerüler filtrasyon bariyerinin dıştaki epitel bileşenini hangi yapı oluşturur?"},"options":[{"en":"Macula densa cells","tr":"Makula densa hücreleri"},{"en":"Podocyte foot processes and their filtration slits","tr":"Podosit ayaksı çıkıntıları ve aralarındaki filtrasyon yarıkları"},{"en":"Collecting-duct principal cells","tr":"Toplayıcı kanal esas hücreleri"},{"en":"Juxtaglomerular granular cells","tr":"Jukstaglomerüler granüler hücreler"},{"en":"Proximal tubular brush-border cells","tr":"Proksimal tübülün fırçamsı kenarlı hücreleri"}],"answer":1,"explanation":{"en":"The barrier includes fenestrated capillary endothelium, glomerular basement membrane, and podocytes with slit diaphragms. Podocytes help restrict macromolecule passage; the macula densa instead participates in feedback regulation of filtration.","tr":"Bariyer; fenestralı kapiller endotel, glomerüler bazal membran ve yarık diyaframları taşıyan podositlerden oluşur. Podositler makromoleküllerin geçişini sınırlar; makula densa ise filtrasyonun geri bildirimle düzenlenmesine katılır."},"sourcePages":[313],"difficulty":"core"},{"id":"c68q2","stem":{"en":"What supplies the energy gradient for sodium–glucose cotransport in the proximal tubule?","tr":"Proksimal tübülde sodyum–glukoz kotransportunun enerji gradyanını ne sağlar?"},"options":[{"en":"Direct ATP hydrolysis by the apical sodium–glucose transporter","tr":"Apikal sodyum–glukoz taşıyıcısının doğrudan ATP hidrolizi"},{"en":"An apical sodium pump that raises intracellular sodium","tr":"Hücre içi sodyumu artıran apikal sodyum pompası"},{"en":"Passive glucose diffusion driven only by the glucose gradient","tr":"Yalnızca glukoz gradyanının sağladığı pasif glukoz difüzyonu"},{"en":"Basolateral Na+/K+-ATPase lowering intracellular sodium","tr":"Hücre içi sodyumu azaltan bazolateral Na+/K+-ATPaz"},{"en":"Basolateral Na+/K+-ATPase raising intracellular sodium","tr":"Hücre içi sodyumu artıran bazolateral Na+/K+-ATPaz"}],"answer":3,"explanation":{"en":"The basolateral Na+/K+-ATPase uses ATP to maintain low intracellular Na+. Sodium moving down this electrochemical gradient drives glucose uptake across the apical membrane, so glucose transport is secondary active transport.","tr":"Bazolateral Na+/K+-ATPaz, hücre içi Na+ düzeyini düşük tutmak için ATP kullanır. Sodyumun bu elektrokimyasal gradyan boyunca hareketi, glukozun apikal membrandan alınmasını sağlar; dolayısıyla glukoz taşınması sekonder aktif transporttur."},"sourcePages":[313,314],"difficulty":"core"},{"id":"c68q3","stem":{"en":"Why does glucose appear in urine when its filtered load becomes sufficiently high in an otherwise intact nephron?","tr":"Diğer işlevleri sağlam bir nefronda filtre edilen glukoz yükü yeterince yükseldiğinde neden idrarda glukoz görülür?"},"options":[{"en":"The capacity of tubular glucose reabsorption is exceeded","tr":"Tübüler glukoz geri emilim kapasitesi aşılır"},{"en":"The glomerular barrier develops a selective glucose leak","tr":"Glomerüler bariyerde glukoza seçici kaçak gelişir"},{"en":"Distal tubular glucose secretion becomes the dominant excretory route","tr":"Distal tübüler glukoz sekresyonu başlıca atılım yolu olur"},{"en":"Filtered glucose becomes predominantly protein bound","tr":"Filtre edilen glukoz ağırlıklı olarak proteine bağlı hale gelir"},{"en":"Glucose clearance falls because reabsorption increases without limit","tr":"Geri emilim sınırsız arttığı için glukoz klirensi düşer"}],"answer":0,"explanation":{"en":"Glucose is filtered and normally recovered by saturable proximal tubular transporters. Once the filtered load exceeds available reabsorptive capacity, the excess remains in tubular fluid and is excreted.","tr":"Glukoz filtre edilir ve normalde proksimal tübüldeki doyurulabilir taşıyıcılarla geri alınır. Filtre edilen yük geri emilim kapasitesini aştığında fazlası tübül sıvısında kalır ve atılır."},"sourcePages":[314],"difficulty":"applied"},{"id":"c68q4","stem":{"en":"Inulin concentration is 100 mg/L in plasma and 10,000 mg/L in urine, with urine flow 1.2 mL/min. What is the measured GFR?","tr":"Plazma inülin konsantrasyonu 100 mg/L, idrar inülin konsantrasyonu 10.000 mg/L ve idrar akımı 1,2 mL/dk ise ölçülen glomerüler filtrasyon hızı kaçtır?"},"options":[{"en":"12 mL/min","tr":"12 mL/dk"},{"en":"83 mL/min","tr":"83 mL/dk"},{"en":"120 mL/min","tr":"120 mL/dk"},{"en":"100 mL/min","tr":"100 mL/dk"},{"en":"1200 mL/min","tr":"1200 mL/dk"}],"answer":2,"explanation":{"en":"Clearance equals urine concentration multiplied by urine flow and divided by plasma concentration: 10,000 × 1.2 / 100 = 120 mL/min. Because inulin is freely filtered without tubular reabsorption or secretion, its clearance equals GFR.","tr":"Klirens; idrar konsantrasyonu ile idrar akımının çarpımının plazma konsantrasyonuna bölünmesidir: 10.000 × 1,2 / 100 = 120 mL/dk. İnülin serbestçe filtre edilip tübüler geri emilim veya sekresyona uğramadığından klirensi glomerüler filtrasyon hızına eşittir."},"sourcePages":[315,316],"difficulty":"applied"},{"id":"c68q5","stem":{"en":"Which ratio defines the filtration fraction?","tr":"Filtrasyon fraksiyonunu hangi oran tanımlar?"},"options":[{"en":"GFR divided by renal blood flow","tr":"Glomerüler filtrasyon hızının böbrek kan akımına oranı"},{"en":"Urine flow divided by cardiac output","tr":"İdrar akımının kalp debisine oranı"},{"en":"Renal plasma flow divided by GFR","tr":"Renal plazma akımının glomerüler filtrasyon hızına oranı"},{"en":"Urine flow divided by renal plasma flow","tr":"İdrar akımının renal plazma akımına oranı"},{"en":"GFR divided by renal plasma flow","tr":"Glomerüler filtrasyon hızının renal plazma akımına oranı"}],"answer":4,"explanation":{"en":"The filtration fraction is the proportion of incoming renal plasma that is filtered at the glomeruli. With a GFR of 125 mL/min and renal plasma flow of 600 mL/min, it is approximately 0.21, or 21%.","tr":"Filtrasyon fraksiyonu, böbreğe gelen plazmanın glomerüllerden filtre edilen oranıdır. Glomerüler filtrasyon hızı 125 mL/dk ve renal plazma akımı 600 mL/dk ise yaklaşık 0,21, yani %21 olur."},"sourcePages":[317],"difficulty":"core"}]},{"id":69,"title":{"en":"Renal Regulation of Water and Electrolyte Balance","tr":"Su ve Elektrolit Dengesinin Böbrek Tarafından Düzenlenmesi"},"startPage":318,"section":6,"endPage":328,"questions":[{"id":"c69q1","stem":{"en":"A 70-kg adult has an estimated total body water of 42 L. Approximately how much is intracellular?","tr":"Toplam vücut suyu 42 L olarak tahmin edilen 70 kg bir erişkinde bunun yaklaşık ne kadarı hücre içindedir?"},"options":[{"en":"3 L","tr":"3 L"},{"en":"10 L","tr":"10 L"},{"en":"14 L","tr":"14 L"},{"en":"35 L","tr":"35 L"},{"en":"28 L","tr":"28 L"}],"answer":4,"explanation":{"en":"About two-thirds of total body water is intracellular, giving 42 × 2/3 = 28 L. The remaining third is extracellular; these are approximate teaching values that vary with body composition and age.","tr":"Toplam vücut suyunun yaklaşık üçte ikisi hücre içindedir; 42 × 2/3 = 28 L eder. Kalan üçte biri hücre dışındadır; bunlar vücut bileşimine ve yaşa göre değişen yaklaşık öğretici değerlerdir."},"sourcePages":[318],"difficulty":"core"},{"id":"c69q2","stem":{"en":"How does antidiuretic hormone acutely increase collecting-duct water permeability?","tr":"Antidiüretik hormon, toplayıcı kanalın su geçirgenliğini kısa sürede nasıl artırır?"},"options":[{"en":"V1-receptor signalling inserts aquaporin-2 into the apical membrane","tr":"V1 reseptör sinyali apikal membrana akuaporin-2 yerleştirir"},{"en":"V2-receptor signalling inserts aquaporin-2 into the apical membrane","tr":"V2 reseptör sinyali apikal membrana akuaporin-2 yerleştirir"},{"en":"V2-receptor signalling removes apical aquaporin-2","tr":"V2 reseptör sinyali apikal akuaporin-2’yi uzaklaştırır"},{"en":"It increases collecting-duct water reabsorption by active water transport","tr":"Aktif su taşınmasıyla toplayıcı kanalda su geri emilimini artırır"},{"en":"It reduces medullary interstitial osmolality to draw water out of the lumen","tr":"Lümenden su çekmek için medüller interstisyel ozmolaliteyi azaltır"}],"answer":1,"explanation":{"en":"ADH activates V2 receptors and a cyclic-AMP pathway in collecting-duct principal cells. Apical aquaporin-2 allows water to move passively toward the hyperosmotic medullary interstitium.","tr":"ADH, toplayıcı kanal esas hücrelerinde V2 reseptörlerini ve siklik AMP yolunu etkinleştirir. Apikal akuaporin-2, suyun hiperozmotik medüller interstisyuma doğru pasif olarak hareket etmesini sağlar."},"sourcePages":[320,321],"difficulty":"core"},{"id":"c69q3","stem":{"en":"Why does the thick ascending limb dilute tubular fluid while helping concentrate the renal medulla?","tr":"Henle kulpunun kalın çıkan kolu, böbrek medullasını yoğunlaştırmaya katkıda bulunurken tübül sıvısını neden seyreltir?"},"options":[{"en":"It preferentially reabsorbs water while retaining salt in the lumen","tr":"Lümende tuzu tutarken tercihen suyu geri emer"},{"en":"It secretes NaCl into the lumen without water","tr":"Su olmadan lümene NaCl salgılar"},{"en":"It reabsorbs salt and water in exactly isotonic proportions","tr":"Tuz ve suyu tam izotonik oranlarda geri emer"},{"en":"It reabsorbs salt while remaining poorly permeable to water","tr":"Suya geçirgenliği düşük kalırken tuzu geri emer"},{"en":"It increases water permeability in response to aldosterone","tr":"Aldosterona yanıt olarak su geçirgenliğini artırır"}],"answer":3,"explanation":{"en":"The thick ascending limb reabsorbs Na+, K+, and Cl− through NKCC2, driven indirectly by the Na+/K+-ATPase. Because water does not follow, tubular fluid becomes dilute while salt accumulates in the interstitium.","tr":"Kalın çıkan kol, Na+/K+-ATPazın dolaylı olarak sağladığı enerjiyle NKCC2 üzerinden Na+, K+ ve Cl− geri emer. Su bunu izlemediği için interstisyumda tuz birikirken tübül sıvısı seyrelir."},"sourcePages":[320,321],"difficulty":"core"},{"id":"c69q4","stem":{"en":"A patient has persistent large-volume dilute urine despite high plasma osmolality. Failure of collecting ducts to respond to ADH describes which disorder?","tr":"Plazma ozmolalitesi yüksek olmasına rağmen sürekli bol ve seyreltik idrar çıkaran bir hastada toplayıcı kanalların ADH’ye yanıt vermemesi hangi bozukluğu tanımlar?"},"options":[{"en":"Nephrogenic diabetes insipidus","tr":"Nefrojenik diabetes insipidus"},{"en":"Syndrome of inappropriate ADH secretion","tr":"Uygunsuz ADH salınımı sendromu"},{"en":"Primary aldosterone excess","tr":"Primer aldosteron fazlalığı"},{"en":"Central diabetes insipidus due to absent ADH release","tr":"ADH salınımı yokluğuna bağlı santral diabetes insipidus"},{"en":"Isolated reduction in thirst with intact renal concentration","tr":"Böbreğin yoğunlaştırma işlevi sağlamken yalnızca susama hissinin azalması"}],"answer":0,"explanation":{"en":"Nephrogenic diabetes insipidus is renal resistance to ADH, so water conservation remains impaired despite the hormonal signal. Central diabetes insipidus instead reflects inadequate ADH secretion; both can produce inappropriately dilute urine.","tr":"Nefrojenik diabetes insipidus, böbreğin ADH’ye direnç göstermesidir; bu nedenle hormonal sinyale rağmen suyun korunması bozulur. Santral diabetes insipidusta ise ADH salınımı yetersizdir; her ikisinde de uygunsuz derecede seyreltik idrar görülebilir."},"sourcePages":[323],"difficulty":"applied"},{"id":"c69q5","stem":{"en":"Which renal response is promoted by aldosterone when plasma potassium rises?","tr":"Plazma potasyumu yükseldiğinde aldosteron hangi renal yanıtı artırır?"},"options":[{"en":"Increased distal sodium reabsorption with reduced potassium secretion","tr":"Distal sodyum geri emilimi artarken potasyum sekresyonunun azalması"},{"en":"Reduced sodium reabsorption with increased potassium reabsorption","tr":"Sodyum geri emilimi azalırken potasyum geri emiliminin artması"},{"en":"Increased distal potassium secretion with sodium reabsorption","tr":"Sodyum geri emilimiyle birlikte distal potasyum sekresyonunun artması"},{"en":"Increased proximal potassium reabsorption without changing distal secretion","tr":"Distal sekresyon değişmeden proksimal potasyum geri emiliminin artması"},{"en":"Increased distal sodium and potassium reabsorption together","tr":"Distal sodyum ve potasyum geri emiliminin birlikte artması"}],"answer":2,"explanation":{"en":"Raised plasma potassium directly stimulates aldosterone secretion from the adrenal cortex. Aldosterone promotes sodium reabsorption and potassium secretion in the distal nephron, supporting potassium excretion rather than merely shifting it between compartments.","tr":"Plazma potasyumunun yükselmesi adrenal korteksten aldosteron salınımını doğrudan uyarır. Aldosteron distal nefronda sodyum geri emilimini ve potasyum sekresyonunu artırır; böylece potasyumu yalnızca bölmeler arasında kaydırmak yerine atılımını destekler."},"sourcePages":[324,326],"difficulty":"applied"}]},{"id":70,"title":{"en":"Acid–Base Physiology","tr":"Asit–Baz Fizyolojisi"},"startPage":329,"section":6,"endPage":337,"questions":[{"id":"c70q1","stem":{"en":"If bicarbonate remains constant while PaCO2 doubles, approximately how does pH change according to Henderson–Hasselbalch?","tr":"Bikarbonat sabitken PaCO2 iki katına çıkarsa Henderson–Hasselbalch denklemine göre pH yaklaşık nasıl değişir?"},"options":[{"en":"It rises by 0.30","tr":"0,30 artar"},{"en":"It falls by 1.00","tr":"1,00 azalır"},{"en":"It falls by 0.30","tr":"0,30 azalır"},{"en":"It falls by 0.10","tr":"0,10 azalır"},{"en":"It remains unchanged","tr":"Değişmez"}],"answer":2,"explanation":{"en":"pH depends on the logarithm of the bicarbonate-to-dissolved-CO2 ratio. Doubling PaCO2 halves that ratio, changing pH by log10(1/2), approximately −0.30, before compensation is considered.","tr":"pH, bikarbonatın çözünmüş CO2’ye oranının logaritmasına bağlıdır. PaCO2’nin iki katına çıkması bu oranı yarıya indirir; kompanzasyon dikkate alınmadan pH değişimi log10(1/2), yani yaklaşık −0,30 olur."},"sourcePages":[330],"difficulty":"applied"},{"id":"c70q2","stem":{"en":"Why can hypoalbuminaemia conceal an increase in unmeasured acids when interpreting the anion gap?","tr":"Anyon açığı yorumlanırken hipoalbüminemi, ölçülmeyen asitlerdeki artışı neden gizleyebilir?"},"options":[{"en":"Albumin is a major unmeasured cation, so its reduction lowers the gap","tr":"Albümin önemli bir ölçülmeyen katyondur; azalması anyon açığını düşürür"},{"en":"Albumin reduction raises the baseline gap and masks added anions","tr":"Albümin azalması başlangıç açığını yükselterek ek anyonları gizler"},{"en":"Albumin is routinely included in the measured bicarbonate concentration","tr":"Albümin rutin olarak ölçülen bikarbonat konsantrasyonuna dahil edilir"},{"en":"Low albumin makes the anion gap depend only on PaCO2","tr":"Düşük albümin anyon açığını yalnızca PaCO2’ye bağımlı hale getirir"},{"en":"Albumin is a major unmeasured anion, so its reduction lowers the baseline gap","tr":"Albümin önemli bir ölçülmeyen anyondur; azalması başlangıçtaki anyon açığını düşürür"}],"answer":4,"explanation":{"en":"The anion gap partly represents negatively charged albumin not included in the routine electrolyte calculation. A lower albumin concentration reduces the expected gap, so an apparently normal result does not exclude accumulation of other unmeasured anions.","tr":"Anyon açığı kısmen, rutin elektrolit hesabına katılmayan negatif yüklü albümini yansıtır. Albüminin azalması beklenen anyon açığını düşürdüğünden görünürde normal bir sonuç diğer ölçülmeyen anyonların birikimini dışlamaz."},"sourcePages":[332],"difficulty":"applied"},{"id":"c70q3","stem":{"en":"What is the normal respiratory compensation for a primary metabolic acidosis?","tr":"Primer metabolik asidozda normal solunumsal kompanzasyon nedir?"},"options":[{"en":"Decreased alveolar ventilation, increasing PaCO2","tr":"PaCO2’yi artıran alveoler ventilasyon azalması"},{"en":"Increased alveolar ventilation, reducing PaCO2","tr":"PaCO2’yi azaltan alveoler ventilasyon artışı"},{"en":"Increased alveolar ventilation, increasing PaCO2","tr":"PaCO2’yi artıran alveoler ventilasyon artışı"},{"en":"Reduced tidal volume with unchanged respiratory rate","tr":"Solunum hızı değişmeden tidal hacmin azalması"},{"en":"Unchanged alveolar ventilation with increased renal bicarbonate excretion","tr":"Alveoler ventilasyon değişmeden renal bikarbonat atılımının artması"}],"answer":1,"explanation":{"en":"Acidaemia stimulates peripheral chemoreceptors and increases ventilation. Removing more CO2 raises the bicarbonate-to-CO2 ratio and limits the fall in pH, but it does not remove the primary metabolic disturbance.","tr":"Asidemi periferik kemoreseptörleri uyarır ve ventilasyonu artırır. Daha fazla CO2 uzaklaştırılması, bikarbonat/CO2 oranını yükselterek pH düşüşünü sınırlar; ancak primer metabolik bozukluğu ortadan kaldırmaz."},"sourcePages":[331,333],"difficulty":"core"},{"id":"c70q4","stem":{"en":"During proximal tubular bicarbonate reclamation, which substance crosses the apical membrane after luminal bicarbonate combines with secreted H+?","tr":"Proksimal tübülde bikarbonatın geri kazanılması sırasında lümendeki bikarbonat salgılanan H+ ile birleştikten sonra hangi madde apikal membranı geçer?"},"options":[{"en":"Bicarbonate ion","tr":"Bikarbonat iyonu"},{"en":"Carbonic acid as the principal transported species","tr":"Başlıca taşınan tür olarak karbonik asit"},{"en":"Ammonium ion","tr":"Amonyum iyonu"},{"en":"Carbon dioxide","tr":"Karbondioksit"},{"en":"Dihydrogen phosphate ion","tr":"Dihidrojen fosfat iyonu"}],"answer":3,"explanation":{"en":"Luminal carbonic anhydrase facilitates conversion of H+ and bicarbonate into CO2 and water. CO2 enters the tubular cell, where bicarbonate is re-formed and transported across the basolateral membrane; recycling H+ in this process does not itself constitute net acid excretion.","tr":"Lümendeki karbonik anhidraz, H+ ve bikarbonatın CO2 ve suya dönüşmesini kolaylaştırır. CO2 tübül hücresine girer; burada bikarbonat yeniden oluşur ve bazolateral membrandan taşınır. Bu süreçte H+’ın yeniden kullanılması tek başına net asit atılımı değildir."},"sourcePages":[333,334],"difficulty":"core"},{"id":"c70q5","stem":{"en":"Why may acute respiratory alkalosis cause tingling and carpopedal spasm despite an unchanged total plasma calcium?","tr":"Akut solunumsal alkaloz, toplam plazma kalsiyumu değişmediği halde neden parestezi ve karpopedal spazma yol açabilir?"},"options":[{"en":"Increased calcium binding to albumin reduces ionised calcium","tr":"Kalsiyumun albümine bağlanmasının artması iyonize kalsiyumu azaltır"},{"en":"Reduced calcium binding to albumin increases ionised calcium","tr":"Kalsiyumun albümine bağlanmasının azalması iyonize kalsiyumu artırır"},{"en":"Increased parathyroid hormone immediately lowers ionised calcium","tr":"Paratiroid hormonunun artması iyonize kalsiyumu hemen düşürür"},{"en":"Reduced albumin concentration lowers both bound and ionised calcium equally","tr":"Albümin konsantrasyonunun azalması bağlı ve iyonize kalsiyumu eşit düşürür"},{"en":"A left shift of the oxyhaemoglobin curve directly releases calcium from albumin","tr":"Oksihemoglobin eğrisinin sola kayması albüminden doğrudan kalsiyum serbestleştirir"}],"answer":0,"explanation":{"en":"At higher pH, fewer H+ ions compete with calcium for albumin-binding sites, so the ionised fraction falls. Reduced ionised calcium increases neuromuscular excitability even if total calcium concentration is unchanged.","tr":"pH yükseldiğinde albümin bağlanma bölgeleri için kalsiyumla yarışan H+ azalır ve iyonize kalsiyum oranı düşer. Toplam kalsiyum konsantrasyonu değişmese bile iyonize kalsiyumun azalması nöromüsküler uyarılabilirliği artırır."},"sourcePages":[335],"difficulty":"applied"}]},{"id":71,"title":{"en":"Micturition","tr":"Miksiyon"},"startPage":338,"section":6,"endPage":340,"questions":[{"id":"c71q1","stem":{"en":"Which autonomic combination favours urine storage?","tr":"Hangi otonom etki kombinasyonu idrar depolanmasını destekler?"},"options":[{"en":"β3-mediated detrusor relaxation with α1-mediated bladder-neck contraction","tr":"β3 aracılı detrüsör gevşemesi ve α1 aracılı mesane boynu kasılması"},{"en":"Muscarinic detrusor contraction with external sphincter relaxation","tr":"Muskarinik detrüsör kasılması ve dış sfinkter gevşemesi"},{"en":"β3-mediated detrusor contraction with bladder-neck relaxation","tr":"β3 aracılı detrüsör kasılması ve mesane boynu gevşemesi"},{"en":"Simultaneous relaxation of detrusor and both urethral sphincters","tr":"Detrüsör ve her iki üretral sfinkterin birlikte gevşemesi"},{"en":"Complete inhibition of all sympathetic activity","tr":"Tüm sempatik etkinliğin tamamen baskılanması"}],"answer":0,"explanation":{"en":"Sympathetic activity relaxes the detrusor through β3-adrenoceptors and increases outlet resistance through α1-adrenoceptors. This allows filling while maintaining continence, whereas parasympathetic detrusor activation favours voiding.","tr":"Sempatik etkinlik β3-adrenoseptörler aracılığıyla detrüsörü gevşetir ve α1-adrenoseptörler aracılığıyla çıkış direncini artırır. Böylece dolum sırasında kontinans korunur; parasempatik detrüsör aktivasyonu ise boşaltımı destekler."},"sourcePages":[338],"difficulty":"core"},{"id":"c71q2","stem":{"en":"Which nerve provides somatic motor control of the external urethral sphincter?","tr":"Dış üretral sfinkterin somatik motor kontrolünü hangi sinir sağlar?"},"options":[{"en":"Pelvic splanchnic nerves","tr":"Pelvik splanknik sinirler"},{"en":"Hypogastric nerve","tr":"Hipogastrik sinir"},{"en":"Pudendal nerve","tr":"Pudendal sinir"},{"en":"Obturator nerve","tr":"Obturator sinir"},{"en":"Ilioinguinal nerve","tr":"İlioinguinal sinir"}],"answer":2,"explanation":{"en":"The external urethral sphincter is striated muscle supplied by the pudendal nerve, permitting voluntary control. The hypogastric nerve carries sympathetic fibres involved in bladder storage rather than this somatic sphincter supply.","tr":"Dış üretral sfinkter, pudendal sinir tarafından innerve edilen çizgili kastır ve istemli kontrole olanak verir. Hipogastrik sinir bu somatik sfinkter innervasyonu yerine mesanenin depolama işlevine katılan sempatik lifleri taşır."},"sourcePages":[338],"difficulty":"core"},{"id":"c71q3","stem":{"en":"During normal early bladder filling, a substantial rise in volume causes only a small pressure rise. Which property explains this?","tr":"Normal mesane dolumunun erken döneminde hacimde belirgin artışın yalnızca küçük bir basınç artışına yol açmasını hangi özellik açıklar?"},"options":[{"en":"Low compliance of the detrusor wall","tr":"Detrüsör duvarının düşük kompliyansı"},{"en":"Progressively increasing detrusor tone during early filling","tr":"Erken dolumda giderek artan detrüsör tonusu"},{"en":"A fixed relationship in which pressure doubles whenever volume doubles","tr":"Hacim her iki katına çıktığında basıncın da iki katına çıktığı sabit ilişki"},{"en":"Rhythmic external sphincter relaxation that continuously vents the bladder","tr":"Mesaneyi sürekli boşaltan ritmik dış sfinkter gevşemesi"},{"en":"High compliance of the detrusor wall","tr":"Detrüsör duvarının yüksek kompliyansı"}],"answer":4,"explanation":{"en":"Compliance is the change in volume for a given change in pressure. Viscoelastic behaviour of the detrusor permits storage at relatively low pressure; compliance falls as the bladder approaches higher filling volumes.","tr":"Kompliyans, belirli bir basınç değişimine karşı oluşan hacim değişimidir. Detrüsörün viskoelastik davranışı idrarın görece düşük basınçta depolanmasını sağlar; mesane yüksek dolum hacimlerine yaklaştıkça kompliyans azalır."},"sourcePages":[338],"difficulty":"applied"},{"id":"c71q4","stem":{"en":"Which coordinated action is required for effective micturition?","tr":"Etkili miksiyon için hangi eşgüdümlü hareket gereklidir?"},"options":[{"en":"Detrusor relaxation with maximal sphincter contraction","tr":"Sfinkter azami kasılırken detrüsörün gevşemesi"},{"en":"Detrusor contraction together with reduced urethral sphincter activity","tr":"Üretral sfinkter etkinliği azalırken detrüsörün kasılması"},{"en":"Equal contraction of detrusor and external sphincter throughout voiding","tr":"Boşaltım boyunca detrüsör ve dış sfinkterin eşit kasılması"},{"en":"Complete loss of sacral parasympathetic outflow","tr":"Sakral parasempatik çıkışın tamamen kaybolması"},{"en":"Isolated closure of the bladder neck","tr":"Yalnızca mesane boynunun kapanması"}],"answer":1,"explanation":{"en":"The pontine micturition centre coordinates bladder contraction with relaxation of the outlet. If the sphincter contracts while the detrusor contracts, detrusor–sphincter dyssynergia can impair emptying.","tr":"Pontin miksiyon merkezi mesane kasılmasını çıkış bölgesinin gevşemesiyle eşgüdümlü hale getirir. Detrüsör kasılırken sfinkterin de kasılması detrüsör–sfinkter dissinerjisi oluşturarak boşaltımı bozabilir."},"sourcePages":[339],"difficulty":"core"},{"id":"c71q5","stem":{"en":"Why does spinal anaesthesia predispose to postoperative urinary retention?","tr":"Spinal anestezi ameliyat sonrası idrar retansiyonuna neden yatkınlık oluşturur?"},"options":[{"en":"It increases parasympathetic detrusor stimulation while closing the outlet","tr":"Çıkışı kapatırken parasempatik detrüsör uyarısını artırır"},{"en":"It increases bladder-neck relaxation without altering detrusor control","tr":"Detrüsör kontrolünü değiştirmeden mesane boynu gevşemesini artırır"},{"en":"It reduces urine production, making the bladder too empty to contract","tr":"İdrar üretimini azaltarak mesaneyi kasılamayacak kadar boş bırakır"},{"en":"It temporarily interrupts neural pathways needed for bladder emptying","tr":"Mesanenin boşalması için gereken sinir yollarını geçici olarak kesintiye uğratır"},{"en":"It directly increases external sphincter strength through somatic stimulation","tr":"Somatik uyarıyla dış sfinkter gücünü doğrudan artırır"}],"answer":3,"explanation":{"en":"Neuraxial blockade can impair bladder sensation and autonomic motor input to the detrusor. Urine may therefore accumulate in a full bladder despite continued renal production, which distinguishes retention from failure to produce urine.","tr":"Nöraksiyel blok, mesane duyusunu ve detrüsöre gelen otonom motor uyarıları bozabilir. Bu nedenle böbrekler idrar üretmeye devam ederken dolu mesanede idrar birikebilir; retansiyon bu yönüyle idrar üretilememesinden ayrılır."},"sourcePages":[339,340],"difficulty":"applied"}]},{"id":72,"title":{"en":"Haemostasis","tr":"Hemostaz"},"startPage":341,"section":7,"endPage":349,"questions":[{"id":"c72q1","stem":{"en":"Which pair describes the two major haemostatic roles of von Willebrand factor?","tr":"Von Willebrand faktörünün hemostazdaki iki temel rolünü hangi seçenek tanımlar?"},"options":[{"en":"Platelet aggregation and enzymatic cleavage of fibrinogen","tr":"Trombosit agregasyonu ve fibrinojenin enzimatik parçalanması"},{"en":"Platelet adhesion and enzymatic cross-linking of fibrin","tr":"Trombosit adezyonu ve fibrinin enzimatik çapraz bağlanması"},{"en":"Protection of factor VIII and activation of plasminogen","tr":"Faktör VIII’in korunması ve plazminojenin aktivasyonu"},{"en":"Platelet adhesion to injured vessels and protection of circulating factor VIII","tr":"Trombositlerin hasarlı damara adezyonu ve dolaşımdaki faktör VIII’in korunması"},{"en":"Inhibition of platelet adhesion and inactivation of factor Va","tr":"Trombosit adezyonunun baskılanması ve faktör Va’nın inaktivasyonu"}],"answer":3,"explanation":{"en":"Von Willebrand factor helps bridge platelets to exposed subendothelial structures and stabilises factor VIII in plasma. Its deficiency can therefore impair both primary haemostasis and coagulation.","tr":"Von Willebrand faktörü trombositlerle açığa çıkan subendotelyal yapılar arasında köprü kurulmasına yardımcı olur ve plazmada faktör VIII’i stabilize eder. Bu nedenle eksikliği hem primer hemostazı hem de koagülasyonu bozabilir."},"sourcePages":[342,345],"difficulty":"core"},{"id":"c72q2","stem":{"en":"Which platelet receptor binds fibrinogen to link activated platelets during aggregation?","tr":"Agregasyon sırasında aktive trombositleri birbirine bağlamak üzere fibrinojen bağlayan trombosit reseptörü hangisidir?"},"options":[{"en":"Glycoprotein IIb/IIIa","tr":"Glikoprotein IIb/IIIa"},{"en":"Glycoprotein Ib-IX-V","tr":"Glikoprotein Ib-IX-V"},{"en":"Glycoprotein VI","tr":"Glikoprotein VI"},{"en":"P2Y12 receptor","tr":"P2Y12 reseptörü"},{"en":"Protease-activated receptor 1","tr":"Proteazla aktive olan reseptör 1"}],"answer":0,"explanation":{"en":"Activated glycoprotein IIb/IIIa binds fibrinogen, which forms bridges between platelets. This aggregation step differs from the initial adhesion of platelets to the injured vessel wall.","tr":"Aktive glikoprotein IIb/IIIa, trombositler arasında köprü oluşturan fibrinojeni bağlar. Bu agregasyon basamağı, trombositlerin başlangıçta hasarlı damar duvarına tutunmasından farklıdır."},"sourcePages":[342,343,344],"difficulty":"core"},{"id":"c72q3","stem":{"en":"Which enzyme directly converts soluble fibrinogen into fibrin?","tr":"Çözünür fibrinojeni doğrudan fibrine dönüştüren enzim hangisidir?"},"options":[{"en":"Plasmin","tr":"Plazmin"},{"en":"Activated protein C","tr":"Aktive protein C"},{"en":"Thrombin, factor IIa","tr":"Trombin, faktör IIa"},{"en":"Antithrombin","tr":"Antitrombin"},{"en":"Tissue plasminogen activator","tr":"Doku plazminojen aktivatörü"}],"answer":2,"explanation":{"en":"Thrombin cleaves fibrinogen to generate fibrin and also activates factor XIII, which cross-links fibrin. Plasmin has the opposite overall role: it breaks down fibrin during fibrinolysis.","tr":"Trombin fibrinojeni parçalayarak fibrin oluşturur; ayrıca fibrini çapraz bağlayan faktör XIII’ü aktive eder. Plazminin genel rolü bunun tersidir: fibrinoliz sırasında fibrini parçalar."},"sourcePages":[345,348],"difficulty":"core"},{"id":"c72q4","stem":{"en":"What anticoagulant action follows formation of a thrombin–thrombomodulin complex on intact endothelium?","tr":"Sağlam endotelde trombin–trombomodülin kompleksi oluşmasını hangi antikoagülan etki izler?"},"options":[{"en":"Activation of factor XIII to inhibit fibrin cross-linking","tr":"Fibrinin çapraz bağlanmasını baskılamak için faktör XIII’ün aktivasyonu"},{"en":"Activation of protein C to cleave fibrin directly","tr":"Fibrini doğrudan parçalamak için protein C’nin aktivasyonu"},{"en":"Activation of protein S as the protease that cleaves factor X","tr":"Faktör X’i parçalayan proteaz olarak protein S’nin aktivasyonu"},{"en":"Inhibition of plasminogen activation to accelerate fibrinolysis","tr":"Fibrinolizi hızlandırmak için plazminojen aktivasyonunun baskılanması"},{"en":"Activation of protein C, which with protein S inactivates factors Va and VIIIa","tr":"Protein S ile birlikte faktör Va ve VIIIa’yı inaktive eden protein C’nin aktivasyonu"}],"answer":4,"explanation":{"en":"Thrombomodulin changes thrombin’s functional context, enabling activation of protein C. Activated protein C and its cofactor protein S limit further thrombin generation by inactivating Va and VIIIa.","tr":"Trombomodülin, trombinin işlevsel etkisini değiştirerek protein C’yi aktive etmesini sağlar. Aktive protein C ve kofaktörü protein S, Va ile VIIIa’yı inaktive ederek daha fazla trombin oluşmasını sınırlar."},"sourcePages":[341,345],"difficulty":"core"},{"id":"c72q5","stem":{"en":"What does formation of D-dimer specifically indicate at the molecular level?","tr":"D-dimer oluşumu moleküler düzeyde özellikle hangi olayı gösterir?"},"options":[{"en":"Degradation of fibrinogen without prior cross-linked clot formation","tr":"Öncesinde çapraz bağlı pıhtı oluşmadan fibrinojenin parçalanması"},{"en":"Degradation of cross-linked fibrin","tr":"Çapraz bağlı fibrinin parçalanması"},{"en":"Conversion of prothrombin to thrombin before fibrin forms","tr":"Fibrin oluşmadan protrombinin trombine dönüşmesi"},{"en":"Activation of platelets without fibrin formation","tr":"Fibrin oluşmadan trombositlerin aktivasyonu"},{"en":"Proteolytic inactivation of factors Va and VIIIa","tr":"Faktör Va ve VIIIa’nın proteolitik inaktivasyonu"}],"answer":1,"explanation":{"en":"D-dimer is released when plasmin degrades fibrin that has already been cross-linked in a clot. It reflects fibrin formation and breakdown, but an elevated result alone does not identify the cause or location.","tr":"D-dimer, plazminin pıhtı içindeki önceden çapraz bağlanmış fibrini parçalamasıyla açığa çıkar. Fibrin oluşumu ve yıkımını yansıtır; ancak tek başına yüksek bulunması nedeni veya yerini belirlemez."},"sourcePages":[348],"difficulty":"applied"}]},{"id":73,"title":{"en":"Transfusion","tr":"Transfüzyon"},"startPage":350,"section":7,"endPage":355,"questions":[{"id":"c73q1","stem":{"en":"In the usual ABO pattern, which antibodies are expected in an adult with blood group A?","tr":"Olağan ABO düzeninde, A kan grubundaki bir erişkinde hangi antikorlar beklenir?"},"options":[{"en":"Anti-A antibodies only","tr":"Yalnızca anti-A antikorları"},{"en":"Anti-B antibodies","tr":"Anti-B antikorları"},{"en":"Both anti-A and anti-B antibodies","tr":"Hem anti-A hem anti-B antikorları"},{"en":"Anti-D antibodies in every person","tr":"Her kişide anti-D antikorları"},{"en":"No antibodies to either A or B","tr":"A veya B’ye karşı hiç antikor bulunmaması"}],"answer":1,"explanation":{"en":"Group A red cells express A antigen, while the plasma usually contains antibodies against the absent B antigen. ABO compatibility therefore concerns the interaction between recipient antibodies and donor red-cell antigens.","tr":"A grubu eritrositler A antijenini taşırken plazmada genellikle bulunmayan B antijenine karşı antikorlar vardır. Bu nedenle ABO uyumluluğu, alıcının antikorları ile vericinin eritrosit antijenlerinin etkileşimiyle ilgilidir."},"sourcePages":[350,351],"difficulty":"core"},{"id":"c73q2","stem":{"en":"Why can maternal anti-D antibodies cause fetal haemolysis?","tr":"Annenin anti-D antikorları neden fetüste hemolize yol açabilir?"},"options":[{"en":"They are predominantly IgM and undergo placental transcytosis","tr":"Ağırlıklı olarak IgM yapısındadırlar ve plasental transsitoza uğrarlar"},{"en":"They are IgA transported through the placenta’s glucose carriers","tr":"Plasentanın glukoz taşıyıcılarıyla taşınan IgA yapısındadırlar"},{"en":"They act only on maternal red cells, causing secondary fetal haemolysis","tr":"Yalnızca maternal eritrositlere etki ederek sekonder fetal hemoliz oluştururlar"},{"en":"They are generally IgG and can cross the placenta","tr":"Genellikle IgG yapısındadırlar ve plasentayı geçebilirler"},{"en":"They require direct mixing of the entire maternal and fetal circulations","tr":"Maternal ve fetal dolaşımların bütünüyle doğrudan karışmasını gerektirirler"}],"answer":3,"explanation":{"en":"Anti-D usually develops after exposure of an RhD-negative individual to RhD-positive red cells. IgG can cross the placenta and bind RhD-positive fetal erythrocytes, promoting their destruction.","tr":"Anti-D genellikle RhD-negatif bir kişinin RhD-pozitif eritrositlerle karşılaşmasından sonra gelişir. IgG plasentayı geçip RhD-pozitif fetal eritrositlere bağlanarak yıkımlarını artırabilir."},"sourcePages":[351],"difficulty":"core"},{"id":"c73q3","stem":{"en":"In a serological major crossmatch for red-cell transfusion, which materials are tested together?","tr":"Eritrosit transfüzyonu için serolojik majör çapraz karşılaştırmada hangi materyaller birlikte test edilir?"},"options":[{"en":"Recipient serum or plasma with donor red cells","tr":"Alıcının serum veya plazması ile vericinin eritrositleri"},{"en":"Donor plasma with recipient red cells","tr":"Vericinin plazması ile alıcının eritrositleri"},{"en":"Recipient red cells with anti-A and anti-B typing reagents","tr":"Alıcının eritrositleri ile anti-A ve anti-B gruplama reaktifleri"},{"en":"Donor red cells with anti-D typing reagent","tr":"Vericinin eritrositleri ile anti-D gruplama reaktifi"},{"en":"Recipient plasma with screening cells rather than the proposed donor cells","tr":"Alıcının plazması ile kullanılacak verici hücreleri yerine tarama hücreleri"}],"answer":0,"explanation":{"en":"The major crossmatch asks whether recipient antibodies react with antigens on the proposed donor red cells. ABO and RhD matching alone does not exclude incompatibility involving other red-cell antigens.","tr":"Majör çapraz karşılaştırma, alıcıdaki antikorların kullanılacak verici eritrositlerinin antijenleriyle reaksiyona girip girmediğini araştırır. Yalnızca ABO ve RhD eşleştirmesi diğer eritrosit antijenlerine ilişkin uyumsuzluğu dışlamaz."},"sourcePages":[352],"difficulty":"applied"},{"id":"c73q4","stem":{"en":"How does loss of 2,3-DPG during red-cell storage initially affect haemoglobin oxygen affinity?","tr":"Eritrositlerin depolanması sırasında 2,3-DPG kaybı, hemoglobinin oksijen afinitesini başlangıçta nasıl etkiler?"},"options":[{"en":"Affinity decreases, shifting the curve rightward","tr":"Afinitesi azalır ve eğri sağa kayar"},{"en":"Affinity is unchanged, but haemoglobin concentration rises","tr":"Afinite değişmez ancak hemoglobin konsantrasyonu artar"},{"en":"Affinity increases, shifting the dissociation curve leftward","tr":"Afinitesi artar ve dissosiasyon eğrisi sola kayar"},{"en":"P50 increases without changing the amount of haemoglobin","tr":"Hemoglobin miktarı değişmeden P50 artar"},{"en":"The curve shifts rightward because deoxyhaemoglobin is stabilised","tr":"Deoksihemoglobin stabilize edildiği için eğri sağa kayar"}],"answer":2,"explanation":{"en":"2,3-DPG normally reduces haemoglobin oxygen affinity by stabilising the deoxygenated state. Its depletion therefore favours oxygen binding and a left shift; the biochemical change does not by itself establish the clinical effect of a particular transfusion.","tr":"2,3-DPG normalde deoksijenize durumu stabilize ederek hemoglobinin oksijen afinitesini azaltır. Bu nedenle azalması oksijen bağlanmasını ve sola kaymayı destekler; bu biyokimyasal değişim tek başına belirli bir transfüzyonun klinik etkisini göstermez."},"sourcePages":[352],"difficulty":"applied"},{"id":"c73q5","stem":{"en":"What mechanism explains a fall in ionised calcium during rapid large-volume transfusion of citrate-containing components?","tr":"Sitrat içeren bileşenlerin hızlı ve büyük hacimli transfüzyonu sırasında iyonize kalsiyumun düşmesini hangi mekanizma açıklar?"},"options":[{"en":"Citrate reduces albumin binding and releases calcium into its free form","tr":"Sitrat albümin bağlanmasını azaltıp kalsiyumu serbest hale getirir"},{"en":"Citrate directly stimulates immediate urinary calcium loss as its main action","tr":"Sitrat başlıca etkisi olarak hemen idrarla kalsiyum kaybını doğrudan uyarır"},{"en":"Citrate inhibits osteoclast activity, rapidly removing circulating calcium","tr":"Sitrat osteoklast etkinliğini baskılayarak dolaşımdaki kalsiyumu hızla uzaklaştırır"},{"en":"Citrate raises ionised calcium by displacing it from phosphate","tr":"Sitrat kalsiyumu fosfattan ayırarak iyonize kalsiyumu artırır"},{"en":"Citrate binds calcium in the recipient’s circulation","tr":"Sitratın alıcının dolaşımında kalsiyumu bağlaması"}],"answer":4,"explanation":{"en":"Citrate prevents stored blood from clotting by chelating calcium. If citrate enters faster than it can be metabolised, circulating ionised calcium can fall, affecting myocardial and coagulation function.","tr":"Sitrat kalsiyumu şelatlayarak depolanan kanın pıhtılaşmasını önler. Sitrat metabolize edilebileceğinden daha hızlı dolaşıma girerse iyonize kalsiyum düşebilir ve miyokard ile koagülasyon işlevleri etkilenebilir."},"sourcePages":[354],"difficulty":"applied"}]},{"id":74,"title":{"en":"Anaemia and Polycythaemia","tr":"Anemi ve Polisitemi"},"startPage":356,"section":7,"endPage":359,"questions":[{"id":"c74q1","stem":{"en":"Which requirement explains megaloblastic erythropoiesis in vitamin B12 or folate deficiency?","tr":"B12 vitamini veya folat eksikliğinde megaloblastik eritropoezi hangi gereksinim açıklar?"},"options":[{"en":"Both are required mainly for insertion of iron into haem","tr":"Her ikisi de esas olarak hem grubuna demir yerleştirilmesi için gereklidir"},{"en":"Both primarily stabilise mature erythrocyte membrane spectrin","tr":"Her ikisi de öncelikle olgun eritrosit membran spektrinini stabilize eder"},{"en":"Both directly stimulate erythropoietin secretion independent of oxygen supply","tr":"Her ikisi de oksijen sunumundan bağımsız doğrudan eritropoietin salınımını uyarır"},{"en":"Both primarily prevent complement-mediated erythrocyte lysis","tr":"Her ikisi de öncelikle kompleman aracılı eritrosit lizisini önler"},{"en":"Both are needed for normal DNA synthesis in erythroid precursors","tr":"Her ikisi de eritroid öncüllerde normal DNA sentezi için gereklidir"}],"answer":4,"explanation":{"en":"Rapidly dividing erythroid precursors require folate and vitamin B12 for effective DNA synthesis. Deficiency disrupts nuclear maturation, whereas iron deficiency primarily limits haem synthesis and commonly produces microcytic cells.","tr":"Hızla bölünen eritroid öncüller etkin DNA sentezi için folat ve B12 vitaminine gereksinim duyar. Eksiklikleri çekirdek olgunlaşmasını bozar; demir eksikliği ise öncelikle hem sentezini sınırlar ve sıklıkla mikrositik hücrelere yol açar."},"sourcePages":[356],"difficulty":"core"},{"id":"c74q2","stem":{"en":"What is a principal mechanism of the usually normocytic anaemia of advanced chronic kidney disease?","tr":"İleri kronik böbrek hastalığında genellikle normositik olan aneminin temel mekanizmalarından biri nedir?"},"options":[{"en":"Increased erythropoietin resistance from excess renal erythropoietin synthesis","tr":"Aşırı renal eritropoietin sentezine bağlı eritropoietin direnci artışı"},{"en":"Insufficient erythropoietin production","tr":"Yetersiz eritropoietin üretimi"},{"en":"Loss of intrinsic factor production by renal tubules","tr":"Böbrek tübüllerinin intrinsik faktör üretiminin kaybı"},{"en":"Accelerated splenic sequestration as the sole characteristic renal mechanism","tr":"Böbreğe özgü tek mekanizma olarak hızlanmış dalakta tutulma"},{"en":"Dilution from a selective increase in red-cell mass","tr":"Eritrosit kütlesinin seçici artışına bağlı dilüsyon"}],"answer":1,"explanation":{"en":"The kidney is the main source of erythropoietin, which supports erythroid progenitor survival and development. Reduced production in advanced renal disease can impair red-cell production, even when cell size remains normal.","tr":"Böbrek, eritroid öncüllerin yaşamını ve gelişimini destekleyen eritropoietinin temel kaynağıdır. İleri böbrek hastalığında üretimin azalması, hücre boyutu normal kalsa bile eritrosit üretimini bozabilir."},"sourcePages":[356],"difficulty":"core"},{"id":"c74q3","stem":{"en":"What is the effect of increased hepcidin on intestinal iron transfer into plasma?","tr":"Hepcidin artışı bağırsaktan plazmaya demir geçişini nasıl etkiler?"},"options":[{"en":"It increases transfer by enhancing ferroportin-mediated export","tr":"Ferroportin aracılı çıkışı artırarak geçişi yükseltir"},{"en":"It lowers enterocyte ferritin, forcing more iron into plasma","tr":"Enterosit ferritinini azaltarak daha fazla demiri plazmaya yönlendirir"},{"en":"It increases transferrin-bound iron export by opening ferroportin","tr":"Ferroportini açarak transferrine bağlı demir çıkışını artırır"},{"en":"It reduces transfer by inhibiting ferroportin-mediated iron export","tr":"Ferroportin aracılı demir çıkışını baskılayarak geçişi azaltır"},{"en":"It stimulates iron release from enterocytes independently of ferroportin","tr":"Ferroportinden bağımsız olarak enterositlerden demir salınımını uyarır"}],"answer":3,"explanation":{"en":"Hepcidin inhibits ferroportin, limiting iron export from enterocytes into blood. Iron retained in these cells may be lost when they are shed; increased hepcidin contributes to restricted iron availability during inflammation.","tr":"Hepcidin ferroportini baskılayarak enterositlerden kana demir çıkışını sınırlar. Hücrelerde tutulan demir, bu hücreler döküldüğünde kaybedilebilir; hepcidin artışı inflamasyon sırasında demirin kullanılabilirliğinin kısıtlanmasına katkıda bulunur."},"sourcePages":[356,358],"difficulty":"core"},{"id":"c74q4","stem":{"en":"Which pairing correctly distinguishes iron transport from iron storage?","tr":"Hangi eşleştirme demirin taşınması ile depolanmasını doğru ayırır?"},"options":[{"en":"Transferrin transports plasma iron; ferritin stores intracellular iron","tr":"Transferrin plazmada demiri taşır; ferritin hücre içinde demiri depolar"},{"en":"Ferritin transports plasma iron; transferrin stores intracellular iron","tr":"Ferritin plazmada demiri taşır; transferrin hücre içinde demiri depolar"},{"en":"Ferroportin carries iron through plasma; hepcidin stores iron inside cells","tr":"Ferroportin demiri plazmada taşır; hepcidin hücre içinde demir depolar"},{"en":"Transferrin transports plasma iron; hepcidin is the principal intracellular store","tr":"Transferrin plazmada demiri taşır; hepcidin başlıca hücre içi depodur"},{"en":"Ferritin transports plasma iron; ferroportin is the principal storage protein","tr":"Ferritin plazmada demiri taşır; ferroportin başlıca depo proteinidir"}],"answer":0,"explanation":{"en":"Transferrin carries circulating ferric iron to tissues such as bone marrow. Ferritin is an intracellular storage protein; recycling iron from senescent erythrocytes supplies much of the iron needed for erythropoiesis.","tr":"Transferrin dolaşımdaki ferrik demiri kemik iliği gibi dokulara taşır. Ferritin hücre içi depo proteinidir; yaşlanan eritrositlerden demirin geri kazanılması eritropoez için gereken demirin büyük bölümünü sağlar."},"sourcePages":[358],"difficulty":"core"},{"id":"c74q5","stem":{"en":"A sustained rise in erythrocyte mass during chronic hypoxaemia is most directly driven by which process?","tr":"Kronik hipoksemi sırasında eritrosit kütlesinin sürekli artışını en doğrudan hangi süreç tetikler?"},"options":[{"en":"Increased renal clearance of erythropoietin","tr":"Eritropoietinin renal klirensinin artması"},{"en":"Direct suppression of marrow erythroid progenitors","tr":"Kemik iliğinin eritroid öncüllerinin doğrudan baskılanması"},{"en":"Increased erythropoietin stimulation of bone marrow","tr":"Kemik iliğinin eritropoietinle daha fazla uyarılması"},{"en":"Plasma-volume contraction alone without new red-cell production","tr":"Yeni eritrosit üretimi olmadan yalnızca plazma hacmi daralması"},{"en":"Autonomous marrow proliferation independent of the hypoxic stimulus","tr":"Hipoksik uyarıdan bağımsız otonom kemik iliği çoğalması"}],"answer":2,"explanation":{"en":"Chronic hypoxaemia stimulates erythropoietin release, increasing erythropoiesis and producing secondary erythrocytosis. Primary polycythaemia instead reflects an intrinsic marrow disorder rather than an appropriate response to low oxygen availability.","tr":"Kronik hipoksemi eritropoietin salınımını uyarır; eritropoez artar ve sekonder eritrositoz gelişir. Primer polisitemi ise düşük oksijen sunumuna uygun bir yanıt yerine kemik iliğinin kendi bozukluğunu yansıtır."},"sourcePages":[356,358],"difficulty":"applied"}]},{"id":75,"title":{"en":"Immune System","tr":"Bağışıklık Sistemi"},"startPage":360,"section":7,"endPage":370,"questions":[{"id":"c75q1","stem":{"en":"Which feature most clearly distinguishes adaptive immunity from the initial innate response?","tr":"Adaptif bağışıklığı başlangıçtaki doğuştan bağışıklık yanıtından en belirgin biçimde ayıran özellik hangisidir?"},"options":[{"en":"An intact skin barrier","tr":"Sağlam deri bariyeri"},{"en":"Rapid nonspecific phagocytosis by neutrophils","tr":"Nötrofillerin hızlı ve özgül olmayan fagositozu"},{"en":"Antigen-specific memory that accelerates a later response","tr":"Sonraki yanıtı hızlandıran antijene özgü bellek"},{"en":"Low gastric pH","tr":"Düşük mide pH’sı"},{"en":"Mechanical mucociliary clearance","tr":"Mekanik mukosiliyer temizleme"}],"answer":2,"explanation":{"en":"Adaptive responses select antigen-specific lymphocytes and can generate memory cells. Re-exposure can therefore provoke a faster response, while skin, gastric acid, and initial phagocytic defences operate without that specific prior exposure.","tr":"Adaptif yanıtlar antijene özgü lenfositleri seçer ve bellek hücreleri oluşturabilir. Bu nedenle yeniden karşılaşma daha hızlı bir yanıt doğurabilir; deri, mide asidi ve başlangıçtaki fagositik savunma ise bu özgül önceki karşılaşmaya gerek duymadan çalışır."},"sourcePages":[360,365],"difficulty":"core"},{"id":"c75q2","stem":{"en":"What does opsonisation accomplish?","tr":"Opsonizasyon ne sağlar?"},"options":[{"en":"It lyses pathogens by assembling pores in their membranes","tr":"Patojenlerin zarlarında gözenekler oluşturarak onları parçalar"},{"en":"It draws leukocytes toward a chemical concentration gradient","tr":"Lökositleri kimyasal konsantrasyon gradyanı yönünde çeker"},{"en":"It causes lymphocytes with matching receptors to proliferate","tr":"Uyumlu reseptörleri olan lenfositlerin çoğalmasını sağlar"},{"en":"It deletes strongly self-reactive T cells during thymic maturation","tr":"Timik olgunlaşma sırasında öz antijenlere güçlü tepki veren T hücrelerini siler"},{"en":"It coats a target to facilitate recognition and ingestion by phagocytes","tr":"Hedefi kaplayarak fagositler tarafından tanınmasını ve yutulmasını kolaylaştırır"}],"answer":4,"explanation":{"en":"Antibody or complement coating provides binding sites recognised by phagocytes. Opsonisation improves uptake of a pathogen and is distinct from direct membrane lysis by the complement membrane attack complex.","tr":"Antikor veya komplemanla kaplanma, fagositlerin tanıdığı bağlanma bölgeleri sağlar. Opsonizasyon patojenin hücre içine alınmasını kolaylaştırır ve komplemanın membran atak kompleksiyle oluşturduğu doğrudan zar lizisinden farklıdır."},"sourcePages":[363],"difficulty":"core"},{"id":"c75q3","stem":{"en":"Which pairing is correct for recognition of antigen displayed on an infected nucleated host cell?","tr":"Enfekte, çekirdekli bir konak hücrede sunulan antijenin tanınması için hangi eşleştirme doğrudur?"},"options":[{"en":"CD8+ cytotoxic T cell and MHC class II","tr":"CD8+ sitotoksik T hücresi ve MHC sınıf II"},{"en":"CD8+ cytotoxic T cell and MHC class I","tr":"CD8+ sitotoksik T hücresi ve MHC sınıf I"},{"en":"CD4+ helper T cell and MHC class I","tr":"CD4+ yardımcı T hücresi ve MHC sınıf I"},{"en":"B-cell receptor and intracellular peptide presented on MHC class I","tr":"B hücresi reseptörü ve MHC sınıf I’de sunulan hücre içi peptid"},{"en":"Secreted IgE and MHC class II","tr":"Salgılanmış IgE ve MHC sınıf II"}],"answer":1,"explanation":{"en":"Nucleated host cells present intracellular peptide fragments on MHC class I, allowing CD8+ T-cell surveillance. CD4+ helper T cells instead recognise peptides presented on MHC class II by antigen-presenting cells.","tr":"Çekirdekli konak hücreler hücre içi peptid parçalarını MHC sınıf I üzerinde sunarak CD8+ T hücrelerinin denetimini sağlar. CD4+ yardımcı T hücreleri ise antijen sunan hücrelerin MHC sınıf II üzerinde sunduğu peptidleri tanır."},"sourcePages":[365,366,367],"difficulty":"core"},{"id":"c75q4","stem":{"en":"Administration of preformed antibodies provides which type of immunity?","tr":"Hazır antikorların verilmesi hangi bağışıklık türünü sağlar?"},"options":[{"en":"Active immunity","tr":"Aktif bağışıklık"},{"en":"Innate barrier immunity","tr":"Doğuştan bariyer bağışıklığı"},{"en":"Delayed cell-mediated hypersensitivity","tr":"Gecikmiş hücresel aşırı duyarlılık"},{"en":"Passive immunity","tr":"Pasif bağışıklık"},{"en":"Central immune tolerance","tr":"Merkezi immün tolerans"}],"answer":3,"explanation":{"en":"Passive immunity transfers antibodies that have already been produced elsewhere. It can provide immediate antibody activity but does not itself generate the recipient’s antigen-specific memory in the way active immunisation does.","tr":"Pasif bağışıklık, başka yerde önceden üretilmiş antikorların aktarılmasıdır. Hemen antikor etkinliği sağlayabilir ancak aktif bağışıklamada olduğu gibi alıcıda kendiliğinden antijene özgü bellek oluşturmaz."},"sourcePages":[365,366],"difficulty":"applied"},{"id":"c75q5","stem":{"en":"What is the defining mechanism of an IgE-mediated immediate hypersensitivity reaction?","tr":"IgE aracılı ani aşırı duyarlılık reaksiyonunun tanımlayıcı mekanizması nedir?"},"options":[{"en":"Allergen cross-linking of mast-cell-bound IgE triggers mediator release","tr":"Alerjenin mast hücresine bağlı IgE’leri çapraz bağlaması mediyatör salınımını tetikler"},{"en":"T-cell-mediated tissue injury developing over several days","tr":"Birkaç gün içinde gelişen T hücresi aracılı doku hasarı"},{"en":"Deposition of circulating antigen–IgG complexes","tr":"Dolaşımdaki antijen–IgG komplekslerinin birikmesi"},{"en":"Antibodies directed against antigens on host-cell surfaces","tr":"Konak hücre yüzeyindeki antijenlere yönelmiş antikorlar"},{"en":"Complement activation on microbial surfaces without prior antibody recognition","tr":"Önceden antikor tanıması olmadan mikrop yüzeylerinde kompleman aktivasyonu"}],"answer":0,"explanation":{"en":"In type I hypersensitivity, allergen recognition by IgE on mast cells causes rapid release of mediators such as histamine. Widespread mediator effects can include vasodilation, increased vascular permeability, and bronchospasm; delayed T-cell reactions are type IV.","tr":"Tip I aşırı duyarlılıkta mast hücrelerindeki IgE’nin alerjeni tanıması histamin gibi mediyatörlerin hızla salınmasına yol açar. Yaygın mediyatör etkileri vazodilatasyon, damar geçirgenliğinde artış ve bronkospazm içerebilir; gecikmiş T hücresi reaksiyonları tip IV’tür."},"sourcePages":[368,369],"difficulty":"applied"}]},{"id":76,"title":{"en":"Plasma Constituents","tr":"Plazma Bileşenleri"},"startPage":371,"section":7,"endPage":372,"questions":[{"id":"c76q1","stem":{"en":"Which blood component is the liquid phase containing electrolytes, proteins, and dissolved metabolites?","tr":"Kanın elektrolit, protein ve çözünmüş metabolitleri içeren sıvı fazı hangi bileşendir?"},"options":[{"en":"Plasma","tr":"Plazma"},{"en":"Erythrocyte cytoplasm only","tr":"Yalnızca eritrosit sitoplazması"},{"en":"The platelet pellet","tr":"Trombosit çökeltisi"},{"en":"The leukocyte nucleus","tr":"Lökosit çekirdeği"},{"en":"The fibrin mesh of a clot","tr":"Pıhtının fibrin ağı"}],"answer":0,"explanation":{"en":"Plasma is the extracellular liquid component of blood and is predominantly water with dissolved substances. Red cells, white cells, and platelets form the cellular or formed components rather than the plasma itself.","tr":"Plazma kanın hücre dışı sıvı bileşenidir ve büyük ölçüde su ile çözünmüş maddelerden oluşur. Eritrositler, lökositler ve trombositler plazmanın kendisini değil, hücresel veya şekilli bileşenleri oluşturur."},"sourcePages":[371],"difficulty":"core"},{"id":"c76q2","stem":{"en":"Which major plasma-protein group is produced by plasma cells rather than mainly by hepatocytes?","tr":"Hangi temel plazma protein grubu esas olarak hepatositler yerine plazma hücreleri tarafından üretilir?"},"options":[{"en":"Albumin","tr":"Albümin"},{"en":"Fibrinogen","tr":"Fibrinojen"},{"en":"Immunoglobulins","tr":"İmmünoglobulinler"},{"en":"Transferrin","tr":"Transferrin"},{"en":"Thyroxine-binding globulin","tr":"Tiroksin bağlayıcı globülin"}],"answer":2,"explanation":{"en":"Most major plasma proteins are synthesised in the liver, but immunoglobulins are produced by differentiated B cells called plasma cells. This distinction links antibody concentration to the adaptive immune system rather than simply to hepatic protein synthesis.","tr":"Başlıca plazma proteinlerinin çoğu karaciğerde sentezlenir; immünoglobulinleri ise plazma hücresi adı verilen farklılaşmış B hücreleri üretir. Bu ayrım antikor konsantrasyonunu yalnızca karaciğer protein sentezine değil, adaptif bağışıklık sistemine bağlar."},"sourcePages":[371],"difficulty":"core"},{"id":"c76q3","stem":{"en":"Which plasma protein makes the largest contribution to normal plasma colloid osmotic pressure?","tr":"Normal plazma kolloid ozmotik basıncına en büyük katkıyı hangi plazma proteini yapar?"},"options":[{"en":"Fibrinogen","tr":"Fibrinojen"},{"en":"Transferrin","tr":"Transferrin"},{"en":"Immunoglobulin G","tr":"İmmünoglobulin G"},{"en":"α1-acid glycoprotein","tr":"α1-asit glikoprotein"},{"en":"Albumin","tr":"Albümin"}],"answer":4,"explanation":{"en":"Albumin is abundant and contributes most of the plasma oncotic pressure that opposes fluid movement out of the circulation. Oedema nevertheless also depends on capillary permeability, hydrostatic pressure, and interstitial conditions, so albumin concentration alone is not sufficient.","tr":"Albümin bol miktarda bulunur ve dolaşım dışına sıvı hareketine karşı koyan plazma onkotik basıncının büyük bölümünü sağlar. Ancak ödem kapiller geçirgenlik, hidrostatik basınç ve interstisyel koşullara da bağlıdır; bu nedenle tek başına albümin konsantrasyonu yeterli değildir."},"sourcePages":[371],"difficulty":"core"},{"id":"c76q4","stem":{"en":"Which transport-protein and cargo pairing is correct?","tr":"Hangi taşıyıcı protein ve taşıdığı madde eşleştirmesi doğrudur?"},"options":[{"en":"Transferrin and thyroid hormone","tr":"Transferrin ve tiroit hormonu"},{"en":"Ceruloplasmin and copper","tr":"Serüloplazmin ve bakır"},{"en":"Thyroxine-binding globulin and iron","tr":"Tiroksin bağlayıcı globülin ve demir"},{"en":"Albumin and oxygen as its principal gas-transport role","tr":"Albümin ve başlıca gaz taşıma görevi olarak oksijen"},{"en":"α1-acid glycoprotein and copper as its principal cargo","tr":"α1-asit glikoprotein ve başlıca taşıdığı madde olarak bakır"}],"answer":1,"explanation":{"en":"Ceruloplasmin is a copper-containing plasma protein with a copper-transport role. Transferrin carries iron, while thyroxine-binding globulin binds thyroid hormones; these proteins have distinct cargo preferences.","tr":"Serüloplazmin, bakır taşıma görevi olan bakır içeren bir plazma proteinidir. Transferrin demiri taşırken tiroksin bağlayıcı globülin tiroit hormonlarını bağlar; bu proteinlerin bağladıkları maddeler farklıdır."},"sourcePages":[371],"difficulty":"core"},{"id":"c76q5","stem":{"en":"A drug is extensively bound to albumin. At the same total plasma drug concentration, what is the immediate expected effect of reduced available albumin-binding sites?","tr":"Bir ilaç albümine yüksek oranda bağlanmaktadır. Toplam plazma ilaç konsantrasyonu aynıyken kullanılabilir albümin bağlanma bölgelerinin azalmasının hemen beklenen etkisi nedir?"},"options":[{"en":"A decreased unbound fraction despite the same total concentration","tr":"Aynı toplam konsantrasyona rağmen serbest fraksiyonun azalması"},{"en":"An unchanged unbound fraction because binding capacity is irrelevant","tr":"Bağlanma kapasitesi önemsiz olduğu için serbest fraksiyonun değişmemesi"},{"en":"Increased binding of the drug to the remaining albumin as the only response","tr":"Tek yanıt olarak ilacın kalan albümine bağlanmasının artması"},{"en":"An increased unbound drug fraction","tr":"Bağlanmamış ilaç fraksiyonunun artması"},{"en":"A proportional increase in protein-bound drug concentration","tr":"Proteine bağlı ilaç konsantrasyonunda oransal artış"}],"answer":3,"explanation":{"en":"If fewer binding sites are available at a fixed total concentration, more drug may remain unbound. The later clinical effect also depends on distribution and clearance; a change in binding alone does not establish a lasting increase in drug effect.","tr":"Sabit toplam konsantrasyonda daha az bağlanma bölgesi varsa ilacın daha büyük kısmı serbest kalabilir. Sonraki klinik etki dağılım ve klirense de bağlıdır; yalnızca bağlanmanın değişmesi ilaç etkisinin kalıcı olarak artacağını göstermez."},"sourcePages":[371,372],"difficulty":"applied"}]},{"id":77,"title":{"en":"Metabolism","tr":"Metabolizma"},"startPage":373,"section":8,"endPage":383,"questions":[{"id":"c77q1","stem":{"en":"Which description of glycolysis from one glucose molecule is correct?","tr":"Bir glukoz molekülünden başlayan glikolizi hangi seçenek doğru tanımlar?"},"options":[{"en":"It occurs in the mitochondrial matrix and yields a net two ATP","tr":"Mitokondri matriksinde gerçekleşir ve net iki ATP sağlar"},{"en":"It occurs in the cytosol and yields a net four ATP","tr":"Sitozolde gerçekleşir ve net dört ATP sağlar"},{"en":"It occurs on the inner mitochondrial membrane and consumes oxygen directly","tr":"İç mitokondri zarında gerçekleşir ve doğrudan oksijen tüketir"},{"en":"It occurs in the cytosol and yields a net two ATP","tr":"Sitozolde gerçekleşir ve net iki ATP sağlar"},{"en":"It occurs in the cytosol and releases two carbon dioxide molecules","tr":"Sitozolde gerçekleşir ve iki karbondioksit molekülü açığa çıkarır"}],"answer":3,"explanation":{"en":"Glycolysis converts glucose into two pyruvate molecules in the cytosol. Four ATP are generated but two are invested, giving a net yield of two; the pathway itself does not consume oxygen or release CO2.","tr":"Glikoliz, sitozolde glukozu iki pirüvat molekülüne dönüştürür. Dört ATP üretilir ancak iki ATP harcanır; net kazanç ikidir. Yolağın kendisi oksijen tüketmez veya CO2 açığa çıkarmaz."},"sourcePages":[373,374],"difficulty":"core"},{"id":"c77q2","stem":{"en":"Why does conversion of pyruvate to lactate help glycolysis continue when oxidative metabolism is limited?","tr":"Oksidatif metabolizma sınırlıyken pirüvatın laktata dönüşmesi glikolizin sürmesine neden yardımcı olur?"},"options":[{"en":"It regenerates NAD+ from NADH","tr":"NADH’den NAD+’ı yeniden oluşturur"},{"en":"It directly produces ATP in the lactate dehydrogenase reaction","tr":"Laktat dehidrogenaz reaksiyonunda doğrudan ATP üretir"},{"en":"It regenerates FAD for the glycolytic pathway","tr":"Glikolitik yol için FAD’ı yeniden oluşturur"},{"en":"It transfers cytosolic NADH into the mitochondrial matrix without a shuttle","tr":"Sitozolik NADH’ı mekik olmadan mitokondri matriksine aktarır"},{"en":"It replaces the ATP investment required to phosphorylate glucose","tr":"Glukozu fosforillemek için gereken ATP yatırımının yerini alır"}],"answer":0,"explanation":{"en":"Glycolysis requires oxidised NAD+ as an electron acceptor. Lactate dehydrogenase reoxidises NADH while reducing pyruvate to lactate, maintaining NAD+ availability for continued glycolytic ATP production.","tr":"Glikoliz, elektron alıcısı olarak oksitlenmiş NAD+ gerektirir. Laktat dehidrogenaz pirüvatı laktata indirgerken NADH’ı yeniden oksitleyerek glikolitik ATP üretiminin sürmesi için NAD+ bulunmasını sağlar."},"sourcePages":[374],"difficulty":"core"},{"id":"c77q3","stem":{"en":"Cyanide impairs oxygen utilisation primarily by inhibiting which mitochondrial component?","tr":"Siyanür başlıca hangi mitokondriyal bileşeni inhibe ederek oksijen kullanımını bozar?"},"options":[{"en":"Complex II, succinate dehydrogenase","tr":"Kompleks II, süksinat dehidrogenaz"},{"en":"Complex V, ATP synthase","tr":"Kompleks V, ATP sentaz"},{"en":"Complex IV, cytochrome c oxidase","tr":"Kompleks IV, sitokrom c oksidaz"},{"en":"The carnitine shuttle","tr":"Karnitin mekiği"},{"en":"Pyruvate carboxylase","tr":"Pirüvat karboksilaz"}],"answer":2,"explanation":{"en":"Complex IV transfers electrons to oxygen, the terminal electron acceptor, to form water. Blocking this step interrupts electron transport and oxidative ATP generation even when oxygen is delivered to the tissue.","tr":"Kompleks IV, elektronları son elektron alıcısı olan oksijene aktararak su oluşturur. Bu basamağın engellenmesi, dokuya oksijen sunulsa bile elektron taşınmasını ve oksidatif ATP üretimini kesintiye uğratır."},"sourcePages":[376],"difficulty":"applied"},{"id":"c77q4","stem":{"en":"What happens when mitochondrial proton flow is uncoupled from ATP synthesis in brown adipose tissue?","tr":"Kahverengi yağ dokusunda mitokondriyal proton akışı ATP sentezinden ayrıldığında ne olur?"},"options":[{"en":"More ATP is produced per unit of oxygen consumed","tr":"Tüketilen oksijen başına daha fazla ATP üretilir"},{"en":"Protons are forced to return exclusively through ATP synthase","tr":"Protonlar yalnızca ATP sentazdan geri dönmeye zorlanır"},{"en":"The proton gradient is conserved more efficiently for phosphorylation","tr":"Proton gradyanı fosforilasyon için daha verimli korunur"},{"en":"Electron transport becomes independent of an electron acceptor","tr":"Elektron taşınması elektron alıcısından bağımsız hale gelir"},{"en":"More of the gradient’s energy is released as heat","tr":"Gradyanın enerjisinin daha büyük bölümü ısı olarak açığa çıkar"}],"answer":4,"explanation":{"en":"Uncoupling permits protons to return across the inner mitochondrial membrane without driving ATP synthase. Energy is dissipated as heat rather than conserved as ATP, supporting non-shivering thermogenesis.","tr":"Ayrışma, protonların ATP sentazı çalıştırmadan
