 da sıkıştırarak akım kısıtlanmasına neden olur"},{"en":"Increasing effort lowers alveolar pressure below atmospheric pressure","tr":"Çabanın artırılması alveoler basıncı atmosfer basıncının altına düşürür"},{"en":"Gas viscosity rises in direct proportion to expiratory muscle force","tr":"Gaz viskozitesi ekspiratuvar kas kuvvetiyle doğru orantılı artar"},{"en":"Lung elastic recoil increases progressively as volume approaches residual volume","tr":"Hacim rezidüel hacme yaklaştıkça akciğer elastik geri çekimi giderek artar"},{"en":"Expiratory flow limitation is caused solely by complete vocal-cord closure","tr":"Ekspiratuvar akım kısıtlılığı yalnızca vokal kordların tamamen kapanmasından kaynaklanır"}],"answer":0,"explanation":{"en":"Dynamic airway compression limits flow as lung volume falls during forced expiration. Additional effort raises both the driving pressure and the external compressive pressure, leaving the later part of the flow–volume curve relatively effort independent.","tr":"Zorlu ekspirasyonda akciğer hacmi azalırken dinamik hava yolu kompresyonu akımı sınırlar. Ek çaba hem itici basıncı hem dıştan sıkıştırıcı basıncı artırdığı için akım–hacim eğrisinin geç bölümü görece efordan bağımsız kalır."},"sourcePages":[58,59,60],"difficulty":"core"}]},{"id":14,"title":{"en":"Hypoxia and Shunts","tr":"Hipoksi ve Şantlar"},"startPage":63,"section":2,"endPage":67,"questions":[{"id":"c14q1","stem":{"en":"A markedly anaemic person can have a normal PaO₂. Which statement explains why tissue oxygen delivery may nevertheless be reduced?","tr":"Belirgin anemisi olan bir kişide PaO₂ normal olabilir. Buna rağmen doku oksijen sunumunun azalabilmesini hangi ifade açıklar?"},"options":[{"en":"PaO₂ reflects dissolved oxygen tension rather than the total haemoglobin-bound oxygen content","tr":"PaO₂ toplam hemoglobine bağlı oksijen içeriğini değil, çözünmüş oksijen basıncını yansıtır"},{"en":"PaO₂ is a direct measurement of haemoglobin concentration","tr":"PaO₂ hemoglobin konsantrasyonunun doğrudan ölçümüdür"},{"en":"A normal PaO₂ guarantees normal arterial oxygen content","tr":"Normal PaO₂ normal arteriyel oksijen içeriğini garanti eder"},{"en":"Dissolved oxygen normally carries most of the total blood oxygen","tr":"Çözünmüş oksijen normalde toplam kan oksijeninin çoğunu taşır"},{"en":"Oxygen delivery depends on saturation but is independent of haemoglobin concentration","tr":"Oksijen sunumu satürasyona bağlıdır ancak hemoglobin konsantrasyonundan bağımsızdır"}],"answer":0,"explanation":{"en":"Anaemic hypoxia results from reduced oxygen-carrying capacity even when arterial oxygen tension is normal. Arterial tension, haemoglobin concentration and blood flow describe different components of oxygen delivery.","tr":"Anemik hipoksi, arteriyel oksijen basıncı normal olsa bile azalmış oksijen taşıma kapasitesinden kaynaklanır. Arteriyel basınç, hemoglobin konsantrasyonu ve kan akımı oksijen sunumunun farklı bileşenlerini tanımlar."},"sourcePages":[63],"difficulty":"applied"},{"id":"c14q2","stem":{"en":"Failure of mitochondrial oxygen utilisation despite adequate arterial oxygen content and flow is classified as what type of hypoxia?","tr":"Arteriyel oksijen içeriği ve akım yeterliyken mitokondriyal oksijen kullanımının bozulması hangi hipoksi tipidir?"},"options":[{"en":"Anaemic hypoxia","tr":"Anemik hipoksi"},{"en":"Stagnant hypoxia","tr":"Stagnan hipoksi"},{"en":"Isolated hypoxaemic hypoxia","tr":"İzole hipoksemik hipoksi"},{"en":"Cytotoxic or histotoxic hypoxia","tr":"Sitotoksik veya histotoksik hipoksi"},{"en":"Anatomical dead space","tr":"Anatomik ölü boşluk"}],"answer":3,"explanation":{"en":"In cytotoxic hypoxia, oxygen reaches the tissue but cellular use is impaired, as with inhibition of mitochondrial respiration by cyanide. Stagnant hypoxia instead reflects insufficient blood flow to otherwise oxygen-utilising tissue.","tr":"Sitotoksik hipokside oksijen dokuya ulaşır ancak hücresel kullanımı bozulur; siyanürün mitokondriyal solunumu inhibe etmesi buna örnektir. Stagnan hipoksi ise oksijen kullanabilen dokuya kan akımının yetersizliğini ifade eder."},"sourcePages":[63],"difficulty":"core"},{"id":"c14q3","stem":{"en":"A lung region receives blood flow but no ventilation because its airway is completely occluded. What does this region represent?","tr":"Hava yolu tamamen tıkalı olduğu için ventilasyon almayan bir akciğer bölgesinde kan akımı sürmektedir. Bu bölge neyi temsil eder?"},"options":[{"en":"Pure alveolar dead space","tr":"Saf alveoler ölü boşluk"},{"en":"A region with infinitely high V̇/Q̇","tr":"V̇/Q̇ oranı sonsuz yüksek bir bölge"},{"en":"An intrapulmonary right-to-left shunt","tr":"İntrapulmoner sağdan sola şant"},{"en":"An isolated reduction in anatomical dead space","tr":"Anatomik ölü boşlukta izole azalma"},{"en":"Normal matched ventilation and perfusion","tr":"Normal eşleşmiş ventilasyon ve perfüzyon"}],"answer":2,"explanation":{"en":"Perfused but unventilated alveoli have a V̇/Q̇ ratio of zero and contribute shunted blood. Alveolar dead space is the opposite extreme: ventilation without effective perfusion.","tr":"Perfüze edilen ancak ventile edilmeyen alveollerde V̇/Q̇ oranı sıfırdır ve buradan geçen kan şanta katkı sağlar. Alveoler ölü boşluk bunun zıt ucudur: etkin perfüzyon olmadan ventilasyon vardır."},"sourcePages":[64,65],"difficulty":"applied"},{"id":"c14q4","stem":{"en":"Why does hypoxaemia caused by a large true right-to-left shunt improve relatively little when inspired oxygen is increased?","tr":"Büyük bir gerçek sağdan sola şantın neden olduğu hipoksemi, inspire edilen oksijen artırıldığında neden görece az düzelir?"},"options":[{"en":"Supplemental oxygen reduces oxygen solubility in the ventilated capillary blood","tr":"Ek oksijen ventile kapiller kandaki oksijen çözünürlüğünü azaltır"},{"en":"The blood from ventilated units is normally unsaturated and cannot bind oxygen","tr":"Ventile birimlerden gelen kan normalde desatüredir ve oksijen bağlayamaz"},{"en":"Increasing inspired oxygen primarily lowers alveolar oxygen tension","tr":"İnspire edilen oksijenin artırılması başlıca alveoler oksijen basıncını düşürür"},{"en":"The shunt reduces ventilation of every alveolus by exactly the same amount","tr":"Şant her alveolün ventilasyonunu tam olarak aynı miktarda azaltır"},{"en":"Shunted blood does not contact the ventilated alveoli containing the added oxygen","tr":"Şanttan geçen kan ek oksijeni içeren ventile alveollerle temas etmez"}],"answer":4,"explanation":{"en":"Increasing alveolar oxygen cannot directly oxygenate blood that bypasses gas exchange. The well-ventilated units can add only limited extra oxygen, especially once their haemoglobin is nearly fully saturated.","tr":"Alveoler oksijenin artırılması gaz değişimini atlayan kanı doğrudan oksijenlendiremez. İyi ventile birimler, özellikle hemoglobinleri neredeyse tamamen satüre olduğunda, yalnızca sınırlı miktarda ek oksijen sağlayabilir."},"sourcePages":[65,67],"difficulty":"applied"},{"id":"c14q5","stem":{"en":"End-capillary, arterial and mixed venous oxygen contents are 20, 18 and 15 mL/dL, respectively. What is the calculated shunt fraction?","tr":"Uç kapiller, arteriyel ve mikst venöz oksijen içerikleri sırasıyla 20, 18 ve 15 mL/dL’dir. Hesaplanan şant fraksiyonu nedir?"},"options":[{"en":"10%","tr":"%10"},{"en":"40%","tr":"%40"},{"en":"20%","tr":"%20"},{"en":"60%","tr":"%60"},{"en":"90%","tr":"%90"}],"answer":1,"explanation":{"en":"Shunt fraction equals (CcO₂ − CaO₂)/(CcO₂ − CvO₂). Substitution gives (20 − 18)/(20 − 15) = 2/5 = 0.40; the calculation uses oxygen contents, not oxygen partial pressures.","tr":"Şant fraksiyonu (CcO₂ − CaO₂)/(CcO₂ − CvO₂) biçiminde hesaplanır. Değerler yerleştirildiğinde (20 − 18)/(20 − 15) = 2/5 = 0,40 bulunur; hesaplamada oksijen parsiyel basınçları değil oksijen içerikleri kullanılır."},"sourcePages":[65,66,67],"difficulty":"applied"}]},{"id":15,"title":{"en":"Ventilation–Perfusion Relationships","tr":"Ventilasyon–Perfüzyon İlişkileri"},"startPage":68,"section":2,"endPage":70,"questions":[{"id":"c15q1","stem":{"en":"If total alveolar ventilation is 4 L/min and pulmonary blood flow is 5 L/min, what is the whole-lung V̇/Q̇ ratio?","tr":"Toplam alveoler ventilasyon 4 L/dk ve pulmoner kan akımı 5 L/dk ise tüm akciğerin V̇/Q̇ oranı nedir?"},"options":[{"en":"0.2","tr":"0,2"},{"en":"0.8","tr":"0,8"},{"en":"1.0","tr":"1,0"},{"en":"1.25","tr":"1,25"},{"en":"5.0","tr":"5,0"}],"answer":1,"explanation":{"en":"The ratio is alveolar ventilation divided by perfusion: 4/5 = 0.8. A whole-lung average does not imply that every lung region has the same local ratio.","tr":"Oran, alveoler ventilasyonun perfüzyona bölünmesiyle bulunur: 4/5 = 0,8. Tüm akciğer ortalaması, her bölgenin aynı yerel orana sahip olduğu anlamına gelmez."},"sourcePages":[68],"difficulty":"applied"},{"id":"c15q2","stem":{"en":"In a healthy upright lung at rest, why is V̇/Q̇ generally higher at the apex than at the base?","tr":"Dinlenimdeki sağlıklı dik akciğerde V̇/Q̇ oranı neden genellikle apekste tabandan daha yüksektir?"},"options":[{"en":"Ventilation increases towards the apex more than perfusion does","tr":"Apekse doğru ventilasyon perfüzyondan daha fazla artar"},{"en":"Perfusion is uniform while basal ventilation is lower","tr":"Perfüzyon eşitken bazal ventilasyon daha düşüktür"},{"en":"Perfusion rises towards the base less than ventilation does","tr":"Tabana doğru perfüzyon ventilasyondan daha az artar"},{"en":"Apical alveoli receive the greatest absolute flow and ventilation","tr":"Apikal alveoller en yüksek mutlak akımı ve ventilasyonu alır"},{"en":"Perfusion decreases towards the apex more steeply than ventilation does","tr":"Apekse doğru perfüzyon ventilasyondan daha fazla azalır"}],"answer":4,"explanation":{"en":"Both ventilation and perfusion are greater in dependent basal regions during normal upright breathing. The gravitational gradient in perfusion is steeper, so ventilation is relatively excessive at the apex.","tr":"Normal dik solunumda hem ventilasyon hem perfüzyon bağımlı bazal bölgelerde daha fazladır. Perfüzyondaki yerçekimi gradyanı daha dik olduğundan apekste ventilasyon göreli olarak fazladır."},"sourcePages":[68,69],"difficulty":"core"},{"id":"c15q3","stem":{"en":"A ventilated alveolar unit loses all blood flow. Towards which value does its V̇/Q̇ ratio move?","tr":"Ventile edilen bir alveoler birim tüm kan akımını kaybeder. V̇/Q̇ oranı hangi değere yönelir?"},"options":[{"en":"Zero","tr":"Sıfır"},{"en":"Exactly 0.8","tr":"Tam olarak 0,8"},{"en":"Exactly 1","tr":"Tam olarak 1"},{"en":"Infinity","tr":"Sonsuz"},{"en":"A negative value","tr":"Negatif bir değer"}],"answer":3,"explanation":{"en":"As perfusion approaches zero while ventilation continues, V̇/Q̇ becomes extremely high and the unit behaves as alveolar dead space. A ratio of zero instead describes perfusion without ventilation.","tr":"Ventilasyon sürerken perfüzyon sıfıra yaklaştığında V̇/Q̇ çok yükselir ve birim alveoler ölü boşluk gibi davranır. Sıfır oranı ise ventilasyon olmadan perfüzyonu tanımlar."},"sourcePages":[69,70],"difficulty":"applied"},{"id":"c15q4","stem":{"en":"How does local hypoxic pulmonary vasoconstriction improve gas-exchange matching?","tr":"Yerel hipoksik pulmoner vazokonstriksiyon gaz değişimi eşleşmesini nasıl iyileştirir?"},"options":[{"en":"It diverts blood away from poorly ventilated alveolar regions","tr":"Kanı yetersiz ventile alveoler bölgelerden uzaklaştırır"},{"en":"It preferentially increases perfusion of hypoventilated alveoli","tr":"Hipoventile alveollerin perfüzyonunu öncelikle artırır"},{"en":"It lowers resistance in vessels supplying hypoxic alveoli","tr":"Hipoksik alveolleri besleyen damarlardaki direnci azaltır"},{"en":"It increases ventilation by directly dilating adjacent bronchioles","tr":"Komşu bronşiyolleri doğrudan genişleterek ventilasyonu artırır"},{"en":"It raises local perfusion until the low alveolar PO₂ returns to normal","tr":"Düşük alveoler PO₂ normale dönene kadar yerel perfüzyonu artırır"}],"answer":0,"explanation":{"en":"Low local alveolar oxygen causes constriction of supplying pulmonary arterioles, reducing flow to that region. Blood is redirected towards better-ventilated regions, improving regional matching when this response is appropriately localised.","tr":"Yerel alveoler oksijen düşüklüğü bölgeyi besleyen pulmoner arteriyolleri daraltarak bölgesel akımı azaltır. Kan daha iyi ventile bölgelere yönelir; yanıt uygun biçimde yerel kaldığında bölgesel eşleşme iyileşir."},"sourcePages":[70],"difficulty":"core"},{"id":"c15q5","stem":{"en":"Compared with the lung base, gas in a high-V̇/Q̇ apical alveolus generally has which pattern?","tr":"Akciğer tabanına göre yüksek V̇/Q̇ oranlı apikal alveol gazında genellikle hangi örüntü bulunur?"},"options":[{"en":"Lower PO₂ and higher PCO₂","tr":"Daha düşük PO₂ ve daha yüksek PCO₂"},{"en":"Higher PO₂ and higher PCO₂","tr":"Daha yüksek PO₂ ve daha yüksek PCO₂"},{"en":"Higher PO₂ and lower PCO₂","tr":"Daha yüksek PO₂ ve daha düşük PCO₂"},{"en":"Lower PO₂ and lower PCO₂","tr":"Daha düşük PO₂ ve daha düşük PCO₂"},{"en":"The same PO₂ and PCO₂ despite the different local ratios","tr":"Farklı yerel oranlara rağmen aynı PO₂ ve PCO₂"}],"answer":2,"explanation":{"en":"High ventilation relative to blood flow removes CO₂ efficiently and replenishes oxygen faster relative to its uptake. Alveolar gas therefore tends towards inspired gas, giving higher PO₂ and lower PCO₂ than in low-V̇/Q̇ units.","tr":"Kan akımına göre yüksek ventilasyon CO₂’yi etkin biçimde uzaklaştırır ve alınan oksijene göre daha hızlı oksijen yenilenmesi sağlar. Alveol gazı bu nedenle inspirasyon gazına yaklaşır; düşük V̇/Q̇ birimlerine göre PO₂ daha yüksek, PCO₂ daha düşüktür."},"sourcePages":[69],"difficulty":"applied"}]},{"id":16,"title":{"en":"Ventilation–Perfusion Zones in the Lung","tr":"Akciğerde Ventilasyon–Perfüzyon Zonları"},"startPage":71,"section":2,"endPage":73,"questions":[{"id":"c16q1","stem":{"en":"Using Pa for pulmonary arterial, Pv for pulmonary venous and PA for alveolar pressure, which ordering defines West zone 3?","tr":"Pa pulmoner arteriyel, Pv pulmoner venöz ve PA alveoler basıncı gösteriyorsa West zon 3’ü hangi sıralama tanımlar?"},"options":[{"en":"PA \u003e Pa \u003e Pv","tr":"PA \u003e Pa \u003e Pv"},{"en":"Pa \u003e PA \u003e Pv","tr":"Pa \u003e PA \u003e Pv"},{"en":"Pa \u003e Pv \u003e PA","tr":"Pa \u003e Pv \u003e PA"},{"en":"Pv \u003e PA \u003e Pa","tr":"Pv \u003e PA \u003e Pa"},{"en":"PA \u003e Pv \u003e Pa","tr":"PA \u003e Pv \u003e Pa"}],"answer":2,"explanation":{"en":"In zone 3, both vascular pressures exceed alveolar pressure, keeping alveolar vessels open. Flow is principally determined by the arterial–venous pressure difference.","tr":"Zon 3’te her iki damar basıncı alveoler basınçtan yüksek olduğundan alveoler damarlar açık kalır. Akım başlıca arteriyel–venöz basınç farkıyla belirlenir."},"sourcePages":[71,72],"difficulty":"core"},{"id":"c16q2","stem":{"en":"In West zone 2, Pa \u003e PA \u003e Pv. Which pressure difference primarily determines flow in the classic model?","tr":"West zon 2’de Pa \u003e PA \u003e Pv’dir. Klasik modelde akımı başlıca hangi basınç farkı belirler?"},"options":[{"en":"Pulmonary arterial minus alveolar pressure","tr":"Pulmoner arteriyel basınç eksi alveoler basınç"},{"en":"Pulmonary arterial minus venous pressure","tr":"Pulmoner arteriyel basınç eksi venöz basınç"},{"en":"Alveolar minus pleural pressure","tr":"Alveoler basınç eksi plevral basınç"},{"en":"Pulmonary venous minus pleural pressure","tr":"Pulmoner venöz basınç eksi plevral basınç"},{"en":"Atmospheric minus alveolar pressure","tr":"Atmosfer basıncı eksi alveoler basınç"}],"answer":0,"explanation":{"en":"Alveolar pressure exceeds venous pressure and acts as the effective downstream pressure. This produces the vascular-waterfall behaviour of zone 2 rather than the arterial–venous dependence of zone 3.","tr":"Alveoler basınç venöz basıncı aşar ve etkin aşağı akım basıncı gibi davranır. Böylece zon 3’teki arteriyel–venöz farka bağımlılık yerine zon 2’nin vasküler şelale davranışı ortaya çıkar."},"sourcePages":[71,72],"difficulty":"core"},{"id":"c16q3","stem":{"en":"A region has alveolar pressure greater than pulmonary arterial and venous pressures. Which effect is expected?","tr":"Bir bölgede alveoler basınç pulmoner arteriyel ve venöz basınçlardan yüksektir. Hangi etki beklenir?"},"options":[{"en":"Continuous flow determined only by the arterial–venous difference","tr":"Yalnızca arteriyel–venöz farkla belirlenen sürekli akım"},{"en":"A perfused but entirely unventilated shunt unit","tr":"Perfüze edilen ancak tamamen ventile edilmeyen şant birimi"},{"en":"Increased capillary flow from passive distension","tr":"Pasif genişlemeye bağlı artmış kapiller akım"},{"en":"A lower V̇/Q̇ ratio because perfusion is enhanced","tr":"Perfüzyon arttığı için daha düşük V̇/Q̇ oranı"},{"en":"Capillary compression with ventilation becoming dead space","tr":"Kapiller kompresyon ve ventilasyonun ölü boşluğa dönüşmesi"}],"answer":4,"explanation":{"en":"This is the pressure ordering of West zone 1, where alveolar pressure can compress vessels and interrupt perfusion. Ventilation that continues in these units is wasted for gas exchange.","tr":"Bu, alveoler basıncın damarları sıkıştırarak perfüzyonu kesebildiği West zon 1’in basınç sıralamasıdır. Bu birimlerde süren ventilasyon gaz değişimine katkı sağlamaz."},"sourcePages":[71,72],"difficulty":"applied"},{"id":"c16q4","stem":{"en":"Which change most favours formation of West zone 1 conditions?","tr":"Hangi değişiklik West zon 1 koşullarının oluşmasını en çok kolaylaştırır?"},"options":[{"en":"Lower alveolar pressure combined with higher pulmonary arterial pressure","tr":"Daha düşük alveoler basınçla birlikte daha yüksek pulmoner arteriyel basınç"},{"en":"Higher alveolar pressure combined with lower pulmonary arterial pressure","tr":"Daha yüksek alveoler basınçla birlikte daha düşük pulmoner arteriyel basınç"},{"en":"Equal increases in pulmonary arterial and venous pressures with unchanged alveolar pressure","tr":"Alveoler basınç değişmeden pulmoner arteriyel ve venöz basınçlarda eşit artış"},{"en":"Increased right ventricular output with unchanged alveolar pressure","tr":"Alveoler basınç değişmeden sağ ventrikül debisinin artması"},{"en":"A rise in venous pressure above alveolar pressure while arterial pressure remains higher","tr":"Arteriyel basınç daha yüksek kalırken venöz basıncın alveoler basıncı aşması"}],"answer":1,"explanation":{"en":"Zone 1 arises when alveolar pressure exceeds the vascular pressures supplying the region. Positive-pressure inflation and low pulmonary arterial pressure can act together to produce this relation.","tr":"Zon 1, alveoler basınç bölgeyi besleyen damar basınçlarını aştığında oluşur. Pozitif basınçlı şişirme ve düşük pulmoner arteriyel basınç bu ilişkiyi birlikte oluşturabilir."},"sourcePages":[72],"difficulty":"applied"},{"id":"c16q5","stem":{"en":"Why is a zone 3 position important when interpreting a pulmonary artery occlusion pressure as an estimate of left atrial pressure?","tr":"Pulmoner arter oklüzyon basıncını sol atriyum basıncının tahmini olarak yorumlarken zon 3 konumu neden önemlidir?"},"options":[{"en":"The measured pressure is set primarily by alveolar pressure in zone 3","tr":"Zon 3’te ölçülen basıncı başlıca alveoler basınç belirler"},{"en":"Zone 3 flow depends only on the arterial–alveolar pressure difference","tr":"Zon 3 akımı yalnızca arteriyel–alveoler basınç farkına bağlıdır"},{"en":"Venous pressure lies below alveolar pressure throughout zone 3","tr":"Zon 3’ün tamamında venöz basınç alveoler basınçtan düşüktür"},{"en":"An uninterrupted fluid column can communicate pressure from the pulmonary veins and left atrium","tr":"Kesintisiz sıvı sütunu pulmoner venler ve sol atriyumdan basıncı iletebilir"},{"en":"Wedge pressure in zone 3 primarily reflects right ventricular systolic pressure","tr":"Zon 3 kama basıncı başlıca sağ ventrikül sistolik basıncını yansıtır"}],"answer":3,"explanation":{"en":"In zone 3, venous pressure exceeds alveolar pressure and vessels remain patent downstream of the occlusion. In other zones, alveolar pressure can interrupt the vascular column and distort the relation to left atrial pressure.","tr":"Zon 3’te venöz basınç alveoler basınçtan yüksektir ve oklüzyonun distalindeki damarlar açık kalır. Diğer zonlarda alveoler basınç damar içindeki sütunu kesintiye uğratarak sol atriyum basıncıyla ilişkiyi bozabilir."},"sourcePages":[72,73],"difficulty":"applied"}]},{"id":17,"title":{"en":"Oxygen Delivery and Demand","tr":"Oksijen Sunumu ve Gereksinimi"},"startPage":74,"section":2,"endPage":76,"questions":[{"id":"c17q1","stem":{"en":"Cardiac output is 4 L/min and arterial oxygen content is 20 mL/dL. What is global oxygen delivery?","tr":"Kalp debisi 4 L/dk ve arteriyel oksijen içeriği 20 mL/dL’dir. Global oksijen sunumu nedir?"},"options":[{"en":"80 mL/min","tr":"80 mL/dk"},{"en":"200 mL/min","tr":"200 mL/dk"},{"en":"400 mL/min","tr":"400 mL/dk"},{"en":"800 mL/min","tr":"800 mL/dk"},{"en":"2000 mL/min","tr":"2000 mL/dk"}],"answer":3,"explanation":{"en":"Oxygen delivery equals cardiac output × arterial oxygen content, with a factor of 10 when flow is in L/min and content in mL/dL. Thus 4 × 20 × 10 = 800 mL/min.","tr":"Oksijen sunumu kalp debisi × arteriyel oksijen içeriğidir; akım L/dk, içerik mL/dL olduğunda 10 katsayısı kullanılır. Böylece 4 × 20 × 10 = 800 mL/dk bulunur."},"sourcePages":[74],"difficulty":"applied"},{"id":"c17q2","stem":{"en":"Cardiac output is 5 L/min; arterial and mixed venous oxygen contents are 20 and 15 mL/dL. What is oxygen consumption by the reverse Fick calculation?","tr":"Kalp debisi 5 L/dk; arteriyel ve mikst venöz oksijen içerikleri 20 ve 15 mL/dL’dir. Ters Fick hesabına göre oksijen tüketimi nedir?"},"options":[{"en":"25 mL/min","tr":"25 mL/dk"},{"en":"250 mL/min","tr":"250 mL/dk"},{"en":"100 mL/min","tr":"100 mL/dk"},{"en":"750 mL/min","tr":"750 mL/dk"},{"en":"1000 mL/min","tr":"1000 mL/dk"}],"answer":1,"explanation":{"en":"Consumption is flow multiplied by the arterial–mixed venous oxygen-content difference. Here, 5 × (20 − 15) × 10 = 250 mL/min; multiplying by arterial content alone would calculate delivery.","tr":"Tüketim, akımın arteriyel–mikst venöz oksijen içerik farkıyla çarpılmasıdır. Burada 5 × (20 − 15) × 10 = 250 mL/dk’dır; yalnızca arteriyel içerikle çarpım sunumu hesaplar."},"sourcePages":[74],"difficulty":"applied"},{"id":"c17q3","stem":{"en":"Oxygen consumption is 240 mL/min and oxygen delivery is 960 mL/min. What is the oxygen extraction ratio?","tr":"Oksijen tüketimi 240 mL/dk ve oksijen sunumu 960 mL/dk’dır. Oksijen ekstraksiyon oranı nedir?"},"options":[{"en":"25%","tr":"%25"},{"en":"4%","tr":"%4"},{"en":"20%","tr":"%20"},{"en":"40%","tr":"%40"},{"en":"75%","tr":"%75"}],"answer":0,"explanation":{"en":"Extraction ratio is oxygen consumption divided by oxygen delivery. The value is 240/960 = 0.25, indicating that one-quarter of the delivered oxygen is extracted globally.","tr":"Ekstraksiyon oranı oksijen tüketiminin oksijen sunumuna bölünmesidir. 240/960 = 0,25 değeri, sunulan oksijenin global olarak dörtte birinin alındığını gösterir."},"sourcePages":[75],"difficulty":"applied"},{"id":"c17q4","stem":{"en":"Before critical oxygen delivery is reached, how can tissues maintain consumption when oxygen delivery falls?","tr":"Kritik oksijen sunumu düzeyine ulaşılmadan önce sunum azaldığında dokular tüketimi nasıl sürdürebilir?"},"options":[{"en":"By increasing mixed venous oxygen content while flow stays fixed","tr":"Akım sabitken mikst venöz oksijen içeriğini artırarak"},{"en":"By reducing extraction in direct proportion to delivery","tr":"Ekstraksiyonu sunumla doğru orantılı azaltarak"},{"en":"By increasing the fraction of delivered oxygen extracted","tr":"Sunulan oksijenin daha büyük bir bölümünü alarak"},{"en":"By requiring consumption to fall immediately with any fall in delivery","tr":"Sunumdaki her düşüşte tüketimin hemen düşmesini sağlayarak"},{"en":"By using arterial oxygen tension as a substitute for blood flow","tr":"Kan akımı yerine arteriyel oksijen basıncını kullanarak"}],"answer":2,"explanation":{"en":"Within reserve limits, an increased extraction ratio can maintain aerobic oxygen consumption despite lower delivery. Mixed venous oxygen content then falls; below a critical delivery, extraction cannot compensate and consumption becomes supply dependent.","tr":"Rezerv sınırları içinde artan ekstraksiyon oranı, daha düşük sunuma rağmen aerobik oksijen tüketimini koruyabilir. Mikst venöz oksijen içeriği azalır; sunum kritik düzeyin altına inince ekstraksiyon yetersiz kalır ve tüketim sunuma bağımlı hâle gelir."},"sourcePages":[75,76],"difficulty":"applied"},{"id":"c17q5","stem":{"en":"Which change is expected to increase oxygen demand through greater skeletal muscle activity in the perioperative period?","tr":"Perioperatif dönemde hangi değişikliğin iskelet kası aktivitesini artırarak oksijen gereksinimini yükseltmesi beklenir?"},"options":[{"en":"Complete suppression of respiratory muscle activity","tr":"Solunum kası aktivitesinin tamamen baskılanması"},{"en":"Reduced cerebral metabolic activity from sedation","tr":"Sedasyona bağlı serebral metabolik aktivite azalması"},{"en":"Relaxed skeletal muscle during effective neuromuscular blockade","tr":"Etkin nöromüsküler blok sırasında iskelet kasının gevşemesi"},{"en":"Resolution of fever","tr":"Ateşin düzelmesi"},{"en":"Shivering","tr":"Titreme"}],"answer":4,"explanation":{"en":"Shivering recruits skeletal muscle contractions and increases metabolic oxygen demand. In contrast, reducing muscular work or cerebral metabolic activity tends to lower the corresponding component of oxygen consumption.","tr":"Titreme iskelet kası kasılmalarını artırır ve metabolik oksijen gereksinimini yükseltir. Buna karşılık kas işinin veya serebral metabolik aktivitenin azaltılması ilgili oksijen tüketimi bileşenini düşürme eğilimindedir."},"sourcePages":[75,76],"difficulty":"core"}]},{"id":18,"title":{"en":"Alveolar Gas Equation","tr":"Alveoler Gaz Denklemi"},"startPage":77,"section":2,"endPage":79,"questions":[{"id":"c18q1","stem":{"en":"Using PAO₂ = FiO₂(PB − PH₂O) − PaCO₂/R, calculate PAO₂ for FiO₂ 0.21, PB 100 kPa, PH₂O 6 kPa, PaCO₂ 4.8 kPa and R 0.8.","tr":"PAO₂ = FiO₂(PB − PH₂O) − PaCO₂/R denkleminde FiO₂ 0,21, PB 100 kPa, PH₂O 6 kPa, PaCO₂ 4,8 kPa ve R 0,8 ise PAO₂ kaçtır?"},"options":[{"en":"6.00 kPa","tr":"6,00 kPa"},{"en":"14.94 kPa","tr":"14,94 kPa"},{"en":"19.74 kPa","tr":"19,74 kPa"},{"en":"21.00 kPa","tr":"21,00 kPa"},{"en":"13.74 kPa","tr":"13,74 kPa"}],"answer":4,"explanation":{"en":"Humidified inspired oxygen tension is 0.21 × (100 − 6) = 19.74 kPa. Subtracting 4.8/0.8 = 6 kPa gives an estimated alveolar oxygen tension of 13.74 kPa.","tr":"Nemlendirilmiş inspirasyon oksijen basıncı 0,21 × (100 − 6) = 19,74 kPa’dır. Bundan 4,8/0,8 = 6 kPa çıkarılınca tahmini alveoler oksijen basıncı 13,74 kPa bulunur."},"sourcePages":[77,78],"difficulty":"applied"},{"id":"c18q2","stem":{"en":"What is the respiratory quotient for complete aerobic oxidation of glucose?","tr":"Glikozun tam aerobik oksidasyonunda respiratuvar katsayı kaçtır?"},"options":[{"en":"0.5","tr":"0,5"},{"en":"0.7","tr":"0,7"},{"en":"1.0","tr":"1,0"},{"en":"0.8","tr":"0,8"},{"en":"1.5","tr":"1,5"}],"answer":2,"explanation":{"en":"Glucose oxidation produces six CO₂ molecules for six O₂ molecules consumed. The respiratory quotient, CO₂ production divided by O₂ consumption, is therefore 1.0.","tr":"Glikoz oksidasyonunda tüketilen altı O₂ molekülüne karşılık altı CO₂ molekülü üretilir. CO₂ üretiminin O₂ tüketimine oranı olan respiratuvar katsayı bu nedenle 1,0’dır."},"sourcePages":[77],"difficulty":"core"},{"id":"c18q3","stem":{"en":"If FiO₂ and barometric pressure are unchanged, what is the direct alveolar-gas-equation consequence of a rise in PaCO₂ from hypoventilation?","tr":"FiO₂ ve barometrik basınç değişmezken hipoventilasyona bağlı PaCO₂ artışının alveoler gaz denklemine göre doğrudan sonucu nedir?"},"options":[{"en":"Alveolar oxygen tension increases","tr":"Alveoler oksijen basıncı artar"},{"en":"Alveolar oxygen tension decreases","tr":"Alveoler oksijen basıncı azalır"},{"en":"Alveolar oxygen tension is unchanged","tr":"Alveoler oksijen basıncı değişmez"},{"en":"The inspired oxygen fraction increases","tr":"İnspire edilen oksijen fraksiyonu artar"},{"en":"Water vapour pressure decreases at unchanged temperature","tr":"Sıcaklık değişmezken su buharı basıncı azalır"}],"answer":1,"explanation":{"en":"The PaCO₂/R term is subtracted from humidified inspired oxygen tension. Raising PaCO₂ therefore lowers PAO₂, which explains why pure alveolar hypoventilation can produce hypoxaemia.","tr":"PaCO₂/R terimi nemlendirilmiş inspirasyon oksijen basıncından çıkarılır. PaCO₂ artışı bu nedenle PAO₂’yi azaltır; saf alveoler hipoventilasyonun hipoksemi oluşturabilmesi böyle açıklanır."},"sourcePages":[77,78],"difficulty":"applied"},{"id":"c18q4","stem":{"en":"Which cause of hypoxaemia is expected to preserve a normal alveolar–arterial oxygen gradient when present in isolation?","tr":"Tek başına bulunduğunda hangi hipoksemi nedeninde alveoler–arteriyel oksijen gradyanının normal kalması beklenir?"},"options":[{"en":"A substantial right-to-left shunt","tr":"Belirgin sağdan sola şant"},{"en":"Marked ventilation–perfusion mismatch","tr":"Belirgin ventilasyon–perfüzyon uyumsuzluğu"},{"en":"Severe alveolar diffusion impairment","tr":"İleri alveoler difüzyon bozukluğu"},{"en":"Pure alveolar hypoventilation","tr":"Saf alveoler hipoventilasyon"},{"en":"A pulmonary arteriovenous malformation","tr":"Pulmoner arteriyovenöz malformasyon"}],"answer":3,"explanation":{"en":"With isolated hypoventilation, alveolar oxygen falls because CO₂ rises, and arterial oxygen follows without an additional transfer defect. Shunt, V̇/Q̇ mismatch and diffusion impairment lower arterial oxygen disproportionately and widen the gradient.","tr":"İzole hipoventilasyonda CO₂ artışı alveoler oksijeni düşürür; ek bir geçiş bozukluğu olmadan arteriyel oksijen de buna paralel azalır. Şant, V̇/Q̇ uyumsuzluğu ve difüzyon bozukluğu arteriyel oksijeni orantısız düşürerek gradyanı genişletir."},"sourcePages":[78],"difficulty":"applied"},{"id":"c18q5","stem":{"en":"Why does hyperventilation partially improve alveolar oxygen tension at altitude?","tr":"Hiperventilasyon yüksek irtifada alveoler oksijen basıncını neden kısmen artırır?"},"options":[{"en":"It lowers PaCO₂, reducing the quantity subtracted in the alveolar gas equation","tr":"PaCO₂’yi düşürerek alveoler gaz denkleminde çıkarılan miktarı azaltır"},{"en":"It raises the barometric pressure of the atmosphere","tr":"Atmosferin barometrik basıncını yükseltir"},{"en":"It increases dry ambient oxygen fraction above 21%","tr":"Kuru ortam havasının oksijen fraksiyonunu %21’in üzerine çıkarır"},{"en":"It increases the respiratory quotient solely by increasing breathing frequency","tr":"Yalnızca solunum sayısını artırarak respiratuvar katsayıyı yükseltir"},{"en":"It eliminates the water vapour pressure in the alveoli","tr":"Alveollerdeki su buharı basıncını ortadan kaldırır"}],"answer":0,"explanation":{"en":"At altitude, barometric pressure is lower even though ambient oxygen fraction is nearly unchanged. Hyperventilation lowers PaCO₂ and thereby raises PAO₂ relative to what it would be without the ventilatory response.","tr":"Yüksek irtifada ortam oksijen fraksiyonu hemen hemen aynı kalırken barometrik basınç düşer. Hiperventilasyon PaCO₂’yi azaltır ve böylece PAO₂’yi bu ventilatuvar yanıtın olmadığı duruma göre yükseltir."},"sourcePages":[78,79],"difficulty":"applied"}]},{"id":19,"title":{"en":"Oxygen Cascade","tr":"Oksijen Kaskadı"},"startPage":80,"section":2,"endPage":81,"questions":[{"id":"c19q1","stem":{"en":"What does the oxygen cascade describe?","tr":"Oksijen kaskadı neyi tanımlar?"},"options":[{"en":"The progressive reduction in oxygen partial pressure from ambient air to mitochondria","tr":"Ortam havasından mitokondriye kadar oksijen parsiyel basıncının aşamalı azalmasını"},{"en":"The progressive reduction in total blood oxygen content caused only by dilution","tr":"Yalnızca dilüsyona bağlı toplam kan oksijen içeriğinin aşamalı azalmasını"},{"en":"The relationship between haemoglobin saturation and oxygen tension","tr":"Hemoglobin satürasyonu ile oksijen basıncı arasındaki ilişkiyi"},{"en":"The change in alveolar oxygen tension during a single tidal inspiration","tr":"Tek tidal inspirasyonda alveoler oksijen basıncı değişimini"},{"en":"The fall in pulmonary vascular pressure from artery to vein","tr":"Arterden vene pulmoner damar basıncının düşmesini"}],"answer":0,"explanation":{"en":"Oxygen traverses several compartments with progressively lower partial pressures before reaching its site of use. Each step depends on processes such as humidification, alveolar ventilation, gas exchange, perfusion and tissue utilisation.","tr":"Oksijen kullanılacağı yere ulaşmadan önce giderek daha düşük parsiyel basınçlı bölmelerden geçer. Her basamak nemlendirme, alveoler ventilasyon, gaz değişimi, perfüzyon ve doku kullanımı gibi süreçlere bağlıdır."},"sourcePages":[80,81],"difficulty":"core"},{"id":"c19q2","stem":{"en":"Why is oxygen partial pressure in fully humidified tracheal air lower than in dry inspired air at the same barometric pressure?","tr":"Aynı barometrik basınçta tam nemlendirilmiş trakea havasının oksijen parsiyel basıncı neden kuru inspirasyon havasından düşüktür?"},"options":[{"en":"The fall is mainly caused by oxygen diffusion into bronchial capillaries","tr":"Düşüş başlıca bronşiyal kapillerlere oksijen difüzyonundan kaynaklanır"},{"en":"The dry oxygen fraction is reduced by chemical binding of oxygen to water","tr":"Oksijenin suya kimyasal bağlanması kuru oksijen fraksiyonunu azaltır"},{"en":"Humidification increases total pressure while leaving oxygen partial pressure fixed","tr":"Nemlendirme oksijen parsiyel basıncını sabit tutarken toplam basıncı artırır"},{"en":"Water vapour occupies part of the total gas pressure","tr":"Su buharı toplam gaz basıncının bir bölümünü oluşturur"},{"en":"Water vapour removes nitrogen selectively and therefore lowers oxygen tension","tr":"Su buharı azotu seçici olarak uzaklaştırır ve böylece oksijen basıncını düşürür"}],"answer":3,"explanation":{"en":"At body temperature, water vapour contributes its own partial pressure. The pressure available to dry gases is therefore PB − PH₂O, and humidified inspired PO₂ is FiO₂ × (PB − PH₂O).","tr":"Vücut sıcaklığında su buharı kendi parsiyel basıncıyla katkıda bulunur. Kuru gazlara kalan basınç bu nedenle PB − PH₂O olur; nemlendirilmiş inspirasyon PO₂’si FiO₂ × (PB − PH₂O) olarak hesaplanır."},"sourcePages":[80],"difficulty":"core"},{"id":"c19q3","stem":{"en":"In healthy lungs at rest, which normal process helps explain why systemic arterial PO₂ is slightly below alveolar PO₂?","tr":"Dinlenimdeki sağlıklı akciğerde sistemik arteriyel PO₂’nin alveoler PO₂’den biraz düşük olmasını hangi normal süreç açıklamaya yardımcı olur?"},"options":[{"en":"Normal alveolar oxygen transfer is strongly diffusion limited at rest","tr":"Normal alveoler oksijen geçişi dinlenimde belirgin olarak difüzyonla sınırlıdır"},{"en":"Most systemic venous blood normally bypasses the lungs","tr":"Sistemik venöz kanın çoğu normalde akciğerleri atlar"},{"en":"Small venous admixture from bronchial and left-sided Thebesian drainage","tr":"Bronşiyal ve sol tarafa açılan Thebesius drenajından küçük venöz karışım"},{"en":"Oxygen tension falls substantially because large amounts are consumed within pulmonary veins","tr":"Pulmoner venlerde büyük miktarda oksijen tüketildiği için oksijen basıncı belirgin düşer"},{"en":"Humidification takes place only after blood has left the pulmonary capillaries","tr":"Nemlendirme ancak kan pulmoner kapillerlerden ayrıldıktan sonra gerçekleşir"}],"answer":2,"explanation":{"en":"A small amount of deoxygenated blood enters the left-sided circulation without full alveolar gas exchange. This venous admixture contributes to the normal alveolar–arterial oxygen difference even when diffusion is efficient.","tr":"Az miktarda deoksijene kan, tam alveoler gaz değişimine uğramadan sol dolaşıma katılır. Bu venöz karışım, difüzyon etkin olsa bile normal alveoler–arteriyel oksijen farkına katkıda bulunur."},"sourcePages":[81],"difficulty":"core"},{"id":"c19q4","stem":{"en":"What drives oxygen movement from systemic capillary blood into metabolically active cells?","tr":"Oksijenin sistemik kapiller kandan metabolik olarak aktif hücrelere hareketini ne sağlar?"},"options":[{"en":"Active pumping of oxygen by the Na⁺/K⁺-ATPase","tr":"Na⁺/K⁺-ATPazın oksijeni aktif olarak pompalaması"},{"en":"Equal oxygen partial pressures in capillaries and mitochondria","tr":"Kapillerler ve mitokondrilerde eşit oksijen parsiyel basınçları"},{"en":"A higher mitochondrial PO₂ than capillary PO₂","tr":"Mitokondriyal PO₂’nin kapiller PO₂’den yüksek olması"},{"en":"The chloride shift acting as an oxygen transporter","tr":"Klorür kaymasının oksijen taşıyıcısı olarak çalışması"},{"en":"A partial-pressure gradient maintained by cellular oxygen consumption","tr":"Hücresel oksijen tüketiminin sürdürdüğü parsiyel basınç gradyanı"}],"answer":4,"explanation":{"en":"Mitochondrial consumption keeps intracellular oxygen tension below capillary oxygen tension. The resulting gradient permits diffusion towards the tissue, with haemoglobin releasing oxygen as dissolved oxygen is removed.","tr":"Mitokondriyal tüketim hücre içi oksijen basıncını kapiller oksijen basıncının altında tutar. Oluşan gradyan dokuya doğru difüzyon sağlar; çözünmüş oksijen azaldıkça hemoglobin oksijen bırakır."},"sourcePages":[81],"difficulty":"core"},{"id":"c19q5","stem":{"en":"Which change at high altitude lowers the starting point of the oxygen cascade?","tr":"Yüksek irtifada hangi değişiklik oksijen kaskadının başlangıç noktasını düşürür?"},"options":[{"en":"Reduced oxygen fraction with unchanged barometric pressure","tr":"Barometrik basınç aynı kalırken oksijen fraksiyonunun azalması"},{"en":"Reduced barometric pressure with a nearly unchanged oxygen fraction","tr":"Oksijen fraksiyonu hemen hemen aynı kalırken barometrik basıncın azalması"},{"en":"Increased water vapour pressure at unchanged body temperature","tr":"Vücut sıcaklığı değişmeden su buharı basıncının artması"},{"en":"A higher normal anatomical shunt before air reaches the trachea","tr":"Hava trakeaya ulaşmadan önce daha yüksek normal anatomik şant"},{"en":"Reduced haemoglobin concentration as the direct cause of lower ambient PO₂","tr":"Ortam PO₂ düşüşünün doğrudan nedeni olarak hemoglobin konsantrasyonunun azalması"}],"answer":1,"explanation":{"en":"Dry inspired oxygen tension is the product of oxygen fraction and barometric pressure. At altitude, the lower barometric pressure reduces this initial oxygen tension and challenges all subsequent steps in oxygen transfer.","tr":"Kuru inspirasyon oksijen basıncı oksijen fraksiyonu ile barometrik basıncın çarpımıdır. Yüksek irtifada daha düşük barometrik basınç bu ilk oksijen basıncını azaltır ve oksijen geçişinin sonraki tüm basamaklarını zorlar."},"sourcePages":[80,81],"difficulty":"applied"}]},{"id":20,"title":{"en":"Lung Compliance","tr":"Akciğer Kompliyansı"},"startPage":82,"section":2,"endPage":87,"questions":[{"id":"c20q1","stem":{"en":"Lung volume increases by 400 mL when transpulmonary pressure increases by 4 cmH₂O. What is lung compliance over this range?","tr":"Transpulmoner basınç 4 cmH₂O arttığında akciğer hacmi 400 mL artar. Bu aralıktaki akciğer kompliyansı nedir?"},"options":[{"en":"0.01 mL/cmH₂O","tr":"0,01 mL/cmH₂O"},{"en":"100 mL/cmH₂O","tr":"100 mL/cmH₂O"},{"en":"40 mL/cmH₂O","tr":"40 mL/cmH₂O"},{"en":"200 mL/cmH₂O","tr":"200 mL/cmH₂O"},{"en":"1600 mL/cmH₂O","tr":"1600 mL/cmH₂O"}],"answer":1,"explanation":{"en":"Compliance is the change in volume divided by the change in distending pressure. Here, 400/4 = 100 mL/cmH₂O; the inverse relationship describes elastance rather than compliance.","tr":"Kompliyans hacim değişiminin genişletici basınç değişimine bölünmesidir. Burada 400/4 = 100 mL/cmH₂O’dur; bunun tersi kompliyansı değil elastansı tanımlar."},"sourcePages":[82],"difficulty":"applied"},{"id":"c20q2","stem":{"en":"Lung and chest-wall compliances are each 200 mL/cmH₂O. What is the combined respiratory-system compliance?","tr":"Akciğer ve göğüs duvarı kompliyanslarının her biri 200 mL/cmH₂O’dur. Birleşik solunum sistemi kompliyansı nedir?"},"options":[{"en":"50 mL/cmH₂O","tr":"50 mL/cmH₂O"},{"en":"200 mL/cmH₂O","tr":"200 mL/cmH₂O"},{"en":"400 mL/cmH₂O","tr":"400 mL/cmH₂O"},{"en":"800 mL/cmH₂O","tr":"800 mL/cmH₂O"},{"en":"100 mL/cmH₂O","tr":"100 mL/cmH₂O"}],"answer":4,"explanation":{"en":"The elastic loads add, so 1/Crs = 1/Clung + 1/Cchest wall. Thus 1/Crs = 1/200 + 1/200 = 1/100, giving a combined compliance of 100 mL/cmH₂O.","tr":"Elastik yükler toplandığı için 1/Crs = 1/Cakciğer + 1/Cgöğüs duvarı olur. Böylece 1/Crs = 1/200 + 1/200 = 1/100 ve birleşik kompliyans 100 mL/cmH₂O bulunur."},"sourcePages":[82],"difficulty":"applied"},{"id":"c20q3","stem":{"en":"In the simplified Laplace model of an alveolus, which change lowers the pressure required to keep an alveolus of fixed radius open?","tr":"Alveolün basitleştirilmiş Laplace modelinde, yarıçapı sabit olan alveolü açık tutmak için gereken basıncı hangi değişiklik azaltır?"},"options":[{"en":"An increase in surface tension","tr":"Yüzey geriliminin artması"},{"en":"A decrease in alveolar radius with unchanged surface tension","tr":"Yüzey gerilimi değişmeden alveol yarıçapının azalması"},{"en":"Loss of surfactant from the interface","tr":"Ara yüzeyden sürfaktan kaybı"},{"en":"A reduction in surface tension by surfactant","tr":"Sürfaktanın yüzey gerilimini azaltması"},{"en":"Greater attraction between surface water molecules","tr":"Yüzeydeki su molekülleri arasındaki çekimin artması"}],"answer":3,"explanation":{"en":"For a single spherical air–liquid interface, P = 2T/r. Reducing surface tension T lowers the pressure needed at a given radius, helping stabilise small alveoli and improving compliance.","tr":"Tek küresel hava–sıvı ara yüzeyi için P = 2T/r’dir. Yüzey gerilimi T’nin azaltılması belirli bir yarıçapta gereken basıncı düşürerek küçük alveollerin stabilitesine ve kompliyansın artmasına yardımcı olur."},"sourcePages":[83,84],"difficulty":"core"},{"id":"c20q4","stem":{"en":"Which pairing best describes the usual change in lung compliance?","tr":"Akciğer kompliyansındaki olağan değişimi hangi eşleştirme en iyi tanımlar?"},"options":[{"en":"Emphysema increases it; pulmonary fibrosis decreases it","tr":"Amfizem artırır; pulmoner fibrozis azaltır"},{"en":"Emphysema decreases it; pulmonary fibrosis increases it","tr":"Amfizem azaltır; pulmoner fibrozis artırır"},{"en":"Both emphysema and fibrosis increase it","tr":"Hem amfizem hem fibrozis artırır"},{"en":"Both leave it unchanged but alter only airway resistance","tr":"İkisi de değiştirmez, yalnızca hava yolu direncini etkiler"},{"en":"Surfactant deficiency increases it more than emphysema","tr":"Sürfaktan eksikliği amfizemden daha fazla artırır"}],"answer":0,"explanation":{"en":"Emphysema destroys elastic tissue, so the lung distends more easily but recoils less effectively. Fibrosis stiffens the lung, requiring a greater pressure change for the same volume change.","tr":"Amfizem elastik dokuyu yıkar; akciğer daha kolay genişler ancak daha az etkili geri çekilir. Fibrozis akciğeri sertleştirir ve aynı hacim değişikliği için daha fazla basınç değişimi gerektirir."},"sourcePages":[82,83],"difficulty":"applied"},{"id":"c20q5","stem":{"en":"What is meant by hysteresis on a lung pressure–volume plot?","tr":"Akciğer basınç–hacim grafiğinde histerezis ne anlama gelir?"},"options":[{"en":"Lung volume is a unique linear function of pressure throughout the full range","tr":"Tüm aralık boyunca akciğer hacmi basıncın tek doğrusal fonksiyonudur"},{"en":"Airway resistance is zero whenever hysteresis is present","tr":"Histerezis varsa hava yolu direnci sıfırdır"},{"en":"Inflation and deflation follow different paths, giving different volumes at the same pressure","tr":"Şişme ve sönme farklı yollar izler; aynı basınçta farklı hacimler oluşur"},{"en":"Inflation and deflation curves must coincide","tr":"Şişme ve sönme eğrileri zorunlu olarak çakışır"},{"en":"Compliance is identical at residual volume and total lung capacity","tr":"Rezidüel hacimde ve total akciğer kapasitesinde kompliyans aynıdır"}],"answer":2,"explanation":{"en":"The mechanical state of the lung depends partly on whether it is being inflated or deflated. Surfactant behaviour, recruitment and tissue properties contribute, and static hysteresis can remain even without airflow.","tr":"Akciğerin mekanik durumu kısmen şişirilmekte mi yoksa sönmekte mi olduğuna bağlıdır. Sürfaktan davranışı, rekrutman ve doku özellikleri katkıda bulunur; hava akımı olmasa bile statik histerezis görülebilir."},"sourcePages":[85,86],"difficulty":"core"}]},{"id":21,"title":{"en":"Work of Breathing","tr":"Solunum İşi"},"startPage":88,"section":2,"endPage":92,"questions":[{"id":"c21q1","stem":{"en":"For laminar flow through an ideal rigid tube, halving its radius while keeping length and gas viscosity fixed changes resistance by what factor?","tr":"İdeal rijit bir tüpte laminer akım için uzunluk ve gaz viskozitesi sabitken yarıçapın yarıya indirilmesi direnci kaç kat değiştirir?"},"options":[{"en":"It increases 2-fold","tr":"2 kat artırır"},{"en":"It increases 4-fold","tr":"4 kat artırır"},{"en":"It increases 16-fold","tr":"16 kat artırır"},{"en":"It increases 8-fold","tr":"8 kat artırır"},{"en":"It decreases to one-sixteenth","tr":"On altıda birine düşürür"}],"answer":2,"explanation":{"en":"For Poiseuille flow, resistance is proportional to 1/r⁴. Halving radius therefore multiplies resistance by 2⁴ = 16; real airways may also have turbulent flow and changing geometry.","tr":"Poiseuille akımında direnç 1/r⁴ ile orantılıdır. Bu nedenle yarıçapın yarıya indirilmesi direnci 2⁴ = 16 kat artırır; gerçek hava yollarında türbülans ve değişken geometri de bulunabilir."},"sourcePages":[89],"difficulty":"applied"},{"id":"c21q2","stem":{"en":"Which condition principally increases the elastic component of inspiratory work?","tr":"Hangi durum inspiratuvar işin başlıca elastik bileşenini artırır?"},"options":[{"en":"Pulmonary fibrosis reducing lung compliance","tr":"Akciğer kompliyansını azaltan pulmoner fibrozis"},{"en":"An isolated narrow endotracheal tube with unchanged lung compliance","tr":"Akciğer kompliyansı değişmeden yalnızca dar endotrakeal tüp bulunması"},{"en":"Turbulent flow through an otherwise normal large airway","tr":"Diğer yönlerden normal büyük hava yolunda türbülanslı akım"},{"en":"An isolated rise in gas density","tr":"Gaz yoğunluğunda izole artış"},{"en":"A partially obstructed breathing-circuit filter","tr":"Kısmen tıkalı solunum devresi filtresi"}],"answer":0,"explanation":{"en":"A stiff fibrotic lung requires more pressure for a given tidal expansion, increasing elastic work. Narrow tubes, filters and turbulent airflow primarily add flow-resistive work.","tr":"Sert fibrotik akciğerde belirli bir tidal genişleme için daha fazla basınç gerekir ve elastik iş artar. Dar tüpler, filtreler ve türbülanslı akım ise başlıca akıma dirençle ilişkili işi artırır."},"sourcePages":[88,90],"difficulty":"applied"},{"id":"c21q3","stem":{"en":"With gas velocity, airway diameter and viscosity held constant, how does reducing gas density affect the Reynolds number?","tr":"Gaz hızı, hava yolu çapı ve viskozite sabit tutulduğunda gaz yoğunluğunun azaltılması Reynolds sayısını nasıl etkiler?"},"options":[{"en":"It raises Reynolds number and increases the tendency to turbulence","tr":"Reynolds sayısını yükseltir ve türbülans eğilimini artırır"},{"en":"It leaves Reynolds number unchanged because density is absent from the equation","tr":"Denklemde yoğunluk bulunmadığı için Reynolds sayısını değiştirmez"},{"en":"It increases laminar resistance by the fourth power of density","tr":"Laminer direnci yoğunluğun dördüncü kuvveti oranında artırır"},{"en":"It changes only elastic recoil and not airflow behaviour","tr":"Yalnızca elastik geri çekimi değiştirir, akım davranışını değiştirmez"},{"en":"It lowers Reynolds number and reduces the tendency to turbulence","tr":"Reynolds sayısını düşürür ve türbülans eğilimini azaltır"}],"answer":4,"explanation":{"en":"Reynolds number is proportional to gas density: Re = velocity × density × diameter / viscosity. Lower density therefore favours less turbulent flow under otherwise identical conditions.","tr":"Reynolds sayısı gaz yoğunluğuyla doğru orantılıdır: Re = hız × yoğunluk × çap / viskozite. Bu nedenle diğer koşullar aynıyken düşük yoğunluk daha az türbülanslı akımı destekler."},"sourcePages":[89],"difficulty":"core"},{"id":"c21q4","stem":{"en":"What does the area enclosed by an inspiratory–expiratory pressure–volume loop represent mechanically?","tr":"İnspirasyon–ekspirasyon basınç–hacim halkasının çevrelediği alan mekanik olarak neyi temsil eder?"},"options":[{"en":"The reversible elastic energy fully recovered during deflation","tr":"Sönme sırasında tamamen geri kazanılan geri dönüşümlü elastik enerji"},{"en":"Energy dissipated by resistive and hysteretic processes during the cycle","tr":"Döngü boyunca direnç ve histerezis süreçlerinde harcanan enerji"},{"en":"The change in static compliance between two points","tr":"İki nokta arasındaki statik kompliyans değişimi"},{"en":"Airway resistance without any contribution from tissue hysteresis","tr":"Doku histerezisinin hiçbir katkısı olmaksızın hava yolu direnci"},{"en":"The pressure needed to overcome intrinsic PEEP alone","tr":"Yalnızca intrinsik PEEP’i yenmek için gereken basınç"}],"answer":1,"explanation":{"en":"Pressure integrated over volume has the dimensions of work. The loop encloses the energy not recovered on expiration, unlike the reversible elastic energy stored during inflation.","tr":"Basıncın hacme göre integrali iş boyutundadır. Halka, şişme sırasında depolanan geri kazanılabilir elastik enerjiden farklı olarak, ekspirasyonda geri kazanılmayan enerjiyi gösterir."},"sourcePages":[88,90],"difficulty":"core"},{"id":"c21q5","stem":{"en":"Why do the numerous small distal airways not normally provide the greatest total airway resistance?","tr":"Çok sayıdaki küçük distal hava yolu neden normalde en büyük toplam hava yolu direncini oluşturmaz?"},"options":[{"en":"Their individual radii exceed those of the main bronchi","tr":"Tek tek yarıçapları ana bronşlarınkinden büyüktür"},{"en":"They are arranged entirely in series, reducing total resistance","tr":"Tamamen seri düzenlenerek toplam direnci düşürürler"},{"en":"Gas viscosity decreases substantially with each distal airway generation","tr":"Her distal hava yolu kuşağında gaz viskozitesi belirgin azalır"},{"en":"They are arranged in parallel, producing a very large combined cross-sectional area","tr":"Paralel düzenlenerek çok büyük toplam kesit alanı oluştururlar"},{"en":"Their smooth-muscle layer maintains a larger diameter than the proximal airways","tr":"Düz kas tabakaları proksimal hava yollarından daha büyük çapı korur"}],"answer":3,"explanation":{"en":"Many parallel pathways lower the aggregate resistance despite each airway’s small radius. The major normal resistance lies more proximally, where there are fewer parallel conducting pathways.","tr":"Çok sayıda paralel yol, her hava yolunun yarıçapı küçük olsa bile birleşik direnci düşürür. Normalde başlıca direnç, paralel iletici yolların daha az olduğu proksimal bölümlerdedir."},"sourcePages":[89],"difficulty":"core"}]},{"id":22,"title":{"en":"Control of Ventilation","tr":"Ventilasyonun Kontrolü"},"startPage":93,"section":2,"endPage":96,"questions":[{"id":"c22q1","stem":{"en":"An acute rise in PaCO₂ stimulates central chemoreception chiefly through which mechanism?","tr":"PaCO₂’de akut artış santral kemoresepsiyonu başlıca hangi mekanizmayla uyarır?"},"options":[{"en":"Arterial H⁺ crosses the blood–brain barrier as readily as CO₂","tr":"Arteriyel H⁺ kan–beyin bariyerini CO₂ kadar kolay geçer"},{"en":"A rise in CSF bicarbonate directly lowers CSF H⁺","tr":"BOS bikarbonatının artması BOS H⁺ düzeyini doğrudan düşürür"},{"en":"Reduced haemoglobin oxygen content directly activates medullary oxygen sensors","tr":"Hemoglobin oksijen içeriğinin azalması medüller oksijen sensörlerini doğrudan uyarır"},{"en":"CO₂ crosses the blood–brain barrier and increases H⁺ in brain extracellular fluid","tr":"CO₂ kan–beyin bariyerini geçerek beyin hücre dışı sıvısında H⁺ düzeyini artırır"},{"en":"CO₂ increases CSF pH and inhibits acid-sensitive pathways","tr":"CO₂ BOS pH’sını yükseltir ve aside duyarlı yolları inhibe eder"}],"answer":3,"explanation":{"en":"CO₂ crosses into the brain and generates H⁺ through hydration and dissociation reactions. The resulting local acidification stimulates central chemosensitive pathways; rapid direct transfer of arterial H⁺ is much more limited.","tr":"CO₂ beyne geçer ve hidrasyon ile ayrışma tepkimeleri yoluyla H⁺ oluşturur. Oluşan yerel asitleşme santral kemosensitif yolları uyarır; arteriyel H⁺ iyonlarının hızlı doğrudan geçişi çok daha sınırlıdır."},"sourcePages":[94],"difficulty":"core"},{"id":"c22q2","stem":{"en":"Which nerve carries the principal afferent signals from carotid body chemoreceptors?","tr":"Karotis cismi kemoreseptörlerinden başlıca afferent sinyalleri hangi sinir taşır?"},"options":[{"en":"Vagus nerve","tr":"Vagus siniri"},{"en":"Glossopharyngeal nerve","tr":"Glossofaringeal sinir"},{"en":"Phrenic nerve","tr":"Frenik sinir"},{"en":"Hypoglossal nerve","tr":"Hipoglossal sinir"},{"en":"Recurrent laryngeal nerve","tr":"Rekürren laringeal sinir"}],"answer":1,"explanation":{"en":"Carotid body afferents travel in the glossopharyngeal nerve. Aortic body afferents travel in the vagus, while the phrenic nerve is primarily the motor route to the diaphragm.","tr":"Karotis cismi afferentleri glossofaringeal sinirde ilerler. Aort cismi afferentleri vagusta taşınır; frenik sinir ise başlıca diyaframa giden motor yoldur."},"sourcePages":[93],"difficulty":"core"},{"id":"c22q3","stem":{"en":"Which oxygen variable is the main stimulus for the peripheral hypoxic ventilatory response?","tr":"Periferik hipoksik ventilatuvar yanıtın temel uyaranı hangi oksijen değişkenidir?"},"options":[{"en":"A fall in arterial oxygen partial pressure","tr":"Arteriyel oksijen parsiyel basıncının düşmesi"},{"en":"A fall in haemoglobin concentration with unchanged PaO₂","tr":"PaO₂ değişmeden hemoglobin konsantrasyonunun düşmesi"},{"en":"A fall in total arterial oxygen content with unchanged PaO₂","tr":"PaO₂ değişmeden toplam arteriyel oksijen içeriğinin düşmesi"},{"en":"An isolated fall in myoglobin oxygen stores","tr":"Miyoglobin oksijen depolarında izole azalma"},{"en":"An isolated increase in haemoglobin oxygen affinity at unchanged PaO₂","tr":"PaO₂ değişmeden hemoglobin oksijen afinitesinde izole artış"}],"answer":0,"explanation":{"en":"Peripheral chemoreceptors respond primarily to arterial oxygen tension rather than directly measuring total oxygen content. This explains why reduced haemoglobin concentration need not produce the same hypoxic ventilatory stimulus as a comparable loss of oxygen content caused by low PaO₂.","tr":"Periferik kemoreseptörler toplam oksijen içeriğini doğrudan ölçmekten çok arteriyel oksijen basıncına yanıt verir. Bu nedenle hemoglobin azalması, düşük PaO₂’nin oluşturduğu benzer oksijen içerik kaybıyla aynı hipoksik ventilatuvar uyaranı yaratmayabilir."},"sourcePages":[93,94],"difficulty":"core"},{"id":"c22q4","stem":{"en":"How does concurrent hypercapnia generally affect the ventilatory response to hypoxaemia?","tr":"Eşlik eden hiperkapni, hipoksemiye ventilatuvar yanıtı genel olarak nasıl etkiler?"},"options":[{"en":"It abolishes the response at all CO₂ levels","tr":"Tüm CO₂ düzeylerinde yanıtı ortadan kaldırır"},{"en":"It converts the response into a fall in ventilation at ordinary levels","tr":"Olağan düzeylerde yanıtı ventilasyon azalmasına dönüştürür"},{"en":"It augments the response through interaction of chemoreceptor inputs","tr":"Kemoreseptör girdilerinin etkileşimiyle yanıtı güçlendirir"},{"en":"It prevents carotid bodies from sensing PaO₂","tr":"Karotis cisimlerinin PaO₂’yi algılamasını engeller"},{"en":"It makes the response depend only on haemoglobin concentration","tr":"Yanıtı yalnızca hemoglobin konsantrasyonuna bağımlı kılar"}],"answer":2,"explanation":{"en":"Hypoxic and hypercapnic stimuli interact to produce an enhanced ventilatory response. This synergistic behaviour is distinct from the depression that can occur at extreme, prolonged disturbances.","tr":"Hipoksik ve hiperkapnik uyaranlar etkileşerek daha güçlü ventilatuvar yanıt oluşturur. Bu sinerjik davranış, aşırı ve uzun süreli bozukluklarda görülebilen depresyondan farklıdır."},"sourcePages":[94,95],"difficulty":"applied"},{"id":"c22q5","stem":{"en":"What is the typical effect of opioids on the ventilatory response to CO₂?","tr":"Opioidlerin CO₂’ye ventilatuvar yanıt üzerindeki tipik etkisi nedir?"},"options":[{"en":"Increased responsiveness with a leftward shift","tr":"Yanıtın artması ve eğrinin sola kayması"},{"en":"An unchanged response despite a reduction in respiratory rate","tr":"Solunum sayısı azalmasına rağmen yanıtın değişmemesi"},{"en":"Enhanced ventilation at every PaCO₂ through carotid stimulation","tr":"Karotis uyarısıyla her PaCO₂ düzeyinde ventilasyonun artması"},{"en":"Selective stimulation of tidal volume with preserved CO₂ sensitivity","tr":"CO₂ duyarlılığı korunurken tidal hacmin seçici olarak uyarılması"},{"en":"Reduced ventilatory responsiveness, with a rightward shift of the CO₂ response curve","tr":"Ventilatuvar yanıtın azalması ve CO₂ yanıt eğrisinin sağa kayması"}],"answer":4,"explanation":{"en":"Opioids depress respiratory neural networks, so a given CO₂ level elicits less ventilation. The rightward shift means that a higher CO₂ level is required to produce a comparable ventilatory response.","tr":"Opioidler solunumla ilgili sinir ağlarını baskılar; bu nedenle belirli bir CO₂ düzeyi daha az ventilasyon oluşturur. Sağa kayma, benzer ventilatuvar yanıt için daha yüksek CO₂ düzeyi gerektiğini ifade eder."},"sourcePages":[95,96],"difficulty":"applied"}]},{"id":23,"title":{"en":"Pulmonary Circulation","tr":"Pulmoner Dolaşım"},"startPage":97,"section":2,"endPage":101,"questions":[{"id":"c23q1","stem":{"en":"Mean pulmonary arterial pressure is 22 mmHg, wedge pressure 10 mmHg and cardiac output 6 L/min. What is pulmonary vascular resistance?","tr":"Ortalama pulmoner arter basıncı 22 mmHg, kama basıncı 10 mmHg ve kalp debisi 6 L/dk ise pulmoner vasküler direnç kaçtır?"},"options":[{"en":"80 dyn·s·cm⁻⁵","tr":"80 dyn·s·cm⁻⁵"},{"en":"120 dyn·s·cm⁻⁵","tr":"120 dyn·s·cm⁻⁵"},{"en":"160 dyn·s·cm⁻⁵","tr":"160 dyn·s·cm⁻⁵"},{"en":"240 dyn·s·cm⁻⁵","tr":"240 dyn·s·cm⁻⁵"},{"en":"320 dyn·s·cm⁻⁵","tr":"320 dyn·s·cm⁻⁵"}],"answer":2,"explanation":{"en":"Resistance is 80 × (mean pulmonary arterial pressure − wedge pressure)/cardiac output. The relevant driving pressure is 12 mmHg, giving 160 dyn·s·cm⁻⁵.","tr":"Direnç, 80 × (ortalama pulmoner arter basıncı − kama basıncı)/kalp debisi ile hesaplanır. İtici basınç farkı 12 mmHg olduğundan sonuç 160 dyn·s·cm⁻⁵ olur."},"sourcePages":[98],"difficulty":"applied"},{"id":"c23q2","stem":{"en":"Why can pulmonary blood flow rise markedly during exercise without a proportionate rise in pulmonary arterial pressure?","tr":"Egzersizde pulmoner kan akımı belirgin artarken pulmoner arter basıncı neden aynı oranda yükselmez?"},"options":[{"en":"Recruitment and distension of pulmonary vessels","tr":"Pulmoner damarların açılması ve genişlemesi"},{"en":"Closure of previously perfused capillaries","tr":"Önceden perfüze olan kapillerlerin kapanması"},{"en":"A parallel rise in left atrial pressure","tr":"Sol atriyum basıncının aynı oranda yükselmesi"},{"en":"Generalised hypoxic pulmonary vasoconstriction","tr":"Yaygın hipoksik pulmoner vazokonstriksiyon"},{"en":"Reduced pulmonary vascular compliance","tr":"Pulmoner damar kompliyansının azalması"}],"answer":0,"explanation":{"en":"Recruitment adds parallel pathways and distension widens existing pathways. Both reduce pulmonary vascular resistance as flow increases.","tr":"Kapillerlerin açılması paralel akım yollarını artırır; distansiyon mevcut yolları genişletir. Her iki mekanizma da akım artarken pulmoner vasküler direnci düşürür."},"sourcePages":[98],"difficulty":"core"},{"id":"c23q3","stem":{"en":"At very low lung volumes, which change chiefly raises pulmonary vascular resistance?","tr":"Çok düşük akciğer hacimlerinde pulmoner vasküler direnci başlıca hangi değişiklik artırır?"},"options":[{"en":"Greater radial traction on extra-alveolar vessels","tr":"Ekstraalveoler damarlarda radyal çekimin artması"},{"en":"Distension of alveolar capillaries","tr":"Alveoler kapillerlerin genişlemesi"},{"en":"Reduced resistance in extra-alveolar vessels","tr":"Ekstraalveoler damarlarda direncin azalması"},{"en":"Narrowing of extra-alveolar vessels","tr":"Ekstraalveoler damarların daralması"},{"en":"Compression of alveolar capillaries by maximal lung inflation","tr":"Maksimal akciğer şişmesine bağlı alveoler kapiller sıkışması"}],"answer":3,"explanation":{"en":"Low lung volume reduces radial traction and narrows extra-alveolar vessels. At high volumes, resistance instead rises mainly because alveolar capillaries are stretched and compressed.","tr":"Düşük akciğer hacmi radyal çekimi azaltarak ekstraalveoler damarları daraltır. Yüksek hacimlerde ise direnç artışının başlıca nedeni alveoler kapillerlerin gerilmesi ve sıkışmasıdır."},"sourcePages":[99],"difficulty":"core"},{"id":"c23q4","stem":{"en":"A small lung region becomes poorly ventilated. What is the immediate useful effect of local hypoxic pulmonary vasoconstriction?","tr":"Akciğerin küçük bir bölgesinde ventilasyon azalır. Lokal hipoksik pulmoner vazokonstriksiyonun erken yararlı etkisi nedir?"},"options":[{"en":"Increased perfusion of the hypoxic region","tr":"Hipoksik bölgenin perfüzyonunun artması"},{"en":"Diversion of blood towards better-ventilated regions","tr":"Kanın daha iyi ventile olan bölgelere yönelmesi"},{"en":"Increased perfusion of high-resistance regions","tr":"Yüksek dirençli bölgelerin perfüzyonunun artması"},{"en":"Uniform dilation of pulmonary arterioles","tr":"Pulmoner arteriyollerin eşit biçimde genişlemesi"},{"en":"Diversion of ventilation away from normally perfused regions","tr":"Ventilasyonun normal perfüze bölgelerden uzaklaştırılması"}],"answer":1,"explanation":{"en":"Low alveolar oxygen raises local pulmonary arteriolar resistance. Blood is redirected to regions where ventilation can better support gas exchange, reducing ventilation–perfusion mismatch.","tr":"Alveoler oksijenin azalması lokal pulmoner arteriyol direncini artırır. Kan, ventilasyonun gaz değişimini daha iyi desteklediği bölgelere yönelir ve ventilasyon-perfüzyon uyumsuzluğu azalır."},"sourcePages":[99,100],"difficulty":"applied"},{"id":"c23q5","stem":{"en":"Why can excessive inflation of the ventilated lung worsen oxygenation during one-lung ventilation?","tr":"Tek akciğer ventilasyonunda ventile edilen akciğerin aşırı şişirilmesi oksijenlenmeyi neden kötüleştirebilir?"},"options":[{"en":"It reduces vascular resistance in the unventilated lung by raising its oxygen tension","tr":"Ventile edilmeyen akciğerin oksijen basıncını artırıp damar direncini düşürür"},{"en":"It recruits vessels in the unventilated lung by reducing their distending pressure","tr":"Ventile edilmeyen akciğerde genişletici basıncı azaltıp damarları açar"},{"en":"It increases pulmonary blood flow without changing its regional distribution","tr":"Bölgesel dağılımı değiştirmeden pulmoner kan akımını artırır"},{"en":"It lowers alveolar vascular resistance in the ventilated lung","tr":"Ventile edilen akciğerde alveoler damar direncini azaltır"},{"en":"It raises vascular resistance in the ventilated lung and diverts perfusion","tr":"Ventile edilen akciğerin damar direncini artırıp perfüzyonu başka bölgelere yönlendirir"}],"answer":4,"explanation":{"en":"Overdistension compresses alveolar vessels and increases resistance in the ventilated lung. More blood may then reach unventilated regions, increasing shunt; recruitment and overdistension therefore have different effects.","tr":"Aşırı distansiyon alveoler damarları sıkıştırarak ventile edilen akciğerde direnci artırır. Böylece daha fazla kan ventile edilmeyen bölgelere gidip şantı artırabilir; alveollerin açılması ile aşırı distansiyonun etkileri farklıdır."},"sourcePages":[99,100],"difficulty":"applied"}]},{"id":24,"title":{"en":"Oxygen Toxicity","tr":"Oksijen Toksisitesi"},"startPage":102,"section":2,"endPage":103,"questions":[{"id":"c24q1","stem":{"en":"Which process best explains cellular injury during excessive oxygen exposure?","tr":"Aşırı oksijen maruziyetindeki hücresel hasarı en iyi hangi süreç açıklar?"},"options":[{"en":"Reduced production of mitochondrial free radicals","tr":"Mitokondriyal serbest radikal üretiminin azalması"},{"en":"Excess reactive oxygen species exceeding antioxidant capacity","tr":"Reaktif oksijen türlerinin antioksidan kapasiteyi aşması"},{"en":"Direct formation of carboxyhaemoglobin","tr":"Karboksihemoglobinin doğrudan oluşması"},{"en":"Increased antioxidant capacity without oxidative stress","tr":"Oksidatif stres olmadan antioksidan kapasitenin artması"},{"en":"Reduced oxidation of membrane lipids","tr":"Membran lipitlerinin oksidasyonunun azalması"}],"answer":1,"explanation":{"en":"Reactive oxygen species can damage lipids, proteins and nucleic acids. Toxicity develops when their production exceeds protective antioxidant mechanisms.","tr":"Reaktif oksijen türleri lipitlere, proteinlere ve nükleik asitlere zarar verebilir. Üretimleri koruyucu antioksidan mekanizmaları aştığında toksisite gelişir."},"sourcePages":[102],"difficulty":"core"},{"id":"c24q2","stem":{"en":"Which is an endogenous enzymatic defence against reactive oxygen species?","tr":"Reaktif oksijen türlerine karşı endojen enzimatik savunma hangisidir?"},"options":[{"en":"Thrombin","tr":"Trombin"},{"en":"Renin","tr":"Renin"},{"en":"Acetylcholinesterase","tr":"Asetilkolinesteraz"},{"en":"Superoxide dismutase","tr":"Süperoksit dismutaz"},{"en":"Carbonic anhydrase","tr":"Karbonik anhidraz"}],"answer":3,"explanation":{"en":"Superoxide dismutase is part of the antioxidant defence, alongside catalase and the glutathione system. Carbonic anhydrase facilitates carbon dioxide chemistry rather than acting as this antioxidant enzyme.","tr":"Süperoksit dismutaz, katalaz ve glutatyon sistemiyle birlikte antioksidan savunmanın parçasıdır. Karbonik anhidraz ise bu antioksidan işlevi üstlenmez; karbondioksitle ilişkili reaksiyonları hızlandırır."},"sourcePages":[102],"difficulty":"core"},{"id":"c24q3","stem":{"en":"Seizures during exposure to very high oxygen partial pressures principally represent toxicity in which organ system?","tr":"Çok yüksek oksijen parsiyel basıncına maruziyet sırasında nöbet gelişmesi başlıca hangi sistemde toksisiteyi gösterir?"},"options":[{"en":"Central nervous system","tr":"Merkezi sinir sistemi"},{"en":"Pulmonary interstitium","tr":"Pulmoner interstisyum"},{"en":"Retinal microvasculature","tr":"Retinal mikrodolaşım"},{"en":"Renal tubular epithelium","tr":"Renal tübül epiteli"},{"en":"Bone marrow","tr":"Kemik iliği"}],"answer":0,"explanation":{"en":"Hyperbaric oxygen can cause central nervous system toxicity, traditionally called the Paul Bert effect. Pulmonary oxygen toxicity is a separate pattern of injury.","tr":"Hiperbarik oksijen, klasik olarak Paul Bert etkisi denilen merkezi sinir sistemi toksisitesine yol açabilir. Pulmoner oksijen toksisitesi farklı bir hasar örüntüsüdür."},"sourcePages":[102,103],"difficulty":"core"},{"id":"c24q4","stem":{"en":"Which normal cellular function deliberately uses reactive oxygen species?","tr":"Hangi normal hücresel işlev reaktif oksijen türlerini özellikle kullanır?"},"options":[{"en":"Reversible oxygen binding to haemoglobin","tr":"Oksijenin hemoglobine geri dönüşlü bağlanması"},{"en":"Passive diffusion of oxygen through alveolar membranes","tr":"Oksijenin alveoler membranlardan pasif difüzyonu"},{"en":"Transfer of carbon dioxide by the chloride shift","tr":"Karbondioksitin klor kaymasıyla taşınması"},{"en":"Maintenance of the plasma colloid osmotic pressure","tr":"Plazma kolloid ozmotik basıncının korunması"},{"en":"Killing ingested microorganisms during the phagocyte respiratory burst","tr":"Fagositlerin solunumsal patlaması sırasında yutulan mikroorganizmaların öldürülmesi"}],"answer":4,"explanation":{"en":"Neutrophils and macrophages generate reactive oxygen species within phagosomes to help kill microbes. This oxygen-consuming respiratory burst shows that these molecules have useful functions as well as toxic potential.","tr":"Nötrofiller ve makrofajlar mikropları öldürmeye yardımcı olmak için fagozomlarda reaktif oksijen türleri üretir. Oksijen tüketen bu solunumsal patlama, bu moleküllerin toksik potansiyellerinin yanında yararlı işlevleri de olduğunu gösterir."},"sourcePages":[102],"difficulty":"core"},{"id":"c24q5","stem":{"en":"Which exposure pattern generally carries the greatest oxygen-toxicity risk?","tr":"Hangi maruziyet örüntüsü genel olarak en yüksek oksijen toksisitesi riskini taşır?"},"options":[{"en":"Low oxygen partial pressure for a brief period","tr":"Düşük oksijen parsiyel basıncına kısa süreli maruziyet"},{"en":"The same oxygen fraction at a lower ambient pressure","tr":"Daha düşük ortam basıncında aynı oksijen fraksiyonu"},{"en":"High oxygen partial pressure sustained for longer","tr":"Yüksek oksijen parsiyel basıncına daha uzun süre maruziyet"},{"en":"A shorter exposure at the same oxygen partial pressure","tr":"Aynı oksijen parsiyel basıncında daha kısa maruziyet"},{"en":"A lower oxygen partial pressure for the same duration","tr":"Aynı süre boyunca daha düşük oksijen parsiyel basıncı"}],"answer":2,"explanation":{"en":"Risk depends on both oxygen partial pressure and exposure duration. Inspired fraction alone does not capture the effect of ambient pressure, and there is no universal toxicity threshold for every patient.","tr":"Risk hem oksijen parsiyel basıncına hem de maruziyet süresine bağlıdır. İnspire edilen fraksiyon tek başına ortam basıncının etkisini göstermez ve tüm hastalar için geçerli tek bir toksisite eşiği yoktur."},"sourcePages":[102,103],"difficulty":"applied"}]},{"id":25,"title":{"en":"Ventilatory Failure","tr":"Ventilasyon Yetersizliği"},"startPage":104,"section":2,"endPage":106,"questions":[{"id":"c25q1","stem":{"en":"On room air, a patient has PaO₂ 7.0 kPa and PaCO₂ 8.0 kPa. Which pattern is present?","tr":"Oda havasında bir hastanın PaO₂ değeri 7,0 kPa, PaCO₂ değeri 8,0 kPa bulunur. Hangi örüntü vardır?"},"options":[{"en":"Normal gas exchange","tr":"Normal gaz değişimi"},{"en":"Isolated hypoxaemia without ventilatory failure","tr":"Ventilasyon yetmezliği olmadan izole hipoksemi"},{"en":"Type 1 respiratory failure","tr":"Tip 1 solunum yetmezliği"},{"en":"Type 2 respiratory failure","tr":"Tip 2 solunum yetmezliği"},{"en":"Respiratory alkalosis due to hyperventilation","tr":"Hiperventilasyona bağlı solunumsal alkaloz"}],"answer":3,"explanation":{"en":"Hypoxaemia with raised arterial carbon dioxide indicates hypercapnic, or type 2, respiratory failure. Type 1 respiratory failure has low oxygen with normal or low carbon dioxide.","tr":"Hipoksemiyle birlikte arteriyel karbondioksitin yükselmesi hiperkapnik, yani tip 2 solunum yetmezliğini gösterir. Tip 1 solunum yetmezliğinde oksijen düşükken karbondioksit normal veya düşüktür."},"sourcePages":[104],"difficulty":"applied"},{"id":"c25q2","stem":{"en":"At unchanged carbon dioxide production, which variable is inversely related to PaCO₂?","tr":"Karbondioksit üretimi değişmiyorsa hangi değişken PaCO₂ ile ters orantılıdır?"},"options":[{"en":"Alveolar ventilation","tr":"Alveoler ventilasyon"},{"en":"Anatomical dead-space volume","tr":"Anatomik ölü boşluk hacmi"},{"en":"Inspired oxygen fraction","tr":"İnspire edilen oksijen fraksiyonu"},{"en":"Total minute ventilation regardless of dead space","tr":"Ölü boşluktan bağımsız olarak toplam dakika ventilasyonu"},{"en":"Respiratory rate regardless of tidal volume","tr":"Tidal hacimden bağımsız olarak solunum hızı"}],"answer":0,"explanation":{"en":"Effective alveolar ventilation removes carbon dioxide. Minute ventilation can be misleading because the portion ventilating dead space does not participate in gas exchange.","tr":"Etkin alveoler ventilasyon karbondioksiti uzaklaştırır. Dakika ventilasyonu yanıltıcı olabilir; ölü boşluğu ventile eden kısmı gaz değişimine katılmaz."},"sourcePages":[104],"difficulty":"core"},{"id":"c25q3","stem":{"en":"Why can rapid, shallow breathing during respiratory muscle weakness cause hypercapnia despite an apparently preserved minute ventilation?","tr":"Solunum kası güçsüzlüğünde dakika ventilasyonu korunmuş görünmesine rağmen hızlı ve yüzeyel solunum neden hiperkapni yapabilir?"},"options":[{"en":"A greater fraction of minute ventilation reaches perfused alveoli","tr":"Dakika ventilasyonunun daha büyük bölümü perfüze alveollere ulaşır"},{"en":"Anatomical dead space falls in exact proportion to tidal volume","tr":"Anatomik ölü boşluk tidal hacimle tam orantılı azalır"},{"en":"Respiratory rate alone determines carbon dioxide elimination","tr":"Karbondioksit atılımını yalnız solunum hızı belirler"},{"en":"Reduced tidal volume necessarily increases gas-exchange surface area","tr":"Tidal hacim azalması gaz değişim yüzeyini zorunlu olarak artırır"},{"en":"Dead space occupies a larger fraction of each tidal breath","tr":"Ölü boşluk her tidal soluğun daha büyük bölümünü oluşturur"}],"answer":4,"explanation":{"en":"When tidal volume falls, a larger fraction of each breath is wasted in dead space. Alveolar ventilation can fall even when an increased respiratory rate preserves total minute ventilation.","tr":"Tidal hacim azaldığında her soluğun daha büyük bölümü ölü boşlukta kalır. Solunum hızındaki artış toplam dakika ventilasyonunu korusa bile alveoler ventilasyon azalabilir."},"sourcePages":[105],"difficulty":"applied"},{"id":"c25q4","stem":{"en":"Which mechanical consequence of chronic lung hyperinflation increases inspiratory workload?","tr":"Kronik akciğer hiperinflasyonunun hangi mekanik sonucu inspirasyon iş yükünü artırır?"},"options":[{"en":"Improved diaphragmatic length–tension relationship","tr":"Diyaframın uzunluk-gerilim ilişkisinin iyileşmesi"},{"en":"Flattening of the diaphragm with reduced mechanical advantage","tr":"Diyaframın düzleşmesi ve mekanik avantajının azalması"},{"en":"Reduced inspiratory threshold load","tr":"İnspiratuvar eşik yükünün azalması"},{"en":"Increased diaphragmatic curvature and force efficiency","tr":"Diyafram eğriliğinin ve kuvvet veriminin artması"},{"en":"Lower end-expiratory lung volume","tr":"Ekspirasyon sonu akciğer hacminin azalması"}],"answer":1,"explanation":{"en":"Hyperinflation flattens the diaphragm and places inspiratory muscles at a mechanical disadvantage. They must generate more effort to achieve a given effective breath.","tr":"Hiperinflasyon diyaframı düzleştirir ve inspirasyon kaslarını mekanik olarak dezavantajlı konuma getirir. Aynı etkin soluğu oluşturmak için daha fazla çaba gerekir."},"sourcePages":[105],"difficulty":"core"},{"id":"c25q5","stem":{"en":"How does intrinsic PEEP add to inspiratory work in obstructive lung disease?","tr":"Obstrüktif akciğer hastalığında intrinsik PEEP inspirasyon işini nasıl artırır?"},"options":[{"en":"It reduces the pressure needed to initiate inspiratory flow","tr":"İnspiratuvar akımı başlatmak için gereken basıncı azaltır"},{"en":"It increases available expiratory time","tr":"Kullanılabilir ekspirasyon süresini artırır"},{"en":"It creates a pressure threshold that must be overcome before inspiratory flow begins","tr":"İnspiratuvar akım başlamadan aşılması gereken bir basınç eşiği oluşturur"},{"en":"It moves the diaphragm towards its optimal resting length","tr":"Diyaframı optimal istirahat uzunluğuna yaklaştırır"},{"en":"It lowers end-expiratory alveolar pressure below atmospheric pressure","tr":"Ekspirasyon sonu alveol basıncını atmosfer basıncının altına düşürür"}],"answer":2,"explanation":{"en":"Gas trapping leaves positive alveolar pressure at end-expiration. Inspiratory muscles must first offset this pressure before they can produce inward airflow.","tr":"Hava hapsi ekspirasyon sonunda alveollerde pozitif basınç bırakır. İnspirasyon kasları içeri doğru hava akımı oluşturabilmek için önce bu basıncı yenmelidir."},"sourcePages":[105],"difficulty":"applied"}]},{"id":26,"title":{"en":"Anaesthesia and the Lung","tr":"Anestezi ve Akciğer"},"startPage":107,"section":2,"endPage":110,"questions":[{"id":"c26q1","stem":{"en":"What is a major respiratory effect of opioids relevant to spontaneous breathing?","tr":"Opioidlerin spontan solunum açısından önemli başlıca solunumsal etkisi nedir?"},"options":[{"en":"Increased ventilatory sensitivity to carbon dioxide","tr":"Karbondioksite ventilatuvar duyarlılığın artması"},{"en":"Increased respiratory rate with a steeper carbon dioxide response","tr":"Karbondioksit yanıtının eğimi artarken solunum hızının artması"},{"en":"A selective increase in respiratory muscle force","tr":"Solunum kası kuvvetinin seçici artışı"},{"en":"Enhanced cough reflex sensitivity","tr":"Öksürük refleksi duyarlılığının artması"},{"en":"Depression of respiratory drive and the response to hypercapnia","tr":"Solunum dürtüsünün ve hiperkapniye yanıtın baskılanması"}],"answer":4,"explanation":{"en":"Opioids depress respiratory-centre activity and blunt the ventilatory response to raised carbon dioxide. They can also suppress coughing, which is a separate airway-protective reflex.","tr":"Opioidler solunum merkezi aktivitesini ve yükselen karbondioksite ventilatuvar yanıtı baskılar. Ayrıca ayrı bir hava yolu koruyucu refleks olan öksürüğü de azaltabilirler."},"sourcePages":[107],"difficulty":"core"},{"id":"c26q2","stem":{"en":"Which change after induction of general anaesthesia promotes dependent small-airway closure?","tr":"Genel anestezi indüksiyonundan sonra hangi değişiklik bağımlı bölgelerdeki küçük hava yollarının kapanmasını kolaylaştırır?"},"options":[{"en":"An increase in total lung capacity above normal","tr":"Total akciğer kapasitesinin normalin üzerine çıkması"},{"en":"A fall in functional residual capacity towards or below closing capacity","tr":"Fonksiyonel rezidüel kapasitenin kapanma kapasitesine yaklaşması veya altına inmesi"},{"en":"An increase in diaphragmatic resting tone","tr":"Diyaframın istirahat tonusunun artması"},{"en":"An increase in expiratory reserve volume","tr":"Ekspiratuvar rezerv hacminin artması"},{"en":"A decrease in alveolar gas absorption","tr":"Alveoler gaz emiliminin azalması"}],"answer":1,"explanation":{"en":"Anaesthesia and the supine position reduce functional residual capacity. If it falls below closing capacity, dependent airways close during tidal breathing and ventilation–perfusion matching deteriorates.","tr":"Anestezi ve sırtüstü pozisyon fonksiyonel rezidüel kapasiteyi azaltır. Değer kapanma kapasitesinin altına inerse bağımlı hava yolları tidal solunum sırasında kapanır ve ventilasyon-perfüzyon uyumu bozulur."},"sourcePages":[108],"difficulty":"applied"},{"id":"c26q3","stem":{"en":"What is the mechanism of absorption atelectasis behind a closed airway?","tr":"Kapalı bir hava yolunun distalinde gelişen absorpsiyon atelektazisinin mekanizması nedir?"},"options":[{"en":"Loss of perfusion before airway closure","tr":"Hava yolu kapanmadan önce perfüzyonun kaybolması"},{"en":"Nit
