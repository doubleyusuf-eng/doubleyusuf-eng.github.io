tr":"Karotis sinüsü basısıyla kalp hızının düşmesi"}],"answer":0,"explanation":{"en":"Stretch-sensitive receptors near the great-vein–atrial junctions signal increased filling. The Bainbridge response increases sinoatrial rate; it differs from the arterial baroreflex response to raised arterial pressure.","tr":"Büyük ven-atriyum birleşimi yakınındaki gerilmeye duyarlı reseptörler doluş artışını algılar. Bainbridge yanıtı sinoatriyal hızı artırır; artmış arter basıncına verilen arteriyel barorefleks yanıtından farklıdır."},"sourcePages":[171],"difficulty":"core"},{"id":"c40q4","stem":{"en":"Which combination is characteristic of the Cushing response to severe intracranial pressure elevation?","tr":"İntrakraniyal basıncın ciddi artışına bağlı Cushing yanıtının karakteristik bileşimi hangisidir?"},"options":[{"en":"Hypotension, tachycardia and deep regular breathing","tr":"Hipotansiyon, taşikardi ve derin düzenli solunum"},{"en":"Hypertension, tachycardia and normal respiration","tr":"Hipertansiyon, taşikardi ve normal solunum"},{"en":"Hypotension, bradycardia and hyperventilation","tr":"Hipotansiyon, bradikardi ve hiperventilasyon"},{"en":"Normal pressure, tachycardia and apnoea","tr":"Normal basınç, taşikardi ve apne"},{"en":"Hypertension, bradycardia and irregular respiration","tr":"Hipertansiyon, bradikardi ve düzensiz solunum"}],"answer":4,"explanation":{"en":"Compromised brainstem perfusion can evoke a strong sympathetic pressor response. The resulting arterial hypertension activates the baroreflex and slows the heart, while brainstem dysfunction can disturb breathing.","tr":"Beyin sapı perfüzyonunun bozulması güçlü bir sempatik basınç artırıcı yanıt oluşturabilir. Gelişen arteriyel hipertansiyon barorefleksi etkinleştirip kalbi yavaşlatırken beyin sapı işlev bozukluğu solunumu düzensizleştirebilir."},"sourcePages":[172],"difficulty":"applied"},{"id":"c40q5","stem":{"en":"Which response can support venous return within seconds of acute blood loss?","tr":"Akut kan kaybından sonraki saniyelerde hangi yanıt venöz dönüşü destekleyebilir?"},"options":[{"en":"New red-cell production","tr":"Yeni eritrosit üretimi"},{"en":"New albumin synthesis","tr":"Yeni albümin sentezi"},{"en":"Sympathetic constriction of capacitance veins","tr":"Kapasitans venlerinin sempatik daralması"},{"en":"Expansion of renal sodium excretion","tr":"Renal sodyum atılımının artması"},{"en":"Suppression of catecholamine release","tr":"Katekolamin salınımının baskılanması"}],"answer":2,"explanation":{"en":"Immediate sympathetic venoconstriction mobilises blood from venous reservoirs and supports filling pressure. Red-cell and protein replacement take much longer and cannot explain this rapid response.","tr":"Erken sempatik venokonstriksiyon venöz depolardan kanı mobilize ederek dolum basıncını destekler. Eritrosit ve proteinlerin yerine konması çok daha uzun sürer; bu hızlı yanıtı açıklayamaz."},"sourcePages":[172,173],"difficulty":"applied"}]},{"id":41,"title":{"en":"Valsalva Manoeuvre","tr":"Valsalva Manevrası"},"startPage":175,"section":3,"endPage":177,"questions":[{"id":"c41q1","stem":{"en":"Which respiratory action defines the Valsalva manoeuvre?","tr":"Valsalva manevrasını hangi solunumsal hareket tanımlar?"},"options":[{"en":"Quiet inspiration with an open glottis","tr":"Açık glottise karşı sakin inspirasyon"},{"en":"Forced inspiration against a closed glottis","tr":"Kapalı glottise karşı zorlu inspirasyon"},{"en":"Rapid shallow breathing through an open airway","tr":"Açık hava yoluyla hızlı yüzeyel solunum"},{"en":"A breath hold after passive expiration without straining","tr":"Ikınmadan pasif ekspirasyon sonrası nefes tutma"},{"en":"Forced expiration against a closed glottis","tr":"Kapalı glottise karşı zorlu ekspirasyon"}],"answer":4,"explanation":{"en":"The manoeuvre raises intrathoracic pressure through an expiratory effort against an obstruction. Forced inspiration against a closed airway is the opposite pressure-generating manoeuvre.","tr":"Manevra, kapalı hava yoluna karşı ekspiratuvar çabayla intratorasik basıncı yükseltir. Kapalı hava yoluna karşı zorlu inspirasyon ise zıt yönde basınç oluşturan manevradır."},"sourcePages":[175],"difficulty":"core"},{"id":"c41q2","stem":{"en":"During sustained straining in phase 2 of a normal Valsalva response, what initially reduces stroke volume?","tr":"Normal Valsalva yanıtının 2. fazındaki sürdürülen ıkınma sırasında atım hacmini başlangıçta ne azaltır?"},"options":[{"en":"Increased pulmonary venous oxygen content","tr":"Pulmoner venöz oksijen içeriğinin artması"},{"en":"Reduced systemic venous return caused by raised intrathoracic pressure","tr":"Artmış intratorasik basınca bağlı sistemik venöz dönüş azalması"},{"en":"Abrupt loss of ventricular contractility from myocardial necrosis","tr":"Miyokard nekrozuna bağlı ventrikül kontraktilitesinin aniden kaybı"},{"en":"Increased circulating blood volume","tr":"Dolaşımdaki kan hacminin artması"},{"en":"Opening of an anatomical right-to-left shunt in every subject","tr":"Her kişide anatomik sağdan sola şant açılması"}],"answer":1,"explanation":{"en":"Sustained high intrathoracic pressure impedes venous return and reduces cardiac filling. The fall in arterial pressure then triggers reflex tachycardia and vasoconstriction.","tr":"Sürdürülen yüksek intratorasik basınç venöz dönüşü ve kalp doluşunu azaltır. Arter basıncındaki düşüş ardından refleks taşikardi ve vazokonstriksiyonu tetikler."},"sourcePages":[176],"difficulty":"applied"},{"id":"c41q3","stem":{"en":"What causes the heart-rate slowing during the normal phase 4 pressure overshoot after Valsalva release?","tr":"Valsalva bırakıldıktan sonra normal 4. faz basınç aşımı sırasında kalp hızını ne yavaşlatır?"},"options":[{"en":"Reduced arterial baroreceptor firing","tr":"Arteriyel baroreseptör ateşlemesinin azalması"},{"en":"Continued reduction of left ventricular filling","tr":"Sol ventrikül doluşunun azalmaya devam etmesi"},{"en":"Persistent unloading of atrial stretch receptors","tr":"Atriyal gerilme reseptörlerinin yükünün düşük kalması"},{"en":"Baroreflex activation by the rise in arterial pressure","tr":"Arter basıncı yükselmesinin barorefleksi etkinleştirmesi"},{"en":"Withdrawal of cardiac vagal activity","tr":"Kardiyak vagal aktivitenin çekilmesi"}],"answer":3,"explanation":{"en":"Restored filling can produce a transient pressure overshoot after release. Increased arterial baroreceptor stimulation then increases cardiac vagal influence and slows the heart.","tr":"Manevra bırakılınca doluşun düzelmesi geçici bir basınç aşımı oluşturabilir. Artan arteriyel baroreseptör uyarımı kardiyak vagal etkiyi artırarak kalbi yavaşlatır."},"sourcePages":[176],"difficulty":"applied"},{"id":"c41q4","stem":{"en":"Which Valsalva pattern supports impaired autonomic reflex function?","tr":"Hangi Valsalva örüntüsü otonom refleks işlev bozukluğunu destekler?"},"options":[{"en":"Absent expected phase 2 tachycardia and phase 4 bradycardia","tr":"Beklenen 2. faz taşikardisinin ve 4. faz bradikardisinin olmaması"},{"en":"Normal phase 2 tachycardia with normal phase 4 bradycardia","tr":"Normal 2. faz taşikardisi ile normal 4. faz bradikardisi"},{"en":"Transient phase 1 arterial-pressure rise alone","tr":"Tek başına geçici 1. faz arter basıncı yükselmesi"},{"en":"An initial mechanical rise in intrathoracic pressure","tr":"Başlangıçta intratorasik basıncın mekanik olarak yükselmesi"},{"en":"A brief phase 3 fall in arterial pressure alone","tr":"Tek başına 3. fazda kısa arter basıncı düşüşü"}],"answer":0,"explanation":{"en":"A normal response depends on intact autonomic compensation to changing filling and arterial pressure. Loss of the expected heart-rate responses can indicate autonomic dysfunction, whereas mechanical pressure changes may still occur.","tr":"Normal yanıt değişen doluş ve arter basıncına sağlam otonom telafi gerektirir. Beklenen kalp hızı yanıtlarının kaybı otonom işlev bozukluğunu gösterebilir; mekanik basınç değişiklikleri yine de oluşabilir."},"sourcePages":[176,177],"difficulty":"applied"},{"id":"c41q5","stem":{"en":"During the strain phase of Valsalva, reduced left ventricular filling typically has what effect on the murmur of hypertrophic obstructive cardiomyopathy?","tr":"Valsalva’nın ıkınma fazında sol ventrikül doluşunun azalması hipertrofik obstrüktif kardiyomiyopati üfürümünü genellikle nasıl etkiler?"},"options":[{"en":"It becomes softer because dynamic obstruction decreases","tr":"Dinamik obstrüksiyon azaldığı için hafifler"},{"en":"It becomes identical to a mitral stenosis murmur","tr":"Mitral darlık üfürümüyle aynı hale gelir"},{"en":"It becomes louder as the smaller ventricular cavity increases dynamic obstruction","tr":"Küçülen ventrikül boşluğu dinamik obstrüksiyonu artırdığı için şiddetlenir"},{"en":"It disappears because systolic ejection stops","tr":"Sistolik ejeksiyon durduğu için kaybolur"},{"en":"It shifts exclusively to diastole","tr":"Yalnız diyastole kayar"}],"answer":2,"explanation":{"en":"A smaller left ventricular cavity favours dynamic outflow obstruction in hypertrophic obstructive cardiomyopathy. Its systolic murmur can therefore intensify during straining, unlike most flow-dependent murmurs.","tr":"Hipertrofik obstrüktif kardiyomiyopatide daha küçük sol ventrikül boşluğu dinamik çıkış yolu obstrüksiyonunu kolaylaştırır. Bu nedenle sistolik üfürüm çoğu akıma bağımlı üfürümün aksine ıkınma sırasında şiddetlenebilir."},"sourcePages":[176],"difficulty":"applied"}]},{"id":42,"title":{"en":"Exercise Physiology","tr":"Egzersiz Fizyolojisi"},"startPage":178,"section":3,"endPage":184,"questions":[{"id":"c42q1","stem":{"en":"Which profile best describes type I skeletal muscle fibres?","tr":"Tip I iskelet kası liflerini en iyi hangi özellikler tanımlar?"},"options":[{"en":"Fast contraction, low mitochondrial density and rapid fatigue","tr":"Hızlı kasılma, düşük mitokondri yoğunluğu ve hızlı yorulma"},{"en":"High glycogen content with minimal oxidative capacity","tr":"Yüksek glikojen içeriği ve çok düşük oksidatif kapasite"},{"en":"Low myoglobin and predominant short-burst glycolysis","tr":"Düşük miyoglobin ve baskın kısa süreli glikoliz"},{"en":"Slow contraction, abundant mitochondria and fatigue resistance","tr":"Yavaş kasılma, bol mitokondri ve yorgunluğa direnç"},{"en":"No capillary supply and exclusive phosphocreatine metabolism","tr":"Kapiller desteğin olmaması ve yalnız fosfokreatin metabolizması"}],"answer":3,"explanation":{"en":"Type I fibres are adapted for sustained oxidative work and contain abundant myoglobin, mitochondria and capillaries. These properties favour endurance rather than brief maximal power.","tr":"Tip I lifler sürekli oksidatif çalışmaya uyumludur; bol miyoglobin, mitokondri ve kapiller içerir. Bu özellikler kısa süreli en yüksek güçten çok dayanıklılığı destekler."},"sourcePages":[178],"difficulty":"core"},{"id":"c42q2","stem":{"en":"Which muscle energy store can rapidly regenerate ATP during the first seconds of intense exercise?","tr":"Şiddetli egzersizin ilk saniyelerinde hangi kas enerji deposu ATP’yi hızla yeniden oluşturabilir?"},"options":[{"en":"Phosphocreatine","tr":"Fosfokreatin"},{"en":"Circulating ketone bodies","tr":"Dolaşımdaki keton cisimleri"},{"en":"Fatty acids released from remote adipose stores","tr":"Uzak yağ depolarından salınan yağ asitleri"},{"en":"Amino acids released by structural protein breakdown","tr":"Yapısal protein yıkımından salınan amino asitler"},{"en":"Lactate converted to glucose through the hepatic Cori cycle","tr":"Hepatik Cori döngüsüyle glikoza çevrilen laktat"}],"answer":0,"explanation":{"en":"Phosphocreatine transfers a high-energy phosphate to ADP, rapidly replenishing ATP. Its limited store bridges the early interval before sustained ATP production increases.","tr":"Fosfokreatin ADP’ye yüksek enerjili fosfat aktararak ATP’yi hızla yeniler. Sınırlı deposu, sürekli ATP üretimi artana kadar ilk dönemde destek sağlar."},"sourcePages":[179],"difficulty":"core"},{"id":"c42q3","stem":{"en":"During large-muscle dynamic exercise, what commonly happens to systemic vascular resistance?","tr":"Büyük kas gruplarıyla yapılan dinamik egzersizde sistemik vasküler dirençte genellikle ne olur?"},"options":[{"en":"It rises because every muscle vessel is compressed throughout the cycle","tr":"Tüm kas damarları döngü boyunca sıkıştığı için artar"},{"en":"It remains fixed despite increased local metabolism","tr":"Lokal metabolizma artmasına rağmen sabit kalır"},{"en":"It increases in direct proportion to cardiac output","tr":"Kalp debisiyle doğru orantılı artar"},{"en":"It becomes determined only by skin circulation","tr":"Yalnız deri dolaşımı tarafından belirlenir"},{"en":"It falls because active-muscle vasodilation increases conductance","tr":"Aktif kas vazodilatasyonu iletkenliği artırdığı için azalır"}],"answer":4,"explanation":{"en":"Metabolite-mediated dilation in active muscle lowers resistance across a large vascular bed. Cardiac output rises to support the increased flow, while sustained static contraction has a different pressure response.","tr":"Aktif kasta metabolit aracılı genişleme büyük bir damar yatağındaki direnci düşürür. Artan akımı desteklemek için kalp debisi yükselir; sürekli statik kasılmada basınç yanıtı farklıdır."},"sourcePages":[178,180],"difficulty":"core"},{"id":"c42q4","stem":{"en":"How do increased temperature and acidity in exercising muscle affect oxygen unloading from haemoglobin?","tr":"Egzersiz yapan kasta sıcaklık ve asitliğin artması hemoglobinden oksijen bırakılmasını nasıl etkiler?"},"options":[{"en":"They shift the dissociation curve left and reduce unloading","tr":"Ayrışma eğrisini sola kaydırıp bırakılmayı azaltırlar"},{"en":"They shift the dissociation curve right and facilitate unloading","tr":"Ayrışma eğrisini sağa kaydırıp bırakılmayı kolaylaştırırlar"},{"en":"They increase haemoglobin concentration within seconds","tr":"Hemoglobin konsantrasyonunu saniyeler içinde artırırlar"},{"en":"They lower P50 and increase oxygen affinity","tr":"P50’yi düşürüp oksijen afinitesini artırırlar"},{"en":"They leave affinity unchanged while only changing dissolved oxygen","tr":"Yalnız çözünmüş oksijeni değiştirirken afiniteyi değiştirmezler"}],"answer":1,"explanation":{"en":"Higher temperature and hydrogen-ion concentration reduce haemoglobin oxygen affinity. The resulting right shift increases P50 and helps oxygen leave blood in metabolically active tissue.","tr":"Sıcaklık ve hidrojen iyonu konsantrasyonunun artması hemoglobinin oksijen afinitesini azaltır. Oluşan sağa kayma P50’yi artırarak metabolik olarak aktif dokuda oksijenin kandan ayrılmasını kolaylaştırır."},"sourcePages":[182],"difficulty":"core"},{"id":"c42q5","stem":{"en":"Which process contributes to the rapid component of excess post-exercise oxygen consumption?","tr":"Egzersiz sonrası artmış oksijen tüketiminin hızlı bileşenine hangi süreç katkıda bulunur?"},"options":[{"en":"Formation of new red cells","tr":"Yeni eritrosit oluşumu"},{"en":"Long-term bone remodelling","tr":"Uzun süreli kemik yeniden yapılanması"},{"en":"Replenishment of phosphocreatine and tissue oxygen stores","tr":"Fosfokreatin ve doku oksijen depolarının yenilenmesi"},{"en":"Conversion of all muscle to type I fibres","tr":"Tüm kasın tip I liflere dönüşmesi"},{"en":"Permanent increase in basal heart rate","tr":"Bazal kalp hızının kalıcı artışı"}],"answer":2,"explanation":{"en":"Oxygen use remains elevated after exercise partly to restore high-energy phosphate and oxygen stores. Longer-lasting metabolic and temperature effects also contribute to recovery oxygen consumption.","tr":"Egzersiz sonrasında oksijen kullanımı kısmen yüksek enerjili fosfat ve oksijen depolarını yenilemek için yüksek kalır. Daha uzun süren metabolik ve sıcaklık etkileri de toparlanma dönemi oksijen tüketimine katkıda bulunur."},"sourcePages":[183,184],"difficulty":"core"}]},{"id":43,"title":{"en":"Exercise Testing","tr":"Egzersiz Testleri"},"startPage":185,"section":3,"endPage":188,"questions":[{"id":"c43q1","stem":{"en":"What is directly assessed by gas-exchange measurements during cardiopulmonary exercise testing?","tr":"Kardiyopulmoner egzersiz testinde gaz değişimi ölçümleriyle doğrudan ne değerlendirilir?"},"options":[{"en":"Oxygen uptake and carbon dioxide output during increasing work","tr":"Artan iş yükünde oksijen alımı ve karbondioksit atılımı"},{"en":"Coronary artery lumen diameter","tr":"Koroner arter lümen çapı"},{"en":"Right ventricular end-diastolic volume","tr":"Sağ ventrikül diyastol sonu hacmi"},{"en":"Pulmonary capillary wedge pressure","tr":"Pulmoner kapiller kama basıncı"},{"en":"Serum troponin release","tr":"Serum troponin salınımı"}],"answer":0,"explanation":{"en":"CPET integrates measured respiratory gas exchange with workload and cardiovascular responses. These measurements help assess exercise capacity, but they do not directly image coronary anatomy.","tr":"Kardiyopulmoner egzersiz testi ölçülen solunumsal gaz değişimini iş yükü ve kardiyovasküler yanıtlarla birlikte değerlendirir. Bu ölçümler egzersiz kapasitesini incelemeye yardımcı olur; koroner anatomiyi doğrudan görüntülemez."},"sourcePages":[185,186],"difficulty":"core"},{"id":"c43q2","stem":{"en":"Using the conventional value of 1 MET = 3.5 mL O₂/kg/min, what oxygen uptake corresponds to 4 METs?","tr":"Standart 1 MET = 3,5 mL O₂/kg/dk kabulüyle 4 MET hangi oksijen alımına karşılık gelir?"},"options":[{"en":"7 mL/kg/min","tr":"7 mL/kg/dk"},{"en":"10.5 mL/kg/min","tr":"10,5 mL/kg/dk"},{"en":"12 mL/kg/min","tr":"12 mL/kg/dk"},{"en":"14 mL/kg/min","tr":"14 mL/kg/dk"},{"en":"17.5 mL/kg/min","tr":"17,5 mL/kg/dk"}],"answer":3,"explanation":{"en":"Multiply the conventional resting value by the number of metabolic equivalents: 3.5 × 4 = 14. This is a standardised estimate of activity cost rather than an exact resting value for every person.","tr":"Standart istirahat değeri metabolik eşdeğer sayısıyla çarpılır: 3,5 × 4 = 14. Bu, her kişinin kesin istirahat değeri değil, aktivite maliyetinin standartlaştırılmış tahminidir."},"sourcePages":[186],"difficulty":"applied"},{"id":"c43q3","stem":{"en":"During CPET, carbon dioxide output is 1.5 L/min and oxygen uptake is 1.2 L/min. What is the respiratory exchange ratio?","tr":"Kardiyopulmoner egzersiz testinde karbondioksit atılımı 1,5 L/dk, oksijen alımı 1,2 L/dk’dır. Solunumsal değişim oranı kaçtır?"},"options":[{"en":"0.80","tr":"0,80"},{"en":"1.25","tr":"1,25"},{"en":"0.30","tr":"0,30"},{"en":"2.70","tr":"2,70"},{"en":"1.00","tr":"1,00"}],"answer":1,"explanation":{"en":"Respiratory exchange ratio equals carbon dioxide output divided by oxygen uptake. Here 1.5/1.2 = 1.25; taking the inverse would give 0.80.","tr":"Solunumsal değişim oranı karbondioksit atılımının oksijen alımına bölünmesidir. Burada 1,5/1,2 = 1,25 bulunur; tersini almak 0,80 sonucunu verir."},"sourcePages":[186],"difficulty":"applied"},{"id":"c43q4","stem":{"en":"What is the distinction between peak oxygen uptake and a demonstrated VO₂ maximum?","tr":"Zirve oksijen alımı ile gösterilmiş bir VO₂ maksimumu arasındaki fark nedir?"},"options":[{"en":"Peak uptake is measured only at rest","tr":"Zirve alım yalnız istirahatte ölçülür"},{"en":"VO₂ maximum is always lower than peak uptake from the same test","tr":"VO₂ maksimum aynı testin zirve alımından her zaman düşüktür"},{"en":"Peak uptake requires arterial catheterisation","tr":"Zirve alım arteriyel kateterizasyon gerektirir"},{"en":"The terms always prove an identical physiological plateau","tr":"İki terim her zaman aynı fizyolojik platonun kanıtlandığını gösterir"},{"en":"Peak uptake is the highest measured value; a plateau despite increasing workload is classical evidence of VO₂max","tr":"Zirve alım ölçülen en yüksek değerdir; iş yükü artarken plato oluşması VO₂ maksimumun klasik kanıtıdır"}],"answer":4,"explanation":{"en":"VO₂ peak is the highest oxygen uptake measured during the test. A plateau despite increasing workload classically supports VO₂max, but absence of a plateau alone does not prove inadequate effort or exclude maximal exercise.","tr":"VO₂ zirve, test sırasında ölçülen en yüksek oksijen alımıdır. İş yükü artarken plato oluşması klasik olarak VO₂ maksimumu destekler; ancak platonun olmaması tek başına yetersiz çabayı kanıtlamaz veya maksimal egzersizi dışlamaz."},"sourcePages":[186],"difficulty":"core"},{"id":"c43q5","stem":{"en":"Why can anaemia reduce peak exercise oxygen uptake despite normal arterial oxygen saturation?","tr":"Arteriyel oksijen satürasyonu normal olsa bile anemi zirve egzersiz oksijen alımını neden azaltabilir?"},"options":[{"en":"It necessarily increases pulmonary dead space","tr":"Pulmoner ölü boşluğu zorunlu olarak artırır"},{"en":"It prevents any increase in respiratory rate","tr":"Solunum hızının her türlü artışını engeller"},{"en":"It lowers blood oxygen-carrying capacity and can limit oxygen delivery","tr":"Kanın oksijen taşıma kapasitesini azaltıp oksijen sunumunu sınırlayabilir"},{"en":"It increases haemoglobin content per litre of blood","tr":"Bir litre kandaki hemoglobin içeriğini artırır"},{"en":"It makes arterial oxygen tension identical to venous oxygen tension","tr":"Arteriyel oksijen basıncını venöz oksijen basıncıyla eşitler"}],"answer":2,"explanation":{"en":"Saturation describes the fraction of haemoglobin binding sites occupied, not the amount of haemoglobin available. Reduced haemoglobin concentration can lower oxygen content and limit delivery during exercise.","tr":"Satürasyon, mevcut hemoglobin miktarını değil hemoglobinin bağlanma bölgelerinin dolu olan oranını gösterir. Azalmış hemoglobin konsantrasyonu oksijen içeriğini düşürüp egzersizde oksijen sunumunu sınırlayabilir."},"sourcePages":[186],"difficulty":"applied"}]},{"id":44,"title":{"en":"Neuronal Structure and Function","tr":"Nöronların Yapısı ve İşlevi"},"startPage":189,"section":4,"endPage":191,"questions":[{"id":"c44q1","stem":{"en":"Which pairing correctly identifies the myelin-forming cells in peripheral and central nervous systems?","tr":"Periferik ve merkezi sinir sistemlerinde miyelin oluşturan hücreleri hangi eşleştirme doğru verir?"},"options":[{"en":"Astrocytes in PNS; Schwann cells in CNS","tr":"PSS’de astrositler; MSS’de Schwann hücreleri"},{"en":"Microglia in PNS; astrocytes in CNS","tr":"PSS’de mikroglia; MSS’de astrositler"},{"en":"Oligodendrocytes in PNS; Schwann cells in CNS","tr":"PSS’de oligodendrositler; MSS’de Schwann hücreleri"},{"en":"Schwann cells in PNS; oligodendrocytes in CNS","tr":"PSS’de Schwann hücreleri; MSS’de oligodendrositler"},{"en":"Ependymal cells in PNS; microglia in CNS","tr":"PSS’de ependim hücreleri; MSS’de mikroglia"}],"answer":3,"explanation":{"en":"Schwann cells form peripheral myelin, while oligodendrocytes form central myelin. The electrically insulating sheath increases the speed of action-potential propagation.","tr":"Schwann hücreleri periferik, oligodendrositler merkezi miyelini oluşturur. Elektriksel yalıtım sağlayan kılıf aksiyon potansiyelinin yayılma hızını artırır."},"sourcePages":[189],"difficulty":"core"},{"id":"c44q2","stem":{"en":"Which neuronal component typically receives multiple synaptic inputs and conducts local signals towards the cell body?","tr":"Nöronun hangi bölümü genellikle çok sayıda sinaptik girdi alır ve lokal sinyalleri hücre gövdesine doğru iletir?"},"options":[{"en":"Dendrites","tr":"Dendritler"},{"en":"Axon terminal boutons","tr":"Akson terminal butonları"},{"en":"Myelin sheath","tr":"Miyelin kılıfı"},{"en":"Epineurium","tr":"Epinöryum"},{"en":"Neuromuscular endplate","tr":"Nöromüsküler son plak"}],"answer":0,"explanation":{"en":"Dendrites provide a branching receptive surface for incoming synaptic signals. The axon primarily carries the resulting action potentials towards downstream targets.","tr":"Dendritler gelen sinaptik sinyaller için dallanmış bir alıcı yüzey sağlar. Akson ise oluşan aksiyon potansiyellerini başlıca sonraki hedeflere doğru taşır."},"sourcePages":[189],"difficulty":"core"},{"id":"c44q3","stem":{"en":"What is the usual structural classification of a dorsal root ganglion sensory neuron?","tr":"Dorsal kök gangliyonundaki duyu nöronunun olağan yapısal tipi hangisidir?"},"options":[{"en":"Pyramidal","tr":"Piramidal"},{"en":"Anaxonic","tr":"Anaksonik"},{"en":"Multipolar motor","tr":"Multipolar motor"},{"en":"Bipolar retinal","tr":"Bipolar retinal"},{"en":"Pseudounipolar","tr":"Psödounipolar"}],"answer":4,"explanation":{"en":"Most dorsal root ganglion sensory neurons are pseudounipolar, with the cell body on a side process of the conducting pathway. Typical somatic motor neurons instead have a multipolar structure.","tr":"Dorsal kök gangliyonundaki duyu nöronlarının çoğu psödounipolardır; hücre gövdesi iletim yolunun yan uzantısında yer alır. Tipik somatik motor nöronlar ise multipolar yapıdadır."},"sourcePages":[190,191],"difficulty":"core"},{"id":"c44q4","stem":{"en":"Which connective-tissue layer surrounds a fascicle within a peripheral nerve?","tr":"Periferik sinirde bir fasikülü hangi bağ dokusu tabakası çevreler?"},"options":[{"en":"Endoneurium","tr":"Endonöryum"},{"en":"Perineurium","tr":"Perinöryum"},{"en":"Epineurium","tr":"Epinöryum"},{"en":"Myelin","tr":"Miyelin"},{"en":"Dura mater","tr":"Dura mater"}],"answer":1,"explanation":{"en":"The perineurium encloses a bundle of nerve fibres called a fascicle. Endoneurium surrounds individual fibres, while epineurium encloses the whole nerve and its multiple fascicles.","tr":"Perinöryum, fasikül denilen sinir lifi demetini sarar. Endonöryum tek tek lifleri, epinöryum ise birden çok fasikülüyle birlikte tüm siniri çevreler."},"sourcePages":[191],"difficulty":"core"},{"id":"c44q5","stem":{"en":"A collection of neuronal cell bodies in the peripheral nervous system is called what?","tr":"Periferik sinir sistemindeki nöron hücre gövdeleri topluluğuna ne denir?"},"options":[{"en":"Tract","tr":"Traktus"},{"en":"Nucleus","tr":"Çekirdek (nükleus)"},{"en":"Ganglion","tr":"Gangliyon"},{"en":"Fascicle","tr":"Fasikül"},{"en":"Commissure","tr":"Komissür"}],"answer":2,"explanation":{"en":"Peripheral collections of neuronal cell bodies are termed ganglia. Comparable cell-body groupings in the central nervous system are generally called nuclei.","tr":"Periferik nöron hücre gövdesi topluluklarına gangliyon denir. Merkezi sinir sistemindeki benzer hücre gövdesi grupları genellikle çekirdek olarak adlandırılır."},"sourcePages":[189],"difficulty":"core"}]},{"id":45,"title":{"en":"The Brain","tr":"Beyin"},"startPage":192,"section":4,"endPage":197,"questions":[{"id":"c45q1","stem":{"en":"A focal lesion of the right cerebellar hemisphere most directly causes which deficit?","tr":"Sağ serebellar hemisferdeki odaksal bir lezyon en doğrudan hangi bozukluğa yol açar?"},"options":[{"en":"Left-sided limb ataxia","tr":"Sol taraflı ekstremite ataksisi"},{"en":"Right-sided limb ataxia","tr":"Sağ taraflı ekstremite ataksisi"},{"en":"Right-sided spastic hemiparesis","tr":"Sağ taraflı spastik hemiparezi"},{"en":"Left-sided spastic hemiparesis","tr":"Sol taraflı spastik hemiparezi"},{"en":"Right-sided loss of pain and temperature alone","tr":"Yalnızca sağ taraflı ağrı ve sıcaklık kaybı"}],"answer":1,"explanation":{"en":"The cerebellar hemispheres refine coordination of the ipsilateral limbs. A cerebellar lesion therefore produces incoordination rather than the contralateral paralysis typical of a motor cortical lesion.","tr":"Serebellar hemisferler aynı taraftaki ekstremitelerin koordinasyonunu düzenler. Bu nedenle serebellar lezyon, motor korteks lezyonunda tipik olan karşı taraflı paralizi yerine koordinasyon bozukluğu oluşturur."},"sourcePages":[193],"difficulty":"applied"},{"id":"c45q2","stem":{"en":"Which sensory modality reaches its primary cortical targets without an obligatory initial thalamic relay?","tr":"Hangi duyu modalitesi, zorunlu bir ilk talamik aktarma olmadan primer kortikal hedeflerine ulaşır?"},"options":[{"en":"Vision","tr":"Görme"},{"en":"Hearing","tr":"İşitme"},{"en":"Vibration","tr":"Vibrasyon"},{"en":"Olfaction","tr":"Koku"},{"en":"Pain from the trunk","tr":"Gövdeden gelen ağrı"}],"answer":3,"explanation":{"en":"The thalamus relays most sensory information to the cerebral cortex. Olfaction is the key exception to this general arrangement; this does not mean that the thalamus has no role in later olfactory processing.","tr":"Talamus çoğu duyusal bilgiyi serebral kortekse iletir. Koku bu genel düzenin temel istisnasıdır; bu, talamusun kokunun sonraki işlenmesinde hiç rolü olmadığı anlamına gelmez."},"sourcePages":[192],"difficulty":"core"},{"id":"c45q3","stem":{"en":"Between which two meningeal layers does cerebrospinal fluid normally surround the brain?","tr":"Beyni çevreleyen beyin omurilik sıvısı normalde hangi iki meninks tabakası arasındadır?"},"options":[{"en":"Arachnoid mater and pia mater","tr":"Araknoid mater ile pia mater"},{"en":"Periosteal and meningeal dura","tr":"Periostal dura ile meningeal dura"},{"en":"Dura mater and arachnoid mater","tr":"Dura mater ile araknoid mater"},{"en":"Pia mater and cerebral cortex","tr":"Pia mater ile serebral korteks"},{"en":"Skull and periosteal dura","tr":"Kafatası ile periostal dura"}],"answer":0,"explanation":{"en":"The subarachnoid space lies between the arachnoid and pia and contains cerebrospinal fluid. The subdural space lies outside the arachnoid and is normally only a potential space.","tr":"Subaraknoid aralık, araknoid ile pia arasında yer alır ve beyin omurilik sıvısı içerir. Subdural aralık araknoidin dışındadır ve normalde yalnızca potansiyel bir aralıktır."},"sourcePages":[194],"difficulty":"core"},{"id":"c45q4","stem":{"en":"Which glial cell produces myelin around central nervous system axons?","tr":"Merkezi sinir sistemi aksonlarının çevresindeki miyelini hangi glia hücresi üretir?"},"options":[{"en":"Microglial cell","tr":"Mikroglia hücresi"},{"en":"Ependymal cell","tr":"Ependim hücresi"},{"en":"Schwann cell","tr":"Schwann hücresi"},{"en":"Astrocyte","tr":"Astrosit"},{"en":"Oligodendrocyte","tr":"Oligodendrosit"}],"answer":4,"explanation":{"en":"Oligodendrocytes form myelin in the central nervous system. Schwann cells have the corresponding role in peripheral nerves, whereas microglia mainly provide immune surveillance and phagocytosis.","tr":"Oligodendrositler merkezi sinir sisteminde miyelin oluşturur. Periferik sinirlerde bu görevi Schwann hücreleri üstlenirken mikroglia esas olarak immün gözetim ve fagositoz sağlar."},"sourcePages":[194],"difficulty":"core"},{"id":"c45q5","stem":{"en":"An infarct involving the primary visual cortex is most directly associated with which arterial territory?","tr":"Primer görme korteksini tutan bir infarkt en doğrudan hangi arterin beslediği alanla ilişkilidir?"},"options":[{"en":"Anterior cerebral artery","tr":"Anterior serebral arter"},{"en":"Middle cerebral artery","tr":"Orta serebral arter"},{"en":"Posterior cerebral artery","tr":"Posterior serebral arter"},{"en":"Superior cerebellar artery","tr":"Süperior serebellar arter"},{"en":"Posterior inferior cerebellar artery","tr":"Posterior inferior serebellar arter"}],"answer":2,"explanation":{"en":"The posterior cerebral arteries supply the occipital lobes, which contain the primary visual cortex. Their territory differs from the predominantly lateral cerebral territory supplied by the middle cerebral artery.","tr":"Posterior serebral arterler, primer görme korteksini içeren oksipital lobları besler. Bu alan, orta serebral arterin beslediği ağırlıklı olarak lateral serebral alandan farklıdır."},"sourcePages":[194,195],"difficulty":"applied"}]},{"id":46,"title":{"en":"Cerebrospinal Fluid","tr":"Beyin Omurilik Sıvısı"},"startPage":198,"section":4,"endPage":199,"questions":[{"id":"c46q1","stem":{"en":"Which structure is the principal site of cerebrospinal fluid production?","tr":"Beyin omurilik sıvısının başlıca üretim yeri hangi yapıdır?"},"options":[{"en":"Arachnoid granulations","tr":"Araknoid granülasyonlar"},{"en":"Dural venous sinus endothelium","tr":"Dural venöz sinüs endoteli"},{"en":"Choroid plexus","tr":"Koroid pleksus"},{"en":"Cerebral astrocyte end-feet","tr":"Serebral astrosit ayaksı çıkıntıları"},{"en":"Pial venous plexus","tr":"Pial venöz pleksus"}],"answer":2,"explanation":{"en":"The choroid plexus produces cerebrospinal fluid through epithelial secretory processes. Arachnoid granulations participate in fluid outflow rather than being its principal source.","tr":"Koroid pleksus, epiteldeki salgılama süreçleriyle beyin omurilik sıvısı üretir. Araknoid granülasyonlar sıvının başlıca kaynağı olmak yerine dışa akışına katılır."},"sourcePages":[198],"difficulty":"core"},{"id":"c46q2","stem":{"en":"Cerebrospinal fluid leaving a lateral ventricle enters the third ventricle through which opening?","tr":"Lateral ventrikülden ayrılan beyin omurilik sıvısı hangi açıklıktan üçüncü ventriküle geçer?"},"options":[{"en":"Cerebral aqueduct","tr":"Serebral akuadukt"},{"en":"Median aperture of Magendie","tr":"Magendie median açıklığı"},{"en":"Lateral aperture of Luschka","tr":"Luschka lateral açıklığı"},{"en":"Foramen magnum","tr":"Foramen magnum"},{"en":"Interventricular foramen of Monro","tr":"Monro interventriküler forameni"}],"answer":4,"explanation":{"en":"The foramina of Monro connect the lateral ventricles to the third ventricle. The cerebral aqueduct is the next narrow connection, carrying fluid from the third to the fourth ventricle.","tr":"Monro foramenleri lateral ventrikülleri üçüncü ventriküle bağlar. Sonraki dar bağlantı olan serebral akuadukt, sıvıyı üçüncü ventrikülden dördüncü ventriküle taşır."},"sourcePages":[198],"difficulty":"core"},{"id":"c46q3","stem":{"en":"Complete obstruction of the cerebral aqueduct most directly impedes flow between which compartments?","tr":"Serebral akuaduktun tam tıkanması, en doğrudan hangi bölmeler arasındaki akımı engeller?"},"options":[{"en":"Lateral ventricle and third ventricle","tr":"Lateral ventrikül ve üçüncü ventrikül"},{"en":"Third and fourth ventricles","tr":"Üçüncü ve dördüncü ventriküller"},{"en":"Fourth ventricle and subarachnoid cisterns","tr":"Dördüncü ventrikül ve subaraknoid sisternalar"},{"en":"Subarachnoid space and superior sagittal sinus","tr":"Subaraknoid aralık ve süperior sagittal sinüs"},{"en":"Cranial and spinal subarachnoid spaces","tr":"Kraniyal ve spinal subaraknoid aralıklar"}],"answer":1,"explanation":{"en":"The aqueduct connects the third ventricle to the fourth. Obstruction can cause upstream ventricular enlargement because cerebrospinal fluid production continues despite impaired drainage.","tr":"Akuadukt üçüncü ventrikülü dördüncü ventriküle bağlar. Drenajın bozulmasına rağmen beyin omurilik sıvısı üretimi sürdüğünden, tıkanıklığın öncesindeki ventriküller genişleyebilir."},"sourcePages":[198,199],"difficulty":"applied"},{"id":"c46q4","stem":{"en":"Why does cerebrospinal fluid pH change readily when arterial carbon dioxide rises?","tr":"Arteriyel karbondioksit arttığında beyin omurilik sıvısının pH değeri neden kolayca değişir?"},"options":[{"en":"Carbon dioxide crosses readily and the fluid has little protein buffering","tr":"Karbondioksit kolayca geçer ve sıvının protein tamponlama kapasitesi düşüktür"},{"en":"Hydrogen ions cross the barrier more readily than carbon dioxide","tr":"Hidrojen iyonları bariyeri karbondioksitten daha kolay geçer"},{"en":"Its high albumin concentration accelerates acid accumulation","tr":"Yüksek albümin konsantrasyonu asit birikimini hızlandırır"},{"en":"Its haemoglobin content provides less oxygen buffering","tr":"Hemoglobin içeriği daha az oksijen tamponlaması sağlar"},{"en":"Its bicarbonate concentration must first fall to zero","tr":"Önce bikarbonat konsantrasyonunun sıfıra düşmesi gerekir"}],"answer":0,"explanation":{"en":"Carbon dioxide diffuses into cerebrospinal fluid and generates hydrogen ions through its reaction with water. The low protein concentration provides less buffering than plasma, making these pH changes important to central respiratory chemoreception.","tr":"Karbondioksit beyin omurilik sıvısına difüze olur ve suyla tepkimesi sonucunda hidrojen iyonları oluşur. Düşük protein konsantrasyonu plazmaya göre daha az tamponlama sağladığından, bu pH değişiklikleri merkezi solunumsal kemoresepsiyon açısından önemlidir."},"sourcePages":[198,199],"difficulty":"applied"},{"id":"c46q5","stem":{"en":"With venous sinus pressure unchanged, which change favours cerebrospinal fluid absorption through arachnoid granulations?","tr":"Venöz sinüs basıncı değişmezken hangi değişiklik araknoid granülasyonlardan beyin omurilik sıvısı emilimini artırır?"},"options":[{"en":"A fall in cerebrospinal fluid pressure below venous pressure","tr":"Beyin omurilik sıvısı basıncının venöz basıncın altına düşmesi"},{"en":"An increase in outflow resistance at the granulations","tr":"Granülasyonlardaki dışa akış direncinin artması"},{"en":"A smaller cerebrospinal-fluid-to-venous pressure gradient","tr":"Beyin omurilik sıvısı ile ven arasındaki basınç gradyanının küçülmesi"},{"en":"A rise in cerebrospinal fluid pressure","tr":"Beyin omurilik sıvısı basıncının yükselmesi"},{"en":"A decrease in the number of patent arachnoid outflow channels","tr":"Açık araknoid dışa akış kanalı sayısının azalması"}],"answer":3,"explanation":{"en":"Flow through arachnoid granulations depends on the pressure gradient towards the venous sinuses. A higher cerebrospinal fluid pressure increases this driving gradient when venous pressure and outflow resistance are unchanged.","tr":"Araknoid granülasyonlardan akım, venöz sinüslere doğru olan basınç gradyanına bağlıdır. Venöz basınç ve dışa akış direnci değişmezken beyin omurilik sıvısı basıncının yükselmesi bu itici gradyanı artırır."},"sourcePages":[199],"difficulty":"applied"}]},{"id":47,"title":{"en":"Blood–Brain Barrier","tr":"Kan-Beyin Bariyeri"},"startPage":200,"section":4,"endPage":201,"questions":[{"id":"c47q1","stem":{"en":"Which feature provides the principal seal limiting movement between adjacent cerebral capillary endothelial cells?","tr":"Serebral kapiller endotelde komşu hücreler arasından geçişi sınırlayan temel bariyer hangi özelliktir?"},"options":[{"en":"Endothelial fenestrations","tr":"Endotel fenestrasyonları"},{"en":"Gap junctions","tr":"Oluklu bağlantılar"},{"en":"A discontinuous basement membrane","tr":"Kesintili bazal membran"},{"en":"Tight junctions","tr":"Sıkı bağlantılar"},{"en":"Neuronal myelin sheaths","tr":"Nöronal miyelin kılıfları"}],"answer":3,"explanation":{"en":"Tight junctions restrict paracellular passage across the cerebral endothelium. Astrocytes support barrier properties, but their presence does not replace the endothelial seal.","tr":"Sıkı bağlantılar serebral endotelden paraselüler geçişi sınırlar. Astrositler bariyer özelliklerini destekler, ancak varlıkları endotelin oluşturduğu sızdırmaz bağlantının yerini almaz."},"sourcePages":[200],"difficulty":"core"},{"id":"c47q2","stem":{"en":"Which substance crosses an intact blood–brain barrier mainly by simple diffusion?","tr":"Sağlam kan-beyin bariyerini esas olarak basit difüzyonla geçen madde hangisidir?"},"options":[{"en":"Carbon dioxide","tr":"Karbondioksit"},{"en":"Glucose","tr":"Glukoz"},{"en":"Dopamine","tr":"Dopamin"},{"en":"Sodium ions","tr":"Sodyum iyonları"},{"en":"Albumin","tr":"Albümin"}],"answer":0,"explanation":{"en":"Small lipid-soluble molecules such as carbon dioxide diffuse readily through cell membranes. Glucose needs a transporter, whereas charged ions and large plasma proteins do not cross freely by this route.","tr":"Karbondioksit gibi küçük, yağda çözünen moleküller hücre zarlarından kolayca difüze olur. Glukoz bir taşıyıcıya ihtiyaç duyar; yüklü iyonlar ve büyük plazma proteinleri ise bu yoldan serbestçe geçmez."},"sourcePages":[200],"difficulty":"core"},{"id":"c47q3","stem":{"en":"Which mechanism normally moves glucose across the blood–brain barrier?","tr":"Glukoz normalde kan-beyin bariyerini hangi mekanizmayla geçer?"},"options":[{"en":"Direct ATP-powered pumping of glucose","tr":"Glukozun doğrudan ATP kullanan pompayla taşınması"},{"en":"Paracellular filtration through endothelial clefts","tr":"Endotel yarıklarından paraselüler filtrasyon"},{"en":"GLUT1-mediated facilitated diffusion","tr":"GLUT1 aracılı kolaylaştırılmış difüzyon"},{"en":"Sodium–glucose cotransport as the main pathway","tr":"Temel yol olarak sodyum-glukoz kotransportu"},{"en":"Receptor-mediated endocytosis of glucose–albumin complexes","tr":"Glukoz-albümin komplekslerinin reseptör aracılı endositozu"}],"answer":2,"explanation":{"en":"Glucose crosses through GLUT1 by facilitated diffusion down a concentration gradient. The carrier does not directly hydrolyse ATP to move each glucose molecule.","tr":"Glukoz, konsantrasyon gradyanı yönünde GLUT1 üzerinden kolaylaştırılmış difüzyonla geçer. Taşıyıcı her glukoz molekülünü taşımak için doğrudan ATP hidroliz etmez."},"sourcePages":[200],"difficulty":"core"},{"id":"c47q4","stem":{"en":"Why can levodopa reach the brain more effectively than circulating dopamine?","tr":"Levodopa beyne neden dolaşımdaki dopaminden daha etkili biçimde ulaşabilir?"},"options":[{"en":"Levodopa is carried by the insulin-dependent GLUT4 transporter","tr":"Levodopa insüline bağımlı GLUT4 taşıyıcısıyla taşınır"},{"en":"Levodopa uses an amino acid transporter at the barrier","tr":"Levodopa bariyerdeki bir amino asit taşıyıcısını kullanır"},{"en":"Dopamine enters efficiently only when bound to albumin","tr":"Dopamin yalnızca albümine bağlıyken etkili biçimde girer"},{"en":"Levodopa reaches neurons by opening endothelial tight junctions","tr":"Levodopa endotel sıkı bağlantılarını açarak nöronlara ulaşır"},{"en":"Dopamine must first be conjugated with glucuronic acid to cross","tr":"Dopaminin geçebilmesi için önce glukuronik asitle konjuge edilmesi gerekir"}],"answer":1,"explanation":{"en":"Levodopa is carried across the barrier by a neutral amino acid transport system and can then be converted to dopamine. Dopamine itself crosses the intact barrier poorly.","tr":"Levodopa, nötral amino asit taşıma sistemiyle bariyeri geçer ve daha sonra dopamine dönüştürülebilir. Dopaminin kendisi sağlam bariyeri çok sınırlı geçer."},"sourcePages":[201],"difficulty":"applied"},{"id":"c47q5","stem":{"en":"Which region can detect circulating emetic substances because it lacks the usual blood–brain barrier?","tr":"Hangi bölge, olağan kan-beyin bariyerinden yoksun olduğu için dolaşımdaki emetik maddeleri algılayabilir?"},"options":[{"en":"Primary motor cortex","tr":"Primer motor korteks"},{"en":"Corpus callosum","tr":"Korpus kallozum"},{"en":"Internal capsule","tr":"İnternal kapsül"},{"en":"Primary visual cortex","tr":"Primer görme korteksi"},{"en":"Area postrema","tr":"Area postrema"}],"answer":4,"explanation":{"en":"The area postrema is a circumventricular region with relatively permeable capillaries. This allows blood-borne substances to influence emetic signalling without first crossing the usual cerebral capillary barrier.","tr":"Area postrema, kapillerleri görece geçirgen olan sirkumventriküler bir bölgedir. Böylece kandaki maddeler, olağan serebral kapiller bariyeri önce geçmek zorunda olmadan emetik sinyalleşmeyi etkileyebilir."},"sourcePages":[201],"difficulty":"core"}]},{"id":48,"title":{"en":"Cerebral Blood Flow","tr":"Serebral Kan Akımı"},"startPage":202,"section":4,"endPage":205,"questions":[{"id":"c48q1","stem":{"en":"If mean arterial pressure is 90 mmHg and intracranial pressure is 20 mmHg, what is cerebral perfusion pressure when intracranial pressure exceeds central venous pressure?","tr":"Ortalama arter basıncı 90 mmHg ve intrakraniyal basınç 20 mmHg ise, intrakraniyal basıncın santral venöz basınçtan yüksek olduğu durumda serebral perfüzyon basıncı kaçtır?"},"options":[{"en":"110 mmHg","tr":"110 mmHg"},{"en":"90 mmHg","tr":"90 mmHg"},{"en":"20 mmHg","tr":"20 mmHg"},{"en":"4.5 mmHg","tr":"4,5 mmHg"},{"en":"70 mmHg","tr":"70 mmHg"}],"answer":4,"explanation":{"en":"Under the stated conditions, cerebral perfusion pressure equals mean arterial pressure minus intracranial pressure. Thus 90 − 20 = 70 mmHg; adding the pressures would misrepresent the downstream pressure opposing perfusion.","tr":"Belirtilen koşullarda serebral perfüzyon basıncı, ortalama arter basıncından intrakraniyal basıncın çıkarılmasıyla bulunur. Dolayısıyla 90 − 20 = 70 mmHg olur; basınçları toplamak, perfüzyona karşı çıkış tarafındaki basıncın etkisini yanlış yansıtır."},"sourcePages":[202],"difficulty":"applied"},{"id":"c48q2","stem":{"en":"Within an intact autoregulatory range, how do cerebral arterioles respond to a rise in perfusion pressure?","tr":"Otoregülasyonun korunduğu aralıkta, serebral arteriyoller perfüzyon basıncındaki artışa nasıl yanıt verir?"},"options":[{"en":"Dilatation decreases resistance and amplifies flow","tr":"Genişleme direnci azaltır ve akımı daha da artırır"},{"en":"Constriction increases resistance and limits the rise in flow","tr":"Daralma direnci artırır ve akım artışını sınırlar"},{"en":"Unchanged calibre allows flow to rise in proportion to pressure","tr":"Çap değişmemesi akımın basınçla orantılı artmasına izin verir"},{"en":"Reduced smooth-muscle tone compensates for increased wall tension","tr":"Azalan düz kas tonusu artan duvar gerilimini telafi eder"},{"en":"Constriction decreases vascular resistance and increases flow","tr":"Daralma damar direncini azaltır ve akımı artırır"}],"answer":1,"explanation":{"en":"Autoregulation adjusts vascular resistance to stabilise blood flow despite changing perfusion pressure. A myogenic constrictor response to increased vessel-wall tension helps produce this compensation.","tr":"Otoregülasyon, perfüzyon basıncı değişse de kan akımını dengede tutmak için damar direncini ayarlar. Damar duvarı gerilimindeki artışa verilen miyojenik daralma yanıtı bu telafiye katkıda bulunur."},"sourcePages":[202],"difficulty":"applied"},{"id":"c48q3","stem":{"en":"With other variables unchanged, what is the usual acute effect of a moderate rise in arterial carbon dioxide on cerebral vessels?","tr":"Diğer değişkenler sabitken arteriyel karbondioksitteki orta dereceli artış serebral damarlarda genellikle hangi akut etkiyi oluşturur?"},"options":[{"en":"Arteriolar constriction and reduced cerebral blood flow","tr":"Arteriyol daralması ve serebral kan akımında azalma"},{"en":"Arteriolar dilatation with increased vascular resistance","tr":"Arteriyol genişlemesiyle birlikte damar direncinde artış"},{"en":"Reduced cerebral blood flow without a change in vessel tone","tr":"Damar tonusu değişmeden serebral kan akımında azalma"},{"en":"Arteriolar dilatation and increased cerebral blood flow","tr":"Arteriyol genişlemesi ve serebral kan akımında artış"},{"en":"Unchanged flow because autoregulation removes the chemical response","tr":"Otoregülasyon kimyasal yanıtı kaldırdığı için akımın değişmemesi"}],"answer":3,"explanation":{"en":"An acute rise in arterial carbon dioxide dilates cerebral resistance vessels and reduces vascular resistance. Hypocapnia produces the opposite response and can reduce cerebral blood flow.","tr":"Arteriyel karbondioksitteki akut artış, serebral direnç damarlarını genişleterek damar direncini azaltır. Hipokapni ters yanıtı oluşturur ve serebral kan akımını azaltabilir."},"sourcePages":[203],"difficulty":"core"},{"id":"c48q4","stem":{"en":"When arterial oxygen tension becomes markedly low, which cerebral vascular response helps preserve oxygen delivery?","tr":"Arteriyel oksijen basıncı belirgin şekilde düştüğünde, hangi serebral damar yanıtı oksijen sunumunu korumaya yardımcı olur?"},"options":[{"en":"Cerebral arteriolar constriction","tr":"Serebral arteriyol daralması"},{"en":"Increased cerebral vascular resistance at fixed perfusion pressure","tr":"Sabit perfüzyon basıncında serebral damar direncinin artması"},{"en":"Cerebral arteriolar dilatation","tr":"Serebral arteriyol genişlemesi"},{"en":"Reduced regional blood flow to metabolically active tissue","tr":"Metabolik olarak aktif dokuya bölgesel kan akımının azalması"},{"en":"Suppression of local metabolic vasodilatation","tr":"Yerel metabolik vazodilatasyonun baskılanması"}],"answer":2,"explanation":{"en":"Marked hypoxaemia triggers cerebral vasodilatation and increases blood flow. Near normal oxygen tensions have much less influence on cerebral vascular tone than severe hypoxaemia does.","tr":"Belirgin hipoksemi serebral vazodilatasyonu tetikler ve kan akımını artırır. Normale yakın oksijen basınçlarının serebral damar tonusu üzerindeki etkisi, ağır hipoksemininkinden çok daha azdır."},"sourcePages":[203,204],"difficulty":"applied"},{"id":"c48q5","stem":{"en":"An active cortical region receives more blood during a task. Which principle best explains this?","tr":"Bir görev sırasında aktif bir kortikal bölgeye daha fazla kan gider. Bunu en iyi açıklayan ilke hangisidir?"},"options":[{"en":"Local flow–metabolism coupling","tr":"Yerel akım-metabolizma eşleşmesi"},{"en":"Pressure autoregulation responding to a local increase in arterial pressure","tr":"Yerel arter basıncı artışına yanıt veren basınç otoregülasyonu"},{"en":"A fall in whole-body blood viscosity during the task","tr":"Görev sırasında tüm vücutta kan viskozitesinin azalması"},{"en":"Sympathetic constriction of the active region’s arterioles","tr":"Aktif bölgenin arteriyollerinde sempatik daralma"},{"en":"Reduced extraction of oxygen as the sole cause of increased flow","tr":"Artmış akımın tek nedeni olarak oksijen ekstraksiyonunun azalması"}],"answer":0,"explanation":{"en":"Neural activity increases local metabolic demand and signals that dilate nearby resistance vessels. Regional blood flow therefore rises to support the active tissue rather than remaining identical throughout the brain.","tr":"Sinirsel aktivite yerel metabolik ihtiyacı ve yakındaki direnç damarlarını genişleten sinyalleri artırır. Bu nedenle bölgesel kan akımı, beynin her yerinde aynı kalmak yerine aktif dokuyu desteklemek için yükselir."},"sourcePages":[203],"difficulty":"applied"}]},{"id":49,"title":{"en":"Intracranial Pressure and Head Injury","tr":"İntrakraniyal Basınç ve Kafa Travması"},"startPage":206,"section":4,"endPage":210,"questions":[{"id":"c49q1","stem":{"en":"In an adult with an intact rigid skull, which change initially helps compensate for a slowly expanding intracranial mass?","tr":"Kafatası sağlam ve rijit olan bir erişkinde, yavaş büyüyen intrakraniyal kitle başlangıçta hangi değişiklikle telafi edilir?"},"options":[{"en":"Displacement of cerebrospinal fluid into the spinal compartment","tr":"Beyin omurilik sıvısının spinal bölmeye yer değiştirmesi"},{"en":"Retention of additional cerebrospinal fluid within the ventricles","tr":"Ventriküllerde ek beyin omurilik sıvısı tutulması"},{"en":"An increase in intracranial venous blood volume","tr":"İntrakraniyal venöz kan hacminin artması"},{"en":"Reduced absorption at arachnoid granulations","tr":"Araknoid granülasyonlardan emilimin azalması"},{"en":"Expansion of cerebral extracellular fluid volume","tr":"Serebral hücre dışı sıvı hacminin artması"}],"answer":0,"explanation":{"en":"The Monro–Kellie principle describes competition for space between brain tissue, blood and cerebrospinal fluid in a rigid cranium. Displacement of fluid and venous blood provides limited compensation before pressure rises steeply.","tr":"Monro-Kellie ilkesi, rijit kafatasında beyin dokusu, kan ve beyin omurilik sıvısının ortak sabit hacmi paylaştığını belirtir. Sıvının ve venöz kanın yer değiştirmesi, basınç dik biçimde yükselmeden önce sınırlı bir telafi sağlar."},"sourcePages":[206,207],"difficulty":"applied"},{"id":"c49q2","stem":{"en":"What does a steep intracranial pressure–volume curve indicate?","tr":"İntrakraniyal basınç-hacim eğrisinin dikleşmesi neyi gösterir?"},"options":[{"en":"High compliance, so added volume causes only a small pressure rise","tr":"Ek hacmin küçük basınç artışı oluşturduğu yüksek kompliyansı"},{"en":"A large remaining reserve for displacement of cerebrospinal fluid","tr":"Beyin omurilik sıvısının yer değiştirmesi için büyük rezerv kaldığını"},{"en":"Low compliance, so a small added volume causes a large pressure rise","tr":"Düşük kompliyans nedeniyle küçük hacim artışının büyük basınç artışı oluşturmasını"},{"en":"A lower change in pressure per unit change in volume","tr":"Birim hacim değişikliği başına basınç değişikliğinin azaldığını"},{"en":"A larger change in volume per unit change in pressure","tr":"Birim basınç değişikliği başına hacim değişikliğinin arttığını"}],"answer":2,"explanation":{"en":"Intracranial compliance is the change in volume divided by the resulting change in pressure. Once compensatory reserve is exhausted, even a small additional volume can produce a large pressure increase.","tr":"İntrakraniyal kompliyans, hacim değişikliğinin bunun oluşturduğu basınç değişikliğine oranıdır. Telafi rezervi tükendiğinde küçük bir ek hacim bile büyük basınç artışı oluşturabilir."},"sourcePages":[207],"difficulty":"applied"},{"id":"c49q3","stem":{"en":"In the Cushing response, what most directly explains bradycardia accompanying systemic hypertension?","tr":"Cushing yanıtında sistemik hipertansiyona eşlik eden bradikardiyi en doğrudan ne açıklar?"},"options":[{"en":"Direct beta-1 stimulation of the sinoatrial node","tr":"Sinoatriyal düğümün doğrudan beta-1 uyarılması"},{"en":"Atrial stretch producing a Bainbridge response","tr":"Atriyal gerilmenin Bainbridge yanıtı oluşturması"},{"en":"Withdrawal of vagal tone after arterial pressure rises","tr":"Arter basıncı yükseldikten sonra vagal tonusun azalması"},{"en":"A fall in intracranial pressure suppressing the vasomotor centre","tr":"İntrakraniyal basınç azalmasının vazomotor merkezi baskılaması"},{"en":"An arterial baroreceptor response to the rise in blood pressure","tr":"Kan basıncı artışına verilen arteriyel baroreseptör yanıtı"}],"answer":4,"explanation":{"en":"Brainstem ischaemia can provoke a strong sympathetic pressor response that raises systemic arterial pressure. Arterial baroreceptors then generate reflex bradycardia; this is a late warning response rather than a sign of adequate cerebral safety.","tr":"Beyin sapı iskemisi, sistemik arter basıncını yükselten güçlü bir sempatik basınç yanıtını tetikleyebilir. Ardından arteriyel baroreseptörler refleks bradikardi oluşturur; bu, beynin güvende olduğunu değil, geç bir uyarı yanıtını gösterir."},"sourcePages":[207],"difficulty":"applied"},{"id":"c49q4","stem":{"en":"Which intracranial pressure-monitoring device can also remove cerebrospinal fluid?","tr":"Hangi intrakraniyal basınç izleme aracı beyin omurilik sıvısını da boşaltabilir?"},"options":[{"en":"Intraparenchymal fibre-optic sensor","tr":"İntraparenkimal fiberoptik sensör"},{"en":"Subdural pressure sensor","tr":"Subdural basınç sensörü"},{"en":"Epidural pressure sensor","tr":"Epidural basınç sensörü"},{"en":"External ventricular drain","tr":"Eksternal ventriküler dren"},{"en":"Intraparenchymal strain-gauge sensor","tr":"İntraparenkimal gerinim ölçerli sensör"}],"answer":3,"explanation":{"en":"An external ventricular drain accesses the ventricular cerebrospinal fluid compartment, allowing both pressure assessment and drainage. A parenchymal pressure sensor measures local pressure but has no route for draining cerebrospinal fluid.","tr":"Eksternal ventriküler dren, ventriküldeki beyin omurilik sıvısı bölmesine erişerek hem basınç değerlendirmesine hem drenaja olanak verir. Parenkimal basınç sensörü yerel basıncı ölçer, ancak beyin omurilik sıvısını boşaltacak bir yolu yoktur."},"sourcePages":[206],"difficulty":"core"},{"id":"c49q5","stem":{"en":"Which event is an example of secondary rather than primary traumatic brain injury?","tr":"Hangi olay primer travmatik beyin hasarından ziyade sekonder hasara örnektir?"},"options":[{"en":"Axonal tearing at the instant of impact","tr":"Darbe anında aksonların yırtılması"},{"en":"Hypoxic neuronal injury caused by subsequent hypoxaemia","tr":"Sonradan gelişen hipoksemiye bağlı hipoksik nöron hasarı"},{"en":"Immediate tissue disruption by a penetrating object","tr":"Penetran cismin dokuyu anında parçalaması"},{"en":"Mechanical stretching of axons during the collision","tr":"Çarpışma sırasında aksonların mekanik gerilmesi"},{"en":"Vascular tearing caused directly by the impact","tr":"Darbenin doğrudan oluşturduğu damar yırtılması"}],"answer":1,"explanation":{"en":"Primary injury occurs from the mechanical forces of the initial trauma. Secondary injury develops through later physiological and cellular disturbances such as hypoxaemia, ischaemia, oedema or seizures.","tr":"Primer hasar, ilk travmanın mekanik kuvvetleriyle oluşur. Sekonder hasar ise hipoksemi, iskemi, ödem veya nöbet gibi daha sonraki fizyolojik ve hücresel bozukluklarla gelişir."},"sourcePages":[209],"difficulty":"applied"}]},{"id":50,"title":{"en":"The Spinal Cord","tr":"Omurilik"},"startPage":211,"section":4,"endPage":220,"questions":[{"id":"c50q1","stem":{"en":"Where do dorsal column fibres first synapse before their second-order neurons cross the midline?","tr":"Dorsal kolon lifleri, ikinci sıra nöronları orta hattı çaprazlamadan önce ilk sinapslarını nerede yapar?"},"options":[{"en":"Dorsal horn at the entry segment","tr":"Giriş segmentindeki arka boynuzda"},{"en":"Gracile and cuneate nuclei in the medulla","tr":"Medulladaki grasil ve kuneat çekirdeklerde"},{"en":"Ventral posterior thalamic nucleus","tr":"Talamusun ventral posterior çekirdeğinde"},{"en":"Anterior horn at the entry segment","tr":"Giriş segmentindeki ön boynuzda"},{"en":"Dorsal root ganglion","tr":"Dorsal kök gangliyonunda"}],"answer":1,"explanation":{"en":"Dorsal column first-order neurons ascend ipsilaterally to the medulla. After synapsing in the gracile or cuneate nucleus, second-order fibres cross and ascend in the medial lemniscus.","tr":"Dorsal kolonun birinci sıra nöronları aynı taraftan medullaya yükselir. Grasil veya kuneat çekirdekte sinaps yaptıktan sonra ikinci sıra lifler çaprazlayarak medial lemniskusta yükselir."},"sourcePages":[213],"difficulty":"core"},{"id":"c50q2","stem":{"en":"Which sensory function is typically preserved in anterior spinal artery syndrome?","tr":"Anterior spinal arter sendromunda tipik olarak hangi duyu işlevi korunur?"},"options":[{"en":"Pain perception below the lesion","tr":"Lezyon altında ağrı algısı"},{"en":"Temperature discrimination below the lesion","tr":"Lezyon altında sıcaklık ayırımı"},{"en":"Pain and temperature together","tr":"Ağrı ve sıcaklık birlikte"},{"en":"Vibration and joint position sense","tr":"Vibrasyon ve eklem pozisyon duyusu"},{"en":"Spinothalamic sensory transmission","tr":"Spinotalamik duyusal iletim"}],"answer":3,"explanation":{"en":"The anterior spinal artery supplies most of the anterior two-thirds of the cord, including motor and spinothalamic pathways. Dorsal columns have a posterior arterial supply, so their vibration and proprioceptive functions may be spared.","tr":"Anterior spinal arter, motor ve spinotalamik yollar dahil omuriliğin ön üçte ikisinin büyük bölümünü besler. Dorsal kolonlar posterior arterlerden beslendiğinden vibrasyon ve propriosepsiyon işlevleri korunabilir."},"sourcePages":[212,213],"difficulty":"applied"},{"id":"c50q3","stem":{"en":"A right thoracic cord hemisection causes which characteristic pattern below the lesion?","tr":"Sağ torakal omurilik hemiseksiyonu, lezyon altında hangi karakteristik örüntüyü oluşturur?"},"options":[{"en":"Right motor and vibration loss with left pain and temperature loss","tr":"Sağda motor ve vibrasyon kaybı, solda ağrı ve sıcaklık kaybı"},{"en":"Left motor and vibration loss with right pain and temperature loss","tr":"Solda motor ve vibrasyon kaybı, sağda ağrı ve sıcaklık kaybı"},{"en":"Right motor, vibration, pain and temperature loss","tr":"Sağda motor, vibrasyon, ağrı ve sıcaklık kaybı"},{"en":"Right motor loss with left vibration and right pain loss","tr":"Sağda motor kaybı, solda vibrasyon ve sağda ağrı kaybı"},{"en":"Left motor loss with right vibration and left pain loss","tr":"Solda motor kaybı, sağda vibrasyon ve solda ağrı kaybı"}],"answer":0,"explanation":{"en":"Below a cord hemisection, corticospinal and dorsal column deficits are ipsilateral. Spinothalamic fibres have already crossed in the spinal cord, producing contralateral pain and temperature loss, usually beginning slightly below the lesion.","tr":"Omurilik hemiseksiyonunun altında kortikospinal ve dorsal kolon bozuklukları aynı taraftadır. Spinotalamik lifler omurilikte daha önce çaprazladığından, genellikle lezyonun biraz altından başlayan karşı taraflı ağrı ve sıcaklık kaybı oluşur."},"sourcePages":[213,214,219],"difficulty":"applied"},{"id":"c50q4","stem":{"en":"Which finding specifically describes spinal shock immediately after a major spinal cord injury?","tr":"Büyük bir omurilik yaralanmasının hemen ardından spinal şoku özellikle tanımlayan bulgu hangisidir?"},"options":[{"en":"Hypotension from loss of sympathetic vascular tone","tr":"Sempatik damar tonusu kaybına bağlı hipotansiyon"},{"en":"Spasticity with brisk tendon reflexes below the lesion","tr":"Lezyon altında spastisite ve canlı tendon refleksleri"},{"en":"Bradycardia from interruption of cardiac sympathetic pathways","tr":"Kardiyak sempatik yolların kesilmesine bağlı bradikardi"},{"en":"Hypertensive episodes triggered by bladder distension","tr":"Mesane gerilmesiyle tetiklenen hipertansif ataklar"},{"en":"Flaccidity and absent reflexes below the lesion","tr":"Lezyon altında flask tonus ve refleks kaybı"}],"answer":4,"explanation":{"en":"Spinal shock refers to the early loss of reflex activity and muscle tone below the injury. Neurogenic shock is a distinct haemodynamic problem involving loss of sympathetic vascular tone and hypotension.","tr":"Spinal şok, yaralanmanın altındaki refleks aktivite ve kas tonusunun erken dönemde kaybolmasını ifade eder. Nörojenik şok ise sempatik damar tonusunun kaybı ve hipotansiyonla seyreden ayrı bir hemodinamik sorundur."},"sourcePages":[217],"difficulty":"applied"},{"id":"c50q5","stem":{"en":"At approximately which vertebral level does the adult spinal cord usually terminate?","tr":"Erişkinde omurilik genellikle yaklaşık hangi vertebra düzeyinde sonlanır?"},"options":[{"en":"C7–T1","tr":"C7–T1"},{"en":"T5–T6","tr":"T5–T6"},{"en":"L1–L2","tr":"L1–L2"},{"en":"L5–S1","tr":"L5–S1"},{"en":"S3–S4","tr":"S3–S4"}],"answer":2,"explanation":{"en":"The conus medullaris usually lies near L1–L2 in adults, although individual variation exists. Nerve roots continue below this level as the cauda equina, while the dural sac extends further caudally.","tr":"Konus medullaris erişkinde genellikle L1–L2 yakınındadır; bireysel farklılıklar olabilir. Sinir kökleri bu düzeyin altında kauda ekuina olarak devam ederken dural kese daha kaudale uzanır."},"sourcePages":[211],"difficulty":"core"}]},{"id":51,"title":{"en":"Resting Membrane Potential","tr":"İstirahat Membran Potansiyeli"},"startPage":221,"section":4,"endPage":224,"questions":[{"id":"c51q1","stem":{"en":"Why is a typical neuronal resting membrane potential much closer to the potassium equilibrium potential than to the sodium equilibrium potential?","tr":"Tipik nöronal istirahat membran potansiyeli neden sodyum denge potansiyelinden çok potasyum denge potansiyeline yakındır?"},"options":[{"en":"The resting membrane is much more permeable to sodium","tr":"İstirahatte membran sodyuma çok daha geçirgendir"},{"en":"The pump moves more potassium outward than sodium inward","tr":"Pompa içeri aldığı sodyumdan daha fazla potasyumu dışarı taşır"},{"en":"The resting membrane is much more permeable to potassium","tr":"İstirahatte membran potasyuma çok daha geçirgendir"},{"en":"The potassium concentration is normally higher outside the cell","tr":"Potasyum konsantrasyonu normalde hücre dışında daha yüksektir"},{"en":"The electrical gradient drives potassium outward at negative potentials","tr":"Elektriksel gradyan negatif potansiyellerde potasyumu dışarı iter"}],"answer":2,"explanation":{"en":"Potassium leak conductance dominates the resting neuronal membrane. Potassium efflux leaves the interior relatively negative until the opposing electrical gradient limits further net movement.","tr":"İstirahatte nöron membranında potasyum kaçak iletkenliği baskındır. Potasyum çıkışı hücre içini görece negatif yapar; oluşan ters yönlü elektriksel gradyan daha fazla net hareketi sınırlar."},"sourcePages":[221,222],"difficulty":"core"},{"id":"c51q2","stem":{"en":"What does the Nernst equilibrium potential for an ion represent?","tr":"Bir iyon için Nernst denge potansiyeli neyi ifade eder?"},"options":[{"en":"The voltage at which that ion’s concentrations become equal on both sides","tr":"O iyonun iki taraftaki konsantrasyonlarının eşitlendiği voltajı"},{"en":"The threshold voltage for opening that ion’s voltage-gated channel","tr":"O iyonun voltaj kapılı kanalının açılma eşiğini"},{"en":"The resting voltage produced by all membrane-permeant ions together","tr":"Membrandan geçen tüm iyonların birlikte oluşturduğu istirahat voltajını"},{"en":"The action-potential peak reached regardless of ion concentrations","tr":"İyon konsantrasyonlarından bağımsız ulaşılan aksiyon potansiyeli tepesini"},{"en":"The voltage at which electrical and concentration gradients balance for that ion","tr":"O iyon için elektriksel ve konsantrasyon gradyanlarının dengelendiği voltajı"}],"answer":4,"explanation":{"en":"At an ion’s equilibrium potential, its chemical and electrical driving forces oppose one another equally. Net movement of that ion is therefore zero, although individual ions can still move in both directions.","tr":"Bir iyonun denge potansiyelinde, kimyasal ve elektriksel itici kuvvetleri birbirine eşit ve zıt yöndedir. Bu nedenle o iyonun net hareketi sıfırdır; tek tek iyonlar yine de iki yönde hareket edebilir."},"sourcePages":[222],"difficulty":"core"},{"id":"c51q3","stem":{"en":"Which transport cycle correctly describes the sodium–potassium ATPase?","tr":"Hangi taşıma döngüsü sodyum-potasyum ATPazı doğru tanımlar?"},"options":[{"en":"Two sodium ions out and three potassium ions in per ATP","tr":"Her ATP için iki sodyum iyonu dışarı, üç potasyum iyonu içeri"},{"en":"Three sodium ions out and two potassium ions in per ATP","tr":"Her ATP için üç sodyum iyonu dışarı, iki potasyum iyonu içeri"},{"en":"Three sodium ions in and two potassium ions out per ATP","tr":"Her ATP için üç sodyum iyonu içeri, iki potasyum iyonu dışarı"},{"en":"Equal numbers of sodium and potassium out per ATP","tr":"Her ATP için eşit sayıda sodyum ve potasyum dışarı"},{"en":"Potassium out in exchange for calcium in","tr":"Kalsiyum girişi karşılığında potasyum çıkışı"}],"answer":1,"explanation":{"en":"The pump maintains low intracellular sodium and high intracellular potassium. Exporting three positive charges while importing two also produces a small direct hyperpolarising, electrogenic effect.","tr":"Pompa, hücre içi sodyumu düşük ve potasyumu yüksek tutar. Üç pozitif yükü dışarı verirken iki pozitif yükü içeri alması, küçük bir doğrudan hiperpolarizan elektrojenik etki de oluşturur."},"sourcePages":[223],"difficulty":"core"},{"id":"c51q4","stem":{"en":"Compared with the Nernst equation for one ion, what additional feature is included in the Goldman–Hodgkin–Katz membrane-potential equation?","tr":"Tek iyon için Nernst denklemine kıyasla Goldman-Hodgkin-Katz membran potansiyeli denklemi hangi ek özelliği içerir?"},"options":[{"en":"The relative permeabilities of several ions","tr":"Birden fazla iyonun göreli geçirgenliklerini"},{"en":"Only the concentration gradient of one selected ion","tr":"Yalnızca seçilen tek iyonun konsantrasyon gradyanını"},{"en":"The rate of ATP hydrolysis in every membrane pump","tr":"Her membran pompasının ATP hidroliz hızını"},{"en":"The voltage-gated opening time of each channel","tr":"Her kanalın voltaja bağlı açılma süresini"},{"en":"The axial resistance and anatomical length of the axon","tr":"Aksonun eksenel direncini ve anatomik uzunluğunu"}],"answer":0,"explanation":{"en":"The Goldman–Hodgkin–Katz equation combines concentration gradients with the membrane permeabilities of multiple ions. If permeability is restricted to potassium, its expression reduces to the potassium Nernst relationship.","tr":"Goldman-Hodgkin-Katz denklemi, birden fazla iyonun konsantrasyon gradyanlarını membran geçirgenlikleriyle birlikte değerlendirir. Geçirgenlik yalnızca potasyumla sınırlıysa denklem potasyum için Nernst ilişkisine indirgenir."},"sourcePages":[222,223],"difficulty":"core"},{"id":"c51q5","stem":{"en":"How does hypocalcaemia commonly increase neuromuscular excitability?","tr":"Hipokalsemi nöromüsküler uyarılabilirliği genellikle nasıl artırır?"},"options":[{"en":"It moves the excitation threshold further from the resting potential","tr":"Uyarılma eşiğini istirahat potansiyelinden uzaklaştırır"},{"en":"It primarily increases the intracellular potassium concentration","tr":"Öncelikle hücre içi potasyum konsantrasyonunu artırır"},{"en":"It raises the potassium equilibrium potential without changing channel gating","tr":"Kanal kapılanmasını değiştirmeden potasyum denge potansiyelini yükseltir"},{"en":"It shifts the excitation threshold closer to the resting potential","tr":"Uyarılma eşiğini istirahat potansiyeline yaklaştırır"},{"en":"It stabilises sodium channels in a less excitable state","tr":"Sodyum kanallarını daha az uyarılabilir durumda stabilize eder"}],"answer":3,"explanation":{"en":"Extracellular calcium influences membrane surface charge and the voltage dependence of excitation. Low calcium can bring threshold nearer the resting potential, so smaller stimuli trigger action potentials even without a major resting-potential change.","tr":"Hücre dışı kalsiyum, membran yüzey yükünü ve uyarılmanın voltaja bağımlılığını etkiler. Düşük kalsiyum, istirahat potansiyelinde büyük değişiklik olmadan eşiği ona yaklaştırabilir; böylece daha küçük uyaranlar aksiyon potansiyeli başlatır."},"sourcePages":[224],"difficulty":"applied"}]},{"id":52,"title":{"en":"Nerve Action Potential and Propagation","tr":"Sinir Aksiyon Potansiyeli ve Yayılımı"},"startPage":225,"section":4,"endPage":230,"questions":[{"id":"c52q1","stem":{"en":"Which event produces the rapid upstroke of a typical nerve action potential?","tr":"Tipik bir sinir aksiyon potansiyelinin hızlı yükseliş fazını hangi olay oluşturur?"},"options":[{"en":"Opening of voltage-gated potassium channels and potassium efflux","tr":"Voltaj kapılı potasyum kanallarının açılması ve potasyum çıkışı"},{"en":"Opening of chloride channels and chloride influx","tr":"Klorür kanallarının açılması ve klorür girişi"},{"en":"Increased electrogenic sodium–potassium pump activity","tr":"Elektrojenik sodyum-potasyum pompası aktivitesinin artması"},{"en":"Opening of voltage-gated sodium channels and sodium influx","tr":"Voltaj kapılı sodyum kanallarının açılması ve sodyum girişi"},{"en":"Opening of L-type calcium channels as the dominant inward current","tr":"Baskın içe akım olarak L tipi kalsiyum kanallarının açılması"}],"answer":3,"explanation":{"en":"Once threshold is reached, sodium entry causes further depolarisation and opens additional voltage-gated sodium channels. This regenerative positive feedback creates the fast rising phase.","tr":"Eşiğe ulaşıldığında sodyum girişi daha fazla depolarizasyona ve ek voltaj kapılı sodyum kanallarının açılmasına yol açar. Bu kendini güçlendiren pozitif geri bildirim hızlı yükseliş fazını oluşturur."},"sourcePages":[225],"difficulty":"core"},{"id":"c52q2","stem":{"en":"What primarily causes the brief after-hyperpolarisation following a nerve action potential?","tr":"Sinir aksiyon potansiyelinden sonraki kısa ard-hiperpolarizasyonun temel nedeni nedir?"},"options":[{"en":"Potassium conductance remains increased while voltage-gated potassium channels close slowly","tr":"Voltaj kapılı potasyum kanalları yavaş kapanırken potasyum iletkenliğinin yüksek kalması"},{"en":"Sodium conductance remains above its peak upstroke value","tr":"Sodyum iletkenliği yükseliş fazındaki tepe değerinin üzerinde kalır"},{"en":"Potassium conductance falls below its resting value","tr":"Potasyum iletkenliği istirahat değerinin altına düşer"},{"en":"Delayed calcium entry sustains the depolarisation","tr":"Gecikmiş kalsiyum girişi depolarizasyonu sürdürür"},{"en":"Sodium–potassium ATPase transiently reverses its usual transport direction","tr":"Sodyum-potasyum ATPaz olağan taşıma yönünü geçici olarak tersine çevirir"}],"answer":0,"explanation":{"en":"Delayed closure of voltage-gated potassium channels leaves potassium permeability temporarily above its resting level. The membrane therefore moves closer to the more negative potassium equilibrium potential before returning to rest.","tr":"Voltaj kapılı potasyum kanallarının gecikmiş kapanması, potasyum geçirgenliğini geçici olarak istirahat düzeyinin üzerinde tutar. Membran böylece istirahate dönmeden önce daha negatif olan potasyum denge potansiyeline yaklaşır."},"sourcePages":[225],"difficulty":"core"},{"id":"c52q3","stem":{"en":"Why can no second action potential be triggered during the absolute refractory period?","tr":"Mutlak refrakter dönemde neden ikinci bir aksiyon potansiyeli başlatılamaz?"},"options":[{"en":"The membrane is slightly hyperpolarised but all sodium channels are available","tr":"Membran hafif hiperpolarizedir, ancak tüm sodyum kanalları kullanılabilirdir"},{"en":"Sodium activation gates require a larger stimulus but can still all reopen","tr":"Sodyum aktivasyon kapıları daha büyük uyaranla yine tamamen açılabilir"},{"en":"Voltage-gated sodium channels have not recovered from inactivation","tr":"Voltaj kapılı sodyum kanalları inaktivasyondan henüz çıkmamıştır"},{"en":"Potassium leakage has restored exact equality of sodium concentrations","tr":"Potasyum kaçağı sodyum konsantrasyonlarını tam olarak eşitlemiştir"},{"en":"The sodium–potassium pump must transport every sodium ion from the previous spike","tr":"Sodyum-potasyum pompasının önceki uyarıdaki her sodyum iyonunu taşıması gerekir"}],"answer":2,"explanation":{"en":"After opening, sodium channels enter an inactivated state and require repolarisation to recover. A stronger stimulus cannot bypass this channel-state limitation during the absolute refractory period.","tr":"Sodyum kanalları açıldıktan sonra inaktive duruma geçer ve yeniden kullanılabilir hale gelmek için repolarizasyona ihtiyaç duyar. Mutlak refrakter dönemde daha güçlü bir uyaran bu kanal durumu kısıtını aşamaz."},"sourcePages":[229,230],"difficulty":"core"},{"id":"c52q4","stem":{"en":"Which combination explains how myelin increases conduction speed?","tr":"Miyelinin iletim hızını artırmasını hangi değişiklik çifti açıklar?"},"options":[{"en":"Decreased membrane resistance and increased membrane capacitance","tr":"Membran direncinin azalması ve kapasitansının artması"},{"en":"Increased membrane resistance and decreased membrane capacitance","tr":"Membran direncinin artması ve membran kapasitansının azalması"},{"en":"Increased membrane resistance and increased membrane capacitance","tr":"Membran direncinin ve kapasitansının artması"},{"en":"Decreased membrane resistance and decreased membrane capacitance","tr":"Membran direncinin ve kapasitansının azalması"},{"en":"Increased axial resistance with unchanged membrane capacitance","tr":"Membran kapasitansı değişmeden eksenel direncin artması"}],"answer":1,"explanation":{"en":"Myelin reduces current loss across internodal membrane and reduces the charge required to change its voltage. Depolarisation can spread rapidly to the next node, where a new action potential is generated.","tr":"Miyelin internodal membrandan akım kaybını ve membran voltajını değiştirmek için gereken yükü azaltır. Depolarizasyon bir sonraki düğüme hızla yayılır ve burada yeni bir aksiyon potansiyeli üretilir."},"sourcePages":[226,227,228],"difficulty":"core"},{"id":"c52q5","stem":{"en":"Which description best matches a type C nerve fibre?","tr":"C tipi sinir lifini en iyi hangi tanım karşılar?"},"options":[{"en":"Large, myelinated and rapidly conducting","tr":"Büyük çaplı, miyelinli ve hızlı ileten"},{"en":"Small, myelinated and used for preganglionic autonomic transmission","tr":"Küçük çaplı, miyelinli ve pregangliyonik otonom iletimde kullanılan"},{"en":"Myelinated and supplying extrafusal skeletal-muscle fibres","tr":"Miyelinli ve iskelet kasının ekstrafüzal liflerini uyaran"},{"en":"Myelinated and supplying intrafusal muscle-spindle fibres","tr":"Miyelinli ve kas iğciğinin intrafüzal liflerini uyaran"},{"en":"Small, unmyelinated and slowly conducting","tr":"Küçük çaplı, miyelinsiz ve yavaş ileten"}],"answer":4,"explanation":{"en":"Type C fibres have small unmyelinated axons and relatively low conduction velocities. Slow nociceptive fibres and many postganglionic autonomic fibres belong to this group.","tr":"C tipi lifler küçük çaplı, miyelinsiz aksonlara ve görece düşük iletim hızına sahiptir. Yavaş nosiseptif lifler ve birçok postgangliyonik otonom lif bu gruptadır."},"sourcePages":[229],"difficulty":"core"}]},{"id":53,"title":{"en":"Synapses and the Neuromuscular Junction","tr":"Sinapslar ve Nöromüsküler Kavşak"},"startPage":231,"section":4,"endPage":238,"questions":[{"id":"c53q1","stem":{"en":"Which immediate presynaptic event triggers neurotransmitter vesicle exocytosis after an action potential arrives?","tr":"Aksiyon potansiyeli ulaştıktan sonra nörotransmiter veziküllerinin ekzositozunu tetikleyen ilk presinaptik olay hangisidir?"},"options":[{"en":"Sodium entry through postsynaptic nicotinic channels","tr":"Postsinaptik nikotinik kanallardan sodyum girişi"},{"en":"Calcium removal by presynaptic calcium pumps","tr":"Presinaptik kalsiyum pompalarıyla kalsiyumun uzaklaştırılması"},{"en":"Acetylcholine hydrolysis within the synaptic cleft","tr":"Sinaptik aralıkta asetilkolin hidrolizi"},{"en":"Potassium efflux from the postsynaptic membrane","tr":"Postsinaptik membrandan potasyum çıkışı"},{"en":"Calcium entry through voltage-gated channels","tr":"Voltaj kapılı kanallardan kalsiyum girişi"}],"answer":4,"explanation":{"en":"Terminal depolarisation opens calcium channels, increasing local intracellular calcium. Calcium-sensitive release machinery then promotes fusion of docked vesicles with the presynaptic membrane.","tr":"Terminal depolarizasyonu kalsiyum kanallarını açar ve yerel hücre içi kalsiyumu artırır. Kalsiyuma duyarlı salınım mekanizması, kenetlenmiş veziküllerin presinaptik membranla kaynaşmasını sağlar."},"sourcePages":[232,236],"difficulty":"core"},{"id":"c53q2","stem":{"en":"What must bind to an adult skeletal-muscle nicotinic acetylcholine receptor for normal channel opening?","tr":"Erişkin iskelet kasındaki nikotinik asetilkolin reseptörünün normal biçimde açılması için ne bağlanmalıdır?"},"options":[{"en":"One acetylcholine molecule at one agonist-binding site","tr":"Bir agonist bağlanma bölgesine bir asetilkolin molekülü"},{"en":"Two acetylcholine molecules at the receptor’s two agonist-binding sites","tr":"Reseptörün iki agonist bağlanma bölgesine iki asetilkolin molekülü"},{"en":"Two acetylcholine molecules at a muscarinic receptor","tr":"Muskarinik reseptöre iki asetilkolin molekülü"},{"en":"One acetylcholine molecule and one acetylcholinesterase molecule","tr":"Bir asetilkolin ve bir asetilkolinesteraz molekülü"},{"en":"Two choline molecules at the agonist-binding sites","tr":"Agonist bağlanma bölgelerine iki kolin molekülü"}],"answer":1,"explanation":{"en":"The muscle nicotinic receptor is a ligand-gated cation channel with two acetylcholine-binding sites. Opening permits both sodium and potassium movement, with net inward current depolarising the end plate at rest.","tr":"Kasın nikotinik reseptörü, iki asetilkolin bağlanma bölgesi olan ligand kapılı bir katyon kanalıdır. Açıldığında hem sodyum hem potasyum hareket eder; istirahatte net içe akım motor son plağı depolarize eder."},"sourcePages":[236],"difficulty":"core"},{"id
