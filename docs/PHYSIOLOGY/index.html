rogen entering alveoli faster than oxygen is removed","tr":"Oksijen uzaklaştırılırken azotun daha hızlı alveollere girmesi"},{"en":"Increased gas inflow despite airway closure","tr":"Hava yolu kapalı olmasına rağmen gaz girişinin artması"},{"en":"Alveolar gas entering blood without replacement by ventilation","tr":"Alveoler gazın kana geçip ventilasyonla yerine yenisinin gelmemesi"},{"en":"An increase in trapped gas volume as oxygen is absorbed","tr":"Oksijen emilirken hapsolmuş gaz hacminin artması"}],"answer":3,"explanation":{"en":"Gas continues to be absorbed from a perfused alveolus whose airway is closed. Without replacement, alveolar volume falls and the unit may collapse, especially when its gas is readily absorbed.","tr":"Hava yolu kapalı olan perfüze bir alveolde gaz emilimi sürer. Yerine gaz gelmediğinden alveol hacmi azalır ve özellikle kolay emilen gazlar bulunduğunda alveol kollabe olabilir."},"sourcePages":[108,109],"difficulty":"core"},{"id":"c26q4","stem":{"en":"A patient breathes through a narrower tracheal tube at the same flow. What is the expected mechanical effect?","tr":"Bir hasta aynı akım hızında daha dar bir trakeal tüpten soluyor. Beklenen mekanik etki nedir?"},"options":[{"en":"Greater resistive work of breathing","tr":"Solunumun rezistif işinin artması"},{"en":"Lower gas-flow resistance","tr":"Gaz akımına direncin azalması"},{"en":"Lower pressure drop along the tube","tr":"Tüp boyunca basınç düşüşünün azalması"},{"en":"Less respiratory muscle pressure needed at the same flow","tr":"Aynı akımda gereken solunum kası basıncının azalması"},{"en":"No change in resistance if tube length is unchanged","tr":"Tüp uzunluğu değişmiyorsa direncin değişmemesi"}],"answer":0,"explanation":{"en":"A smaller internal radius markedly increases resistance to gas flow. The patient must generate a larger pressure difference to maintain the same flow, increasing resistive work.","tr":"Daha küçük iç yarıçap gaz akımına direnci belirgin artırır. Aynı akımı sürdürebilmek için hastanın daha büyük basınç farkı oluşturması gerekir; rezistif iş artar."},"sourcePages":[108],"difficulty":"applied"},{"id":"c26q5","stem":{"en":"Why does severe pain after upper abdominal surgery favour secretion retention?","tr":"Üst abdominal cerrahi sonrası şiddetli ağrı sekresyon birikimini neden kolaylaştırır?"},"options":[{"en":"It increases expiratory reserve volume","tr":"Ekspiratuvar rezerv hacmini artırır"},{"en":"It improves cough-generated expiratory flow","tr":"Öksürükle oluşan ekspiratuvar akımı iyileştirir"},{"en":"It limits deep inspiration and effective coughing","tr":"Derin inspirasyonu ve etkili öksürüğü sınırlar"},{"en":"It increases functional residual capacity","tr":"Fonksiyonel rezidüel kapasiteyi artırır"},{"en":"It increases the volume of regular sigh breaths","tr":"Düzenli iç çekme soluklarının hacmini artırır"}],"answer":2,"explanation":{"en":"Pain restricts inspiratory expansion and effective cough. This encourages retained secretions and atelectasis, which can contribute to postoperative pulmonary complications.","tr":"Ağrı inspiratuvar genişlemeyi ve etkili öksürüğü sınırlar. Bu durum sekresyon birikimini ve atelektaziyi kolaylaştırarak ameliyat sonrası pulmoner komplikasyonlara katkıda bulunabilir."},"sourcePages":[109,110],"difficulty":"applied"}]},{"id":27,"title":{"en":"Cardiac Anatomy and Function","tr":"Kalbin Anatomisi ve İşlevi"},"startPage":111,"section":3,"endPage":116,"questions":[{"id":"c27q1","stem":{"en":"Which intercalated-disc structure allows direct electrical coupling between adjacent cardiac myocytes?","tr":"İnterkale diskteki hangi yapı komşu kardiyomiyositler arasında doğrudan elektriksel bağlantı sağlar?"},"options":[{"en":"Desmosome","tr":"Desmozom"},{"en":"Gap junction","tr":"Gap junction (aralık bağlantısı)"},{"en":"Basement membrane","tr":"Bazal membran"},{"en":"Tendon","tr":"Tendon"},{"en":"Coronary sinus","tr":"Koroner sinüs"}],"answer":1,"explanation":{"en":"Gap junctions permit ions to pass between neighbouring cells and spread depolarisation. Desmosomes provide mechanical attachment rather than this low-resistance electrical pathway.","tr":"Gap junctionlar iyonların komşu hücreler arasında geçişini ve depolarizasyonun yayılmasını sağlar. Desmozomlar bu düşük dirençli elektriksel yol yerine mekanik bağlantı oluşturur."},"sourcePages":[111,112],"difficulty":"core"},{"id":"c27q2","stem":{"en":"Why is left ventricular coronary perfusion greatest during diastole?","tr":"Sol ventrikülün koroner perfüzyonu neden en fazla diyastolde gerçekleşir?"},"options":[{"en":"The coronary arterial pressure is higher than aortic pressure only in diastole","tr":"Koroner arter basıncı yalnız diyastolde aort basıncından yüksektir"},{"en":"Myocardial oxygen extraction falls to zero in systole","tr":"Miyokardiyal oksijen ekstraksiyonu sistolde sıfıra düşer"},{"en":"Left ventricular wall tension peaks in diastole","tr":"Sol ventrikül duvar gerilimi diyastolde en yüksektir"},{"en":"Systolic contraction compresses intramyocardial vessels","tr":"Sistolik kasılma intramiyokardiyal damarları sıkıştırır"},{"en":"The coronary sinus supplies forward arterial flow during diastole","tr":"Koroner sinüs diyastolde ileri arteriyel akım sağlar"}],"answer":3,"explanation":{"en":"High left ventricular systolic pressure compresses vessels within the myocardium. Relaxation reduces this extravascular compression and permits greater coronary flow during diastole.","tr":"Sol ventriküldeki yüksek sistolik basınç miyokard içindeki damarları sıkıştırır. Gevşeme, damar dışı basıyı azaltarak diyastolde daha fazla koroner akıma olanak verir."},"sourcePages":[114],"difficulty":"core"},{"id":"c27q3","stem":{"en":"Which artery gives rise to the posterior descending artery in a left-dominant coronary circulation?","tr":"Sol dominant koroner dolaşımda posterior desendan arter hangi arterden çıkar?"},"options":[{"en":"Left circumflex artery","tr":"Sol sirkumfleks arter"},{"en":"Left anterior descending artery","tr":"Sol anterior desendan arter"},{"en":"Right coronary artery","tr":"Sağ koroner arter"},{"en":"Right marginal artery","tr":"Sağ marjinal arter"},{"en":"First diagonal artery","tr":"Birinci diyagonal arter"}],"answer":0,"explanation":{"en":"Coronary dominance is defined by the origin of the posterior descending artery. In left dominance it arises from the circumflex rather than the right coronary artery.","tr":"Koroner dominans posterior desendan arterin kökeniyle tanımlanır. Sol dominansta bu arter sağ koroner arterden değil sirkumfleks arterden çıkar."},"sourcePages":[113],"difficulty":"core"},{"id":"c27q4","stem":{"en":"Which venous drainage pathway contributes directly to a small anatomical right-to-left shunt?","tr":"Hangi venöz drenaj yolu küçük bir anatomik sağdan sola şanta doğrudan katkıda bulunur?"},"options":[{"en":"Great cardiac vein entering the coronary sinus","tr":"Koroner sinüse açılan büyük kardiyak ven"},{"en":"Anterior cardiac veins entering the right atrium","tr":"Sağ atriyuma açılan anterior kardiyak venler"},{"en":"Superior vena cava entering the right atrium","tr":"Sağ atriyuma açılan superior vena kava"},{"en":"Inferior vena cava entering the right atrium","tr":"Sağ atriyuma açılan inferior vena kava"},{"en":"Thebesian veins opening into left-sided cardiac chambers","tr":"Kalbin sol boşluklarına açılan Tebezian venler"}],"answer":4,"explanation":{"en":"A small amount of myocardial venous blood enters the left chambers through Thebesian veins. It mixes with oxygenated blood without first passing through ventilated pulmonary capillaries.","tr":"Az miktarda miyokardiyal venöz kan Tebezian venler aracılığıyla sol kalp boşluklarına girer. Önce ventile pulmoner kapillerlerden geçmeden oksijenlenmiş kana karışır."},"sourcePages":[113],"difficulty":"core"},{"id":"c27q5","stem":{"en":"How do atrial and B-type natriuretic peptides help respond to increased cardiac filling?","tr":"Atriyal ve B-tipi natriüretik peptitler artmış kalp dolumuna yanıtta nasıl rol oynar?"},"options":[{"en":"By promoting renal sodium retention","tr":"Böbrekte sodyum tutulmasını artırarak"},{"en":"By activating aldosterone-mediated volume retention","tr":"Aldosteron aracılı hacim tutulmasını etkinleştirerek"},{"en":"By promoting sodium excretion and limiting volume expansion","tr":"Sodyum atılımını artırıp hacim genişlemesini sınırlayarak"},{"en":"By increasing renal sodium reabsorption without changing water handling","tr":"Su işlenmesini değiştirmeden renal sodyum geri emilimini artırarak"},{"en":"By increasing thirst and suppressing natriuresis","tr":"Susamayı artırıp natriürezi baskılayarak"}],"answer":2,"explanation":{"en":"Cardiac wall stretch promotes release of natriuretic peptides. Their renal effects increase sodium excretion and oppose excessive circulating volume.","tr":"Kalp duvarının gerilmesi natriüretik peptit salınımını artırır. Renal etkileri sodyum atılımını artırarak dolaşım hacminin aşırı artmasına karşı koyar."},"sourcePages":[111],"difficulty":"core"}]},{"id":28,"title":{"en":"Cardiac Cycle","tr":"Kalp Döngüsü"},"startPage":117,"section":3,"endPage":120,"questions":[{"id":"c28q1","stem":{"en":"Which valve configuration defines left ventricular isovolumetric contraction?","tr":"Sol ventrikülün izovolümetrik kasılması sırasında kapakların durumu nasıldır?"},"options":[{"en":"Mitral open, aortic closed","tr":"Mitral açık, aort kapalı"},{"en":"Mitral closed, aortic open","tr":"Mitral kapalı, aort açık"},{"en":"Mitral and aortic both open","tr":"Mitral ve aort açık"},{"en":"Mitral and aortic both closed","tr":"Mitral ve aort kapalı"},{"en":"Aortic open with unchanged ventricular volume","tr":"Ventrikül hacmi değişmeden aort açık"}],"answer":3,"explanation":{"en":"After mitral closure and before aortic opening, ventricular pressure rises with no blood entering or leaving. Both valves must be closed for this isovolumetric phase.","tr":"Mitral kapağın kapanmasıyla aort kapağının açılması arasında ventrikül basıncı, kan giriş veya çıkışı olmadan yükselir. Bu izovolümetrik evrede iki kapak da kapalı olmalıdır."},"sourcePages":[117,118],"difficulty":"core"},{"id":"c28q2","stem":{"en":"End-diastolic volume is 150 mL and end-systolic volume is 60 mL. What is ejection fraction?","tr":"Diyastol sonu hacim 150 mL, sistol sonu hacim 60 mL ise ejeksiyon fraksiyonu kaçtır?"},"options":[{"en":"60%","tr":"%60"},{"en":"40%","tr":"%40"},{"en":"90%","tr":"%90"},{"en":"36%","tr":"%36"},{"en":"150%","tr":"%150"}],"answer":0,"explanation":{"en":"Stroke volume is 150 − 60 = 90 mL. Ejection fraction is stroke volume/end-diastolic volume, so 90/150 = 60%.","tr":"Atım hacmi 150 − 60 = 90 mL’dir. Ejeksiyon fraksiyonu atım hacmi/diyastol sonu hacim olduğundan 90/150 = %60 bulunur."},"sourcePages":[119],"difficulty":"applied"},{"id":"c28q3","stem":{"en":"Which event produces the normal second heart sound?","tr":"Normal ikinci kalp sesini hangi olay oluşturur?"},"options":[{"en":"Atrial contraction","tr":"Atriyum kasılması"},{"en":"Opening of the mitral and tricuspid valves","tr":"Mitral ve triküspit kapakların açılması"},{"en":"Opening of the aortic and pulmonary valves","tr":"Aort ve pulmoner kapakların açılması"},{"en":"Rapid ventricular filling","tr":"Hızlı ventrikül doluşu"},{"en":"Closure of the aortic and pulmonary valves","tr":"Aort ve pulmoner kapakların kapanması"}],"answer":4,"explanation":{"en":"The semilunar valves close as ventricular pressure falls below great-artery pressure. Their closure produces S2 and marks the start of isovolumetric relaxation.","tr":"Ventrikül basıncı büyük arterlerdeki basıncın altına indiğinde semilunar kapaklar kapanır. Bu kapanma S2’yi oluşturur ve izovolümetrik gevşemenin başlangıcını işaretler."},"sourcePages":[118,119],"difficulty":"core"},{"id":"c28q4","stem":{"en":"Why can very rapid tachycardia reduce cardiac output?","tr":"Çok hızlı taşikardi kalp debisini neden azaltabilir?"},"options":[{"en":"It lengthens diastolic filling time","tr":"Diyastolik doluş süresini uzatır"},{"en":"It shortens diastole enough to reduce ventricular filling and stroke volume","tr":"Diyastolü ventrikül doluşunu ve atım hacmini azaltacak kadar kısaltır"},{"en":"It increases end-diastolic volume at a fixed venous return","tr":"Sabit venöz dönüşte diyastol sonu hacmi artırır"},{"en":"It increases ventricular compliance enough to reduce preload","tr":"Önyükü azaltacak kadar ventrikül kompliyansını artırır"},{"en":"It reduces afterload while preserving stroke volume","tr":"Atım hacmini korurken artyükü azaltır"}],"answer":1,"explanation":{"en":"Cardiac output equals heart rate times stroke volume. At very high rates the reduced filling time can lower stroke volume sufficiently to offset the faster rate.","tr":"Kalp debisi kalp hızı ile atım hacminin çarpımıdır. Çok yüksek hızlarda kısalan doluş süresi atım hacmini, hız artışının yararını aşacak kadar azaltabilir."},"sourcePages":[119],"difficulty":"applied"},{"id":"c28q5","stem":{"en":"Why may loss of atrial contraction be poorly tolerated in a stiff left ventricle?","tr":"Sol ventrikülü sert olan bir hastada atriyum kasılmasının kaybı neden kötü tolere edilebilir?"},"options":[{"en":"Atrial contraction supplies most ventricular ejection pressure","tr":"Atriyum kasılması ventrikül ejeksiyon basıncının çoğunu sağlar"},{"en":"Loss of atrial contraction directly narrows the aortic valve","tr":"Atriyum kasılmasının kaybı aort kapağını doğrudan daraltır"},{"en":"Atrial contraction contributes importantly to filling when passive filling is impaired","tr":"Pasif doluş bozulduğunda atriyum kasılması doluşa önemli katkı sağlar"},{"en":"Atrial contraction is the main determinant of pulmonary vascular resistance","tr":"Atriyum kasılması pulmoner vasküler direncin başlıca belirleyicisidir"},{"en":"Loss of atrial contraction increases passive ventricular compliance","tr":"Atriyum kasılmasının kaybı pasif ventrikül kompliyansını artırır"}],"answer":2,"explanation":{"en":"A less compliant ventricle fills less effectively during passive diastole. Losing the atrial contribution can therefore reduce end-diastolic volume and cardiac output.","tr":"Kompliyansı düşük ventrikül pasif diyastol sırasında daha az etkin dolar. Bu nedenle atriyal katkının kaybı diyastol sonu hacmi ve kalp debisini azaltabilir."},"sourcePages":[119,120],"difficulty":"applied"}]},{"id":29,"title":{"en":"Cardiac Output and Its Measurement","tr":"Kalp Debisi ve Ölçümü"},"startPage":121,"section":3,"endPage":130,"questions":[{"id":"c29q1","stem":{"en":"Oxygen consumption is 300 mL/min, arterial oxygen content 200 mL/L and mixed venous oxygen content 150 mL/L. What cardiac output does the Fick principle give?","tr":"Oksijen tüketimi 300 mL/dk, arteriyel oksijen içeriği 200 mL/L ve karışık venöz oksijen içeriği 150 mL/L ise Fick ilkesine göre kalp debisi kaçtır?"},"options":[{"en":"3 L/min","tr":"3 L/dk"},{"en":"4 L/min","tr":"4 L/dk"},{"en":"6 L/min","tr":"6 L/dk"},{"en":"8 L/min","tr":"8 L/dk"},{"en":"10 L/min","tr":"10 L/dk"}],"answer":2,"explanation":{"en":"Cardiac output equals oxygen consumption divided by the arterial–mixed venous oxygen-content difference. Here 300/(200 − 150) = 6 L/min; the content units must be consistent.","tr":"Kalp debisi oksijen tüketiminin arteriyel-karışık venöz oksijen içerik farkına bölünmesiyle hesaplanır. Burada 300/(200 − 150) = 6 L/dk bulunur; içerik birimleri uyumlu olmalıdır."},"sourcePages":[124,125],"difficulty":"applied"},{"id":"c29q2","stem":{"en":"Which sample best represents true mixed venous oxygen content for the direct Fick method?","tr":"Doğrudan Fick yöntemi için gerçek karışık venöz oksijen içeriğini en iyi hangi örnek temsil eder?"},"options":[{"en":"Pulmonary arterial blood","tr":"Pulmoner arter kanı"},{"en":"Radial arterial blood","tr":"Radiyal arter kanı"},{"en":"Peripheral hand-vein blood","tr":"Elin periferik veninden alınan kan"},{"en":"Coronary sinus blood alone","tr":"Yalnız koroner sinüs kanı"},{"en":"Superior vena caval blood alone","tr":"Yalnız superior vena kava kanı"}],"answer":0,"explanation":{"en":"Pulmonary arterial blood combines venous return from the upper body, lower body and heart. A superior vena caval sample does not include all these territories and is an imperfect surrogate.","tr":"Pulmoner arter kanı üst vücut, alt vücut ve kalpten gelen venöz kanı birleştirir. Superior vena kava örneği tüm bu bölgeleri içermez ve kusursuz bir karşılık değildir."},"sourcePages":[125],"difficulty":"core"},{"id":"c29q3","stem":{"en":"With the same injected indicator dose and complete mixing, a larger first-pass area under the concentration–time curve indicates what?","tr":"Aynı indikatör dozu ve tam karışım koşullarında ilk geçiş konsantrasyon-zaman eğrisi altındaki alanın büyümesi neyi gösterir?"},"options":[{"en":"Higher cardiac output","tr":"Daha yüksek kalp debisi"},{"en":"Unchanged cardiac output in every case","tr":"Her durumda değişmeyen kalp debisi"},{"en":"Higher arterial oxygen content","tr":"Daha yüksek arteriyel oksijen içeriği"},{"en":"Lower cardiac output","tr":"Daha düşük kalp debisi"},{"en":"Higher indicator dose despite the stated fixed dose","tr":"Doz sabit belirtilmiş olmasına rağmen daha yüksek indikatör dozu"}],"answer":3,"explanation":{"en":"Indicator-dilution cardiac output is the injected amount divided by the first-pass concentration–time area. A larger area therefore corresponds to lower flow when the dose is unchanged.","tr":"İndikatör dilüsyonunda kalp debisi, enjekte edilen miktarın ilk geçiş konsantrasyon-zaman alanına bölünmesidir. Bu nedenle doz değişmiyorsa daha büyük alan daha düşük akıma karşılık gelir."},"sourcePages":[125,126],"difficulty":"applied"},{"id":"c29q4","stem":{"en":"A cardiac output of 5.4 L/min is measured in a person with body surface area 1.8 m². What is the cardiac index?","tr":"Vücut yüzey alanı 1,8 m² olan bir kişide kalp debisi 5,4 L/dk ölçülür. Kardiyak indeks kaçtır?"},"options":[{"en":"1.8 L/min/m²","tr":"1,8 L/dk/m²"},{"en":"3.0 L/min/m²","tr":"3,0 L/dk/m²"},{"en":"5.4 L/min/m²","tr":"5,4 L/dk/m²"},{"en":"7.2 L/min/m²","tr":"7,2 L/dk/m²"},{"en":"9.7 L/min/m²","tr":"9,7 L/dk/m²"}],"answer":1,"explanation":{"en":"Cardiac index is cardiac output divided by body surface area. Normalising for body size gives 5.4/1.8 = 3.0 L/min/m².","tr":"Kardiyak indeks, kalp debisinin vücut yüzey alanına bölünmesidir. Vücut büyüklüğüne göre düzeltildiğinde 5,4/1,8 = 3,0 L/dk/m² bulunur."},"sourcePages":[123],"difficulty":"applied"},{"id":"c29q5","stem":{"en":"A Doppler velocity–time integral across an outflow tract is 20 cm and its cross-sectional area is 3 cm². What is stroke volume?","tr":"Bir çıkış yolundaki Doppler hız-zaman integrali 20 cm, kesit alanı 3 cm² ise atım hacmi kaçtır?"},"options":[{"en":"6.7 mL","tr":"6,7 mL"},{"en":"17 mL","tr":"17 mL"},{"en":"23 mL","tr":"23 mL"},{"en":"120 mL","tr":"120 mL"},{"en":"60 mL","tr":"60 mL"}],"answer":4,"explanation":{"en":"The velocity–time integral is the distance travelled by a column of blood in one beat. Multiplying by cross-sectional area gives volume: 20 × 3 = 60 cm³, or 60 mL.","tr":"Hız-zaman integrali bir kan sütununun bir atımda katettiği mesafedir. Kesit alanıyla çarpılması hacmi verir: 20 × 3 = 60 cm³, yani 60 mL."},"sourcePages":[128,129],"difficulty":"applied"}]},{"id":30,"title":{"en":"Starling’s Law and Cardiac Dysfunction","tr":"Starling Yasası ve Kardiyak İşlev Bozukluğu"},"startPage":131,"section":3,"endPage":135,"questions":[{"id":"c30q1","stem":{"en":"At unchanged inotropic state and afterload, what is the usual response of a healthy ventricle to increased end-diastolic filling?","tr":"İnotropik durum ve artyük değişmezken sağlıklı bir ventrikül diyastol sonu doluş artışına genellikle nasıl yanıt verir?"},"options":[{"en":"Reduced stroke volume through decreased fibre stretch","tr":"Lif gerilmesinin azalmasıyla atım hacminin azalması"},{"en":"Increased stroke volume through the Frank–Starling mechanism","tr":"Frank-Starling mekanizmasıyla atım hacminin artması"},{"en":"Unchanged stroke volume because contractility is unchanged","tr":"Kontraktilite değişmediği için atım hacminin değişmemesi"},{"en":"Increased stroke volume only after sympathetic stimulation","tr":"Yalnız sempatik uyarıdan sonra atım hacminin artması"},{"en":"Reduced stroke volume because greater filling always increases afterload","tr":"Artmış doluş her zaman artyükü artırdığından atım hacminin azalması"}],"answer":1,"explanation":{"en":"Greater end-diastolic stretch increases the force of contraction within the physiological operating range. This intrinsic length-dependent response does not require additional neural stimulation.","tr":"Fizyolojik çalışma aralığında diyastol sonu gerilmenin artması kasılma kuvvetini artırır. Uzunluğa bağımlı bu intrinsik yanıt ek nöral uyarı gerektirmez."},"sourcePages":[131],"difficulty":"core"},{"id":"c30q2","stem":{"en":"What is a major physiological benefit of the Frank–Starling mechanism?","tr":"Frank-Starling mekanizmasının başlıca fizyolojik yararlarından biri nedir?"},"options":[{"en":"It makes pulmonary and systemic arterial pressures identical","tr":"Pulmoner ve sistemik arter basınçlarını eşitler"},{"en":"It maintains the same stroke volume at every filling pressure","tr":"Her doluş basıncında aynı atım hacmini korur"},{"en":"It keeps ventricular filling pressure unchanged when venous return rises","tr":"Venöz dönüş artarken ventrikül doluş basıncını değiştirmez"},{"en":"It helps match right and left ventricular output","tr":"Sağ ve sol ventrikül debilerinin eşleşmesine yardımcı olur"},{"en":"It makes stroke volume independent of venous return","tr":"Atım hacmini venöz dönüşten bağımsız hale getirir"}],"answer":3,"explanation":{"en":"Increased right ventricular output increases pulmonary venous return and left ventricular filling. The left ventricle then ejects more, helping avoid progressive accumulation of blood in one circulation.","tr":"Sağ ventrikül debisinin artması pulmoner venöz dönüşü ve sol ventrikül doluşunu artırır. Sol ventrikül de daha fazla kan atarak dolaşımlardan birinde giderek artan kan birikimini önlemeye yardımcı olur."},"sourcePages":[132],"difficulty":"core"},{"id":"c30q3","stem":{"en":"Which finding most directly characterises impaired diastolic function?","tr":"Hangi bulgu diyastolik işlev bozukluğunu en doğrudan tanımlar?"},"options":[{"en":"Impaired ventricular relaxation or reduced ventricular compliance","tr":"Ventrikül gevşemesinin bozulması veya ventrikül kompliyansının azalması"},{"en":"Isolated slowing of sinoatrial node automaticity","tr":"Sinoatriyal düğüm otomatisitesinin izole yavaşlaması"},{"en":"Reduced ejection fraction as an obligatory finding","tr":"Zorunlu bulgu olarak azalmış ejeksiyon fraksiyonu"},{"en":"Increased compliance at a given filling pressure","tr":"Belirli doluş basıncında kompliyansın artması"},{"en":"Increased passive filling at a lower atrial pressure","tr":"Daha düşük atriyum basıncında pasif doluşun artması"}],"answer":0,"explanation":{"en":"Diastolic dysfunction impairs filling through abnormal relaxation or stiffness. Ejection fraction may be preserved, so a normal fraction does not exclude clinically important filling abnormalities.","tr":"Diyastolik işlev bozukluğu anormal gevşeme veya sertlik nedeniyle doluşu bozar. Ejeksiyon fraksiyonu korunabileceğinden normal bir fraksiyon önemli doluş bozukluklarını dışlamaz."},"sourcePages":[132,133],"difficulty":"core"},{"id":"c30q4","stem":{"en":"Reduced renal perfusion in heart failure can activate which response that initially supports filling but may worsen congestion?","tr":"Kalp yetmezliğinde azalan böbrek perfüzyonu, başlangıçta doluşu destekleyen ancak konjesyonu kötüleştirebilen hangi yanıtı etkinleştirebilir?"},"options":[{"en":"Suppression of aldosterone release","tr":"Aldosteron salınımının baskılanması"},{"en":"Persistent renal sodium wasting","tr":"Sürekli renal sodyum kaybı"},{"en":"Loss of all sympathetic activity","tr":"Tüm sempatik aktivitenin kaybı"},{"en":"Inhibition of angiotensin formation","tr":"Anjiyotensin oluşumunun baskılanması"},{"en":"Renin–angiotensin–aldosterone activation with sodium and water retention","tr":"Sodyum ve su tutulmasıyla renin-anjiyotensin-aldosteron aktivasyonu"}],"answer":4,"explanation":{"en":"Reduced renal perfusion and neurohumoral activation favour sodium and water retention. The resulting volume expansion can support preload but also raise venous pressures and aggravate oedema.","tr":"Azalmış böbrek perfüzyonu ve nörohumoral aktivasyon sodyum ve su tutulmasını kolaylaştırır. Oluşan hacim artışı önyükü destekleyebilse de venöz basınçları yükseltip ödemi ağırlaştırabilir."},"sourcePages":[134],"difficulty":"applied"},{"id":"c30q5","stem":{"en":"Which pressure change most directly links left ventricular failure to hydrostatic pulmonary oedema?","tr":"Sol ventrikül yetmezliğini hidrostatik akciğer ödemine en doğrudan bağlayan basınç değişikliği hangisidir?"},"options":[{"en":"A fall in pulmonary venous pressure","tr":"Pulmoner venöz basıncın düşmesi"},{"en":"A fall in left atrial pressure","tr":"Sol atriyum basıncının düşmesi"},{"en":"A rise in left atrial and pulmonary capillary hydrostatic pressure","tr":"Sol atriyum ve pulmoner kapiller hidrostatik basıncın yükselmesi"},{"en":"A rise in plasma oncotic pressure","tr":"Plazma onkotik basıncının yükselmesi"},{"en":"A fall in pulmonary capillary filtration pressure","tr":"Pulmoner kapiller filtrasyon basıncının düşmesi"}],"answer":2,"explanation":{"en":"Raised left-sided filling pressures are transmitted to the pulmonary venous and capillary circulation. Increased capillary hydrostatic pressure favours fluid filtration into the pulmonary interstitium and, when severe, alveoli.","tr":"Artmış sol kalp doluş basınçları pulmoner venöz ve kapiller dolaşıma iletilir. Yükselen kapiller hidrostatik basınç akciğer interstisyumuna, ağır olduğunda alveollere sıvı filtrasyonunu kolaylaştırır."},"sourcePages":[134,135],"difficulty":"applied"}]},{"id":31,"title":{"en":"Cardiac Pressure–Volume Loops","tr":"Kardiyak Basınç-Hacim Döngüleri"},"startPage":136,"section":3,"endPage":140,"questions":[{"id":"c31q1","stem":{"en":"What does the horizontal width of a left ventricular pressure–volume loop represent?","tr":"Sol ventrikül basınç-hacim döngüsünün yatay genişliği neyi temsil eder?"},"options":[{"en":"Heart rate","tr":"Kalp hızı"},{"en":"End-diastolic pressure","tr":"Diyastol sonu basınç"},{"en":"Myocardial oxygen extraction","tr":"Miyokardiyal oksijen ekstraksiyonu"},{"en":"Stroke volume","tr":"Atım hacmi"},{"en":"Systemic vascular resistance","tr":"Sistemik vasküler direnç"}],"answer":3,"explanation":{"en":"Loop width is end-diastolic volume minus end-systolic volume. This difference is the volume ejected per beat, or stroke volume.","tr":"Döngünün genişliği diyastol sonu hacim ile sistol sonu hacim arasındaki farktır. Bu fark bir atımda atılan kan hacmi, yani atım hacmidir."},"sourcePages":[136,137],"difficulty":"core"},{"id":"c31q2","stem":{"en":"What does the area enclosed by a ventricular pressure–volume loop represent?","tr":"Ventrikül basınç-hacim döngüsünün çevrelediği alan neyi temsil eder?"},"options":[{"en":"External stroke work","tr":"Dış atım işi"},{"en":"Heart rate variability","tr":"Kalp hızı değişkenliği"},{"en":"Total blood volume","tr":"Toplam kan hacmi"},{"en":"Myocardial oxygen content","tr":"Miyokardiyal oksijen içeriği"},{"en":"Ventricular compliance alone","tr":"Yalnız ventrikül kompliyansı"}],"answer":0,"explanation":{"en":"Pressure integrated with respect to volume gives mechanical work. The enclosed loop area represents the external work of ejecting blood during one cardiac cycle.","tr":"Basıncın hacme göre integrali mekanik işi verir. Döngünün çevrelediği alan, bir kalp döngüsünde kanı dışarı atmak için yapılan dış işi temsil eder."},"sourcePages":[138],"difficulty":"core"},{"id":"c31q3","stem":{"en":"At fixed initial preload and contractility, what is the immediate effect of increased aortic pressure on a left ventricular pressure–volume loop?","tr":"Başlangıç önyükü ve kontraktilite sabitken artmış aort basıncının sol ventrikül basınç-hacim döngüsüne erken etkisi nedir?"},"options":[{"en":"Lower end-systolic volume and wider loop","tr":"Daha düşük sistol sonu hacim ve daha geniş döngü"},{"en":"Lower systolic pressure and wider loop","tr":"Daha düşük sistolik basınç ve daha geniş döngü"},{"en":"No change in ventricular ejection","tr":"Ventrikül ejeksiyonunda değişiklik olmaması"},{"en":"Abolition of the isovolumetric phases","tr":"İzovolümetrik evrelerin ortadan kalkması"},{"en":"Higher end-systolic volume and reduced loop width","tr":"Daha yüksek sistol sonu hacim ve daha dar döngü"}],"answer":4,"explanation":{"en":"An increased ejection load limits fibre shortening, so less blood is ejected initially. End-systolic volume rises and stroke volume falls; later compensatory changes are separate from this initial effect.","tr":"Artan ejeksiyon yükü liflerin kısalmasını sınırlar ve başlangıçta daha az kan atılır. Sistol sonu hacim artar, atım hacmi azalır; sonraki telafi edici değişiklikler bu ilk etkiden ayrıdır."},"sourcePages":[137,138],"difficulty":"applied"},{"id":"c31q4","stem":{"en":"Which change indicates increased intrinsic contractility on pressure–volume analysis?","tr":"Basınç-hacim analizinde hangi değişiklik intrinsik kontraktilite artışını gösterir?"},"options":[{"en":"A flatter end-systolic pressure–volume relation","tr":"Sistol sonu basınç-hacim ilişkisinin eğiminin azalması"},{"en":"A steeper end-systolic pressure–volume relation","tr":"Sistol sonu basınç-hacim ilişkisinin eğiminin artması"},{"en":"A compulsory increase in end-systolic volume","tr":"Sistol sonu hacmin zorunlu olarak artması"},{"en":"An isolated upward shift in the passive filling curve","tr":"Pasif doluş eğrisinin tek başına yukarı kayması"},{"en":"A fall in every systolic pressure","tr":"Tüm sistolik basınçların düşmesi"}],"answer":1,"explanation":{"en":"Greater contractility steepens the end-systolic pressure–volume relationship and generally permits a smaller end-systolic volume. The passive diastolic relation instead describes filling stiffness.","tr":"Kontraktilite artışı sistol sonu basınç-hacim ilişkisinin eğimini artırır ve genellikle daha düşük sistol sonu hacme olanak verir. Pasif diyastolik ilişki ise doluş sırasındaki sertliği tanımlar."},"sourcePages":[137,138],"difficulty":"core"},{"id":"c31q5","stem":{"en":"A ventricle has a higher diastolic pressure at the same volume, with unchanged systolic contractility. Which property has decreased?","tr":"Aynı hacimde diyastolik basıncı daha yüksek olan bir ventrikülde sistolik kontraktilite değişmemiştir. Hangi özellik azalmıştır?"},"options":[{"en":"Afterload","tr":"Artyük"},{"en":"Heart rate","tr":"Kalp hızı"},{"en":"Diastolic compliance","tr":"Diyastolik kompliyans"},{"en":"Pulmonary venous oxygen content","tr":"Pulmoner venöz oksijen içeriği"},{"en":"Aortic valve area","tr":"Aort kapak alanı"}],"answer":2,"explanation":{"en":"A stiffer ventricle requires more pressure to accommodate a given volume. This shifts the end-diastolic pressure–volume relationship upward without necessarily changing the end-systolic contractility relation.","tr":"Daha sert bir ventrikül belirli bir hacmi almak için daha yüksek basınç gerektirir. Bu durum sistol sonu kontraktilite ilişkisini zorunlu olarak değiştirmeden diyastol sonu basınç-hacim ilişkisini yukarı kaydırır."},"sourcePages":[137,139,140],"difficulty":"applied"}]},{"id":32,"title":{"en":"Cardiac Ischaemia","tr":"Kardiyak İskemi"},"startPage":141,"section":3,"endPage":144,"questions":[{"id":"c32q1","stem":{"en":"Why does increased myocardial oxygen demand usually require increased coronary blood flow?","tr":"Miyokardın oksijen gereksiniminin artması neden genellikle koroner kan akımının artmasını gerektirir?"},"options":[{"en":"Myocardial oxygen extraction is already high at rest","tr":"Miyokardın istirahat oksijen ekstraksiyonu zaten yüksektir"},{"en":"Myocardial oxygen extraction is unusually low at rest","tr":"Miyokardın istirahat oksijen ekstraksiyonu olağan dışı düşüktür"},{"en":"Increasing heart rate prolongs the total diastolic perfusion time","tr":"Kalp hızının artması toplam diyastolik perfüzyon süresini uzatır"},{"en":"Coronary blood flow is independent of local metabolites","tr":"Koroner kan akımı lokal metabolitlerden bağımsızdır"},{"en":"The myocardium meets sustained extra demand mainly from stored oxygen","tr":"Miyokard uzun süreli ek gereksinimi başlıca depolanmış oksijenden karşılar"}],"answer":0,"explanation":{"en":"The myocardium already extracts a large fraction of delivered oxygen at rest. Its limited extraction reserve makes increased flow especially important when cardiac work rises.","tr":"Miyokard istirahatte kendisine sunulan oksijenin büyük bölümünü zaten çeker. Ekstraksiyon rezervi sınırlı olduğundan kalbin işi arttığında akımın artırılması özellikle önem kazanır."},"sourcePages":[141],"difficulty":"core"},{"id":"c32q2","stem":{"en":"Ischaemic changes in leads II, III and aVF most directly localise to which myocardial region?","tr":"II, III ve aVF derivasyonlarındaki iskemik değişiklikler en doğrudan hangi miyokard bölgesini düşündürür?"},"options":[{"en":"Lateral wall","tr":"Lateral duvar"},{"en":"Anterior septum","tr":"Anterior septum"},{"en":"Anterior wall","tr":"Anterior duvar"},{"en":"Inferior wall","tr":"İnferior duvar"},{"en":"Posterior wall","tr":"Posterior duvar"}],"answer":3,"explanation":{"en":"These leads view the inferior surface of the heart. Inferior ischaemia may accompany nodal conduction disturbances when the affected coronary supply also serves the sinoatrial or atrioventricular node.","tr":"Bu derivasyonlar kalbin inferior yüzünü görüntüler. Etkilenen koroner dolaşım sinoatriyal veya atriyoventriküler düğümü de besliyorsa inferior iskemiye düğüm kaynaklı iletim bozuklukları eşlik edebilir."},"sourcePages":[142],"difficulty":"applied"},{"id":"c32q3","stem":{"en":"What best explains cardiac ischaemic pain being felt in the arm or jaw?","tr":"Kardiyak iskemik ağrının kolda veya çenede hissedilmesini en iyi ne açıklar?"},"options":[{"en":"Ischaemia spreading directly from myocardium into limb muscles","tr":"İskeminin miyokarddan doğrudan ekstremite kaslarına yayılması"},{"en":"Convergence of visceral and somatic sensory inputs in central pathways","tr":"Visseral ve somatik duyusal girdilerin merkezi yollarda ortak nöronlara ulaşması"},{"en":"Coronary afferents terminating at arm neuromuscular junctions","tr":"Koroner afferentlerin kol nöromüsküler kavşaklarında sonlanması"},{"en":"Exclusive transmission through somatic motor fibres","tr":"Yalnız somatik motor liflerle iletim"},{"en":"Local arm hypoxia caused by selective subclavian vasospasm","tr":"Seçici subklavyen vazospazma bağlı lokal kol hipoksisi"}],"answer":1,"explanation":{"en":"Cardiac visceral afferents enter spinal pathways that also receive somatic sensory information. Central interpretation of these convergent inputs can localise pain to a somatic region rather than the heart.","tr":"Kardiyak visseral afferentler, somatik duyusal bilgiyi de alan spinal yollara ulaşır. Bu ortak girdilerin merkezi yorumlanması ağrının kalp yerine somatik bir bölgede hissedilmesine yol açabilir."},"sourcePages":[141,142],"difficulty":"core"},{"id":"c32q4","stem":{"en":"After coronary flow is restored, viable myocardium remains temporarily weak but later recovers. Which phenomenon is described?","tr":"Koroner akım yeniden sağlandıktan sonra canlı miyokard geçici olarak zayıf kalır, ancak daha sonra düzelir. Hangi olay tanımlanmaktadır?"},"options":[{"en":"Irreversible transmural necrosis","tr":"Geri dönüşsüz transmural nekroz"},{"en":"Persistent underperfusion causing hibernating myocardium","tr":"Hiberne miyokarda yol açan süregelen hipoperfüzyon"},{"en":"Mature infarct scar","tr":"Olgun enfarktüs skarı"},{"en":"Fixed mechanical restriction by the pericardium","tr":"Perikardın oluşturduğu sabit mekanik kısıtlanma"},{"en":"Myocardial stunning","tr":"Miyokardiyal stunning (sersemleme)"}],"answer":4,"explanation":{"en":"Stunning is reversible contractile dysfunction after ischaemia despite restored perfusion. Reperfusion-associated oxidative stress and disturbed calcium handling can contribute, so early weakness does not necessarily equal permanent necrosis.","tr":"Stunning, perfüzyon düzelmesine rağmen iskemi sonrasında süren geri dönüşlü kasılma bozukluğudur. Reperfüzyona eşlik eden oksidatif stres ve kalsiyum işlenmesindeki bozukluk katkıda bulunabilir; erken güçsüzlük mutlaka kalıcı nekroz anlamına gelmez."},"sourcePages":[143,144],"difficulty":"applied"},{"id":"c32q5","stem":{"en":"An epicardial coronary artery is reopened, but tissue perfusion remains poor because of microvascular obstruction. What is this called?","tr":"Epikardiyal koroner arter yeniden açıldığı halde mikrovasküler tıkanma nedeniyle doku perfüzyonu yetersiz kalır. Buna ne denir?"},"options":[{"en":"Reactive hyperaemia","tr":"Reaktif hiperemi"},{"en":"Normal coronary autoregulation","tr":"Normal koroner otoregülasyon"},{"en":"No-reflow phenomenon","tr":"No-reflow fenomeni"},{"en":"Physiological coronary dominance","tr":"Fizyolojik koroner dominans"},{"en":"Atrial kick","tr":"Atriyal katkı"}],"answer":2,"explanation":{"en":"Restoring flow in a large coronary artery does not guarantee an open microcirculation. Endothelial injury, oedema and intravascular debris can prevent effective tissue reperfusion.","tr":"Büyük bir koroner arterde akımın sağlanması mikrodolaşımın açık olduğunu garanti etmez. Endotel hasarı, ödem ve damar içi materyal etkin doku reperfüzyonunu engelleyebilir."},"sourcePages":[143,144],"difficulty":"applied"}]},{"id":33,"title":{"en":"Systemic Circulation","tr":"Sistemik Dolaşım"},"startPage":145,"section":3,"endPage":147,"questions":[{"id":"c33q1","stem":{"en":"Which vascular compartment contains the largest proportion of resting circulating blood volume?","tr":"İstirahatte dolaşımdaki kan hacminin en büyük bölümü hangi damar kompartımanındadır?"},"options":[{"en":"Systemic arteries","tr":"Sistemik arterler"},{"en":"Systemic veins and venules","tr":"Sistemik venler ve venüller"},{"en":"Pulmonary arteries alone","tr":"Yalnız pulmoner arterler"},{"en":"Systemic capillaries","tr":"Sistemik kapillerler"},{"en":"Coronary arteries","tr":"Koroner arterler"}],"answer":1,"explanation":{"en":"The venous system is highly compliant and acts as a blood reservoir. It contains roughly two-thirds of circulating volume, substantially more than the arterial system.","tr":"Venöz sistem yüksek kompliyansa sahiptir ve kan deposu olarak işlev görür. Dolaşımdaki hacmin yaklaşık üçte ikisini içerir; bu miktar arteriyel sistemdekinden belirgin fazladır."},"sourcePages":[145],"difficulty":"core"},{"id":"c33q2","stem":{"en":"Why is mean blood velocity lowest in the capillary network?","tr":"Ortalama kan hızı kapiller ağda neden en düşüktür?"},"options":[{"en":"Individual capillaries have larger lumens than large arteries","tr":"Tek tek kapillerlerin lümeni büyük arterlerden daha geniştir"},{"en":"Total volume flow becomes lower than cardiac output at every capillary level","tr":"Toplam hacimsel akım her kapiller düzeyde kalp debisinin altına iner"},{"en":"The mean perfusion-pressure gradient increases there","tr":"Ortalama perfüzyon basınç farkı burada artar"},{"en":"The combined cross-sectional area is greatest there","tr":"Toplam kesit alanı burada en büyüktür"},{"en":"Blood viscosity alone fixes capillary velocity independently of area","tr":"Kan viskozitesi alanından bağımsız olarak kapiller hızını tek başına belirler"}],"answer":3,"explanation":{"en":"Mean velocity equals volume flow divided by the total cross-sectional area. Although individual capillaries are narrow, their enormous number in parallel creates a very large combined area.","tr":"Ortalama hız hacimsel akımın toplam kesit alanına bölünmesidir. Her kapiller dar olsa da paralel durumdaki çok sayıdaki kapillerin toplam alanı çok büyüktür."},"sourcePages":[145,146,147],"difficulty":"core"},{"id":"c33q3","stem":{"en":"Blood flow is 90 mL/s through a vascular segment with total cross-sectional area 6 cm². What is mean velocity?","tr":"Toplam kesit alanı 6 cm² olan bir damar bölümünden 90 mL/sn kan geçmektedir. Ortalama hız kaçtır?"},"options":[{"en":"15 cm/s","tr":"15 cm/sn"},{"en":"540 cm/s","tr":"540 cm/sn"},{"en":"0.067 cm/s","tr":"0,067 cm/sn"},{"en":"96 cm/s","tr":"96 cm/sn"},{"en":"84 cm/s","tr":"84 cm/sn"}],"answer":0,"explanation":{"en":"One millilitre equals one cubic centimetre. Velocity is flow/area, so 90 cm³/s divided by 6 cm² gives 15 cm/s.","tr":"Bir mililitre bir santimetreküpe eşittir. Hız akım/alan olduğundan 90 cm³/sn değerinin 6 cm²’ye bölünmesi 15 cm/sn verir."},"sourcePages":[146],"difficulty":"applied"},{"id":"c33q4","stem":{"en":"Compared with the systemic circulation, the normal pulmonary circulation has which combination?","tr":"Normal pulmoner dolaşım sistemik dolaşıma göre hangi özellikleri taşır?"},"options":[{"en":"Higher pressure and lower flow","tr":"Daha yüksek basınç ve daha düşük akım"},{"en":"Higher resistance and equal flow","tr":"Daha yüksek direnç ve eşit akım"},{"en":"Equal resistance and lower flow","tr":"Eşit direnç ve daha düşük akım"},{"en":"Lower pressure and negligible flow","tr":"Daha düşük basınç ve ihmal edilebilir akım"},{"en":"Lower resistance and approximately equal total flow","tr":"Daha düşük direnç ve yaklaşık eşit toplam akım"}],"answer":4,"explanation":{"en":"In steady state the right and left sides of the heart deliver approximately the same flow. The pulmonary circulation achieves this flow across a much lower resistance and pressure gradient.","tr":"Kararlı durumda kalbin sağ ve sol tarafları yaklaşık aynı akımı sağlar. Pulmoner dolaşım bunu çok daha düşük direnç ve basınç farkıyla gerçekleştirir."},"sourcePages":[145,146],"difficulty":"core"},{"id":"c33q5","stem":{"en":"As blood passes from capillaries into progressively larger veins, why does mean velocity rise again?","tr":"Kan kapillerlerden giderek daha büyük venlere geçerken ortalama hız neden yeniden artar?"},"options":[{"en":"Total flow through the entire venous circulation increases as veins merge","tr":"Venler birleştikçe tüm venöz dolaşımdan geçen toplam akım artar"},{"en":"The combined venous cross-sectional area increases","tr":"Toplam venöz kesit alanı artar"},{"en":"The combined cross-sectional area of the vascular bed decreases","tr":"Damar yatağının toplam kesit alanı azalır"},{"en":"Venous pressure becomes equal to aortic pressure","tr":"Venöz basınç aort basıncına eşit olur"},{"en":"Venous compliance becomes lower than arterial compliance","tr":"Venöz kompliyans arteriyel kompliyansın altına iner"}],"answer":2,"explanation":{"en":"As veins merge, their total combined cross-sectional area becomes smaller. For approximately conserved volume flow, this reduction in area requires a higher average velocity.","tr":"Venler birleşirken toplam kesit alanları küçülür. Hacimsel akım yaklaşık korunduğundan alanın azalması ortalama hızın artmasını gerektirir."},"sourcePages":[147],"difficulty":"core"}]},{"id":34,"title":{"en":"Arterial System","tr":"Arteriyel Sistem"},"startPage":148,"section":3,"endPage":154,"questions":[{"id":"c34q1","stem":{"en":"Under ideal Poiseuille conditions, halving a vessel radius while holding other factors constant changes resistance by what factor?","tr":"İdeal Poiseuille koşullarında diğer değişkenler sabitken damar yarıçapının yarıya inmesi direnci kaç katına çıkarır?"},"options":[{"en":"2","tr":"2"},{"en":"4","tr":"4"},{"en":"8","tr":"8"},{"en":"16","tr":"16"},{"en":"32","tr":"32"}],"answer":3,"explanation":{"en":"Resistance is inversely proportional to the fourth power of radius. Halving radius therefore raises resistance by 2⁴, or sixteenfold.","tr":"Direnç yarıçapın dördüncü kuvvetiyle ters orantılıdır. Bu nedenle yarıçapı yarıya indirmek direnci 2⁴, yani on altı kat artırır."},"sourcePages":[148,149],"difficulty":"applied"},{"id":"c34q2","stem":{"en":"Which vessels are chiefly responsible for adjustable resistance and redistribution of systemic organ blood flow?","tr":"Sistemik organ kan akımının yeniden dağıtılmasını ve ayarlanabilir direnci başlıca hangi damarlar sağlar?"},"options":[{"en":"Arterioles","tr":"Arteriyoller"},{"en":"Venae cavae","tr":"Vena kavalar"},{"en":"Large elastic veins","tr":"Büyük elastik venler"},{"en":"Lymphatic ducts","tr":"Lenfatik kanallar"},{"en":"Coronary sinus","tr":"Koroner sinüs"}],"answer":0,"explanation":{"en":"Arteriolar smooth muscle can markedly alter lumen radius and resistance. This regulates both the distribution of organ flow and the pressure delivered to downstream capillaries.","tr":"Arteriyol düz kası lümen yarıçapını ve direnci belirgin değiştirebilir. Böylece hem organlar arasındaki akım dağılımı hem de aşağıdaki kapillerlere iletilen basınç düzenlenir."},"sourcePages":[150],"difficulty":"core"},{"id":"c34q3","stem":{"en":"Which intrinsic response helps maintain organ flow after an increase in local perfusion pressure?","tr":"Lokal perfüzyon basıncı arttığında hangi intrinsik yanıt organ akımının korunmasına yardımcı olur?"},"options":[{"en":"Passive arteriolar dilation with reduced resistance","tr":"Direnç azalmasıyla pasif arteriyol genişlemesi"},{"en":"Reflex venoconstriction as the sole local mechanism","tr":"Tek lokal mekanizma olarak refleks venokonstriksiyon"},{"en":"Decreased calcium entry into vascular smooth muscle","tr":"Damar düz kasına kalsiyum girişinin azalması"},{"en":"Increased capillary permeability to oxygen","tr":"Kapiller oksijen geçirgenliğinin artması"},{"en":"Myogenic constriction of arteriolar smooth muscle","tr":"Arteriyol düz kasının miyojenik kasılması"}],"answer":4,"explanation":{"en":"Stretch of arteriolar smooth muscle can trigger contraction and increase resistance. Within the autoregulatory range, this opposes the flow increase expected from a higher perfusion pressure.","tr":"Arteriyol düz kasının gerilmesi kasılmayı tetikleyip direnci artırabilir. Otoregülasyon aralığında bu yanıt, yükselen perfüzyon basıncının oluşturacağı akım artışına karşı koyar."},"sourcePages":[150],"difficulty":"core"},{"id":"c34q4","stem":{"en":"At a normal resting heart rate, blood pressure is 120/75 mmHg. What is the usual approximate mean arterial pressure?","tr":"Normal istirahat kalp hızında kan basıncı 120/75 mmHg’dir. Yaygın yaklaşık hesapla ortalama arter basıncı kaçtır?"},"options":[{"en":"80 mmHg","tr":"80 mmHg"},{"en":"90 mmHg","tr":"90 mmHg"},{"en":"97.5 mmHg","tr":"97,5 mmHg"},{"en":"105 mmHg","tr":"105 mmHg"},{"en":"120 mmHg","tr":"120 mmHg"}],"answer":1,"explanation":{"en":"At resting rates, MAP is approximated by diastolic pressure plus one-third of pulse pressure. Here 75 + (120 − 75)/3 = 90 mmHg; this approximation becomes less reliable when cycle timing changes markedly.","tr":"İstirahat hızlarında ortalama arter basıncı yaklaşık olarak diyastolik basınca nabız basıncının üçte biri eklenerek hesaplanır. Burada 75 + (120 − 75)/3 = 90 mmHg bulunur; döngü süreleri belirgin değiştiğinde yaklaşımın güvenilirliği azalır."},"sourcePages":[152,153],"difficulty":"applied"},{"id":"c34q5","stem":{"en":"Which mediator released by endothelium in response to shear stress promotes vascular smooth-muscle relaxation?","tr":"Kayma gerilimine yanıt olarak endotelden salınan hangi aracı damar düz kasını gevşetir?"},"options":[{"en":"Angiotensin II","tr":"Anjiyotensin II"},{"en":"Thromboxane A₂","tr":"Tromboksan A₂"},{"en":"Nitric oxide","tr":"Nitrik oksit"},{"en":"Noradrenaline","tr":"Noradrenalin"},{"en":"Vasopressin","tr":"Vazopressin"}],"answer":2,"explanation":{"en":"Nitric oxide is an endothelium-derived vasodilator that relaxes vascular smooth muscle. Angiotensin II, thromboxane and vasopressin generally act in the opposite direction in systemic resistance vessels.","tr":"Nitrik oksit damar düz kasını gevşeten endotel kaynaklı bir vazodilatördür. Anjiyotensin II, tromboksan ve vazopressin sistemik direnç damarlarında genellikle ters yönde etki eder."},"sourcePages":[150,151],"difficulty":"core"}]},{"id":35,"title":{"en":"Arterial Pressure Waveforms","tr":"Arteriyel Basınç Dalga Şekilleri"},"startPage":155,"section":3,"endPage":157,"questions":[{"id":"c35q1","stem":{"en":"What sustains forward aortic flow during diastole after the aortic valve has closed?","tr":"Aort kapağı kapandıktan sonra diyastolde ileri aort akımını ne sürdürür?"},"options":[{"en":"Continued left ventricular ejection","tr":"Sol ventrikül ejeksiyonunun sürmesi"},{"en":"Active contraction of the aortic endothelium","tr":"Aort endotelinin aktif kasılması"},{"en":"Pulmonary venous pressure acting directly on the aorta","tr":"Pulmoner venöz basıncın doğrudan aorta etki etmesi"},{"en":"Right atrial contraction","tr":"Sağ atriyum kasılması"},{"en":"Elastic recoil of the aortic wall","tr":"Aort duvarının elastik geri çekilmesi"}],"answer":4,"explanation":{"en":"The aorta stores part of systolic energy as stretch of its elastic wall. Recoil releases that energy during diastole, helping maintain flow and diastolic pressure: the Windkessel effect.","tr":"Aort, sistolik enerjinin bir bölümünü elastik duvarının gerilmesi şeklinde depolar. Geri çekilme bu enerjiyi diyastolde açığa çıkararak akımı ve diyastolik basıncı korumaya yardımcı olur; buna Windkessel etkisi denir."},"sourcePages":[155],"difficulty":"core"},{"id":"c35q2","stem":{"en":"How does arterial pressure-wave propagation compare with mean blood velocity in the aorta?","tr":"Arteriyel basınç dalgasının yayılma hızı, aorttaki ortalama kan hızıyla nasıl karşılaştırılır?"},"options":[{"en":"The pressure wave travels more slowly","tr":"Basınç dalgası daha yavaş ilerler"},{"en":"The pressure wave travels much faster","tr":"Basınç dalgası çok daha hızlı ilerler"},{"en":"Both always have identical speed","tr":"İkisinin hızı her zaman aynıdır"},{"en":"Only blood moves; the pressure wave remains stationary","tr":"Yalnız kan hareket eder; basınç dalgası sabit kalır"},{"en":"The pressure wave travels only during diastole","tr":"Basınç dalgası yalnız diyastolde ilerler"}],"answer":1,"explanation":{"en":"Pressure is transmitted as a wave through the arterial wall much faster than the blood itself moves. The palpable radial pulse therefore reflects wave arrival rather than arrival of the same blood ejected moments earlier.","tr":"Basınç, arter duvarında kanın kendi hareketinden çok daha hızlı yayılan bir dalga halinde iletilir. Bu nedenle radiyal nabız, kısa süre önce atılan aynı kanın gelişini değil basınç dalgasının gelişini yansıtır."},"sourcePages":[155],"difficulty":"core"},{"id":"c35q3","stem":{"en":"Moving from the central aorta to a normal peripheral artery, which typical change occurs?","tr":"Santral aorttan normal bir periferik artere gidildiğinde genellikle hangi değişiklik görülür?"},"options":[{"en":"Lower systolic pressure with a larger mean-pressure fall","tr":"Sistolik basıncın düşmesi ve ortalama basıncın daha fazla azalması"},{"en":"Lower pulse pressure with unchanged systolic pressure","tr":"Sistolik basınç aynı kalırken nabız basıncının azalması"},{"en":"Identical waveform shape at every location","tr":"Her yerde aynı dalga şekli"},{"en":"Higher systolic pressure with mean pressure relatively preserved","tr":"Ortalama basınç nispeten korunurken sistolik basıncın artması"},{"en":"Higher diastolic pressure with a narrower pulse pressure","tr":"Diyastolik basıncın artması ve nabız basıncının daralması"}],"answer":3,"explanation":{"en":"Pulse-wave amplification raises peripheral systolic and pulse pressures. Mean arterial pressure changes much less along the large arterial tree, so central and peripheral systolic values need not match.","tr":"Nabız dalgası amplifikasyonu periferik sistolik basıncı ve nabız basıncını artırır. Ortalama arter basıncı büyük arterler boyunca çok daha az değiştiğinden santral ve periferik sistolik değerlerin aynı olması gerekmez."},"sourcePages":[156],"difficulty":"core"},{"id":"c35q4","stem":{"en":"In the central aortic pressure trace, the dicrotic notch is most closely associated with which event?","tr":"Santral aort basınç eğrisindeki dikrotik çentik en yakından hangi olayla ilişkilidir?"},"options":[{"en":"Aortic valve closure","tr":"Aort kapağının kapanması"},{"en":"Mitral valve opening","tr":"Mitral kapağın açılması"},{"en":"Atrial contraction","tr":"Atriyum kasılması"},{"en":"Onset of ventricular ejection","tr":"Ventrikül ejeksiyonunun başlaması"},{"en":"Peak coronary oxygen extraction","tr":"Koroner oksijen ekstraksiyonunun en yüksek düzeye ulaşması"}],"answer":0,"explanation":{"en":"The central aortic notch marks aortic valve closure and the transition into diastole. More distal waveform features are additionally shaped by wave transmission and reflection.","tr":"Santral aorttaki çentik aort kapağının kapanmasını ve diyastole geçişi işaretler. Daha distal dalga özellikleri ayrıca dalganın iletimi ve yansımasından etkilenir."},"sourcePages":[155,156],"difficulty":"core"},{"id":"c35q5","stem":{"en":"With stroke volume unchanged, reduced aortic compliance tends to produce which pressure change?","tr":"Atım hacmi değişmezken aort kompliyansının azalması hangi basınç değişikliğine yol açma eğilimindedir?"},"options":[{"en":"Smaller systolic rise and narrower pulse pressure","tr":"Daha küçük sistolik artış ve daha dar nabız basıncı"},{"en":"Lower systolic pressure with unchanged pulse pressure","tr":"Nabız basıncı değişmeden daha düşük sistolik basınç"},{"en":"Greater systolic rise and wider pulse pressure","tr":"Daha büyük sistolik artış ve daha geniş nabız basıncı"},{"en":"Lower systolic and diastolic pressures by equal amounts","tr":"Sistolik ve diyastolik basıncın eşit miktarda düşmesi"},{"en":"Unchanged pressure because stroke volume is unchanged","tr":"Atım hacmi değişmediği için basıncın değişmemesi"}],"answer":2,"explanation":{"en":"A stiffer aorta accommodates the same ejected volume with a larger pressure increase. This contributes to widened pulse pressure and systolic hypertension with arterial ageing.","tr":"Daha sert aort aynı atılan hacmi daha büyük basınç artışıyla karşılar. Bu durum damar yaşlanmasında nabız basıncının genişlemesine ve sistolik hipertansiyona katkıda bulunur."},"sourcePages":[155],"difficulty":"applied"}]},{"id":36,"title":{"en":"Capillaries and Endothelium","tr":"Kapillerler ve Endotel"},"startPage":158,"section":3,"endPage":162,"questions":[{"id":"c36q1","stem":{"en":"Which capillary feature is particularly important in the blood–brain barrier?","tr":"Kan-beyin bariyerinde hangi kapiller özellik özellikle önemlidir?"},"options":[{"en":"Large endothelial gaps allowing cell passage","tr":"Hücre geçişine izin veren büyük endotel aralıkları"},{"en":"Tight junctions between continuous endothelial cells","tr":"Sürekli endotel hücreleri arasındaki sıkı bağlantılar"},{"en":"A discontinuous basement membrane","tr":"Kesintili bazal membran"},{"en":"Fenestrations typical of intestinal mucosa","tr":"Bağırsak mukozasındakine benzer fenestrasyonlar"},{"en":"A thick smooth-muscle layer around every capillary","tr":"Her kapillerin çevresindeki kalın düz kas tabakası"}],"answer":1,"explanation":{"en":"Brain capillaries have continuous endothelium with especially restrictive tight junctions. Many substances therefore require selective transport rather than passing freely between endothelial cells.","tr":"Beyin kapillerleri özellikle sınırlayıcı sıkı bağlantıları bulunan sürekli endotelden oluşur. Bu nedenle birçok madde endotel hücreleri arasından serbestçe geçmek yerine seçici taşınmaya gereksinim duyar."},"sourcePages":[158],"difficulty":"core"},{"id":"c36q2","stem":{"en":"With other filtration forces unchanged, which change favours movement of fluid out of a capillary?","tr":"Diğer filtrasyon kuvvetleri değişmezken hangi değişiklik sıvının kapiller dışına hareketini kolaylaştırır?"},"options":[{"en":"Reduced capillary hydrostatic pressure","tr":"Kapiller hidrostatik basıncın azalması"},{"en":"Increased plasma oncotic pressure","tr":"Plazma onkotik basıncının artması"},{"en":"Increased interstitial hydrostatic pressure","tr":"İnterstisyel hidrostatik basıncın artması"},{"en":"Increased capillary hydrostatic pressure","tr":"Kapiller hidrostatik basıncın artması"},{"en":"Reduced capillary water permeability","tr":"Kapiller su geçirgenliğinin azalması"}],"answer":3,"explanation":{"en":"Capillary hydrostatic pressure is an outward filtration force. Raising it increases filtration if opposing pressures and barrier properties are unchanged.","tr":"Kapiller hidrostatik basınç dışarı doğru filtrasyonu destekleyen bir kuvvettir. Karşı koyan basınçlar ve bariyer özellikleri değişmiyorsa yükselmesi filtrasyonu artırır."},"sourcePages":[159,161],"difficulty":"core"},{"id":"c36q3","stem":{"en":"In a capillary filtration model, a protein reflection coefficient near 1 means what?","tr":"Kapiller filtrasyon modelinde protein yansıma katsayısının 1’e yakın olması ne anlama gelir?"},"options":[{"en":"The barrier strongly restricts protein passage","tr":"Bariyer protein geçişini güçlü biçimde sınırlar"},{"en":"Proteins cross as freely as water","tr":"Proteinler su kadar serbest geçer"},{"en":"No water can cross the barrier","tr":"Bariyerden hiç su geçemez"},{"en":"Plasma contains no protein","tr":"Plazmada protein yoktur"},{"en":"Capillary hydrostatic pressure is zero","tr":"Kapiller hidrostatik basınç sıfırdır"}],"answer":0,"explanation":{"en":"The reflection coefficient describes how effectively the barrier retains a solute such as protein. A value near 1 permits a strong oncotic effect across the barrier; it does not mean water is impermeable.","tr":"Yansıma katsayısı bariyerin protein gibi bir çözünmüş maddeyi ne kadar etkin tuttuğunu gösterir. Değerin 1’e yakın olması bariyer boyunca güçlü onkotik etkiye olanak verir; suyun geçemediği anlamına gelmez."},"sourcePages":[159],"difficulty":"core"},{"id":"c36q4","stem":{"en":"Which endothelial product has the opposite effect on vascular tone to nitric oxide and prostacyclin?","tr":"Hangi endotel ürünü damar tonusu üzerinde nitrik oksit ve prostasiklinin tersine etki eder?"},"options":[{"en":"Bradykinin","tr":"Bradikinin"},{"en":"Adenosine","tr":"Adenozin"},{"en":"Atrial natriuretic peptide","tr":"Atriyal natriüretik peptit"},{"en":"Histamine","tr":"Histamin"},{"en":"Endothelin","tr":"Endotelin"}],"answer":4,"explanation":{"en":"Endothelin is a potent vasoconstrictor, whereas nitric oxide and prostacyclin promote vasodilation. Endothelium therefore actively regulates vascular tone rather than merely lining the vessel.","tr":"Endotelin güçlü bir vazokonstriktördür; nitrik oksit ve prostasiklin ise vazodilatasyonu destekler. Dolayısıyla endotel yalnız damar yüzeyini kaplamaz, damar tonusunu da aktif olarak düzenler."},"sourcePages":[162],"difficulty":"core"},{"id":"c36q5","stem":{"en":"What anticoagulant process is promoted when thrombin binds endothelial thrombomodulin?","tr":"Trombin endotel trombomodulinine bağlandığında hangi antikoagülan süreç desteklenir?"},"options":[{"en":"Activation of factor VIII","tr":"Faktör VIII aktivasyonu"},{"en":"Release of platelet thromboxane","tr":"Trombosit tromboksanı salınımı"},{"en":"Activation of protein C","tr":"Protein C aktivasyonu"},{"en":"Enhanced conversion of fibrinogen to fibrin","tr":"Fibrinojenin fibrine dönüşümünün artması"},{"en":"Binding of platelets to exposed collagen","tr":"Trombositlerin açığa çıkmış kollajene bağlanması"}],"answer":2,"explanation":{"en":"The thrombin–thrombomodulin complex promotes protein C activation. This changes thrombin signalling towards an anticoagulant pathway rather than simply extending clot formation.","tr":"Trombin-trombomodulin kompleksi protein C aktivasyonunu destekler. Böylece trombinin etkisi yalnız pıhtı oluşumunu sürdürmek yerine antikoagülan bir yola yönelir."},"sourcePages":[162],"difficulty":"core"}]},{"id":37,"title":{"en":"Venous System","tr":"Venöz Sistem"},"startPage":163,"section":3,"endPage":165,"questions":[{"id":"c37q1","stem":{"en":"What does high venous compliance mean?","tr":"Yüksek venöz kompliyans ne anlama gelir?"},"options":[{"en":"A small volume change causes a very large pressure change","tr":"Küçük hacim değişikliği çok büyük basınç değişikliği yapar"},{"en":"Veins have greater flow resistance than corresponding arterioles","tr":"Venler karşılık gelen arteriyollerden daha yüksek akım direncine sahiptir"},{"en":"Venous pressure equals arterial pressure","tr":"Venöz basınç arteriyel basınca eşittir"},{"en":"A large volume change occurs with a relatively small pressure change","tr":"Nispeten küçük basınç değişikliğiyle büyük hacim değişikliği olur"},{"en":"Venous volume cannot change during sympathetic stimulation","tr":"Sempatik uyarıda venöz hacim değişemez"}],"answer":3,"explanation":{"en":"Compliance is change in volume divided by change in distending pressure. High venous compliance allows substantial blood storage at low pressure.","tr":"Kompliyans hacim değişikliğinin genişletici basınç değişikliğine oranıdır. Yüksek venöz kompliyans düşük basınçta önemli miktarda kan depolanmasına olanak verir."},"sourcePages":[163,164],"difficulty":"core"},{"id":"c37q2","stem":{"en":"How do competent venous valves assist the calf-muscle pump?","tr":"Sağlam venöz kapaklar baldır kas pompasına nasıl yardımcı olur?"},"options":[{"en":"They prevent backward flow when muscle contraction compresses deep veins","tr":"Kas kasılması derin venleri sıkıştırdığında geri akımı önlerler"},{"en":"They actively contract to generate arterial pressure","tr":"Arteriyel basınç oluşturmak için aktif kasılırlar"},{"en":"They allow equal flow towards and away from the heart","tr":"Kalbe doğru ve kalpten uzağa eşit akıma izin verirler"},{"en":"They close all deep veins during walking","tr":"Yürürken tüm derin venleri kapatırlar"},{"en":"They remove the need for a venous pressure gradient","tr":"Venöz basınç farkı gereksinimini ortadan kaldırırlar"}],"answer":0,"explanation":{"en":"Calf contraction compresses deep veins and moves their contents. Valves direct this displacement towards the heart rather than permitting substantial retrograde flow.","tr":"Baldır kasılması derin venleri sıkıştırıp içlerindeki kanı hareket ettirir. Kapaklar belirgin geri akıma izin vermek yerine bu hareketi kalbe doğru yönlendirir."},"sourcePages":[164],"difficulty":"core"},{"id":"c37q3","stem":{"en":"What is the usual effect of spontaneous inspiration on systemic venous return?","tr":"Spontan inspirasyonun sistemik venöz dönüş üzerindeki olağan etkisi nedir?"},"options":[{"en":"It falls because intrathoracic pressure rises","tr":"İntratorasik basınç arttığı için azalır"},{"en":"It is unchanged because veins are rigid","tr":"Venler rijit olduğu için değişmez"},{"en":"It reverses through the venae cavae","tr":"Vena kavalarda yönü tersine döner"},{"en":"It falls because abdominal pressure necessarily falls","tr":"Karın içi basınç zorunlu olarak düştüğü için azalır"},{"en":"It increases as intrathoracic pressure falls and abdominal pressure helps drive blood centrally","tr":"İntratorasik basınç düşerken abdominal basıncın kanı merkeze itmesiyle artar"}],"answer":4,"explanation":{"en":"Spontaneous inspiration lowers intrathoracic pressure while diaphragmatic descent raises abdominal pressure. This respiratory pump generally favours movement of systemic venous blood towards the thorax.","tr":"Spontan inspirasyon intratorasik basıncı düşürürken diyaframın aşağı inmesi karın içi basıncı artırır. Bu solunum pompası genellikle sistemik venöz kanın toraksa hareketini kolaylaştırır."},"sourcePages":[164],"difficulty":"core"},{"id":"c37q4","stem":{"en":"What is an important immediate haemodynamic effect of positive-pressure inspiration, especially with limited circulating volume?","tr":"Özellikle dolaşım hacmi sınırlıyken pozitif basınçlı inspirasyonun önemli bir erken hemodinamik etkisi nedir?"},"options":[{"en":"Increased systemic venous return from lower right atrial pressure","tr":"Sağ atriyum basıncının düşmesiyle sistemik venöz dönüşün artması"},{"en":"Reduced venous return due to increased intrathoracic pressure","tr":"İntratorasik basınç artışına bağlı venöz dönüş azalması"},{"en":"Increased right ventricular preload in every patient","tr":"Her hastada sağ ventrikül önyükünün artması"},{"en":"Unchanged right-sided filling despite large pressure changes","tr":"Büyük basınç değişimlerine rağmen sağ kalp doluşunun değişmemesi"},{"en":"Selective increase in circulating red-cell mass","tr":"Dolaşımdaki eritrosit kitlesinin seçici artışı"}],"answer":1,"explanation":{"en":"Positive intrathoracic pressure can reduce the pressure gradient driving venous return. Reduced right ventricular filling may subsequently lower cardiac output, particularly when preload reserve is limited.","tr":"Pozitif intratorasik basınç venöz dönüşü sağlayan basınç farkını azaltabilir. Sağ ventrikül doluşunun azalması, özellikle önyük rezervi sınırlıyken daha sonra kalp debisini düşürebilir."},"sourcePages":[164],"difficulty":"applied"},{"id":"c37q5","stem":{"en":"Without adding blood volume, how can sympathetic venoconstriction support venous return?","tr":"Kan hacmi eklemeden sempatik venokonstriksiyon venöz dönüşü nasıl destekleyebilir?"},"options":[{"en":"By increasing venous capacitance","tr":"Venöz kapasitansı artırarak"},{"en":"By lowering mean systemic filling pressure","tr":"Ortalama sistemik dolum basıncını düşürerek"},{"en":"By reducing venous capacitance and mobilising stored blood","tr":"Venöz kapasitansı azaltıp depolanmış kanı mobilize ederek"},{"en":"By increasing arterial oxygen content","tr":"Arteriyel oksijen içeriğini artırarak"},{"en":"By closing venous valves permanently","tr":"Venöz kapakları kalıcı kapatarak"}],"answer":2,"explanation":{"en":"Venoconstriction reduces the volume accommodated at a given pressure and raises mean systemic filling pressure. This can increase the driving pressure for venous return without changing total blood volume.","tr":"Venokonstriksiyon belirli bir basınçta alınabilen hacmi azaltır ve ortalama sistemik dolum basıncını yükseltir. Böylece toplam kan hacmi değişmeden venöz dönüşü sağlayan itici basınç artabilir."},"sourcePages":[164],"difficulty":"core"}]},{"id":38,"title":{"en":"Venous Pressure Waveforms","tr":"Venöz Basınç Dalga Şekilleri"},"startPage":166,"section":3,"endPage":167,"questions":[{"id":"c38q1","stem":{"en":"Which event produces the a-wave of the central venous pressure waveform?","tr":"Santral venöz basınç dalgasındaki a dalgasını hangi olay oluşturur?"},"options":[{"en":"Right atrial contraction","tr":"Sağ atriyum kasılması"},{"en":"Right ventricular ejection into the pulmonary artery","tr":"Sağ ventrikülden pulmoner artere ejeksiyon"},{"en":"Passive filling of the right atrium against a closed tricuspid valve","tr":"Triküspit kapak kapalıyken sağ atriyumun pasif dolması"},{"en":"Opening of the tricuspid valve","tr":"Triküspit kapağın açılması"},{"en":"Aortic valve closure","tr":"Aort kapağının kapanması"}],"answer":0,"explanation":{"en":"The a-wave reflects the pressure increase caused by atrial contraction, following the ECG P-wave. Passive atrial filling during ventricular systole instead contributes to the v-wave.","tr":"a dalgası EKG’deki P dalgasından sonra atriyum kasılmasının oluşturduğu basınç artışını yansıtır. Ventrikül sistolündeki pasif atriyum doluşu ise v dalgasına katkıda bulunur."},"sourcePages":[166],"difficulty":"core"},{"id":"c38q2","stem":{"en":"What change in the central venous waveform is expected with atrial fibrillation?","tr":"Atriyal fibrilasyonda santral venöz dalga şeklinde hangi değişiklik beklenir?"},"options":[{"en":"A regular giant a-wave before every QRS","tr":"Her QRS öncesinde düzenli dev a dalgası"},{"en":"Loss of the y-descent in every case","tr":"Her durumda y inişinin kaybolması"},{"en":"Isolated disappearance of the v-wave","tr":"Yalnız v dalgasının kaybolması"},{"en":"Absence of organised a-waves","tr":"Organize a dalgalarının olmaması"},{"en":"A doubled c-wave frequency with regular atrial contraction","tr":"Düzenli atriyum kasılmasıyla c dalgası sıklığının ikiye katlanması"}],"answer":3,"explanation":{"en":"Atrial fibrillation removes coordinated atrial contraction. The organised a-wave is therefore absent, although other pressure fluctuations remain.","tr":"Atriyal fibrilasyon koordine atriyum kasılmasını ortadan kaldırır. Bu nedenle diğer basınç dalgalanmaları sürse de organize a dalgası bulunmaz."},"sourcePages":[166],"difficulty":"applied"},{"id":"c38q3","stem":{"en":"Intermittent cannon a-waves during complete heart block result from what?","tr":"Tam kalp bloğunda aralıklı top a dalgaları neden oluşur?"},"options":[{"en":"Continuous passive right atrial filling","tr":"Sürekli pasif sağ atriyum doluşu"},{"en":"Atrial contraction against a closed tricuspid valve","tr":"Atriyumun kapalı triküspit kapağa karşı kasılması"},{"en":"Early tricuspid opening during systole","tr":"Triküspit kapağın sistolde erken açılması"},{"en":"Reduced right atrial contraction strength","tr":"Sağ atriyum kasılma kuvvetinin azalması"},{"en":"Pulmonary valve opening during atrial diastole","tr":"Atriyal diyastolde pulmoner kapağın açılması"}],"answer":1,"explanation":{"en":"Atrioventricular dissociation allows occasional atrial contraction while the ventricle is also contracting. The closed tricuspid valve obstructs atrial emptying, creating a large pressure wave.","tr":"Atriyoventriküler disosiyasyonda bazen atriyum, ventrikül de kasılırken kasılır. Kapalı triküspit kapak atriyumun boşalmasını engelleyerek büyük bir basınç dalgası oluşturur."},"sourcePages":[166],"difficulty":"applied"},{"id":"c38q4","stem":{"en":"A prominent systolic v-wave in the central venous pressure trace most strongly suggests which lesion?","tr":"Santral venöz basınç eğrisindeki belirgin sistolik v dalgası en çok hangi lezyonu düşündürür?"},"options":[{"en":"Aortic stenosis","tr":"Aort darlığı"},{"en":"Mitral stenosis","tr":"Mitral darlığı"},{"en":"Isolated pulmonary stenosis","tr":"İzole pulmoner darlık"},{"en":"Atrial septal closure","tr":"Atriyal septal defektin kapanması"},{"en":"Tricuspid regurgitation","tr":"Triküspit yetersizliği"}],"answer":4,"explanation":{"en":"Tricuspid regurgitation allows blood to flow back into the right atrium during ventricular systole. This adds to atrial filling and produces a prominent systolic pressure rise.","tr":"Triküspit yetersizliği ventrikül sistolünde kanın sağ atriyuma geri kaçmasına izin verir. Bu geri kaçış atriyum doluşunu artırarak belirgin sistolik basınç yükselmesi oluşturur."},"sourcePages":[166],"difficulty":"applied"},{"id":"c38q5","stem":{"en":"Why is a single central venous pressure value an unreliable stand-alone measure of circulating volume?","tr":"Tek bir santral venöz basınç değeri dolaşım hacmini tek başına değerlendirmek için neden güvenilir değildir?"},"options":[{"en":"It measures left ventricular volume directly","tr":"Sol ventrikül hacmini doğrudan ölçer"},{"en":"It is unaffected by mechanical ventilation","tr":"Mekanik ventilasyondan etkilenmez"},{"en":"It also depends on chamber compliance and intrathoracic pressure","tr":"Kalp boşluklarının kompliyansına ve intratorasik basınca da bağlıdır"},{"en":"It is numerically identical to pulmonary wedge pressure","tr":"Sayısal olarak pulmoner kama basıncıyla aynıdır"},{"en":"It measures only systemic arteriolar resistance","tr":"Yalnız sistemik arteriyol direncini ölçer"}],"answer":2,"explanation":{"en":"CVP is a pressure influenced by right-heart function, compliance and surrounding thoracic pressure. The same measured value can therefore occur at different blood volumes and does not alone establish fluid responsiveness.","tr":"Santral venöz basınç sağ kalp işlevi, kompliyans ve çevredeki toraks basıncından etkilenen bir basınçtır. Bu nedenle aynı değer farklı kan hacimlerinde görülebilir ve tek başına sıvı yanıtlılığını göstermez."},"sourcePages":[167],"difficulty":"core"}]},{"id":39,"title":{"en":"Lymphatics","tr":"Lenfatik Sistem"},"startPage":168,"section":3,"endPage":169,"questions":[{"id":"c39q1","stem":{"en":"Which region normally drains through the right lymphatic duct rather than the thoracic duct?","tr":"Hangi bölge normalde duktus torasikus yerine sağ lenfatik kanal aracılığıyla drene olur?"},"options":[{"en":"Left lower limb","tr":"Sol alt ekstremite"},{"en":"Abdominal viscera","tr":"Karın içi organlar"},{"en":"Left arm","tr":"Sol kol"},{"en":"Right upper quadrant of the body","tr":"Vücudun sağ üst kadranı"},{"en":"Both lower limbs","tr":"Her iki alt ekstremite"}],"answer":3,"explanation":{"en":"The right lymphatic duct drains the right arm and right side of the thorax, head and neck. The thoracic duct drains most of the remainder of the body.","tr":"Sağ lenfatik kanal sağ kolu ve toraksın, başın ve boynun sağ tarafını drene eder. Duktus torasikus vücudun geri kalanının büyük bölümünü drene eder."},"sourcePages":[168],"difficulty":"core"},{"id":"c39q2","stem":{"en":"Which intestinal structure initially receives absorbed chylomicrons?","tr":"Emilen şilomikronları ilk olarak hangi bağırsak yapısı alır?"},"options":[{"en":"Lacteals","tr":"Laktealler"},{"en":"Portal venous capillaries directly","tr":"Doğrudan portal venöz kapillerler"},{"en":"Pancreatic ducts","tr":"Pankreas kanalları"},{"en":"Bile canaliculi","tr":"Safra kanalikülleri"},{"en":"Renal lymphatics","tr":"Renal lenfatikler"}],"answer":0,"explanation":{"en":"Chylomicrons enter intestinal lymphatic capillaries called lacteals. They travel in chyle through lymphatic vessels before reaching the systemic venous circulation.","tr":"Şilomikronlar lakteal adı verilen bağırsak lenfatik kapillerlerine girer. Sistemik venöz dolaşıma ulaşmadan önce şilüs içinde lenf damarlarından taşınırlar."},"sourcePages":[169],"difficulty":"core"},{"id":"c39q3","stem":{"en":"Which loss of function best explains oedema after extensive regional lymph-node removal?","tr":"Bölgesel lenf düğümlerinin geniş çaplı çıkarılması sonrasında ödemi en iyi hangi işlev kaybı açıklar?"},"options":[{"en":"Reduced arterial oxygen binding","tr":"Arteriyel oksijen bağlanmasının azalması"},{"en":"Increased renal sodium filtration","tr":"Renal sodyum filtrasyonunun artması"},{"en":"Reduced ventricular contractility","tr":"Ventrikül kontraktilitesinin azalması"},{"en":"Loss of venous oxygen extraction","tr":"Venöz oksijen ekstraksiyonunun kaybı"},{"en":"Impaired return of interstitial fluid and proteins","tr":"İnterstisyel sıvı ve proteinlerin geri taşınmasının bozulması"}],"answer":4,"explanation":{"en":"Lymphatic drainage removes fluid and macromolecules from the interstitium. Disruption permits their accumulation and may eventually provoke inflammation and tissue fibrosis.","tr":"Lenfatik drenaj sıvı ve büyük molekülleri interstisyumdan uzaklaştırır. Kesintiye uğraması bunların birikmesine, zamanla inflamasyon ve doku fibrozisine yol açabilir."},"sourcePages":[168,169],"difficulty":"applied"},{"id":"c39q4","stem":{"en":"Which pair consists of primary lymphoid organs?","tr":"Hangi ikili primer lenfoid organlardan oluşur?"},"options":[{"en":"Spleen and tonsils","tr":"Dalak ve tonsiller"},{"en":"Thymus and bone marrow","tr":"Timus ve kemik iliği"},{"en":"Lymph nodes and Peyer patches","tr":"Lenf düğümleri ve Peyer plakları"},{"en":"Tonsils and thymus","tr":"Tonsiller ve timus"},{"en":"Spleen and lymph nodes","tr":"Dalak ve lenf düğümleri"}],"answer":1,"explanation":{"en":"The thymus and bone marrow are primary sites of lymphocyte development. Secondary lymphoid tissues, such as lymph nodes and spleen, support antigen-driven immune responses.","tr":"Timus ve kemik iliği lenfosit gelişiminin primer yerleridir. Lenf düğümleri ve dalak gibi sekonder lenfoid dokular antijenle başlatılan bağışıklık yanıtlarını destekler."},"sourcePages":[168],"difficulty":"core"},{"id":"c39q5","stem":{"en":"Injury near the left internal jugular–subclavian venous junction can cause chylothorax by damaging which structure?","tr":"Sol internal juguler-subklavyen ven birleşimi yakınındaki yaralanma hangi yapıyı zedeleyerek şilotoraksa yol açabilir?"},"options":[{"en":"Right lymphatic duct","tr":"Sağ lenfatik kanal"},{"en":"Azygos vein","tr":"Azigos veni"},{"en":"Thoracic duct","tr":"Duktus torasikus"},{"en":"Pulmonary artery","tr":"Pulmoner arter"},{"en":"Coronary sinus","tr":"Koroner sinüs"}],"answer":2,"explanation":{"en":"The thoracic duct ends near the left venous angle and carries lipid-rich chyle. Injury can allow chyle to leak into the thorax, producing chylothorax.","tr":"Duktus torasikus sol venöz açı yakınında sonlanır ve lipitten zengin şilüs taşır. Yaralanması şilüsün toraksa sızmasına ve şilotoraksa yol açabilir."},"sourcePages":[168],"difficulty":"applied"}]},{"id":40,"title":{"en":"Cardiovascular Reflexes","tr":"Kardiyovasküler Refleksler"},"startPage":170,"section":3,"endPage":174,"questions":[{"id":"c40q1","stem":{"en":"Carotid sinus baroreceptor afferents mainly reach the brainstem through which cranial nerve?","tr":"Karotis sinüsü baroreseptör afferentleri beyin sapına başlıca hangi kraniyal sinirle ulaşır?"},"options":[{"en":"Vagus, cranial nerve X","tr":"Vagus, X. kraniyal sinir"},{"en":"Glossopharyngeal, cranial nerve IX","tr":"Glossofaringeal, IX. kraniyal sinir"},{"en":"Trigeminal, cranial nerve V","tr":"Trigeminal, V. kraniyal sinir"},{"en":"Facial, cranial nerve VII","tr":"Fasiyal, VII. kraniyal sinir"},{"en":"Hypoglossal, cranial nerve XII","tr":"Hipoglossal, XII. kraniyal sinir"}],"answer":1,"explanation":{"en":"Carotid sinus afferents travel through the glossopharyngeal nerve. Aortic arch baroreceptor afferents instead travel through the vagus.","tr":"Karotis sinüsü afferentleri glossofaringeal sinirle taşınır. Aort kavsi baroreseptör afferentleri ise vagus aracılığıyla iletilir."},"sourcePages":[170],"difficulty":"core"},{"id":"c40q2","stem":{"en":"An acute rise in arterial pressure increases baroreceptor firing. What is the expected reflex response?","tr":"Arter basıncının akut yükselmesi baroreseptör ateşlemesini artırır. Beklenen refleks yanıt nedir?"},"options":[{"en":"Increased sympathetic tone and tachycardia","tr":"Artmış sempatik tonus ve taşikardi"},{"en":"Increased renin release and venoconstriction","tr":"Artmış renin salınımı ve venokonstriksiyon"},{"en":"Increased contractility with arteriolar constriction","tr":"Arteriyol daralmasıyla artmış kontraktilite"},{"en":"Reduced sympathetic activity and slowing of heart rate","tr":"Sempatik aktivitenin azalması ve kalp hızının yavaşlaması"},{"en":"Reduced baroreceptor sensitivity within milliseconds to abolish the response","tr":"Yanıtı ortadan kaldıracak şekilde baroreseptör duyarlılığının milisaniyeler içinde azalması"}],"answer":3,"explanation":{"en":"Increased stretch signals oppose the initial pressure rise through autonomic feedback. Heart rate and sympathetic vasoconstrictor activity fall, reducing cardiac and vascular contributions to pressure.","tr":"Artan gerilme sinyalleri otonom geri bildirimle başlangıçtaki basınç yükselmesine karşı koyar. Kalp hızı ve sempatik vazokonstriktör aktivite azalarak basınca kardiyak ve vasküler katkıları düşürür."},"sourcePages":[170,171],"difficulty":"applied"},{"id":"c40q3","stem":{"en":"In the Bainbridge reflex, increased right atrial filling tends to produce which response?","tr":"Bainbridge refleksinde sağ atriyum doluşunun artması hangi yanıtı oluşturma eğilimindedir?"},"options":[{"en":"Tachycardia","tr":"Taşikardi"},{"en":"Isolated bradycardia","tr":"İzole bradikardi"},{"en":"Generalised arteriolar constriction without a heart-rate change","tr":"Kalp hızı değişmeden yaygın arteriyol daralması"},{"en":"Reduced sinoatrial firing","tr":"Sinoatriyal ateşlemenin azalması"},{"en":"A fall in heart rate through carotid sinus compression","
