    }}>
      <div style={{
        width: "100%", height: "100%", background: "var(--ab-sand)", borderRadius: 44,

<script type="text/babel" data-presets="react">
// Anesthesia Briefs — Pediatric Dose Calculator detail screen.
const DS_CALC = window.AnesthesiaBriefsDesignSystem_a9434e;

function CalculatorScreen() {
  const { PremiumCard, DoseRow } = DS_CALC;
  const [wt, setWt] = React.useState(15);

  const f = (n, d = 2) => n.toFixed(d);
  const doses = [
    { label: "Epinephrine (CPR / Resuscitation)", value: `${f(wt * 0.01, 3)} mg`, secondary: `${f(wt * 0.1)} mL`, note: "Dilute 1 mg ampoule with 10 mL saline (1:10,000). Give 0.1 mL/kg." },
    { label: "Atropine (Bradycardia)", value: `${f(wt * 0.02)} mg`, secondary: `${f(wt * 0.2)} mL`, note: "Dilute 0.5 mg in 5 mL saline (0.1 mg/mL). Min 0.1 mg, max 0.5 mg." },
    { label: "Propofol 1% (Induction)", value: `${f(wt * 2.5, 1)} mg`, secondary: `${f(wt * 0.25)} mL`, note: "10 mg/mL solution drawn directly at 2.5 mg/kg." },
    { label: "Ketamine (Induction / Sedation)", value: `${f(wt * 2, 1)} mg`, secondary: `${f(wt * 0.2)} mL`, note: "Dilute 50 mg/mL ampoule in 5 mL saline (10 mg/mL). Draw 2 mg/kg." },
  ];

  return (
    <div style={{ flex: 1, overflowY: "auto", background: "var(--ab-sand)", display: "flex", flexDirection: "column" }}>
      <div style={{ background: "var(--gradient-header)", padding: "54px 20px 18px", color: "#fff", display: "flex", alignItems: "center", gap: 14 }}>
        <i className="fa-solid fa-arrow-left" style={{ fontSize: 18 }} />
        <span style={{ fontFamily: "var(--font-display)", fontWeight: 700, fontSize: 19, lineHeight: 1.15 }}>Pediatric Emergency &amp; Induction Dose Calculator</span>
      </div>

      <div style={{ padding: "18px 20px 28px", display: "flex", flexDirection: "column", gap: 18 }}>
        <p style={{ margin: 0, fontFamily: "var(--font-body)", fontSize: 15, lineHeight: 1.45, color: "var(--ab-text-muted)" }}>
          Calculates the mg and diluted mL doses of emergency resuscitation and anesthesia induction drugs by weight.
        </p>

        <PremiumCard padding="18px">
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline" }}>
            <span style={{ fontFamily: "var(--font-display)", fontWeight: 700, fontSize: 17, color: "var(--ab-navy)" }}>Child Body Weight</span>
            <span style={{ fontFamily: "var(--font-display)", fontWeight: 800, fontSize: 22, color: "var(--ab-navy)" }}>{f(wt, 1)} kg</span>
          </div>
          <input type="range" min="3" max="40" step="0.5" value={wt} onChange={(e) => setWt(parseFloat(e.target.value))}
            style={{ width: "100%", marginTop: 16, accentColor: "var(--ab-teal)" }} />
        </PremiumCard>

        <div style={{ fontFamily: "var(--font-display)", fontWeight: 900, fontSize: 20, color: "var(--ab-navy)", letterSpacing: "-0.3px" }}>Calculated Doses</div>

        <PremiumCard padding="18px">
          <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
            {doses.map((d, i) => (
              <DoseRow key={i} {...d} divider={i < doses.length - 1} />

}
window.CalculatorScreen = CalculatorScreen;

</script>

<script type="text/babel" data-presets="react">
// Anesthesia Briefs — Regional Anesthesia atlas (hub + block detail).
// Hub lists nerve blocks by region; selecting one opens an atlas detail with
// Anatomy / Sonoanatomy tabs, probe-needle approach, and LA dosing.
const DS_REG = window.AnesthesiaBriefsDesignSystem_a9434e;

const REG_BLOCKS = [
  { id: "interscalene", name: "Interscalene", region: "upper", target: "C5–C6 roots (brachial plexus)", use: "Shoulder & proximal humerus", la: "15–20 mL · 0.5% bupivacaine", icon: "fa-hand", pearls: "Phrenic nerve palsy in ~100% — avoid in severe respiratory disease." },
  { id: "supraclavicular", name: "Supraclavicular", region: "upper", target: "Trunks/divisions, lateral to subclavian a.", use: "Elbow, forearm & hand", la: "20–25 mL · 0.5% bupivacaine", icon: "fa-hand", pearls: "“Corner pocket” target; keep needle in-plane, watch the pleura." },
  { id: "infraclavicular", name: "Infraclavicular", region: "upper", target: "Cords around axillary a., deep to pec. minor", use: "Elbow, forearm & hand", la: "20–30 mL · 0.5% bupivacaine", icon: "fa-hand", pearls: "Aim for a U-shaped spread posterior to the axillary artery." },
  { id: "femoral", name: "Femoral", region: "lower", target: "Femoral n., lateral to femoral a.", use: "Anterior thigh, knee, femur", la: "15–20 mL · 0.25–0.5% bupivacaine", icon: "fa-person-walking", pearls: "Hyperechoic n. under fascia iliaca, lateral to the artery." },
  { id: "adductor_canal", name: "Adductor Canal", region: "lower", target: "Saphenous n. in the canal", use: "Knee — motor-sparing analgesia", la: "10–15 mL · 0.25% bupivacaine", icon: "fa-person-walking", pearls: "Preserves quadriceps strength vs femoral — better for ambulation." },
  { id: "popliteal", name: "Popliteal Sciatic", region: "lower", target: "Sciatic n. above its bifurcation", use: "Foot & ankle", la: "20–30 mL · 0.5% bupivacaine", icon: "fa-person-walking", pearls: "Block above the bifurcation for both tibial & common peroneal." },
  { id: "esp", name: "Erector Spinae (ESP)", region: "trunk", target: "Fascial plane deep to erector spinae", use: "Thoracic & abdominal wall", la: "20–30 mL · 0.25% bupivacaine", icon: "fa-shield-heart", pearls: "Inject onto the transverse process; craniocaudal spread." },
  { id: "tap", name: "Transversus Abdominis (TAP)", region: "trunk", target: "Plane between IO & TA muscles", use: "Anterior abdominal wall", la: "15–20 mL per side", icon: "fa-shield-heart", pearls: "Somatic analgesia only — combine with multimodal for visceral pain." },
];

const REG_REGIONS = { all: "All Blocks", upper: "Upper Limb", lower: "Lower Limb", trunk: "Truncal" };
const REG_REGIONS_TR = { all: "Tüm Bloklar", upper: "Üst Ekstremite", lower: "Alt Ekstremite", trunk: "Gövde" };

function RegionalScreen({ onBack }) {
  const { SearchField, CategoryChip, ClinicalNote, PremiumCard, Badge } = DS_REG;
  const [region, setRegion] = React.useState("all");
  const [block, setBlock] = React.useState(null);
  const [tab, setTab] = React.useState("anatomy");

  // ---- Block detail view ----
  if (block) {
    const b = REG_BLOCKS.find((x) => x.id === block);
    return (
      <div style={{ flex: 1, overflowY: "auto", background: "var(--ab-sand)", display: "flex", flexDirection: "column" }}>
        <div style={{ background: "var(--gradient-header)", padding: "54px 20px 20px", color: "#fff", position: "relative", overflow: "hidden" }}>
          <div style={{ position: "absolute", right: -50, top: -40, width: 150, height: 150, borderRadius: "50%", background: "rgba(74,124,140,0.18)" }} />
          <div style={{ display: "flex", alignItems: "center", gap: 14, position: "relative" }}>
            <i className="fa-solid fa-arrow-left" style={{ fontSize: 18, cursor: "pointer" }} onClick={() => setBlock(null)} />
            <span style={{ fontFamily: "var(--font-display)", fontWeight: 700, fontSize: 13, letterSpacing: "0.5px", textTransform: "uppercase", color: "rgba(255,255,255,0.65)" }}>Regional Atlas</span>
          </div>
          <h1 style={{ margin: "12px 0 4px", fontFamily: "var(--font-display)", fontWeight: 900, fontSize: 25, letterSpacing: "-0.5px", position: "relative" }}>{b.name} Block</h1>
          <p style={{ margin: 0, fontFamily: "var(--font-body)", fontSize: 13, color: "rgba(255,255,255,0.78)", position: "relative" }}>{b.use}</p>
        </div>

        <div style={{ padding: "18px 20px 28px", display: "flex", flexDirection: "column", gap: 16 }}>
          {/* Atlas image with tabs */}
          <div>
            <div style={{ display: "flex", gap: 8, marginBottom: 12 }}>
              {[["anatomy", "Anatomy"], ["sono", "Sonoanatomy"]].map(([k, lbl]) => (
                <CategoryChip key={k} selected={tab === k} onClick={() => setTab(k)}>{lbl}</CategoryChip>
              ))}
            </div>
            <div style={{
              borderRadius: "var(--radius-lg)", overflow: "hidden", position: "relative",
              background: "#fff", border: "1px solid var(--border-subtle)",
              boxShadow: "var(--shadow-card)",
            }}>
              <img src={`assets/atlas/${b.id}_${tab === "sono" ? "sono" : "anatomy"}.png`}
                alt={`${b.name} ${tab}`} style={{ width: "100%", display: "block" }} />
            </div>
          </div>

          {/* Target / landmarks */}
          <PremiumCard padding="16px">
            <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
              <Row icon="fa-bullseye" color="var(--ab-teal)" label="Target" value={b.target} />
              <div style={{ height: 1, background: "rgba(27,54,93,0.08)" }} />
              <Row icon="fa-syringe" color="var(--ab-navy)" label="Local Anesthetic" value={b.la} />
            </div>
          </PremiumCard>

          <ClinicalNote tone="info">{b.pearls}</ClinicalNote>
          <ClinicalNote tone="warning">Aspirate before and during injection. Stop immediately for paresthesia, high resistance, or any sign of LAST.</ClinicalNote>
        </div>
      </div>
    );
  }

  // ---- Hub view ----
  const shown = REG_BLOCKS.filter((b) => region === "all" || b.region === region);
  const accentFor = (r) => r === "upper" ? "var(--ab-teal)" : r === "lower" ? "var(--ab-navy)" : "var(--ab-gold)";
  return (
    <div style={{ flex: 1, overflowY: "auto", background: "var(--ab-sand)", display: "flex", flexDirection: "column" }}>
      <div style={{ background: "var(--gradient-header)", padding: "54px 20px 22px", color: "#fff", borderBottomLeftRadius: 32, borderBottomRightRadius: 32, position: "relative", overflow: "hidden" }}>
        <div style={{ position: "absolute", right: -40, top: -50, width: 160, height: 160, borderRadius: "50%", background: "rgba(74,124,140,0.16)" }} />
        <div style={{ display: "flex", alignItems: "center", gap: 14, position: "relative" }}>
          <i className="fa-solid fa-arrow-left" style={{ fontSize: 18, cursor: "pointer" }} onClick={onBack} />
          <span style={{ fontFamily: "var(--font-display)", fontWeight: 700, fontSize: 13, letterSpacing: "0.5px", textTransform: "uppercase", color: "rgba(255,255,255,0.65)" }}>Visual Atlas</span>
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 12, marginTop: 14, position: "relative" }}>
          <div style={{ width: 46, height: 46, borderRadius: 14, background: "rgba(255,255,255,0.12)", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 22, color: "var(--ab-gold)" }}>
            <i className="fa-solid fa-layer-group" />
          </div>
          <div>
            <h1 style={{ margin: 0, fontFamily: "var(--font-display)", fontWeight: 900, fontSize: 24, letterSpacing: "-0.5px" }}>Regional Anesthesia</h1>
            <p style={{ margin: "2px 0 0", fontFamily: "var(--font-body)", fontSize: 13, color: "rgba(255,255,255,0.78)" }}>Ultrasound-guided nerve block atlas</p>
          </div>
        </div>
      </div>

      <div style={{ padding: "18px 20px 28px" }}>
        <SearchField placeholder="Search a block or nerve…" />
        <div style={{ display: "flex", gap: 8, overflowX: "auto", margin: "16px 0 18px", paddingBottom: 4 }}>
          {Object.keys(REG_REGIONS).map((r) => (
            <CategoryChip key={r} selected={region === r} onClick={() => setRegion(r)}>{REG_REGIONS[r]}</CategoryChip>
          ))}
        </div>

        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
          {shown.map((b) => {
            const ac = accentFor(b.region);
            return (
              <div key={b.id} onClick={() => { setBlock(b.id); setTab("anatomy"); }} style={{
                cursor: "pointer", background: "var(--surface-card-bright)", border: "1.2px solid rgba(27,54,93,0.08)",
                borderRadius: "var(--radius-lg)", padding: 14, position: "relative", overflow: "hidden",
                boxShadow: "var(--shadow-card)",
              }}>
                <div style={{ position: "absolute", left: 0, top: 0, bottom: 0, width: 4, background: ac }} />
                <div style={{ width: 38, height: 38, borderRadius: 11, background: `color-mix(in srgb, ${ac} 14%, transparent)`, display: "flex", alignItems: "center", justifyContent: "center", color: ac, fontSize: 17, marginBottom: 10 }}>
                  <i className={`fa-solid ${b.icon}`} />
                </div>
                <div style={{ fontFamily: "var(--font-display)", fontWeight: 800, fontSize: 14, color: "var(--ab-navy)", lineHeight: 1.2 }}>{b.name}</div>
                <div style={{ fontFamily: "var(--font-body)", fontSize: 11, color: "var(--ab-text-muted)", marginTop: 4 }}>{b.use}</div>
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

function Row({ icon, color, label, value }) {
  return (
    <div style={{ display: "flex", alignItems: "flex-start", gap: 12 }}>
      <span style={{ color, fontSize: 16, marginTop: 1, width: 18, textAlign: "center", flex: "none" }}><i className={`fa-solid ${icon}`} /></span>
      <div>
        <div style={{ fontFamily: "var(--font-display)", fontSize: 11, fontWeight: 800, letterSpacing: "0.5px", textTransform: "uppercase", color: "var(--ab-text-muted)" }}>{label}</div>
        <div style={{ fontFamily: "var(--font-body)", fontSize: 14, color: "var(--ab-navy)", marginTop: 2 }}>{value}</div>
      </div>
    </div>
  );
}

window.RegionalScreen = RegionalScreen;

</script>
<script type="text/babel" data-presets="react">
const { BottomNav } = window.AnesthesiaBriefsDesignSystem_a9434e;

function LiteratureScreen() {
  return (
    <div style={{ flex: 1, overflowY: "auto", background: "var(--ab-sand)", padding: "54px 20px 24px" }}>
      <h1 style={{ margin: 0, fontFamily: "var(--font-display)", fontWeight: 900, fontSize: 28, letterSpacing: "-0.6px", color: "var(--ab-navy)" }}>Literature</h1>
      <p style={{ margin: "6px 0 18px", fontFamily: "var(--font-body)", fontSize: 15, color: "var(--ab-text-muted)" }}>Paper & study synopses, current guidelines.</p>
      <div style={{ fontFamily: "var(--font-body)", color: "var(--ab-text-muted)", fontSize: 14, marginTop: 40, textAlign: "center" }}>
        <i className="fa-solid fa-book-open" style={{ fontSize: 30, color: "var(--ab-border)" }} /><br /><br />
        Synopsis list omitted in this kit.
      </div>
    </div>
  );
}

function App() {
  const _params = new URLSearchParams(window.location.search);
  const _bare = _params.get("bare") === "1";
  const _lang = _params.get("lang") === "tr" ? "tr" : "en";
  const _nav = _lang === "tr"
    ? ["Ana Sayfa", "Hesaplar", "Algoritmalar", "\u0130la\u00e7lar", "Literat\u00fcr"]
    : ["Home", "Calculators", "Algorithms", "Drugs", "Literature"];
  const _initTab = { home: 0, calculator: 1, calculators: 1, algorithms: 2, drugs: 3, literature: 4 }[_params.get("screen")] ?? (parseInt(_params.get("tab"), 10) || 0);
  const [tab, setTab] = React.useState(_initTab);
  const [detail, setDetail] = React.useState(null); // 'algo' | 'regional' | null

  // Allow the marketing page (parent frame) to drive navigation.
  React.useEffect(() => {
    function onMsg(e) {
      if (e.origin !== window.location.origin) return;
      const d = e.data || {};
      if (d.type !== "ab-demo-nav") return;
      setDetail(d.detail || null);
      if (typeof d.tab === "number") setTab(d.tab);
    }
    window.addEventListener("message", onMsg);
    return () => window.removeEventListener("message", onMsg);
  }, []);

  let screen, statusDark = false;
  if (detail === "algo") { screen = <AlgorithmFlowScreen onBack={() => setDetail(null)} />; statusDark = true; }
  else if (detail === "regional") { screen = <RegionalScreen onBack={() => setDetail(null)} />; statusDark = true; }
  else if (tab === 0) { screen = <HomeScreen onTab={setTab} onOpenAlgo={() => setDetail("algo")} onOpenRegional={() => setDetail("regional")} />; statusDark = true; }
  else if (tab === 1) { screen = <CalculatorScreen />; statusDark = true; }
  else if (tab === 2) { screen = <AlgorithmsScreen onOpenAlgo={() => setDetail("algo")} />; }
  else if (tab === 3) { screen = <DrugsScreen />; }
  else { screen = <LiteratureScreen />; }

  const inner = (
    <React.Fragment>
      <div style={{ flex: 1, minHeight: 0, position: "relative", display: "flex", flexDirection: "column" }}>
        <div style={{ flex: 1, minHeight: 0, display: "flex", flexDirection: "column" }}>{screen}</div>
        {/* Gold AI FAB */}
        <button onClick={() => {}} style={{
          position: "absolute", right: 16, bottom: 16, width: 56, height: 56, borderRadius: 16,
          background: "var(--ab-gold)", color: "var(--ab-navy)", border: "none", cursor: "pointer",
          boxShadow: "0 8px 20px rgba(194,162,103,0.45)", fontSize: 22, zIndex: 40,
        }}><i className="fa-solid fa-wand-magic-sparkles" /></button>
      </div>
      <BottomNav active={detail ? 2 : tab} onSelect={(i) => { setDetail(null); setTab(i); }} items={[
        { icon: "fa-house", label: _nav[0] },
        { icon: "fa-calculator", label: _nav[1] },
        { icon: "fa-sitemap", label: _nav[2] },
        { icon: "fa-prescription-bottle-medical", label: _nav[3] },
        { icon: "fa-book-open", label: _nav[4] },
      ]} />
    </React.Fragment>
  );

  if (_bare) {
    return (
      <div style={{ width: "100vw", height: "100vh", background: "var(--ab-sand)", display: "flex", flexDirection: "column", overflow: "hidden" }}>
        {inner}
      </div>
    );
  }

  return (
    <PhoneFrame statusDark={statusDark}>
      {inner}
    </PhoneFrame>
  );
}
if (new URLSearchParams(window.location.search).get("bare") === "1") {
  document.body.style.cssText = "margin:0;padding:0;background:var(--ab-sand);display:block;min-height:0;";
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
