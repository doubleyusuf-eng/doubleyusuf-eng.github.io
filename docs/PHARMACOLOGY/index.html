<script id="questionData" type="application/json">{"version":"2026-10-11","book":{"title":"Pharmacology for Anaesthesia and Intensive Care","edition":5,"year":2021,"authors":["Tom Peck","Benjamin Harris"],"pdfPageOffset":12,"pdfPages":388,"ISBN":"9781108710961"},"sections":[{"id":1,"title":{"en":"Basic Principles","tr":"Temel İlkeler"}},{"id":2,"title":{"en":"Core Drugs in Anaesthetic Practice","tr":"Anestezi Uygulamasında Temel İlaçlar"}},{"id":3,"title":{"en":"Cardiovascular Drugs","tr":"Kardiyovasküler İlaçlar"}},{"id":4,"title":{"en":"Other Important Drugs","tr":"Diğer Önemli İlaçlar"}}],"chapters":[{"id":1,"title":{"en":"Drug Passage across the Cell Membrane","tr":"İlaçların Hücre Zarından Geçişi"},"startPage":1,"endPage":7,"pdfStartPage":13,"pdfEndPage":19,"section":1,"questions":[{"id":"c01q1","stem":{"en":"In a membrane experiment, a neutral drug crosses a lipid bilayer by simple diffusion. Membrane area, thickness and permeability stay constant. Which change increases its initial net transfer rate?","tr":"Bir zar deneyinde nötr bir ilaç, lipit çift tabakadan basit difüzyonla geçmektedir. Zarın alanı, kalınlığı ve geçirgenliği sabit kalmaktadır. Hangi değişiklik ilacın başlangıçtaki net geçiş hızını artırır?"},"options":[{"en":"Increasing protein-bound drug while keeping free-drug concentrations unchanged","tr":"Serbest ilaç konsantrasyonları değişmeden proteine bağlı ilacın artırılması"},{"en":"Making the free-drug concentrations equal on both sides","tr":"İki taraftaki serbest ilaç konsantrasyonlarının eşitlenmesi"},{"en":"Increasing the free-drug concentration difference across the membrane","tr":"Zarın iki tarafı arasındaki serbest ilaç konsantrasyonu farkının artırılması"},{"en":"Reducing the free-drug concentration on the donor side","tr":"İlacın kaynak tarafındaki serbest ilaç konsantrasyonunun azaltılması"},{"en":"Removing the concentration gradient while adding ATP","tr":"ATP eklenirken konsantrasyon gradyanının ortadan kaldırılması"}],"answer":2,"explanation":{"en":"Fick’s law relates net passive transfer to the concentration difference across a membrane. Increasing the free-drug gradient therefore increases transfer; adding protein-bound drug without changing that gradient does not have the same immediate effect.","tr":"Fick yasasına göre zardan net pasif geçiş, iki taraf arasındaki konsantrasyon farkıyla ilişkilidir. Bu nedenle serbest ilaç gradyanının artırılması geçişi hızlandırır; gradyanı değiştirmeden proteine bağlı ilacı artırmak aynı ani etkiyi oluşturmaz."},"sourcePages":[1,5,6],"difficulty":"applied","sourcePdfPages":[13,17,18]},{"id":"c01q2","stem":{"en":"A hypothetical weak base has a pKa of 8.0. At pH 7.0, approximately what fraction is unionised?","tr":"Varsayımsal bir zayıf bazın pKa değeri 8,0’dır. pH 7,0 iken yaklaşık ne kadarı iyonize olmamış biçimdedir?"},"options":[{"en":"1%","tr":"%1"},{"en":"50%","tr":"%50"},{"en":"91%","tr":"%91"},{"en":"99%","tr":"%99"},{"en":"9%","tr":"%9"}],"answer":4,"explanation":{"en":"For a weak base, the unionised-to-ionised ratio is 10^(pH − pKa), which here is 0.1. The unionised fraction is therefore 0.1/1.1, about 9%; 91% is the ionised fraction, not the unionised fraction.","tr":"Zayıf bir baz için iyonize olmamış biçimin iyonize biçime oranı 10^(pH − pKa) olup bu örnekte 0,1’dir. Dolayısıyla iyonize olmamış fraksiyon 0,1/1,1, yani yaklaşık %9’dur; %91 ise iyonize fraksiyondur."},"sourcePages":[5,6],"difficulty":"applied","sourcePdfPages":[17,18]},{"id":"c01q3","stem":{"en":"A polar molecule moves through a membrane-bound carrier down its concentration gradient, without coupling to ATP hydrolysis or another ion gradient. Which transport mechanism is described?","tr":"Polar bir molekül, ATP hidrolizine veya başka bir iyon gradyanına bağlanmadan, zara bağlı bir taşıyıcı aracılığıyla kendi konsantrasyon gradyanı yönünde geçmektedir. Hangi taşıma mekanizması tanımlanmaktadır?"},"options":[{"en":"Facilitated diffusion","tr":"Kolaylaştırılmış difüzyon"},{"en":"Primary active transport","tr":"Primer aktif taşıma"},{"en":"Secondary active transport","tr":"Sekonder aktif taşıma"},{"en":"Pinocytosis","tr":"Pinositoz"},{"en":"Simple diffusion through the lipid bilayer","tr":"Lipit çift tabakadan basit difüzyon"}],"answer":0,"explanation":{"en":"Facilitated diffusion uses a carrier but does not drive the transported molecule against its concentration gradient. Secondary active transport also uses a carrier, but couples transport to an ion gradient maintained by an energy-consuming process.","tr":"Kolaylaştırılmış difüzyon bir taşıyıcı kullanır, ancak taşınan molekülü kendi konsantrasyon gradyanına karşı hareket ettirmez. Sekonder aktif taşıma da taşıyıcı kullanır; fakat taşımayı enerji tüketen bir süreçle sürdürülen iyon gradyanına bağlar."},"sourcePages":[2,3],"difficulty":"core","sourcePdfPages":[14,15]},{"id":"c01q4","stem":{"en":"An amino-acid transporter moves Na+ and an amino acid into the same cell. Na+ moves down its gradient while the amino acid moves against its gradient; the Na+ gradient is maintained by Na+/K+-ATPase. How is the amino-acid transport classified?","tr":"Bir aminoasit taşıyıcısı, Na+ ve bir aminoasidi aynı hücrenin içine taşımaktadır. Na+ kendi gradyanı yönünde, aminoasit ise kendi gradyanına karşı hareket eder; Na+ gradyanı Na+/K+-ATPaz tarafından sürdürülür. Aminoasit taşınması nasıl sınıflandırılır?"},"options":[{"en":"Primary active symport","tr":"Primer aktif simport"},{"en":"Secondary active antiport","tr":"Sekonder aktif antiport"},{"en":"Facilitated diffusion of the amino acid","tr":"Aminoasidin kolaylaştırılmış difüzyonu"},{"en":"Secondary active symport","tr":"Sekonder aktif simport"},{"en":"Passive movement through an ion channel","tr":"Bir iyon kanalından pasif geçiş"}],"answer":3,"explanation":{"en":"The amino-acid carrier obtains energy indirectly from the Na+ gradient, so this is secondary active transport. Because both transported substances move in the same direction it is a symport; antiport would move them in opposite directions.","tr":"Aminoasit taşıyıcısı enerjiyi dolaylı olarak Na+ gradyanından aldığı için bu olay sekonder aktif taşımadır. Taşınan iki madde aynı yönde hareket ettiğinden simport söz konusudur; antiportta maddeler zıt yönlerde taşınır."},"sourcePages":[3,4],"difficulty":"applied","sourcePdfPages":[15,16]},{"id":"c01q5","stem":{"en":"In an isolated plasma sample, a hypothetical drug is initially 98% protein-bound. Binding falls to 96% while the total drug concentration stays unchanged. What happens to the unbound concentration immediately?","tr":"İzole bir plazma örneğinde varsayımsal bir ilacın başlangıçta %98’i proteine bağlıdır. Toplam ilaç konsantrasyonu değişmeden bağlanma oranı %96’ya düşer. Serbest ilaç konsantrasyonu hemen nasıl değişir?"},"options":[{"en":"It falls by half","tr":"Yarıya iner"},{"en":"It doubles","tr":"İki katına çıkar"},{"en":"It rises by only 2%","tr":"Yalnızca %2 artar"},{"en":"It is unchanged","tr":"Değişmez"},{"en":"It becomes four times the initial value","tr":"Başlangıç değerinin dört katına çıkar"}],"answer":1,"explanation":{"en":"The free fraction increases from 2% to 4%, so the unbound concentration doubles at the same total concentration. This immediate calculation does not predict a sustained twofold increase in vivo, where distribution and clearance may subsequently change.","tr":"Serbest fraksiyon %2’den %4’e çıktığı için aynı toplam konsantrasyonda serbest ilaç konsantrasyonu iki katına çıkar. Bu ani değişimin hesabı, dağılım ve klirensin sonradan değişebildiği canlı organizmada iki kat artışın kalıcı olacağını göstermez."},"sourcePages":[6],"difficulty":"applied","sourcePdfPages":[18]}]},{"id":2,"title":{"en":"Absorption, Distribution, Metabolism and Excretion","tr":"Emilim, Dağılım, Metabolizma ve Atılım"},"startPage":8,"endPage":22,"pdfStartPage":20,"pdfEndPage":34,"section":1,"questions":[{"id":"c02q1","stem":{"en":"In a hypothetical linear pharmacokinetic study, identical doses are given orally and intravenously in separate experiments with unchanged clearance. The oral AUC is 40 concentration–time units and the intravenous AUC is 100. What is the absolute oral bioavailability?","tr":"Varsayımsal bir doğrusal farmakokinetik çalışmada aynı doz, ayrı deneylerde oral ve intravenöz yoldan verilmektedir; klirens değişmemektedir. Oral AUC 40 konsantrasyon–zaman birimi, intravenöz AUC ise 100’dür. Mutlak oral biyoyararlanım nedir?"},"options":[{"en":"4%","tr":"%4"},{"en":"40%","tr":"%40"},{"en":"25%","tr":"%25"},{"en":"60%","tr":"%60"},{"en":"250%","tr":"%250"}],"answer":1,"explanation":{"en":"With identical doses and unchanged clearance, absolute bioavailability is the oral AUC divided by the intravenous AUC: 40/100 = 0.40. Using the inverse ratio gives 250%, which does not describe the fraction of this dose reaching the systemic circulation.","tr":"Dozlar aynı ve klirens değişmemişse mutlak biyoyararlanım, oral AUC’nin intravenöz AUC’ye oranıdır: 40/100 = 0,40. Oranı ters çevirmek %250 verir; bu değer, bu dozun sistemik dolaşıma ulaşan fraksiyonunu ifade etmez."},"sourcePages":[9],"difficulty":"applied","sourcePdfPages":[21]},{"id":"c02q2","stem":{"en":"A small lipophilic drug crosses tissue barriers readily. Immediately after an intravenous bolus, which tissue property most strongly favours rapid initial delivery of the drug?","tr":"Küçük ve lipofilik bir ilaç doku bariyerlerini kolayca geçmektedir. İntravenöz bolustan hemen sonra hangi doku özelliği, ilacın dokuya başlangıçta hızlı ulaşmasını en çok destekler?"},"options":[{"en":"Large fat stores despite very low perfusion","tr":"Çok düşük perfüzyona rağmen büyük yağ depoları"},{"en":"Low capillary blood flow","tr":"Düşük kapiller kan akımı"},{"en":"A large anatomical volume alone","tr":"Tek başına büyük anatomik hacim"},{"en":"High tissue blood flow","tr":"Yüksek doku kan akımı"},{"en":"Absence of all tissue binding sites","tr":"Dokudaki tüm bağlanma bölgelerinin yokluğu"}],"answer":3,"explanation":{"en":"When membrane passage is rapid, perfusion strongly influences initial distribution. Highly perfused tissues receive drug early, whereas a large but poorly perfused fat compartment may take up substantial drug more slowly.","tr":"Zardan geçiş hızlı olduğunda başlangıç dağılımını perfüzyon güçlü biçimde etkiler. İyi perfüze olan dokular ilacı erken alırken büyük fakat az perfüze olan bir yağ kompartımanı önemli miktarda ilacı daha yavaş alabilir."},"sourcePages":[13,14],"difficulty":"applied","sourcePdfPages":[25,26]},{"id":"c02q3","stem":{"en":"Which statement correctly describes the relationship between phase I and phase II drug metabolism?","tr":"Faz I ve faz II ilaç metabolizması arasındaki ilişkiyi hangi ifade doğru açıklar?"},"options":[{"en":"Some drugs undergo phase II conjugation without a preceding phase I reaction","tr":"Bazı ilaçlar, öncesinde faz I reaksiyonu olmadan faz II konjugasyona uğrar"},{"en":"Every phase II reaction requires a preceding phase I reaction","tr":"Her faz II reaksiyonu öncesinde faz I reaksiyonu gerektirir"},{"en":"Hydrolysis is the defining reaction of phase II metabolism","tr":"Hidroliz, faz II metabolizmasının tanımlayıcı reaksiyonudur"},{"en":"Conjugation always produces a metabolite with greater pharmacological activity","tr":"Konjugasyon her zaman daha yüksek farmakolojik aktiviteye sahip bir metabolit oluşturur"},{"en":"Cytochrome P450 enzymes catalyse every phase I and phase II reaction","tr":"Sitokrom P450 enzimleri tüm faz I ve faz II reaksiyonlarını katalizler"}],"answer":0,"explanation":{"en":"Phase I reactions include oxidation, reduction and hydrolysis, whereas phase II reactions include conjugation. The phases are classifications of reactions rather than a compulsory sequence, so a drug with an appropriate functional group can undergo conjugation directly.","tr":"Faz I reaksiyonları oksidasyon, redüksiyon ve hidrolizi; faz II reaksiyonları ise konjugasyonu içerir. Bu fazlar zorunlu bir sıra değil, reaksiyonların sınıflandırılmasıdır; uygun bir fonksiyonel grubu olan ilaç doğrudan konjugasyona uğrayabilir."},"sourcePages":[16,17],"difficulty":"core","sourcePdfPages":[28,29]},{"id":"c02q4","stem":{"en":"In a theoretical renal-tubule experiment, a weak acid is present in tubular fluid. If the tubular fluid becomes more alkaline, with filtration and secretion unchanged, what is the expected effect on passive reabsorption?","tr":"Teorik bir böbrek tübülü deneyinde tübül sıvısında zayıf bir asit bulunmaktadır. Filtrasyon ve sekresyon değişmeden tübül sıvısı daha alkali hâle gelirse pasif geri emilimde hangi değişiklik beklenir?"},"options":[{"en":"More drug becomes unionised, so passive reabsorption increases","tr":"İlacın daha büyük bölümü iyonize olmamış hâle gelir ve pasif geri emilim artar"},{"en":"The ionised fraction decreases while passive reabsorption also decreases","tr":"İyonize fraksiyon azalırken pasif geri emilim de azalır"},{"en":"The drug necessarily becomes a permanently charged molecule","tr":"İlaç zorunlu olarak kalıcı yüklü bir moleküle dönüşür"},{"en":"Ionisation cannot change because the drug’s pKa is constant","tr":"İlacın pKa değeri sabit olduğundan iyonizasyon değişemez"},{"en":"More drug becomes ionised, so passive reabsorption decreases","tr":"İlacın daha büyük bölümü iyonize olur ve pasif geri emilim azalır"}],"answer":4,"explanation":{"en":"Raising pH increases the ionised fraction of a weak acid and reduces its ability to diffuse back through the tubular membrane. A constant pKa does not mean constant ionisation: the relationship between pH and pKa determines the fractions present.","tr":"pH’nın yükselmesi, zayıf asidin iyonize fraksiyonunu artırır ve tübül zarından geri difüzyonunu azaltır. pKa’nın sabit olması iyonizasyonun sabit olduğu anlamına gelmez; mevcut fraksiyonları pH ile pKa arasındaki ilişki belirler."},"sourcePages":[19],"difficulty":"applied","sourcePdfPages":[31]},{"id":"c02q5","stem":{"en":"A hypothetical drug has a hepatic extraction ratio close to 1 because uptake and metabolism are very efficient. If hepatic blood flow decreases while intrinsic metabolic capacity remains high, which change is most likely?","tr":"Varsayımsal bir ilacın hepatik ekstraksiyon oranı, hücreye alımı ve metabolizması çok etkin olduğu için 1’e yakındır. İntrinsik metabolik kapasite yüksek kalırken karaciğer kan akımı azalırsa en olası değişiklik hangisidir?"},"options":[{"en":"Hepatic clearance increases in proportion to the fall in flow","tr":"Hepatik klirens, kan akımındaki azalmayla orantılı olarak artar"},{"en":"Hepatic clearance becomes independent of liver blood flow","tr":"Hepatik klirens karaciğer kan akımından bağımsız hâle gelir"},{"en":"Hepatic clearance decreases because delivery to the liver is flow-limited","tr":"Karaciğere ulaşma kan akımıyla sınırlı olduğu için hepatik klirens azalır"},{"en":"The drug must switch to exclusive renal elimination","tr":"İlaç zorunlu olarak yalnızca böbrekten eliminasyona geçer"},{"en":"The extraction ratio must become zero immediately","tr":"Ekstraksiyon oranı hemen sıfıra düşmek zorundadır"}],"answer":2,"explanation":{"en":"For a high-extraction drug, the liver removes a large fraction of drug delivered to it, so hepatic clearance approaches hepatic blood flow. Lowering delivery therefore lowers clearance; this differs from low-extraction drugs, whose clearance is more dependent on intrinsic capacity and unbound fraction.","tr":"Ekstraksiyonu yüksek bir ilaçta karaciğer kendisine ulaşan ilacın büyük bir bölümünü uzaklaştırır; bu nedenle hepatik klirens karaciğer kan akımına yaklaşır. Karaciğere ulaşan miktarın azalması klirensi düşürür; düşük ekstraksiyonlu ilaçlarda ise klirens daha çok intrinsik kapasiteye ve serbest fraksiyona bağlıdır."},"sourcePages":[10,11],"difficulty":"applied","sourcePdfPages":[22,23]}]},{"id":3,"title":{"en":"Drug Action","tr":"İlaç Etkisi"},"startPage":23,"endPage":36,"pdfStartPage":35,"pdfEndPage":48,"section":1,"questions":[{"id":"c03q1","stem":{"en":"In an isolated receptor system at equilibrium, an antagonist shifts an agonist’s log concentration–response curve to the right without reducing the maximal response. The shift is overcome by increasing agonist concentration. Which mechanism best explains this?","tr":"Denge durumundaki izole bir reseptör sisteminde bir antagonist, agonistin log konsantrasyon–yanıt eğrisini maksimum yanıtı azaltmadan sağa kaydırmaktadır. Agonist konsantrasyonu artırıldığında bu etki aşılabilmektedir. Bunu en iyi hangi mekanizma açıklar?"},"options":[{"en":"Positive allosteric modulation","tr":"Pozitif allosterik modülasyon"},{"en":"Reduced synthesis of the agonist","tr":"Agonist sentezinin azalması"},{"en":"Irreversible removal of every receptor","tr":"Tüm reseptörlerin geri dönüşümsüz olarak ortadan kaldırılması"},{"en":"Increased agonist intrinsic activity","tr":"Agonistin intrinsik aktivitesinin artması"},{"en":"Reversible competitive antagonism","tr":"Geri dönüşümlü kompetitif antagonizma"}],"answer":4,"explanation":{"en":"A reversible competitive antagonist can be displaced from the shared binding site by more agonist. The agonist therefore requires a higher concentration for the same response, but can still reach the original maximum; positive allosteric modulation would enhance rather than oppose its action.","tr":"Geri dönüşümlü kompetitif antagonist, agonistle paylaştığı bağlanma bölgesinden daha fazla agonist tarafından uzaklaştırılabilir. Bu nedenle aynı yanıt için daha yüksek agonist konsantrasyonu gerekir, ancak başlangıçtaki maksimum yanıta yine ulaşılabilir; pozitif allosterik modülasyon ise agonist etkisini engellemek yerine artırır."},"sourcePages":[33,34],"difficulty":"applied","sourcePdfPages":[45,46]},{"id":"c03q2","stem":{"en":"In the same experimental tissue, drug A produces a maximal response of 100 units. Drug B occupies all available receptors but produces only 40 units and, when it displaces A, reduces the response. What best describes B?","tr":"Aynı deneysel dokuda A ilacı 100 birimlik maksimum yanıt oluşturur. B ilacı, mevcut tüm reseptörleri işgal etmesine rağmen yalnızca 40 birim yanıt oluşturur ve A’nın yerini aldığında yanıtı azaltır. B’yi en iyi hangi tanım açıklar?"},"options":[{"en":"A partial agonist at the same receptor","tr":"Aynı reseptörde etkili parsiyel agonist"},{"en":"A full agonist with greater maximal efficacy than A","tr":"Maksimum etkililiği A’dan daha yüksek olan tam agonist"},{"en":"A neutral antagonist with no intrinsic activity","tr":"İntrinsik aktivitesi olmayan nötr antagonist"},{"en":"An inverse agonist suppressing constitutive activity","tr":"Konstitütif aktiviteyi baskılayan invers agonist"},{"en":"A drug with no affinity for the receptor","tr":"Reseptöre afinitesi olmayan ilaç"}],"answer":0,"explanation":{"en":"A partial agonist has affinity and positive intrinsic activity but produces a lower maximum than a full agonist in the same system. It can therefore stimulate the receptor alone yet reduce the response when it replaces a full agonist; a neutral antagonist would not generate the 40-unit response by itself.","tr":"Parsiyel agonist, afinitesi ve pozitif intrinsik aktivitesi olmasına rağmen aynı sistemde tam agonistten daha düşük maksimum yanıt oluşturur. Bu nedenle tek başına reseptörü uyarabilir, ancak tam agonistin yerini aldığında yanıtı azaltabilir; nötr bir antagonist tek başına 40 birimlik yanıt oluşturmaz."},"sourcePages":[30,31,33],"difficulty":"applied","sourcePdfPages":[42,43,45]},{"id":"c03q3","stem":{"en":"Activation of a Gq-coupled receptor most directly initiates which signalling sequence?","tr":"Gq ile eşleşmiş bir reseptörün aktivasyonu en doğrudan hangi sinyal dizisini başlatır?"},"options":[{"en":"Adenylyl cyclase inhibition, followed by decreased cAMP","tr":"Adenilat siklaz inhibisyonu, ardından cAMP azalması"},{"en":"Adenylyl cyclase activation, followed by increased cAMP","tr":"Adenilat siklaz aktivasyonu, ardından cAMP artışı"},{"en":"Phospholipase C activation, followed by formation of IP3 and DAG","tr":"Fosfolipaz C aktivasyonu, ardından IP3 ve DAG oluşumu"},{"en":"Direct opening of a ligand-gated chloride channel","tr":"Ligand kapılı klorür kanalının doğrudan açılması"},{"en":"Direct binding of the receptor to a DNA promoter without a second messenger","tr":"İkincil haberci olmadan reseptörün doğrudan DNA promotörüne bağlanması"}],"answer":2,"explanation":{"en":"Gq activates phospholipase C, which cleaves membrane PIP2 into IP3 and DAG. IP3 promotes calcium release from intracellular stores, whereas DAG activates protein kinase C; adenylyl cyclase stimulation is the characteristic Gs pathway.","tr":"Gq, zardaki PIP2’yi IP3 ve DAG’a ayıran fosfolipaz C’yi aktive eder. IP3 hücre içi depolardan kalsiyum salınımını, DAG ise protein kinaz C aktivasyonunu sağlar; adenilat siklazın uyarılması Gs yolunun tipik özelliğidir."},"sourcePages":[26,28],"difficulty":"core","sourcePdfPages":[38,40]},{"id":"c03q4","stem":{"en":"A lipid-soluble signalling molecule binds an intracellular receptor and changes transcription of selected genes. Why is the onset of its main genomic effects usually slower than that of a ligand-gated ion channel?","tr":"Lipitte çözünen bir sinyal molekülü, hücre içi reseptöre bağlanarak belirli genlerin transkripsiyonunu değiştirir. Başlıca genomik etkilerinin başlangıcı neden genellikle ligand kapılı bir iyon kanalının etkisinden daha yavaştır?"},"options":[{"en":"Intracellular receptors can act only after renal excretion","tr":"Hücre içi reseptörler ancak böbrekten atılım sonrasında etki gösterebilir"},{"en":"Changes in RNA and protein production require time","tr":"RNA ve protein üretimindeki değişiklikler zaman gerektirir"},{"en":"Lipid-soluble molecules cannot cross cell membranes","tr":"Lipitte çözünen moleküller hücre zarından geçemez"},{"en":"Gene transcription opens an ion pore within milliseconds","tr":"Gen transkripsiyonu milisaniyeler içinde bir iyon poru açar"},{"en":"Intracellular receptors lack ligand-binding sites","tr":"Hücre içi reseptörlerin ligand bağlanma bölgeleri yoktur"}],"answer":1,"explanation":{"en":"Genomic signalling alters transcription and subsequent protein production, processes that take longer than opening an existing ion channel. The delay is not caused by inability to enter the cell: lipid solubility facilitates access to intracellular receptors.","tr":"Genomik sinyal iletimi, transkripsiyonu ve ardından protein üretimini değiştirir; bu süreçler mevcut bir iyon kanalının açılmasından daha uzun sürer. Gecikmenin nedeni hücreye girememek değildir; lipitte çözünürlük hücre içi reseptörlere ulaşmayı kolaylaştırır."},"sourcePages":[24,29],"difficulty":"core","sourcePdfPages":[36,41]},{"id":"c03q5","stem":{"en":"A receptor shows measurable activity even without an agonist. Drug X reduces that basal activity, whereas a neutral antagonist blocks an added agonist without changing basal activity. How should X be classified?","tr":"Bir reseptör, agonist bulunmasa bile ölçülebilir aktivite göstermektedir. X ilacı bu bazal aktiviteyi azaltırken nötr bir antagonist, bazal aktiviteyi değiştirmeden sonradan eklenen agonisti engellemektedir. X nasıl sınıflandırılmalıdır?"},"options":[{"en":"Full agonist","tr":"Tam agonist"},{"en":"Partial agonist with positive intrinsic activity","tr":"Pozitif intrinsik aktivitesi olan parsiyel agonist"},{"en":"Neutral competitive antagonist","tr":"Nötr kompetitif antagonist"},{"en":"Inverse agonist","tr":"İnvers agonist"},{"en":"Positive allosteric modulator","tr":"Pozitif allosterik modülatör"}],"answer":3,"explanation":{"en":"An inverse agonist favours inactive receptor conformations and reduces constitutive activity. A neutral antagonist can prevent agonist binding while leaving the active–inactive equilibrium, and thus basal activity, unchanged.","tr":"İnvers agonist, reseptörün inaktif konformasyonlarını destekleyerek konstitütif aktiviteyi azaltır. Nötr bir antagonist ise aktif–inaktif dengesini ve dolayısıyla bazal aktiviteyi değiştirmeden agonistin bağlanmasını engelleyebilir."},"sourcePages":[30,31],"difficulty":"applied","sourcePdfPages":[42,43]}]},{"id":4,"title":{"en":"Drug Interaction","tr":"İlaç Etkileşimleri"},"startPage":37,"endPage":41,"pdfStartPage":49,"pdfEndPage":53,"section":1,"questions":[{"id":"c04q1","stem":{"en":"In a laboratory compatibility test, two solutions form an insoluble precipitate as soon as they are mixed, before either enters a biological system. What type of interaction is this?","tr":"Bir laboratuvar uyumluluk testinde iki çözelti, biyolojik bir sisteme girmeden önce, karıştırılır karıştırılmaz çözünmeyen bir çökelti oluşturmaktadır. Bu hangi etkileşim türüdür?"},"options":[{"en":"Receptor-level competitive antagonism","tr":"Reseptör düzeyinde kompetitif antagonizma"},{"en":"Induction of hepatic metabolism","tr":"Karaciğer metabolizmasının indüklenmesi"},{"en":"Inhibition of renal tubular secretion","tr":"Böbrek tübüler sekresyonunun inhibisyonu"},{"en":"Pharmaceutical physicochemical incompatibility","tr":"Farmasötik fizikokimyasal geçimsizlik"},{"en":"Pharmacodynamic synergism","tr":"Farmakodinamik sinerjizm"}],"answer":3,"explanation":{"en":"Formation of a precipitate on mixing is a physical or chemical incompatibility between preparations. It occurs before absorption, metabolism or receptor action, so it is distinct from pharmacokinetic and pharmacodynamic interactions.","tr":"Karıştırma sırasında çökelti oluşması, preparatlar arasındaki fiziksel veya kimyasal geçimsizliktir. Emilim, metabolizma veya reseptör etkisinden önce ortaya çıktığı için farmakokinetik ve farmakodinamik etkileşimlerden ayrılır."},"sourcePages":[37],"difficulty":"core","sourcePdfPages":[49]},{"id":"c04q2","stem":{"en":"A hypothetical oral drug is a substrate of intestinal P-glycoprotein, which pumps it from enterocytes back into the gut lumen. If a second compound selectively inhibits this transporter and all other processes remain unchanged, what is expected?","tr":"Varsayımsal bir oral ilaç, kendisini enterositlerden bağırsak lümenine geri pompalayan intestinal P-glikoproteinin substratıdır. İkinci bir bileşik bu taşıyıcıyı seçici olarak inhibe eder ve diğer tüm süreçler değişmezse ne beklenir?"},"options":[{"en":"Decreased oral bioavailability because efflux into the lumen increases","tr":"Lümene dışa atım arttığı için oral biyoyararlanımın azalması"},{"en":"Increased oral bioavailability because less drug is returned to the lumen","tr":"Lümene daha az ilaç geri gönderildiği için oral biyoyararlanımın artması"},{"en":"Loss of drug activity because its receptor is blocked","tr":"Reseptörü bloke olduğu için ilaç aktivitesinin kaybolması"},{"en":"Faster hepatic metabolism because all transport inhibitors induce enzymes","tr":"Tüm taşıma inhibitörleri enzimleri indüklediği için hepatik metabolizmanın hızlanması"},{"en":"Unchanged absorption because intestinal transporters cannot affect it","tr":"Bağırsak taşıyıcıları emilimi etkileyemediği için emilimin değişmemesi"}],"answer":1,"explanation":{"en":"Intestinal P-glycoprotein limits net absorption by returning susceptible drug molecules to the gut lumen. Selective inhibition reduces that outward transport and can increase bioavailability; receptor antagonism is a different, pharmacodynamic mechanism.","tr":"İntestinal P-glikoprotein, duyarlı ilaç moleküllerini bağırsak lümenine geri göndererek net emilimi sınırlar. Seçici inhibisyon bu dışa taşımayı azaltarak biyoyararlanımı artırabilir; reseptör antagonizması ise farklı bir farmakodinamik mekanizmadır."},"sourcePages":[38],"difficulty":"applied","sourcePdfPages":[50]},{"id":"c04q3","stem":{"en":"An inactive hypothetical prodrug must be converted by enzyme E into its active metabolite. A second compound inhibits E without affecting metabolite elimination or receptor binding. What is the most direct expected consequence?","tr":"İnaktif ve varsayımsal bir ön ilacın, E enzimi aracılığıyla aktif metabolitine dönüşmesi gerekmektedir. İkinci bir bileşik, metabolitin eliminasyonunu veya reseptör bağlanmasını etkilemeden E’yi inhibe etmektedir. En doğrudan beklenen sonuç nedir?"},"options":[{"en":"Increased formation of the active metabolite","tr":"Aktif metabolitin oluşumunun artması"},{"en":"Increased intrinsic activity of each metabolite molecule","tr":"Her metabolit molekülünün intrinsik aktivitesinin artması"},{"en":"Immediate conversion of the prodrug into a full receptor agonist","tr":"Ön ilacın hemen tam reseptör agonistine dönüşmesi"},{"en":"Increased clearance of the active metabolite","tr":"Aktif metabolitin klirensinin artması"},{"en":"Reduced formation of the active metabolite","tr":"Aktif metabolitin oluşumunun azalması"}],"answer":4,"explanation":{"en":"Inhibiting an activation pathway reduces formation of the active metabolite of an otherwise inactive prodrug. This is the opposite of the usual consequence of inhibiting the inactivation of an already active parent drug; the stem also excludes a change in metabolite clearance.","tr":"Aktivasyon yolunun inhibisyonu, kendisi inaktif olan ön ilacın aktif metabolitinin oluşumunu azaltır. Bu sonuç, zaten aktif olan bir ana ilacın inaktivasyonunu inhibe etmenin olağan sonucunun tersidir; soru ayrıca metabolit klirensinde değişiklik olmadığını belirtmektedir."},"sourcePages":[38,39],"difficulty":"applied","sourcePdfPages":[50,51]},{"id":"c04q4","stem":{"en":"Two hypothetical drugs each produce a specified response alone. On a normalised isobologram, half of drug A’s effective concentration plus one quarter of drug B’s effective concentration produces the same response. Relative to the straight additive line, what does this combination indicate?","tr":"Varsayımsal iki ilaç, tek başlarına belirli bir yanıt oluşturmaktadır. Normalize edilmiş bir izobologramda A ilacının etkili konsantrasyonunun yarısı ile B ilacının etkili konsantrasyonunun dörtte biri birlikte aynı yanıtı oluşturmaktadır. Doğrusal additivite çizgisine göre bu kombinasyon neyi gösterir?"},"options":[{"en":"Simple additivity","tr":"Basit additivite"},{"en":"Antagonism","tr":"Antagonizma"},{"en":"Synergism","tr":"Sinerjizm"},{"en":"Absence of any effect from drug B alone","tr":"B ilacının tek başına hiçbir etkisinin olmaması"},{"en":"Identical chemical structures of A and B","tr":"A ve B’nin kimyasal yapılarının aynı olması"}],"answer":2,"explanation":{"en":"Under the stated additive reference, the fractional concentrations would sum to 1 for the same effect. Here 0.5 + 0.25 = 0.75, so the combination achieves the response with less than the additive expectation and lies below the line, indicating synergy.","tr":"Belirtilen additif referansa göre aynı etki için fraksiyonel konsantrasyonların toplamı 1 olmalıdır. Burada 0,5 + 0,25 = 0,75 olduğundan kombinasyon, additif beklentiden daha düşük toplam fraksiyonla yanıtı sağlar ve çizginin altında yer alarak sinerjiyi gösterir."},"sourcePages":[40,41],"difficulty":"applied","sourcePdfPages":[52,53]},{"id":"c04q5","stem":{"en":"In an isolated cell experiment, compound A activates a receptor that increases cAMP production. Compound B inhibits intracellular cAMP breakdown. Neither changes the concentration of the other compound. How is their interaction best classified?","tr":"İzole bir hücre deneyinde A bileşiği, cAMP üretimini artıran bir reseptörü aktive eder. B bileşiği ise hücre içi cAMP yıkımını inhibe eder. Hiçbiri diğer bileşiğin konsantrasyonunu değiştirmez. Etkileşimleri en iyi nasıl sınıflandırılır?"},"options":[{"en":"An indirect pharmacodynamic interaction converging on a common signalling pathway","tr":"Ortak bir sinyal yolunda birleşen dolaylı farmakodinamik etkileşim"},{"en":"A pharmaceutical incompatibility that occurs before administration","tr":"Uygulama öncesinde oluşan farmasötik geçimsizlik"},{"en":"A pharmacokinetic interaction that increases intestinal absorption","tr":"Bağırsaktan emilimi artıran farmakokinetik etkileşim"},{"en":"Direct competition for the same receptor-binding site","tr":"Aynı reseptör bağlanma bölgesi için doğrudan yarışma"},{"en":"Displacement from plasma protein-binding sites","tr":"Plazma proteinlerine bağlanma bölgelerinden yer değiştirme"}],"answer":0,"explanation":{"en":"The compounds act at different molecular targets but converge on cAMP, making this an indirect pharmacodynamic interaction. Neither alters the other compound’s disposition, and the mechanism alone does not establish whether the combined effect is additive or synergistic.","tr":"Bileşikler farklı moleküler hedeflerde etkili olmakla birlikte cAMP üzerinde birleştiğinden bu, dolaylı bir farmakodinamik etkileşimdir. Hiçbiri diğer bileşiğin vücuttaki işlenişini değiştirmez; yalnızca mekanizmayı bilmek birleşik etkinin additif mi sinerjik mi olduğunu göstermez."},"sourcePages":[39,40],"difficulty":"applied","sourcePdfPages":[51,52]}]},{"id":5,"title":{"en":"Isomerism","tr":"İzomerizm"},"startPage":42,"endPage":46,"pdfStartPage":54,"pdfEndPage":58,"section":1,"questions":[{"id":"c05q1","stem":{"en":"Two compounds have the same molecular formula but differ in which atoms are bonded to which. What is their relationship?","tr":"İki bileşiğin molekül formülü aynıdır, ancak hangi atomun hangi atoma bağlı olduğu farklıdır. Aralarındaki ilişki nedir?"},"options":[{"en":"Structural (constitutional) isomers","tr":"Yapısal (konstitüsyonel) izomerler"},{"en":"Enantiomers with identical connectivity","tr":"Bağlanma düzenleri aynı olan enantiyomerler"},{"en":"The same molecule in different rotational conformations","tr":"Aynı molekülün farklı dönme konformasyonları"},{"en":"Isotopes of one element","tr":"Bir elementin izotopları"},{"en":"A racemate and its solvent","tr":"Bir rasemat ve çözücüsü"}],"answer":0,"explanation":{"en":"Structural isomers share a molecular formula but have different atom-to-atom connectivity. Stereoisomers, including enantiomers, retain the same connectivity and differ in spatial arrangement instead.","tr":"Yapısal izomerlerin molekül formülleri aynı, atomlar arası bağlanma düzenleri farklıdır. Enantiyomerler dâhil stereoizomerlerde ise bağlanma düzeni aynı kalır; farklılık uzamsal yerleşimdedir."},"sourcePages":[42],"difficulty":"core","sourcePdfPages":[54]},{"id":"c05q2","stem":{"en":"Two non-superimposable mirror-image molecules bind differently to a receptor, despite having the same atom-to-atom connectivity. Which explanation is most appropriate?","tr":"Atomlar arası bağlanma düzenleri aynı olan, üst üste çakıştırılamayan iki ayna görüntüsü molekül bir reseptöre farklı biçimde bağlanmaktadır. En uygun açıklama hangisidir?"},"options":[{"en":"They are structural isomers with different bond connectivity","tr":"Bunlar bağlanma düzenleri farklı yapısal izomerlerdir"},{"en":"Mirror-image molecules must have identical affinity for every receptor","tr":"Ayna görüntüsü moleküller tüm reseptörlere aynı afiniteyi göstermek zorundadır"},{"en":"They are enantiomers, and the receptor can distinguish their three-dimensional arrangements","tr":"Bunlar enantiyomerdir ve reseptör üç boyutlu yerleşimlerini ayırt edebilir"},{"en":"Different receptor binding proves that their molecular formulae differ","tr":"Farklı reseptör bağlanması, molekül formüllerinin farklı olduğunu kanıtlar"},{"en":"Enantiomers differ only in the number of atoms they contain","tr":"Enantiyomerler yalnızca içerdikleri atom sayısı bakımından farklıdır"}],"answer":2,"explanation":{"en":"Enantiomers are non-superimposable mirror images with the same connectivity. A receptor provides a three-dimensional, stereoselective environment, so equal molecular formulae do not guarantee equal receptor affinity or activity.","tr":"Enantiyomerler, bağlanma düzenleri aynı olan ve üst üste çakıştırılamayan ayna görüntüleridir. Reseptör, üç boyutlu ve stereoselektif bir ortam sunduğu için molekül formüllerinin aynı olması eşit reseptör afinitesini veya aktivitesini garanti etmez."},"sourcePages":[43,44],"difficulty":"applied","sourcePdfPages":[55,56]},{"id":"c05q3","stem":{"en":"A compound with a single stereogenic centre has been assigned the absolute configuration S. What can be concluded from that label alone about its rotation of plane-polarised light?","tr":"Tek stereojenik merkeze sahip bir bileşiğin mutlak konfigürasyonu S olarak belirlenmiştir. Yalnızca bu etiketten, düzlem polarize ışığı döndürmesi hakkında hangi sonuca varılabilir?"},"options":[{"en":"It must rotate light anticlockwise","tr":"Işığı mutlaka saat yönünün tersine döndürür"},{"en":"The direction of optical rotation cannot be inferred from S alone","tr":"Optik dönmenin yönü yalnızca S bilgisinden çıkarılamaz"},{"en":"It must rotate light clockwise","tr":"Işığı mutlaka saat yönünde döndürür"},{"en":"It must be optically inactive because S means symmetric","tr":"S simetrik anlamına geldiğinden mutlaka optikçe inaktiftir"},{"en":"It must contain equal amounts of R and S molecules","tr":"Mutlaka eşit miktarda R ve S molekülü içerir"}],"answer":1,"explanation":{"en":"R and S describe absolute spatial configuration under sequence rules; they do not specify the experimentally observed direction of optical rotation. The (+) and (−) labels describe rotation, while a 1:1 R/S mixture is a separate compositional property.","tr":"R ve S, öncelik kurallarına göre mutlak uzamsal konfigürasyonu tanımlar; deneysel olarak gözlenen optik dönmenin yönünü belirtmez. (+) ve (−) işaretleri dönme yönünü ifade ederken 1:1 R/S karışımı, bileşime ilişkin ayrı bir özelliktir."},"sourcePages":[44],"difficulty":"applied","sourcePdfPages":[56]},{"id":"c05q4","stem":{"en":"A sample contains equal molar amounts of the two enantiomers of a compound with one stereogenic centre. Which term describes the sample?","tr":"Bir örnek, tek stereojenik merkezi olan bir bileşiğin iki enantiyomerini eşit molar miktarlarda içermektedir. Bu örneği hangi terim tanımlar?"},"options":[{"en":"Enantiopure preparation","tr":"Enantiyosaf preparat"},{"en":"A single geometric isomer","tr":"Tek bir geometrik izomer"},{"en":"A pair of structural isomers","tr":"Bir yapısal izomer çifti"},{"en":"Racemate","tr":"Rasemat"},{"en":"An achiral molecular structure","tr":"Aşiral bir moleküler yapı"}],"answer":3,"explanation":{"en":"A racemate is an equimolar mixture of a pair of enantiomers. It is not enantiopure, and cancellation of optical rotation in the mixture does not mean that the individual molecules are achiral or pharmacologically inactive.","tr":"Rasemat, bir enantiyomer çiftinin eşit molar miktarlardaki karışımıdır. Enantiyosaf değildir; karışımdaki optik dönmenin birbirini götürmesi, tek tek moleküllerin aşiral veya farmakolojik olarak inaktif olduğu anlamına gelmez."},"sourcePages":[45],"difficulty":"core","sourcePdfPages":[57]},{"id":"c05q5","stem":{"en":"A disubstituted ring compound has one stable form with the specified substituents on the same side of the ring and another with them on opposite sides. Which relationship best describes these forms?","tr":"İki sübstitüentli bir halkalı bileşiğin kararlı bir biçiminde belirtilen sübstitüentler halkanın aynı tarafında, diğer biçiminde ise zıt taraflarındadır. Bu biçimleri en iyi hangi ilişki tanımlar?"},"options":[{"en":"Different molecular formulae","tr":"Farklı molekül formülleri"},{"en":"A change in isotopic composition","tr":"İzotop bileşiminde değişiklik"},{"en":"Protein-binding displacement","tr":"Proteine bağlanmada yer değiştirme"},{"en":"Different ionisation states only","tr":"Yalnızca farklı iyonizasyon durumları"},{"en":"Cis–trans geometric isomerism","tr":"Cis–trans geometrik izomerizm"}],"answer":4,"explanation":{"en":"Geometric isomerism arises when restricted geometry preserves different relative positions of substituents. For the specified ring substituents, same-side and opposite-side arrangements are termed cis and trans respectively; this does not require a different molecular formula.","tr":"Geometrik izomerizm, kısıtlı geometri nedeniyle sübstitüentlerin farklı göreli konumlarının korunmasıyla ortaya çıkar. Belirtilen halka sübstitüentlerinin aynı tarafta bulunması cis, zıt taraflarda bulunması trans olarak adlandırılır; bunun için molekül formülünün değişmesi gerekmez."},"sourcePages":[43],"difficulty":"core","sourcePdfPages":[55]}]},{"id":6,"title":{"en":"Pharmacokinetic Modelling","tr":"Farmakokinetik Modelleme"},"startPage":47,"endPage":67,"pdfStartPage":59,"pdfEndPage":79,"section":1,"questions":[{"id":"c06q1","stem":{"en":"In a hypothetical linear pharmacokinetic experiment, an intravenous dose of 120 mg produces an AUC from zero to infinity of 60 mg·min/L. What is the systemic clearance?","tr":"Varsayımsal bir doğrusal farmakokinetik deneyde 120 mg’lık intravenöz doz, sıfırdan sonsuza kadar 60 mg·dk/L AUC oluşturmaktadır. Sistemik klirens nedir?"},"options":[{"en":"0.5 L/min","tr":"0,5 L/dk"},{"en":"2 mg/min","tr":"2 mg/dk"},{"en":"2 L/min","tr":"2 L/dk"},{"en":"60 L/min","tr":"60 L/dk"},{"en":"7200 L/min","tr":"7200 L/dk"}],"answer":2,"explanation":{"en":"For intravenous administration, clearance equals dose divided by AUC: 120 mg ÷ (60 mg·min/L) = 2 L/min. Clearance is a volume per unit time, so 2 mg/min would describe an amount-elimination rate rather than clearance.","tr":"İntravenöz uygulamada klirens, dozun AUC’ye bölünmesiyle bulunur: 120 mg ÷ (60 mg·dk/L) = 2 L/dk. Klirensin birimi zaman başına hacimdir; bu nedenle 2 mg/dk klirensi değil, birim zamanda elimine edilen ilaç miktarını ifade eder."},"sourcePages":[59,61,62],"difficulty":"applied","sourcePdfPages":[71,73,74]},{"id":"c06q2","stem":{"en":"A hypothetical drug follows a one-compartment, first-order model with an elimination rate constant k of 0.10 min⁻¹. Approximately what is its elimination half-life?","tr":"Varsayımsal bir ilaç, eliminasyon hız sabiti k = 0,10 dk⁻¹ olan tek kompartımanlı, birinci derece kinetik modele uymaktadır. Eliminasyon yarılanma ömrü yaklaşık ne kadardır?"},"options":[{"en":"6.9 minutes","tr":"6,9 dakika"},{"en":"0.069 minutes","tr":"0,069 dakika"},{"en":"0.69 minutes","tr":"0,69 dakika"},{"en":"10 minutes","tr":"10 dakika"},{"en":"14.4 minutes","tr":"14,4 dakika"}],"answer":0,"explanation":{"en":"In a one-compartment first-order model, the half-life is ln(2)/k, giving 0.693/0.10 = 6.93 minutes. The reciprocal 1/k equals 10 minutes, but that is the time constant, at which approximately 37% remains, rather than the half-life.","tr":"Tek kompartımanlı birinci derece modelde yarılanma ömrü ln(2)/k olup 0,693/0,10 = 6,93 dakikadır. 1/k değeri 10 dakikadır; ancak bu yarılanma ömrü değil, başlangıç miktarının yaklaşık %37’sinin kaldığı zaman sabitidir."},"sourcePages":[55,56,67],"difficulty":"applied","sourcePdfPages":[67,68,79]},{"id":"c06q3","stem":{"en":"In a theoretical system, elimination has reached a fixed maximum rate because the relevant enzyme is saturated. A constant input rate exceeds that maximum, and no additional elimination pathway becomes available. What happens to the amount of drug in the system?","tr":"Teorik bir sistemde ilgili enzim doygunluğa ulaştığı için eliminasyon sabit bir maksimum hıza ulaşmıştır. Sabit giriş hızı bu maksimumu aşmakta ve ek bir eliminasyon yolu devreye girmemektedir. Sistemdeki ilaç miktarına ne olur?"},"options":[{"en":"It reaches a stable plateau solely by increasing the concentration","tr":"Yalnızca konsantrasyon artışıyla kararlı bir platoya ulaşır"},{"en":"It falls exponentially despite the continuing excess input","tr":"Fazla giriş devam etmesine rağmen üstel olarak azalır"},{"en":"It immediately falls to zero","tr":"Hemen sıfıra düşer"},{"en":"Its half-life must remain constant at every concentration","tr":"Yarılanma ömrü her konsantrasyonda sabit kalmak zorundadır"},{"en":"It continues to increase because input exceeds maximum output","tr":"Giriş maksimum çıkışı aştığı için artmaya devam eder"}],"answer":4,"explanation":{"en":"Once the elimination pathway is saturated, increasing concentration cannot raise output above the stated maximum. A continuing excess of input over output therefore causes accumulation; the first-order assumption of a constant fractional removal and half-life no longer applies.","tr":"Eliminasyon yolu doygunluğa ulaştığında konsantrasyonun artırılması, çıkışı belirtilen maksimumun üzerine çıkaramaz. Girişin çıkıştan sürekli fazla olması bu nedenle birikime yol açar; birinci derece kinetikteki sabit fraksiyonel uzaklaştırma ve sabit yarılanma ömrü varsayımı artık geçerli değildir."},"sourcePages":[51,62,63],"difficulty":"applied","sourcePdfPages":[63,74,75]},{"id":"c06q4","stem":{"en":"A model assigns a drug an apparent volume of distribution of 500 L in a person whose total body water is far smaller. Which interpretation is correct?","tr":"Bir model, toplam vücut suyu çok daha az olan bir kişide bir ilaca 500 L’lik görünür dağılım hacmi atamaktadır. Hangi yorum doğrudur?"},"options":[{"en":"It proves that the person contains 500 L of anatomical fluid","tr":"Kişinin anatomik olarak 500 L sıvı içerdiğini kanıtlar"},{"en":"It is a theoretical concentration-based volume that can reflect extensive tissue binding","tr":"Yoğun doku bağlanmasını yansıtabilen, konsantrasyona dayalı teorik bir hacimdir"},{"en":"It means the drug is confined entirely to plasma","tr":"İlacın tamamen plazmayla sınırlı olduğunu gösterir"},{"en":"It is the number of litres of urine excreted each minute","tr":"Dakikada atılan idrarın litre cinsinden miktarıdır"},{"en":"It demonstrates that drug concentration is identical in every tissue","tr":"İlaç konsantrasyonunun tüm dokularda aynı olduğunu gösterir"}],"answer":1,"explanation":{"en":"Volume of distribution relates the amount of drug in the body to its plasma concentration and need not equal an anatomical fluid volume. Extensive tissue sequestration can leave a low plasma concentration and hence a large apparent volume; confinement to plasma would tend to produce a small volume instead.","tr":"Dağılım hacmi, vücuttaki ilaç miktarı ile plazma konsantrasyonu arasındaki ilişkiyi ifade eder ve anatomik bir sıvı hacmine eşit olmak zorunda değildir. Yoğun doku tutulumu düşük plazma konsantrasyonuna ve dolayısıyla büyük bir görünür hacme yol açabilir; plazmayla sınırlı kalma ise küçük hacim oluşturma eğilimindedir."},"sourcePages":[47,60],"difficulty":"applied","sourcePdfPages":[59,72]},{"id":"c06q5","stem":{"en":"In a hypothetical one-compartment, first-order model, a constant drug input is maintained until steady state. Clearance then falls to half its original value while the input rate and volume of distribution remain unchanged. Once the new steady state is reached, what happens to concentration and elimination half-life?","tr":"Varsayımsal tek kompartımanlı, birinci derece kinetik modelde sabit ilaç girişi kararlı duruma ulaşılana kadar sürdürülür. Ardından giriş hızı ve dağılım hacmi değişmeden klirens başlangıç değerinin yarısına düşer. Yeni kararlı duruma ulaşıldığında konsantrasyon ve eliminasyon yarılanma ömrü nasıl değişir?"},"options":[{"en":"Both halve","tr":"Her ikisi de yarıya iner"},{"en":"Concentration doubles but half-life halves","tr":"Konsantrasyon iki katına çıkar, yarılanma ömrü yarıya iner"},{"en":"Concentration halves but half-life doubles","tr":"Konsantrasyon yarıya iner, yarılanma ömrü iki katına çıkar"},{"en":"Both double","tr":"Her ikisi de iki katına çıkar"},{"en":"Both remain unchanged","tr":"Her ikisi de değişmeden kalır"}],"answer":3,"explanation":{"en":"Steady-state concentration equals input rate divided by clearance, so halving clearance doubles the eventual concentration. With volume fixed, k = clearance/volume also halves and half-life = ln(2)/k doubles; the concentration does not jump immediately to its new steady state.","tr":"Kararlı durum konsantrasyonu, giriş hızının klirense bölünmesine eşittir; bu nedenle klirensin yarıya inmesi son konsantrasyonu iki katına çıkarır. Hacim sabitken k = klirens/hacim de yarıya iner ve yarılanma ömrü = ln(2)/k iki katına çıkar; konsantrasyon yeni kararlı durum değerine aniden sıçramaz."},"sourcePages":[52,55,67],"difficulty":"applied","sourcePdfPages":[64,67,79]}]},{"id":7,"title":{"en":"Applied Pharmacokinetic Models","tr":"Uygulamalı Farmakokinetik Modeller"},"startPage":68,"endPage":79,"pdfStartPage":80,"pdfEndPage":91,"section":1,"questions":[{"id":"c07q1","stem":{"en":"A standard model-based target-controlled infusion (TCI) pump displays a predicted plasma concentration but has no blood-drug assay connected to it. What does the displayed concentration represent?","tr":"Standart, modele dayalı bir hedef kontrollü infüzyon (TCI) pompası tahmini plazma konsantrasyonunu göstermektedir, ancak pompaya kanda ilaç ölçümü yapan bir sistem bağlı değildir. Ekrandaki konsantrasyon neyi temsil eder?"},"options":[{"en":"A direct continuous measurement of the patient’s blood concentration","tr":"Hastanın kan konsantrasyonunun doğrudan ve sürekli ölçümünü"},{"en":"A calculation from the model, entered covariates and administration history","tr":"Model, girilen kovaryatlar ve uygulama geçmişinden yapılan bir hesaplamayı"},{"en":"A laboratory measurement of receptor occupancy","tr":"Reseptör işgalinin laboratuvarda ölçümünü"},{"en":"The exact concentration in every peripheral tissue","tr":"Tüm periferik dokulardaki kesin konsantrasyonu"},{"en":"A measured concentration of active metabolites only","tr":"Yalnızca aktif metabolitlerin ölçülen konsantrasyonunu"}],"answer":1,"explanation":{"en":"A standard TCI system calculates concentrations using a pharmacokinetic model and the information available to the pump. The predicted value can differ from the individual’s actual blood concentration; a numerical display does not turn that prediction into a measurement.","tr":"Standart bir TCI sistemi, farmakokinetik modeli ve pompaya sağlanan bilgileri kullanarak konsantrasyonları hesaplar. Tahmini değer, bireyin gerçek kan konsantrasyonundan farklı olabilir; sayısal olarak gösterilmesi bu tahmini ölçüme dönüştürmez."},"sourcePages":[70,71,77],"difficulty":"applied","sourcePdfPages":[82,83,89]},{"id":"c07q2","stem":{"en":"In two otherwise identical pharmacokinetic–pharmacodynamic simulations with the same plasma concentration profile, one effect-site model has a larger ke0. What does that model predict?","tr":"Plazma konsantrasyonu profilleri aynı olan ve diğer yönleriyle özdeş iki farmakokinetik–farmakodinamik simülasyondan birinin etki yeri modelinde ke0 daha büyüktür. Bu model neyi öngörür?"},"options":[{"en":"Slower equilibration between plasma and the effect site","tr":"Plazma ile etki yeri arasında daha yavaş dengelenme"},{"en":"A larger anatomical volume of the brain","tr":"Beynin anatomik hacminin daha büyük olması"},{"en":"Necessarily greater systemic clearance of the drug","tr":"İlacın sistemik klirensinin zorunlu olarak daha yüksek olması"},{"en":"A lower intrinsic efficacy at the receptor","tr":"Reseptörde daha düşük intrinsik etkililik"},{"en":"Faster equilibration between plasma and the effect site","tr":"Plazma ile etki yeri arasında daha hızlı dengelenme"}],"answer":4,"explanation":{"en":"ke0 describes the speed of equilibration between modelled plasma and effect-site concentrations, with equilibration half-time inversely related to ke0. Changing this parameter changes the predicted lag, not the drug’s intrinsic efficacy or, by itself, its systemic clearance.","tr":"ke0, modellenen plazma ve etki yeri konsantrasyonları arasındaki dengelenme hızını tanımlar; dengelenme yarılanma süresi ke0 ile ters orantılıdır. Bu parametrenin değiştirilmesi tahmin edilen gecikmeyi değiştirir; ilacın intrinsik etkililiğini veya tek başına sistemik klirensini değiştirmez."},"sourcePages":[69,70,72,73],"difficulty":"applied","sourcePdfPages":[81,82,84,85]},{"id":"c07q3","stem":{"en":"In a model-based effect-site-targeting simulation, the predicted plasma concentration briefly rises above the selected effect-site target at the start. Why can this occur?","tr":"Modele dayalı bir etki yeri hedefleme simülasyonunda, başlangıçta tahmini plazma konsantrasyonu seçilen etki yeri hedefinin kısa süreliğine üzerine çıkmaktadır. Bu neden olabilir?"},"options":[{"en":"Plasma and effect-site concentrations must always be identical","tr":"Plazma ve etki yeri konsantrasyonları her zaman aynı olmak zorundadır"},{"en":"The target is a measured concentration of drug in the syringe","tr":"Hedef, enjektörde ölçülmüş ilaç konsantrasyonudur"},{"en":"The model assumes that the drug cannot leave plasma","tr":"Model, ilacın plazmadan ayrılamayacağını varsayar"},{"en":"A temporary plasma-to-effect-site gradient can accelerate the predicted rise at the effect site","tr":"Geçici bir plazma–etki yeri gradyanı, etki yerindeki tahmini yükselişi hızlandırabilir"},{"en":"Any plasma overshoot proves the effect-site target has been exceeded","tr":"Plazmadaki her aşım, etki yeri hedefinin aşıldığını kanıtlar"}],"answer":3,"explanation":{"en":"Effect-site targeting can use a transiently higher predicted plasma concentration to overcome the lag in plasma–effect-site equilibration. Plasma overshoot alone therefore does not prove effect-site overshoot, because the two concentrations change on different time courses.","tr":"Etki yeri hedefleme, plazma–etki yeri dengelenmesindeki gecikmeyi aşmak için tahmini plazma konsantrasyonunu geçici olarak daha yüksek tutabilir. İki konsantrasyon farklı zaman seyirleri izlediği için yalnızca plazmadaki aşım, etki yerinde de aşım olduğunu kanıtlamaz."},"sourcePages":[72,73],"difficulty":"applied","sourcePdfPages":[84,85]},{"id":"c07q4","stem":{"en":"Which measurement defines the context-sensitive half-time of a drug after stopping an infusion designed to maintain a constant plasma concentration?","tr":"Sabit plazma konsantrasyonunu korumak üzere tasarlanmış bir infüzyon durdurulduktan sonra hangi ölçüm ilacın bağlama duyarlı yarılanma süresini tanımlar?"},"options":[{"en":"The time for plasma concentration to fall by 50%, related to the preceding infusion duration","tr":"Önceki infüzyon süresiyle ilişkili olarak plazma konsantrasyonunun %50 azalması için geçen süre"},{"en":"The time for total body drug to become exactly zero","tr":"Vücuttaki toplam ilacın tam olarak sıfıra inmesi için geçen süre"},{"en":"The duration needed to reach the first peak effect after a bolus","tr":"Bolus sonrasında ilk doruk etkiye ulaşmak için gereken süre"},{"en":"The time for 50% of administered fluid to leave the syringe","tr":"Uygulanan sıvının %50’sinin enjektörden çıkması için geçen süre"},{"en":"A fixed receptor-dissociation half-life independent of infusion duration","tr":"İnfüzyon süresinden bağımsız, sabit bir reseptörden ayrışma yarılanma ömrü"}],"answer":0,"explanation":{"en":"The context is the duration of the preceding infusion, and the measured endpoint is a 50% fall in plasma concentration after stopping it. This is not necessarily the terminal elimination half-life and does not mean that half of the total drug in the body has been eliminated.","tr":"Bağlam, önceki infüzyonun süresidir; ölçülen sonlanım ise infüzyon durdurulduktan sonra plazma konsantrasyonunun %50 azalmasıdır. Bu süre mutlaka terminal eliminasyon yarılanma ömrüne eşit değildir ve vücuttaki toplam ilacın yarısının elimine edildiği anlamına gelmez."},"sourcePages":[78,79],"difficulty":"core","sourcePdfPages":[90,91]},{"id":"c07q5","stem":{"en":"After a hypothetical multi-compartment drug infusion stops, plasma concentration falls from 100 to 50 arbitrary units in 10 minutes. Why should the next fall from 50 to 25 units not automatically be assumed to take another 10 minutes?","tr":"Varsayımsal çok kompartımanlı bir ilaç infüzyonu durdurulduktan sonra plazma konsantrasyonu 10 dakikada 100’den 50 keyfî birime düşmektedir. Sonraki 50’den 25 birime düşüşün neden otomatik olarak 10 dakika daha süreceği varsayılmamalıdır?"},"options":[{"en":"All multi-compartment concentration declines have a single fixed half-life","tr":"Tüm çok kompartımanlı konsantrasyon düşüşlerinin tek ve sabit bir yarılanma ömrü vardır"},{"en":"Drug must stop leaving the body after the first halving","tr":"İlk yarılanmadan sonra ilacın vücuttan uzaklaştırılması durmak zorundadır"},{"en":"The relative contributions of redistribution and elimination change over time","tr":"Yeniden dağılım ve eliminasyonun göreli katkıları zamanla değişir"},{"en":"The first 50% fall proves that every tissue concentration is zero","tr":"İlk %50’lik düşüş, tüm doku konsantrasyonlarının sıfır olduğunu kanıtlar"},{"en":"Plasma concentration cannot decrease below 50 arbitrary units","tr":"Plazma konsantrasyonu 50 keyfî birimin altına düşemez"}],"answer":2,"explanation":{"en":"In a multi-compartment system, the initial fall and later decline need not be governed by the same balance of processes. Drug returning from peripheral compartments can make later halvings slower, so a context-sensitive half-time cannot simply be repeated to predict a larger decrement.","tr":"Çok kompartımanlı bir sistemde başlangıç düşüşü ile sonraki azalmayı aynı süreç dengesi yönetmek zorunda değildir. Periferik kompartımanlardan geri dönen ilaç, sonraki yarılanmaları yavaşlatabilir; bu nedenle daha büyük bir azalmayı öngörmek için bağlama duyarlı yarılanma süresi basitçe tekrarlanamaz."},"sourcePages":[79],"difficulty":"applied","sourcePdfPages":[91]}]},{"id":8,"title":{"en":"Medicinal Chemistry","tr":"Tıbbi Kimya"},"startPage":80,"endPage":92,"pdfStartPage":92,"pdfEndPage":104,"section":1,"questions":[{"id":"c08q1","stem":{"en":"A molecular linkage has the form R–C(=O)–O–R′. Which functional group is present?","tr":"Bir moleküler bağın yapısı R–C(=O)–O–R′ biçimindedir. Hangi fonksiyonel grup bulunmaktadır?"},"options":[{"en":"Amide","tr":"Amid"},{"en":"Ether without a carbonyl group","tr":"Karbonil grubu içermeyen eter"},{"en":"Tertiary amine","tr":"Tersiyer amin"},{"en":"Ester","tr":"Ester"},{"en":"Quaternary ammonium group","tr":"Kuaterner amonyum grubu"}],"answer":3,"explanation":{"en":"The combination of a carbonyl carbon directly bonded to an –O–R′ group identifies a carboxylic ester, a potential site of hydrolysis. An amide instead has nitrogen directly attached to the carbonyl carbon, while a simple ether has no adjacent carbonyl group.","tr":"Karbonil karbonunun doğrudan –O–R′ grubuna bağlı olması, potansiyel bir hidroliz bölgesi olan karboksilik esteri tanımlar. Amidde karbonil karbonuna doğrudan azot bağlıdır; basit eterde ise komşu bir karbonil grubu bulunmaz."},"sourcePages":[86,88],"difficulty":"core","sourcePdfPages":[98,100]},{"id":"c08q2","stem":{"en":"Which aromatic-ring feature identifies a catechol group and makes a compound a potential substrate for catechol O-methyltransferase (COMT)?","tr":"Hangi aromatik halka özelliği bir katekol grubunu tanımlar ve bileşiği katekol O-metiltransferaz (COMT) için potansiyel substrat hâline getirir?"},"options":[{"en":"One hydroxyl group anywhere on a benzene ring","tr":"Benzen halkasının herhangi bir yerinde tek hidroksil grubu"},{"en":"Two hydroxyl groups only at opposite positions of a benzene ring","tr":"Benzen halkasında yalnızca karşılıklı konumlarda iki hidroksil grubu"},{"en":"Two hydroxyl groups on adjacent carbons of a benzene ring","tr":"Benzen halkasının komşu karbonlarında iki hidroksil grubu"},{"en":"One nitrogen atom incorporated into a five-membered ring","tr":"Beş üyeli bir halkaya katılmış tek azot atomu"},{"en":"Two methyl groups on adjacent carbons of a benzene ring","tr":"Benzen halkasının komşu karbonlarında iki metil grubu"}],"answer":2,"explanation":{"en":"A catechol contains adjacent hydroxyl groups on an aromatic benzene ring, providing the structural motif recognised by COMT. A single phenolic hydroxyl group or the opposite-position hydroxyl groups of a hydroquinone do not constitute a catechol.","tr":"Katekol, aromatik benzen halkasında komşu hidroksil grupları içerir ve COMT’nin tanıdığı yapısal motifi sağlar. Tek bir fenolik hidroksil grubu veya hidrokinondaki karşılıklı hidroksil grupları katekol oluşturmaz."},"sourcePages":[82,87,91],"difficulty":"core","sourcePdfPages":[94,99,103]},{"id":"c08q3","stem":{"en":"A nitrogen atom is bonded to four carbon-containing substituents as a quaternary ammonium group. Which property best distinguishes it from an ordinary tertiary amine over the physiological pH range?","tr":"Bir azot atomu, kuaterner amonyum grubu oluşturacak şekilde karbon içeren dört sübstitüente bağlıdır. Fizyolojik pH aralığında hangi özellik onu sıradan bir tersiyer aminden en iyi ayırır?"},"options":[{"en":"It becomes neutral whenever pH equals 7.4","tr":"pH 7,4 olduğunda nötr hâle gelir"},{"en":"It has an unshared electron pair available to accept a fifth ordinary covalent bond to H+","tr":"H+ ile beşinci sıradan kovalent bağı oluşturabilecek ortaklanmamış elektron çifti vardır"},{"en":"It must be freely lipid-soluble because nitrogen increases lipophilicity","tr":"Azot lipofilisiteyi artırdığı için mutlaka lipitte kolay çözünür"},{"en":"It has no formal charge until an acid is added","tr":"Asit eklenene kadar formal yük taşımaz"},{"en":"Its positive charge is permanent rather than dependent on reversible protonation","tr":"Pozitif yükü geri dönüşümlü protonasyona bağlı değil, kalıcıdır"}],"answer":4,"explanation":{"en":"An ordinary quaternary ammonium nitrogen carries a positive formal charge and does not become a neutral tertiary amine simply by changing physiological pH. A tertiary amine can instead gain or lose a proton, so its charged fraction depends on pH and pKa.","tr":"Sıradan bir kuaterner amonyum azotu pozitif formal yük taşır ve yalnızca fizyolojik pH değiştirilerek nötr tersiyer amine dönüşmez. Tersiyer amin ise proton alıp verebildiği için yüklü fraksiyonu pH ve pKa’ya bağlıdır."},"sourcePages":[84,87],"difficulty":"applied","sourcePdfPages":[96,99]},{"id":"c08q4","stem":{"en":"A five-membered ring contains three carbon atoms and two nitrogen atoms. Which broad structural description is correct?","tr":"Beş üyeli bir halka üç karbon ve iki azot atomu içermektedir. Hangi genel yapısal tanım doğrudur?"},"options":[{"en":"It is heterocyclic because different elements are members of the ring","tr":"Halkayı oluşturan atomlar farklı elementlerden olduğu için heterosikliktir"},{"en":"It is a pure hydrocarbon because the ring contains carbon","tr":"Halka karbon içerdiği için saf bir hidrokarbondur"},{"en":"It is necessarily a benzene ring","tr":"Zorunlu olarak benzen halkasıdır"},{"en":"It is an ester because every nitrogen-containing ring is an ester","tr":"Azot içeren her halka ester olduğu için esterdir"},{"en":"It must be a quaternary ammonium ion","tr":"Kuaterner amonyum iyonu olmak zorundadır"}],"answer":0,"explanation":{"en":"A heterocycle has ring atoms from more than one element; nitrogen atoms incorporated into the carbon-containing ring meet that definition. Merely knowing the atom counts does not establish a specific ring isomer, its ionisation state or whether the nitrogens are quaternary.","tr":"Heterosiklik bir halkada birden fazla elemente ait atom bulunur; karbon içeren halkaya katılmış azot atomları bu tanımı karşılar. Yalnızca atom sayılarını bilmek, belirli halka izomerini, iyonizasyon durumunu veya azotların kuaterner olup olmadığını belirlemez."},"sourcePages":[88],"difficulty":"core","sourcePdfPages":[100]},{"id":"c08q5","stem":{"en":"A medicinal chemist modifies a lead compound so that its receptor affinity and maximal response are preserved, but its enzymatic breakdown becomes faster. Which aim of drug design does this most directly illustrate?","tr":"Bir tıbbi kimya araştırmacısı, öncü bir bileşiği reseptör afinitesi ve maksimum yanıtı korunacak, ancak enzimatik yıkımı hızlanacak şekilde değiştirmektedir. Bu, ilaç tasarımının en doğrudan hangi amacını gösterir?"},"options":[{"en":"Proving that structural changes cannot alter drug disposition","tr":"Yapısal değişikliklerin ilacın vücuttaki işlenişini değiştiremeyeceğinin kanıtlanması"},{"en":"Changing pharmacokinetic behaviour while retaining the desired pharmacodynamic action","tr":"İstenen farmakodinamik etki korunurken farmakokinetik davranışın değiştirilmesi"},{"en":"Converting every receptor agonist into an irreversible antagonist","tr":"Her reseptör agonistinin geri dönüşümsüz antagoniste dönüştürülmesi"},{"en":"Ensuring that all metabolites are more potent than the parent compound","tr":"Tüm metabolitlerin ana bileşikten daha yüksek potense sahip olmasının sağlanması"},{"en":"Making receptor affinity depend only on molecular weight","tr":"Reseptör afinitesinin yalnızca molekül ağırlığına bağlı hâle getirilmesi"}],"answer":1,"explanation":{"en":"Structure–activity work can preserve useful target interactions while changing how a molecule is handled by the body. Faster enzymatic breakdown is a pharmacokinetic change; preserved receptor affinity and maximal response do not imply unchanged persistence or prove anything about metabolite activity.","tr":"Yapı–aktivite çalışmaları, yararlı hedef etkileşimlerini korurken molekülün vücutta nasıl işlendiğini değiştirebilir. Enzimatik yıkımın hızlanması farmakokinetik bir değişikliktir; reseptör afinitesi ve maksimum yanıtın korunması, vücutta kalış süresinin değişmediğini göstermez ve metabolit aktivitesini kanıtlamaz."},"sourcePages":[80],"difficulty":"applied","sourcePdfPages":[92]}]},{"id":9,"title":{"en":"General Anaesthetic Agents","tr":"Genel Anestezik Ajanlar"},"startPage":93,"endPage":126,"pdfStartPage":105,"pdfEndPage":138,"section":2,"questions":[{"id":"c09q1","stem":{"en":"Two etomidate enantiomers have the same lipid solubility but markedly different anaesthetic activity. Which inference does this observation most strongly support?","tr":"Etomidatın iki enantiyomeri aynı lipit çözünürlüğüne sahip olmasına rağmen anestezik aktiviteleri belirgin biçimde farklıdır. Bu gözlem en güçlü biçimde hangi çıkarımı destekler?"},"options":[{"en":"Anaesthetic potency is determined solely by bulk membrane lipid solubility.","tr":"Anestezik güç yalnızca zar lipitlerindeki genel çözünürlükle belirlenir."},{"en":"Both enantiomers must have identical effects at every receptor.","tr":"Her iki enantiyomerin bütün reseptörlerdeki etkileri aynı olmalıdır."},{"en":"A stereoselective interaction with a protein target contributes to anaesthesia.","tr":"Bir protein hedefle stereoselektif etkileşim anesteziye katkıda bulunur."},{"en":"General anaesthesia requires irreversible disruption of the lipid bilayer.","tr":"Genel anestezi, lipit çift tabakasının geri dönüşümsüz bozulmasını gerektirir."},{"en":"Lipid solubility is unrelated to the potency of any anaesthetic.","tr":"Lipit çözünürlüğünün hiçbir anesteziğin gücüyle ilişkisi yoktur."}],"answer":2,"explanation":{"en":"A chiral protein binding site can distinguish enantiomers even when their bulk lipid solubility is identical. The example supports protein-based mechanisms and shows why lipid solubility alone cannot explain anaesthetic activity; it does not erase the broader lipid-solubility–potency correlation.","tr":"Kiral bir protein bağlanma bölgesi, genel lipit çözünürlükleri aynı olsa bile enantiyomerleri ayırt edebilir. Bu örnek protein temelli mekanizmaları destekler ve lipit çözünürlüğünün tek başına anestezik aktiviteyi açıklayamadığını gösterir; genel lipit çözünürlüğü–güç ilişkisini ortadan kaldırmaz."},"sourcePages":[93,94],"difficulty":"applied","sourcePdfPages":[105,106]},{"id":"c09q2","stem":{"en":"Which receptor action is central to the anaesthetic and analgesic effects of ketamine?","tr":"Ketaminin anestezik ve analjezik etkilerinde hangi reseptör etkisi temel rol oynar?"},"options":[{"en":"Competitive antagonism at the muscle nicotinic acetylcholine receptor","tr":"Kas tipi nikotinik asetilkolin reseptöründe kompetitif antagonizma"},{"en":"Predominant positive allosteric modulation of GABAA receptors","tr":"Başlıca GABAA reseptörlerinin pozitif allosterik modülasyonu"},{"en":"Irreversible inhibition of acetylcholinesterase","tr":"Asetilkolinesterazın geri dönüşümsüz inhibisyonu"},{"en":"Selective agonism at the α1-adrenoceptor","tr":"α1-adrenoseptörde seçici agonizma"},{"en":"Non-competitive antagonism of the NMDA receptor","tr":"NMDA reseptöründe nonkompetitif antagonizma"}],"answer":4,"explanation":{"en":"Ketamine inhibits the excitatory NMDA glutamate receptor, reducing signalling through its ion channel. This differs from the main GABAA-potentiating mechanism of propofol and etomidate, although ketamine has additional molecular actions.","tr":"Ketamin, eksitatör NMDA glutamat reseptörünü inhibe ederek bu reseptörün iyon kanalı üzerinden iletimi azaltır. Ketaminin başka moleküler etkileri de bulunmakla birlikte bu mekanizma, propofol ve etomidatın başlıca GABAA etkisini güçlendiren mekanizmasından farklıdır."},"sourcePages":[95,96],"difficulty":"core","sourcePdfPages":[107,108]},{"id":"c09q3","stem":{"en":"After a single intravenous thiopental bolus, hypnosis can end well before most of the drug has been eliminated. What chiefly explains this early recovery?","tr":"Tek bir intravenöz tiyopental bolusundan sonra, ilacın büyük bölümü vücuttan atılmadan önce hipnoz sonlanabilir. Bu erken derlenmeyi başlıca ne açıklar?"},"options":[{"en":"Rapid excretion of nearly all unchanged drug in the urine","tr":"Değişmemiş ilacın hemen hemen tamamının idrarla hızla atılması"},{"en":"Redistribution of drug from the brain into other tissues","tr":"İlacın beyinden diğer dokulara yeniden dağılması"},{"en":"Immediate irreversible inactivation of cerebral GABAA receptors","tr":"Serebral GABAA reseptörlerinin hemen geri dönüşümsüz biçimde inaktive olması"},{"en":"Complete hepatic metabolism during the first circulation","tr":"İlk dolaşım sırasında karaciğerde tamamen metabolize olması"},{"en":"Conversion of thiopental into an active metabolite within the brain","tr":"Tiyopentalin beyin içinde aktif bir metabolite dönüşmesi"}],"answer":1,"explanation":{"en":"Following a single bolus, redistribution rapidly lowers the brain concentration below that required for hypnosis. Hepatic metabolism removes thiopental more slowly and becomes more important for recovery after repeated or prolonged administration.","tr":"Tek bolusun ardından yeniden dağılım, beyindeki konsantrasyonu hipnoz için gerekli düzeyin altına hızla düşürür. Karaciğerde metabolizma tiyopentali daha yavaş uzaklaştırır ve tekrarlayan veya uzun süreli uygulamalardan sonraki derlenmede daha önemli hale gelir."},"sourcePages":[99],"difficulty":"applied","sourcePdfPages":[111]},{"id":"c09q4","stem":{"en":"Two inhaled anaesthetics are compared under identical ventilation and circulation conditions. Which property predicts a faster rise of alveolar partial pressure toward the inspired partial pressure?","tr":"İki inhalasyon anesteziği aynı ventilasyon ve dolaşım koşullarında karşılaştırılıyor. Hangi özellik alveoler parsiyel basıncın inspire edilen parsiyel basınca daha hızlı yaklaşmasını öngörür?"},"options":[{"en":"A lower blood:gas partition coefficient","tr":"Daha düşük kan:gaz dağılım katsayısı"},{"en":"A higher blood:gas partition coefficient","tr":"Daha yüksek kan:gaz dağılım katsayısı"},{"en":"A higher oil:gas partition coefficient alone","tr":"Tek başına daha yüksek yağ:gaz dağılım katsayısı"},{"en":"A larger functional residual capacity","tr":"Daha büyük fonksiyonel rezidüel kapasite"},{"en":"A greater capacity of blood to dissolve the anaesthetic at the same partial pressure","tr":"Aynı parsiyel basınçta kanın anesteziği çözme kapasitesinin daha yüksek olması"}],"answer":0,"explanation":{"en":"A low blood:gas partition coefficient means that less anaesthetic must dissolve in blood before its partial pressure rises. High blood solubility creates a larger uptake reservoir and slows this rise; oil:gas solubility is more closely associated with potency.","tr":"Düşük kan:gaz dağılım katsayısı, parsiyel basıncın yükselmesi için kanda daha az anestezik çözünmesi gerektiğini gösterir. Kanda yüksek çözünürlük, daha büyük bir tutulum deposu oluşturarak bu yükselişi yavaşlatır; yağ:gaz çözünürlüğü ise daha çok anestezik güçle ilişkilidir."},"sourcePages":[109,110],"difficulty":"applied","sourcePdfPages":[121,122]},{"id":"c09q5","stem":{"en":"Which outcome defines one minimum alveolar concentration (MAC) for an inhaled anaesthetic at steady state and one atmosphere?","tr":"Kararlı durumda ve bir atmosfer basınçta bir inhalasyon anesteziğinin bir minimum alveoler konsantrasyonunu (MAC) hangi sonuç tanımlar?"},"options":[{"en":"Loss of explicit memory in every subject","tr":"Tüm bireylerde açık belleğin kaybı"},{"en":"Loss of consciousness in 95% of subjects","tr":"Bireylerin %95’inde bilinç kaybı"},{"en":"Prevention of every autonomic response in half of subjects","tr":"Bireylerin yarısında bütün otonom yanıtların önlenmesi"},{"en":"Prevention of movement to a standard surgical stimulus in 50% of subjects","tr":"Standart bir cerrahi uyarana karşı hareketin bireylerin %50’sinde önlenmesi"},{"en":"The alveolar concentration producing toxicity in 50% of subjects","tr":"Bireylerin %50’sinde toksisite oluşturan alveoler konsantrasyon"}],"answer":3,"explanation":{"en":"MAC is a population measure of the alveolar concentration that prevents movement to a standard noxious surgical stimulus in half of subjects. It measures anaesthetic potency for that endpoint, rather than guaranteeing unconsciousness, amnesia or suppression of all autonomic responses in every individual.","tr":"MAC, standart ağrılı cerrahi uyarana karşı hareketi bireylerin yarısında önleyen alveoler konsantrasyonun popülasyon düzeyindeki ölçüsüdür. Bu sonlanım için anestezik gücü ölçer; her bireyde bilinç kaybını, amneziyi veya tüm otonom yanıtların baskılanmasını garanti etmez."},"sourcePages":[107],"difficulty":"core","sourcePdfPages":[119]}]},{"id":10,"title":{"en":"Analgesics","tr":"Analjezikler"},"startPage":127,"endPage":155,"pdfStartPage":139,"pdfEndPage":167,"section":2,"questions":[{"id":"c10q1","stem":{"en":"Which combination of cellular effects is most consistent with activation of a classical μ-opioid receptor?","tr":"Klasik bir μ-opioid reseptörünün aktivasyonu hangi hücresel etki bileşimiyle en uyumludur?"},"options":[{"en":"Increased cAMP, increased calcium entry and depolarisation","tr":"Artmış cAMP, artmış kalsiyum girişi ve depolarizasyon"},{"en":"Opening of a receptor-operated sodium channel without G-protein coupling","tr":"G-proteini eşleşmesi olmadan reseptör aracılı sodyum kanalının açılması"},{"en":"Direct activation of nuclear transcription by the receptor","tr":"Reseptörün nükleer transkripsiyonu doğrudan aktive etmesi"},{"en":"Increased transmitter release through inhibition of potassium conductance","tr":"Potasyum iletkenliğinin inhibisyonuyla nörotransmiter salımının artması"},{"en":"Reduced cAMP, reduced calcium entry and increased potassium conductance","tr":"Azalmış cAMP, azalmış kalsiyum girişi ve artmış potasyum iletkenliği"}],"answer":4,"explanation":{"en":"Classical opioid receptors couple predominantly to inhibitory Gi/o proteins. Reduced calcium entry limits transmitter release, while increased potassium conductance favours hyperpolarisation; increased cAMP and calcium entry would instead favour excitation.","tr":"Klasik opioid reseptörleri başlıca inhibitör Gi/o proteinleriyle eşleşir. Kalsiyum girişinin azalması nörotransmiter salımını sınırlar, potasyum iletkenliğinin artması ise hiperpolarizasyonu destekler; cAMP ve kalsiyum girişinin artması bunun tersine uyarılmayı destekler."},"sourcePages":[128],"difficulty":"core","sourcePdfPages":[140]},{"id":"c10q2","stem":{"en":"Which morphine metabolite is both pharmacologically active at opioid receptors and liable to accumulate when renal excretion is impaired?","tr":"Hangi morfin metaboliti hem opioid reseptörlerinde farmakolojik olarak aktiftir hem de renal atılım bozulduğunda birikebilir?"},"options":[{"en":"Norfentanyl","tr":"Norfentanil"},{"en":"Morphine-6-glucuronide","tr":"Morfin-6-glukuronid"},{"en":"Morphine-3-glucuronide","tr":"Morfin-3-glukuronid"},{"en":"Norketamine","tr":"Norketamin"},{"en":"The carboxylic acid metabolite of remifentanil","tr":"Remifentanilin karboksilik asit metaboliti"}],"answer":1,"explanation":{"en":"Morphine-6-glucuronide retains important opioid activity and is cleared through the kidneys, so impaired renal elimination can prolong opioid effects. Morphine-3-glucuronide can also accumulate, but it does not account for the same μ-agonist analgesic activity.","tr":"Morfin-6-glukuronid belirgin opioid aktivitesini korur ve böbrekler yoluyla atılır; bu nedenle renal eliminasyonun bozulması opioid etkilerini uzatabilir. Morfin-3-glukuronid de birikebilir, ancak aynı μ-agonist analjezik aktiviteden sorumlu değildir."},"sourcePages":[132],"difficulty":"applied","sourcePdfPages":[144]},{"id":"c10q3","stem":{"en":"Why does remifentanil generally retain a short context-sensitive half-time even after a prolonged infusion?","tr":"Remifentanil, uzun süreli bir infüzyondan sonra bile neden genellikle kısa bir bağlam duyarlı yarılanma süresini (context-sensitive half-time) korur?"},"options":[{"en":"It is stored irreversibly in adipose tissue.","tr":"Yağ dokusunda geri dönüşümsüz biçimde depolanır."},{"en":"It is excreted almost entirely unchanged by glomerular filtration.","tr":"Hemen hemen tamamen değişmeden glomerüler filtrasyonla atılır."},{"en":"It is metabolised only after the infusion has stopped.","tr":"Yalnızca infüzyon durdurulduktan sonra metabolize edilir."},{"en":"It undergoes rapid hydrolysis by non-specific blood and tissue esterases.","tr":"Kandaki ve dokulardaki nonspesifik esterazlarla hızlı hidrolize uğrar."},{"en":"Its clearance depends on the same plasma cholinesterase that hydrolyses suxamethonium.","tr":"Klirensi, süksametonyumu hidrolize eden aynı plazma kolinesterazına bağlıdır."}],"answer":3,"explanation":{"en":"Remifentanil is continuously and rapidly hydrolysed by widely distributed non-specific esterases, limiting accumulation of the active parent drug. This pathway differs from plasma cholinesterase-dependent metabolism, so cholinesterase deficiency does not explain a prolonged remifentanil effect.","tr":"Remifentanil, yaygın olarak bulunan nonspesifik esterazlar tarafından sürekli ve hızla hidrolize edilir; böylece aktif ana ilacın birikimi sınırlanır. Bu yol plazma kolinesterazına bağımlı metabolizmadan farklıdır; dolayısıyla kolinesteraz eksikliği remifentanil etkisinin uzamasını açıklamaz."},"sourcePages":[137,138],"difficulty":"applied","sourcePdfPages":[149,150]},{"id":"c10q4","stem":{"en":"Why can aspirin inhibit an exposed platelet after aspirin itself has disappeared from the plasma?","tr":"Aspirin plazmadan kaybolduktan sonra, ilaca maruz kalmış bir trombositi neden inhibe etmeyi sürdürebilir?"},"options":[{"en":"Aspirin is retained indefinitely in the platelet membrane.","tr":"Aspirin trombosit zarında süresiz olarak tutulur."},{"en":"Aspirin permanently blocks every platelet ADP receptor.","tr":"Aspirin trombositlerdeki bütün ADP reseptörlerini kalıcı olarak bloke eder."},{"en":"It irreversibly inhibits cyclo-oxygenase, and the platelet cannot adequately replace that enzyme.","tr":"Siklooksijenazı geri dönüşümsüz inhibe eder ve trombosit bu enzimi yeterli ölçüde yenileyemez."},{"en":"Its effect requires sustained reversible binding to circulating thrombin.","tr":"Etkisi, dolaşımdaki trombine sürekli ve geri dönüşümlü bağlanmayı gerektirir."},{"en":"It selectively destroys fibrin already present in a clot.","tr":"Pıhtıda önceden bulunan fibrini seçici olarak parçalar."}],"answer":2,"explanation":{"en":"Aspirin irreversibly acetylates platelet cyclo-oxygenase, reducing thromboxane formation. Because mature platelets cannot adequately replace the inhibited enzyme, the effect outlasts plasma aspirin; reversible COX inhibitors do not share this same persistence in each exposed platelet.","tr":"Aspirin, trombosit siklooksijenazını geri dönüşümsüz asetilleyerek tromboksan oluşumunu aza
