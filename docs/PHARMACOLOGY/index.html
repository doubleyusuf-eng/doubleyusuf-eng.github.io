ltır. Olgun trombositler inhibe edilen enzimi yeterli ölçüde yenileyemediği için etki plazmadaki aspirinden daha uzun sürer; geri dönüşümlü COX inhibitörlerinde, ilaca maruz kalan her trombositte aynı kalıcılık görülmez."},"sourcePages":[142,145],"difficulty":"core","sourcePdfPages":[154,157]},{"id":"c10q5","stem":{"en":"Which endogenous substance normally detoxifies the reactive paracetamol metabolite NAPQI by conjugation?","tr":"Reaktif parasetamol metaboliti NAPQI’yi normalde konjugasyon yoluyla hangi endojen madde detoksifiye eder?"},"options":[{"en":"Glutathione","tr":"Glutatyon"},{"en":"Albumin","tr":"Albümin"},{"en":"Acetylcholine","tr":"Asetilkolin"},{"en":"Thromboxane A2","tr":"Tromboksan A2"},{"en":"Creatinine","tr":"Kreatinin"}],"answer":0,"explanation":{"en":"A small oxidative pathway forms NAPQI, which is normally neutralised by conjugation with hepatic glutathione. Albumin binding is not the protective detoxification pathway; when glutathione becomes depleted, NAPQI can bind cellular proteins and cause hepatocyte injury.","tr":"Küçük bir oksidatif metabolizma yolu NAPQI oluşturur; bu metabolit normalde karaciğerdeki glutatyonla konjugasyon yoluyla etkisizleştirilir. Albümine bağlanma koruyucu detoksifikasyon yolu değildir; glutatyon tükendiğinde NAPQI hücresel proteinlere bağlanarak hepatosit hasarına yol açabilir."},"sourcePages":[148],"difficulty":"core","sourcePdfPages":[160]}]},{"id":11,"title":{"en":"Local Anaesthetics","tr":"Lokal Anestezikler"},"startPage":156,"endPage":167,"pdfStartPage":168,"pdfEndPage":179,"section":2,"questions":[{"id":"c11q1","stem":{"en":"For an amine local anaesthetic such as lidocaine, which sequence best describes access to and blockade of the neuronal sodium channel?","tr":"Lidokain gibi amin yapılı bir lokal anestezik için nöronal sodyum kanalına ulaşma ve kanalı bloke etme sürecini en iyi hangi sıra açıklar?"},"options":[{"en":"The ionised form crosses the lipid membrane and activates extracellular sodium channels.","tr":"İyonlaşmış form lipit zarı geçer ve hücre dışındaki sodyum kanallarını aktive eder."},{"en":"The unionised form crosses the membrane, then the protonated form blocks the channel from the intracellular side.","tr":"İyonlaşmamış form zarı geçer; ardından protonlanmış form kanalı hücre içi taraftan bloke eder."},{"en":"The drug inhibits sodium synthesis inside the axon.","tr":"İlaç akson içinde sodyum sentezini inhibe eder."},{"en":"The drug opens potassium channels only by binding a nuclear receptor.","tr":"İlaç yalnızca nükleer bir reseptöre bağlanarak potasyum kanallarını açar."},{"en":"The protein-bound fraction crosses the membrane without dissociation.","tr":"Proteine bağlı fraksiyon ayrışmadan zarı geçer."}],"answer":1,"explanation":{"en":"The relatively lipid-soluble unionised base penetrates the nerve membrane, after which protonation permits interaction at the intracellular sodium-channel binding site. The charged form is important for blockade, but it is not the form that most readily traverses the lipid bilayer.","tr":"Görece lipitte çözünen iyonlaşmamış baz sinir zarını geçer; ardından protonlanması, sodyum kanalının hücre içi bağlanma bölgesiyle etkileşmesine olanak sağlar. Yüklü form blok açısından önemlidir, ancak lipit çift tabakasını en kolay geçen form değildir."},"sourcePages":[157],"difficulty":"core","sourcePdfPages":[169]},{"id":"c11q2","stem":{"en":"In an isolated nerve preparation, increasing stimulation frequency increases local-anaesthetic sodium-channel blockade despite unchanged drug concentration and pH. Which explanation best accounts for this?","tr":"İzole bir sinir preparatında ilaç konsantrasyonu ve pH değişmediği halde uyarı sıklığının artırılması lokal anesteziğe bağlı sodyum kanalı bloğunu artırıyor. Bu durumu en iyi hangi açıklama açıklar?"},"options":[{"en":"Stimulation lowers the drug’s pKa independently of pH.","tr":"Uyarılma, pH’dan bağımsız olarak ilacın pKa değerini düşürür."},{"en":"Each impulse irreversibly destroys a fixed number of sodium channels.","tr":"Her impuls belirli sayıda sodyum kanalını geri dönüşümsüz olarak yıkar."},{"en":"Rapid firing keeps all sodium channels in their resting state.","tr":"Hızlı ateşleme bütün sodyum kanallarını dinlenim durumunda tutar."},{"en":"Frequent activation favours drug interaction with open and inactivated channel states.","tr":"Sık aktivasyon, ilacın açık ve inaktif kanal durumlarıyla etkileşimini destekler."},{"en":"Only permanently closed channels bind local anaesthetic.","tr":"Yalnızca kalıcı olarak kapalı kanallar lokal anesteziğe bağlanır."}],"answer":3,"explanation":{"en":"Local anaesthetic block is use-dependent: repeated activation increases opportunities for binding to open or inactivated sodium channels and can limit recovery between impulses. The channels are reversibly inhibited, not permanently destroyed, so an unchanged drug concentration can produce different degrees of block at different firing rates.","tr":"Lokal anestezik blok kullanıma bağımlıdır: tekrarlayan aktivasyon, açık veya inaktif sodyum kanallarına bağlanma fırsatını artırır ve impulslar arasındaki toparlanmayı sınırlayabilir. Kanallar kalıcı olarak yıkılmaz, geri dönüşümlü olarak inhibe edilir; bu nedenle aynı ilaç konsantrasyonu farklı ateşleme hızlarında farklı derecelerde blok oluşturabilir."},"sourcePages":[157,160],"difficulty":"applied","sourcePdfPages":[169,172]},{"id":"c11q3","stem":{"en":"Which physicochemical property of a local anaesthetic is most closely associated with a longer duration of nerve blockade, when other relevant factors are comparable?","tr":"Diğer ilgili etkenler benzer olduğunda, bir lokal anesteziğin hangi fizikokimyasal özelliği daha uzun sinir bloğu süresiyle en yakından ilişkilidir?"},"options":[{"en":"Greater protein binding","tr":"Daha fazla proteine bağlanma"},{"en":"A lower pKa","tr":"Daha düşük pKa"},{"en":"Greater water solubility","tr":"Suda daha fazla çözünürlük"},{"en":"More rapid removal from the injection site","tr":"Enjeksiyon bölgesinden daha hızlı uzaklaşma"},{"en":"More rapid enzymatic destruction of the drug","tr":"İlacın enzimlerle daha hızlı yıkılması"}],"answer":0,"explanation":{"en":"Greater protein binding is associated with a longer local anaesthetic action. A lower pKa generally increases the unionised fraction at tissue pH and is more directly related to membrane entry and onset; blood flow, dose and tissue distribution also influence the actual duration.","tr":"Daha fazla proteine bağlanma, daha uzun lokal anestezik etkiyle ilişkilidir. Daha düşük pKa, doku pH’sında iyonlaşmamış fraksiyonu genellikle artırır ve zardan geçiş ile etki başlangıcıyla daha doğrudan ilişkilidir; kan akımı, doz ve dokulara dağılım da gerçek etki süresini etkiler."},"sourcePages":[158,159],"difficulty":"core","sourcePdfPages":[170,171]},{"id":"c11q4","stem":{"en":"Which comparison of procaine and lidocaine metabolism is correct?","tr":"Prokain ve lidokain metabolizmasına ilişkin hangi karşılaştırma doğrudur?"},"options":[{"en":"Both are eliminated mainly by pulmonary exhalation.","tr":"Her ikisi de başlıca akciğerlerden solunumla atılır."},{"en":"Procaine relies mainly on hepatic amide hydrolysis, while lidocaine is rapidly cleaved by plasma cholinesterase.","tr":"Prokain başlıca karaciğerde amid hidrolizine bağımlıdır; lidokain ise plazma kolinesterazıyla hızla parçalanır."},{"en":"Both are excreted almost entirely unchanged in urine.","tr":"Her ikisi de hemen hemen tamamen değişmeden idrarla atılır."},{"en":"Neither can undergo enzymatic metabolism because both are tertiary amines.","tr":"Her ikisi de tersiyer amin olduğu için enzimatik metabolizmaya uğrayamaz."},{"en":"Procaine is hydrolysed by plasma esterases, whereas lidocaine is metabolised predominantly in the liver.","tr":"Prokain plazma esterazlarıyla hidrolize edilirken lidokain başlıca karaciğerde metabolize edilir."}],"answer":4,"explanation":{"en":"Procaine has an ester linkage and is rapidly hydrolysed by plasma cholinesterase, whereas lidocaine has an amide linkage and undergoes mainly hepatic metabolism. Reversing these pathways confuses the two chemical classes; the statement is about these named agents, not every ester without exception.","tr":"Prokain ester bağı taşır ve plazma kolinesterazıyla hızla hidrolize edilir; lidokain ise amid bağı taşır ve başlıca karaciğerde metabolize edilir. Bu yolları ters eşleştirmek iki kimyasal sınıfı karıştırır; ifade istisnasız bütün esterler hakkında değil, adı verilen bu ilaçlar hakkındadır."},"sourcePages":[158,161,163],"difficulty":"applied","sourcePdfPages":[170,173,175]},{"id":"c11q5","stem":{"en":"Why can the lidocaine–prilocaine eutectic mixture exist as an oil at room temperature when the separate bases are crystalline solids?","tr":"Ayrı bazları kristal katı halinde olduğu halde lidokain–prilokain ötektik karışımı neden oda sıcaklığında yağ halinde bulunabilir?"},"options":[{"en":"The two drugs form a new covalent anaesthetic molecule.","tr":"İki ilaç yeni bir kovalent anestezik molekül oluşturur."},{"en":"Both drugs become gases and are trapped in the emulsion.","tr":"Her iki ilaç da gaza dönüşür ve emülsiyon içinde tutulur."},{"en":"Mixing the bases lowers the melting point below room temperature.","tr":"Bazların karıştırılması erime noktasını oda sıcaklığının altına düşürür."},{"en":"The mixture irreversibly hydrolyses both amide bonds.","tr":"Karışım her iki amid bağını geri dönüşümsüz hidrolize eder."},{"en":"The drugs must first be converted into their glucuronide metabolites.","tr":"İlaçların önce glukuronid metabolitlerine dönüştürülmesi gerekir."}],"answer":2,"explanation":{"en":"A eutectic composition has a melting point below that of its separate components, allowing this mixture of bases to be liquid at room temperature. This is a physical phase behaviour, rather than the synthesis of a new covalently bonded drug.","tr":"Ötektik bir bileşimin erime noktası ayrı bileşenlerinkinden düşüktür; bu nedenle söz konusu baz karışımı oda sıcaklığında sıvı olabilir. Bu, kovalent bağlarla oluşmuş yeni bir ilacın sentezi değil, fiziksel bir faz davranışıdır."},"sourcePages":[163,164],"difficulty":"core","sourcePdfPages":[175,176]}]},{"id":12,"title":{"en":"Muscle Relaxants and Reversal Agents","tr":"Kas Gevşeticiler ve Geri Döndürme Ajanları"},"startPage":168,"endPage":188,"pdfStartPage":180,"pdfEndPage":200,"section":2,"questions":[{"id":"c12q1","stem":{"en":"What most directly explains paralysis during a phase I suxamethonium block?","tr":"Faz I süksametonyum bloğu sırasında paraliziyi en doğrudan ne açıklar?"},"options":[{"en":"Competitive prevention of acetylcholine binding without end-plate depolarisation","tr":"Motor son plakta depolarizasyon oluşturmadan asetilkolin bağlanmasının kompetitif olarak engellenmesi"},{"en":"Depletion of calcium from the plasma","tr":"Plazmadaki kalsiyumun tükenmesi"},{"en":"Irreversible destruction of the motor nerve terminal","tr":"Motor sinir ucunun geri dönüşümsüz yıkılması"},{"en":"Persistent end-plate depolarisation keeps nearby voltage-gated sodium channels inactivated","tr":"Motor son plağın süregelen depolarizasyonunun yakındaki voltaj kapılı sodyum kanallarını inaktif halde tutması"},{"en":"Direct anaesthesia of the cerebral motor cortex","tr":"Serebral motor korteksin doğrudan anestezisi"}],"answer":3,"explanation":{"en":"Suxamethonium activates nicotinic receptors and produces sustained end-plate depolarisation, preventing adjacent sodium channels from recovering to an excitable state. Competitive receptor antagonism without depolarisation instead describes the principal action of non-depolarising neuromuscular blockers.","tr":"Süksametonyum nikotinik reseptörleri aktive ederek motor son plakta süregelen depolarizasyona yol açar ve komşu sodyum kanallarının yeniden uyarılabilir hale dönmesini engeller. Depolarizasyon olmadan kompetitif reseptör antagonizması ise nondepolarizan nöromüsküler blokerlerin başlıca etkisini tanımlar."},"sourcePages":[172],"difficulty":"core","sourcePdfPages":[184]},{"id":"c12q2","stem":{"en":"In a laboratory study of partial neuromuscular blockade, which train-of-four pattern is most characteristic of a non-depolarising blocker?","tr":"Kısmi nöromüsküler bloğun incelendiği bir laboratuvar çalışmasında, hangi dörtlü uyarı (TOF) paterni nondepolarizan bir bloker için en tipiktir?"},"options":[{"en":"Successive responses decrease, so the fourth twitch is smaller than the first.","tr":"Ardışık yanıtlar azalır; dördüncü kas seğirmesi birinciden küçüktür."},{"en":"All four responses remain equal to the unblocked baseline.","tr":"Dört yanıtın hepsi bloksuz başlangıç düzeyine eşit kalır."},{"en":"The fourth twitch is necessarily larger than the first.","tr":"Dördüncü kas seğirmesi zorunlu olarak birinciden büyüktür."},{"en":"Only the first stimulus is delivered by the device.","tr":"Cihaz yalnızca ilk uyarıyı verir."},{"en":"Each twitch remains equal to the others despite an overall reduction in height.","tr":"Genlikleri genel olarak azalsa da kas seğirmelerinin her biri diğerleriyle eşit kalır."}],"answer":0,"explanation":{"en":"Non-depolarising blockade characteristically produces fade during repeated stimulation, giving a fourth-to-first twitch ratio below one. Equal depression without fade is the classic pattern of a partial phase I depolarising block, so a ratio alone must not be confused with an assessment of all aspects of recovery.","tr":"Nondepolarizan blok, tekrarlayan uyarılar sırasında tipik olarak yanıt azalması (fade) oluşturur; bu nedenle dördüncü yanıtın birinciye oranı birin altındadır. Fade olmadan eşit baskılanma, kısmi faz I depolarizan bloğun klasik paternidir; dolayısıyla yalnızca bir oran, derlenmenin tüm yönlerinin değerlendirilmesiyle karıştırılmamalıdır."},"sourcePages":[170,171,172],"difficulty":"applied","sourcePdfPages":[182,183,184]},{"id":"c12q3","stem":{"en":"What does a dibucaine number primarily describe in an assay of plasma cholinesterase?","tr":"Plazma kolinesterazı analizinde dibukain sayısı başlıca neyi gösterir?"},"options":[{"en":"The mass of cholinesterase protein in each millilitre of plasma","tr":"Her mililitre plazmadaki kolinesteraz proteininin kütlesini"},{"en":"The plasma concentration of suxamethonium","tr":"Süksametonyumun plazma konsantrasyonunu"},{"en":"The number of nicotinic receptors occupied at the motor end plate","tr":"Motor son plakta işgal edilmiş nikotinik reseptör sayısını"},{"en":"The percentage of acetylcholine released by each nerve impulse","tr":"Her sinir impulsunda salınan asetilkolinin yüzdesini"},{"en":"The percentage inhibition of enzyme activity by dibucaine under defined assay conditions","tr":"Tanımlanmış analiz koşullarında enzim aktivitesinin dibukainle inhibe edilen yüzdesini"}],"answer":4,"explanation":{"en":"The dibucaine number measures how strongly dibucaine inhibits the enzyme, helping distinguish enzyme variants. It is a qualitative measure of enzyme behaviour and is not a measurement of the amount of enzyme present in plasma.","tr":"Dibukain sayısı, dibukainin enzimi ne ölçüde inhibe ettiğini ölçerek enzim varyantlarının ayırt edilmesine yardımcı olur. Enzimin davranışına ilişkin nitel bir göstergedir ve plazmada bulunan enzim miktarının ölçümü değildir."},"sourcePages":[176],"difficulty":"core","sourcePdfPages":[188]},{"id":"c12q4","stem":{"en":"In an in-vitro study of atracurium, which change would slow its Hofmann elimination?","tr":"Atrakuryumun incelendiği bir in vitro çalışmada hangi değişiklik Hofmann eliminasyonunu yavaşlatır?"},"options":[{"en":"Raising both temperature and pH","tr":"Hem sıcaklığın hem de pH’nın artırılması"},{"en":"Raising pH while keeping temperature constant","tr":"Sıcaklık sabitken pH’nın artırılması"},{"en":"Lowering both temperature and pH","tr":"Hem sıcaklığın hem de pH’nın düşürülmesi"},{"en":"Reducing plasma cholinesterase activity while keeping temperature and pH constant","tr":"Sıcaklık ve pH sabitken plazma kolinesteraz aktivitesinin azaltılması"},{"en":"Removing enzymes while keeping temperature and pH constant","tr":"Sıcaklık ve pH sabitken enzimlerin uzaklaştırılması"}],"answer":2,"explanation":{"en":"Hofmann elimination is a spontaneous chemical degradation that is slowed by cooling and acidification. It does not require plasma cholinesterase, renal filtration or hepatic blood flow, although atracurium also has a separate ester-hydrolysis pathway.","tr":"Hofmann eliminasyonu, soğutma ve asitleştirmeyle yavaşlayan spontan bir kimyasal yıkımdır. Plazma kolinesterazına, renal filtrasyona veya hepatik kan akımına gerek duymaz; bununla birlikte atrakuryumun ayrıca bir ester hidrolizi yolu da vardır."},"sourcePages":[181,182],"difficulty":"applied","sourcePdfPages":[193,194]},{"id":"c12q5","stem":{"en":"Which mechanism distinguishes sugammadex from neostigmine?","tr":"Sugammadeksi neostigminden ayıran mekanizma hangisidir?"},"options":[{"en":"Covalent phosphorylation of acetylcholinesterase","tr":"Asetilkolinesterazın kovalent fosforilasyonu"},{"en":"Encapsulation of rocuronium or vecuronium, lowering the free blocker concentration","tr":"Rokuronyum veya vekuronyumu kapsülleyerek serbest bloker konsantrasyonunu azaltması"},{"en":"Direct agonism at the muscle nicotinic receptor","tr":"Kas tipi nikotinik reseptörde doğrudan agonizma"},{"en":"Carbamylation of acetylcholinesterase to increase synaptic acetylcholine","tr":"Sinaptik asetilkolini artırmak için asetilkolinesterazın karbamilasyonu"},{"en":"Inhibition of calcium release from the sarcoplasmic reticulum","tr":"Sarkoplazmik retikulumdan kalsiyum salımının inhibisyonu"}],"answer":1,"explanation":{"en":"Sugammadex is a modified cyclodextrin that binds rocuronium or vecuronium in plasma, reducing the free concentration available to occupy junctional receptors. Neostigmine instead inhibits acetylcholinesterase and increases acetylcholine; the drugs therefore reverse blockade through different mechanisms.","tr":"Sugammadeks, plazmada rokuronyum veya vekuronyuma bağlanarak kavşaktaki reseptörleri işgal edebilecek serbest konsantrasyonu azaltan modifiye bir siklodekstrindir. Neostigmin ise asetilkolinesterazı inhibe ederek asetilkolini artırır; dolayısıyla bu ilaçlar bloğu farklı mekanizmalarla geri döndürür."},"sourcePages":[183,184,187],"difficulty":"core","sourcePdfPages":[195,196,199]}]},{"id":13,"title":{"en":"Sympathomimetics","tr":"Sempatomimetikler"},"startPage":189,"endPage":206,"pdfStartPage":201,"pdfEndPage":218,"section":3,"questions":[{"id":"c13q1","stem":{"en":"Which signalling sequence is characteristic of α1-adrenoceptor activation in vascular smooth muscle?","tr":"Vasküler düz kasta α1-adrenoseptör aktivasyonu için hangi sinyal dizisi tipiktir?"},"options":[{"en":"Gq activation → phospholipase C activation → increased IP3-dependent calcium availability","tr":"Gq aktivasyonu → fosfolipaz C aktivasyonu → IP3’e bağlı kalsiyum kullanılabilirliğinin artması"},{"en":"Gs activation → inhibition of adenylyl cyclase → reduced cAMP","tr":"Gs aktivasyonu → adenilat siklaz inhibisyonu → cAMP azalması"},{"en":"Gi activation → activation of adenylyl cyclase → increased cAMP","tr":"Gi aktivasyonu → adenilat siklaz aktivasyonu → cAMP artması"},{"en":"Direct opening of a ligand-gated chloride channel","tr":"Ligand kapılı klor kanalının doğrudan açılması"},{"en":"Direct inhibition of the skeletal-muscle ryanodine receptor","tr":"İskelet kasındaki riyanodin reseptörünün doğrudan inhibisyonu"}],"answer":0,"explanation":{"en":"α1-adrenoceptors classically couple to Gq and activate phospholipase C, generating IP3 and increasing intracellular calcium availability for contraction. β-adrenoceptors instead predominantly use Gs–adenylyl cyclase–cAMP signalling, whereas α2-adrenoceptors predominantly couple to Gi.","tr":"α1-adrenoseptörler klasik olarak Gq ile eşleşip fosfolipaz C’yi aktive eder; IP3 oluşturarak kasılma için hücre içi kalsiyum kullanılabilirliğini artırır. β-adrenoseptörler ise başlıca Gs–adenilat siklaz–cAMP sinyal yolunu kullanırken α2-adrenoseptörler başlıca Gi ile eşleşir."},"sourcePages":[192,193],"difficulty":"core","sourcePdfPages":[204,205]},{"id":"c13q2","stem":{"en":"In a subject with an intact baroreflex, phenylephrine increases arterial pressure while the heart rate falls. Which explanation best accounts for the fall in heart rate?","tr":"Barorefleksi sağlam bir bireyde fenilefrin arter basıncını artırırken kalp hızı düşüyor. Kalp hızındaki düşmeyi en iyi hangi açıklama açıklar?"},"options":[{"en":"Direct competitive antagonism of cardiac β1-receptors","tr":"Kardiyak β1-reseptörlerde doğrudan kompetitif antagonizma"},{"en":"Direct activation of cardiac muscarinic receptors by phenylephrine","tr":"Fenilefrinin kardiyak muskarinik reseptörleri doğrudan aktive etmesi"},{"en":"Reflex vagal activation in response to α1-mediated vasoconstriction","tr":"α1 aracılı vazokonstriksiyona yanıt olarak refleks vagal aktivasyon"},{"en":"Inhibition of acetylcholinesterase at autonomic ganglia","tr":"Otonom gangliyonlarda asetilkolinesterazın inhibisyonu"},{"en":"Depletion of calcium from cardiac myocytes","tr":"Kalp miyositlerindeki kalsiyumun tükenmesi"}],"answer":2,"explanation":{"en":"Phenylephrine mainly stimulates vascular α1-receptors, raising pressure and activating the baroreflex, which can slow the heart through increased vagal activity. The bradycardia is therefore a reflex effect, rather than evidence that phenylephrine is a β1-blocker.","tr":"Fenilefrin başlıca vasküler α1-reseptörleri uyararak basıncı artırır ve barorefleksi aktive eder; artan vagal aktivite kalbi yavaşlatabilir. Bu nedenle bradikardi refleks bir etkidir ve fenilefrinin β1-bloker olduğunu göstermez."},"sourcePages":[196,198],"difficulty":"applied","sourcePdfPages":[208,210]},{"id":"c13q3","stem":{"en":"What is the principal process terminating the local action of noradrenaline released from a sympathetic nerve terminal?","tr":"Sempatik bir sinir ucundan salınan noradrenalinin yerel etkisini sonlandıran başlıca süreç hangisidir?"},"options":[{"en":"Hydrolysis by acetylcholinesterase in the synaptic cleft","tr":"Sinaptik aralıkta asetilkolinesterazla hidroliz"},{"en":"Immediate urinary excretion of all released transmitter","tr":"Salınan nörotransmiterin tamamının hemen idrarla atılması"},{"en":"Direct uptake into red blood cells as the dominant local mechanism","tr":"Baskın yerel mekanizma olarak eritrositlere doğrudan alınması"},{"en":"Exclusive metabolism by COMT inside the sympathetic nerve terminal","tr":"Yalnızca sempatik sinir ucu içindeki COMT ile metabolizma"},{"en":"Neuronal reuptake into the nerve terminal, termed uptake 1","tr":"Uptake 1 adı verilen süreçle sinir ucuna nöronal geri alım"}],"answer":4,"explanation":{"en":"Neuronal uptake 1 removes most locally released noradrenaline from the junction, allowing recycling or intraneuronal metabolism by monoamine oxidase. Extraneuronal removal and metabolism contribute, but COMT within the sympathetic nerve terminal is not the principal termination mechanism described here.","tr":"Nöronal uptake 1, yerel olarak salınan noradrenalinin büyük bölümünü kavşaktan uzaklaştırarak geri dönüşümüne veya nöron içinde monoamin oksidazla metabolizmasına olanak verir. Nöron dışı uzaklaştırma ve metabolizma da katkıda bulunur; ancak sempatik sinir ucu içindeki COMT, burada tanımlanan başlıca sonlandırma mekanizması değildir."},"sourcePages":[195],"difficulty":"core","sourcePdfPages":[207]},{"id":"c13q4","stem":{"en":"Repeated exposure to ephedrine produces progressively smaller pressor responses in an experimental preparation. Which mechanism best explains this tachyphylaxis?","tr":"Deneysel bir preparatta efedrine tekrarlayan maruziyet giderek daha küçük kan basıncı artışları oluşturuyor. Bu taşifilaksiyi en iyi hangi mekanizma açıklar?"},"options":[{"en":"Progressive inhibition of monoamine oxidase causes transmitter accumulation.","tr":"Monoamin oksidazın giderek daha fazla inhibe olması nörotransmiter birikimine yol açar."},{"en":"Depletion of releasable noradrenaline stores reduces the indirect component of its action.","tr":"Salınabilir noradrenalin depolarının tükenmesi etkisinin indirekt bileşenini azaltır."},{"en":"New sympathetic nerve terminals are formed immediately.","tr":"Hemen yeni sempatik sinir uçları oluşur."},{"en":"Ephedrine irreversibly removes every α1-receptor after the first exposure.","tr":"Efedrin ilk maruziyetten sonra bütün α1-reseptörleri geri dönüşümsüz olarak ortadan kaldırır."},{"en":"The plasma concentration necessarily rises despite an unchanged exposure.","tr":"Maruziyet değişmediği halde plazma konsantrasyonu zorunlu olarak yükselir."}],"answer":1,"explanation":{"en":"Ephedrine has an indirect component that depends on releasing stored noradrenaline. Depletion of this releasable pool reduces subsequent responses, whereas a purely direct agonist does not require transmitter stores for receptor activation.","tr":"Efedrinin depolanmış noradrenalinin salınmasına bağımlı indirekt bir etki bileşeni vardır. Salınabilir havuzun tükenmesi sonraki yanıtları azaltır; yalnızca doğrudan etki eden bir agonist ise reseptör aktivasyonu için nörotransmiter depolarına ihtiyaç duymaz."},"sourcePages":[201],"difficulty":"applied","sourcePdfPages":[213]},{"id":"c13q5","stem":{"en":"Why is milrinone described as an inodilator?","tr":"Milrinon neden inodilatör olarak tanımlanır?"},"options":[{"en":"Direct β-adrenoceptor agonism increases cAMP in cardiac and vascular muscle.","tr":"Doğrudan β-adrenoseptör agonizması, kalp kasında ve vasküler düz kasta cAMP’yi artırır."},{"en":"It opens skeletal-muscle nicotinic channels and inhibits cardiac calcium entry.","tr":"İskelet kasındaki nikotinik kanalları açar ve kalpte kalsiyum girişini inhibe eder."},{"en":"It blocks neuronal uptake 1 and acts solely through released noradrenaline.","tr":"Nöronal uptake 1’i bloke eder ve yalnızca salınan noradrenalin üzerinden etki gösterir."},{"en":"PDE3 inhibition increases cAMP, supporting myocardial contraction and vascular smooth-muscle relaxation.","tr":"PDE3 inhibisyonu cAMP’yi artırarak miyokard kasılmasını ve vasküler düz kas gevşemesini destekler."},{"en":"It directly stimulates α1-receptors in both myocardium and vascular smooth muscle.","tr":"Hem miyokardda hem de vasküler düz kasta α1-reseptörleri doğrudan uyarır."}],"answer":3,"explanation":{"en":"Milrinone inhibits phosphodiesterase 3, slowing cAMP breakdown in cardiac and vascular muscle. The resulting tissue-specific responses combine positive inotropy with vasodilatation; unlike dobutamine, this does not require direct β1-receptor stimulation.","tr":"Milrinon fosfodiesteraz 3’ü inhibe ederek kalp kasında ve vasküler düz kasta cAMP yıkımını yavaşlatır. Ortaya çıkan dokuya özgü yanıtlar pozitif inotropiyi vazodilatasyonla birleştirir; dobutaminden farklı olarak bu etki doğrudan β1-reseptör uyarımı gerektirmez."},"sourcePages":[204,205],"difficulty":"core","sourcePdfPages":[216,217]}]},{"id":14,"title":{"en":"Adrenoceptor Antagonists","tr":"Adrenoseptör Antagonistleri"},"startPage":207,"endPage":216,"pdfStartPage":219,"pdfEndPage":228,"section":3,"questions":[{"id":"c14q1","stem":{"en":"After free phenoxybenzamine has been removed from an experimental preparation, α-adrenoceptor blockade persists. Which property best explains this persistence?","tr":"Deneysel bir preparattan serbest fenoksibenzamin uzaklaştırıldıktan sonra α-adrenoseptör blokajı sürmektedir. Bu kalıcılığı en iyi hangi özellik açıklar?"},"options":[{"en":"Rapid reversible competition with noradrenaline","tr":"Noradrenalinle hızlı ve geri dönüşümlü yarışma"},{"en":"Selective inhibition of catecholamine synthesis","tr":"Katekolamin sentezinin seçici inhibisyonu"},{"en":"Covalent receptor binding producing irreversible blockade","tr":"Geri dönüşümsüz blokaja yol açan kovalent reseptör bağlanması"},{"en":"Activation of presynaptic α2-adrenoceptors","tr":"Presinaptik α2-adrenoseptörlerin aktivasyonu"},{"en":"Conversion to a short-lived competitive β-blocker","tr":"Kısa etkili, kompetitif bir β-blokere dönüşme"}],"answer":2,"explanation":{"en":"A reactive phenoxybenzamine intermediate binds covalently to α-adrenoceptors, so recovery depends on the formation of new functional receptors. A reversible competitive antagonist, such as phentolamine, does not produce this persistent receptor inactivation.","tr":"Fenoksibenzaminin reaktif bir ara ürünü α-adrenoseptörlere kovalent bağlanır; bu nedenle yanıtın geri dönmesi yeni işlevsel reseptörlerin oluşmasına bağlıdır. Fentolamin gibi geri dönüşümlü kompetitif bir antagonist, reseptörlerde bu tür kalıcı inaktivasyona yol açmaz."},"sourcePages":[207,208,209],"difficulty":"applied","sourcePdfPages":[219,220,221]},{"id":"c14q2","stem":{"en":"Which effect of phentolamine is specifically explained by blockade of presynaptic α2-adrenoceptors?","tr":"Fentolaminin hangi etkisi özellikle presinaptik α2-adrenoseptör blokajıyla açıklanır?"},"options":[{"en":"Increased noradrenaline release from sympathetic nerve terminals","tr":"Sempatik sinir uçlarından noradrenalin salınımının artması"},{"en":"Direct relaxation caused by postsynaptic α1-receptor blockade","tr":"Postsinaptik α1-reseptör blokajına bağlı doğrudan gevşeme"},{"en":"Reduced renin release through β1-receptor blockade","tr":"β1-reseptör blokajı yoluyla renin salınımının azalması"},{"en":"Reduced cardiac contractility through β1-receptor blockade","tr":"β1-reseptör blokajı yoluyla kalbin kasılma gücünün azalması"},{"en":"Reduced catecholamine synthesis through tyrosine hydroxylase inhibition","tr":"Tirozin hidroksilaz inhibisyonu yoluyla katekolamin sentezinin azalması"}],"answer":0,"explanation":{"en":"Presynaptic α2-receptors normally provide inhibitory feedback on noradrenaline release; blocking them removes this restraint. Direct vascular relaxation is instead explained mainly by postsynaptic α1-blockade, while selective α1-antagonists such as prazosin preserve the α2 feedback pathway.","tr":"Presinaptik α2-reseptörler normalde noradrenalin salınımına inhibitör geri bildirim sağlar; bu reseptörlerin blokajı söz konusu baskıyı kaldırır. Doğrudan damar gevşemesi esas olarak postsinaptik α1-blokajıyla açıklanırken prazosin gibi seçici α1-antagonistleri α2 geri bildirim yolunu korur."},"sourcePages":[207,208,209],"difficulty":"core","sourcePdfPages":[219,220,221]},{"id":"c14q3","stem":{"en":"In a receptor experiment, a β-blocker produces a small response when catecholamines are absent but reduces the response to a full β-agonist. Which property is demonstrated?","tr":"Bir reseptör deneyinde bir β-bloker, katekolaminler yokken küçük bir yanıt oluşturmakta ancak tam bir β-agoniste verilen yanıtı azaltmaktadır. Bu bulgu hangi özelliği gösterir?"},"options":[{"en":"Irreversible receptor antagonism","tr":"Geri dönüşümsüz reseptör antagonizması"},{"en":"Selective α1-receptor blockade","tr":"Seçici α1-reseptör blokajı"},{"en":"Pure antagonism with zero efficacy","tr":"İntrinsik etkinliği sıfır olan saf antagonizma"},{"en":"Membrane-stabilising sodium-channel blockade","tr":"Membran stabilize edici sodyum kanalı blokajı"},{"en":"Intrinsic sympathomimetic activity due to partial agonism","tr":"Parsiyel agonizmaya bağlı intrinsik sempatomimetik aktivite"}],"answer":4,"explanation":{"en":"A partial agonist can activate the receptor but has lower intrinsic efficacy than a full agonist. It can therefore produce a small response alone while reducing a full agonist’s response through receptor competition; a pure antagonist has no agonist efficacy.","tr":"Parsiyel bir agonist reseptörü aktive edebilir ancak intrinsik etkinliği tam agonistinkinden düşüktür. Bu nedenle tek başına küçük bir yanıt oluşturabilirken reseptör için yarışarak tam agonistin yanıtını azaltır; saf bir antagonistin agonist etkinliği yoktur."},"sourcePages":[210,211],"difficulty":"applied","sourcePdfPages":[222,223]},{"id":"c14q4","stem":{"en":"Which process primarily accounts for esmolol’s rapid elimination?","tr":"Esmololün hızlı eliminasyonundan başlıca hangi süreç sorumludur?"},"options":[{"en":"Oxidation by hepatic CYP2D6","tr":"Hepatik CYP2D6 ile oksidasyon"},{"en":"Hydrolysis by esterases in red blood cell cytosol","tr":"Eritrosit sitozolündeki esterazlarla hidroliz"},{"en":"Hydrolysis by plasma cholinesterase","tr":"Plazma kolinesterazıyla hidroliz"},{"en":"Renal filtration of unchanged drug as the dominant pathway","tr":"Başlıca yol olarak değişmemiş ilacın renal filtrasyonu"},{"en":"Conjugation followed by biliary excretion","tr":"Konjugasyonun ardından safra yoluyla atılım"}],"answer":1,"explanation":{"en":"Esmolol’s ester linkage is rapidly hydrolysed mainly by cytosolic esterases in red blood cells, explaining its brief elimination half-life. These enzymes are distinct from plasma cholinesterase, so the two hydrolytic pathways should not be confused.","tr":"Esmololün ester bağı, esas olarak eritrositlerin sitozolündeki esterazlarla hızla hidrolize edilir; bu durum kısa eliminasyon yarı ömrünü açıklar. Bu enzimler plazma kolinesterazından farklıdır; dolayısıyla bu iki hidroliz yolu birbirine karıştırılmamalıdır."},"sourcePages":[214],"difficulty":"core","sourcePdfPages":[226]},{"id":"c14q5","stem":{"en":"Labetalol reduces peripheral vascular resistance while attenuating the reflex increase in heart rate. Which receptor-blocking profile best explains this combination?","tr":"Labetalol, periferik damar direncini azaltırken kalp hızındaki refleks artışı sınırlar. Bu etki bileşimini en iyi hangi reseptör blokajı profili açıklar?"},"options":[{"en":"Selective α2 blockade alone","tr":"Tek başına seçici α2 blokajı"},{"en":"Selective β1 blockade alone","tr":"Tek başına seçici β1 blokajı"},{"en":"Non-selective α blockade without β blockade","tr":"β blokajı olmaksızın seçici olmayan α blokajı"},{"en":"Selective α1 blockade plus non-selective β blockade","tr":"Seçici α1 blokajı ve seçici olmayan β blokajı"},{"en":"Selective β2 blockade plus α1 stimulation","tr":"Seçici β2 blokajı ve α1 uyarılması"}],"answer":3,"explanation":{"en":"Labetalol combines α1 antagonism, which relaxes resistance vessels, with β1 and β2 antagonism. Its β-blocking component limits reflex tachycardia; β1 blockade alone would not explain the additional direct vasodilation caused by α1 antagonism.","tr":"Labetalol, direnç damarlarını gevşeten α1 antagonizmasını β1 ve β2 antagonizmasıyla birleştirir. β-bloker etkisi refleks taşikardiyi sınırlar; tek başına β1 blokajı, α1 blokajına bağlı ek doğrudan vazodilatasyonu açıklamaz."},"sourcePages":[215,216],"difficulty":"applied","sourcePdfPages":[227,228]}]},{"id":15,"title":{"en":"Anti-Arrhythmics","tr":"Antiaritmikler"},"startPage":217,"endPage":232,"pdfStartPage":229,"pdfEndPage":244,"section":3,"questions":[{"id":"c15q1","stem":{"en":"In the Vaughan–Williams classification, sodium-channel blockade accompanied by shortening of the ventricular action potential is characteristic of which class?","tr":"Vaughan–Williams sınıflamasında ventrikül aksiyon potansiyelinin kısalmasıyla birlikte görülen sodyum kanalı blokajı hangi sınıfın tipik özelliğidir?"},"options":[{"en":"Class Ia","tr":"Sınıf Ia"},{"en":"Class Ib","tr":"Sınıf Ib"},{"en":"Class Ic","tr":"Sınıf Ic"},{"en":"Class III","tr":"Sınıf III"},{"en":"Class IV","tr":"Sınıf IV"}],"answer":1,"explanation":{"en":"Class Ib drugs, exemplified by lidocaine, block sodium channels and characteristically shorten action-potential duration in ventricular conducting tissue. Class Ia agents also block sodium channels but characteristically prolong repolarisation rather than shorten it.","tr":"Lidokainin örnek olduğu sınıf Ib ilaçlar sodyum kanallarını bloke eder ve ventriküler ileti dokusunda aksiyon potansiyeli süresini tipik olarak kısaltır. Sınıf Ia ajanlar da sodyum kanallarını bloke eder ancak repolarizasyonu kısaltmak yerine tipik olarak uzatır."},"sourcePages":[219,225],"difficulty":"core","sourcePdfPages":[231,237]},{"id":"c15q2","stem":{"en":"Which molecular target is directly inhibited by digoxin to initiate its positive inotropic effect?","tr":"Digoksin, pozitif inotropik etkisini başlatmak için hangi moleküler hedefi doğrudan inhibe eder?"},"options":[{"en":"L-type calcium channels","tr":"L-tipi kalsiyum kanalları"},{"en":"The cardiac β1-adrenoceptor","tr":"Kardiyak β1-adrenoseptör"},{"en":"Phosphodiesterase type 3","tr":"Fosfodiesteraz tip 3"},{"en":"Membrane Na+/K+-ATPase","tr":"Membrandaki Na+/K+-ATPaz"},{"en":"The sinoatrial HCN channel","tr":"Sinoatriyal HCN kanalı"}],"answer":3,"explanation":{"en":"Digoxin inhibits Na+/K+-ATPase, increasing intracellular sodium and subsequently the calcium available for contraction. This differs from phosphodiesterase-3 inhibition, which increases contractility through a cAMP-dependent pathway rather than by directly inhibiting the sodium pump.","tr":"Digoksin Na+/K+-ATPazı inhibe ederek hücre içi sodyumu ve ardından kasılma için kullanılabilir kalsiyumu artırır. Bu etki, sodyum pompasını doğrudan inhibe etmek yerine cAMP’ye bağımlı bir yol üzerinden kasılma gücünü artıran fosfodiesteraz-3 inhibisyonundan farklıdır."},"sourcePages":[220],"difficulty":"core","sourcePdfPages":[232]},{"id":"c15q3","stem":{"en":"In a pharmacology experiment, dipyridamole enhances the response to adenosine. Which mechanism best explains this interaction?","tr":"Bir farmakoloji deneyinde dipiridamol, adenozine verilen yanıtı güçlendirmektedir. Bu etkileşimi en iyi hangi mekanizma açıklar?"},"options":[{"en":"Inhibition of adenosine uptake into cells","tr":"Adenozinin hücre içine alımının inhibisyonu"},{"en":"Competitive antagonism of adenosine receptors","tr":"Adenozin reseptörlerinin kompetitif antagonizması"},{"en":"Acceleration of adenosine deamination","tr":"Adenozin deaminasyonunun hızlanması"},{"en":"Irreversible inhibition of cardiac Na+/K+-ATPase","tr":"Kardiyak Na+/K+-ATPazın geri dönüşümsüz inhibisyonu"},{"en":"Increased renal elimination of adenosine","tr":"Adenozinin böbreklerden atılımının artması"}],"answer":0,"explanation":{"en":"Dipyridamole inhibits cellular uptake of adenosine, leaving more extracellular adenosine available to act at its receptors. Competitive receptor antagonism would have the opposite effect and is characteristic of methylxanthines such as theophylline.","tr":"Dipiridamol adenozinin hücre içine alımını inhibe ederek reseptörleri üzerinde etki gösterebilecek hücre dışı adenozin miktarını artırır. Kompetitif reseptör antagonizması ise ters etki yapar ve teofilin gibi metilksantinlerin özelliğidir."},"sourcePages":[222],"difficulty":"applied","sourcePdfPages":[234]},{"id":"c15q4","stem":{"en":"Why can amiodarone remain in the body for a long period after repeated administration has ended?","tr":"Tekrarlanan uygulamalar sona erdikten sonra amiodaron neden vücutta uzun süre kalabilir?"},"options":[{"en":"Predominant confinement to extracellular fluid","tr":"Ağırlıklı olarak hücre dışı sıvıyla sınırlı kalma"},{"en":"Irreversible binding to cardiac ion channels","tr":"Kardiyak iyon kanallarına geri dönüşümsüz bağlanma"},{"en":"Rapid hydrolysis by red blood cell esterases","tr":"Eritrosit esterazlarıyla hızlı hidroliz"},{"en":"High renal clearance of unchanged parent drug","tr":"Değişmemiş ana ilacın yüksek renal klirensi"},{"en":"It accumulates extensively in tissues and leaves some tissue compartments slowly","tr":"Dokularda yaygın olarak biriktiği ve bazı doku kompartımanlarından yavaş ayrıldığı için"}],"answer":4,"explanation":{"en":"Amiodarone has extensive tissue distribution, including accumulation in fat, and a prolonged terminal elimination phase. The persistence is pharmacokinetic and does not require irreversible ion-channel binding; restriction to extracellular fluid would not explain its large tissue reservoir.","tr":"Amiodaron yağ dokusunda birikim de içeren geniş bir doku dağılımına ve uzun bir terminal eliminasyon fazına sahiptir. Bu kalıcılık farmakokinetiktir ve iyon kanallarına geri dönüşümsüz bağlanmayı gerektirmez; ilacın hücre dışı sıvıyla sınırlı kalması büyük doku deposunu açıklamaz."},"sourcePages":[227],"difficulty":"applied","sourcePdfPages":[239]},{"id":"c15q5","stem":{"en":"Ivabradine slows spontaneous phase-4 depolarisation in the sinoatrial node without directly reducing myocardial contractility. Which target accounts for this selective effect?","tr":"İvabradin, miyokardın kasılma gücünü doğrudan azaltmadan sinoatriyal düğümde spontan faz-4 depolarizasyonunu yavaşlatır. Bu seçici etkiden hangi hedef sorumludur?"},"options":[{"en":"Fast voltage-gated sodium channels","tr":"Hızlı voltaja bağımlı sodyum kanalları"},{"en":"The Na+/K+-ATPase pump","tr":"Na+/K+-ATPaz pompası"},{"en":"HCN channels carrying the If pacemaker current","tr":"If pacemaker akımını taşıyan HCN kanalları"},{"en":"Vascular α1-adrenoceptors","tr":"Vasküler α1-adrenoseptörler"},{"en":"Myocardial L-type calcium channels","tr":"Miyokardın L-tipi kalsiyum kanalları"}],"answer":2,"explanation":{"en":"Ivabradine inhibits the hyperpolarisation-activated HCN channels that carry the If current and contribute to spontaneous pacemaker depolarisation. This differs from L-type calcium-channel blockade, which can slow nodal activity but also directly depress myocardial contraction.","tr":"İvabradin, If akımını taşıyan ve spontan pacemaker depolarizasyonuna katkıda bulunan, hiperpolarizasyonla aktive olan HCN kanallarını inhibe eder. Bu etki, düğüm aktivitesini yavaşlatabilen ancak miyokard kasılmasını da doğrudan baskılayabilen L-tipi kalsiyum kanalı blokajından farklıdır."},"sourcePages":[222,232],"difficulty":"applied","sourcePdfPages":[234,244]}]},{"id":16,"title":{"en":"Vasodilators","tr":"Vazodilatörler"},"startPage":233,"endPage":244,"pdfStartPage":245,"pdfEndPage":256,"section":3,"questions":[{"id":"c16q1","stem":{"en":"Which intracellular signalling sequence best describes sodium nitroprusside-induced relaxation of vascular smooth muscle?","tr":"Sodyum nitroprussidin damar düz kasını gevşetmesini en iyi hangi hücre içi sinyal dizisi açıklar?"},"options":[{"en":"β2 activation → adenylyl cyclase activation → increased cAMP","tr":"β2 aktivasyonu → adenilat siklaz aktivasyonu → cAMP artışı"},{"en":"ACE inhibition → reduced angiotensin II → reduced vasoconstriction","tr":"ACE inhibisyonu → anjiyotensin II azalması → vazokonstriksiyon azalması"},{"en":"PDE5 inhibition → reduced cGMP breakdown → increased cGMP","tr":"PDE5 inhibisyonu → cGMP yıkımının azalması → cGMP artışı"},{"en":"Na+/K+-ATPase inhibition → increased intracellular calcium","tr":"Na+/K+-ATPaz inhibisyonu → hücre içi kalsiyum artışı"},{"en":"Nitric oxide release → guanylate cyclase activation → increased cGMP","tr":"Nitrik oksit salınımı → guanilat siklaz aktivasyonu → cGMP artışı"}],"answer":4,"explanation":{"en":"Nitroprusside generates nitric oxide, which activates guanylate cyclase and raises cGMP in vascular smooth muscle. PDE5 inhibition can also raise cGMP, but by reducing its breakdown; nitroprusside instead promotes its formation through nitric oxide signalling.","tr":"Nitroprussid nitrik oksit oluşturur; nitrik oksit damar düz kasında guanilat siklazı aktive ederek cGMP’yi artırır. PDE5 inhibisyonu da cGMP’yi artırabilir ancak bunu yıkımı azaltarak yapar; nitroprussid ise nitrik oksit sinyali aracılığıyla cGMP oluşumunu artırır."},"sourcePages":[233],"difficulty":"core","sourcePdfPages":[245]},{"id":"c16q2","stem":{"en":"Glyceryl trinitrate is readily absorbed from the gut, yet little unchanged drug reaches the systemic circulation after swallowing. Which process best explains this?","tr":"Gliseril trinitrat bağırsaktan kolayca emildiği hâlde yutulduktan sonra sistemik dolaşıma çok az değişmemiş ilaç ulaşır. Bu durumu en iyi hangi süreç açıklar?"},"options":[{"en":"Poor intestinal membrane permeability","tr":"Bağırsak zarının ilaca geçirgenliğinin düşük olması"},{"en":"Renal conversion to inactive metabolites before systemic entry","tr":"Sistemik dolaşıma girişten önce böbrekte inaktif metabolitlere dönüşme"},{"en":"Extensive first-pass metabolism","tr":"Yoğun ilk geçiş metabolizması"},{"en":"High plasma protein binding that prevents absorption","tr":"Emilimi önleyen yüksek plazma protein bağlanması"},{"en":"A requirement for bacterial activation in the colon","tr":"Kolonda bakteriyel aktivasyon gerektirmesi"}],"answer":2,"explanation":{"en":"Extensive presystemic metabolism markedly reduces the systemic availability of swallowed glyceryl trinitrate despite good gastrointestinal absorption. Sublingual absorption largely avoids the initial hepatic first pass, so poor absorption across the gut wall is not the principal explanation.","tr":"Yoğun presistemik metabolizma, gastrointestinal emilimi iyi olsa da yutulan gliseril trinitratın sistemik biyoyararlanımını belirgin olarak azaltır. Dil altından emilim ilk hepatik geçişi büyük ölçüde önlediğinden temel açıklama bağırsak duvarından emilimin yetersiz olması değildir."},"sourcePages":[236],"difficulty":"applied","sourcePdfPages":[248]},{"id":"c16q3","stem":{"en":"Which pair of mechanisms accounts for nicorandil’s vasodilator action?","tr":"Nikorandilin vazodilatör etkisinden hangi iki mekanizma sorumludur?"},"options":[{"en":"β1 blockade and inhibition of renin synthesis","tr":"β1 blokajı ve renin sentezinin inhibisyonu"},{"en":"ATP-sensitive potassium-channel opening and nitrate-mediated cGMP signalling","tr":"ATP’ye duyarlı potasyum kanallarının açılması ve nitrat aracılı cGMP sinyali"},{"en":"Fast sodium-channel blockade and muscarinic antagonism","tr":"Hızlı sodyum kanalı blokajı ve muskarinik antagonizma"},{"en":"AT1 blockade and ACE inhibition","tr":"AT1 blokajı ve ACE inhibisyonu"},{"en":"Potassium-channel closure and increased calcium entry","tr":"Potasyum kanallarının kapanması ve kalsiyum girişinin artması"}],"answer":1,"explanation":{"en":"Nicorandil opens ATP-sensitive potassium channels, promoting membrane hyperpolarisation, and also increases cGMP through its nitrate component. Potassium-channel closure would favour depolarisation rather than the hyperpolarisation underlying this part of its vasodilator action.","tr":"Nikorandil ATP’ye duyarlı potasyum kanallarını açarak membran hiperpolarizasyonunu destekler ve nitrat bileşeni aracılığıyla cGMP’yi de artırır. Potasyum kanallarının kapanması ise vazodilatör etkinin bu bölümünü sağlayan hiperpolarizasyon yerine depolarizasyonu destekler."},"sourcePages":[237],"difficulty":"core","sourcePdfPages":[249]},{"id":"c16q4","stem":{"en":"Compared with verapamil, which pattern is most characteristic of nifedipine’s cardiovascular action in humans?","tr":"Verapamille karşılaştırıldığında nifedipinin insanlardaki kardiyovasküler etkisini en iyi hangi özellik tanımlar?"},"options":[{"en":"More pronounced direct slowing of AV nodal conduction","tr":"AV düğüm iletimini doğrudan daha belirgin yavaşlatması"},{"en":"Selective inhibition of the sinoatrial If current","tr":"Sinoatriyal If akımını seçici olarak inhibe etmesi"},{"en":"Predominant β1-adrenoceptor antagonism","tr":"Ağırlıklı olarak β1-adrenoseptör antagonizması oluşturması"},{"en":"Greater peripheral arterial vasodilation with less direct AV nodal slowing","tr":"AV düğümü doğrudan daha az yavaşlatırken daha güçlü periferik arteriyel vazodilatasyon oluşturması"},{"en":"Predominant constriction of resistance arterioles","tr":"Ağırlıklı olarak direnç arteriyollerini daraltması"}],"answer":3,"explanation":{"en":"Nifedipine has greater functional selectivity for arterial vascular smooth muscle, whereas verapamil has more prominent direct cardiac and AV nodal effects. Both block L-type calcium channels, so different tissue effects do not imply different primary channel classes.","tr":"Nifedipin arteriyel damar düz kasına daha yüksek işlevsel seçicilik gösterirken verapamilin doğrudan kardiyak ve AV düğüm etkileri daha belirgindir. Her ikisi de L-tipi kalsiyum kanallarını bloke eder; dolayısıyla farklı doku etkileri, temel hedeflerinin farklı kanal sınıfları olduğu anlamına gelmez."},"sourcePages":[238,239],"difficulty":"applied","sourcePdfPages":[250,251]},{"id":"c16q5","stem":{"en":"Sildenafil enhances an existing nitric oxide–cGMP signal in smooth muscle. Which biochemical action is responsible?","tr":"Sildenafil, düz kasta mevcut nitrik oksit–cGMP sinyalini güçlendirir. Bundan hangi biyokimyasal etki sorumludur?"},"options":[{"en":"Inhibition of PDE5-mediated cGMP breakdown","tr":"PDE5 aracılı cGMP yıkımının inhibisyonu"},{"en":"Direct release of nitric oxide from sildenafil","tr":"Sildenafilden doğrudan nitrik oksit salınımı"},{"en":"Inhibition of guanylate cyclase","tr":"Guanilat siklazın inhibisyonu"},{"en":"Activation of cGMP breakdown by PDE5","tr":"PDE5 aracılığıyla cGMP yıkımının artırılması"},{"en":"Competitive blockade of endothelin receptors","tr":"Endotelin reseptörlerinin kompetitif blokajı"}],"answer":0,"explanation":{"en":"Sildenafil inhibits phosphodiesterase type 5, slowing cGMP degradation and thereby enhancing the effect of an existing nitric oxide signal. It is not itself a nitric oxide donor, unlike drugs whose vasodilator action begins with nitric oxide generation.","tr":"Sildenafil fosfodiesteraz tip 5’i inhibe ederek cGMP yıkımını yavaşlatır ve böylece mevcut nitrik oksit sinyalinin etkisini güçlendirir. Vazodilatör etkisi nitrik oksit oluşumuyla başlayan ilaçların aksine kendisi bir nitrik oksit vericisi değildir."},"sourcePages":[233,243],"difficulty":"applied","sourcePdfPages":[245,255]}]},{"id":17,"title":{"en":"Antihypertensives","tr":"Antihipertansifler"},"startPage":245,"endPage":252,"pdfStartPage":257,"pdfEndPage":264,"section":3,"questions":[{"id":"c17q1","stem":{"en":"Which receptor mediates the direct stimulation of renin release by renal sympathetic nerves?","tr":"Böbreğin sempatik sinirlerinin renin salınımını doğrudan uyarmasına hangi reseptör aracılık eder?"},"options":[{"en":"Muscarinic M2 receptors","tr":"Muskarinik M2 reseptörleri"},{"en":"Histamine H1 receptors","tr":"Histamin H1 reseptörleri"},{"en":"Angiotensin AT2 receptors","tr":"Anjiyotensin AT2 reseptörleri"},{"en":"β1-adrenoceptors on juxtaglomerular cells","tr":"Jukstaglomerüler hücrelerdeki β1-adrenoseptörler"},{"en":"Nicotinic receptors on the macula densa","tr":"Makula densadaki nikotinik reseptörler"}],"answer":3,"explanation":{"en":"Sympathetic stimulation increases renin secretion by activating β1-adrenoceptors on juxtaglomerular cells. Reduced sodium delivery sensed at the macula densa is a separate stimulus for renin release, rather than a nicotinic receptor-mediated mechanism.","tr":"Sempatik uyarılma, jukstaglomerüler hücrelerdeki β1-adrenoseptörleri aktive ederek renin salgısını artırır. Makula densada algılanan azalmış sodyum sunumu, nikotinik reseptör aracılı bir mekanizma değil, renin salınımı için ayrı bir uyarandır."},"sourcePages":[245],"difficulty":"core","sourcePdfPages":[257]},{"id":"c17q2","stem":{"en":"Why is a persistent dry cough less common with losartan than with an ACE inhibitor?","tr":"Kalıcı kuru öksürük neden losartanla ACE inhibitörlerine göre daha az görülür?"},"options":[{"en":"Losartan prevents bradykinin synthesis in the lungs","tr":"Losartan akciğerlerde bradikinin sentezini önlediği için"},{"en":"Losartan does not inhibit ACE-mediated bradykinin breakdown","tr":"Losartan, ACE aracılı bradikinin yıkımını inhibe etmediği için"},{"en":"Losartan activates airway β2-adrenoceptors","tr":"Losartan hava yollarındaki β2-adrenoseptörleri aktive ettiği için"},{"en":"Losartan blocks all sensory nerves in the respiratory tract","tr":"Losartan solunum yolundaki tüm duyusal sinirleri bloke ettiği için"},{"en":"Losartan completely prevents histamine release","tr":"Losartan histamin salınımını tamamen önlediği için"}],"answer":1,"explanation":{"en":"ACE also breaks down bradykinin, so ACE inhibition can increase bradykinin and contribute to cough. Losartan blocks AT1 receptors without inhibiting this enzyme; it does not need to prevent bradykinin synthesis, and the lower cough frequency does not mean cough is impossible.","tr":"ACE bradikinini de yıkar; bu nedenle ACE inhibisyonu bradikinini artırarak öksürüğe katkıda bulunabilir. Losartan bu enzimi inhibe etmeden AT1 reseptörlerini bloke eder; bradikinin sentezini önlemesi gerekmez ve öksürük sıklığının daha düşük olması öksürüğün hiç oluşamayacağı anlamına gelmez."},"sourcePages":[245,247,248,249],"difficulty":"applied","sourcePdfPages":[257,259,260,261]},{"id":"c17q3","stem":{"en":"Which ACE inhibitor is already active when administered, undergoes no significant metabolism, and is excreted unchanged in urine?","tr":"Hangi ACE inhibitörü uygulandığında zaten aktiftir, anlamlı ölçüde metabolize olmaz ve idrarla değişmeden atılır?"},"options":[{"en":"Ramipril","tr":"Ramipril"},{"en":"Enalapril","tr":"Enalapril"},{"en":"Captopril","tr":"Kaptopril"},{"en":"Losartan","tr":"Losartan"},{"en":"Lisinopril","tr":"Lizinopril"}],"answer":4,"explanation":{"en":"Lisinopril is an active ACE inhibitor that is eliminated unchanged in urine without metabolic activation. Ramipril and enalapril are prodrugs, while captopril is active but undergoes metabolism; losartan is an AT1 antagonist rather than an ACE inhibitor.","tr":"Lizinopril, metabolik aktivasyon gerektirmeden idrarla değişmeden atılan aktif bir ACE inhibitörüdür. Ramipril ve enalapril ön ilaçtır; kaptopril aktif olmakla birlikte metabolize olur, losartan ise ACE inhibitörü değil AT1 antagonistidir."},"sourcePages":[246,247,248],"difficulty":"core","sourcePdfPages":[258,259,260]},{"id":"c17q4","stem":{"en":"In an adrenergic nerve preparation, a drug blocks neuronal uptake 1 before guanethidine is added. Why would guanethidine’s neuronal blocking action be reduced?","tr":"Bir adrenerjik sinir preparatında guanetidin eklenmeden önce başka bir ilaç nöronal geri alım-1’i bloke etmektedir. Guanetidinin nöronal blokaj etkisi neden azalır?"},"options":[{"en":"Guanethidine requires uptake 1 to enter the nerve terminal","tr":"Guanetidinin sinir ucuna girebilmesi için geri alım-1 gereklidir"},{"en":"Uptake 1 converts guanethidine to its active metabolite","tr":"Geri alım-1 guanetidini aktif metabolitine dönüştürür"},{"en":"Blocking uptake 1 accelerates guanethidine’s hepatic clearance","tr":"Geri alım-1’in blokajı guanetidinin hepatik klirensini hızlandırır"},{"en":"Uptake 1 is the postsynaptic receptor blocked by guanethidine","tr":"Geri alım-1 guanetidinin bloke ettiği postsinaptik reseptördür"},{"en":"Blocking uptake 1 prevents guanethidine from binding plasma proteins","tr":"Geri alım-1’in blokajı guanetidinin plazma proteinlerine bağlanmasını önler"}],"answer":0,"explanation":{"en":"Guanethidine must be transported into adrenergic nerve terminals by uptake 1 before it can disrupt noradrenaline storage and release. Blocking that transporter limits access to its neuronal site of action; uptake 1 is a transport pathway, not a postsynaptic receptor or a metabolic enzyme.","tr":"Guanetidin, noradrenalinin depolanmasını ve salınımını bozabilmek için önce geri alım-1 aracılığıyla adrenerjik sinir uçlarına taşınmalıdır. Bu taşıyıcının blokajı ilacın nöronal etki yerine erişimini sınırlar; geri alım-1 bir taşıma yoludur, postsinaptik reseptör veya metabolik enzim değildir."},"sourcePages":[249,250],"difficulty":"applied","sourcePdfPages":[261,262]},{"id":"c17q5","stem":{"en":"How can clonidine lower sympathetic activity despite being an adrenoceptor agonist?","tr":"Klonidin bir adrenoseptör agonisti olduğu hâlde sempatik aktiviteyi nasıl azaltabilir?"},"options":[{"en":"It activates cardiac β1-receptors and thereby inhibits all sympathetic nerves","tr":"Kardiyak β1-reseptörleri aktive ederek tüm sempatik sinirleri inhibe eder"},{"en":"It irreversibly blocks peripheral α1-receptors","tr":"Periferik α1-reseptörleri geri dönüşümsüz bloke eder"},{"en":"It activates inhibitory central α2-receptor pathways that reduce sympathetic outflow","tr":"Sempatik çıkışı azaltan inhibitör merkezi α2-reseptör yollarını aktive eder"},{"en":"It directly inhibits ACE in the pulmonary circulation","tr":"Pulmoner dolaşımda ACE’yi doğrudan inhibe eder"},{"en":"It prevents noradrenaline synthesis by blocking tyrosine hydroxylase","tr":"Tirozin hidroksilazı bloke ederek noradrenalin sentezini önler"}],"answer":2,"explanation":{"en":"Clonidine stimulates central α2-adrenoceptor pathways that inhibit sympathetic outflow, illustrating how receptor location and signalling determine the overall response. This differs from peripheral α1 antagonism and from tyrosine hydroxylase inhibition, the latter being the mechanism of metirosine.","tr":"Klonidin, sempatik çıkışı inhibe eden merkezi α2-adrenoseptör yollarını uyarır; bu, reseptörün yerinin ve sinyal mekanizmasının toplam yanıtı nasıl belirlediğini gösterir. Bu etki periferik α1 antagonizmasından ve metirozinin mekanizması olan tirozin hidroksilaz inhibisyonundan farklıdır."},"sourcePages":[250,251],"difficulty":"applied","sourcePdfPages":[262,263]}]},{"id":18,"title":{"en":"Central Nervous System","tr":"Merkezi Sinir Sistemi"},"startPage":253,"endPage":265,"pdfStartPage":265,"pdfEndPage":277,"section":4,"questions":[{"id":"c18q1","stem":{"en":"Which receptor property distinguishes GABA-A from GABA-B signalling?","tr":"GABA-A sinyal iletimini GABA-B sinyal iletiminden ayıran reseptör özelliği hangisidir?"},"options":[{"en":"GABA-A is G-protein coupled; GABA-B is a ligand-gated chloride channel","tr":"GABA-A G proteinine kenetlidir; GABA-B ligand kapılı bir klorür kanalıdır"},{"en":"Both receptors are ligand-gated sodium channels","tr":"Her iki reseptör de ligand kapılı sodyum kanalıdır"},{"en":"GABA-A is a ligand-gated chloride channel; GABA-B is G-protein coupled","tr":"GABA-A ligand kapılı bir klorür kanalıdır; GABA-B G proteinine kenetlidir"},{"en":"Both receptors are nuclear transcription factors","tr":"Her iki reseptör de nükleer transkripsiyon faktörüdür"},{"en":"GABA-A is a receptor tyrosine kinase; GABA-B is an ATPase","tr":"GABA-A bir reseptör tirozin kinazdır; GABA-B bir ATPazdır"}],"answer":2,"explanation":{"en":"GABA-A directly controls a chloride channel, whereas GABA-B produces inhibitory effects through G proteins and downstream ion-channel modulation. Benzodiazepines enhance GABA-A signalling; baclofen acts at GABA-B, so these drugs do not share the same receptor target.","tr":"GABA-A doğrudan bir klorür kanalını kontrol ederken GABA-B, G proteinleri ve bunların düzenlediği iyon kanalları aracılığıyla inhibitör etki oluşturur. Benzodiazepinler GABA-A sinyalini güçlendirir; baklofen ise GABA-B üzerinde etki gösterir, dolayısıyla bu ilaçların reseptör hedefleri aynı değildir."},"sourcePages":[253],"difficulty":"core","sourcePdfPages":[265]},{"id":"c18q2","stem":{"en":"Midazolam moves from an acidic solution into blood at physiological pH. Which change best explains its ability to enter the brain rapidly?","tr":"Midazolam asidik bir çözeltiden fizyolojik pH değerindeki kana geçer. Beyne hızla girebilmesini en iyi açıklayan değişiklik hangisidir?"},"options":[{"en":"Ring closure produces a more lipid-soluble form","tr":"Halkanın kapanması yağda daha iyi çözünen bir form oluşturur"},{"en":"Metabolic hydroxylation is required before any brain entry","tr":"Beyne herhangi bir geçişten önce metabolik hidroksilasyon gerekir"},{"en":"It becomes more ionised and less lipid soluble","tr":"Daha fazla iyonize olur ve lipid çözünürlüğü azalır"},{"en":"A permanent quaternary ammonium charge develops","tr":"Kalıcı bir kuaterner amonyum yükü oluşur"},{"en":"Binding to albumin actively carries it across the blood–brain barrier","tr":"Albümine bağlanma ilacı kan-beyin bariyerinden aktif olarak taşır"}],"answer":0,"explanation":{"en":"Midazolam has a pH-dependent structure: the closed-ring form is favoured at physiological pH and is sufficiently lipophilic for rapid membrane passage. This is a physicochemical change in the parent drug, rather than a requirement for metabolic activation.","tr":"Midazolamın yapısı pH değerine bağlıdır: fizyolojik pH değerinde kapalı halkalı form baskındır ve zarlardan hızla geçebilecek kadar lipofiliktir. Bu durum metabolik aktivasyon gereksinimini değil, ana ilacın fizikokimyasal değişimini yansıtır."},"sourcePages":[254],"difficulty":"applied","sourcePdfPages":[266]},{"id":"c18q3","stem":{"en":"Which action most directly accounts for the central sympatholytic sedation produced by dexmedetomidine?","tr":"Deksmedetomidinin oluşturduğu santral sempatolitik sedasyonu en doğrudan açıklayan etki hangisidir?"},"options":[{"en":"Beta-1 adrenoceptor activation in the sinoatrial node","tr":"Sinoatriyal düğümde beta-1 adrenoseptör aktivasyonu"},{"en":"Irreversible inhibition of monoamine oxidase","tr":"Monoamin oksidazın geri dönüşümsüz inhibisyonu"},{"en":"Competitive antagonism at the benzodiazepine binding site","tr":"Benzodiazepin bağlanma bölgesinde kompetitif antagonizma"},{"en":"Blockade of peripheral nicotinic receptors at the neuromuscular junction","tr":"Nöromüsküler kavşaktaki periferik nikotinik reseptörlerin blokajı"},{"en":"Alpha-2 adrenoceptor activation with reduced noradrenergic activity in the locus coeruleus","tr":"Lokus seruleusta noradrenerjik aktiviteyi azaltan alfa-2 adrenoseptör aktivasyonu"}],"answer":4,"explanation":{"en":"Dexmedetomidine activates alpha-2 adrenoceptors and reduces noradrenergic firing in the locus coeruleus, a brainstem nucleus involved in arousal. Unlike a benzodiazepine-site drug, its principal sedative target is adrenergic rather than GABA-A.","tr":"Deksmedetomidin alfa-2 adrenoseptörlerini aktive eder ve uyanıklıkla ilişkili bir beyin sapı çekirdeği olan lokus seruleustaki noradrenerjik ateşlemeyi azaltır. Benzodiazepin bağlanma bölgesine etki eden ilaçlardan farklı olarak başlıca sedatif hedefi GABA-A değil adrenerjik sistemdir."},"sourcePages":[257],"difficulty":"core","sourcePdfPages":[269]},{"id":"c18q4","stem":{"en":"An experiment shows that amitriptyline raises synaptic noradrenaline and serotonin without directly stimulating their receptors. Which mechanism explains this result?","tr":"Bir deneyde amitriptilinin, reseptörlerini doğrudan uyarmadan sinaptik noradrenalin ve serotonin düzeylerini artırdığı görülür. Bu sonucu hangi mekanizma açıklar?"},"options":[{"en":"Acceleration of monoamine degradation within nerve terminals","tr":"Sinir uçlarında monoamin yıkımının hızlandırılması"},{"en":"Inhibition of neuronal reuptake of both transmitters","tr":"Her iki nörotransmiterin nöronal geri alımının inhibisyonu"},{"en":"Selective blockade of serotonin synthesis","tr":"Serotonin sentezinin seçici olarak bloke edilmesi"},{"en":"Activation of presynaptic inhibitory alpha-2 receptors","tr":"Presinaptik inhibitör alfa-2 reseptörlerinin aktivasyonu"},{"en":"Irreversible antagonism of postsynaptic dopamine D2 receptors","tr":"Postsinaptik dopamin D2 reseptörlerinin geri dönüşümsüz antagonizması"}],"answer":1,"explanation":{"en":"Amitriptyline reduces neuronal reuptake of noradrenaline and serotonin, increasing their availability in the synapse. This differs from monoamine oxidase inhibition, which reduces enzymatic breakdown rather than blocking reuptake transporters.","tr":"Amitriptilin noradrenalin ve serotoninin nöronal geri alımını azaltarak sinapstaki kullanılabilirliklerini artırır. Bu etki, geri alım taşıyıcılarını bloke etmek yerine enzimatik yıkımı azaltan monoamin oksidaz inhibisyonundan farklıdır."},"sourcePages":[258],"difficulty":"applied","sourcePdfPages":[270]},{"id":"c18q5","stem":{"en":"As the enzymes that metabolise phenytoin approach saturation, a small increase in drug input can cause a disproportionate concentration rise. What explains this?","tr":"Fenitoini metabolize eden enzimler doygunluğa yaklaştığında, ilaç girişindeki küçük bir artış konsantrasyonda orantısız yükselmeye yol açabilir. Bunu ne açıklar?"},"options":[{"en":"An abrupt switch to complete pulmonary elimination","tr":"Birdenbire tamamen pulmoner eliminasyona geçilmesi"},{"en":"Increasing renal clearance in direct proportion to concentration","tr":"Renal klirensin konsantrasyonla doğru orantılı artması"},{"en":"Complete loss of oral absorption at high concentrations","tr":"Yüksek konsantrasyonlarda oral emilimin tamamen kaybolması"},{"en":"Saturation of hepatic metabolism, producing nonlinear elimination","tr":"Hepatik metabolizmanın doygunluğa ulaşarak doğrusal olmayan eliminasyon oluşturması"},{"en":"An increase in metabolic capacity equal to every increase in input","tr":"Metabolik kapasitenin her giriş artışı kadar yükselmesi"}],"answer":3,"explanation":{"en":"Phenytoin undergoes capacity-limited hepatic metabolism, so its elimination becomes nonlinear as the enzymes approach saturation. Assuming a constant half-life and a proportional dose–concentration relationship would therefore be misleading in this range.","tr":"Fenitoin kapasitesi sınırlı hepatik metabolizmaya uğrar; bu nedenle enzimler doygunluğa yaklaştıkça eliminasyonu doğrusal olmaktan çıkar. Bu aralıkta yarı ömrün sabit olduğunu ve doz ile konsantrasyonun orantılı değiştiğini varsaymak yanıltıcıdır."},"sourcePages":[263],"difficulty":"applied","sourcePdfPages":[275]}]},{"id":19,"title":{"en":"Antiemetics and Related Drugs","tr":"Antiemetikler ve İlişkili İlaçlar"},"startPage":266,"endPage":274,"pdfStartPage":278,"pdfEndPage":286,"section":4,"questions":[{"id":"c19q1","stem":{"en":"Why can the chemoreceptor trigger zone detect circulating emetic substances relatively readily?","tr":"Kemoreseptör tetik bölge, dolaşımdaki kusmayı tetikleyen maddeleri neden görece kolay algılayabilir?"},"options":[{"en":"It is located within the neuromuscular junction of the diaphragm","tr":"Diyaframın nöromüsküler kavşağı içinde bulunur"},{"en":"It lies in the area postrema and is functionally outside the blood–brain barrier","tr":"Area postremada bulunur ve işlevsel olarak kan-beyin bariyerinin dışındadır"},{"en":"It is isolated from blood by an unusually impermeable barrier","tr":"Olağanüstü geçirimsiz bir bariyerle kandan yalıtılmıştır"},{"en":"It contains only stretch receptors in the stomach wall","tr":"Yalnızca mide duvarındaki gerilme reseptörlerini içerir"},{"en":"It receives information only from the vestibular apparatus","tr":"Yalnızca vestibüler sistemden bilgi alır"}],"answer":1,"explanation":{"en":"The chemoreceptor trigger zone is located in the area postrema, where the usual blood–brain barrier offers relatively little protection from circulating substances. Vestibular and gastrointestinal signals can also contribute to vomiting, but they are separate inputs to the emetic network.","tr":"Kemoreseptör tetik bölge, dolaşımdaki maddelere karşı olağan kan-beyin bariyerinin görece az koruma sağladığı area postremada yer alır. Vestibüler ve gastrointestinal sinyaller de kusmaya katkıda bulunabilir; ancak bunlar kusma ağına gelen ayrı girdilerdir."},"sourcePages":[266],"difficulty":"core","sourcePdfPages":[278]},{"id":"c19q2","stem":{"en":"Which structural feature best explains why glycopyrrolate has much less access to the central nervous system than hyoscine?","tr":"Glikopirolatın merkezi sinir sistemine hiyosinden çok daha az geçmesini en iyi açıklayan yapısal özellik hangisidir?"},"options":[{"en":"A highly lipid-soluble uncharged steroid nucleus","tr":"Yağda çok iyi çözünen yüksüz bir steroid çekirdeği"},{"en":"A peptide sequence that actively transports it into cerebrospinal fluid","tr":"Beyin omurilik sıvısına aktif taşınmasını sağlayan bir peptit dizisi"},{"en":"An ester that is converted to a centrally active opioid","tr":"Santral etkili bir opioide dönüşen bir ester"},{"en":"A permanently charged quaternary ammonium group","tr":"Kalıcı yüklü bir kuaterner amonyum grubu"},{"en":"A ring that becomes completely uncharged at physiological pH","tr":"Fizyolojik pH değerinde tamamen yüksüz hale gelen bir halka"}],"answer":3,"explanation":{"en":"Glycopyrrolate has a highly polar quaternary ammonium group that limits passage across lipid membranes, including an intact blood–brain barrier. Hyoscine is a tertiary amine and penetrates more readily; limited penetration should not be interpreted as an absolute guarantee of no central adverse effects.","tr":"Glikopirolatın oldukça polar kuaterner amonyum grubu, sağlam kan-beyin bariyeri dahil lipid zarlardan geçişini sınırlar. Hiyosin tersiyer bir amindir ve daha kolay geçer; sınırlı geçiş, santral yan etkilerin hiçbir koşulda olmayacağı şeklinde yorumlanmamalıdır."},"sourcePages":[271,272],"difficulty":"applied","sourcePdfPages":[283,284]},{"id":"c19q3","stem":{"en":"A dopamine D2 antagonist used as an antiemetic raises plasma prolactin. Which physiological relationship explains this effect?","tr":"Antiemetik olarak kullanılan bir dopamin D2 antagonisti plazma prolaktinini artırır. Bu etkiyi hangi fizyolojik ilişki açıklar?"},"options":[{"en":"Dopamine normally inhibits prolactin release, so D2 blockade removes this inhibition","tr":"Dopamin normalde prolaktin salınımını inhibe eder; D2 blokajı bu inhibisyonu kaldırır"},{"en":"D2 blockade inhibits enzymatic breakdown of prolactin in plasma","tr":"D2 blokajı plazmada prolaktinin enzimatik yıkımını inhibe eder"},{"en":"D2 blockade directly activates pituitary beta-1 adrenoceptors","tr":"D2 blokajı hipofizdeki beta-1 adrenoseptörlerini doğrudan aktive eder"},{"en":"D2 blockade increases prolactin mainly by reducing its renal clearance","tr":"D2 blokajı prolaktini esas olarak renal klirensini azaltarak artırır"},{"en":"D2 blockade suppresses prolactin inhibitory signals by blocking thyroid hormone synthesis","tr":"D2 blokajı tiroid hormonu sentezini bloke ederek prolaktini inhibe eden sinyalleri baskılar"}],"answer":0,"explanation":{"en":"Dopamine exerts tonic inhibition of prolactin secretion at pituitary lactotrophs. D2 receptor antagonism can remove this inhibitory signal; 5-HT3 antagonism is a different antiemetic mechanism and does not explain this dopamine-dependent effect.","tr":"Dopamin hipofizdeki laktotrof hücrelerde prolaktin salgısını tonik olarak inhibe eder. D2 reseptör antagonizması bu inhibitör sinyali kaldırabilir; 5-HT3 antagonizması farklı bir antiemetik mekanizmadır ve dopamine bağlı bu etkiyi açıklamaz."},"sourcePages":[268,270],"difficulty":"applied","sourcePdfPages":[280,282]},{"id":"c19q4","stem":{"en":"Which receptor is the principal antiemetic target of ondansetron?","tr":"Ondansetronun başlıca antiemetik reseptör hedefi hangisidir?"},"options":[{"en":"Dopamine D2 receptor","tr":"Dopamin D2 reseptörü"},{"en":"Histamine H2 receptor","tr":"Histamin H2 reseptörü"},{"en":"Muscarinic M3 receptor","tr":"Muskarinik M3 reseptörü"},{"en":"Substance P NK1 receptor","tr":"P maddesinin NK1 reseptörü"},{"en":"Serotonin 5-HT3 receptor","tr":"Serotonin 5-HT3 reseptörü"}],"answer":4,"explanation":{"en":"Ondansetron selectively antagonises 5-HT3 receptors, including receptors involved in gut–vagal and central emetic signalling. Aprepitant instead targets NK1 receptors, so the two drugs interrupt different transmitter pathways.","tr":"Ondansetron, bağırsak-vagal ve santral kusma sinyal iletimine katılan reseptörler dahil 5-HT3 reseptörlerini seçici olarak antagonize eder. Aprepitant ise NK1 reseptörlerini hedefler; dolayısıyla iki ilaç farklı nörotransmiter yollarını kesintiye uğratır."},"sourcePages":[273],"difficulty":"core","sourcePdfPages":[285]},{"id":"c19q5","stem":{"en":"Which endogenous transmitter has its action blocked at NK1 receptors by aprepitant?","tr":"Aprepitant, NK1 reseptörlerinde hangi endojen nörotransmiterin etkisini bloke eder?"},"options":[{"en":"Dopamine","tr":"Dopamin"},{"en":"Acetylcholine","tr":"Asetilkolin"},{"en":"Substance P","tr":"P maddesi"},{"en":"Histamine","tr":"Histamin"},{"en":"Glycine","tr":"Glisin"}],"answer":2,"explanation":{"en":"Aprepitant blocks substance P at neurokinin-1 receptors involved in emetic signalling. Dopamine antagonists act chiefly through D2 receptors in this context, and should not be confused with NK1 antagonists.","tr":"Aprepitant, kusma sinyal iletimine katılan nörokinin-1 reseptörlerinde P maddesini bloke eder. Dopamin antagonistleri bu bağlamda başlıca D2 reseptörleri üzerinden etki gösterir ve NK1 antagonistleriyle karıştırılmamalıdır."},"sourcePages":[274],"difficulty":"core","sourcePdfPages":[286]}]},{"id":20,"title":{"en":"Drugs Acting on the Gut","tr":"Gastrointestinal Sisteme Etki Eden İlaçlar"},"startPage":275,"endPage":279,"pdfStartPage":287,"pdfEndPage":291,"section":4,"questions":[{"id":"c20q1","stem":{"en":"Oral tetracycline absorption falls when an aluminium-containing antacid is present in the gut. Which interaction best explains this?","tr":"Bağırsakta alüminyum içeren bir antasit bulunduğunda oral tetrasiklin emilimi azalır. Bunu en iyi açıklayan etkileşim hangisidir?"},"options":[{"en":"Induction of hepatic tetracycline metabolism before absorption","tr":"Emilimden önce hepatik tetrasiklin metabolizmasının indüklenmesi"},{"en":"Displacement of tetracycline from plasma albumin","tr":"Tetrasiklinin plazma albümininden ayrılması"},{"en":"Irreversible blockade of bacterial ribosomes by aluminium","tr":"Bakteri ribozomlarının alüminyum tarafından geri dönüşümsüz bloke edilmesi"},{"en":"Increased glomerular filtration of the unabsorbed drug","tr":"Emilmemiş ilacın glomerüler filtrasyonunun artması"},{"en":"Formation of poorly absorbed complexes within the gastrointestinal lumen","tr":"Gastrointestinal lümende kötü emilen komplekslerin oluşması"}],"answer":4,"explanation":{"en":"Aluminium ions can bind tetracycline in the gut and form complexes that are absorbed poorly. This is an interaction affecting absorption before the drug reaches the circulation, rather than a change in hepatic metabolism or plasma protein binding.","tr":"Alüminyum iyonları bağırsakta tetrasikline bağlanarak kötü emilen kompleksler oluşturabilir. Bu etkileşim, hepatik metabolizma veya plazma proteinlerine bağlanmadaki bir değişiklikten ziyade ilaç dolaşıma ulaşmadan önce emilimi etkiler."},"sourcePages":[275],"difficulty":"applied","sourcePdfPages":[287]},{"id":"c20q2","stem":{"en":"How does cimetidine reduce gastric acid secretion?","tr":"Simetidin mide asidi salgısını nasıl azaltır?"},"options":[{"en":"By irreversibly acetylating platelet cyclo-oxygenase","tr":"Trombosit siklooksijenazını geri dönüşümsüz olarak asetilleyerek"},{"en":"By directly neutralising acid in the gastric lumen","tr":"Mide lümenindeki asidi doğrudan nötralize ederek"},{"en":"By competitively antagonising H2 receptors on parietal cells","tr":"Pariyetal hücrelerdeki H2 reseptörlerini kompetitif olarak antagonize ederek"},{"en":"By coating ulcer bases with an adherent polymer","tr":"Ülser tabanlarını yapışkan bir polimerle kaplayarak"},{"en":"By activating dopamine D2 receptors in the stomach","tr":"Midedeki dopamin D2 reseptörlerini aktive ederek"}],"answer":2,"explanation":{"en":"Cimetidine blocks histamine H2 receptors on acid-secreting parietal cells and thereby reduces secretion. An antacid acts on acid already present in the lumen, which is pharmacologically distinct from receptor-mediated suppression of secretion.","tr":"Simetidin asit salgılayan pariyetal hücrelerdeki histamin H2 reseptörlerini bloke ederek salgıyı azaltır. Antasitler ise lümende zaten bulunan aside etki eder; bu, salgının reseptör aracılı baskılanmasından farmakolojik olarak farklıdır."},"sourcePages":[275,276],"difficulty":"core","sourcePdfPages":[287,288]},{"id":"c20q3","stem":{"en":"Why can omeprazole suppress gastric acid secretion after its plasma concentration has fallen substantially?","tr":"Omeprazol, plazma konsantrasyonu belirgin biçimde azaldıktan sonra da mide asidi salgısını neden baskılayabilir?"},"options":[{"en":"Its activated form produces prolonged, irreversible inhibition of the parietal-cell proton pump","tr":"Aktive formu pariyetal hücre proton pompasında uzun süreli, geri dönüşümsüz inhibisyon oluşturur"},{"en":"It remains permanently confined to the gastric lumen","tr":"Mide lümeninde kalıcı olarak hapsolur"},{"en":"It causes an immediate increase in circulating gastrin that blocks all acid secretion","tr":"Dolaşımdaki gastrini hemen artırarak tüm asit salgısını bloke eder"},{"en":"It destroys parietal cells as its normal therapeutic mechanism","tr":"Normal terapötik mekanizması olarak pariyetal hücreleri yok eder"},{"en":"It continuously neutralises acid by releasing bicarbonate from its molecule","tr":"Molekülünden bikarbonat açığa çıkararak asidi sürekli nötralize eder"}],"answer":0,"explanation":{"en":"Activated omeprazole inhibits the H+/K+-ATPase, the final proton-secreting step in the parietal cell. The duration of this pump inhibition outlasts the parent drug in plasma, unlike a simple reversible H2 receptor blockade governed more closely by circulating concentration.","tr":"Aktive omeprazol, pariyetal hücrede proton salgılanmasının son basamağı olan H+/K+-ATPazı inhibe eder. Bu pompa inhibisyonu ana ilacın plazmada kalışından daha uzun sürer; dolaşımdaki konsantrasyonla daha yakından ilişkili basit geri dönüşümlü H2 reseptör blokajından farklıdır."},"sourcePages":[277],"difficulty":"applied","sourcePdfPages":[289]},{"id":"c20q4","stem":{"en":"Which observed effect most clearly demonstrates metoclopramide’s prokinetic action rather than inhibition of acid secretion?","tr":"Hangi gözlenen etki, asit salgısının inhibisyonundan ziyade metoklopramidin prokinetik etkisini en açık biçimde gösterir?"},"options":[{"en":"Irreversible inhibition of the gastric proton pump","tr":"Mide proton pompasının geri dönüşümsüz inhibisyonu"},{"en":"Chemical neutralisation of acid already in the stomach","tr":"Midede zaten bulunan asidin kimyasal nötralizasyonu"},{"en":"Selective blockade of parietal-cell H2 receptors","tr":"Pariyetal hücre H2 reseptörlerinin seçici blokajı"},{"en":"Faster gastric emptying with increased lower oesophageal sphincter tone","tr":"Alt özofagus sfinkteri tonusunun artmasıyla birlikte mide boşalmasının hızlanması"},{"en":"Formation of an adherent protective layer over an ulcer","tr":"Ülser üzerinde yapışkan bir koruyucu tabaka oluşması"}],"answer":3,"explanation":{"en":"Metoclopramide promotes coordinated upper gastrointestinal motility and increases lower oesophageal sphincter tone. These motor effects differ from cimetidine’s H2 blockade or omeprazole’s proton-pump inhibition, which primarily reduce acid secretion.","tr":"Metoklopramid üst gastrointestinal sistemin koordineli hareketlerini destekler ve alt özofagus sfinkteri tonusunu artırır. Bu motor etkiler, esas olarak asit salgısını azaltan simetidinin H2 blokajından veya omeprazolün proton pompası inhibisyonundan farklıdır."},"sourcePages":[278],"difficulty":"applied","sourcePdfPages":[290]},{"id":"c20q5","stem":{"en":"Which description best identifies the main protective action of sucralfate?","tr":"Sukralfatın başlıca koruyucu etkisini en iyi tanımlayan ifade hangisidir?"},"options":[{"en":"It systemically blocks all muscarinic receptors","tr":"Tüm muskarinik reseptörleri sistemik olarak bloke eder"},{"en":"It forms a locally adherent protective complex at an ulcer surface","tr":"Ülser yüzeyinde lokal olarak yapışan koruyucu bir kompleks oluşturur"},{"en":"It irreversibly inhibits parietal-cell H+/K+-ATPase","tr":"Pariyetal hücre H+/K+-ATPazını geri dönüşümsüz olarak inhibe eder"},{"en":"It eliminates Helicobacter pylori by inhibiting bacterial DNA gyrase","tr":"Bakteriyel DNA girazı inhibe ederek Helicobacter pylori’yi ortadan kaldırır"},{"en":"It stimulates dopamine receptors to reduce gastric contractions","tr":"Mide kasılmalarını azaltmak için dopamin reseptörlerini uyarır"}],"answer":1,"explanation":{"en":"Sucralfate acts predominantly within the gastrointestinal tract, forming an adherent barrier over damaged mucosa. Unlike a proton-pump inhibitor, its principal mechanism does not require systemic suppression of parietal-cell acid secretion.","tr":"Sukralfat ağırlıklı olarak gastrointestinal sistem içinde etki gös
