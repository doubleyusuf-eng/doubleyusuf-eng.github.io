terir ve hasarlı mukoza üzerinde yapışkan bir bariyer oluşturur. Bir proton pompası inhibitöründen farklı olarak başlıca mekanizması, pariyetal hücre asit salgısının sistemik olarak baskılanmasını gerektirmez."},"sourcePages":[279],"difficulty":"core","sourcePdfPages":[291]}]},{"id":21,"title":{"en":"Intravenous Fluids, Minerals and Nutrition","tr":"İntravenöz Sıvılar, Mineraller ve Beslenme"},"startPage":280,"endPage":294,"pdfStartPage":292,"pdfEndPage":306,"section":4,"questions":[{"id":"c21q1","stem":{"en":"A large chloride load from an unbalanced isotonic sodium chloride solution is followed by a fall in plasma bicarbonate. Which acid–base pattern best fits this mechanism?","tr":"Dengesiz izotonik sodyum klorür çözeltisinden gelen yüksek klorür yükünü plazma bikarbonatında düşüş izler. Bu mekanizmaya en uygun asit-baz tablosu hangisidir?"},"options":[{"en":"Hyperchloraemic metabolic acidosis","tr":"Hiperkloremik metabolik asidoz"},{"en":"Hypochloraemic metabolic alkalosis","tr":"Hipokloremik metabolik alkaloz"},{"en":"Primary respiratory alkalosis","tr":"Primer respiratuvar alkaloz"},{"en":"Primary respiratory acidosis","tr":"Primer respiratuvar asidoz"},{"en":"Ketoacidosis caused by a direct ketone load","tr":"Doğrudan keton yükünün oluşturduğu ketoasidoz"}],"answer":0,"explanation":{"en":"An excessive chloride load can lower bicarbonate relative to chloride and produce a hyperchloraemic metabolic acidosis. This is a metabolic effect of the fluid’s ionic composition, rather than a primary change in ventilation.","tr":"Aşırı klorür yükü, klorüre göre bikarbonatı azaltarak hiperkloremik metabolik asidoza yol açabilir. Bu, ventilasyondaki primer bir değişiklikten ziyade sıvının iyonik bileşiminin metabolik etkisidir."},"sourcePages":[282,284],"difficulty":"applied","sourcePdfPages":[294,296]},{"id":"c21q2","stem":{"en":"A glucose-only intravenous solution is approximately iso-osmotic in its container. In a person who metabolises the glucose normally, why does its water subsequently distribute beyond the extracellular space?","tr":"Yalnızca glukoz içeren bir intravenöz çözelti kabında yaklaşık izoozmotiktir. Glukozu normal olarak metabolize eden bir kişide bu çözeltinin suyu daha sonra neden hücre dışı alanın ötesine de dağılır?"},"options":[{"en":"Glucose remains extracellular as a persistently effective osmole","tr":"Glukoz kalıcı olarak etkin bir ozmol şeklinde hücre dışında kalır"},{"en":"Glucose is converted into albumin and raises oncotic pressure","tr":"Glukoz albümine dönüştürülerek onkotik basıncı artırır"},{"en":"Glucose prevents water from crossing cell membranes","tr":"Glukoz suyun hücre zarlarını geçmesini engeller"},{"en":"Container osmolarity is identical to effective tonicity after metabolism","tr":"Kaptaki ozmolarite metabolizma sonrasındaki etkin tonisiteyle aynıdır"},{"en":"Glucose uptake and metabolism remove the effective solute, leaving an electrolyte-free water load","tr":"Glukozun alımı ve metabolizması etkin çözünen maddeyi ortadan kaldırarak elektrolitsiz bir su yükü bırakır"}],"answer":4,"explanation":{"en":"Once glucose is taken up and metabolised, it no longer maintains the same extracellular osmotic effect, so the remaining water can distribute across total body water. Container osmolarity and effective tonicity after metabolism therefore describe different properties.","tr":"Glukoz hücreye alınıp metabolize edildiğinde aynı hücre dışı ozmotik etkiyi sürdüremez; geriye kalan su toplam vücut suyuna dağılabilir. Bu nedenle kaptaki ozmolarite ile metabolizma sonrasındaki etkin tonisite farklı özellikleri tanımlar."},"sourcePages":[284,285],"difficulty":"applied","sourcePdfPages":[296,297]},{"id":"c21q3","stem":{"en":"Which pair best describes two important physiological functions of plasma albumin?","tr":"Hangi ikili plazma albümininin iki önemli fizyolojik işlevini en iyi tanımlar?"},"options":[{"en":"Oxygen carriage and carbon dioxide buffering within erythrocytes","tr":"Eritrositlerde oksijen taşınması ve karbondioksitin tamponlanması"},{"en":"Conversion of fibrinogen to fibrin and activation of platelets","tr":"Fibrinojenin fibrine dönüştürülmesi ve trombosit aktivasyonu"},{"en":"Contribution to oncotic pressure and transport of bound molecules","tr":"Onkotik basınca katkı ve bağlı moleküllerin taşınması"},{"en":"Specific antigen recognition and complement-mediated immune defence","tr":"Özgül antijen tanınması ve kompleman aracılı bağışıklık savunması"},{"en":"Iron storage within cells and transport of oxygen in muscle","tr":"Hücre içinde demir depolanması ve kasta oksijen taşınması"}],"answer":2,"explanation":{"en":"Albumin is a major contributor to plasma colloid osmotic pressure and binds many drugs and endogenous molecules. Haemoglobin is the principal red-cell oxygen carrier; that role should not be attributed to albumin.","tr":"Albümin plazma kolloid ozmotik basıncına önemli katkıda bulunur ve birçok ilaca ve endojen moleküle bağlanır. Eritrositlerin başlıca oksijen taşıyıcısı hemoglobindir; bu işlev albümine atfedilmemelidir."},"sourcePages":[288],"difficulty":"core","sourcePdfPages":[300]},{"id":"c21q4","stem":{"en":"During nutritional repletion of a severely malnourished person, serum phosphate falls as metabolism shifts toward anabolism. Which process best explains this characteristic change?","tr":"Ağır malnütrisyonu olan bir kişide beslenme yeniden sağlanırken metabolizma anabolizmaya yönelir ve serum fosfatı düşer. Bu tipik değişikliği en iyi açıklayan süreç hangisidir?"},"options":[{"en":"Release of phosphate from cells during increased catabolism","tr":"Artmış katabolizma sırasında hücrelerden fosfat salınması"},{"en":"Movement of phosphate into cells with renewed substrate utilisation","tr":"Substrat kullanımının yeniden artmasıyla fosfatın hücre içine geçmesi"},{"en":"A fall in glomerular filtration that reduces phosphate excretion","tr":"Fosfat atılımını azaltan glomerüler filtrasyon düşüşü"},{"en":"Reduced cellular phosphate utilisation because anabolic activity has stopped","tr":"Anabolik aktivite durduğu için hücresel fosfat kullanımının azalması"},{"en":"Release of phosphate from bone sufficient to increase extracellular stores","tr":"Hücre dışı depoları artıracak kadar fosfatın kemikten salınması"}],"answer":1,"explanation":{"en":"Refeeding can drive phosphate, potassium and magnesium into cells as anabolic metabolism resumes. Thus a fall in serum phosphate can reflect redistribution as well as depleted body stores; it is not explained by release of phosphate from cells.","tr":"Yeniden beslenme, anabolik metabolizma yeniden başladığında fosfat, potasyum ve magnezyumun hücre içine geçmesini artırabilir. Bu nedenle serum fosfatındaki düşüş, azalmış vücut depolarının yanı sıra yeniden dağılımı da yansıtabilir; hücrelerden fosfat salınmasıyla açıklanmaz."},"sourcePages":[291,292],"difficulty":"applied","sourcePdfPages":[303,304]},{"id":"c21q5","stem":{"en":"In conventional parenteral nutrition, which component supplies nitrogen for protein synthesis without requiring intestinal protein digestion?","tr":"Geleneksel parenteral beslenmede, bağırsakta protein sindirimi gerektirmeden protein sentezi için azot sağlayan bileşen hangisidir?"},"options":[{"en":"Intact dietary proteins used in polymeric enteral feeds","tr":"Polimerik enteral ürünlerde kullanılan bütün diyet proteinleri"},{"en":"Glucose alone","tr":"Tek başına glukoz"},{"en":"Triglyceride emulsion alone","tr":"Tek başına trigliserit emülsiyonu"},{"en":"A mixture of amino acids","tr":"Bir amino asit karışımı"},{"en":"Sodium chloride alone","tr":"Tek başına sodyum klorür"}],"answer":3,"explanation":{"en":"Parenteral nutrition supplies nitrogen as amino acids, bypassing the gastrointestinal steps needed to digest intact dietary proteins. Glucose and lipid provide energy, but neither alone supplies the amino-acid nitrogen required for protein synthesis.","tr":"Parenteral beslenme azotu amino asitler halinde sağlar ve bütün diyet proteinlerini sindirmek için gereken gastrointestinal basamakları atlar. Glukoz ve lipid enerji sağlar; ancak tek başlarına protein sentezi için gereken amino asit azotunu sağlamazlar."},"sourcePages":[292,293],"difficulty":"core","sourcePdfPages":[304,305]}]},{"id":22,"title":{"en":"Diuretics","tr":"Diüretikler"},"startPage":295,"endPage":300,"pdfStartPage":307,"pdfEndPage":312,"section":4,"questions":[{"id":"c22q1","stem":{"en":"Which nephron location is the main site at which thiazide diuretics inhibit sodium and chloride reabsorption?","tr":"Tiyazid diüretikleri sodyum ve klorür geri emilimini esas olarak nefronun hangi bölgesinde inhibe eder?"},"options":[{"en":"Glomerular filtration barrier","tr":"Glomerüler filtrasyon bariyeri"},{"en":"Thin descending limb of the loop of Henle","tr":"Henle kulpunun ince inen kolu"},{"en":"Proximal tubule bicarbonate-reabsorbing system","tr":"Proksimal tübülün bikarbonat geri emilim sistemi"},{"en":"Early distal convoluted tubule","tr":"Distal kıvrımlı tübülün erken bölümü"},{"en":"Aldosterone receptor in the collecting system","tr":"Toplayıcı sistemdeki aldosteron reseptörü"}],"answer":3,"explanation":{"en":"Thiazides act predominantly in the early distal convoluted tubule to inhibit sodium–chloride reabsorption. Loop diuretics act mainly in the thick ascending limb, whereas carbonic anhydrase inhibitors reduce proximal bicarbonate reabsorption.","tr":"Tiyazidler ağırlıklı olarak distal kıvrımlı tübülün erken bölümünde sodyum-klorür geri emilimini inhibe eder. Kulp diüretikleri esas olarak kalın çıkan kolda etki gösterirken karbonik anhidraz inhibitörleri proksimal bikarbonat geri emilimini azaltır."},"sourcePages":[295,296],"difficulty":"core","sourcePdfPages":[307,308]},{"id":"c22q2","stem":{"en":"Which contrast in urinary calcium handling is expected from loop diuretics compared with thiazides?","tr":"Kulp diüretikleri ile tiyazidler karşılaştırıldığında idrarla kalsiyum atılımı açısından hangi fark beklenir?"},"options":[{"en":"Loop diuretics decrease calcium excretion; thiazides increase it","tr":"Kulp diüretikleri kalsiyum atılımını azaltır; tiyazidler artırır"},{"en":"Loop diuretics increase calcium excretion; thiazides decrease it","tr":"Kulp diüretikleri kalsiyum atılımını artırır; tiyazidler azaltır"},{"en":"Both classes directly eliminate calcium filtration at the glomerulus","tr":"Her iki sınıf da glomerülde kalsiyum filtrasyonunu doğrudan ortadan kaldırır"},{"en":"Both classes have no effect on renal calcium handling","tr":"Her iki sınıfın da böbrekte kalsiyumun işlenmesi üzerinde etkisi yoktur"},{"en":"Loop diuretics change only intestinal calcium absorption","tr":"Kulp diüretikleri yalnızca bağırsaktan kalsiyum emilimini değiştirir"}],"answer":1,"explanation":{"en":"Loop diuretics promote urinary calcium loss, while thiazides tend to reduce urinary calcium excretion. Their shared tendency to increase sodium excretion does not mean that all other electrolytes change in the same direction.","tr":"Kulp diüretikleri idrarla kalsiyum kaybını artırırken tiyazidler idrarla kalsiyum atılımını azaltma eğilimindedir. Her iki grubun sodyum atılımını artırması, diğer tüm elektrolitlerin aynı yönde değişeceği anlamına gelmez."},"sourcePages":[296,297],"difficulty":"applied","sourcePdfPages":[308,309]},{"id":"c22q3","stem":{"en":"Which mechanism distinguishes spironolactone from a loop diuretic?","tr":"Spironolaktonu bir kulp diüretiğinden ayıran mekanizma hangisidir?"},"options":[{"en":"Inhibition of sodium–potassium–chloride cotransport in the thick ascending limb","tr":"Kalın çıkan kolda sodyum-potasyum-klorür kotransportunun inhibisyonu"},{"en":"Osmotic retention of water by a filtered, poorly reabsorbed solute","tr":"Filtre edilen ve az geri emilen bir çözünen maddenin suyu ozmotik olarak tutması"},{"en":"Inhibition of carbonic anhydrase in the proximal tubule","tr":"Proksimal tübülde karbonik anhidraz inhibisyonu"},{"en":"Activation of vasopressin receptors in the collecting duct","tr":"Toplayıcı kanalda vazopressin reseptörlerinin aktivasyonu"},{"en":"Competitive antagonism of aldosterone at mineralocorticoid receptors","tr":"Mineralokortikoid reseptörlerinde aldosteronun kompetitif antagonizması"}],"answer":4,"explanation":{"en":"Spironolactone blocks aldosterone-mediated sodium retention and reduces the associated potassium loss. Furosemide instead inhibits salt transport in the loop of Henle; it does not produce diuresis by antagonising the mineralocorticoid receptor.","tr":"Spironolakton aldosteron aracılı sodyum tutulmasını bloke eder ve buna eşlik eden potasyum kaybını azaltır. Furosemid ise Henle kulpunda tuz taşınmasını inhibe eder; diürezi mineralokortikoid reseptörünü antagonize ederek oluşturmaz."},"sourcePages":[298],"difficulty":"core","sourcePdfPages":[310]},{"id":"c22q4","stem":{"en":"An experimental solute is freely filtered at the glomerulus, undergoes little tubular reabsorption, and retains water in the tubular lumen. Which diuretic acts most closely by this mechanism?","tr":"Deneysel bir çözünen madde glomerülde serbestçe filtre edilir, tübüllerden çok az geri emilir ve suyu tübül lümeninde tutar. Hangi diüretik bu mekanizmaya en yakın biçimde etki gösterir?"},"options":[{"en":"Mannitol","tr":"Mannitol"},{"en":"Spironolactone","tr":"Spironolakton"},{"en":"Bendroflumethiazide","tr":"Bendroflumetiyazid"},{"en":"Furosemide","tr":"Furosemid"},{"en":"Acetazolamide","tr":"Asetazolamid"}],"answer":0,"explanation":{"en":"Mannitol increases tubular fluid osmolality because it is filtered and only minimally reabsorbed, producing osmotic diuresis. Acetazolamide also increases urinary solute loss, but does so by inhibiting carbonic anhydrase rather than by remaining in the lumen as the principal osmotic agent.","tr":"Mannitol filtre edilip yalnızca çok az geri emildiği için tübül sıvısının ozmolalitesini artırır ve ozmotik diürez oluşturur. Asetazolamid de idrarla çözünen madde kaybını artırır; ancak bunu lümende başlıca ozmotik ajan olarak kalarak değil karbonik anhidrazı inhibe ederek yapar."},"sourcePages":[299],"difficulty":"applied","sourcePdfPages":[311]},{"id":"c22q5","stem":{"en":"Which paired change is most consistent with renal carbonic anhydrase inhibition by acetazolamide?","tr":"Asetazolamidin renal karbonik anhidraz inhibisyonuyla en uyumlu değişiklik çifti hangisidir?"},"options":[{"en":"Reduced urinary bicarbonate loss and metabolic alkalosis","tr":"İdrarla bikarbonat kaybının azalması ve metabolik alkaloz"},{"en":"Increased gastric acid secretion and respiratory acidosis","tr":"Mide asidi salgısının artması ve respiratuvar asidoz"},{"en":"Increased urinary bicarbonate loss and a tendency toward metabolic acidosis","tr":"İdrarla bikarbonat kaybının artması ve metabolik asidoza eğilim"},{"en":"Complete blockade of glomerular filtration and respiratory alkalosis","tr":"Glomerüler filtrasyonun tamamen bloke olması ve respiratuvar alkaloz"},{"en":"Increased aldosterone activity and potassium retention","tr":"Aldosteron aktivitesinin artması ve potasyum tutulması"}],"answer":2,"explanation":{"en":"Acetazolamide reduces bicarbonate reclamation, causing bicarbonaturia and relatively alkaline urine while systemic bicarbonate falls. Alkaline urine can therefore coexist with metabolic acidosis; urinary pH alone does not identify the systemic acid–base state.","tr":"Asetazolamid bikarbonat geri emilimini azaltır; sistemik bikarbonat düşerken bikarbonatüri ve görece alkali idrar oluşur. Bu nedenle alkali idrar metabolik asidozla birlikte görülebilir; idrar pH değeri tek başına sistemik asit-baz durumunu göstermez."},"sourcePages":[299,300],"difficulty":"applied","sourcePdfPages":[311,312]}]},{"id":23,"title":{"en":"Antimicrobials","tr":"Antimikrobiyaller"},"startPage":301,"endPage":330,"pdfStartPage":313,"pdfEndPage":342,"section":4,"questions":[{"id":"c23q1","stem":{"en":"Which bacterial process is directly disrupted when a penicillin binds its penicillin-binding protein target?","tr":"Bir penisilin, hedefi olan penisilin bağlayan proteine bağlandığında hangi bakteriyel süreç doğrudan bozulur?"},"options":[{"en":"Translation at the 30S ribosomal subunit","tr":"30S ribozomal alt birimde translasyon"},{"en":"Ergosterol synthesis in the cell membrane","tr":"Hücre zarında ergosterol sentezi"},{"en":"Cross-linking of peptidoglycan during cell-wall synthesis","tr":"Hücre duvarı sentezi sırasında peptidoglikanın çapraz bağlanması"},{"en":"Viral DNA chain elongation","tr":"Viral DNA zincirinin uzaması"},{"en":"Conversion of folate to tetrahydrofolate","tr":"Folatın tetrahidrofolata dönüşmesi"}],"answer":2,"explanation":{"en":"Penicillins inhibit penicillin-binding enzymes involved in peptidoglycan cross-linking, weakening the bacterial cell wall. Aminoglycosides instead target bacterial ribosomes, while ergosterol is a fungal membrane target rather than the penicillin target.","tr":"Penisilinler peptidoglikanın çapraz bağlanmasına katılan penisilin bağlayan enzimleri inhibe ederek bakteri hücre duvarını zayıflatır. Aminoglikozidler bakteriyel ribozomları hedefler; ergosterol ise penisilinin hedefi değil, mantar hücre zarına ait bir hedeftir."},"sourcePages":[308,309],"difficulty":"core","sourcePdfPages":[320,321]},{"id":"c23q2","stem":{"en":"Gentamicin activity is reduced in a poorly oxygenated environment. Which step in its antibacterial action helps explain this?","tr":"Gentamisinin etkinliği oksijenlenmesi yetersiz bir ortamda azalır. Antibakteriyel etkisinin hangi basamağı bunu açıklamaya yardımcı olur?"},"options":[{"en":"Oxygen is needed to convert gentamicin into an active beta-lactam metabolite","tr":"Gentamisini aktif bir beta-laktam metabolitine dönüştürmek için oksijen gerekir"},{"en":"Hypoxia increases outward drug transport without affecting uptake","tr":"Hipoksi ilaç girişini etkilemeden ilacın dışarı taşınmasını artırır"},{"en":"Its antibacterial effect requires oxygen-dependent inhibition of peptidoglycan synthesis","tr":"Antibakteriyel etkisi peptidoglikan sentezinin oksijene bağımlı inhibisyonunu gerektirir"},{"en":"Low oxygen tension replaces the bacterial 30S binding site with a 50S target","tr":"Düşük oksijen basıncı bakteriyel 30S bağlanma bölgesinin yerine bir 50S hedefi oluşturur"},{"en":"Energy-dependent uptake into bacteria is impaired when oxygen availability is low","tr":"Oksijen azlığında bakteriye enerjiye bağımlı giriş bozulur"}],"answer":4,"explanation":{"en":"Aminoglycoside entry into bacteria includes an energy-dependent, oxygen-sensitive transport step, so low oxygen tension can impair access to the intracellular target. Once inside, gentamicin acts at the 30S ribosomal subunit; changing the environment does not turn it into a cell-wall inhibitor.","tr":"Aminoglikozidlerin bakteriye girişinde enerjiye bağımlı ve oksijene duyarlı bir taşıma basamağı bulunur; düşük oksijen basıncı hücre içi hedefe erişimi azaltabilir. Gentamisin hücreye girdikten sonra 30S ribozomal alt birimde etki gösterir; ortamın değişmesi onu bir hücre duvarı inhibitörüne dönüştürmez."},"sourcePages":[305,314],"difficulty":"applied","sourcePdfPages":[317,326]},{"id":"c23q3","stem":{"en":"Which target best explains rifampicin’s inhibition of bacterial RNA synthesis?","tr":"Rifampisinin bakteriyel RNA sentezini inhibe etmesini en iyi açıklayan hedef hangisidir?"},"options":[{"en":"DNA gyrase and topoisomerase IV","tr":"DNA giraz ve topoizomeraz IV"},{"en":"DNA-dependent RNA polymerase","tr":"DNA bağımlı RNA polimeraz"},{"en":"The 50S ribosomal subunit","tr":"50S ribozomal alt birim"},{"en":"Dihydrofolate reductase","tr":"Dihidrofolat redüktaz"},{"en":"Peptidoglycan transpeptidase","tr":"Peptidoglikan transpeptidazı"}],"answer":1,"explanation":{"en":"Rifampicin inhibits bacterial DNA-dependent RNA polymerase, interrupting transcription. Fluoroquinolones act on bacterial topoisomerases involved in DNA handling, so their nucleic-acid target is different from rifampicin’s.","tr":"Rifampisin bakteriyel DNA bağımlı RNA polimerazı inhibe ederek transkripsiyonu kesintiye uğratır. Florokinolonlar DNA işlemlerine katılan bakteriyel topoizomerazlar üzerinde etki gösterdiğinden nükleik asit hedefleri rifampisininkinden farklıdır."},"sourcePages":[322],"difficulty":"core","sourcePdfPages":[334]},{"id":"c23q4","stem":{"en":"A herpes simplex isolate has markedly reduced viral thymidine kinase activity. Why may this reduce susceptibility to aciclovir?","tr":"Bir herpes simpleks izolatında viral timidin kinaz aktivitesi belirgin azalmıştır. Bu durum asiklovire duyarlılığı neden azaltabilir?"},"options":[{"en":"Aciclovir requires viral thymidine kinase for transport across the host cell membrane","tr":"Asiklovir konak hücre zarından taşınmak için viral timidin kinaza ihtiyaç duyar"},{"en":"The kinase normally converts aciclovir into a neuraminidase inhibitor","tr":"Kinaz normalde asikloviri bir nöraminidaz inhibitörüne dönüştürür"},{"en":"Loss of the kinase directly increases renal aciclovir elimination","tr":"Kinazın kaybı asiklovirin renal eliminasyonunu doğrudan artırır"},{"en":"The initial phosphorylation needed for efficient aciclovir activation is reduced","tr":"Asiklovirin etkin aktivasyonu için gereken ilk fosforilasyon azalır"},{"en":"The kinase is the enzyme that aciclovir must irreversibly inhibit to stop viral entry","tr":"Kinaz, viral girişi durdurmak için asiklovirin geri dönüşümsüz inhibe etmesi gereken enzimdir"}],"answer":3,"explanation":{"en":"Viral thymidine kinase performs the first phosphorylation of aciclovir in susceptible infected cells, after which cellular enzymes generate the active triphosphate. Reduced activation can therefore confer resistance even if drug reaches the cell; the active triphosphate inhibits viral DNA polymerase and terminates DNA elongation.","tr":"Viral timidin kinaz duyarlı enfekte hücrelerde asiklovirin ilk fosforilasyonunu yapar; ardından hücresel enzimler aktif trifosfatı oluşturur. Bu nedenle ilaç hücreye ulaşsa bile aktivasyonun azalması direnç sağlayabilir; aktif trifosfat viral DNA polimerazı inhibe eder ve DNA uzamasını sonlandırır."},"sourcePages":[326],"difficulty":"applied","sourcePdfPages":[338]},{"id":"c23q5","stem":{"en":"Which antifungal mechanism identifies the echinocandin class?","tr":"Hangi antifungal mekanizma ekinokandin sınıfını tanımlar?"},"options":[{"en":"Inhibition of beta-glucan synthesis in the fungal cell wall","tr":"Mantar hücre duvarında beta-glukan sentezinin inhibisyonu"},{"en":"Binding directly to membrane ergosterol to form pores","tr":"Gözenek oluşturmak için zar ergosterolüne doğrudan bağlanma"},{"en":"Inhibition of lanosterol conversion to ergosterol","tr":"Lanosterolün ergosterole dönüşümünün inhibisyonu"},{"en":"Inhibition of bacterial peptidoglycan cross-linking","tr":"Bakteriyel peptidoglikan çapraz bağlanmasının inhibisyonu"},{"en":"Blockade of viral neuraminidase","tr":"Viral nöraminidazın blokajı"}],"answer":0,"explanation":{"en":"Echinocandins inhibit synthesis of beta-glucan, an important structural component of the fungal cell wall. Azoles inhibit ergosterol synthesis and polyenes bind ergosterol in the membrane, distinguishing wall-directed from membrane-directed antifungal actions.","tr":"Ekinokandinler mantar hücre duvarının önemli bir yapısal bileşeni olan beta-glukanın sentezini inhibe eder. Azoller ergosterol sentezini inhibe ederken polienler zardaki ergosterole bağlanır; böylece duvara yönelik ve zara yönelik antifungal etkiler birbirinden ayrılır."},"sourcePages":[329,330],"difficulty":"core","sourcePdfPages":[341,342]}]},{"id":24,"title":{"en":"Drugs Affecting Coagulation","tr":"Pıhtılaşmayı Etkileyen İlaçlar"},"startPage":331,"endPage":345,"pdfStartPage":343,"pdfEndPage":357,"section":4,"questions":[{"id":"c24q1","stem":{"en":"Aspirin has largely disappeared from plasma, but exposed platelets still produce less thromboxane A2. Which mechanism best explains the persisting effect?","tr":"Aspirin plazmadan büyük ölçüde uzaklaşmıştır; ancak aspirine maruz kalmış trombositler hâlâ daha az tromboksan A2 üretmektedir. Kalıcı etkiyi en iyi hangi mekanizma açıklar?"},"options":[{"en":"Reversible occupation of platelet P2Y12 receptors by circulating aspirin","tr":"Dolaşımdaki aspirinin trombosit P2Y12 reseptörlerini geri dönüşümlü işgal etmesi"},{"en":"Irreversible acetylation of platelet cyclo-oxygenase","tr":"Trombosit siklooksijenazının geri dönüşümsüz asetilasyonu"},{"en":"Direct activation of plasminogen to plasmin","tr":"Plazminojenin doğrudan plazmine aktivasyonu"},{"en":"Inhibition of vitamin K recycling in the liver","tr":"Karaciğerde K vitamini döngüsünün inhibisyonu"},{"en":"Direct neutralisation of thrombin by a circulating antibody","tr":"Dolaşımdaki bir antikorun trombini doğrudan nötralize etmesi"}],"answer":1,"explanation":{"en":"Aspirin irreversibly inhibits platelet cyclo-oxygenase, reducing thromboxane formation beyond its brief presence in plasma. P2Y12 blockade is the antiplatelet mechanism of agents such as clopidogrel, not the explanation for aspirin’s thromboxane effect.","tr":"Aspirin trombosit siklooksijenazını geri dönüşümsüz olarak inhibe eder; böylece tromboksan oluşumu ilacın plazmada kısa süre bulunmasından daha uzun süre azalır. P2Y12 blokajı klopidogrel gibi ajanların antitrombosit mekanizmasıdır; aspirinin tromboksan etkisinin açıklaması değildir."},"sourcePages":[332],"difficulty":"applied","sourcePdfPages":[344]},{"id":"c24q2","stem":{"en":"A person with reduced CYP2C19 function forms less active metabolite after clopidogrel exposure. Which consequence follows most directly from its pharmacology?","tr":"CYP2C19 işlevi azalmış bir kişide klopidogrel alımı sonrasında daha az aktif metabolit oluşur. İlacın farmakolojisinden en doğrudan hangi sonuç çıkar?"},"options":[{"en":"Greater platelet inhibition because inactive parent clopidogrel accumulates","tr":"İnaktif ana klopidogrel biriktiği için daha güçlü trombosit inhibisyonu"},{"en":"Greater thromboxane inhibition through direct cyclo-oxygenase acetylation","tr":"Doğrudan siklooksijenaz asetilasyonu yoluyla daha güçlü tromboksan inhibisyonu"},{"en":"Greater anticoagulation because less vitamin K is recycled","tr":"Daha az K vitamini geri dönüştürüldüğü için daha güçlü antikoagülasyon"},{"en":"Less inhibition of platelet P2Y12 signalling","tr":"Trombosit P2Y12 sinyalinin daha az inhibe edilmesi"},{"en":"Unchanged platelet inhibition because clopidogrel acts without metabolic activation","tr":"Klopidogrel metabolik aktivasyon olmadan etki gösterdiği için değişmeyen trombosit inhibisyonu"}],"answer":3,"explanation":{"en":"Clopidogrel is a prodrug whose active metabolite inhibits platelet P2Y12 receptors; reduced bioactivation can therefore lessen platelet inhibition. More parent drug does not automatically mean greater effect when activity depends on formation of a metabolite.","tr":"Klopidogrel, aktif metaboliti trombosit P2Y12 reseptörlerini inhibe eden bir ön ilaçtır; biyolojik aktivasyonun azalması bu nedenle trombosit inhibisyonunu azaltabilir. Etkinlik bir metabolitin oluşmasına bağlı olduğunda ana ilacın artması otomatik olarak daha güçlü etki anlamına gelmez."},"sourcePages":[333],"difficulty":"applied","sourcePdfPages":[345]},{"id":"c24q3","stem":{"en":"Which mechanism best describes unfractionated heparin’s anticoagulant action?","tr":"Fraksiyone olmayan heparinin antikoagülan etkisini en iyi tanımlayan mekanizma hangisidir?"},"options":[{"en":"Acceleration of antithrombin-mediated inhibition of activated coagulation factors","tr":"Aktive pıhtılaşma faktörlerinin antitrombin aracılı inhibisyonunun hızlandırılması"},{"en":"Direct irreversible blockade of platelet P2Y12 receptors","tr":"Trombosit P2Y12 reseptörlerinin doğrudan geri dönüşümsüz blokajı"},{"en":"Inhibition of vitamin K epoxide reductase","tr":"K vitamini epoksit redüktazın inhibisyonu"},{"en":"Direct conversion of plasminogen into plasmin","tr":"Plazminojenin doğrudan plazmine dönüştürülmesi"},{"en":"Occupation of lysine-binding sites on plasminogen","tr":"Plazminojendeki lizin bağlanma bölgelerinin işgal edilmesi"}],"answer":0,"explanation":{"en":"Heparin enhances the activity of antithrombin against thrombin and other activated coagulation factors, including factor Xa. Warfarin instead reduces production of functional vitamin K-dependent factors, whereas fibrinolytic drugs promote clot breakdown.","tr":"Heparin antitrombinin trombine ve faktör Xa dahil diğer aktive pıhtılaşma faktörlerine karşı aktivitesini güçlendirir. Varfarin ise işlevsel K vitaminine bağımlı faktörlerin üretimini azaltır; fibrinolitik ilaçlar pıhtının yıkımını destekler."},"sourcePages":[335,336],"difficulty":"core","sourcePdfPages":[347,348]},{"id":"c24q4","stem":{"en":"Why is the full anticoagulant response to warfarin delayed after the drug first reaches the circulation?","tr":"Varfarin ilk kez dolaşıma ulaştıktan sonra tam antikoagülan yanıt neden gecikir?"},"options":[{"en":"Slow intestinal absorption is the sole determinant of the delay","tr":"Gecikmenin tek belirleyicisi yavaş bağırsak emilimidir"},{"en":"Warfarin must first be converted to an active direct thrombin inhibitor","tr":"Varfarinin önce aktif bir doğrudan trombin inhibitörüne dönüşmesi gerekir"},{"en":"Platelet turnover is required before vitamin K recycling is inhibited","tr":"K vitamini döngüsü inhibe edilmeden önce trombositlerin yenilenmesi gerekir"},{"en":"Warfarin can act only after pre-existing fibrin is enzymatically removed","tr":"Varfarin ancak önceden mevcut fibrin enzimatik olarak uzaklaştırıldıktan sonra etki gösterebilir"},{"en":"Previously formed functional clotting factors must decline as synthesis of new functional factors is impaired","tr":"Yeni işlevsel faktörlerin sentezi bozulurken önceden oluşmuş işlevsel pıhtılaşma faktörlerinin azalması gerekir"}],"answer":4,"explanation":{"en":"Warfarin interferes with vitamin K recycling and hence the production of functionally carboxylated coagulation proteins. It does not directly inactivate factors already circulating, so factor turnover contributes to the delayed response.","tr":"Varfarin K vitamini döngüsünü ve dolayısıyla işlevsel karboksilasyona uğramış pıhtılaşma proteinlerinin üretimini bozar. Dolaşımda zaten bulunan faktörleri doğrudan inaktive etmediğinden faktörlerin yenilenme hızı gecikmiş yanıta katkıda bulunur."},"sourcePages":[338],"difficulty":"applied","sourcePdfPages":[350]},{"id":"c24q5","stem":{"en":"What is the principal haemostatic mechanism of tranexamic acid?","tr":"Traneksamik asidin başlıca hemostatik mekanizması nedir?"},"options":[{"en":"Increasing fibrinolysis by directly activating plasminogen","tr":"Plazminojeni doğrudan aktive ederek fibrinolizi artırmak"},{"en":"Increasing platelet aggregation through irreversible P2Y12 activation","tr":"Geri dönüşümsüz P2Y12 aktivasyonuyla trombosit agregasyonunu artırmak"},{"en":"Reducing fibrinolysis by interfering with lysine-dependent plasminogen binding to fibrin","tr":"Plazminojenin fibrine lizin bağımlı bağlanmasını engelleyerek fibrinolizi azaltmak"},{"en":"Restoring vitamin K-dependent gamma-carboxylation","tr":"K vitaminine bağımlı gama-karboksilasyonu yeniden sağlamak"},{"en":"Increasing antithrombin-mediated inhibition of thrombin","tr":"Trombinin antitrombin aracılı inhibisyonunu artırmak"}],"answer":2,"explanation":{"en":"Tranexamic acid is a lysine analogue that interferes with plasminogen–fibrin interaction and limits fibrin breakdown. It is an antifibrinolytic; a plasminogen activator such as alteplase has the opposite functional effect on clot dissolution.","tr":"Traneksamik asit plazminojen-fibrin etkileşimini engelleyen ve fibrin yıkımını sınırlayan bir lizin analoğudur. Bir antifibrinolitiktir; alteplaz gibi plazminojen aktivatörleri pıhtının çözünmesi üzerinde ters yönde işlevsel etki gösterir."},"sourcePages":[343,344],"difficulty":"core","sourcePdfPages":[355,356]}]},{"id":25,"title":{"en":"Drugs Used in Diabetes Mellitus","tr":"Diabetes Mellitusta Kullanılan İlaçlar"},"startPage":346,"endPage":354,"pdfStartPage":358,"pdfEndPage":366,"section":4,"questions":[{"id":"c25q1","stem":{"en":"Which signalling property belongs to the insulin receptor itself?","tr":"Hangi sinyal iletim özelliği doğrudan insülin reseptörüne aittir?"},"options":[{"en":"An intrinsic ligand-gated chloride pore","tr":"Kendisine ait ligand kapılı bir klorür poru"},{"en":"Direct hydrolysis of acetylcholine in the synaptic cleft","tr":"Sinaptik aralıkta asetilkolinin doğrudan hidrolizi"},{"en":"A nuclear binding site for thyroid hormone","tr":"Tiroid hormonu için nükleer bir bağlanma bölgesi"},{"en":"An ATP-sensitive potassium channel pore in the beta cell","tr":"Beta hücresinde ATP’ye duyarlı bir potasyum kanalı poru"},{"en":"Tyrosine kinase activity of its beta subunits","tr":"Beta alt birimlerinin tirozin kinaz aktivitesi"}],"answer":4,"explanation":{"en":"Insulin binds a receptor whose beta subunits possess tyrosine kinase activity, initiating intracellular signalling. ATP-sensitive potassium channels regulate insulin secretion from pancreatic beta cells, but they are not the insulin receptor.","tr":"İnsülin, beta alt birimleri tirozin kinaz aktivitesine sahip bir reseptöre bağlanarak hücre içi sinyal iletimini başlatır. ATP’ye duyarlı potasyum kanalları pankreas beta hücrelerinden insülin salgılanmasını düzenler; ancak insülin reseptörü değildir."},"sourcePages":[346,347],"difficulty":"core","sourcePdfPages":[358,359]},{"id":"c25q2","stem":{"en":"If renal function falls substantially, why can metformin exposure rise even without a change in hepatic enzyme activity?","tr":"Renal işlev belirgin azaldığında hepatik enzim aktivitesi değişmese bile metformine maruziyet neden artabilir?"},"options":[{"en":"Renal conversion to an active metabolite is the principal source of its effect","tr":"Aktif metabolite renal dönüşüm, etkisinin başlıca kaynağıdır"},{"en":"Renal impairment increases the hepatic enzymes that activate metformin","tr":"Renal işlev bozukluğu metformini aktive eden hepatik enzimleri artırır"},{"en":"Metformin is eliminated largely as unchanged drug through the kidneys","tr":"Metformin büyük ölçüde değişmeden böbrekler yoluyla elimine edilir"},{"en":"Metformin is normally removed predominantly by biliary secretion","tr":"Metformin normalde ağırlıklı olarak biliyer sekresyonla uzaklaştırılır"},{"en":"Metformin binds irreversibly to insulin receptors when filtration decreases","tr":"Filtrasyon azaldığında metformin insülin reseptörlerine geri dönüşümsüz bağlanır"}],"answer":2,"explanation":{"en":"Metformin undergoes little metabolic transformation and is excreted unchanged through renal filtration and tubular secretion. Reduced renal clearance can prolong its elimination, unlike a drug whose removal depends predominantly on hepatic metabolism.","tr":"Metformin çok az metabolik dönüşüme uğrar ve renal filtrasyon ile tübüler sekresyon yoluyla değişmeden atılır. Renal klirensin azalması eliminasyonunu uzatabilir; bu, vücuttan uzaklaştırılması ağırlıklı olarak hepatik metabolizmaya bağlı bir ilaçtan farklıdır."},"sourcePages":[351],"difficulty":"applied","sourcePdfPages":[363]},{"id":"c25q3","stem":{"en":"Which primary action explains the glucose-lowering effect of SGLT2 inhibitors?","tr":"SGLT2 inhibitörlerinin glukoz düşürücü etkisini hangi temel etki açıklar?"},"options":[{"en":"Reduced glucose reabsorption in the renal proximal tubule","tr":"Renal proksimal tübülde glukoz geri emiliminin azalması"},{"en":"Increased glucose reabsorption in the proximal tubule","tr":"Proksimal tübülde glukoz geri emiliminin artması"},{"en":"Direct stimulation of insulin release from pancreatic beta cells","tr":"Pankreas beta hücrelerinden insülin salınımının doğrudan uyarılması"},{"en":"Inhibition of intestinal alpha-glucosidase","tr":"İntestinal alfa-glukozidazın inhibisyonu"},{"en":"Inhibition of incretin breakdown by DPP-4","tr":"DPP-4 aracılı inkretin yıkımının inhibisyonu"}],"answer":0,"explanation":{"en":"SGLT2 inhibition reduces proximal tubular reclamation of filtered glucose and increases urinary glucose loss. This renal mechanism differs from insulin secretagogues, which primarily stimulate pancreatic insulin release.","tr":"SGLT2 inhibisyonu filtre edilen glukozun proksimal tübülde geri emilimini azaltır ve idrarla glukoz kaybını artırır. Bu renal mekanizma, başlıca pankreastan insülin salınımını uyaran insülin sekretagoglarından farklıdır."},"sourcePages":[352],"difficulty":"core","sourcePdfPages":[364]},{"id":"c25q4","stem":{"en":"Sitagliptin increases concentrations of active endogenous incretin hormones. Which mechanism produces this effect?","tr":"Sitagliptin aktif endojen inkretin hormonlarının konsantrasyonlarını artırır. Bu etkiyi hangi mekanizma oluşturur?"},"options":[{"en":"Direct occupation of the GLP-1 receptor as a peptide agonist","tr":"Bir peptit agonisti olarak GLP-1 reseptörünün doğrudan işgal edilmesi"},{"en":"Inhibition of renal SGLT2 transport","tr":"Renal SGLT2 taşınmasının inhibisyonu"},{"en":"Activation of the nuclear PPAR-gamma receptor","tr":"Nükleer PPAR-gama reseptörünün aktivasyonu"},{"en":"Inhibition of DPP-4-mediated incretin degradation","tr":"DPP-4 aracılı inkretin yıkımının inhibisyonu"},{"en":"Competitive inhibition of intestinal alpha-glucosidase","tr":"İntestinal alfa-glukozidazın kompetitif inhibisyonu"}],"answer":3,"explanation":{"en":"Sitagliptin inhibits DPP-4, slowing breakdown of active incretins such as GLP-1 and GIP. GLP-1 receptor agonists directly stimulate the receptor, whereas a DPP-4 inhibitor preserves the endogenous hormone signal.","tr":"Sitagliptin DPP-4’ü inhibe ederek GLP-1 ve GIP gibi aktif inkretinlerin yıkımını yavaşlatır. GLP-1 reseptör agonistleri reseptörü doğrudan uyarırken bir DPP-4 inhibitörü endojen hormon sinyalini korur."},"sourcePages":[351,352],"difficulty":"applied","sourcePdfPages":[363,364]},{"id":"c25q5","stem":{"en":"Which sequence best describes the pancreatic insulin-secretory action of a sulfonylurea?","tr":"Bir sülfonilürenin pankreastan insülin salgılatıcı etkisini en iyi tanımlayan sıra hangisidir?"},"options":[{"en":"ATP-sensitive potassium channel opening, hyperpolarisation, calcium entry, insulin release","tr":"ATP’ye duyarlı potasyum kanalının açılması, hiperpolarizasyon, kalsiyum girişi, insülin salınımı"},{"en":"ATP-sensitive potassium channel closure, depolarisation, calcium entry, insulin release","tr":"ATP’ye duyarlı potasyum kanalının kapanması, depolarizasyon, kalsiyum girişi, insülin salınımı"},{"en":"Calcium channel blockade, hyperpolarisation, insulin release","tr":"Kalsiyum kanalı blokajı, hiperpolarizasyon, insülin salınımı"},{"en":"DPP-4 activation, incretin destruction, insulin release","tr":"DPP-4 aktivasyonu, inkretinlerin yıkımı, insülin salınımı"},{"en":"SGLT2 activation, urinary glucose loss, insulin release","tr":"SGLT2 aktivasyonu, idrarla glukoz kaybı, insülin salınımı"}],"answer":1,"explanation":{"en":"Sulfonylureas close beta-cell ATP-sensitive potassium channels, depolarising the membrane and promoting calcium-dependent insulin exocytosis. This requires functioning beta cells; it is distinct from increasing insulin sensitivity in peripheral tissues.","tr":"Sülfonilüreler beta hücresindeki ATP’ye duyarlı potasyum kanallarını kapatarak zarı depolarize eder ve kalsiyuma bağımlı insülin ekzositozunu destekler. Bu etki işlevsel beta hücreleri gerektirir; periferik dokularda insülin duyarlılığını artırmaktan farklıdır."},"sourcePages":[346,352],"difficulty":"applied","sourcePdfPages":[358,364]}]},{"id":26,"title":{"en":"Corticosteroids and Other Hormone Preparations","tr":"Kortikosteroidler ve Diğer Hormon Preparatları"},"startPage":355,"endPage":362,"pdfStartPage":367,"pdfEndPage":374,"section":4,"questions":[{"id":"c26q1","stem":{"en":"Which metabolic pattern is most consistent with sustained glucocorticoid excess?","tr":"Uzun süren glukokortikoid fazlalığıyla en uyumlu metabolik tablo hangisidir?"},"options":[{"en":"Reduced gluconeogenesis with increased muscle protein synthesis","tr":"Azalmış glukoneogenez ile artmış kas proteini sentezi"},{"en":"Reduced hepatic glucose output with increased peripheral glucose uptake","tr":"Azalmış hepatik glukoz üretimi ile artmış periferik glukoz alımı"},{"en":"Increased muscle protein synthesis with reduced amino-acid mobilisation","tr":"Artmış kas proteini sentezi ile azalmış amino asit mobilizasyonu"},{"en":"Increased gluconeogenesis with increased protein catabolism","tr":"Artmış glukoneogenez ile artmış protein katabolizması"},{"en":"Reduced glucose availability with increased insulin sensitivity","tr":"Azalmış glukoz kullanılabilirliği ile artmış insülin duyarlılığı"}],"answer":3,"explanation":{"en":"Glucocorticoids favour hepatic glucose production and mobilisation of substrates, including amino acids through protein catabolism. This contrasts with insulin’s predominantly anabolic effects on protein storage and glucose utilisation.","tr":"Glukokortikoidler hepatik glukoz üretimini ve protein katabolizmasıyla amino asitler dahil substratların mobilizasyonunu destekler. Bu durum insülinin protein depolanması ve glukoz kullanımı üzerindeki ağırlıklı anabolik etkileriyle karşıttır."},"sourcePages":[355],"difficulty":"core","sourcePdfPages":[367]},{"id":"c26q2","stem":{"en":"After prolonged systemic glucocorticoid exposure, endogenous cortisol production may remain suppressed. Which feedback mechanism best explains this?","tr":"Uzun süreli sistemik glukokortikoid maruziyetinden sonra endojen kortizol üretimi baskılanmış kalabilir. Bunu en iyi hangi geri bildirim mekanizması açıklar?"},"options":[{"en":"Suppression of hypothalamic CRH and pituitary ACTH signalling","tr":"Hipotalamik CRH ve hipofizer ACTH sinyalinin baskılanması"},{"en":"Continuous stimulation of ACTH release by the exogenous steroid","tr":"Eksojen steroidin ACTH salınımını sürekli uyarması"},{"en":"Direct conversion of circulating cortisol into aldosterone","tr":"Dolaşımdaki kortizolün doğrudan aldosterona dönüştürülmesi"},{"en":"Selective blockade of thyroid-stimulating hormone receptors","tr":"Tiroid uyarıcı hormon reseptörlerinin seçici blokajı"},{"en":"Increased adrenal stimulation by circulating renin alone","tr":"Yalnızca dolaşımdaki renin nedeniyle adrenal uyarının artması"}],"answer":0,"explanation":{"en":"Exogenous glucocorticoids provide negative feedback to the hypothalamic–pituitary–adrenal axis, reducing CRH and ACTH drive. Recovery of endogenous cortisol production may lag behind drug withdrawal; this is different from direct stimulation of the adrenal cortex.","tr":"Eksojen glukokortikoidler hipotalamus-hipofiz-adrenal eksene negatif geri bildirim yaparak CRH ve ACTH uyarısını azaltır. Endojen kortizol üretiminin düzelmesi ilacın kesilmesinden daha geç olabilir; bu mekanizma adrenal korteksin doğrudan uyarılmasından farklıdır."},"sourcePages":[356],"difficulty":"applied","sourcePdfPages":[368]},{"id":"c26q3","stem":{"en":"Which comparison of corticosteroid mineralocorticoid activity is most accurate?","tr":"Kortikosteroidlerin mineralokortikoid aktivitesiyle ilgili hangi karşılaştırma en doğrudur?"},"options":[{"en":"Dexamethasone has substantially greater sodium-retaining activity than hydrocortisone","tr":"Deksametazonun sodyum tutucu aktivitesi hidrokortizondan belirgin olarak fazladır"},{"en":"Anti-inflammatory potency and sodium-retaining activity always rise in exact parallel","tr":"Antiinflamatuvar potens ile sodyum tutucu aktivite her zaman tam paralel artar"},{"en":"All glucocorticoids have identical mineralocorticoid activity","tr":"Tüm glukokortikoidlerin mineralokortikoid aktivitesi aynıdır"},{"en":"Hydrocortisone is a pure aldosterone antagonist","tr":"Hidrokortizon saf bir aldosteron antagonistidir"},{"en":"Hydrocortisone has appreciably more sodium-retaining activity than dexamethasone","tr":"Hidrokortizonun sodyum tutucu aktivitesi deksametazondan belirgin olarak fazladır"}],"answer":4,"explanation":{"en":"Hydrocortisone retains mineralocorticoid activity, whereas dexamethasone has very little sodium-retaining activity despite its strong glucocorticoid effect. Anti-inflammatory potency therefore cannot be used as a direct measure of mineralocorticoid replacement activity.","tr":"Hidrokortizon mineralokortikoid aktiviteye sahiptir; deksametazonun ise güçlü glukokortikoid etkisine rağmen sodyum tutucu aktivitesi çok azdır. Bu nedenle antiinflamatuvar potens, mineralokortikoid yerine koyma aktivitesinin doğrudan ölçüsü olarak kullanılamaz."},"sourcePages":[356,358],"difficulty":"core","sourcePdfPages":[368,370]},{"id":"c26q4","stem":{"en":"Carbimazole begins inhibiting new thyroid hormone synthesis before circulating thyroid hormone concentrations fully decline. Why is the overall response delayed?","tr":"Karbimazol, dolaşımdaki tiroid hormonu konsantrasyonları tam olarak düşmeden önce yeni tiroid hormonu sentezini inhibe etmeye başlar. Genel yanıt neden gecikir?"},"options":[{"en":"Carbimazole must first destroy all thyroid follicular cells","tr":"Karbimazolün önce tüm tiroid folikül hücrelerini yok etmesi gerekir"},{"en":"Its only action is direct blockade of peripheral beta receptors","tr":"Tek etkisi periferik beta reseptörlerinin doğrudan blokajıdır"},{"en":"Previously synthesised thyroid hormone stores remain available for release","tr":"Önceden sentezlenmiş tiroid hormonu depoları salınmak üzere mevcut kalır"},{"en":"It immediately converts all T4 into active T3","tr":"Tüm T4’ü hemen aktif T3’e dönüştürür"},{"en":"It initially stimulates thyroid peroxidase before inhibiting it","tr":"Tiroid peroksidazı inhibe etmeden önce başlangıçta uyarır"}],"answer":2,"explanation":{"en":"Carbimazole is converted to methimazole, which inhibits new thyroid hormone synthesis but does not immediately remove preformed hormone stores. The delay reflects hormone storage and turnover rather than a requirement to destroy the gland.","tr":"Karbimazol yeni tiroid hormonu sentezini inhibe eden metimazole dönüşür; ancak önceden oluşmuş hormon depolarını hemen ortadan kaldırmaz. Gecikme, bezin yok edilmesi gereksiniminden ziyade hormon depolanmasını ve dönüşüm hızını yansıtır."},"sourcePages":[359,360],"difficulty":"applied","sourcePdfPages":[371,372]},{"id":"c26q5","stem":{"en":"Which signalling event most directly links oxytocin receptor activation to uterine smooth-muscle contraction?","tr":"Oksitosin reseptörünün aktivasyonunu uterus düz kasının kasılmasına en doğrudan bağlayan sinyal olayı hangisidir?"},"options":[{"en":"Direct activation of a ligand-gated chloride channel","tr":"Ligand kapılı bir klorür kanalının doğrudan aktivasyonu"},{"en":"G-protein-coupled signalling that increases intracellular calcium availability","tr":"Hücre içi kalsiyum kullanılabilirliğini artıran G proteinine kenetli sinyal iletimi"},{"en":"Irreversible inhibition of thyroid peroxidase","tr":"Tiroid peroksidazın geri dönüşümsüz inhibisyonu"},{"en":"Blockade of the insulin receptor tyrosine kinase","tr":"İnsülin reseptörü tirozin kinazının blokajı"},{"en":"Competitive antagonism of aldosterone in renal tubules","tr":"Renal tübüllerde aldosteronun kompetitif antagonizması"}],"answer":1,"explanation":{"en":"Oxytocin receptors are G-protein-coupled receptors whose activation promotes calcium release from intracellular stores and myometrial contraction. This cell-surface signalling mechanism differs from the intracellular receptor mechanisms of steroid hormones.","tr":"Oksitosin reseptörleri, aktivasyonları hücre içi depolardan kalsiyum salınmasını ve miyometriyal kasılmayı destekleyen G proteinine kenetli reseptörlerdir. Bu hücre yüzeyi sinyal mekanizması, steroid hormonların hücre içi reseptör mekanizmalarından farklıdır."},"sourcePages":[362],"difficulty":"core","sourcePdfPages":[374]}]}],"studyNotice":{"tr":"Eğitim ve tekrar amaçlıdır; hasta yönetimi veya ilaç dozlama rehberi değildir. Klinik kullanımda güncel ürün bilgisi ve yerel protokolleri kontrol edin.","en":"For study and revision; not a patient-management or drug-dosing guide. Check current product information and local protocols for clinical use."}}</script>

  en:{library:'STUDY LIBRARY',chapter:'Chapter',chapters:'chapters',questions:'questions',search:'Search chapters…',all:'All parts',review:'Review my mistakes',overall:'Overall progress',local:'Your progress stays in this browser.',edition:'5TH EDITION · 2021',answered:'answered',corrected:'corrected',reset:'Reset chapter',question:'QUESTION',core:'CORE CONCEPT',applied:'APPLICATION',hint:'Choose the single best answer.',doneHint:'Answer saved. Explore the explanation below.',correct:'That’s correct!',incorrect:'Not quite. Let’s work through it.',correctAnswer:'Correct answer',explanation:'Explanation',source:'Source',pages:'Book pp.',pdf:'PDF pp.',previous:'← Previous',next:'Next →',nextChapter:'Next chapter →',backChapter:'Back to chapter →',finished:'Chapter complete',finishedText:(n,total)=>`You answered ${n} of ${total} questions correctly. You can revisit the explanations at any time.`,reviewFinished:'Review round complete',reviewFinishedText:(n,total)=>`${n} of the ${total} questions in this round are now correct. Revisit any question whenever you like.`,education:'For study and revision; not a patient-management or drug-dosing guide. Check current product information and local protocols for clinical use.',noChapters:'No chapters match your search.',noMistakes:'A clean review list.',noMistakesText:'Questions you miss will appear here. Pick a chapter to begin studying.',start:'Back to chapters',retry:'Try this question again',reviewTitle:'Learn from your mistakes',reviewSubtitle:'A little review. A stronger foundation.',reviewSection:'REVIEW SESSION',reviewKicker:'Your personal review list',allDone:'All chapters complete',allDoneText:(n)=>`You have answered all 130 questions, with ${n} correct. Review your mistakes or reset a chapter to practise again.`,restart:'Back to the first chapter →',infoTitle:'About your study space',resetAll:'Delete all my progress',resetConfirm:'Your 5 answers in this chapter will be deleted. Continue?',resetAllConfirm:'All answers and study progress saved in this browser will be deleted. Continue?',storage:'Your browser is not allowing local storage. Progress is kept for this session but may be lost when you close the page.',loadError:'The questions could not be loaded.',loadErrorText:'The file may be incomplete or damaged. Reopen the verified HTML file.',reload:'Reload',openMenu:'Open chapters',closeMenu:'Close chapters',info:'Source and study information',filter:'Filter by part',options:'Answer choices',questionSelect:'Question navigation',chosen:'Your answer',right:'Correct answer',wrong:'Incorrect answer',unanswered:'Not answered',reviewReset:'Back to chapter',printPage:'Printed book page',access:'Personal study space',citation:'Peck & Harris · Pharmacology for Anaesthesia and Intensive Care · 5th edition (2021)'}
 };
 let state = {lang:'tr',chapter:1,index:0,answers:{}};
 let storageAvailable = true;
 try { const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null'); if(saved && typeof saved === 'object') state = {...state,...saved,answers:saved.answers&&typeof saved.answers==='object'?saved.answers:{}}; } catch {storageAvailable=false;}
 if(!['tr','en','both'].includes(state.lang))state.lang='tr';
 let data, questionsById, chapterById, sectionById;
 let mode='chapter', reviewIds=[], index=0;
 const lang = () => state.lang==='en'?'en':'tr';
 const t = key => words[lang()][key];
 const text = pair => pair[lang()];
 const isBoth = () => state.lang==='both';
 function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}catch{storageAvailable=false;}renderStorage();}
 function renderStorage(){ $('storageNotice').hidden=storageAvailable; $('storageNotice').textContent=t('storage'); }
 function answerOf(q){const a=state.answers[q.id];return Number.isInteger(a)&&a>=0&&a<q.options.length?a:null;}
 function isAnswered(q){return answerOf(q)!==null;}
 function isCorrect(q){return answerOf(q)===q.answer;}
 const allQuestions=()=>data.chapters.flatMap(c=>c.questions);
 const wrongQuestions=()=>allQuestions().filter(q=>isAnswered(q)&&!isCorrect(q));
 function activeList(){return mode==='review'?reviewIds.map(id=>questionsById.get(id)).filter(Boolean):chapterById.get(state.chapter).questions;}
 function currentQuestion(){return activeList()[index];}
 function currentChapter(){return chapterById.get(currentQuestion()?.chapterId || state.chapter);}
 function scrollTop(){window.scrollTo({top:0,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'});}
 function closeMenu(){ $('sidebar').classList.remove('open');$('backdrop').classList.remove('open');$('menuButton').setAttribute('aria-expanded','false');$('menuButton').setAttribute('aria-label',t('openMenu'));document.body.style.overflow='';if(window.innerWidth<=760){$('sidebar').inert=true;}}
 function openMenu(){ $('sidebar').inert=false;$('sidebar').classList.add('open');$('backdrop').classList.add('open');$('menuButton').setAttribute('aria-expanded','true');$('menuButton').setAttribute('aria-label',t('closeMenu'));document.body.style.overflow='hidden';$('search').focus();}
 function chooseChapter(id,at=null){if(!chapterById.has(Number(id)))return;state.chapter=Number(id);mode='chapter';const c=chapterById.get(state.chapter);index=at===null?Math.max(0,c.questions.findIndex(q=>!isAnswered(q))):Math.max(0,Math.min(4,at));state.index=index;save();render();closeMenu();scrollTop();history.replaceState(null,'',`#chapter-${state.chapter}`);}
 function renderLabels(){document.documentElement.lang=lang();document.title=lang()==='tr'?'Pharmacology Studio · Farmakoloji Çalışma':'Pharmacology Studio · Study Companion';$('libraryLabel').textContent=t('library');$('chapterLabel').textContent=`26 ${t('chapters')}`;$('totalQuestionLabel').textContent=`130 ${t('questions')}`;$('search').placeholder=t('search');$('search').setAttribute('aria-label',t('search'));$('sectionFilter').setAttribute('aria-label',t('filter'));$('reviewLabel').textContent=t('review');$('overallLabel').textContent=t('overall');$('localNote').textContent=t('local');$('editionLabel').textContent=t('edition');$('answeredLabel').textContent=t('answered');$('educationNote').textContent=t('education');$('infoButton').setAttribute('aria-label',t('info'));$('questionNav').setAttribute('aria-label',t('questionSelect'));$('options').setAttribute('aria-label',t('options'));document.querySelectorAll('[data-lang]').forEach(b=>{const active=b.dataset.lang===state.lang;b.classList.toggle('active',active);b.setAttribute('aria-pressed',String(active));});const selected=$('sectionFilter').value||'all';$('sectionFilter').innerHTML=`<option value="all">${esc(t('all'))}</option>`+data.sections.map(s=>`<option value="${s.id}">${esc(text(s.title))}</option>`).join('');$('sectionFilter').value=selected;renderStorage();}
 function renderSidebar(){
  const query=$('search').value.toLocaleLowerCase('tr').trim();const selected=$('sectionFilter').value;

  let prevSection=null;let html='';
  for(const c of matches){if(c.section!==prevSection){html+=`<div class="list-section">${esc(text(sectionById.get(c.section).title))}</div>`;prevSection=c.section;}
   const done=c.questions.filter(isAnswered).length;html+=`<button class="chapter-button ${c.id===state.chapter&&mode==='chapter'?'active':''}" data-chapter="${c.id}" ${c.id===state.chapter&&mode==='chapter'?'aria-current="page"':''} aria-label="${esc(t('chapter')+' '+c.id+': '+text(c.title)+', '+done+'/5 '+t('answered'))}"><span class="chapter-index">${String(c.id).padStart(2,'0')}</span><span class="chapter-name">${esc(text(c.title))}<span class="chapter-progress" aria-hidden="true">${c.questions.map(q=>`<span class="chapter-dot ${isAnswered(q)?isCorrect(q)?'correct':'wrong':''}"></span>`).join('')}</span></span>${done===5?'<span class="chapter-check" aria-hidden="true">✓</span>':''}</button>`;
  }
  $('chapterList').innerHTML=html||`<p class="no-chapters">${esc(t('noChapters'))}</p>`;
  $('chapterList').querySelectorAll('[data-chapter]').forEach(b=>b.onclick=()=>chooseChapter(b.dataset.chapter));
  const answered=allQuestions().filter(isAnswered).length;$('overallCount').textContent=`${answered} / 130`;$('overallBar').style.width=`${answered/130*100}%`;$('reviewCount').textContent=wrongQuestions().length;$('reviewButton').classList.toggle('active',mode==='review');
 }
 function bilingualHTML(pair,translationClass='option-translation'){return esc(text(pair))+(isBoth()?`<span class="${translationClass}" lang="en">${esc(pair.en)}</span>`:'');}
 function optionOrder(q){let seed=2166136261;for(const c of q.id)seed=Math.imul(seed^c.charCodeAt(0),16777619)>>>0;const order=[0,1,2,3,4];for(let i=4;i>0;i--){seed=(Math.imul(seed,1664525)+1013904223)>>>0;const j=seed%(i+1);[order[i],order[j]]=[order[j],order[i]];}return order;}
 function sourceLabel(pages,offset=0){return [...new Set(pages)].sort((a,b)=>a-b).map(p=>p+offset).join(', ');}
 function renderQuestion(){
  const list=activeList();if(!list.length){renderEmpty();return;}$('emptyView').hidden=true;$('studyView').hidden=false;
  index=Math.max(0,Math.min(index,list.length-1));const q=list[index],c=chapterById.get(q.chapterId),a=answerOf(q),answered=a!==null,correct=isCorrect(q);const done=mode==='review'?list.filter(isCorrect).length:list.filter(isAnswered).length;$('answeredLabel').textContent=t(mode==='review'?'corrected':'answered');
  $('sectionName').textContent=mode==='review'?t('reviewSection'):text(sectionById.get(c.section).title);$('chapterKicker').textContent=mode==='review'?t('reviewKicker'):`${t('chapter')} ${String(c.id).padStart(2,'0')} / 26`;$('chapterTitle').textContent=mode==='review'?t('reviewTitle'):text(c.title);$('chapterSubtitle').textContent=mode==='review'?t('reviewSubtitle'):isBoth()?c.title.en:'';$('chapterSubtitle').lang=isBoth()?'en':lang();$('chapterScore').innerHTML=`${done}<span>/${list.length}</span>`;
  $('resetChapter').textContent=mode==='review'?t('reviewReset'):t('reset');

  const displayOrder=optionOrder(q);
  $('options').innerHTML=displayOrder.map((i,displayIndex)=>{const o=q.options[i];let cls='',status='';if(answered){if(i===q.answer){cls='correct-option';status='✓';}else if(i===a){cls='wrong-option';status='×';}else cls='unselected';}return `<button class="option ${cls}" data-answer="${i}" ${answered?'disabled':''} aria-label="${esc(String.fromCharCode(65+displayIndex)+'. '+text(o)+(isBoth()?'. '+o.en:'')+(answered&&i===a?'. '+t('chosen'):'')+(answered&&i===q.answer?'. '+t('right'):''))}"><span class="option-letter" aria-hidden="true">${String.fromCharCode(65+displayIndex)}</span><span class="option-copy">${bilingualHTML(o)}</span><span class="option-status" aria-hidden="true">${status}</span></button>`;}).join('');
  $('options').querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>selectAnswer(Number(b.dataset.answer)));
  $('feedback').hidden=!answered;
  if(answered){$('feedback').className=`feedback${correct?'':' incorrect'}`;$('feedback').innerHTML=`<div class="feedback-heading"><span aria-hidden="true">${correct?'✓':'↗'}</span>${esc(t(correct?'correct':'incorrect'))}</div><p class="correct-answer">${esc(t('correctAnswer'))}: ${String.fromCharCode(65+displayOrder.indexOf(q.answer))}. ${bilingualHTML(q.options[q.answer])}</p><p>${esc(text(q.explanation))}</p>${isBoth()?`<p class="explanation-translation" lang="en">${esc(q.explanation.en)}</p>`:''}<div class="feedback-source"><span>${esc(t('source'))} · ${esc(t('chapter'))} ${c.id} · ${esc(t('pages'))} ${sourceLabel(q.sourcePages)}</span>${(q.sourcePdfPages || Number.isInteger(data.book.pdfPageOffset)) ? `<span>${esc(t('pdf'))} ${sourceLabel(q.sourcePdfPages || q.sourcePages, q.sourcePdfPages ? 0 : data.book.pdfPageOffset)}</span>` : ''}</div>${mode==='review'&&!correct?`<button id="retryQuestion" class="text-button">${esc(t('retry'))}</button>`:''}`;
   if($('retryQuestion'))$('retryQuestion').onclick=()=>{delete state.answers[q.id];save();render();};
  }else{$('feedback').innerHTML='';}
  const allDone=done===list.length;$('completion').hidden=!allDone;
  if(allDone){const n=list.filter(isCorrect).length;$('completion').innerHTML=`<div class="completion-icon" aria-hidden="true">✓</div><div><h3>${esc(t(mode==='review'?'reviewFinished':'finished'))}</h3><p>${esc(t(mode==='review'?'reviewFinishedText':'finishedText')(n,list.length))}</p></div>`;}
  $('prevQuestion').textContent=t('previous');$('prevQuestion').disabled=index===0;$('questionPosition').textContent=`${index+1} / ${list.length}`;
  $('nextQuestion').textContent=index<list.length-1?t('next'):mode==='review'?t('backChapter'):c.id<26?t('nextChapter'):t('restart');
  $('sourceLine').innerHTML=`<span class="footer-source-title">${esc(t('citation'))}</span><br>${esc(t('chapter'))} ${c.id} · ${esc(t('pages'))} ${c.startPage}–${c.endPage}`;
 }
 function renderEmpty(){ $('studyView').hidden=true;$('emptyView').hidden=false;$('emptyView').innerHTML=`<div class="empty-icon" aria-hidden="true">✓</div><h1>${esc(t('noMistakes'))}</h1><p>${esc(t('noMistakesText'))}</p><button id="backToStudy" class="primary-button">${esc(t('start'))}</button>`;$('backToStudy').onclick=()=>chooseChapter(state.chapter); }
 function render(){renderLabels();renderSidebar();renderQuestion();renderInfo();}
 function selectAnswer(selected){const q=currentQuestion();if(!q||isAnswered(q))return;state.answers[q.id]=selected;save();render();$('feedback').tabIndex=-1;$('feedback').focus({preventScroll:true});$('feedback').scrollIntoView({block:'nearest',behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'});}
 function navigate(i){index=i;if(mode==='chapter'){state.index=index;save();}renderQuestion();scrollTop();$('questionStem').tabIndex=-1;$('questionStem').focus({preventScroll:true});}
 function startReview(){mode='review';reviewIds=wrongQuestions().map(q=>q.id);index=0;render();closeMenu();scrollTop();history.replaceState(null,'','#review');}
 function renderInfo(){
  $('infoTitle').textContent=t('infoTitle');$('resetAll').textContent=t('resetAll');
  const tr=`<p>26 bölümün her biri için 5 soru: toplam 130 Türkçe ve İngilizce çoktan seçmeli soru. TR+EN ile iki dili birlikte görebilirsin.</p><p><strong>Kaynak:</strong> <em>Pharmacology for Anaesthesia and Intensive Care</em>, 5. baskı. Sayfa atıfları basılı kitaba aittir. Sorular yayınevinin resmî soru bankası değildir.</p><ul><li>Yanıt seçtiğinde doğru cevap ve açıklama hemen altında açılır.</li><li>Bu dosya internet, sunucu veya giriş gerektirmez.</li><li>Farmakoloji ilerlemen fizyolojiden ayrı olarak yalnızca bu tarayıcıda saklanır. Tarayıcı verilerini temizlemek kayıtları siler. Dosyayı taşımak veya farklı tarayıcı kullanmak farklı bir kayıt alanı açabilir.</li><li>Yanlışlarımı tekrar et bölümünde bir soruyu yeniden çözebilirsin.</li><li>Eğitim ve tekrar amaçlıdır; hasta yönetimi veya ilaç dozlama rehberi değildir. Klinik kullanımda güncel ürün bilgisi ve yerel protokolleri kontrol edin.</li></ul>`;
  const en=`<p>Five questions for each of 26 chapters: 130 multiple-choice questions in Turkish and English. Select TR+EN to see both languages.</p><p><strong>Source:</strong> <em>Pharmacology for Anaesthesia and Intensive Care</em>, 5th edition. References use printed book pages. This is not an official publisher question bank.</p><ul><li>Select an answer to reveal the correct answer and explanation.</li><li>This file requires no internet, server, or sign-in.</li><li>Pharmacology progress is stored separately from physiology, only in this browser. Clearing browser data deletes it. Moving the file or using another browser may open a different storage area.</li><li>Use Review my mistakes to retry missed questions.</li><li>For study and revision; not a patient-management or drug-dosing guide. Check current product information and local protocols for clinical use.</li></ul>`;
  $('infoContent').innerHTML=lang()==='en'?en:tr;
 }
 function validateQuestionBank(bank){
  const pair=x=>x && ['tr','en'].every(k=>typeof x[k]==='string'&&x[k].trim());
  const positive=x=>Number.isInteger(x)&&x>0;
  if(!bank.book||bank.book.edition!==5||bank.book.title!=='Pharmacology for Anaesthesia and Intensive Care'||!Array.isArray(bank.sections)||!Array.isArray(bank.chapters)||bank.chapters.length!==26)throw new Error('Invalid question bank');
  const sections=new Set(); for(const section of bank.sections){if(!positive(section.id)||sections.has(section.id)||!pair(section.title))throw new Error('Invalid section');sections.add(section.id);}
  const ids=new Set(); bank.chapters.forEach((chapter,i)=>{
   if(chapter.id!==i+1||!pair(chapter.title)||!sections.has(chapter.section)||!positive(chapter.startPage)||!positive(chapter.endPage)||chapter.endPage<chapter.startPage||!Array.isArray(chapter.questions)||chapter.questions.length!==5)throw new Error('Invalid chapter');
   for(const q of chapter.questions){if(typeof q.id!=='string'||!/^[a-zA-Z0-9_-]+$/.test(q.id)||ids.has(q.id)||!pair(q.stem)||!pair(q.explanation)||!Array.isArray(q.options)||q.options.length!==5||!q.options.every(pair)||!Number.isInteger(q.answer)||q.answer<0||q.answer>4||!Array.isArray(q.sourcePages)||!q.sourcePages.length||!q.sourcePages.every(positive)||!['core','applied'].includes(q.difficulty))throw new Error('Invalid question');ids.add(q.id);}
  });
 }
 async function init(){
  try{const embedded=document.getElementById('questionData');if(!embedded)throw new Error('Embedded question data unavailable');data=JSON.parse(embedded.textContent);
   validateQuestionBank(data);
   chapterById=new Map(data.chapters.map(c=>[c.id,c]));sectionById=new Map(data.sections.map(s=>[s.id,s]));questionsById=new Map();data.chapters.forEach(c=>c.questions.forEach(q=>{q.chapterId=c.id;questionsById.set(q.id,q);}));
   if(!chapterById.has(Number(state.chapter)))state.chapter=1;state.chapter=Number(state.chapter);index=Number.isInteger(state.index)?Math.max(0,Math.min(4,state.index)):0;
   const hash=location.hash.match(/^#chapter-(\d+)$/);if(hash&&chapterById.has(Number(hash[1]))){if(state.chapter!==Number(hash[1]))index=0;state.chapter=Number(hash[1]);}
   if(location.hash==='#review'){mode='review';reviewIds=wrongQuestions().map(q=>q.id);index=0;}
   for(const id of Object.keys(state.answers)){if(!questionsById.has(id)||!Number.isInteger(state.answers[id])||state.answers[id]<0||state.answers[id]>4)delete state.answers[id];}
   $('loading').hidden=true;render();
   document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{state.lang=b.dataset.lang;save();render();});
   $('search').oninput=renderSidebar;$('sectionFilter').onchange=renderSidebar;$('reviewButton').onclick=startReview;
   $('prevQuestion').onclick=()=>{if(index>0)navigate(index-1);};
   $('nextQuestion').onclick=()=>{const list=activeList();if(index<list.length-1)navigate(index+1);else if(mode==='review')chooseChapter(currentChapter()?.id||state.chapter);else chooseChapter(state.chapter<26?state.chapter+1:1,0);};
   $('resetChapter').onclick=()=>{if(mode==='review'){chooseChapter(currentChapter()?.id||state.chapter);return;}if(confirm(t('resetConfirm'))){chapterById.get(state.chapter).questions.forEach(q=>delete state.answers[q.id]);index=0;state.index=0;save();render();}};
   $('resetAll').onclick=()=>{if(confirm(t('resetAllConfirm'))){state.answers={};state.chapter=1;state.index=0;index=0;mode='chapter';save();$('infoDialog').close();render();closeMenu();scrollTop();history.replaceState(null,'','#chapter-1');}};
   $('brand').onclick=e=>{e.preventDefault();chooseChapter(state.chapter);};
   $('menuButton').onclick=()=>{$('sidebar').classList.contains('open')?closeMenu():openMenu();};$('backdrop').onclick=closeMenu;
   document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenu();if(e.key==='Tab'&&$('sidebar').classList.contains('open')){const nodes=[...$('sidebar').querySelectorAll('button,input,select,a')].filter(n=>!n.disabled);const first=nodes[0],last=nodes[nodes.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
   window.addEventListener('resize',()=>{if(window.innerWidth>760){$('sidebar').inert=false;closeMenu();}else if(!$('sidebar').classList.contains('open'))$('sidebar').inert=true;});
   $('infoButton').onclick=()=>{$('infoDialog').showModal();};$('closeInfo').onclick=()=>$('infoDialog').close();$('infoDialog').onclick=e=>{if(e.target===$('infoDialog')){const r=$('infoDialog').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)$('infoDialog').close();}};
   if(window.innerWidth<=760)$('sidebar').inert=true;save();
  }catch(error){$('loading').hidden=true;$('emptyView').hidden=false;$('emptyView').innerHTML=`<h1>${esc(t('loadError'))}</h1><p>${esc(t('loadErrorText'))}</p><button class="primary-button" id="reloadButton">${esc(t('reload'))}</button>`;$('reloadButton').onclick=()=>location.reload();console.error(error);}
 }
 init();
})();

</script>
